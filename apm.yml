name: short
version: 1.0.0
description: APM configuration for shared agent skills.
targets:
  - copilot
dependencies:
  apm:
    - path: ./src/private/lib/scan-restoration
    - git: https://github.com/dotnet/skills.git
      path: plugins/dotnet-advanced
      ref: main
    - git: https://github.com/dotnet/skills.git
      path: plugins/dotnet-ai
      ref: main
    - git: https://github.com/dotnet/skills.git
      path: plugins/dotnet-data
      ref: main
    - git: https://github.com/dotnet/skills.git
      path: plugins/dotnet-diag
      ref: main
    - git: https://github.com/dotnet/skills.git
      path: plugins/dotnet-msbuild
      ref: main
    - git: https://github.com/dotnet/skills.git
      path: plugins/dotnet-nuget
      ref: main
    - git: https://github.com/dotnet/skills.git
      path: plugins/dotnet-test-migration
      ref: main
    - git: https://github.com/dotnet/skills.git
      path: plugins/dotnet-test
      ref: main
    - git: https://github.com/dotnet/skills.git
      path: plugins/dotnet-upgrade
      ref: main
    - git: https://github.com/dotnet/skills.git
      path: plugins/dotnet
      ref: main
    - git: https://github.com/mattpocock/skills.git
      path: skills/productivity/grill-me
      ref: v1.1.0
    - git: https://github.com/microsoftdocs/mcp.git
      path: skills/microsoft-docs
      ref: main
    - git: https://github.com/microsoftdocs/mcp.git
      path: skills/microsoft-code-reference
      ref: main
    - git: https://github.com/microsoft/win-dev-skills.git
      path: plugins/winui
      ref: v0.5.0
    - alibaba/open-code-review/plugins/open-code-review/skills/open-code-review-delegate#v1.8.8
  mcp:
    - name: io.github.upstash/context7
      registry: false
      transport: stdio
      command: mise
      args:
        - exec
        - --
        - pnpm
        - dlx
        - '@upstash/context7-mcp@3.2.5'
      env:
        CONTEXT7_API_KEY: '${input:CONTEXT7_API_KEY}'
    - name: microsoft-learn
      registry: false
      transport: http
      url: https://learn.microsoft.com/api/mcp
    - name: binlog
      registry: false
      transport: stdio
      command: mise
      args:
        - exec
        - --
        - dotnet
        - dnx
        - Microsoft.AITools.BinlogMcp
        - --yes
  lsp:
    - name: csharp
      command: mise
      args:
        - exec
        - --
        - dotnet
        - tool
        - run
        - csharp-ls
      extensionToLanguage:
        .cs: csharp
includes: auto
scripts: {}
