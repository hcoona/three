api-version: three.release/v1alpha1
kind: project

project:
  id: qidian-novel-downloader
  display-name: Qidian Novel Downloader
  ecosystem: dotnet
  release-kind: app

source:
  primary-manifest: QidianNovelDownloader.csproj

variants:
  - id: win-x64
    dimensions:
      os: windows
      rid: win-x64
    artifacts:
      - id: app-binary-win-x64
        role: primary-binary
        kind-family: binary
        concrete-kind: executable
  - id: linux-x64
    dimensions:
      os: linux
      rid: linux-x64
    artifacts:
      - id: app-binary-linux-x64
        role: primary-binary
        kind-family: binary
        concrete-kind: executable
        companions:
          - path: playwright.ps1
            role: runtime-helper
            required: true
  - id: osx-x64
    dimensions:
      os: macos
      rid: osx-x64
    artifacts:
      - id: app-binary-osx-x64
        role: primary-binary
        kind-family: binary
        concrete-kind: executable
        companions:
          - path: playwright.ps1
            role: runtime-helper
            required: true

profiles:
  buddy:
    targets:
      - uses: github-release/public
        artifacts:
          - app-binary-win-x64
          - app-binary-linux-x64
          - app-binary-osx-x64
  official:
    targets:
      - uses: github-release/public
        artifacts:
          - app-binary-win-x64
          - app-binary-linux-x64
          - app-binary-osx-x64
