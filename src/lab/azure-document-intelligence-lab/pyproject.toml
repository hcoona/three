[build-system]
requires = ["hatchling>=1.24", "nbgv-python"]
build-backend = "hatchling.build"

[project]
name = "azure-document-intelligence-lab"
description = "Azure Document Intelligence Lab"
authors = [{ name = "Shuai Zhang", email = "zhangshuai.ustc@gmail.com" }]
dependencies = [
  "aiofiles>=24.1.0",
  "aiohttp>=3.12.14",
  "azure-ai-documentintelligence>=1.0.2",
  "azure-identity>=1.23.1",
  "msgpack>=1.1.1",
  "pillow>=11.2.1",
  "pypdfium2>=4.30.0",
]
readme = "README.md"
requires-python = ">= 3.12"
license = "GPL-3.0-or-later"
classifiers = ["Private :: Do Not Upload"]
dynamic = ["version"]

[dependency-groups]
dev = ["ipykernel>=6.29.5", "python-dotenv>=1.0.0"]

[tool.hatch.version]
source = "nbgv"

[tool.hatch.version.nbgv.write]
file = "src/azure_document_intelligence_lab/_version.py"
template = '''"""Auto-generated by nbgv-python using Hatch."""

__version__ = "{normalized_version}"
'''

[tool.hatch.build]
artifacts = ["src/azure_document_intelligence_lab/_version.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/azure_document_intelligence_lab"]
