api-version: three.release/v1alpha1
kind: project

project:
  id: hcoona-release-smoke-npm-dual
  display-name: hcoona-release-smoke-npm-dual
  ecosystem: node
  release-kind: lib

source:
  primary-manifest: package.json
  auxiliary-inputs:
    - scripts/build.mjs
    - scripts/nbgv-version.mjs
    - src/index.js

variants:
  - id: package
    dimensions: {}
    artifacts:
      - id: npm-package
        role: primary-package
        kind-family: package
        concrete-kind: npm-package
        projection:
          package-name: hcoona-release-smoke-npm-dual
      - id: npm-package-github
        role: primary-package
        kind-family: package
        concrete-kind: npm-package
        projection:
          package-name: '@hcoona/hcoona-release-smoke-npm-dual'

profiles:
  buddy:
    targets:
      - uses: github-release/public
        artifacts: [npm-package-github]
      - uses: npm/github-packages
        artifacts: [npm-package-github]
  official:
    targets:
      - uses: github-release/public
        artifacts: [npm-package]
      - uses: npm/npmjs
        artifacts: [npm-package]
