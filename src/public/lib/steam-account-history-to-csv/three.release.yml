api-version: three.release/v1alpha1
kind: project

project:
  id: steam-account-history-to-csv
  display-name: Steam Account History to CSV
  ecosystem: node
  release-kind: extension

source:
  primary-manifest: package.json
  auxiliary-inputs:
    - src/entrypoints/account-history.content.ts
    - wxt.config.ts

variants:
  - id: chrome
    dimensions:
      browser: chrome
    artifacts:
      - id: chrome
        role: primary-package
        kind-family: package
        concrete-kind: browser-zip
  - id: firefox
    dimensions:
      browser: firefox
    artifacts:
      - id: firefox
        role: primary-package
        kind-family: package
        concrete-kind: browser-zip
      - id: firefox-sources
        role: sources
        kind-family: archive
        concrete-kind: sources-zip
        produced-from: [firefox]
  - id: edge
    dimensions:
      browser: edge
    artifacts:
      - id: edge
        role: primary-package
        kind-family: package
        concrete-kind: browser-zip

profiles:
  buddy:
    targets:
      - uses: github-release/public
        artifacts: [chrome, firefox, firefox-sources, edge]
  official:
    targets:
      - uses: github-release/public
        artifacts: [chrome, firefox, firefox-sources, edge]
