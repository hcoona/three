[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "three-workflow-release-publish"
version = "0.1.0"
description = "Publish executors for Three workflow releases."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Shuai Zhang", email = "zhangshuai.ustc@gmail.com" }]
license = "LGPL-3.0-or-later WITH LGPL-3.0-linking-exception"
keywords = ["release", "workflow", "publish"]
dependencies = ["packaging>=24.0", "three-workflow-release-contracts"]

[dependency-groups]
dev = ["pytest>=8.3.4"]

[project.scripts]
three-workflow-release-publish = "three_workflow_release_publish.cli:main"
