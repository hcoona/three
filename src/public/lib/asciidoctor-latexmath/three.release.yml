api-version: three.release/v1alpha1
kind: project

project:
  id: asciidoctor-latexmath
  display-name: asciidoctor-latexmath
  ecosystem: ruby
  release-kind: lib

source:
  primary-manifest: asciidoctor-latexmath.gemspec
  auxiliary-inputs:
    - lib/asciidoctor/latexmath/version.rb

variants:
  - id: package
    dimensions: {}
    artifacts:
      - id: gem
        role: primary-package
        kind-family: package
        concrete-kind: rubygem

profiles:
  buddy:
    targets:
      - uses: github-release/public
        artifacts: [gem]
      - uses: rubygems/github-packages
        artifacts: [gem]
  official:
    targets:
      - uses: github-release/public
        artifacts: [gem]
      - uses: rubygems/rubygems-org
        artifacts: [gem]
