schema: workflow-delivery/v3/release-unit
release-unit: asciidoctor-latexmath
builds:
  - id: ruby-gem
    definition: ruby/gem-v1
    entry-point: asciidoctor-latexmath.gemspec
    outputs:
      - id: gem
        role: primary-package
        kind: ruby-gem
    qualification:
      require: asciidoctor-latexmath
      nbgv-env: true
      locked-bundle: true
      rspec: true
      dependencies:
        - asciidoctor@>= 2.0, < 3.0
      probe: >-
        Asciidoctor::Latexmath::VERSION == ARGV.fetch(0) &&
        Asciidoctor::Latexmath.respond_to?(:register)
