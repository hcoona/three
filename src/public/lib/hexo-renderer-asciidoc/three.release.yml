api-version: three.release/v1alpha1
kind: project

project:
  id: hexo-renderer-asciidoc
  display-name: hexo-renderer-asciidoc
  ecosystem: node
  release-kind: lib

source:
  primary-manifest: package.json
  auxiliary-inputs:
    - CHANGELOG.md
    - LICENSE
    - README.npm.md
    - scripts/nbgv-version.mjs
    - scripts/npm-readme.cjs
    - scripts/sync-licenses.mjs
    - tsdown.config.ts

variants:
  - id: package
    dimensions: {}
    artifacts:
      - id: npm-package
        role: primary-package
        kind-family: package
        concrete-kind: npm-package

profiles:
  buddy:
    targets:
      - uses: github-release/public
        artifacts: [npm-package]
  official:
    targets:
      - uses: github-release/public
        artifacts: [npm-package]
