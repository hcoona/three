api-version: three.release/v1alpha1
kind: project

project:
  id: hcoona-release-smoke-inno
  display-name: hcoona-release-smoke-inno
  ecosystem: dotnet
  release-kind: app

source:
  primary-manifest: hcoona-release-smoke-inno.csproj
  auxiliary-inputs:
    - script/Publish.ps1
    - script/Build-InnoInstaller.ps1
    - script/Setup.iss

variants:
  - id: win-x64
    dimensions:
      os: windows
      rid: win-x64
    artifacts:
      - id: installer
        role: installer
        kind-family: installer
        concrete-kind: inno-setup

profiles:
  buddy:
    targets:
      - uses: github-release/public
        artifacts: [installer]
  official:
    targets:
      - uses: github-release/public
        artifacts: [installer]
