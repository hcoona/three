[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "three-workflow-release-proof"
version = "0.1.0"
description = "Proof wrappers and replay classifiers for Three workflow releases."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Shuai Zhang", email = "zhangshuai.ustc@gmail.com" }]
license = "LGPL-3.0-or-later WITH LGPL-3.0-linking-exception"
keywords = ["release", "workflow", "proof"]
dependencies = ["three-workflow-release-contracts"]

[dependency-groups]
dev = ["pytest>=8.3.4"]

[project.scripts]
three-workflow-release-proof = "three_workflow_release_proof.cli:main"

[tool.ruff.lint]
extend-ignore = ["C901", "EM101", "EM102", "PLR0911", "PLR0912", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
