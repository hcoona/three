[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "three-workflow-release-authoring"
version = "0.1.0"
description = "Authoring validation for Three workflow release descriptors."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Shuai Zhang", email = "zhangshuai.ustc@gmail.com" }]
license = "LGPL-3.0-or-later WITH LGPL-3.0-linking-exception"
keywords = ["release", "workflow", "authoring"]
dependencies = ["PyYAML>=6.0.2", "three-workflow-release-contracts"]

[dependency-groups]
dev = ["pytest>=8.3.4"]

[project.scripts]
three-workflow-release-authoring = "three_workflow_release_authoring.cli:main"
