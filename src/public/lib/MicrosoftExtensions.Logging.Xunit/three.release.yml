api-version: three.release/v1alpha1
kind: project

project:
  id: microsoft-extensions-logging-xunit
  display-name: MicrosoftExtensions.Logging.Xunit
  ecosystem: dotnet
  release-kind: lib

source:
  primary-manifest: MicrosoftExtensions.Logging.Xunit.csproj

variants:
  - id: package
    dimensions: {}
    artifacts:
      - id: nuget
        role: primary-package
        kind-family: package
        concrete-kind: nuget
      - id: snupkg
        role: symbols
        kind-family: package
        concrete-kind: snupkg

profiles:
  buddy:
    targets:
      - uses: github-release/public
        artifacts: [nuget, snupkg]
  official:
    targets:
      - uses: github-release/public
        artifacts: [nuget, snupkg]
