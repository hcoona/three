api-version: three.release/v1alpha1
kind: project

project:
  id: hcoona-release-smoke-rubygems
  display-name: hcoona-release-smoke-rubygems
  ecosystem: ruby
  release-kind: lib

source:
  primary-manifest: hcoona-release-smoke-rubygems.gemspec
  auxiliary-inputs:
    - lib/hcoona/release_smoke/rubygems/version.rb

variants:
  - id: package
    dimensions: {}
    artifacts:
      - id: gem
        role: primary-package
        kind-family: package
        concrete-kind: rubygem

profiles:
  buddy:
    targets:
      - uses: github-release/public
        artifacts: [gem]
  official:
    targets:
      - uses: github-release/public
        artifacts: [gem]
      - uses: rubygems/rubygems-org
        artifacts: [gem]
