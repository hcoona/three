[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/three_workflow_delivery_v3/release/**"]

[project]
name = "three-workflow-delivery-v3"
version = "0.1.0"
description = "Workflow Delivery v3 control primitives."
requires-python = ">=3.13"
authors = [{ name = "Shuai Zhang", email = "zhangshuai.ustc@gmail.com" }]
license = "LGPL-3.0-or-later WITH LGPL-3.0-linking-exception"
dependencies = ["PyYAML>=6.0.2", "rfc8785>=0.1.4"]

[dependency-groups]
dev = ["pytest>=8.3.4"]

[project.scripts]
three-workflow-delivery-v3 = "three_workflow_delivery_v3.cli:main"
