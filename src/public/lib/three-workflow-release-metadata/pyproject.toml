[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "three-workflow-release-metadata"
version = "0.1.0"
description = "Metadata helpers for Three workflow releases."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Shuai Zhang", email = "zhangshuai.ustc@gmail.com" }]
license = "LGPL-3.0-or-later WITH LGPL-3.0-linking-exception"
keywords = ["release", "workflow", "metadata"]
dependencies = ["three-workflow-release-contracts"]

[dependency-groups]
dev = ["pytest>=8.3.4"]

[project.scripts]
three-workflow-release-metadata = "three_workflow_release_metadata.cli:main"
