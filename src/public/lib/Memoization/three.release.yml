api-version: three.release/v1alpha1
kind: project

project:
  id: memoization
  display-name: Memoization
  ecosystem: dotnet
  release-kind: lib

source:
  primary-manifest: Memoization.csproj

variants:
  - id: package
    dimensions: {}
    artifacts:
      - id: nuget
        role: primary-package
        kind-family: package
        concrete-kind: nuget
      - id: snupkg
        role: symbols
        kind-family: package
        concrete-kind: snupkg

profiles:
  buddy:
    targets:
      - uses: github-release/public
        artifacts: [nuget, snupkg]
      - uses: nuget/github-packages
        artifacts: [nuget, snupkg]
  official:
    targets:
      - uses: github-release/public
        artifacts: [nuget, snupkg]
      - uses: nuget/nuget-org
        artifacts: [nuget, snupkg]
