schema: workflow-delivery/v3/release-unit
release-unit: memoization
builds:
  - id: nuget-package
    definition: dotnet/nuget-package-v1
    entry-point: Memoization.csproj
    outputs:
      - id: nuget-package
        role: primary-package
        kind: nuget-package
    qualification:
      probe: >-
        new System.Func<System.Func<int, int>, System.Func<int, int>>(Memoization.Memoization.Create<int, int>).Method.DeclaringType!.Assembly.GetName().Name
