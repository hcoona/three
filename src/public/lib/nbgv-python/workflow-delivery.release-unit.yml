schema: workflow-delivery/v3/release-unit
release-unit: nbgv-python
builds:
  - id: python-distributions
    definition: python/distribution-set-v1
    entry-point: pyproject.toml
    outputs:
      - id: wheel
        role: primary-package
        kind: python-wheel
      - id: sdist
        role: source-package
        kind: python-sdist
    qualification:
      static-version: true
      runtime-closure: true
      dependencies:
        - packaging>=24.0
      tests: src/public/lib/nbgv-python/tests
      api:
        - get_version
        - forward
        - NbgvRunner
        - GitVersion
