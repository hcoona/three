api-version: three.release/v1alpha1
kind: project

project:
  id: phi-failure-detector-console
  display-name: PhiFailureDetector.Console
  ecosystem: dotnet
  release-kind: app

source:
  primary-manifest: PhiFailureDetector.ConsoleApp.csproj

variants:
  - id: win-x64
    dimensions:
      os: windows
      rid: win-x64
    artifacts:
      - id: app-binary-win-x64
        role: primary-binary
        kind-family: binary
        concrete-kind: executable
  - id: linux-x64
    dimensions:
      os: linux
      rid: linux-x64
    artifacts:
      - id: app-binary-linux-x64
        role: primary-binary
        kind-family: binary
        concrete-kind: executable
  - id: osx-x64
    dimensions:
      os: macos
      rid: osx-x64
    artifacts:
      - id: app-binary-osx-x64
        role: primary-binary
        kind-family: binary
        concrete-kind: executable

profiles:
  buddy:
    targets:
      - uses: github-release/public
        artifacts:
          - app-binary-win-x64
          - app-binary-linux-x64
          - app-binary-osx-x64
  official:
    targets:
      - uses: github-release/public
        artifacts:
          - app-binary-win-x64
          - app-binary-linux-x64
          - app-binary-osx-x64
