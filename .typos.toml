[files]
extend-exclude = [
  '.agents/**',
  '.github/agents/**',
  '.github/lsp.json',
  '.github/mcp.json',
  '.vscode/mcp.json',
  '.testagent/status.md',
  'apm.lock.yaml',
  '**/apm.lock.yaml',
  'packages.lock.json',
  "src/private/app/OxfordWordlistExtractor/*.html",
  "src/public/lib/Hjg.Pngcs/FilterType.cs",
  "src/public/lib/Hjg.Pngcs/FilterWriteStrategy.cs",
  "src/public/lib/Hjg.Pngcs/ImageInfo.cs",
  "src/public/lib/Hjg.Pngcs/ImageLine.cs",
  "src/public/lib/Hjg.Pngcs/ImageLineHelper.cs",
  "src/public/lib/Hjg.Pngcs/PngDeinterlacer.cs",
  "src/public/lib/Hjg.Pngcs/PngHelperInternal.cs",
  "src/public/lib/Hjg.Pngcs/PngReader.cs",
  "src/public/lib/Hjg.Pngcs/PngWriter.cs",
  "src/public/lib/Hjg.Pngcs/Chunks/ChunkHelper.cs",
  "src/public/lib/Hjg.Pngcs/Chunks/ChunkLoadBehaviour.cs",
  "src/public/lib/Hjg.Pngcs/Chunks/ChunkRaw.cs",
  "src/public/lib/Hjg.Pngcs/Chunks/ChunksList.cs",
  "src/public/lib/Hjg.Pngcs/Chunks/ChunksListForWrite.cs",
  "src/public/lib/Hjg.Pngcs/Chunks/PngChunk.cs",
  "src/public/lib/Hjg.Pngcs/Chunks/PngChunkBKGD.cs",
  "src/public/lib/Hjg.Pngcs/Chunks/PngChunkCHRM.cs",
  "src/public/lib/Hjg.Pngcs/Chunks/PngChunkHIST.cs",
  "src/public/lib/Hjg.Pngcs/Chunks/PngChunkITXT.cs",
  "src/public/lib/Hjg.Pngcs/Chunks/PngChunkPLTE.cs",
  "src/public/lib/Hjg.Pngcs/Chunks/PngChunkSPLT.cs",
  "src/public/lib/Hjg.Pngcs/Chunks/PngChunkSkipped.cs",
  "src/public/lib/Hjg.Pngcs/Chunks/PngChunkTRNS.cs",
  "src/public/lib/Hjg.Pngcs/Chunks/PngChunkZTXT.cs",
  "src/public/lib/Hjg.Pngcs/Chunks/PngMetadata.cs",
  "src/public/lib/Hjg.Pngcs/Zlib/AZlibOutputStream.cs",
  "src/public/lib/Hjg.Pngcs/Zlib/ZlibStreamFactory.cs",
  "src/private/app/supermemo-mcp/references/Gdip_All.ahk",
  "tests/private/app/OxfordDictExtractor.Tests/**/*.html",
  "**/generated/**/*",
]

[default]
locale = "en"
extend-ignore-re = [
  '\b[0-9a-f]{7,10}\b',
  '\b[0-9A-Fa-f]{32,}\b',                                                      # HEX (MD5, SHA256, etc.)
  '(?i)\{?[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}\}?',
  '(?:^|[^A-Za-z0-9+/=])[A-Za-z0-9+/]{40,}={0,2}(?:$|[^A-Za-z0-9+/=])',        # Base64
  '(?:^|[^A-Za-z0-9_=-])[A-Za-z0-9_-]{40,}={0,2}(?:$|[^A-Za-z0-9_=-])',        # Base64URL
  '\bCC-BY-NC-ND-4.0\b',
  '\bPNGs?\b',
  '\b(?:admittedTerm|deprecatedTerm|preferredTerm|supersededTerm)-admn-sts\b',
]

[default.extend-words]
Fo = 'Fo'                   # ISO 32000 additional-action dictionary key
hexo = 'hexo'
Asciidoc = 'Asciidoc'
Asciidoctor = 'Asciidoctor'
sme = 'sme'

[type.gitignore]
extend-glob = ['.gitignore']
extend-ignore-re = ['(?m)^\s*[^#\r\n].*$']
extend-words = { Paket = 'Paket' }

[type.TestZlib]
extend-glob = ["TestZlib.cs"]
extend-words = { ist = 'ist' }

[type."account-history.content.ts"]
extend-glob = ["account-history.content.ts"]
extend-ignore-re = ["const PAYMENT_CLASS = 'wth_payment';"]
