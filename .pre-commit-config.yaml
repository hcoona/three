default_stages:
- pre-commit
fail_fast: false
minimum_pre_commit_version: 3.0.0
repos:
- repo: local
  hooks:
  - id: typos
    name: Typos
    entry: python eng/scripts/hk_exec.py typos -c .typos.toml --force-exclude --
    language: system
    pass_filenames: true
    exclude: (\.pre-commit-config\.yaml|.*/packages\.lock\.json|global\.json|project\.assets\.json|package-lock\.json|PklProject\.deps\.json|pnpm-lock\.yaml|.*/pnpm-lock\.yaml|uv\.lock|\.mise\.lock|.*/\.github/.*|.*/\.specify/.*|.*/specs/.*/[^/]*\.md|.*/generated/.*|\.agents/.*|\.vscode/mcp\.json|apm\.lock\.yaml|.*/apm\.lock\.yaml)
  - id: editorconfig-check
    name: Editorconfig Check
    entry: python eng/scripts/hk_exec.py editorconfig-checker --disable-indent-size --
    language: system
    pass_filenames: true
    exclude: (\.pre-commit-config\.yaml|.*/packages\.lock\.json|global\.json|project\.assets\.json|package-lock\.json|PklProject\.deps\.json|pnpm-lock\.yaml|.*/pnpm-lock\.yaml|uv\.lock|\.mise\.lock|.*/\.github/.*|.*/\.specify/.*|.*/specs/.*/[^/]*\.md|.*/generated/.*|\.agents/.*|\.vscode/mcp\.json|apm\.lock\.yaml|.*/apm\.lock\.yaml)
  - id: actionlint
    name: Actionlint
    entry: python eng/scripts/hk_actionlint.py
    language: system
    pass_filenames: true
    files: (?:.*/)*\.github/workflows/[^/]*\.yml$|(?:.*/)*\.github/workflows/[^/]*\.yaml$
  - id: markdownlint-cli2
    name: Markdownlint Cli2
    entry: python eng/scripts/hk_exec.py pnpm exec -- markdownlint-cli2 --
    language: system
    pass_filenames: true
    files: '[^/]*\.md$'
    exclude: (\.pre-commit-config\.yaml|.*/packages\.lock\.json|global\.json|project\.assets\.json|package-lock\.json|PklProject\.deps\.json|pnpm-lock\.yaml|.*/pnpm-lock\.yaml|uv\.lock|\.mise\.lock|.*/\.github/.*|.*/\.specify/.*|.*/specs/.*/[^/]*\.md|.*/generated/.*|\.agents/.*|\.vscode/mcp\.json|apm\.lock\.yaml|.*/apm\.lock\.yaml)
  - id: markdown-prettier
    name: Markdown Prettier
    entry: python eng/scripts/hk_exec.py pnpm exec -- prettier --check --
    language: system
    pass_filenames: true
    files: '[^/]*\.md$'
    exclude: (\.pre-commit-config\.yaml|.*/packages\.lock\.json|global\.json|project\.assets\.json|package-lock\.json|PklProject\.deps\.json|pnpm-lock\.yaml|.*/pnpm-lock\.yaml|uv\.lock|\.mise\.lock|.*/\.github/.*|.*/\.specify/.*|.*/specs/.*/[^/]*\.md|.*/generated/.*|\.agents/.*|\.vscode/mcp\.json|apm\.lock\.yaml|.*/apm\.lock\.yaml)
  - id: pkl-eval
    name: Pkl Eval
    entry: python eng/scripts/hk_pkl_eval.py
    language: system
    pass_filenames: true
    files: '[^/]*\.pkl$'
  - id: pkl-format
    name: Pkl Format
    entry: python eng/scripts/hk_exec.py pkl format --silent --
    language: system
    pass_filenames: true
    files: '[^/]*\.pkl$'
  - id: json-biome
    name: Json Biome
    entry: python eng/scripts/hk_exec.py pnpm exec -- biome check --no-errors-on-unmatched --
    language: system
    pass_filenames: true
    files: '[^/]*\.json$|[^/]*\.jsonc$'
    exclude: (\.pre-commit-config\.yaml|.*/packages\.lock\.json|global\.json|project\.assets\.json|package-lock\.json|PklProject\.deps\.json|pnpm-lock\.yaml|.*/pnpm-lock\.yaml|uv\.lock|\.mise\.lock|.*/\.github/.*|.*/\.specify/.*|.*/specs/.*/[^/]*\.md|.*/generated/.*|\.agents/.*|\.vscode/mcp\.json|apm\.lock\.yaml|.*/apm\.lock\.yaml)
  - id: yaml-prettier
    name: Yaml Prettier
    entry: python eng/scripts/hk_exec.py pnpm exec -- prettier --check --
    language: system
    pass_filenames: true
    files: '[^/]*\.yml$|[^/]*\.yaml$'
    exclude: (\.pre-commit-config\.yaml|.*/packages\.lock\.json|global\.json|project\.assets\.json|package-lock\.json|PklProject\.deps\.json|pnpm-lock\.yaml|.*/pnpm-lock\.yaml|uv\.lock|\.mise\.lock|.*/\.github/.*|.*/\.specify/.*|.*/specs/.*/[^/]*\.md|.*/generated/.*|\.agents/.*|\.vscode/mcp\.json|apm\.lock\.yaml|.*/apm\.lock\.yaml)
  - id: toml-taplo-check
    name: Toml Taplo Check
    entry: python eng/scripts/hk_exec.py pnpm exec -- taplo check --
    language: system
    pass_filenames: true
    files: (?:.*/)*[^/]*\.toml$
    exclude: (\.pre-commit-config\.yaml|.*/packages\.lock\.json|global\.json|project\.assets\.json|package-lock\.json|PklProject\.deps\.json|pnpm-lock\.yaml|.*/pnpm-lock\.yaml|uv\.lock|\.mise\.lock|.*/\.github/.*|.*/\.specify/.*|.*/specs/.*/[^/]*\.md|.*/generated/.*|\.agents/.*|\.vscode/mcp\.json|apm\.lock\.yaml|.*/apm\.lock\.yaml)
  - id: toml-taplo-format
    name: Toml Taplo Format
    entry: python eng/scripts/hk_exec.py pnpm exec -- taplo format --check --
    language: system
    pass_filenames: true
    files: (?:.*/)*[^/]*\.toml$
    exclude: (\.pre-commit-config\.yaml|.*/packages\.lock\.json|global\.json|project\.assets\.json|package-lock\.json|PklProject\.deps\.json|pnpm-lock\.yaml|.*/pnpm-lock\.yaml|uv\.lock|\.mise\.lock|.*/\.github/.*|.*/\.specify/.*|.*/specs/.*/[^/]*\.md|.*/generated/.*|\.agents/.*|\.vscode/mcp\.json|apm\.lock\.yaml|.*/apm\.lock\.yaml)
  - id: hadolint
    name: Hadolint
    entry: python eng/scripts/hk_exec.py hadolint --
    language: system
    pass_filenames: true
    files: Dockerfile$|[^/]*\.Dockerfile$|Dockerfile\.[^/]*$
    exclude: (\.pre-commit-config\.yaml|.*/packages\.lock\.json|global\.json|project\.assets\.json|package-lock\.json|PklProject\.deps\.json|pnpm-lock\.yaml|.*/pnpm-lock\.yaml|uv\.lock|\.mise\.lock|.*/\.github/.*|.*/\.specify/.*|.*/specs/.*/[^/]*\.md|.*/generated/.*|\.agents/.*|\.vscode/mcp\.json|apm\.lock\.yaml|.*/apm\.lock\.yaml)
  - id: shellcheck
    name: Shellcheck
    entry: python eng/scripts/hk_exec.py shellcheck --
    language: system
    pass_filenames: true
    files: (?:.*/)*[^/]*\.sh$|(?:.*/)*[^/]*\.bash$
    exclude: (\.pre-commit-config\.yaml|.*/packages\.lock\.json|global\.json|project\.assets\.json|package-lock\.json|PklProject\.deps\.json|pnpm-lock\.yaml|.*/pnpm-lock\.yaml|uv\.lock|\.mise\.lock|.*/\.github/.*|.*/\.specify/.*|.*/specs/.*/[^/]*\.md|.*/generated/.*|\.agents/.*|\.vscode/mcp\.json|apm\.lock\.yaml|.*/apm\.lock\.yaml)
  - id: shfmt
    name: Shfmt
    entry: python eng/scripts/hk_exec.py shfmt -d --apply-ignore --
    language: system
    pass_filenames: true
    files: (?:.*/)*[^/]*\.sh$|(?:.*/)*[^/]*\.bash$|(?:.*/)*[^/]*\.mksh$|(?:.*/)*[^/]*\.bats$|(?:.*/)*[^/]*\.zsh$
    exclude: (\.pre-commit-config\.yaml|.*/packages\.lock\.json|global\.json|project\.assets\.json|package-lock\.json|PklProject\.deps\.json|pnpm-lock\.yaml|.*/pnpm-lock\.yaml|uv\.lock|\.mise\.lock|.*/\.github/.*|.*/\.specify/.*|.*/specs/.*/[^/]*\.md|.*/generated/.*|\.agents/.*|\.vscode/mcp\.json|apm\.lock\.yaml|.*/apm\.lock\.yaml)
  - id: pwsh-formatter
    name: Pwsh Formatter
    entry: python eng/scripts/hk_exec.py pwsh -NoLogo -NoProfile -NonInteractive -File eng/pre-commit/Invoke-FormatterWrapper.ps1 -Mode Check -Path --
    language: system
    pass_filenames: true
    files: '[^/]*\.ps1$|[^/]*\.psm1$|[^/]*\.psd1$'
    exclude: (\.pre-commit-config\.yaml|.*/packages\.lock\.json|global\.json|project\.assets\.json|package-lock\.json|PklProject\.deps\.json|pnpm-lock\.yaml|.*/pnpm-lock\.yaml|uv\.lock|\.mise\.lock|.*/\.github/.*|.*/\.specify/.*|.*/specs/.*/[^/]*\.md|.*/generated/.*|\.agents/.*|\.vscode/mcp\.json|apm\.lock\.yaml|.*/apm\.lock\.yaml)
  - id: pwsh-script-analyzer
    name: Pwsh Script Analyzer
    entry: python eng/scripts/hk_exec.py pwsh -NoLogo -NoProfile -NonInteractive -File eng/pre-commit/Invoke-ScriptAnalyzerWrapper.ps1 -Mode Check -Path --
    language: system
    pass_filenames: true
    files: '[^/]*\.ps1$|[^/]*\.psm1$|[^/]*\.psd1$'
    exclude: (\.pre-commit-config\.yaml|.*/packages\.lock\.json|global\.json|project\.assets\.json|package-lock\.json|PklProject\.deps\.json|pnpm-lock\.yaml|.*/pnpm-lock\.yaml|uv\.lock|\.mise\.lock|.*/\.github/.*|.*/\.specify/.*|.*/specs/.*/[^/]*\.md|.*/generated/.*|\.agents/.*|\.vscode/mcp\.json|apm\.lock\.yaml|.*/apm\.lock\.yaml)
  - id: biome
    name: Biome
    entry: python eng/scripts/hk_exec.py pnpm exec -- biome check --no-errors-on-unmatched --
    language: system
    pass_filenames: true
    files: '[^/]*\.js$|[^/]*\.cjs$|[^/]*\.mjs$|[^/]*\.jsx$|[^/]*\.ts$|[^/]*\.cts$|[^/]*\.mts$|[^/]*\.tsx$'
    exclude: (\.pre-commit-config\.yaml|.*/packages\.lock\.json|global\.json|project\.assets\.json|package-lock\.json|PklProject\.deps\.json|pnpm-lock\.yaml|.*/pnpm-lock\.yaml|uv\.lock|\.mise\.lock|.*/\.github/.*|.*/\.specify/.*|.*/specs/.*/[^/]*\.md|.*/generated/.*|\.agents/.*|\.vscode/mcp\.json|apm\.lock\.yaml|.*/apm\.lock\.yaml)
  - id: ruff
    name: Ruff
    entry: python eng/scripts/hk_exec.py uv run ruff check --force-exclude --
    language: system
    pass_filenames: true
    files: '[^/]*\.py$|[^/]*\.pyi$|[^/]*\.ipynb$'
    exclude: (\.pre-commit-config\.yaml|.*/packages\.lock\.json|global\.json|project\.assets\.json|package-lock\.json|PklProject\.deps\.json|pnpm-lock\.yaml|.*/pnpm-lock\.yaml|uv\.lock|\.mise\.lock|.*/\.github/.*|.*/\.specify/.*|.*/specs/.*/[^/]*\.md|.*/generated/.*|\.agents/.*|\.vscode/mcp\.json|apm\.lock\.yaml|.*/apm\.lock\.yaml)
  - id: ruff_format
    name: Ruff_format
    entry: python eng/scripts/hk_exec.py uv run ruff format --quiet --force-exclude --check --
    language: system
    pass_filenames: true
    files: '[^/]*\.py$|[^/]*\.pyi$|[^/]*\.ipynb$'
    exclude: (\.pre-commit-config\.yaml|.*/packages\.lock\.json|global\.json|project\.assets\.json|package-lock\.json|PklProject\.deps\.json|pnpm-lock\.yaml|.*/pnpm-lock\.yaml|uv\.lock|\.mise\.lock|.*/\.github/.*|.*/\.specify/.*|.*/specs/.*/[^/]*\.md|.*/generated/.*|\.agents/.*|\.vscode/mcp\.json|apm\.lock\.yaml|.*/apm\.lock\.yaml)
  - id: uv-lock
    name: Uv Lock
    entry: uv lock --check
    language: system
    pass_filenames: true
    files: (?:.*/)*pyproject\.toml$|uv\.lock$
  - id: workflow-release-control-tests
    name: Workflow Release Control Tests
    entry: python eng/scripts/hk_exec.py uv run python eng/scripts/workflow_release_acceptance_gate.py
    language: system
    pass_filenames: false
    files: \.github/CODEOWNERS$|\.github/actionlint\.yaml$|\.github/workflows/[^/]*\.yml$|\.github/workflows/[^/]*\.yaml$|\.github/workflows/docs/DESIGN\.v2\.md$|docs/wiki/analyses/workflow-release-[^/]*\.md$|eng/release/.*$|eng/scripts/find_project_path\.py$|eng/scripts/prepare_npm_publish\.py$|eng/scripts/validate_pep440_version\.py$|eng/scripts/validate_semver2_version\.py$|eng/scripts/validate_rubygems_version\.py$|eng/scripts/release_orchestrate_[^/]*\.sh$|eng/scripts/publish_[^/]*_idempotent\.sh$|eng/scripts/validate_pypi_remote_digests\.sh$|eng/scripts/verify_python_distribution_exactness\.py$|eng/scripts/verify_python_artifact_version\.py$|eng/scripts/workflow_release_control\.py$|eng/scripts/workflow_release_acceptance_gate\.py$|src/(?:.*/)*three\.release\.yml$|src/public/lib/three-workflow-release-[^/]*/.*$|tests/test_workflow_release_control\.py$|tests/test_verify_python_distribution_exactness\.py$|tests/fixtures/workflow-release-acceptance-matrix\.json$|tests/fixtures/workflow-release-ci-validation-acceptance-matrix\.json$
  - id: dotenv-linter
    name: Dotenv Linter
    entry: python eng/scripts/hk_exec.py dotenv-linter check --
    language: system
    pass_filenames: true
    files: \.env$|[^/]*\.env$|\.env\.[^/]*$|(?:.*/)*\.env$|(?:.*/)*[^/]*\.env$|(?:.*/)*\.env\.[^/]*$
  - id: global-json
    name: Global Json
    entry: pwsh -NoLogo -NoProfile -File eng/pre-commit/Test-PklEvalSync.ps1 -Source global.pkl -Target global.json -Format json
    language: system
    pass_filenames: false
    files: global\.pkl$|global\.json$|mise\.lock$
  - id: pre-commit-config
    name: Pre Commit Config
    entry: pwsh -NoLogo -NoProfile -File eng/pre-commit/Test-PklEvalSync.ps1 -Source .pre-commit-config.pkl -Target .pre-commit-config.yaml -Format yaml
    language: system
    pass_filenames: false
    files: \.pre-commit-config\.pkl$|\.pre-commit-config\.yaml$|hk\.pkl$|src/private/hk/(?:.*/)*[^/]*\.pkl$|PklProject$|PklProject\.deps\.json$
  - id: commitlint
    name: Commitlint
    entry: pnpm exec -- commitlint --strict --edit
    language: system
    pass_filenames: false
    stages:
    - commit-msg
