# Repository record responsibilities and their explicit project/path bindings.
# Derived from hcoona/microsoft-authentication-cli at 1a02498589769c38bc16eefc2efc5f9eca6e6994.
# Source copyright and MIT notice: docs/governance/reference-license.txt.
schema_version: 3
families:
  - id: public-landing
    concern: Repository identity, provenance and public navigation
    producer: Repository owner
    maintainer: Repository owner
    consumers:
      - Readers locating repository layout, project interfaces, existing setup guidance, and imported-source provenance
    creation_trigger: The repository is presented as a distinct public project.
    failure_mode: Readers cannot locate current identity, purpose, scope, or release authorities.
    review_point: Pull requests that change public navigation or required notices
  - id: human-record-portal
    concern: Human navigation to canonical project records
    producer: Record-system maintainer
    maintainer: Repository owner
    consumers:
      - Contributors locating the authority for a concern
    creation_trigger: Canonical concerns span more than the public landing page.
    failure_mode: Contributors rely on stale or duplicate records.
    review_point: Pull requests that add, move, or remove canonical records
  - id: agent-interface
    concern: AI-agent repository behavior and stop conditions
    producer: Repository owner
    maintainer: Repository owner
    consumers:
      - AI agents before repository work
    creation_trigger: AI agents are permitted to act on the repository.
    failure_mode: Agents infer authority, expose sensitive data, or expand scope.
    review_point: Pull requests that change agent-relevant policy or workflow
  - id: contributor-interface
    concern: Human contribution workflow
    producer: Repository owner
    maintainer: Repository owner
    consumers:
      - Human contributors preparing changes
    creation_trigger: The repository accepts reviewable contributions.
    failure_mode: Contributions bypass required records, checks, or review.
    review_point: Pull requests that change contribution workflow
  - id: pull-request-interface
    concern: Non-authoritative pull-request prompts for scope, evidence, and record impact
    producer: Record-system maintainer
    maintainer: Repository owner
    consumers:
      - Contributors preparing a pull request
    creation_trigger: Pull requests need consistent prompts for existing governance obligations.
    failure_mode: Review begins without the scope, evidence, or record impact needed by current policies.
    review_point: Pull requests that change contribution or review workflow
  - id: delivery-wave
    concern: Current bounded positive work authorization across the repository
    producer: Repository owner
    maintainer: Repository owner
    consumers:
      - Contributors and agents before executing work or accepting a prerequisite-dependent change
      - Repository owner and reviewers when adding, changing, deleting, or replacing authorized advancements
    creation_trigger: Current work must be explicitly selected without allowing an Issue, Milestone, branch, or pull
      request to authorize itself.
    failure_mode:
      Work begins without a current bounded grant, or progress and historical status become a second authorization
      ledger.
    review_point: Every pull request that adds, changes, deletes, or replaces a Delivery Wave entry
  - id: record-family-catalog
    concern: Active and scheduled record-family routing
    producer: Record-system maintainer
    maintainer: Repository owner
    consumers:
      - Record authors and reviewers locating record namespaces and coverage gaps
    creation_trigger: Record families require consistent paths and review procedures.
    failure_mode: Records become orphaned or receive the wrong checks and reviews.
    review_point: Pull requests that add, retire, or change a record family
  - id: control-catalog
    concern: Controls that implement declared policies and invariants
    producer: Control maintainer
    maintainer: Repository owner
    consumers:
      - Control authors and reviewers comparing policy with actual execution
    creation_trigger: More than one control class must be routed consistently.
    failure_mode: Controls drift from policy or execute at the wrong gate.
    review_point: Pull requests that add, retire, or change a control
  - id: structured-record-schemas
    concern: Machine contracts for structured repository records
    producer: Structured-record maintainer
    maintainer: Repository owner
    consumers:
      - Catalog authors and reviewers validating the two catalogs locally
    creation_trigger: A structured record needs deterministic validation.
    failure_mode: Structured records become ambiguous or silently incompatible with consumers.
    review_point: Pull requests that add or change a structured record
  - id: governance-policy
    concern: Repository rules for maintaining rules
    producer: Repository owner and record authors
    maintainer: Repository owner
    consumers:
      - Rule authors and reviewers evaluating the replacement
    creation_trigger: The named consumers need the retained concern at its review or use point.
    failure_mode: Controls or interfaces silently redefine policy.
    review_point: Changes to this concern, its policy, or its consumers
  - id: record-policy
    concern: Authority, admission, lifecycle, namespaces, and record gate
    producer: Repository owner and record authors
    maintainer: Repository owner
    consumers:
      - Record authors and reviewers evaluating the replacement
    creation_trigger: The named consumers need the retained concern at its review or use point.
    failure_mode: Project records become duplicate repository authorities.
    review_point: Changes to this concern, its policy, or its consumers
  - id: checker-contract
    concern: Record validation inputs, coverage, references and execution boundaries
    producer: Repository owner and record authors
    maintainer: Repository owner
    consumers:
      - Control maintainers and reviewers checking completeness and activation claims
    creation_trigger: The named consumers need the retained concern at its review or use point.
    failure_mode: Source checker assumptions are installed without Three validation.
    review_point: Changes to this concern, its policy, or its consumers
  - id: docs-agent-interface
    concern: Agent routing for repository documentation
    producer: Repository owner and record authors
    maintainer: Repository owner
    consumers:
      - Agents working in repository docs
    creation_trigger: The named consumers need the retained concern at its review or use point.
    failure_mode: Agents follow retired documentation instructions or cannot locate current record authorities.
    review_point: Changes to this concern, its policy, or its consumers
  - id: reference-license
    concern: Required source copyright and license notice
    producer: Repository owner and record authors
    maintainer: Repository owner
    consumers:
      - Readers and maintainers of source-derived governance material
    creation_trigger: The named consumers need the retained concern at its review or use point.
    failure_mode: Source-derived material loses required attribution.
    review_point: Changes to this concern, its policy, or its consumers
  - id: engineering-guidance-source
    concern: Agent routing from engineering decisions to shared principles and project authorities
    producer: Repository owner and engineering authors
    maintainer: Repository owner
    consumers:
      - Agents making or reviewing design, security and test/evidence strategy decisions
    creation_trigger: Shared principles need an agent entry point at the relevant project decision.
    failure_mode: Agents miss shared principles or apply them without the owning project's accepted context.
    review_point: Changes to shared principles, this interface, or its project routing
  - id: test-migration-guidance-source
    concern: Canonical guidance preserving test semantics during framework migration
    producer: Repository engineering authors
    maintainer: Repository owner
    consumers:
      - Agents migrating existing xUnit tests to MSTest
    creation_trigger: Installed migration guidance requires corrections unavailable in the pinned upstream source.
    failure_mode: Migration changes collection scheduling or turns diagnostics into failing timeouts.
    review_point: Changes to migration semantics, upstream source, or generated deployment
  - id: review-procedures
    concern: Canonical independent review procedures
    producer: Repository owner and record authors
    maintainer: Repository owner
    consumers:
      - Independent evaluators reading the procedure by path
    creation_trigger: The named consumers need the retained concern at its review or use point.
    failure_mode: A generated or unavailable interface is mistaken for the review authority.
    review_point: Changes to this concern, its policy, or its consumers
  - id: review-evaluations
    concern: Bounded evaluation cases for independent review procedures
    producer: Repository owner and record authors
    maintainer: Repository owner
    consumers:
      - Maintainers and independent reviewers evaluating procedure behavior
    creation_trigger: The named consumers need the retained concern at its review or use point.
    failure_mode: A procedure change silently weakens authority, finding triage, or evidence limits.
    review_point: Changes to this concern, its policy, or its consumers
  - id: project-record-portals
    concern: Project-local concern records and portal routing
    producer: Repository owner and record authors
    maintainer: Repository owner
    consumers:
      - Project authors, implementers, and domain reviewers following each record and its consumers
    creation_trigger: The named consumers need the retained concern at its review or use point.
    failure_mode: Relocation loses project authority, stable identifiers, or current evidence.
    review_point: Changes to this concern, its policy, or its consumers
  - id: nbgv-python-package-interface
    concern: Library usage and package-reader interface
    producer: Project maintainers
    maintainer: Repository owner
    consumers:
      - Package readers using the existing packaged README
      - Contributors locating project architecture and the separate sample
    creation_trigger: The named consumers need the retained concern at its review or use point.
    failure_mode: Package readers lose the existing usage interface or follow stale internal record paths.
    review_point: Changes to this interface or its owning project records
  - id: nbgv-python-changelog
    concern: Published library change history and release-note input
    producer: Project maintainers
    maintainer: Repository owner
    consumers:
      - Package users comparing released versions
      - Existing release-resolve and release-prepare-release-notes workflows reading CHANGELOG.md
    creation_trigger: The named consumers need the retained concern at its review or use point.
    failure_mode: Release-note consumers lose version identifiers, anchors, or their expected source path.
    review_point: Changes to this interface or its owning project records
  - id: nbgv-hatch-demo-interface
    concern: Separate sample usage and its library dependency
    producer: Project maintainers
    maintainer: Repository owner
    consumers:
      - Sample users running the documented recipe and consulting the library authority
    creation_trigger: The named consumers need the retained concern at its review or use point.
    failure_mode: Sample limitations or usage are confused with library product promises.
    review_point: Changes to this interface or its owning project records
  - id: three-workflow-delivery-v3-interface
    concern: Entry point for the v3 engineering concern
    producer: Project maintainers
    maintainer: Repository owner
    consumers:
      - V3 contributors locating normative records and the independent smoke-package purpose
    creation_trigger: The named consumers need the retained concern at its review or use point.
    failure_mode: Readers infer scope from package topology or cannot locate domain authority.
    review_point: Changes to this interface or its owning project records
  - id: three-workflow-delivery-v3-nuget-helper-interface
    concern: Routing from the NuGet authority helper to its v3 engineering owner
    producer: Project maintainers
    maintainer: Repository owner
    consumers:
      - Helper maintainers locating the owning v3 authority and applicable admission and authorization boundaries
    creation_trigger: The named consumers need the retained concern at its review or use point.
    failure_mode: The helper becomes a competing project or implies authorized NuGet release implementation.
    review_point: Changes to this interface or its owning project records
  - id: three-workflow-delivery-v3-dotnet-helper-interface
    concern: Native .NET helper usage and routing to its v3 engineering owner
    producer: Project maintainers
    maintainer: Repository owner
    consumers:
      - Helper maintainers invoking the prebuilt native reader and locating Provider, frozen Build and admission contracts
    creation_trigger: The native helper needs a callable interface and an owning domain authority.
    failure_mode: Readers confuse package inspection with publishing or treat local mechanism evidence as native admission.
    review_point: Changes to this helper interface or its owning project records
  - id: three-workflow-delivery-v3-nuget-consumer-interface
    concern: Native NuGet restore-host usage and routing to its v3 engineering owner
    producer: Project maintainers
    maintainer: Repository owner
    consumers:
      - Restore-host maintainers and callers locating the prebuilt entry, tooling admission and bounded read contract
    creation_trigger: The native restore companion needs a callable interface and an owning domain authority.
    failure_mode: Callers lose the tooling and credential boundaries or mistake local restore evidence for native
      authorization.
    review_point: Changes to this companion interface or its owning consumer and admission contracts
  - id: hcoona-release-smoke-github-packages-interface
    concern: Independent NuGet smoke-library purpose and marker API
    producer: Project maintainers
    maintainer: Repository owner
    consumers:
      - Smoke-library users and v3 reviewers confirming the marker behavior and absence of production compatibility
        obligations
    creation_trigger: The selected smoke library needs its own minimal product interface.
    failure_mode: Package topology substitutes for a stated product purpose or creates an implied production support
      commitment.
    review_point: Changes to the smoke-library purpose or API
  - id: hcoona-release-smoke-npm-package-interface
    concern: Independent smoke-package purpose and frozen package-reader interface
    producer: Project maintainers
    maintainer: Repository owner
    consumers:
      - Package readers and v3 reviewers confirming the separate smoke-product purpose
      - Existing frozen npm artifact qualification consuming the packaged README bytes
    creation_trigger: The named consumers need the retained concern at its review or use point.
    failure_mode: Documentation routing changes alter the frozen package artifact or mix proving authority into its
      product purpose.
    review_point: Changes to this interface or its owning project records
  - id: python-smoke-interface
    concern: Python smoke-package purpose and installed marker API
    producer: Project maintainers
    maintainer: Repository owner
    consumers:
      - Package users and V3 reviewers confirming the installed Python API and smoke-only scope
    creation_trigger: The selected Python smoke package needs a minimal product interface.
    failure_mode: Readers infer production support or confuse the marker API with publication authority.
    review_point: Changes to the Python smoke purpose or installed API
  - id: shared-engineering
    concern: Shared engineering principles, workspace, compatibility, HK and bounded agent execution guidance
    producer: Repository contributors
    maintainer: Repository owner
    consumers:
      - Contributors setting up tools and preserving shared build exceptions
      - Authors and reviewers applying shared design, security and test/evidence principles with project authorities
      - Agents coordinating recoverable work and rechecking mutable execution interfaces
    creation_trigger: The named consumers require this existing concern at its use or review point.
    failure_mode: Shared setup and execution assumptions drift or project details become repository policy.
    review_point: Changes to the retained concern or its consumers
  - id: legacy-workflow-retirement-interface
    concern: Retained retirement interface at the path consumed by workflow diagnostics
    producer: Project authors
    maintainer: Repository owner
    consumers:
      - V3 legacy-boundary diagnostics and retirement checks
    creation_trigger: The named consumers require this existing concern at its use or review point.
    failure_mode: A required diagnostic interface disappears or the legacy workflow is treated as current authority.
    review_point: Changes to the retained concern or its consumers
  - id: project-interfaces
    concern: Project-local usage, package-reader interfaces, provenance and release history
    producer: Project authors
    maintainer: Repository owner
    consumers:
      - Project readers using the existing README and any separate user/package interface
      - Maintainers and existing package/release consumers of change history where present
    creation_trigger: The named consumers require this existing concern at its use or review point.
    failure_mode: Readers lose project-local usage, source attribution, release-note inputs or current evidence boundaries.
    review_point: Changes to the retained concern or its consumers
  - id: project-concern-records
    concern: Project-local requirements, architecture, research and validation routed by their owning portals
    producer: Project authors
    maintainer: Repository owner
    consumers:
      - Project implementers and independent domain reviewers following the local portal and retained authorities
    creation_trigger: The named consumers require this existing concern at its use or review point.
    failure_mode: Current product constraints, evidence, stable identifiers or source limitations become orphaned
      or mixed with another project.
    review_point: Changes to the retained concern or its consumers
  - id: azureauth-python-interface
    concern: Python package-reader interface within the shared AzureAuth product
    producer: Project authors
    maintainer: Repository owner
    consumers:
      - Python package users and adapter maintainers
    creation_trigger: The named consumers require this existing concern at its use or review point.
    failure_mode: The adapter acquires a conflicting product boundary or loses its usage interface.
    review_point: Changes to the retained concern or its consumers
  - id: im-acp-proof-interfaces
    concern: Bounded proof-of-concept instructions and evidence limits
    producer: Project authors
    maintainer: Repository owner
    consumers:
      - Gateway researchers reproducing each separately scoped proof
    creation_trigger: The named consumers require this existing concern at its use or review point.
    failure_mode: A proof recipe is lost or mistaken for a product support commitment.
    review_point: Changes to the retained concern or its consumers
  - id: supermemo-knowledge
    concern: Retained Windows observations and captured source context
    producer: Project authors
    maintainer: Repository owner
    consumers:
      - SuperMemo automation investigators interpreting window and menu evidence
    creation_trigger: The named consumers require this existing concern at its use or review point.
    failure_mode: Unverified advice or captured data is lost or recast as an implemented guarantee.
    review_point: Changes to the retained concern or its consumers
  - id: supermemo-script-records
    concern: Diagnostic script usage and attributed investigation discussion
    producer: Project authors
    maintainer: Repository owner
    consumers:
      - Maintainers interpreting menu diagnostics and source advice
    creation_trigger: The named consumers require this existing concern at its use or review point.
    failure_mode: Diagnostic use loses provenance or suggestions become verified behavior.
    review_point: Changes to the retained concern or its consumers
  - id: search-clarification-inputs
    concern: Immutable supplied design answers retained under their original input paths
    producer: Project authors
    maintainer: Repository owner
    consumers:
      - Design reviewers tracing decisions and open questions to supplied answers
    creation_trigger: The named consumers require this existing concern at its use or review point.
    failure_mode: A synthesis replaces its human-source evidence or fabricates an unanswered decision.
    review_point: Changes to the retained concern or its consumers
  - id: latexmath-contracts-and-evidence
    concern: Retained requirements, contracts, rationale, historical validation and audit inputs
    producer: Project authors
    maintainer: Repository owner
    consumers:
      - Renderer implementers and reviewers
      - Existing governance audit and coverage tests reading spec.md and tasks.md
    creation_trigger: The named consumers require this existing concern at its use or review point.
    failure_mode: Stable FR/task references or consumed audit inputs disappear, or historical evidence grants new
      work.
    review_point: Changes to the retained concern or its consumers
  - id: hexo-example-interface
    concern: Runnable renderer example instructions
    producer: Project authors
    maintainer: Repository owner
    consumers:
      - Users running the bundled Hexo example
    creation_trigger: The named consumers require this existing concern at its use or review point.
    failure_mode: Readers cannot reproduce the package example or confuse it with a separate supported product.
    review_point: Changes to the retained concern or its consumers
  - id: latexmath-processor-selection-input
    concern: Original human questions and assistant discussion consumed by processor and attribute research
    producer: Original user and ChatGPT exchange, retained by project authors
    maintainer: Repository owner
    consumers:
      - Project researchers and reviewers tracing processor selection and attribute-snapshot rationale to supplied input
    creation_trigger: The retained upstream-rendering notes consume this supplied exchange as source input.
    failure_mode: Direct human input is lost or unverified assistant advice becomes a competing product authority.
    review_point: Changes to research relying on this input or its retention route; preserve source bytes and attribution
