# Repository record controls; scope and execution are defined by the linked policies.
# Derived from hcoona/microsoft-authentication-cli at 1a02498589769c38bc16eefc2efc5f9eca6e6994.
# Source copyright and MIT notice: docs/governance/reference-license.txt.
schema_version: 2
controls:
  - id: record-format
    state: current
    class: mechanical
    enforcement: blocking
    producer: HK and configured formatters
    maintainer: Repository owner
    consumers:
      - Contributors using the local small,medium profiles
      - CI validation and reviewers using small,medium,large with explicit changed refs
    governing_rules:
      - hk.pkl
      - mise.toml
      - .github/workflows/ci.yml
      - AGENTS.md
    invariant: Selected Markdown, YAML, and JSON satisfy their existing format/lint configuration. HK path exclusions
      and profiles apply; this is not schema, link, coverage, or semantic validation.
    runner: hk
    implementation:
      kind: hk-steps
      steps:
        local-fast:
          - typos
          - editorconfig-check
          - markdownlint-cli2
          - markdown-prettier
          - yaml-prettier
          - json-biome
        ci:
          - typos
          - editorconfig-check
          - markdownlint-cli2
          - markdown-prettier
          - yaml-prettier
          - json-biome
    execution_points:
      - local-fast
      - ci
    failure_mode: Malformed selected records enter review; excluded paths receive no implied coverage.
  - id: engineering-guidance
    state: current
    class: procedural-review
    enforcement: advisory
    producer: Engineering authors and reviewers applying the shared guidance
    maintainer: Repository owner
    consumers:
      - Agents making or reviewing design, security and test/evidence strategy decisions
    governing_rules:
      - docs/engineering/engineering-principles.md
      - docs/governance/record-system.md
      - AGENTS.md
    invariant: The root agent entry routes applicable engineering decisions to shared principles and owning-project
      authorities without merging project scope or replacing existing review and owner judgment.
    runner: agent-skill
    implementation:
      kind: repository-path
      value: .github/skills/engineering-guidance/SKILL.md
    execution_points:
      - local-validation
      - pull-request-review
    failure_mode: Engineering decisions miss shared principles or apply them without project context.
  - id: record-system-review
    state: current
    class: procedural-review
    enforcement: review-required
    producer: Reviewer independent of change author and implementation agent
    maintainer: Repository owner
    consumers:
      - Record authors and repository owner at record-system review
    governing_rules:
      - docs/governance/governance-system.md#changing-rules
      - docs/governance/record-system.md#project-namespaces
      - docs/governance/record-system.md#work-authorization-and-concurrency
      - docs/governance/record-system.md#enforcement
      - docs/governance/record-system.md#record-system-gate
    invariant: Structural record changes; edits to governance, work-authorization, shared-principle, or root
      instruction/workflow/template authorities; portal-routing, generated-interface ownership or apm.lock.yaml
      source/deployment provenance, hk, control-governed workflow, or control-governed Agent Skill changes; record edits
      altering authority ownership, established requirement identifiers, or consumer/immutability/license contracts; and
      claims to the Record-System Gate receive independent review of authority, repository-wide workflow precedence,
      actual consumers, lifecycle, and policy-control agreement.
    runner: agent-skill
    implementation:
      kind: repository-path
      value: .github/skills/record-system-review/SKILL.md
    execution_points:
      - pull-request-review
    failure_mode: Changed records create duplicate authority or omit an actual consumer.
  - id: independent-finding-triage
    state: current
    class: procedural-review
    enforcement: review-required
    producer: Originating independent reviewer for agreed findings; reviewer independent of originating reviewer,
      change author, and implementation agent for disputed or unresolved findings
    maintainer: Repository owner
    consumers:
      - Change author and owner disposing of material findings
    governing_rules:
      - docs/governance/governance-system.md#gov-011-separate-findings-from-disposition
      - docs/governance/record-system.md#enforcement
    invariant: Agreed material findings not requiring an owner decision are verified on the remediation delta by the
      originating independent reviewer; disputed (false-positive) or unresolved material findings receive evidenced
      independent third-party classification before dismissal or owner disposition, while nonmaterial mechanical defects
      use mechanical verification.
    runner: agent-skill
    implementation:
      kind: review-procedure
      value: Apply GOV-011; record third-party classifications of disputed or unresolved findings and required owner
        dispositions in the governing PR or Issue review carrier.
    execution_points:
      - local-validation
      - pull-request-review
      - recheck-trigger
      - release
    failure_mode: Self-confirming review creates false assurance or unnecessary changes.
  - id: record-system-gate
    state: current
    class: owner-decision
    enforcement: owner-disposition
    producer: Repository owner
    maintainer: Repository owner
    consumers:
      - Repository owner accepting a record-system change
    governing_rules:
      - docs/governance/record-system.md#record-system-gate
    invariant: Acceptance has applicable check results, independent record/domain reviews, finding triage and required
      owner dispositions against the reviewed change.
    runner: human-owner
    implementation:
      kind: evidence-carrier
      value:
        The proposing PR links exact changes, applicable checks, independent reviews, triage and owner dispositions;
        accepted merge establishes current state.
    execution_points:
      - pull-request-merge
    failure_mode: A change is accepted without evidence for its claimed gates or preservation of current consumers.
  - id: research-evidence-review
    state: current
    class: procedural-review
    enforcement: review-required
    producer: Reviewer independent of the change author and implementation agent
    maintainer: Repository owner
    consumers:
      - Research authors and repository owner during research, fired recheck, and empirical evidence review
    governing_rules:
      - docs/governance/record-system.md#work-authorization-and-concurrency
      - docs/governance/record-system.md#workflows
      - docs/governance/record-system.md#enforcement
      - docs/governance/governance-system.md
    invariant: Research, formal or empirical evidence reports, platform/support claims, fired mutable-source rechecks,
      and external or paid empirical operations preserve source boundaries, accepted effects and protocols, evidence
      labels, reproducibility, and claim limits, while routine local and governed CI validation stays out of scope.
    runner: agent-skill
    implementation:
      kind: repository-path
      value: .github/skills/research-evidence-review/SKILL.md
    execution_points:
      - pull-request-review
      - recheck-trigger
      - release
    failure_mode: Research conclusions overstate evidence or expose unsafe experimental detail.
  - id: repository-record-validation
    state: current
    class: mechanical
    enforcement: advisory
    producer: Record author executing the maintained repository record checker
    maintainer: Repository owner
    consumers:
      - Record authors and reviewers checking discovered records and their consumers
    governing_rules:
      - docs/governance/record-system.md#enforcement
      - docs/governance/checker-contract.md
    invariant: Independently discovered scope receives bounded schema, binding, reference and portal validation against
      explicit snapshots. Reports retain classifications, file identities, results and limitations; independent semantic
      review and applicable HK-plan validation remain separate obligations.
    runner: local-tool
    implementation:
      kind: repository-path
      value: eng/scripts/check_repository_records.py
    execution_points:
      - local-validation
    failure_mode: Catalog omissions, broken consumers or unexecuted checks are mistaken for complete validated coverage.
