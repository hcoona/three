schema: workflow-delivery/v3/release-unit
release-unit: hcoona-release-smoke-ruby
builds:
  - id: ruby-gem
    definition: ruby/gem-v1
    entry-point: hcoona-release-smoke-ruby.gemspec
    outputs:
      - id: gem
        role: primary-package
        kind: ruby-gem
    qualification:
      require: hcoona_release_smoke_ruby
      probe: >-
        HcoonaReleaseSmokeRuby.project_id == 'hcoona-release-smoke-ruby' &&
        HcoonaReleaseSmokeRuby::VERSION == ARGV.fetch(0)
