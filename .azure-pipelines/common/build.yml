parameters:
- name: isOfficial
  type: boolean
  default: false
- name: packProjects
  type: boolean
  default: false
- name: projects
  type: string
  default: dirs.proj

steps:
- checkout: self
  clean: true
  fetchDepth: -1
  persistCredentials: true

# Checkout Git-LFS if necessary in the future.
# Note that we need to save Git-LFS bandwidth so currently we disabled it.
# Consider to use a separate Git-LFS storage than the one in GitHub.
- script: |
    git lfs ls-files
  displayName: "List Git-LFS files"

- task: UseNode@1
  displayName: 'Install Node.js (LTS)'
  inputs:
    version: '20.x'

- script: |
    npm exec editorconfig-checker
  displayName: 'editorconfig-checker'
  continueOnError: true

- task: UseDotNet@2
  displayName: 'Install DotNet SDK'
  inputs:
    useGlobalJson: true

- task: DotNetCoreCLI@2
  displayName: Install NBGV tool
  inputs:
    command: custom
    custom: tool
    arguments: install --tool-path $(Agent.ToolsDirectory) nbgv

- script: $(Agent.ToolsDirectory)/nbgv cloud -a
  displayName: NBGV set environment variables

- task: Cache@2
  displayName: 'Restore nuget cache'
  inputs:
    key: 'nuget | "$(Agent.OS)" | **/packages.lock.json,!**/bin/**,!**/obj/**'
    restoreKeys: |
      nuget | "$(Agent.OS)"
      nuget
    path: '$(NUGET_PACKAGES)'
    cacheHitVar: 'CACHE_RESTORED'

- task: DotNetCoreCLI@2
  displayName: 'Build projects'
  inputs:
    command: 'build'
    projects: '${{ parameters.projects }}'
    arguments: '-c $(buildConfiguration) -p RestoreLockedMode=true'
    buildProperties: 'PublicRelease=${{ parameters.isOfficial }}'

- pwsh: |
    dotnet test dirs.proj --no-restore --no-build -c $(buildConfiguration) -- --report-trx --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
  displayName: 'Test projects'

- task: PublishTestResults@2
  displayName: 'Publish test result (TRX)'
  condition: and(succeeded(), eq(variables['isWindows'], 'true'))
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    searchFolder: '$(System.DefaultWorkingDirectory)'
    mergeTestResults:
    failTaskOnFailedTests: true
    failTaskOnMissingResultsFile: true
    buildPlatform: x64
    buildConfiguration: $(buildConfiguration)

- task: PublishCodeCoverageResults@2
  displayName: 'Publish code coverage (Cobertura)'
  condition: and(succeeded(), eq(variables['isWindows'], 'true'))
  inputs:
    summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.cobertura.xml'
    failIfCoverageEmpty: true

- task: DotNetCoreCLI@2
  displayName: 'Pack projects'
  condition: and(succeeded(), eq('${{ parameters.packProjects }}', 'true'), eq(variables['isWindows'], 'true'))
  env:
    MSBUILDDISABLENODEREUSE: '1'
  inputs:
    command: 'pack'
    packagesToPack: '${{ parameters.projects }}'
    configuration: '$(buildConfiguration)'
    packDirectory: $(System.DefaultWorkingDirectory)/out/packages
    nobuild: true
    arguments: '-m:1'
    buildProperties: 'PublicRelease=${{ parameters.isOfficial }}'

- task: PublishPipelineArtifact@1
  displayName: 'Publish artifacts'
  inputs:
    targetPath: $(System.DefaultWorkingDirectory)/out
    artifactName: OneDotNet-$(osSuffix)
