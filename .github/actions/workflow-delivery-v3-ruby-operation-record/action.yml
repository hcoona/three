name: Persist Ruby operation record
description: Validate one bounded raw payload and bind its immutable current-run readback.
inputs:
  role:
    description: Fixed current producer record role.
    required: true
  path:
    description: Exact single original file.
    required: true
outputs:
  references:
    description: Complete explicit current-DAG reference map.
    value: ${{ steps.bind.outputs.references }}
  artifact-ids:
    description: Exact current-DAG selected artifact IDs.
    value: ${{ steps.bind.outputs.artifact-ids }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        RECORD_ROLE: ${{ inputs.role }}
        RECORD_PATH: ${{ inputs.path }}
      run: python -m three_workflow_delivery_v3.ruby_operation_cli upload-check --role "${RECORD_ROLE}" --payload "${RECORD_PATH}"
    - id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ruby-operation-${{ github.run_id }}-${{ inputs.role }}
        path: ${{ inputs.path }}
        if-no-files-found: error
        retention-days: 45
        overwrite: false
        archive: false
        include-hidden-files: true
    - shell: bash
      env:
        RECORD_ID: ${{ steps.upload.outputs.artifact-id }}
      run: test -n "${RECORD_ID}"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ steps.upload.outputs.artifact-id }}
        path: .wdv3/readback/${{ inputs.role }}
        merge-multiple: true
        skip-decompress: true
        digest-mismatch: error
    - id: bind
      shell: bash
      env:
        RECORD_ROLE: ${{ inputs.role }}
        RECORD_PATH: ${{ inputs.path }}
        RECORD_ID: ${{ steps.upload.outputs.artifact-id }}
        RECORD_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        RECORD_URL: ${{ steps.upload.outputs.artifact-url }}
      run: |
        python -m three_workflow_delivery_v3.ruby_operation_cli bind \
          --role "${RECORD_ROLE}" \
          --payload ".wdv3/readback/${RECORD_ROLE}/$(basename "${RECORD_PATH}")" \
          --artifact-id "${RECORD_ID}" --artifact-digest "${RECORD_DIGEST}" \
          --artifact-url "${RECORD_URL}"
    - shell: bash
      env:
        NEXT_REFERENCES: ${{ steps.bind.outputs.references }}
      run: echo "WDV3_REFERENCES=${NEXT_REFERENCES}" >> "${GITHUB_ENV}"
