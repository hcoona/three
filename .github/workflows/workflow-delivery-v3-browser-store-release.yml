name: Workflow Delivery v3 Browser Store Release
'on':
  workflow_dispatch:
    inputs:
      store:
        description: Selected browser store
        type: choice
        required: true
        options:
          - chrome-web-store
          - firefox-amo
          - edge-addons
      channel:
        description: Release channel; the stores are Official only and Buddy is a dry run
        type: choice
        required: true
        options:
          - official
          - buddy
      dry-run:
        description: Qualify and describe without publication
        type: boolean
        default: true
      edge-clearance:
        description: Edge live only. Choose first submission or confirm in Partner Center that the version was not received.
        type: choice
        required: false
        default: unresolved
        options:
          - unresolved
          - first
          - owner-checked
permissions: {}
concurrency:
  group: ${{ format('workflow-delivery-{0}-steam-account-history-to-csv', inputs.store) }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  DESTINATION: ${{ inputs.store }}
  CHANNEL: ${{ inputs.channel }}
  DRY_RUN: ${{ inputs.dry-run }}
  EDGE_CLEARANCE: ${{ inputs.edge-clearance }}
  # Reviewed store coordinates are repository variables bound into the request.
  STORE_ITEM: ${{ inputs.store == 'chrome-web-store' && vars.WORKFLOW_DELIVERY_CWS_EXTENSION_ID || inputs.store == 'firefox-amo' && vars.WORKFLOW_DELIVERY_AMO_ADDON_ID || vars.WORKFLOW_DELIVERY_EDGE_PRODUCT_ID }}
  STORE_PUBLISHER: ${{ vars.WORKFLOW_DELIVERY_CWS_PUBLISHER_ID }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read committed tool versions
        id: tools
        run: python3 eng/scripts/locked_tool_versions.py dotnet dotnet-frameworks node pnpm >> "$GITHUB_OUTPUT"
      - &mise
        name: Prepare runtime without product execution
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.11.14
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected runtimes
        env:
          DOTNET_VERSION: ${{ steps.tools.outputs.dotnet }}
          DOTNET_FRAMEWORKS_VERSION: ${{ steps.tools.outputs.dotnet-frameworks }}
          NODE_VERSION: ${{ steps.tools.outputs.node }}
          PNPM_VERSION: ${{ steps.tools.outputs.pnpm }}
        run: |
          set -Eeuo pipefail
          mise install --jobs 1 --yes "dotnet@$DOTNET_VERSION" "dotnet@$DOTNET_FRAMEWORKS_VERSION" "node@$NODE_VERSION" "pnpm@$PNPM_VERSION"
          printf 'DOTNET_EXECUTABLE=%s\n' "$(mise which --tool "dotnet@$DOTNET_VERSION" dotnet)" >> "$GITHUB_ENV"
        working-directory: ${{ runner.temp }}
      - name: Build complete control before product execution
        run: |
          set -Eeuo pipefail
          mise exec --locked dotnet -- dotnet build src/private/app/workflow-delivery/WorkflowDelivery.csproj -p:RestoreLockedMode=true -o "$RUNNER_TEMP/control"
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs browser-store request
      - name: Retain actual control results
        id: control
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-store-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control
          if-no-files-found: error
          retention-days: 45
          overwrite: false
      - name: Prepare frozen dependencies without product scripts
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/dependencies/home" "$RUNNER_TEMP/dependencies/config"
          touch "$RUNNER_TEMP/dependencies/config/auth.npmrc"
          # shellcheck disable=SC2016
          mise exec --locked node pnpm -- sh -c 'exec env -i PATH="$PATH" \
            HOME="$RUNNER_TEMP/dependencies/home" XDG_CONFIG_HOME="$RUNNER_TEMP/dependencies/config" \
            pnpm --npmrc-auth-file "$RUNNER_TEMP/dependencies/config/auth.npmrc" \
            --store-dir "$RUNNER_TEMP/dependencies/store" --state-dir "$RUNNER_TEMP/dependencies/state" \
            install --frozen-lockfile --ignore-scripts'
      - name: Build and qualify every store zip once
        run: |
          set -Eeuo pipefail
          export MISE_DATA_DIR="${MISE_DATA_DIR:-$HOME/.local/share/mise}"
          mise exec --locked dotnet node pnpm -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release prepare-browser-store "$RUNNER_TEMP/prepared/request.json" > "$RUNNER_TEMP/prepared/preparation.json"
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs browser-store originals
      - name: Retain actual prepared results
        id: retain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-store-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          retention-days: 45
          overwrite: false
    outputs:
      control-id: ${{ steps.control.outputs.artifact-id }}
      dotnet: ${{ steps.tools.outputs.dotnet }}
      dotnet-frameworks: ${{ steps.tools.outputs.dotnet-frameworks }}
      preparation-id: ${{ steps.retain.outputs.artifact-id }}
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - &control
        name: Download control by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.control-id }}
          path: ${{ runner.temp }}/control
          digest-mismatch: error
      - &prepared
        name: Download prepared by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.preparation-id }}
          path: ${{ runner.temp }}/prepared
          digest-mismatch: error
      - *mise
      - &dotnet
        name: Install selected control runtime
        env:
          DOTNET_VERSION: ${{ needs.prepare.outputs.dotnet }}
          DOTNET_FRAMEWORKS_VERSION: ${{ needs.prepare.outputs.dotnet-frameworks }}
        run: |
          set -Eeuo pipefail
          mise install --jobs 1 --yes "dotnet@$DOTNET_VERSION" "dotnet@$DOTNET_FRAMEWORKS_VERSION"
          printf 'DOTNET_EXECUTABLE=%s\n' "$(mise which --tool "dotnet@$DOTNET_VERSION" dotnet)" >> "$GITHUB_ENV"
        working-directory: ${{ runner.temp }}
      - name: Receive transferred preparation
        run: |
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs browser-store receive observation
      - &read-token
        name: Acquire read-only Chrome Web Store token
        id: read-token
        if: inputs.store == 'chrome-web-store' && inputs.dry-run == false
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.WORKFLOW_DELIVERY_CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.WORKFLOW_DELIVERY_CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore.readonly
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false
      - name: Observe store state and qualified originals
        env:
          CWS_ACCESS_TOKEN: ${{ steps.read-token.outputs.access_token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release observe-browser-store "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/prepared" > "$RUNNER_TEMP/observation/observation.json" || {
            status=$?
            if [ "$status" -ne 1 ] || [ "$DRY_RUN" = true ]; then exit "$status"; fi
            : > "$RUNNER_TEMP/primary-observation-refused"
          }
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release observe-github-anchor "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/observation/anchor-observation.json" || {
            status=$?
            if [ "$status" -ne 1 ] || [ "$DRY_RUN" = true ]; then exit "$status"; fi
            : > "$RUNNER_TEMP/anchor-observation-refused"
          }
      - name: Expose required writes and describe dry run
        id: state
        run: |
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs browser-store state
          if [ "$DRY_RUN" = true ]; then
            anchor_observation=-
            if [ -s "$RUNNER_TEMP/observation/anchor-observation.json" ]; then anchor_observation="$RUNNER_TEMP/observation/anchor-observation.json"; fi
            "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release describe-browser-store "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/observation/observation.json" "$anchor_observation" > "$RUNNER_TEMP/observation/dry-run.json"
            cat "$RUNNER_TEMP/observation/dry-run.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain actual observation results
        id: retain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-store-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observation
          if-no-files-found: error
          retention-days: 45
          overwrite: false
    needs: prepare
    outputs:
      write-needed: ${{ steps.state.outputs.write-needed }}
      anchor-write-needed: ${{ steps.state.outputs.anchor-write-needed }}
      observation-id: ${{ steps.retain.outputs.artifact-id }}
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - *control
      - *prepared
      - name: Download observation by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.observe.outputs.observation-id }}
          path: ${{ runner.temp }}/observation
          digest-mismatch: error
      - *mise
      - *dotnet
      - name: Receive transferred preparation
        run: |
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs browser-store receive publication
      - name: Acquire publishing Chrome Web Store token
        id: write-token
        if: inputs.store == 'chrome-web-store'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.WORKFLOW_DELIVERY_CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.WORKFLOW_DELIVERY_CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false
      - name: Refresh store state and submit the qualified originals
        env:
          CWS_ACCESS_TOKEN: ${{ steps.write-token.outputs.access_token }}
          AMO_JWT_ISSUER: ${{ inputs.store == 'firefox-amo' && secrets.AMO_JWT_ISSUER || '' }}
          AMO_JWT_SECRET: ${{ inputs.store == 'firefox-amo' && secrets.AMO_JWT_SECRET || '' }}
          EDGE_API_KEY: ${{ inputs.store == 'edge-addons' && secrets.EDGE_API_KEY || '' }}
          EDGE_CLIENT_ID: ${{ inputs.store == 'edge-addons' && secrets.EDGE_CLIENT_ID || '' }}
        run: |
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release publish-browser-store "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/observation/observation.json" > "$RUNNER_TEMP/publication/publication.json"
      - name: Retain actual publication results
        id: retain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-store-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
          if-no-files-found: error
          retention-days: 45
          overwrite: false
    needs:
      - prepare
      - observe
    if: inputs.dry-run == false && needs.observe.outputs.write-needed == 'true'
    environment:
      name: ${{ format('workflow-delivery-v3-{0}', inputs.store) }}
    outputs:
      publication-id: ${{ steps.retain.outputs.artifact-id }}
  anchor-gate:
    needs: [prepare, observe, publish]
    if: always() && !cancelled() && inputs.channel == 'official' && inputs.dry-run == false && needs.prepare.result == 'success' && needs.observe.result == 'success' && needs.publish.result != 'cancelled' && needs.observe.outputs.anchor-write-needed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/workflow-delivery-v3-anchor-gate.yml
    with:
      control-id: ${{ needs.prepare.outputs.control-id }}
      preparation-id: ${{ needs.prepare.outputs.preparation-id }}
      observation-id: ${{ needs.observe.outputs.observation-id }}
      publication-id: ${{ needs.publish.outputs.publication-id }}
      dotnet: ${{ needs.prepare.outputs.dotnet }}
      dotnet-frameworks: ${{ needs.prepare.outputs.dotnet-frameworks }}
  publish-github-anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: workflow-delivery-github-release-steam-account-history-to-csv
      cancel-in-progress: false
      queue: max
    steps:
      - *control
      - *prepared
      - name: Download observation by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.observe.outputs.observation-id }}
          path: ${{ runner.temp }}/observation
          digest-mismatch: error
      - name: Download publication by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.publish.outputs.publication-id }}
          path: ${{ runner.temp }}/publication
          digest-mismatch: error
        if: needs.publish.outputs.publication-id != ''
      - *mise
      - *dotnet
      - name: Receive transferred preparation
        run: |
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs browser-store receive anchor-publication
      - name: Publish GitHub Release anchor after store submission succeeds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          publication=-
          if [ -s "$RUNNER_TEMP/publication/publication.json" ]; then publication="$RUNNER_TEMP/publication/publication.json"; fi
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release publish-github-anchor "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/observation/observation.json" "$RUNNER_TEMP/observation/anchor-observation.json" "$publication" > "$RUNNER_TEMP/anchor-publication/publication.json"
      - name: Retain actual anchor publication results
        id: retain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-store-anchor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/anchor-publication
          if-no-files-found: error
          retention-days: 45
          overwrite: false
    needs:
      - prepare
      - observe
      - publish
      - anchor-gate
    if: always() && !cancelled() && needs.anchor-gate.result == 'success' && needs.anchor-gate.outputs.permitted == 'true'
    outputs:
      anchor-id: ${{ steps.retain.outputs.artifact-id }}
  verify-result:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - *control
      - *prepared
      - name: Download observation by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.observe.outputs.observation-id }}
          path: ${{ runner.temp }}/observation
          digest-mismatch: error
      - name: Download publication by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.publish.outputs.publication-id }}
          path: ${{ runner.temp }}/publication
          digest-mismatch: error
        if: needs.publish.outputs.publication-id != ''
        id: primary-receipt
        continue-on-error: true
      - name: Download anchor publication by immutable artifact ID
        id: anchor-receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.publish-github-anchor.outputs.anchor-id }}
          path: ${{ runner.temp }}/anchor-publication
          digest-mismatch: error
        if: needs.publish-github-anchor.outputs.anchor-id != ''
        continue-on-error: true
      - *mise
      - *dotnet
      - name: Receive transferred preparation
        run: |
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs browser-store receive verification
      - *read-token
      - name: Verify the store-reported version state
        env:
          CWS_ACCESS_TOKEN: ${{ steps.read-token.outputs.access_token }}
          GITHUB_TOKEN: ${{ github.token }}
          PRIMARY_RECEIPT_OUTCOME: ${{ steps.primary-receipt.outcome }}
          ANCHOR_RECEIPT_OUTCOME: ${{ steps.anchor-receipt.outcome }}
        run: |
          set -Eeuo pipefail
          # Only the Chrome Web Store is readable outside its publisher; the other stores
          # complete from the publisher's own post-submission observation.
          final=-
          if [ "$DESTINATION" = chrome-web-store ]; then
            status=0
            "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release observe-browser-store "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/prepared" > "$RUNNER_TEMP/verification/final.json" || status=$?
            if [ "$status" -gt 1 ]; then exit "$status"; fi
            final="$RUNNER_TEMP/verification/final.json"
          fi
          anchor_status=0
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release observe-github-anchor "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/verification/anchor-final.json" || anchor_status=$?
          if [ "$anchor_status" -gt 1 ]; then exit "$anchor_status"; fi
          publication=-
          if [ "$PRIMARY_RECEIPT_OUTCOME" = success ] && [ -s "$RUNNER_TEMP/publication/publication.json" ]; then publication="$RUNNER_TEMP/publication/publication.json"; fi
          anchor_initial=-
          if [ -s "$RUNNER_TEMP/observation/anchor-observation.json" ]; then anchor_initial="$RUNNER_TEMP/observation/anchor-observation.json"; fi
          anchor_final=-
          if [ -s "$RUNNER_TEMP/verification/anchor-final.json" ]; then anchor_final="$RUNNER_TEMP/verification/anchor-final.json"; fi
          anchor_publication=-
          if [ "$ANCHOR_RECEIPT_OUTCOME" = success ] && [ -s "$RUNNER_TEMP/anchor-publication/publication.json" ]; then anchor_publication="$RUNNER_TEMP/anchor-publication/publication.json"; fi
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release complete-browser-store "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/observation/observation.json" "$final" "$publication" "$anchor_initial" "$anchor_final" "$anchor_publication" > "$RUNNER_TEMP/verification/outcome.json"
          if [ "$PRIMARY_RECEIPT_OUTCOME" = failure ] || [ "$ANCHOR_RECEIPT_OUTCOME" = failure ]; then
            printf '%s\n' 'Verification excluded failed receipt downloads.' >&2
            exit 2
          fi
      - name: Show actual available business result
        run: |
          set -Eeuo pipefail
          if [ -s "$RUNNER_TEMP/verification/outcome.json" ]; then
            cat "$RUNNER_TEMP/verification/outcome.json" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Required browser-store completion result is unavailable.' >> "$GITHUB_STEP_SUMMARY"
          fi
        if: always()
      - name: Retain actual verification results
        id: retain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-store-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
          retention-days: 45
          overwrite: false
    needs:
      - prepare
      - observe
      - publish
      - publish-github-anchor
    if: always() && !cancelled() && inputs.dry-run == false && needs.prepare.result == 'success' && needs.observe.result == 'success'
