name: Workflow Delivery v3 Ruby bootstrap
'on':
  workflow_dispatch:
    inputs:
      destination:
        description: Exact independently admitted registry
        required: true
        type: choice
        options:
        - github-packages
        - rubygems
      operation:
        description: Reviewed canonical request, admission, reservation, review and inspection
        required: true
        type: string
permissions: {}
concurrency:
  group: wdv3-ruby-hcoona-release-smoke-ruby-${{ inputs.destination }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  ACTIONS_ARTIFACT_UPLOAD_CONCURRENCY: '1'
  ACTIONS_ARTIFACT_UPLOAD_TIMEOUT_MS: '60000'
jobs:
  request-ruby-operation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      WDV3_REFERENCES: ${{ '{}' }}
      WDV3_OPERATION_INPUT: ${{ inputs.operation }}
      WDV3_SELECTED_DESTINATION: ${{ inputs.destination }}
    steps:
    - name: Check out exact native target without credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 10
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - uses: ./.github/actions/workflow-delivery-v3-ruby-setup
      timeout-minutes: 10
      with:
        native: 'false'
    - name: Request
      run: python -m three_workflow_delivery_v3.ruby_operation_cli request --output .wdv3/operation.json
      timeout-minutes: 10
      id: request
    - name: Persist and read back operation
      uses: ./.github/actions/workflow-delivery-v3-ruby-operation-record
      timeout-minutes: 10
      with:
        role: operation
        path: .wdv3/operation.json
    - name: Export
      run: python -m three_workflow_delivery_v3.ruby_operation_cli export
      timeout-minutes: 10
      id: edges
      if: always()
    outputs:
      references: ${{ steps.edges.outputs.references }}
      artifact-ids: ${{ steps.edges.outputs.artifact-ids }}
      destination: ${{ steps.request.outputs.destination }}
      environment: ${{ steps.request.outputs.environment }}
    if: github.event_name == 'workflow_dispatch' && github.repository == 'hcoona/three' && github.ref == 'refs/heads/main'
      && github.actor == 'hcoona' && github.actor_id == '712433' && github.run_attempt == 1
  provide-ruby-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      WDV3_REFERENCES: ${{ needs.request-ruby-operation.outputs.references && needs.request-ruby-operation.outputs.artifact-ids
        && needs.request-ruby-operation.outputs.references || '{}' }}
      WDV3_ARTIFACT_IDS: ${{ needs.request-ruby-operation.outputs.references && needs.request-ruby-operation.outputs.artifact-ids
        && needs.request-ruby-operation.outputs.artifact-ids || '' }}
    steps:
    - name: Check out exact native target without credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 10
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - uses: ./.github/actions/workflow-delivery-v3-ruby-setup
      timeout-minutes: 10
      with:
        native: 'true'
    - name: Require exact incoming artifact IDs
      run: test -n "${WDV3_ARTIFACT_IDS}"
      timeout-minutes: 1
    - name: Download exact current-DAG IDs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      timeout-minutes: 10
      if: env.WDV3_ARTIFACT_IDS != ''
      with:
        artifact-ids: ${{ env.WDV3_ARTIFACT_IDS }}
        path: .wdv3
        merge-multiple: true
        skip-decompress: true
        digest-mismatch: error
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      timeout-minutes: 10
      with:
        dotnet-version: 10.0.401
    - name: Restore pinned NBGV
      run: dotnet tool restore
      timeout-minutes: 10
    - name: Provider
      run: python -m three_workflow_delivery_v3.ruby_operation_cli provider --output .wdv3/provider.json
      timeout-minutes: 10
    - name: Persist and read back provider
      uses: ./.github/actions/workflow-delivery-v3-ruby-operation-record
      timeout-minutes: 10
      with:
        role: provider
        path: .wdv3/provider.json
    - name: Export
      run: python -m three_workflow_delivery_v3.ruby_operation_cli export
      timeout-minutes: 10
      id: edges
      if: always()
    outputs:
      references: ${{ steps.edges.outputs.references }}
      artifact-ids: ${{ steps.edges.outputs.artifact-ids }}
    needs: request-ruby-operation
  plan-ruby-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      WDV3_REFERENCES: ${{ needs.provide-ruby-bootstrap.outputs.references && needs.provide-ruby-bootstrap.outputs.artifact-ids
        && needs.provide-ruby-bootstrap.outputs.references || '{}' }}
      WDV3_ARTIFACT_IDS: ${{ needs.provide-ruby-bootstrap.outputs.references && needs.provide-ruby-bootstrap.outputs.artifact-ids
        && needs.provide-ruby-bootstrap.outputs.artifact-ids || '' }}
    steps:
    - name: Check out exact native target without credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 10
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - uses: ./.github/actions/workflow-delivery-v3-ruby-setup
      timeout-minutes: 10
      with:
        native: 'true'
    - name: Require exact incoming artifact IDs
      run: test -n "${WDV3_ARTIFACT_IDS}"
      timeout-minutes: 1
    - name: Download exact current-DAG IDs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      timeout-minutes: 10
      if: env.WDV3_ARTIFACT_IDS != ''
      with:
        artifact-ids: ${{ env.WDV3_ARTIFACT_IDS }}
        path: .wdv3
        merge-multiple: true
        skip-decompress: true
        digest-mismatch: error
    - name: Plan
      run: python -m three_workflow_delivery_v3.ruby_operation_cli plan --output .wdv3/plan.json
      timeout-minutes: 10
    - name: Persist and read back plan
      uses: ./.github/actions/workflow-delivery-v3-ruby-operation-record
      timeout-minutes: 10
      with:
        role: plan
        path: .wdv3/plan.json
    - name: Export
      run: python -m three_workflow_delivery_v3.ruby_operation_cli export
      timeout-minutes: 10
      id: edges
      if: always()
    outputs:
      references: ${{ steps.edges.outputs.references }}
      artifact-ids: ${{ steps.edges.outputs.artifact-ids }}
    needs: provide-ruby-bootstrap
  build-ruby:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      WDV3_REFERENCES: ${{ needs.plan-ruby-bootstrap.outputs.references && needs.plan-ruby-bootstrap.outputs.artifact-ids
        && needs.plan-ruby-bootstrap.outputs.references || '{}' }}
      WDV3_ARTIFACT_IDS: ${{ needs.plan-ruby-bootstrap.outputs.references && needs.plan-ruby-bootstrap.outputs.artifact-ids
        && needs.plan-ruby-bootstrap.outputs.artifact-ids || '' }}
    steps:
    - name: Check out exact native target without credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 10
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - uses: ./.github/actions/workflow-delivery-v3-ruby-setup
      timeout-minutes: 10
      with:
        native: 'true'
    - name: Require exact incoming artifact IDs
      run: test -n "${WDV3_ARTIFACT_IDS}"
      timeout-minutes: 1
    - name: Download exact current-DAG IDs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      timeout-minutes: 10
      if: env.WDV3_ARTIFACT_IDS != ''
      with:
        artifact-ids: ${{ env.WDV3_ARTIFACT_IDS }}
        path: .wdv3
        merge-multiple: true
        skip-decompress: true
        digest-mismatch: error
    - name: Build
      run: python -m three_workflow_delivery_v3.ruby_operation_cli build
      timeout-minutes: 10
      id: build
    - name: Persist and read back gem
      uses: ./.github/actions/workflow-delivery-v3-ruby-operation-record
      timeout-minutes: 10
      with:
        role: gem
        path: ${{ steps.build.outputs.gem-path }}
    - name: Export
      run: python -m three_workflow_delivery_v3.ruby_operation_cli export
      timeout-minutes: 10
      id: edges
      if: always()
    outputs:
      references: ${{ steps.edges.outputs.references }}
      artifact-ids: ${{ steps.edges.outputs.artifact-ids }}
    needs: plan-ruby-bootstrap
  qualify-ruby-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      WDV3_REFERENCES: ${{ needs.build-ruby.outputs.references && needs.build-ruby.outputs.artifact-ids && needs.build-ruby.outputs.references
        || '{}' }}
      WDV3_ARTIFACT_IDS: ${{ needs.build-ruby.outputs.references && needs.build-ruby.outputs.artifact-ids && needs.build-ruby.outputs.artifact-ids
        || '' }}
    steps:
    - name: Check out exact native target without credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 10
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - uses: ./.github/actions/workflow-delivery-v3-ruby-setup
      timeout-minutes: 10
      with:
        native: 'true'
    - name: Require exact incoming artifact IDs
      run: test -n "${WDV3_ARTIFACT_IDS}"
      timeout-minutes: 1
    - name: Download exact current-DAG IDs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      timeout-minutes: 10
      if: env.WDV3_ARTIFACT_IDS != ''
      with:
        artifact-ids: ${{ env.WDV3_ARTIFACT_IDS }}
        path: .wdv3
        merge-multiple: true
        skip-decompress: true
        digest-mismatch: error
    - name: Artifacts
      run: python -m three_workflow_delivery_v3.ruby_operation_cli artifacts --output .wdv3/artifacts.json
      timeout-minutes: 10
    - name: Persist and read back artifacts
      uses: ./.github/actions/workflow-delivery-v3-ruby-operation-record
      timeout-minutes: 10
      with:
        role: artifacts
        path: .wdv3/artifacts.json
    - name: Quality
      run: python -m three_workflow_delivery_v3.ruby_operation_cli quality --output .wdv3/quality.json
      timeout-minutes: 10
    - name: Persist and read back quality
      uses: ./.github/actions/workflow-delivery-v3-ruby-operation-record
      timeout-minutes: 10
      with:
        role: quality
        path: .wdv3/quality.json
    - name: Export
      run: python -m three_workflow_delivery_v3.ruby_operation_cli export
      timeout-minutes: 10
      id: edges
      if: always()
    outputs:
      references: ${{ steps.edges.outputs.references }}
      artifact-ids: ${{ steps.edges.outputs.artifact-ids }}
    needs: build-ruby
  finalize-ruby-bootstrap-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      WDV3_REFERENCES: ${{ needs.qualify-ruby-bootstrap.outputs.references && needs.qualify-ruby-bootstrap.outputs.artifact-ids
        && needs.qualify-ruby-bootstrap.outputs.references || '{}' }}
      WDV3_ARTIFACT_IDS: ${{ needs.qualify-ruby-bootstrap.outputs.references && needs.qualify-ruby-bootstrap.outputs.artifact-ids
        && needs.qualify-ruby-bootstrap.outputs.artifact-ids || '' }}
    steps:
    - name: Check out exact native target without credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 10
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - uses: ./.github/actions/workflow-delivery-v3-ruby-setup
      timeout-minutes: 10
      with:
        native: 'true'
    - name: Require exact incoming artifact IDs
      run: test -n "${WDV3_ARTIFACT_IDS}"
      timeout-minutes: 1
    - name: Download exact current-DAG IDs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      timeout-minutes: 10
      if: env.WDV3_ARTIFACT_IDS != ''
      with:
        artifact-ids: ${{ env.WDV3_ARTIFACT_IDS }}
        path: .wdv3
        merge-multiple: true
        skip-decompress: true
        digest-mismatch: error
    - name: Qualification
      run: python -m three_workflow_delivery_v3.ruby_operation_cli qualification --output .wdv3/qualification.json
      timeout-minutes: 10
      id: qualification
    - name: Persist and read back qualification
      uses: ./.github/actions/workflow-delivery-v3-ruby-operation-record
      timeout-minutes: 10
      with:
        role: qualification
        path: .wdv3/qualification.json
    - name: Require passed current original qualification
      run: test "${QUALIFICATION_RESULT}" = passed
      env:
        QUALIFICATION_RESULT: ${{ steps.qualification.outputs.qualification-result }}
      timeout-minutes: 1
    - name: Export
      run: python -m three_workflow_delivery_v3.ruby_operation_cli export
      timeout-minutes: 10
      id: edges
      if: always()
    outputs:
      references: ${{ steps.edges.outputs.references }}
      artifact-ids: ${{ steps.edges.outputs.artifact-ids }}
      qualification-result: ${{ steps.qualification.outputs.qualification-result }}
    needs: qualify-ruby-bootstrap
  prepare-ruby-bootstrap-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: &id001
      contents: read
      actions: read
      deployments: read
      packages: read
    env:
      WDV3_REFERENCES: ${{ needs.finalize-ruby-bootstrap-qualification.outputs.references && needs.finalize-ruby-bootstrap-qualification.outputs.artifact-ids
        && needs.finalize-ruby-bootstrap-qualification.outputs.references || '{}' }}
      WDV3_ARTIFACT_IDS: ${{ needs.finalize-ruby-bootstrap-qualification.outputs.references && needs.finalize-ruby-bootstrap-qualification.outputs.artifact-ids
        && needs.finalize-ruby-bootstrap-qualification.outputs.artifact-ids || '' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
    - name: Check out exact native target without credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 10
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - uses: ./.github/actions/workflow-delivery-v3-ruby-setup
      timeout-minutes: 10
      with:
        native: 'true'
    - name: Require exact incoming artifact IDs
      run: test -n "${WDV3_ARTIFACT_IDS}"
      timeout-minutes: 1
    - name: Download exact current-DAG IDs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      timeout-minutes: 10
      if: env.WDV3_ARTIFACT_IDS != ''
      with:
        artifact-ids: ${{ env.WDV3_ARTIFACT_IDS }}
        path: .wdv3
        merge-multiple: true
        skip-decompress: true
        digest-mismatch: error
    - name: Initialize
      run: python -m three_workflow_delivery_v3.ruby_operation_cli initialize
      timeout-minutes: 10
    - name: Claim   phase eligibility
      run: python -m three_workflow_delivery_v3.ruby_operation_cli claim --phase eligibility --output .wdv3/phase-eligibility.json
      timeout-minutes: 10
    - name: Persist and read back phase-eligibility
      uses: ./.github/actions/workflow-delivery-v3-ruby-operation-record
      timeout-minutes: 10
      with:
        role: phase-eligibility
        path: .wdv3/phase-eligibility.json
    - name: Observe
      run: python -m three_workflow_delivery_v3.ruby_operation_cli observe --output .wdv3/absence.json
      timeout-minutes: 10
    - name: Persist and read back absence
      uses: ./.github/actions/workflow-delivery-v3-ruby-operation-record
      timeout-minutes: 10
      with:
        role: absence
        path: .wdv3/absence.json
    - name: Summary
      run: python -m three_workflow_delivery_v3.ruby_operation_cli summary --output .wdv3/approval-summary.txt
      timeout-minutes: 10
    - name: Persist and read back summary
      uses: ./.github/actions/workflow-delivery-v3-ruby-operation-record
      timeout-minutes: 10
      with:
        role: summary
        path: .wdv3/approval-summary.txt
    - name: Bundle
      run: python -m three_workflow_delivery_v3.ruby_operation_cli bundle --output .wdv3/approval-bundle.json
      timeout-minutes: 10
    - name: Persist and read back bundle
      uses: ./.github/actions/workflow-delivery-v3-ruby-operation-record
      timeout-minutes: 10
      with:
        role: bundle
        path: .wdv3/approval-bundle.json
    - name: Audit
      run: python -m three_workflow_delivery_v3.ruby_operation_cli audit --output .wdv3/audit-prepare.json
      timeout-minutes: 10
      id: audit
      if: always()
    - name: Persist and read back audit-prepare
      uses: ./.github/actions/workflow-delivery-v3-ruby-operation-record
      timeout-minutes: 10
      with:
        role: audit-prepare
        path: .wdv3/audit-prepare.json
      if: always() && steps.audit.outcome == 'success'
    - name: Export
      run: python -m three_workflow_delivery_v3.ruby_operation_cli export
      timeout-minutes: 10
      id: edges
      if: always()
    outputs:
      references: ${{ steps.edges.outputs.references }}
      artifact-ids: ${{ steps.edges.outputs.artifact-ids }}
      action-required: 'true'
    needs:
    - request-ruby-operation
    - finalize-ruby-bootstrap-qualification
  publish-ruby-bootstrap-github-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      deployments: read
      packages: write
    env:
      WDV3_REFERENCES: ${{ needs.prepare-ruby-bootstrap-publication.outputs.references && needs.prepare-ruby-bootstrap-publication.outputs.artifact-ids
        && needs.prepare-ruby-bootstrap-publication.outputs.references || '{}' }}
      WDV3_ARTIFACT_IDS: ${{ needs.prepare-ruby-bootstrap-publication.outputs.references && needs.prepare-ruby-bootstrap-publication.outputs.artifact-ids
        && needs.prepare-ruby-bootstrap-publication.outputs.artifact-ids || '' }}
      GITHUB_TOKEN: ${{ github.token }}
      WDV3_ENVIRONMENT_SENTINEL: ${{ vars.WDV3_APPROVAL_ENVIRONMENT_MARKER }}
    steps:
    - name: Check out exact native target without credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 10
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
        submodules: false
        lfs: false
    - uses: ./.github/actions/workflow-delivery-v3-ruby-setup
      timeout-minutes: 10
      with:
        native: 'true'
    - name: Require exact incoming artifact IDs
      run: test -n "${WDV3_ARTIFACT_IDS}"
      timeout-minutes: 1
    - name: Download exact current-DAG IDs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      timeout-minutes: 10
      if: env.WDV3_ARTIFACT_IDS != ''
      with:
        artifact-ids: ${{ env.WDV3_ARTIFACT_IDS }}
        path: .wdv3
        merge-multiple: true
        skip-decompress: true
        digest-mismatch: error
    - name: Initialize
      run: python -m three_workflow_delivery_v3.ruby_operation_cli initialize
      timeout-minutes: 10
    - name: Authorize
      run: python -m three_workflow_delivery_v3.ruby_operation_cli authorize --output .wdv3/authorization.json
      timeout-minutes: 10
    - name: Persist and read back authorization
      uses: ./.github/actions/workflow-delivery-v3-ruby-operation-record
      timeout-minutes: 10
      with:
        role: authorization
        path: .wdv3/authorization.json
    - name: Claim   phase pre marker
      run: python -m three_workflow_delivery_v3.ruby_operation_cli claim --phase pre-marker --output .wdv3/phase-pre-marker.json
      timeout-minutes: 10
    - name: Persist and read back phase-pre-marker
      uses: ./.github/actions/workflow-delivery-v3-ruby-operation-record
      timeout-minutes: 10
      with:
        role: phase-pre-marker
        path: .wdv3/phase-pre-marker.json
    - name: Marker
      run: python -m three_workflow_delivery_v3.ruby_operation_cli marker --output .wdv3/mutation-marker.json
      timeout-minutes: 10
    - name: Persist and read back marker
      uses: ./.github/actions/workflow-delivery-v3-ruby-operation-record
      timeout-minutes: 10
      with:
        role: marker
        path: .wdv3/mutation-marker.json
    - name: Claim   phase execute
      run: python -m three_workflow_delivery_v3.ruby_operation_cli claim --phase execute --output .wdv3/phase-execute.json
      timeout-minutes: 10
    - name: Persist and read back phase-execute
      uses: ./.github/actions/workflow-delivery-v3-ruby-operation-record
      timeout-minutes: 10
      with:
        role: phase-execute
        path: .wdv3/phase-execute.json
    - name: Execute
      run: python -m three_workflow_delivery_v3.ruby_operation_cli execute --output .wdv3/result.json
      timeout-minutes: 10
      id: execute
    - name: Persist and read back result
      uses: ./.github/actions/workflow-delivery-v3-ruby-operation-record
      timeout-minutes: 10
      with:
        role: result
        path: .wdv3/result.json
    - name: Require verified original publication
      run: test "${PUBLICATION_RESULT}" = published
      env:
        PUBLICATION_RESULT: ${{ steps.execute.outputs.publication-result }}
      timeout-minutes: 1
    - name: Audit
      run: python -m three_workflow_delivery_v3.ruby_operation_cli audit --output .wdv3/audit-publisher.json
      timeout-minutes: 10
      id: audit
      if: always()
    - name: Persist and read back audit-publisher
      uses: ./.github/actions/workflow-delivery-v3-ruby-operation-record
      timeout-minutes: 10
      with:
        role: audit-publisher
        path: .wdv3/audit-publisher.json
      if: always() && steps.audit.outcome == 'success'
    - name: Export
      run: python -m three_workflow_delivery_v3.ruby_operation_cli export
      timeout-minutes: 10
      id: edges
      if: always()
    outputs:
      references: ${{ steps.edges.outputs.references }}
      artifact-ids: ${{ steps.edges.outputs.artifact-ids }}
      publication-step-outcome: ${{ steps.execute.outcome }}
      terminal-reference: ${{ steps.edges.outputs.terminal-reference }}
    needs:
    - request-ruby-operation
    - prepare-ruby-bootstrap-publication
    if: needs.prepare-ruby-bootstrap-publication.result == 'success' && needs.prepare-ruby-bootstrap-publication.outputs.action-required
      == 'true' && needs.request-ruby-operation.outputs.destination == 'github-packages'
    environment:
      name: ${{ needs.request-ruby-operation.outputs.environment }}
  publish-ruby-bootstrap-rubygems:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    env:
      WDV3_REFERENCES: ${{ needs.prepare-ruby-bootstrap-publication.outputs.references && needs.prepare-ruby-bootstrap-publication.outputs.artifact-ids
        && needs.prepare-ruby-bootstrap-publication.outputs.references || '{}' }}
      WDV3_ARTIFACT_IDS: ${{ needs.prepare-ruby-bootstrap-publication.outputs.references && needs.prepare-ruby-bootstrap-publication.outputs.artifact-ids
        && needs.prepare-ruby-bootstrap-publication.outputs.artifact-ids || '' }}
      GITHUB_TOKEN: ${{ github.token }}
      WDV3_ENVIRONMENT_SENTINEL: ${{ vars.WDV3_APPROVAL_ENVIRONMENT_MARKER }}
    steps:
    - name: Check out exact native target without credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 10
      with:
