name: Build Python Package (Reusable)

on:
  workflow_call:
    inputs:
      target:
        description: "Target commit SHA to build from"
        required: true
        type: string
      package_dir:
        description: "Directory containing the Python project to build"
        required: true
        type: string
      version:
        description: "Expected package version (PEP440)"
        required: true
        type: string
      python_version:
        description: "Python version for uv build"
        required: true
        type: string
      artifact_name:
        description: "Artifact name to upload out/* as"
        required: true
        type: string

jobs:
  build:
    name: Build Python package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.target }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7
        with:
          python-version: ${{ inputs.python_version }}
          cache-dependency-glob: 'uv.lock'

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          dotnet tool restore

      - name: Build package
        shell: bash
        env:
          PACKAGE_DIR: ${{ inputs.package_dir }}
        run: |
          set -Eeuo pipefail
          rm -rf "${GITHUB_WORKSPACE}/out"
          mkdir -p "${GITHUB_WORKSPACE}/out"

          cd "${PACKAGE_DIR}"
          export TZ=UTC
          export LC_ALL=C.UTF-8
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          uv build --out-dir "${GITHUB_WORKSPACE}/out"

      - name: Verify built version matches tag
        shell: bash
        env:
          EXPECTED: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          uv run --script eng/scripts/verify_python_artifact_version.py "${EXPECTED}" "${GITHUB_WORKSPACE}/out"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ github.workspace }}/out/*
          if-no-files-found: error
