name: Dependabot Auto-Approve and Auto-Merge

# SECURITY RATIONALE:
# - This workflow uses pull_request (not pull_request_target) and does not check out PR code.
# - It still has write permissions for review/merge operations, so trust invariants must stay strict:
#   1) only Dependabot-authored PRs in this repository,
#   2) only non-draft PRs,
#   3) workflow actor must be dependabot[bot],
#   4) PR head commit author must be dependabot[bot].
# If these invariants need to change, require explicit security review.
on:

  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot:
    name: Auto-approve and enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # SECURITY INVARIANTS (coarse gate):
    # Keep this aligned with the runtime validation step below.
    if: >-
      github.repository == 'hcoona/three' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Validate trusted PR invariants
        shell: bash
        env:
          EXPECTED_REPOSITORY: hcoona/three
          EXPECTED_BOT_LOGIN: dependabot[bot]
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_USER_LOGIN: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          fail() {
            echo "::error title=Refusing to run::$1"
            exit 1
          }

          [[ "${EVENT_NAME}" == "pull_request" ]] || fail "event is '${EVENT_NAME}' (expected 'pull_request')."
          [[ "${REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]] || fail "repository is '${REPOSITORY}' (expected '${EXPECTED_REPOSITORY}')."
          [[ "${PR_USER_LOGIN}" == "${EXPECTED_BOT_LOGIN}" ]] || fail "PR author is '${PR_USER_LOGIN}' (expected '${EXPECTED_BOT_LOGIN}')."
          [[ "${ACTOR}" == "${EXPECTED_BOT_LOGIN}" ]] || fail "workflow actor is '${ACTOR}' (expected '${EXPECTED_BOT_LOGIN}')."
          [[ "${HEAD_REPO}" == "${REPOSITORY}" ]] || fail "head repository is '${HEAD_REPO}' (expected '${REPOSITORY}')."
          [[ "${IS_DRAFT}" == "false" ]] || fail "pull request is draft='${IS_DRAFT}' (expected false)."

          author=$(gh api "/repos/${REPOSITORY}/commits/${HEAD_SHA}" --jq '.author.login // ""')
          [[ "${author}" == "${EXPECTED_BOT_LOGIN}" ]] || fail "PR head commit author is '${author}' (expected '${EXPECTED_BOT_LOGIN}')."

          echo "Trusted PR invariant checks passed."

      - name: Log Dependabot metadata
        shell: bash
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DIRECTORY: ${{ steps.metadata.outputs.directory }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          DEPENDENCY_TYPE: ${{ steps.metadata.outputs.dependency-type }}
        run: |
          set -Eeuo pipefail

          echo "Dependabot metadata:"
          echo "  update-type: ${UPDATE_TYPE}"
          echo "  package-ecosystem: ${PACKAGE_ECOSYSTEM}"
          echo "  directory: ${DIRECTORY}"
          echo "  dependency-names: ${DEPENDENCY_NAMES}"
          echo "  dependency-type: ${DEPENDENCY_TYPE}"

      - name: Evaluate update eligibility
        id: eligibility
        shell: bash
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -Eeuo pipefail

          eligible=false
          case "${UPDATE_TYPE}" in
            security-update|version-update:semver-patch|version-update:semver-minor)
              eligible=true
              ;;
          esac

          echo "update_type=${UPDATE_TYPE}" >> "$GITHUB_OUTPUT"
          echo "eligible=${eligible}" >> "$GITHUB_OUTPUT"

      - name: Log update eligibility
        shell: bash
        env:
          UPDATE_TYPE: ${{ steps.eligibility.outputs.update_type }}
          ELIGIBLE: ${{ steps.eligibility.outputs.eligible }}
        run: |
          set -Eeuo pipefail

          echo "Dependabot update-type: ${UPDATE_TYPE}"
          echo "Eligible for auto-approve/auto-merge: ${ELIGIBLE}"

      # This workflow intentionally skips semver-major updates.
      # If you want to auto-merge majors too, remove the `if:` guards below.
      - name: Approve PR (if not already approved)
        if: steps.eligibility.outputs.eligible == 'true'
        shell: bash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          # Avoid repeated approvals when the overall PR review decision is still REVIEW_REQUIRED
          # (e.g., multiple approvals required by branch protection).
          approved_by_actions=0
          if approved_by_actions=$(gh pr view "$PR_URL" --json latestReviews --jq '[.latestReviews[] | select(.author.login=="github-actions[bot]" and .state=="APPROVED")] | length'); then
            :
          else
            echo "Could not query latestReviews; falling back to overall reviewDecision only."
            approved_by_actions=0
          fi
          if [[ "${approved_by_actions}" -gt 0 ]]; then
            echo "github-actions[bot] already approved; skipping."
            exit 0
          fi

          decision=UNKNOWN
          if decision=$(gh pr view "$PR_URL" --json reviewDecision -q '.reviewDecision'); then
            :
          else
            echo "Could not query reviewDecision; continuing to attempt approval."
            decision=UNKNOWN
          fi
          if [[ "${decision}" == "APPROVED" ]]; then
            echo "PR already approved; skipping."
            exit 0
          fi

          if ! gh pr review --approve "$PR_URL"; then
            echo "::error title=Failed to approve PR::Could not approve the pull request using GITHUB_TOKEN."
            echo "Hint: enable repository setting 'Allow GitHub Actions to create and approve pull requests'."
            exit 1
          fi

      - name: Enable auto-merge (squash for NuGet)
        if: steps.eligibility.outputs.eligible == 'true' && steps.metadata.outputs.package-ecosystem == 'nuget'
        shell: bash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          # Requires repository settings:
          # - Allow auto-merge
          # - Allow squash merging
          if ! gh pr merge --auto --squash "$PR_URL"; then
            echo "::error title=Failed to enable auto-merge::Could not enable auto-merge (squash) for this PR."
            echo "Hint: ensure repository settings allow auto-merge and squash merging, and that branch protection requirements can be satisfied."
            exit 1
          fi

      - name: Enable auto-merge (rebase)
        if: steps.eligibility.outputs.eligible == 'true' && steps.metadata.outputs.package-ecosystem != 'nuget'
        shell: bash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          # Requires repository settings:
          # - Allow auto-merge
          # - Allow rebase merging
          if ! gh pr merge --auto --rebase "$PR_URL"; then
            echo "::error title=Failed to enable auto-merge::Could not enable auto-merge (rebase) for this PR."
            echo "Hint: ensure repository settings allow auto-merge and rebase merging, and that branch protection requirements can be satisfied."
            exit 1
          fi
