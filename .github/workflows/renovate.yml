name: Renovate

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Renovate log level for this manual run.'
        type: choice
        default: info
        options:
          - info
          - debug
  issues:
    types:
      - edited

permissions: {}

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Run Renovate
    runs-on: windows-latest
    if: >-
      ${{
        github.event_name != 'issues' ||
        (
          github.event.action == 'edited' &&
          github.event.issue.title == 'Dependency Dashboard' &&
          github.event.issue.user.login == 'shuai-s-private-renovate-app[bot]' &&
          github.event.issue.user.type == 'Bot' &&
          !github.event.issue.pull_request &&
          github.event.changes.body &&
          github.event.sender.type != 'Bot'
        )
      }}
    permissions:
      contents: read
    env:
      RENOVATE_VERSION: 43.150.0
      GIT_LFS_SKIP_SMUDGE: 1
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          experimental: true
          install: false

      - name: Install post-upgrade tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          mise install pkl powershell pnpm uv ruby
          mise reshim

          gem install bundler -v 2.4.20 --no-document
          gem install bundler -v 2.7.2 --no-document

          command -v mise
          command -v pkl
          command -v pwsh
          command -v dotnet
          command -v node
          command -v pnpm
          command -v uv
          command -v ruby
          command -v gem
          command -v bundle
          pkl --version
          pwsh -NoLogo -NoProfile -NonInteractive -Command "\$PSVersionTable.PSVersion.ToString()"
          dotnet --version
          node --version
          pnpm --version
          uv --version
          ruby --version
          gem --version
          bundle _2.4.20_ --version
          bundle _2.7.2_ --version

      - name: Install Renovate CLI
        run: npm install --global "renovate@${RENOVATE_VERSION}"

      - name: Create Renovate GitHub App token
        id: renovate-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.SHUAIZHANG_RENOVATE_APP_ID }}
          private-key: ${{ secrets.SHUAIZHANG_RENOVATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write

      - name: Run Renovate
        env:
          RENOVATE_CONFIG_FILE: .github/renovate/global.cjs
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'info' }}
          # The Renovate GitHub App may create dependency branches and PRs, but must not bypass branch protection.
          # Renovate automerge is controlled by renovate.json and remains subject to CI and branch protection.
          RENOVATE_TOKEN: ${{ steps.renovate-app-token.outputs.token }}
        run: renovate
