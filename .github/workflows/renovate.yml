name: Renovate

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Renovate log level for this manual run.'
        type: choice
        default: info
        options:
          - info
          - debug
  issues:
    types:
      - edited

permissions: {}

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Run Renovate
    runs-on: windows-2025-vs2026
    if: >-
      ${{
        github.event_name != 'issues' ||
        (
          github.event.action == 'edited' &&
          github.event.issue.title == 'Dependency Dashboard' &&
          github.event.issue.user.login == 'shuai-s-private-renovate-app[bot]' &&
          github.event.issue.user.type == 'Bot' &&
          !github.event.issue.pull_request &&
          github.event.changes.body &&
          github.event.sender.type != 'Bot'
        )
      }}
    permissions:
      contents: read
    env:
      RENOVATE_VERSION: 43.200.1
      RENOVATE_BASE_DIR: ${{ github.workspace }}/../renovate
      GIT_LFS_SKIP_SMUDGE: 1
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git LFS for pointer-only clones
        run: |
          set -Eeuo pipefail

          # Renovate performs its own clone, so configure the runner globally.
          git lfs install --skip-smudge --skip-repo --force

      - name: Seed Renovate repository with full clone
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $repositoryPath = Join-Path $env:RENOVATE_BASE_DIR "repos/github/$env:GITHUB_REPOSITORY"
          New-Item -ItemType Directory -Path (Split-Path -Parent $repositoryPath) -Force | Out-Null
          git clone --no-local $env:GITHUB_WORKSPACE $repositoryPath

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install: false

      - name: Install post-upgrade tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          mise install --locked pkl powershell pnpm uv ruby
          mise reshim

          gem install bundler -v 2.4.20 --no-document
          gem install bundler -v 2.7.2 --no-document

          command -v mise
          command -v pkl
          command -v pwsh
          command -v dotnet
          command -v node
          command -v pnpm
          command -v uv
          command -v ruby
          command -v gem
          command -v bundle
          pkl --version
          pwsh -NoLogo -NoProfile -NonInteractive -Command "\$PSVersionTable.PSVersion.ToString()"
          dotnet --version
          node --version
          pnpm --version
          uv --version
          ruby --version
          gem --version
          bundle _2.4.20_ --version
          bundle _2.7.2_ --version

      - name: Install Renovate CLI
        run: npm install --global "renovate@${RENOVATE_VERSION}"

      - name: Force full Renovate fallback clones
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $renovateGitModule = Join-Path (& npm root --global) 'renovate/dist/util/git/index.js'
          $content = Get-Content -Path $renovateGitModule -Raw
          $needle = 'const opts = [];'
          $matchCount = ([regex]::Matches($content, [regex]::Escape($needle))).Count
          if ($matchCount -ne 1) {
            throw "Expected one Renovate clone-options initialization, but found $matchCount."
          }

          $replacement = "$needle`n`t`t`tconfig.fullClone = true;"
          Set-Content -Path $renovateGitModule -Value $content.Replace($needle, $replacement) -NoNewline
          node --check $renovateGitModule

      - name: Create Renovate GitHub App token
        id: renovate-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SHUAIZHANG_RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.SHUAIZHANG_RENOVATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write

      - name: Run Renovate
        shell: pwsh
        env:
          RENOVATE_CONFIG_FILE: .github/renovate/global.cjs
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'info' }}
          # The Renovate GitHub App may create dependency branches and PRs, but must not bypass branch protection.
          # Renovate automerge is controlled by renovate.json and remains subject to CI and branch protection.
          RENOVATE_TOKEN: ${{ steps.renovate-app-token.outputs.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $miseRoot = Join-Path $env:LOCALAPPDATA 'mise'
          $env:Path = @(
            (Join-Path $miseRoot 'shims')
            (Join-Path $miseRoot 'bin')
            $env:Path
          ) -join [System.IO.Path]::PathSeparator

          node -e @'
          const { execFileSync } = require('node:child_process');
          execFileSync('pwsh', ['-NoLogo', '-NoProfile', '-NonInteractive', '-Command', 'Get-Command mise,pkl,pwsh,pnpm,uv,ruby,bundle -ErrorAction Stop | Out-Null'], { stdio: 'inherit' });
          '@

          renovate
