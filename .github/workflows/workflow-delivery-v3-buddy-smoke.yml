name: Workflow Delivery v3 npm Buddy

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Qualify and describe without publication
        type: boolean
        default: true

env:
  DESTINATION: github-packages-npm
  DRY_RUN: ${{ inputs.dry-run }}
  RELEASE_NODE_VERSION: '24.19.0'
  RELEASE_NPM_VERSION: '11.17.0'

permissions:
  contents: read

# The native containing workflow owns the physical package through verification.
concurrency:
  group: workflow-delivery-npm.pkg.github.com-hcoona-hcoona-release-smoke-npm
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      control-id: ${{ steps.control.outputs.artifact-id }}
      preparation-id: ${{ steps.originals.outputs.artifact-id }}
    steps:
      - name: Check out selected source and control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare selected native tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: '2026.8.10'
          experimental: true
          install_args: dotnet node pnpm
      - name: Build control before product execution
        run: |
          mise exec --locked dotnet -- dotnet build src/private/app/workflow-delivery/WorkflowDelivery.csproj \
            -p:RestoreLockedMode=true -o "$RUNNER_TEMP/control"
          mise exec --locked dotnet -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs npm request
      - name: Transfer selected control before product execution
        id: control
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: buddy-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control
          if-no-files-found: error
          retention-days: 45
          overwrite: false
      - name: Prepare frozen dependencies without product scripts
        run: |
          mkdir -p "$RUNNER_TEMP/dependencies/home" "$RUNNER_TEMP/dependencies/config"
          touch "$RUNNER_TEMP/dependencies/config/auth.npmrc"
          # shellcheck disable=SC2016
          mise exec --locked node pnpm -- sh -c 'exec env -i PATH="$PATH" \
            HOME="$RUNNER_TEMP/dependencies/home" XDG_CONFIG_HOME="$RUNNER_TEMP/dependencies/config" \
            pnpm --npmrc-auth-file "$RUNNER_TEMP/dependencies/config/auth.npmrc" \
            --store-dir "$RUNNER_TEMP/dependencies/store" --state-dir "$RUNNER_TEMP/dependencies/state" \
            install --frozen-lockfile --ignore-scripts'
      - name: Qualify complete selected release
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          export MISE_DATA_DIR="${MISE_DATA_DIR:-$HOME/.local/share/mise}"
          mise exec --locked dotnet node pnpm -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" \
            release prepare-npm "$RUNNER_TEMP/prepared/request.json" > "$RUNNER_TEMP/prepared/preparation.json"
          mise exec --locked dotnet -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs npm originals
      - name: Retain complete originals and preparation results
        if: always()
        id: originals
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: buddy-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          retention-days: 45
          overwrite: false

  observe:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      write-needed: ${{ steps.state.outputs.write-needed }}
      observation-id: ${{ steps.retain.outputs.artifact-id }}
    steps:
      - name: Download selected control by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.control-id }}
          path: ${{ runner.temp }}/control
          digest-mismatch: error
      - name: Prepare native runtime without product execution
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected native runtime
        working-directory: ${{ runner.temp }}
        run: mise install --yes dotnet@10.0.401
      - name: Download complete preparation by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.preparation-id }}
          path: ${{ runner.temp }}/prepared
          digest-mismatch: error
      - name: Receive transferred preparation
        run: |
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs npm receive observation
      - name: Observe native package and original bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release observe-github-npm \
            "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/prepared" > "$RUNNER_TEMP/observation/observation.json"
      - name: Describe native state
        id: state
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs npm state
          if test "$DRY_RUN" = true; then
            mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release describe-github-npm \
              "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/observation/observation.json" \
              > "$RUNNER_TEMP/observation/dry-run.json"
          fi
      - name: Summarize dry-run and observation limits
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'observation'
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('## npm Buddy observation\n\n')
              for name in ('observation', 'dry-run'):
                  path = root / (name + '.json')
                  if path.exists() and path.stat().st_size:
                      summary.write('```json\n' + json.dumps(json.loads(path.read_text()), indent=2) + '\n```\n\n')
              summary.write('Dry run qualifies files and describes supported writes; it does not publish or establish live completion.\n')
          PYTHON
      - name: Retain actual observation
        if: always()
        id: retain
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: buddy-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observation
          if-no-files-found: error
          retention-days: 45
          overwrite: false

  publish:
    if: inputs.dry-run == false && needs.observe.outputs.write-needed == 'true'
    needs: [prepare, observe]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: workflow-delivery-v3-buddy-approval
    permissions:
      contents: read
      packages: write
    outputs:
      publication-id: ${{ steps.retain.outputs.artifact-id }}
    steps:
      - name: Download selected control by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.control-id }}
          path: ${{ runner.temp }}/control
          digest-mismatch: error
      - name: Prepare native runtime without product execution
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected native runtime
        working-directory: ${{ runner.temp }}
        run: mise install --yes dotnet@10.0.401
      - name: Download complete preparation by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.preparation-id }}
          path: ${{ runner.temp }}/prepared
          digest-mismatch: error
      - name: Receive transferred preparation
        run: |
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs npm receive publication
      - name: Prepare qualified native npm toolchain
        working-directory: ${{ runner.temp }}
        run: |
          mise install --yes "node@$RELEASE_NODE_VERSION"
          node_root="$(mise where "node@$RELEASE_NODE_VERSION")"
          toolchain="$RUNNER_TEMP/npm-tools"
          mkdir -p "$toolchain/bin" "$toolchain/home"
          ln -s "$node_root/bin/node" "$toolchain/bin/node"
          jq -n --arg node "$RELEASE_NODE_VERSION" --arg npm "$RELEASE_NPM_VERSION" \
            '{node: $node, npm: $npm}' > "$toolchain/bin/selected-tools.json"
          touch "$toolchain/user.npmrc" "$toolchain/global.npmrc"
          env -i PATH="$toolchain/bin:/usr/bin:/bin" HOME="$toolchain/home" \
            NPM_CONFIG_USERCONFIG="$toolchain/user.npmrc" NPM_CONFIG_GLOBALCONFIG="$toolchain/global.npmrc" \
            "$node_root/bin/npm" install --global --prefix "$toolchain" \
            --ignore-scripts --registry=https://registry.npmjs.org "npm@$RELEASE_NPM_VERSION"
      - name: Publish once after fresh native observation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/publisher-runtime"
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release publish-github-npm \
            "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/prepared" \
            "$RUNNER_TEMP/publisher-runtime" "$RUNNER_TEMP/npm-tools/bin" \
            > "$RUNNER_TEMP/publication/publication.json"
      - name: Retain actual publication outcome
        if: always()
        id: retain
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: buddy-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
          if-no-files-found: error
          retention-days: 45
          overwrite: false

  verify:
    if: >-
      always() && !cancelled() && inputs.dry-run == false &&
      needs.prepare.result == 'success' && needs.observe.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    needs: [prepare, observe, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Download selected control by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.control-id }}
          path: ${{ runner.temp }}/control
          digest-mismatch: error
      - name: Prepare native runtime without product execution
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected native runtime
        working-directory: ${{ runner.temp }}
        run: mise install --yes dotnet@10.0.401
      - name: Download complete preparation by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.preparation-id }}
          path: ${{ runner.temp }}/prepared
          digest-mismatch: error
      - name: Receive transferred preparation
        run: |
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs npm receive verification
      - name: Download initial observation by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.observe.outputs.observation-id }}
          path: ${{ runner.temp }}/observation
          digest-mismatch: error
      - name: Download actual publication result when required
        if: needs.observe.outputs.write-needed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.publish.outputs.publication-id }}
          path: ${{ runner.temp }}/publication
          digest-mismatch: error
      - name: Verify registry coordinate and original bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WRITE_NEEDED: ${{ needs.observe.outputs.write-needed }}
        run: |
          control="$RUNNER_TEMP/control/WorkflowDelivery.dll"
          prepared="$RUNNER_TEMP/prepared/preparation.json"
          # A handled conflicting or unknown observation remains typed completion input.
          status=0
          mise exec dotnet@10.0.401 -- dotnet "$control" release observe-github-npm \
            "$prepared" "$RUNNER_TEMP/prepared" > "$RUNNER_TEMP/verification/final.json" || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          publication=-
          if test "$WRITE_NEEDED" = true; then publication="$RUNNER_TEMP/publication/publication.json"; fi
          mise exec dotnet@10.0.401 -- dotnet "$control" release complete-github-npm \
            "$prepared" "$RUNNER_TEMP/observation/observation.json" \
            "$RUNNER_TEMP/verification/final.json" "$publication" > "$RUNNER_TEMP/verification/outcome.json"
      - name: Show actual available business results
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'verification'
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('## npm Buddy result\n\n')
              for name in ('final', 'outcome'):
                  path = root / (name + '.json')
                  if not path.exists() or not path.stat().st_size:
                      summary.write(name + ': required result unavailable.\n\n')
                  else:
                      summary.write('```json\n' + json.dumps(json.loads(path.read_text()), indent=2) + '\n```\n\n')
          PYTHON
      - name: Retain required verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: buddy-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
          retention-days: 45
          overwrite: false
