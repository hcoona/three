name: Create GitHub Release (Reusable)

on:
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag name to create/update (e.g. release/<project>/v<version>)'
        required: true
        type: string
      target:
        description: 'Target commit SHA that the tag/release should point to'
        required: true
        type: string
      release_title:
        description: 'GitHub Release title'
        required: true
        type: string
      notes_artifact_name:
        description: 'Workflow artifact name that contains release-notes.md'
        required: true
        type: string
      dist_artifact_name:
        description: 'Workflow artifact name that contains release assets (typically files under out/)'
        required: true
        type: string
      prerelease:
        description: 'Whether to mark the GitHub Release as a prerelease'
        required: true
        type: boolean
      force_update_tag:
        description: 'Allow force-updating the tag when it already exists and points to a different commit'
        required: false
        default: false
        type: boolean
      publish_mode:
        description: 'Planner-frozen GitHub Release publish mode: create-only, overwrite-mutable, or replace-authoritative'
        required: false
        default: create-only
        type: string
      channel:
        description: 'Release channel label used for buddy rerun fail-closed guard'
        required: true
        type: string
      planner_profile:
        description: 'Planner profile used for release-plan authorization (official or buddy)'
        required: true
        type: string
      attestation_source_sha:
        description: 'Workflow/source commit SHA expected in GitHub Artifact Attestation source-digest values'
        required: true
        type: string
      enable_attestation:
        description: 'Whether GitHub attestations are enabled for this release run'
        required: false
        default: false
        type: boolean
      asset_labels_json:
        description: 'Planner-frozen JSON object mapping GitHub Release asset basenames to labels'
        required: false
        default: '{}'
        type: string
      asset_names_json:
        description: 'Planner-frozen JSON array of GitHub Release asset basenames to upload; empty means upload all staged files'
        required: false
        default: '[]'
        type: string
      plan_artifact_name:
        description: 'Planner-produced release-plan artifact required to bind GitHub Release asset mutation to the planned handoff'
        required: false
        default: ''
        type: string
      execution_sets_artifact_name:
        description: 'Planner-produced execution-sets artifact required to bind GitHub Release coverage authorization to the frozen planner handoff'
        required: false
        default: ''
        type: string
      active_github_release_node_ids_json:
        description: 'Planner-produced active GitHub Release publish-node ids for destructive mutation authorization'
        required: false
        default: '[]'
        type: string

jobs:
  reject-buddy-reruns:
    name: Reject buddy rerun attempts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Fail buddy rerun attempts
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ "${CHANNEL}" == "buddy" && "${RUN_ATTEMPT}" != "1" ]]; then
            echo "buddy GitHub Release side-effect jobs are single-attempt only; rerun attempts must fail closed before protected environments." >&2
            exit 1
          fi

  create-release:
    name: Create or update GitHub Release
    runs-on: ubuntu-latest
    needs: reject-buddy-reruns
    if: ${{ !(inputs.channel == 'buddy' && github.run_attempt != 1) }}
    environment: github-release
    concurrency:
      group: github-release/${{ github.repository }}/${{ inputs.tag_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - name: Fail buddy rerun attempts
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ "${CHANNEL}" == "buddy" && "${RUN_ATTEMPT}" != "1" ]]; then
            echo "buddy release side-effect jobs are single-attempt only; rerun attempts must fail closed before mutation." >&2
            exit 1
          fi

      - name: Fail unsupported buddy GitHub Release proof mode
        if: ${{ inputs.channel == 'buddy' && !inputs.enable_attestation }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "buddy GitHub Release publishing is unsupported while enable_attestation=false; GitHub Release asset proof generation requires verified GitHub attestations. Refusing before release mutation." >&2
          exit 1

      - name: Checkout trusted control-plane
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.attestation_source_sha }}

      - name: Checkout release target data
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.target }}
          path: .three-workflow-release/target

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.10.9'

      - name: Download release notes artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.notes_artifact_name }}
          path: ${{ runner.temp }}/release-notes

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.dist_artifact_name }}
          path: ${{ runner.temp }}/release-dist

      - name: Download producer release asset receipts
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.dist_artifact_name }}-asset-receipts
          path: ${{ runner.temp }}/release-asset-receipts

      - name: Download release plan artifact for mutation authorization
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: ${{ runner.temp }}/release-plan

      - name: Download execution sets artifact for coverage authorization
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.execution_sets_artifact_name }}
          path: ${{ runner.temp }}/release-execution-sets

      - name: Normalize release payload
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          NOTES_ARTIFACT_NAME: ${{ inputs.notes_artifact_name }}
          DIST_ARTIFACT_NAME: ${{ inputs.dist_artifact_name }}
          ASSET_NAMES_JSON: ${{ inputs.asset_names_json }}
          PLAN_ARTIFACT_NAME: ${{ inputs.plan_artifact_name }}
          EXECUTION_SETS_ARTIFACT_NAME: ${{ inputs.execution_sets_artifact_name }}
          ACTIVE_GITHUB_RELEASE_NODE_IDS_JSON: ${{ inputs.active_github_release_node_ids_json }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail

          asset_dir="${RUNNER_TEMP_DIR}/release-assets"
          rm -rf "${asset_dir}"
          mkdir -p "${asset_dir}"

          # Notes
          notes_dir="${RUNNER_TEMP_DIR}/release-notes"
          notes_file=""
          if [[ -f "${notes_dir}/release-notes.md" ]]; then
            notes_file="${notes_dir}/release-notes.md"
          else
            notes_file=$(find "${notes_dir}" -maxdepth 3 -name 'release-notes.md' -print -quit || true)
          fi

          if [[ -z "${notes_file}" || ! -f "${notes_file}" ]]; then
            echo "release-notes.md not found in notes artifact '${NOTES_ARTIFACT_NAME}'." >&2
            exit 1
          fi

          echo "NOTES_FILE=${notes_file}" >> "${GITHUB_ENV}"

          # Dist
          dist_root="${RUNNER_TEMP_DIR}/release-dist"
          src="${dist_root}"
          if [[ -d "${dist_root}/out" ]]; then
            src="${dist_root}/out"
          fi
          receipt_file="${RUNNER_TEMP_DIR}/release-asset-receipts/release-asset-receipts.json"
          plan_path="${RUNNER_TEMP_DIR}/release-plan/release-plan.json"
          if [[ -z "${PLAN_ARTIFACT_NAME}" || ! -f "${plan_path}" ]]; then
            echo "GitHub Release mutation requires downloaded planner release-plan handoff evidence; direct or unset calls fail closed." >&2
            exit 1
          fi
          execution_sets_path="${RUNNER_TEMP_DIR}/release-execution-sets/execution-sets.json"
          if [[ -z "${EXECUTION_SETS_ARTIFACT_NAME}" || ! -f "${execution_sets_path}" ]]; then
            echo "GitHub Release mutation requires downloaded planner execution-sets handoff evidence; direct or unset calls fail closed." >&2
            exit 1
          fi
          node_ids_file="${RUNNER_TEMP_DIR}/active-github-release-node-ids-normalize.json"
          printf '%s' "${ACTIVE_GITHUB_RELEASE_NODE_IDS_JSON}" > "${node_ids_file}"
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' "${node_ids_file}" >/dev/null; then
            echo "active_github_release_node_ids_json must be a non-empty JSON array to bind producer receipts to planned GitHub Release assets." >&2
            exit 1
          fi
          if [[ ! -f "${receipt_file}" ]]; then
            echo "Independent release asset receipt artifact '${DIST_ARTIFACT_NAME}-asset-receipts' is required before GitHub Release mutation; dist-embedded receipts are not authoritative." >&2
            exit 1
          fi
          receipt_all_normalized="${RUNNER_TEMP_DIR}/producer-release-assets.json"
          receipt_normalized="${RUNNER_TEMP_DIR}/expected-release-assets.json"
          receipt_coverage_normalized="${RUNNER_TEMP_DIR}/expected-release-coverage-assets.json"
          if ! jq -e '
            type == "array"
            and length > 0
            and all(.[]; type == "object"
              and ((.name | type) == "string" and (.name | length) > 0 and (.name | contains("/") | not))
              and ((.size | type) == "number" and .size >= 0 and (.size | floor) == .size)
              and ((.sha256 | type) == "string" and (.sha256 | test("^[0-9a-f]{64}$"))))
          ' "${receipt_file}" >/dev/null; then
            echo "producer release asset receipts must be a non-empty array of {name,size,sha256} entries." >&2
            exit 1
          fi
          jq -S 'sort_by(.name)' "${receipt_file}" > "${receipt_all_normalized}"
          if [[ "$(jq -r 'map(.name) | unique | length' "${receipt_all_normalized}")" != "$(jq -r 'length' "${receipt_all_normalized}")" ]]; then
            echo "producer release asset receipts contain duplicate asset names." >&2
            exit 1
          fi

          # Copy only actual publish-node assets from the downloaded dist
          # artifact into fresh staging. Same-release skip-satisfied siblings
          # remain coverage-only and must not be mutated by this executor.
          asset_names_file="${RUNNER_TEMP_DIR}/planned-release-asset-names.json"
          printf '%s' "${ASSET_NAMES_JSON}" > "${asset_names_file}"
          if ! jq -e 'type == "array" and all(.[]; type == "string" and length > 0)' "${asset_names_file}" >/dev/null; then
            echo "asset_names_json must be a JSON array of non-empty asset basenames." >&2
            exit 1
          fi
          uv run python eng/scripts/workflow_release_control.py validate-github-release-coverage \
            --plan "${plan_path}" \
            --execution-sets "${execution_sets_path}" \
            --tag "${TAG_NAME}" \
            --active-github-release-node-ids "${node_ids_file}" \
            --asset-names "${asset_names_file}"
          actual_asset_names_file="${RUNNER_TEMP_DIR}/actual-publish-release-asset-names.json"
          jq -c --slurpfile nodeIds "${node_ids_file}" '
            .graph["publish-nodes"] as $nodes
            | [$nodeIds[0][] as $nodeId
              | ($nodes[$nodeId] // null) as $node
              | select($node != null and $node["publish-disposition"] == "publish")
              | ($node.projection["asset-names-by-artifact-id"] // {})[]
              | select(type == "string" and length > 0)]
            | unique | sort
          ' "${plan_path}" > "${actual_asset_names_file}"
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' "${actual_asset_names_file}" >/dev/null; then
            echo "active_github_release_node_ids_json must include at least one actual GitHub Release publish asset for mutation." >&2
            exit 1
          fi
          if ! jq -e --slurpfile actualNames "${actual_asset_names_file}" '
            (($actualNames[0] - .) | length) == 0
          ' "${asset_names_file}" >/dev/null; then
            echo "Actual GitHub Release publish assets must be a subset of planner coverage asset_names_json." >&2
            exit 1
          fi
          shopt -s dotglob nullglob
          while IFS= read -r name; do
            if [[ "${name}" == */* || "${name}" == "." || "${name}" == ".." ]]; then
              echo "Actual GitHub Release publish asset names must be flat basenames: ${name}" >&2
              exit 1
            fi
            if [[ ! -f "${src}/${name}" ]]; then
              echo "Actual GitHub Release publish asset '${name}' was not found in dist artifact '${DIST_ARTIFACT_NAME}'." >&2
              exit 1
            fi
            if ! jq -e --arg name "${name}" 'any(.[]; .name == $name)' "${receipt_all_normalized}" >/dev/null; then
              echo "Actual GitHub Release publish asset '${name}' is missing from producer release asset receipts." >&2
              exit 1
            fi
            cp -a "${src}/${name}" "${asset_dir}/"
          done < <(jq -r '.[]' "${actual_asset_names_file}")
          staged_asset_names_file="${RUNNER_TEMP_DIR}/staged-release-asset-names.json"
          find "${asset_dir}" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
            | sort \
            | jq -R -s 'split("\n") | map(select(length > 0))' \
            > "${staged_asset_names_file}"
          if ! jq -e --slurpfile names "${staged_asset_names_file}" '
            map(.name) as $receiptNames
            | ($names[0] | length) > 0
            and all($names[0][]; . as $name | ($receiptNames | index($name)) != null)
          ' "${receipt_all_normalized}" >/dev/null; then
            echo "Every staged GitHub Release asset must have a matching producer release asset receipt." >&2
            exit 1
          fi
          jq -S --slurpfile names "${staged_asset_names_file}" '
            map(select(.name as $name | ($names[0] | index($name)) != null)) | sort_by(.name)
          ' "${receipt_all_normalized}" > "${receipt_normalized}"
          # Current producer receipts cover actual publish assets only. Coverage-only
          # skip-satisfied assets are validated from the observed release payload and
          # proof sidecars after the existing release is inspected.
          jq -S --slurpfile names "${actual_asset_names_file}" '
            map(select(.name as $name | ($names[0] | index($name)) != null)) | sort_by(.name)
          ' "${receipt_all_normalized}" > "${receipt_coverage_normalized}"
          {
            echo "ASSET_DIR=${asset_dir}"
            echo "EXPECTED_ASSET_RECEIPTS=${receipt_normalized}"
            echo "EXPECTED_COVERAGE_ASSET_RECEIPTS=${receipt_coverage_normalized}"
          } >> "${GITHUB_ENV}"

      - name: Verify GitHub Release asset attestations before mutation
        shell: bash
        env:
          ACTIVE_GITHUB_RELEASE_NODE_IDS_JSON: ${{ inputs.active_github_release_node_ids_json }}
          ASSET_DIR: ${{ env.ASSET_DIR }}
          ATTESTATION_SOURCE_SHA: ${{ inputs.attestation_source_sha }}
          EXPECTED_ASSET_RECEIPTS: ${{ env.EXPECTED_ASSET_RECEIPTS }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
          if [[ ! "${ATTESTATION_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "attestation_source_sha must be a 40-character lowercase hex SHA before GitHub Release mutation." >&2
            exit 1
          fi
          plan_path="${RUNNER_TEMP_DIR}/release-plan/release-plan.json"
          node_ids_file="${RUNNER_TEMP_DIR}/active-github-release-node-ids-preflight.json"
          requests_dir="${RUNNER_TEMP_DIR}/github-release-proof-preflight-requests"
          rm -rf "${requests_dir}"
          mkdir -p "${requests_dir}"
          printf '%s' "${ACTIVE_GITHUB_RELEASE_NODE_IDS_JSON}" > "${node_ids_file}"
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' "${node_ids_file}" >/dev/null; then
            echo "active_github_release_node_ids_json must be a non-empty JSON array for pre-mutation proof verification." >&2
            exit 1
          fi
          publish_node_ids_file="${RUNNER_TEMP_DIR}/actual-github-release-publish-node-ids-preflight.json"
          jq -c --slurpfile nodeIds "${node_ids_file}" '
            .graph["publish-nodes"] as $nodes
            | [$nodeIds[0][] as $nodeId
              | select(($nodes[$nodeId] // {})["publish-disposition"] == "publish")]
            | unique | sort
          ' "${plan_path}" > "${publish_node_ids_file}"
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' "${publish_node_ids_file}" >/dev/null; then
            echo "active_github_release_node_ids_json must include at least one actual GitHub Release publish node for pre-mutation proof verification." >&2
            exit 1
          fi
          while IFS= read -r node_id; do
            node_digest="$(printf '%s' "${node_id}" | sha256sum | awk '{print substr($1, 1, 24)}')"
            publish_request="${requests_dir}/publish-request-${node_digest}.json"
            asset_attestations="${requests_dir}/asset-attestations-${node_digest}.json"
            uv run python eng/scripts/workflow_release_control.py publish-request \
              --plan "${plan_path}" \
              --publish-node-id "${node_id}" \
              --run-id "${RUN_ID}" \
              --attempt "${RUN_ATTEMPT}" \
              --github-release-asset-receipts "${EXPECTED_ASSET_RECEIPTS}" \
              --github-release-assets-dir "${ASSET_DIR}" \
              --attestation-source-sha "${ATTESTATION_SOURCE_SHA}" \
              --out "${publish_request}"
            uv run python eng/scripts/workflow_release_control.py github-release-asset-attestations \
              --publish-request "${publish_request}" \
              --attestation-source-sha "${ATTESTATION_SOURCE_SHA}" \
              --repository "${REPOSITORY}" \
              --assets-dir "${ASSET_DIR}" \
              --out "${asset_attestations}"
          done < <(jq -r '.[]' "${publish_node_ids_file}")

      - name: Create or update tag + release + assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          TARGET: ${{ inputs.target }}
          PRERELEASE: ${{ inputs.prerelease }}
          FORCE_UPDATE_TAG: ${{ inputs.force_update_tag }}
          PUBLISH_MODE: ${{ inputs.publish_mode }}
          CHANNEL: ${{ inputs.channel }}
          PLANNER_PROFILE: ${{ inputs.planner_profile }}
          ATTESTATION_SOURCE_SHA: ${{ inputs.attestation_source_sha }}
          ASSET_LABELS_JSON: ${{ inputs.asset_labels_json }}
          ASSET_NAMES_JSON: ${{ inputs.asset_names_json }}
          EXPECTED_COVERAGE_ASSET_RECEIPTS: ${{ env.EXPECTED_COVERAGE_ASSET_RECEIPTS }}
          PLAN_ARTIFACT_NAME: ${{ inputs.plan_artifact_name }}
          ACTIVE_GITHUB_RELEASE_NODE_IDS_JSON: ${{ inputs.active_github_release_node_ids_json }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_CHECKOUT: ${{ github.workspace }}/.three-workflow-release/target
        run: |
          set -Eeuo pipefail

          if [[ ! "${TARGET}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Target commit SHA must be a pinned 40-character lowercase hex SHA: '${TARGET}'." >&2
            exit 1
          fi
          if ! target_sha=$(git -C "${TARGET_CHECKOUT}" rev-parse --verify 'HEAD^{commit}'); then
            echo "Invalid target commit SHA: '${TARGET}'." >&2
            exit 1
          fi
          if [[ "${target_sha}" != "${TARGET}" ]]; then
            echo "Release target data checkout resolved to ${target_sha}, not requested target ${TARGET}." >&2
            exit 1
          fi
          if [[ ! "${ATTESTATION_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "attestation_source_sha must be a 40-character lowercase hex SHA." >&2
            exit 1
          fi
          if [[ "${FORCE_UPDATE_TAG}" == "true" && "${CHANNEL}" != "official" ]]; then
            echo "force_update_tag=true is valid only for the official channel; refusing tag retarget for channel '${CHANNEL}'." >&2
            exit 1
          fi
          case "${PLANNER_PROFILE}" in
            official|buddy) ;;
            *)
              echo "planner_profile must be 'official' or 'buddy' for GitHub Release authorization." >&2
              exit 1
              ;;
          esac
          case "${PUBLISH_MODE}" in
            create-only|overwrite-mutable|replace-authoritative) ;;
            *)
              echo "Unsupported GitHub Release publish mode '${PUBLISH_MODE}'." >&2
              exit 1
              ;;
          esac
          if [[ "${PUBLISH_MODE}" == "overwrite-mutable" && "${PLANNER_PROFILE}" != "buddy" ]]; then
            echo "publish_mode=overwrite-mutable is valid only for the buddy planner profile." >&2
            exit 1
          fi
          if [[ "${PUBLISH_MODE}" == "overwrite-mutable" && "${PRERELEASE}" != "true" ]]; then
            echo "publish_mode=overwrite-mutable requires a mutable prerelease target." >&2
            exit 1
          fi
          if [[ "${PUBLISH_MODE}" == "replace-authoritative" && "${PLANNER_PROFILE}" != "official" ]]; then
            echo "publish_mode=replace-authoritative is valid only for the official planner profile." >&2
            exit 1
          fi
          if [[ "${PUBLISH_MODE}" == "replace-authoritative" && "${PRERELEASE}" != "false" ]]; then
            echo "publish_mode=replace-authoritative requires an official release target." >&2
            exit 1
          fi

          require_planner_authorized_publish() {
            local plan_path node_ids_file
            if [[ -z "${PLAN_ARTIFACT_NAME}" ]]; then
              echo "publish_mode=${PUBLISH_MODE} requires a planner release-plan artifact before GitHub Release mutation; direct or unset calls fail closed." >&2
              exit 1
            fi
            plan_path="${RUNNER_TEMP_DIR}/release-plan/release-plan.json"
            if [[ ! -f "${plan_path}" ]]; then
              echo "publish_mode=${PUBLISH_MODE} requires downloaded planner release-plan evidence before GitHub Release mutation." >&2
              exit 1
            fi
            node_ids_file="${RUNNER_TEMP_DIR}/active-github-release-node-ids.json"
            printf '%s' "${ACTIVE_GITHUB_RELEASE_NODE_IDS_JSON}" > "${node_ids_file}"
            if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' "${node_ids_file}" >/dev/null; then
              echo "active_github_release_node_ids_json must be a non-empty JSON array for ${PUBLISH_MODE} planner authorization." >&2
              exit 1
            fi
            expected_asset_names_file="${RUNNER_TEMP_DIR}/expected-authorized-asset-names.json"
            printf '%s' "${ASSET_NAMES_JSON}" > "${expected_asset_names_file}"
            if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' "${expected_asset_names_file}" >/dev/null; then
              echo "asset_names_json must be a non-empty JSON array for ${PUBLISH_MODE} planner authorization." >&2
              exit 1
            fi
            expected_asset_labels_file="${RUNNER_TEMP_DIR}/expected-authorized-asset-labels.json"
            printf '%s' "${ASSET_LABELS_JSON}" > "${expected_asset_labels_file}"
            if ! jq -e 'type == "object" and all(.[]; type == "string")' "${expected_asset_labels_file}" >/dev/null; then
              echo "asset_labels_json must be a JSON object for ${PUBLISH_MODE} planner authorization." >&2
              exit 1
            fi
            if ! jq -e \
              --slurpfile nodeIds "${node_ids_file}" \
              --slurpfile expectedNames "${expected_asset_names_file}" \
              --slurpfile expectedLabels "${expected_asset_labels_file}" \
              --arg tagName "${TAG_NAME}" \
              --arg targetSha "${target_sha}" \
              --arg publishMode "${PUBLISH_MODE}" \
              --arg plannerProfile "${PLANNER_PROFILE}" \
              --arg prerelease "${PRERELEASE}" \
              '
                def expected_state:
                  if $prerelease == "true" then "prerelease"
                  else "release"
                  end;
                def expected_profile:
                  $plannerProfile;
                def node_asset_names($node):
                  [($node.projection["asset-names-by-artifact-id"] // {})[]] | sort;
                def node_asset_labels($node):
                  ($node.projection["asset-labels-by-artifact-id"] // {}) as $labels
                  | ($node.projection["asset-names-by-artifact-id"] // {}) as $names
                  | reduce ($labels | keys[]) as $artifactId
                      ({}; . + {($names[$artifactId]): $labels[$artifactId]});
                def active_node_asset_names:
                  [
                    $nodeIds[0][] as $nodeId
                    | (.graph["publish-nodes"][$nodeId] // null) as $node
                    | select($node != null)
                    | node_asset_names($node)[]
                  ] | unique | sort;
                def active_node_asset_labels:
                  . as $plan
                  | reduce $nodeIds[0][] as $nodeId
                    ({}; ($plan.graph["publish-nodes"][$nodeId] // null) as $node
                      | if $node == null then .
                        else . + node_asset_labels($node)
                        end);
                def destructive_auth_ok($node):
                  if $publishMode == "overwrite-mutable" then
                    ($node["overwrite-mutable-authorization"].kind == "planner-validated-buddy-force"
                     and $node["overwrite-mutable-authorization"].profile == "buddy"
                     and $node["overwrite-mutable-authorization"].force == true
                     and $node["overwrite-mutable-authorization"]["remote-observation"] == "partial"
                     and $node["overwrite-mutable-authorization"].mutability == "mutable-prerelease")
                  else
                    ($node["overwrite-mutable-authorization"] == null)
                  end;
                def active_publish_node_ok($node):
                  ($node["publish-disposition"] == "publish"
                   and $node["publish-mode"] == $publishMode
                   and (($publishMode != "overwrite-mutable") or (.graph["target-instance-snapshots"][$node["target-instance-snapshot-id"]].capabilities.mutability == "mutable-prerelease"))
                   and destructive_auth_ok($node));
                def coverage_node_ok($node):
                  ($node != null
                   and $node.profile == expected_profile
                   and ($node["publish-disposition"] == "publish" or $node["publish-disposition"] == "skip-satisfied")
                   and $node["desired-publish-state"]["release-state"] == expected_state
                   and $node["resolved-publish-identity"]["release-tag"] == $tagName
                   and (.graph["target-instance-snapshots"][$node["target-instance-snapshot-id"]].family == "github-release")
                   and (if $node["publish-disposition"] == "publish" then active_publish_node_ok($node) else true end));
                . as $plan |
                .["api-version"] == "three.release.plan/v1alpha1"
                and .kind == "release-plan"
                and .envelope.profile == expected_profile
                and .envelope["commit-sha"] == $targetSha
                and (($publishMode != "overwrite-mutable") or .envelope["request-flags"].force == true)
                and (active_node_asset_names == ($expectedNames[0] | unique | sort))
                and (active_node_asset_labels == $expectedLabels[0])
                and any($nodeIds[0][]; . as $nodeId |
                 ($plan.graph["publish-nodes"][$nodeId] // null) as $node |
                 ($node != null and ($plan | active_publish_node_ok($node)))
                )
                and all($nodeIds[0][]; . as $nodeId |
                 ($plan.graph["publish-nodes"][$nodeId] // null) as $node |
                 ($plan | coverage_node_ok($node))
                )
              ' "${plan_path}" >/dev/null; then
              if [[ "${PUBLISH_MODE}" == "overwrite-mutable" ]]; then
                echo "publish_mode=overwrite-mutable requires planner-authorized buddy FORCE mutable-prerelease evidence." >&2
              elif [[ "${PUBLISH_MODE}" == "create-only" ]]; then
                echo "publish_mode=create-only requires planner-authorized active GitHub Release evidence matching channel, tag, target SHA, desired state, mode, and staged assets." >&2
              else
                echo "publish_mode=replace-authoritative requires planner-authorized official active GitHub Release evidence matching tag, target SHA, mode, and planned assets." >&2
              fi
              exit 1
            fi
          }

          require_planner_authorized_publish

          encoded_tag=$(jq -rn --arg value "${TAG_NAME}" '$value | @uri')
          tag_api_path="repos/${GITHUB_REPOSITORY}/git/ref/tags/${encoded_tag}"
          release_tag_api_path="repos/${GITHUB_REPOSITORY}/releases/tags/${encoded_tag}"
          release_plan_path="${RUNNER_TEMP_DIR}/release-plan/release-plan.json"

          verify_tag_at_expected_target() {
            local tag_ref_json ref_name current_sha object_type
            if ! tag_ref_json=$(gh api "${tag_api_path}"); then
              echo "Release tag '${TAG_NAME}' is missing; ensure-tags must create it before GitHub Release publish." >&2
              exit 1
            fi
            ref_name=$(jq -r 'if type == "object" then (.ref // "") else "" end' <<<"${tag_ref_json}")
            if [[ "${ref_name}" != "refs/tags/${TAG_NAME}" ]]; then
              echo "Git ref lookup for ${TAG_NAME} returned non-exact ref '${ref_name:-<none>}'; refusing GitHub Release publish." >&2
              exit 1
            fi
            current_sha=$(jq -r '.object.sha' <<<"${tag_ref_json}")
            object_type=$(jq -r '.object.type' <<<"${tag_ref_json}")
            if [[ "${object_type}" == "tag" ]]; then
              current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${current_sha}" --jq '.object.sha')
            fi
            if [[ "${current_sha}" != "${target_sha}" ]]; then
              echo "Release tag '${TAG_NAME}' points to ${current_sha}, not ${target_sha}; ensure-tags must converge tags before GitHub Release publish." >&2
              exit 1
            fi
            echo "Verified tag ${TAG_NAME} already points to ${target_sha}."
          }

          verify_tag_at_expected_target

          FILES=()
          asset_labels_file="${RUNNER_TEMP_DIR}/asset-labels.json"
          printf '%s' "${ASSET_LABELS_JSON}" > "${asset_labels_file}"
          if ! jq -e 'type == "object" and all(.[]; type == "string")' "${asset_labels_file}" >/dev/null; then
            echo "asset_labels_json must be a JSON object whose values are strings." >&2
            exit 1
          fi
          shopt -s nullglob
          for f in "${ASSET_DIR}"/*; do
            if [[ "${f}" == *.gitignore ]]; then
              continue
            fi

            if [[ -d "${f}" ]]; then
              echo "Error: release assets must be files only (flat layout). Found directory: ${f}" >&2
              echo "Please pack directories into a single archive (zip/tar) before uploading." >&2
              exit 1
            fi

            if [[ -f "${f}" ]]; then
              FILES+=("${f}")
            fi
          done

          planned_manifest="${RUNNER_TEMP_DIR}/planned-assets.tsv"
          coverage_manifest="${RUNNER_TEMP_DIR}/planned-coverage-assets.tsv"
          coverage_manifest_base="${RUNNER_TEMP_DIR}/planned-coverage-assets-base.tsv"
          coverage_asset_names_file="${RUNNER_TEMP_DIR}/planned-coverage-asset-names.json"
          coverage_asset_names_txt="${RUNNER_TEMP_DIR}/planned-coverage-asset-names.txt"
          planned_asset_names_txt="${RUNNER_TEMP_DIR}/planned-asset-names.txt"
          coverage_only_asset_names="${RUNNER_TEMP_DIR}/planned-coverage-only-asset-names.txt"
          : > "${planned_manifest}"
          for f in "${FILES[@]}"; do
            name=$(basename "${f}")
            size=$(stat -c '%s' "${f}")
            digest=$(sha256sum "${f}" | awk '{print $1}')
            label=$(jq -r --arg name "${name}" '.[$name] // ""' "${asset_labels_file}")
            label_b64=$(printf '%s' "${label}" | base64 -w0)
            printf '%s\t%s\t%s\t%s\n' "${name}" "${size}" "${digest}" "${label_b64}" >> "${planned_manifest}"
          done
          sort -o "${planned_manifest}" "${planned_manifest}"
          printf '%s' "${ASSET_NAMES_JSON}" > "${coverage_asset_names_file}"
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' "${coverage_asset_names_file}" >/dev/null; then
            echo "asset_names_json must be a non-empty JSON array for GitHub Release coverage validation." >&2
            exit 1
          fi
          jq -r '.[]' "${coverage_asset_names_file}" | sort -u > "${coverage_asset_names_txt}"
          cut -f1 "${planned_manifest}" | sort -u > "${planned_asset_names_txt}"
          if [[ -n "$(comm -23 "${planned_asset_names_txt}" "${coverage_asset_names_txt}")" ]]; then
            echo "Actual GitHub Release publish assets must be covered by asset_names_json." >&2
            exit 1
          fi
          comm -23 "${coverage_asset_names_txt}" "${planned_asset_names_txt}" > "${coverage_only_asset_names}"
          jq -r --argfile labels "${asset_labels_file}" '
            .[]
            | . as $receipt
            | ($labels[$receipt.name] // "") as $label
            | [$receipt.name, ($receipt.size | tostring), $receipt.sha256, ($label | @base64)]
            | @tsv
          ' "${EXPECTED_COVERAGE_ASSET_RECEIPTS}" | sort > "${coverage_manifest_base}"
          cp "${coverage_manifest_base}" "${coverage_manifest}"
          unknown_labels="$(
            comm -23 \
              <(jq -r 'keys[]' "${asset_labels_file}" | sort) \
              "${coverage_asset_names_txt}"
          )"
          if [[ -n "${unknown_labels}" ]]; then
            echo "asset_labels_json contains labels for assets that are not in the planned GitHub Release coverage set:" >&2
            printf '%s\n' "${unknown_labels}" >&2
            exit 1
          fi
          expected_manifest="${RUNNER_TEMP_DIR}/expected-assets.tsv"
          jq -r '.[] | [.name, (.size | tostring), .sha256] | @tsv' "${EXPECTED_ASSET_RECEIPTS}" | sort > "${expected_manifest}"
          staged_manifest="${RUNNER_TEMP_DIR}/staged-assets.tsv"
          cut -f1-3 "${planned_manifest}" | sort > "${staged_manifest}"
          if ! diff -u "${expected_manifest}" "${staged_manifest}"; then
            echo "Staged GitHub Release assets do not match build receipt names, sizes, and SHA-256 digests; refusing mutation before upload or convergence." >&2
            exit 1
          fi

          is_coverage_observed_proof_sidecar_name() {
            local name="$1"
            [[ "${name}" =~ ^release-github-release-asset-proof-v1-[0-9a-f]{24}-[1-9][0-9]*-[1-9][0-9]*[.]json$ ]]
          }

          record_coverage_only_proof_sidecar() {
            local proof_path="$1"
            local coverage_file="$2"
            local publish_node_id artifact_id asset_name
            publish_node_id=$(jq -r '.binding["publish-node-id"]' "${proof_path}")
            artifact_id=$(jq -r '.binding["artifact-id"]' "${proof_path}")
            asset_name=$(jq -r '.binding["asset-name"]' "${proof_path}")
            if [[ -z "${publish_node_id}" || "${publish_node_id}" == "null" || -z "${artifact_id}" || "${artifact_id}" == "null" || -z "${asset_name}" || "${asset_name}" == "null" ]]; then
              echo "Validated GitHub Release asset proof sidecar is missing binding coverage." >&2
              exit 1
            fi
            if grep -Fxq "${asset_name}" "${coverage_only_asset_names}"; then
              printf '%s\t%s\t%s\n' "${publish_node_id}" "${artifact_id}" "${asset_name}" >> "${coverage_file}"
            fi
          }

          require_coverage_only_proof_sidecars() {
            local phase="$1"
            local payload_manifest="$2"
            local assets_dir="$3"
            local node_ids_file="$4"
            local expected_coverage observed_coverage proof_path proof_name
            if [[ ! -s "${coverage_only_asset_names}" ]]; then
              return 0
            fi
            expected_coverage="${RUNNER_TEMP_DIR}/coverage-only-expected-proof-sidecar-coverage.tsv"
            observed_coverage="${RUNNER_TEMP_DIR}/coverage-only-observed-proof-sidecar-coverage.tsv"
            jq -r \
              --slurpfile nodeIds "${node_ids_file}" \
              --rawfile coverageOnlyNames "${coverage_only_asset_names}" \
              '
                ($coverageOnlyNames | split("\n") | map(select(length > 0))) as $coverageOnly
                | .graph["publish-nodes"] as $nodes
                | $nodeIds[0][]
                | . as $nodeId
                | ($nodes[$nodeId] // null) as $node
                | select($node != null and $node["publish-disposition"] == "skip-satisfied")
                | ($node.projection["asset-names-by-artifact-id"] // {}) as $assetNames
                | ($node["artifact-ids"] // []) as $artifactIds
                | select($artifactIds | type == "array")
                | $artifactIds[]
                | select(type == "string")
                | . as $artifactId
                | ($assetNames[$artifactId] // null) as $assetName
                | select($assetName != null and ($assetName | type == "string") and ($assetName | length > 0))
                | select(($coverageOnly | index($assetName)) != null)
                | [$nodeId, $artifactId, $assetName]
                | @tsv
              ' "${release_plan_path}" | sort -u > "${expected_coverage}"
            if [[ ! -s "${expected_coverage}" ]]; then
              echo "${phase} GitHub Release coverage-only assets are not backed by skip-satisfied planner nodes." >&2
              exit 1
            fi
            : > "${observed_coverage}"
            shopt -s nullglob
            for proof_path in "${assets_dir}"/release-github-release-asset-proof-v1-*.json; do
              proof_name=$(basename "${proof_path}")
              if ! is_coverage_observed_proof_sidecar_name "${proof_name}"; then
                continue
              fi
              if
                uv run python eng/scripts/workflow_release_control.py validate-github-release-asset-proof-sidecar \
                  --name "${proof_name}" \
                  --proof "${proof_path}" \
                  --plan "${release_plan_path}" \
                  --release-target-sha "${target_sha}" \
                  --active-github-release-node-ids "${node_ids_file}" \
                  --repository "${GITHUB_REPOSITORY}" \
                  --tag "${TAG_NAME}" \
                  --asset-manifest "${payload_manifest}"
              then
                record_coverage_only_proof_sidecar "${proof_path}" "${observed_coverage}"
              fi
            done
            sort -u -o "${observed_coverage}" "${observed_coverage}"
            if ! diff -u "${expected_coverage}" "${observed_coverage}"; then
              echo "${phase} GitHub Release coverage-only proof sidecars do not validate the skip-satisfied planned assets." >&2
              exit 1
            fi
          }

          merge_coverage_only_payload_manifest() {
            local phase="$1"
            local payload_manifest="$2"
            local coverage_manifest_names="${RUNNER_TEMP_DIR}/planned-coverage-manifest-names.txt"
            local name observed_line observed_name observed_size observed_sha256 _observed_label_b64 label label_b64
            cp "${coverage_manifest_base}" "${coverage_manifest}"
            while IFS= read -r name; do
              [[ -n "${name}" ]] || continue
              observed_line=$(awk -F '\t' -v n="${name}" '$1 == n {print; found=1} END {if (!found) exit 1}' "${payload_manifest}" || true)
              if [[ -z "${observed_line}" ]]; then
                echo "${phase} GitHub Release coverage-only asset '${name}' is missing from observed release payload." >&2
                exit 1
              fi
              IFS=$'\t' read -r observed_name observed_size observed_sha256 _observed_label_b64 <<<"${observed_line}"
              label=$(jq -r --arg name "${name}" '.[$name] // ""' "${asset_labels_file}")
              label_b64=$(printf '%s' "${label}" | base64 -w0)
              printf '%s\t%s\t%s\t%s\n' "${observed_name}" "${observed_size}" "${observed_sha256}" "${label_b64}" >> "${coverage_manifest}"
            done < "${coverage_only_asset_names}"
            sort -u -o "${coverage_manifest}" "${coverage_manifest}"
            cut -f1 "${coverage_manifest}" | sort -u > "${coverage_manifest_names}"
            if ! diff -u "${coverage_asset_names_txt}" "${coverage_manifest_names}"; then
              echo "${phase} GitHub Release coverage manifest does not cover the planned asset names." >&2
              exit 1
            fi
          }

          upload_arg_for_file() {
            local f="$1"
            local name label
            name=$(basename "${f}")
            label=$(jq -r --arg name "${name}" '.[$name] // ""' "${asset_labels_file}")
            if [[ -n "${label}" ]]; then
              printf '%s#%s' "${f}" "${label}"
            else
              printf '%s' "${f}"
            fi
          }

          require_overwrite_mutable_prerelease() {
            local current_json current_prerelease current_draft current_id
            if [[ "${PUBLISH_MODE}" != "overwrite-mutable" ]]; then
              return 0
            fi
            verify_tag_at_expected_target
            current_json=$(gh api "${release_tag_api_path}")
            current_id=$(jq -r '.id // empty' <<<"${current_json}")
            current_draft=$(jq -r '.draft // false' <<<"${current_json}")
            current_prerelease=$(jq -r '.prerelease // false' <<<"${current_json}")
            if [[ -z "${current_id}" ]]; then
              echo "Failed to refetch release id for mutable GitHub Release '${TAG_NAME}'." >&2
              exit 1
            fi
            if [[ "${current_draft}" == "true" || "${current_prerelease}" != "true" ]]; then
              echo "publish_mode=overwrite-mutable can mutate only an existing prerelease; '${TAG_NAME}' is no longer a mutable prerelease." >&2
              exit 1
            fi
            release_id="${current_id}"
          }

          require_replace_authoritative_prerelease() {
            local current_json current_prerelease current_draft current_id
            if [[ "${PUBLISH_MODE}" != "replace-authoritative" ]]; then
              return 0
            fi
            verify_tag_at_expected_target
            current_json=$(gh api "${release_tag_api_path}")
            current_id=$(jq -r '.id // empty' <<<"${current_json}")
            current_draft=$(jq -r '.draft // false' <<<"${current_json}")
            current_prerelease=$(jq -r '.prerelease // false' <<<"${current_json}")
            if [[ -z "${current_id}" ]]; then
              echo "Failed to refetch release id for authoritative GitHub Release '${TAG_NAME}'." >&2
              exit 1
            fi
            if [[ "${current_draft}" == "true" || "${current_prerelease}" != "true" ]]; then
              echo "publish_mode=replace-authoritative can mutate only an existing prerelease before official promotion; '${TAG_NAME}' is no longer a prerelease." >&2
              exit 1
            fi
            release_id="${current_id}"
          }

          release_exists=false
          proof_only_recovery=false
          release_json=""
          release_lookup_err="${RUNNER_TEMP_DIR}/release-lookup.err"
          if release_json=$(gh api "${release_tag_api_path}" 2>"${release_lookup_err}"); then
            release_exists=true
          elif grep -Eq 'HTTP 404|Not Found' "${release_lookup_err}"; then
            release_exists=false
          else
            echo "Failed to determine whether GitHub Release '${TAG_NAME}' already exists." >&2
            cat "${release_lookup_err}" >&2
            exit 1
          fi
          if [[ "${release_exists}" != "true" && "${PUBLISH_MODE}" != "create-only" ]]; then
            echo "GitHub Release '${TAG_NAME}' is missing but publish_mode=${PUBLISH_MODE} requires an existing release." >&2
            exit 1
          fi
          if [[ "${release_exists}" != "true" && -s "${coverage_only_asset_names}" ]]; then
            echo "GitHub Release '${TAG_NAME}' is missing but coverage-only skip-satisfied assets require existing release observation." >&2
            exit 1
          fi

          if [[ "${release_exists}" == "true" ]]; then
            verify_tag_at_expected_target
            release_id=$(jq -r '.id // empty' <<<"${release_json}")
            if [[ -z "${release_id}" ]]; then
              echo "Failed to resolve release id for tag '${TAG_NAME}'." >&2
              exit 1
            fi
            if [[ "$(jq -r '.draft // false' <<<"${release_json}")" == "true" ]]; then
              echo "Existing GitHub Release '${TAG_NAME}' is a draft; refusing automated mutation." >&2
              exit 1
            fi
            if [[ "${PUBLISH_MODE}" == "create-only" ]]; then
              current_prerelease=$(jq -r '.prerelease // false' <<<"${release_json}")
              if [[ "${current_prerelease}" != "${PRERELEASE}" ]]; then
                if [[ "${PRERELEASE}" == "false" && "${current_prerelease}" == "true" ]]; then
                  echo "Existing GitHub Release '${TAG_NAME}' remains prerelease pending GitHub Release proof sidecar finalization; continuing without early official promotion."
                else
                  echo "Existing GitHub Release '${TAG_NAME}' has prerelease=${current_prerelease}, not requested prerelease=${PRERELEASE}; publish_mode=create-only proof-only recovery refuses metadata mutation." >&2
                  exit 1
                fi
              fi
            fi

            existing_dir="${RUNNER_TEMP_DIR}/existing-release-assets"
            rm -rf "${existing_dir}"
            mkdir -p "${existing_dir}"

            existing_manifest="${RUNNER_TEMP_DIR}/existing-assets.tsv"
            : > "${existing_manifest}"
            existing_asset_index="${RUNNER_TEMP_DIR}/existing-asset-index.tsv"
            existing_asset_index_all="${RUNNER_TEMP_DIR}/existing-asset-index-all.tsv"
            existing_names_file="${RUNNER_TEMP_DIR}/existing-asset-names.txt"
            release_plan_path="${RUNNER_TEMP_DIR}/release-plan/release-plan.json"
            existing_node_ids_file="${RUNNER_TEMP_DIR}/active-github-release-node-ids-existing-assets.json"
            printf '%s' "${ACTIVE_GITHUB_RELEASE_NODE_IDS_JSON}" > "${existing_node_ids_file}"

            is_github_release_asset_proof_sidecar_name() {
              local name="$1"
              [[ "${name}" =~ ^release-github-release-asset-proof-v1-[0-9a-f]{24}-[1-9][0-9]*-[1-9][0-9]*[.]json$ ]]
            }

            valid_existing_proof_sidecar() {
              local name="$1"
              local proof_path="$2"
              if [[ ! -f "${proof_path}" ]]; then
                return 1
              fi
              uv run python eng/scripts/workflow_release_control.py validate-github-release-asset-proof-sidecar \
                --name "${name}" \
                --proof "${proof_path}" \
                --plan "${release_plan_path}" \
                --release-target-sha "${target_sha}" \
                --active-github-release-node-ids "${existing_node_ids_file}" \
                --repository "${GITHUB_REPOSITORY}" \
                --tag "${TAG_NAME}"
            }

            load_existing_assets() {
              rm -rf "${existing_dir}"
              mkdir -p "${existing_dir}"
              : > "${existing_manifest}"
              : > "${existing_asset_index}"
              : > "${existing_asset_index_all}"
              : > "${existing_names_file}"
              if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --jq '.[] | [.name, .id, ((.label // "") | @base64)] | @tsv' | sort > "${existing_asset_index_all}"; then
                echo "Failed to enumerate existing release assets for '${TAG_NAME}'." >&2
                exit 1
              fi
              cut -f1 "${existing_asset_index_all}" > "${existing_names_file}"
              mapfile -t existing_names < "${existing_names_file}"
              if [[ ${#existing_names[@]} -gt 0 ]]; then
                gh release download "${TAG_NAME}" --dir "${existing_dir}"
                for name in "${existing_names[@]}"; do
                  asset_path="${existing_dir}/${name}"
                  if [[ ! -f "${asset_path}" ]]; then
                    echo "Existing release asset '${name}' was listed by the API but was not downloaded." >&2
                    exit 1
                  fi
                  if is_github_release_asset_proof_sidecar_name "${name}" && valid_existing_proof_sidecar "${name}" "${asset_path}"; then
                    echo "Ignoring validated GitHub Release asset proof sidecar '${name}' during payload convergence."
                    continue
                  fi
                  size=$(stat -c '%s' "${asset_path}")
                  digest=$(sha256sum "${asset_path}" | awk '{print $1}')
                  label_b64=$(awk -F '\t' -v n="${name}" '$1 == n {print $3; found=1} END {if (!found) exit 1}' "${existing_asset_index_all}" || true)
                  asset_id=$(awk -F '\t' -v n="${name}" '$1 == n {print $2; found=1} END {if (!found) exit 1}' "${existing_asset_index_all}" || true)
                  printf '%s\t%s\t%s\n' "${name}" "${asset_id}" "${label_b64}" >> "${existing_asset_index}"
                  printf '%s\t%s\t%s\t%s\n' "${name}" "${size}" "${digest}" "${label_b64}" >> "${existing_manifest}"
                done
                sort -o "${existing_manifest}" "${existing_manifest}"
                sort -o "${existing_asset_index}" "${existing_asset_index}"
              fi
            }

            load_existing_assets
            require_coverage_only_proof_sidecars "Existing" "${existing_manifest}" "${existing_dir}" "${existing_node_ids_file}"
            merge_coverage_only_payload_manifest "Existing" "${existing_manifest}"

            if [[ "${PUBLISH_MODE}" == "overwrite-mutable" ]]; then
              require_overwrite_mutable_prerelease
              while IFS=$'\t' read -r name asset_id _label_b64; do
                [[ -n "${name}" ]] || continue
                planned_line=$(awk -F '\t' -v n="${name}" '$1 == n {print; found=1} END {if (!found) exit 1}' "${planned_manifest}" || true)
                existing_line=$(awk -F '\t' -v n="${name}" '$1 == n {print; found=1} END {if (!found) exit 1}' "${existing_manifest}" || true)
                if [[ -n "${planned_line}" && "${planned_line}" != "${existing_line}" ]]; then
                  echo "Deleting changed mutable GitHub Release asset '${name}'."
                  require_overwrite_mutable_prerelease
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >/dev/null
                fi
              done < "${existing_asset_index}"

              upload_files=()
              for f in "${FILES[@]}"; do
                name=$(basename "${f}")
                planned_line=$(awk -F '\t' -v n="${name}" '$1 == n {print; found=1} END {if (!found) exit 1}' "${planned_manifest}" || true)
                existing_line=$(awk -F '\t' -v n="${name}" '$1 == n {print; found=1} END {if (!found) exit 1}' "${existing_manifest}" || true)
                if [[ "${planned_line}" != "${existing_line}" ]]; then
                  upload_files+=("$(upload_arg_for_file "${f}")")
                fi
              done
              if [[ ${#upload_files[@]} -gt 0 ]]; then
                require_overwrite_mutable_prerelease
                gh release upload "${TAG_NAME}" "${upload_files[@]}"
              fi
              load_existing_assets
            fi

            if [[ "${PUBLISH_MODE}" == "replace-authoritative" ]]; then
              require_replace_authoritative_prerelease
              while IFS=$'\t' read -r name asset_id _label_b64; do
                [[ -n "${name}" ]] || continue
                coverage_line=$(awk -F '\t' -v n="${name}" '$1 == n {print; found=1} END {if (!found) exit 1}' "${coverage_manifest}" || true)
                planned_line=$(awk -F '\t' -v n="${name}" '$1 == n {print; found=1} END {if (!found) exit 1}' "${planned_manifest}" || true)
                existing_line=$(awk -F '\t' -v n="${name}" '$1 == n {print; found=1} END {if (!found) exit 1}' "${existing_manifest}" || true)
                if [[ -z "${coverage_line}" ]]; then
                  echo "Deleting extra authoritative GitHub Release asset '${name}'."
                  require_replace_authoritative_prerelease
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >/dev/null
                elif [[ -n "${planned_line}" && "${planned_line}" != "${existing_line}" ]]; then
                  echo "Deleting changed authoritative GitHub Release asset '${name}'."
                  require_replace_authoritative_prerelease
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" >/dev/null
                fi
              done < "${existing_asset_index}"

              replace_upload_files=()
              for f in "${FILES[@]}"; do
                name=$(basename "${f}")
                planned_line=$(awk -F '\t' -v n="${name}" '$1 == n {print; found=1} END {if (!found) exit 1}' "${planned_manifest}" || true)
                existing_line=$(awk -F '\t' -v n="${name}" '$1 == n {print; found=1} END {if (!found) exit 1}' "${existing_manifest}" || true)
                if [[ "${planned_line}" != "${existing_line}" ]]; then
                  replace_upload_files+=("$(upload_arg_for_file "${f}")")
                fi
              done
              if [[ ${#replace_upload_files[@]} -gt 0 ]]; then
                require_replace_authoritative_prerelease
                gh release upload "${TAG_NAME}" "${replace_upload_files[@]}"
              fi
              load_existing_assets
            fi

            if ! diff -u "${coverage_manifest}" "${existing_manifest}"; then
              echo "Existing GitHub Release assets do not exactly match planned coverage asset names, labels, sizes, and SHA-256 digests." >&2
              echo "Refusing to publish existing release '${TAG_NAME}' in publish_mode=${PUBLISH_MODE}." >&2
              exit 1
            fi
            if [[ "${PUBLISH_MODE}" == "create-only" ]]; then
              proof_only_recovery=true
              echo "Existing GitHub Release '${TAG_NAME}' payload exactly matches the planner handoff; continuing with proof-only recovery."
            fi
          fi

          verify_tag_at_expected_target
          if [[ "${release_exists}" == "true" ]]; then
            require_overwrite_mutable_prerelease
            require_replace_authoritative_prerelease
            if [[ "${proof_only_recovery}" == "true" ]]; then
              echo "Skipping existing GitHub Release metadata mutation during create-only proof-only recovery."
            else
              gh release edit "${TAG_NAME}" --title "${RELEASE_TITLE}" --notes-file "${NOTES_FILE}"
            fi
          else
            prerelease_args=()
            # Keep every new GitHub Release mutable until proof sidecars have been
            # generated and persisted; official promotion is the final side effect.
            prerelease_args+=(--prerelease)

            gh release create "${TAG_NAME}" "${prerelease_args[@]}" --verify-tag --title "${RELEASE_TITLE}" --notes-file "${NOTES_FILE}"
            if [[ ${#FILES[@]} -gt 0 ]]; then
              create_upload_files=()
              for f in "${FILES[@]}"; do
                create_upload_files+=("$(upload_arg_for_file "${f}")")
              done
              verify_tag_at_expected_target
              require_overwrite_mutable_prerelease
              gh release upload "${TAG_NAME}" "${create_upload_files[@]}"
            fi
          fi

          # Resolve release identity for result/proof generation without promoting
          # official releases; promotion happens only after proof sidecars persist.
          verify_tag_at_expected_target
          release_id=$(gh api "${release_tag_api_path}" --jq '.id')
          if [[ -z "${release_id}" ]]; then
            echo "Failed to resolve release id for tag '${TAG_NAME}'." >&2
            exit 1
          fi
          require_overwrite_mutable_prerelease
          require_replace_authoritative_prerelease

          observed_dir="${RUNNER_TEMP_DIR}/observed-release-assets"
          observed_manifest="${RUNNER_TEMP_DIR}/observed-assets.tsv"
          observed_asset_index_all="${RUNNER_TEMP_DIR}/observed-asset-index-all.tsv"
          observed_names_file="${RUNNER_TEMP_DIR}/observed-asset-names.txt"
          release_plan_path="${RUNNER_TEMP_DIR}/release-plan/release-plan.json"
          observed_node_ids_file="${RUNNER_TEMP_DIR}/active-github-release-node-ids-observed-assets.json"
          observed_publish_node_ids_file="${RUNNER_TEMP_DIR}/actual-github-release-publish-node-ids-observed-assets.json"
          expected_proof_sidecar_coverage="${RUNNER_TEMP_DIR}/expected-github-release-proof-sidecar-coverage.tsv"
          expected_proof_sidecar_asset_names="${RUNNER_TEMP_DIR}/expected-github-release-proof-sidecar-asset-names.txt"
          planned_proof_sidecar_asset_names="${RUNNER_TEMP_DIR}/planned-github-release-proof-sidecar-asset-names.txt"
          observed_valid_proof_sidecar_coverage="${RUNNER_TEMP_DIR}/observed-valid-github-release-proof-sidecar-coverage.tsv"
          printf '%s' "${ACTIVE_GITHUB_RELEASE_NODE_IDS_JSON}" > "${observed_node_ids_file}"
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' "${observed_node_ids_file}" >/dev/null; then
            echo "active_github_release_node_ids_json must be a non-empty JSON array for observed GitHub Release result generation." >&2
            exit 1
          fi
          jq -c --slurpfile nodeIds "${observed_node_ids_file}" '
            .graph["publish-nodes"] as $nodes
            | [$nodeIds[0][] as $nodeId
              | select(($nodes[$nodeId] // {})["publish-disposition"] == "publish")]
            | unique | sort
          ' "${release_plan_path}" > "${observed_publish_node_ids_file}"
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' "${observed_publish_node_ids_file}" >/dev/null; then
            echo "active_github_release_node_ids_json must include at least one actual GitHub Release publish node for observed proof sidecar coverage." >&2
            exit 1
          fi

          is_observed_github_release_asset_proof_sidecar_name() {
            local name="$1"
            [[ "${name}" =~ ^release-github-release-asset-proof-v1-[0-9a-f]{24}-[1-9][0-9]*-[1-9][0-9]*[.]json$ ]]
          }

          valid_observed_proof_sidecar() {
            local name="$1"
            local proof_path="$2"
            if [[ ! -f "${proof_path}" ]]; then
              return 1
            fi
            uv run python eng/scripts/workflow_release_control.py validate-github-release-asset-proof-sidecar \
              --name "${name}" \
              --proof "${proof_path}" \
              --plan "${release_plan_path}" \
              --release-target-sha "${target_sha}" \
              --active-github-release-node-ids "${observed_node_ids_file}" \
              --repository "${GITHUB_REPOSITORY}" \
              --tag "${TAG_NAME}"
          }

          write_expected_observed_proof_sidecar_coverage() {
            jq -r --slurpfile nodeIds "${observed_publish_node_ids_file}" '
              .graph["publish-nodes"] as $nodes
              | $nodeIds[0][]
              | . as $nodeId
              | ($nodes[$nodeId] // null) as $node
              | select($node != null)
              | ($node.projection["asset-names-by-artifact-id"] // {}) as $assetNames
              | ($node["artifact-ids"] // []) as $artifactIds
              | select($artifactIds | type == "array")
              | $artifactIds[]
              | select(type == "string")
              | . as $artifactId
              | ($assetNames[$artifactId] // null) as $assetName
              | select($assetName != null and ($assetName | type == "string") and ($assetName | length > 0))
              | [$nodeId, $artifactId, $assetName]
              | @tsv
            ' "${release_plan_path}" | sort -u > "${expected_proof_sidecar_coverage}"
            if [[ ! -s "${expected_proof_sidecar_coverage}" ]]; then
              echo "Active GitHub Release node assets are missing from planner proof sidecar coverage." >&2
              exit 1
            fi
            cut -f1 "${planned_manifest}" | sort -u > "${planned_proof_sidecar_asset_names}"
            cut -f3 "${expected_proof_sidecar_coverage}" | sort -u > "${expected_proof_sidecar_asset_names}"
            if [[ -n "$(comm -13 "${planned_proof_sidecar_asset_names}" "${expected_proof_sidecar_asset_names}")" ]]; then
              echo "Actual GitHub Release publish node proof sidecar coverage includes assets outside the planned payload." >&2
              exit 1
            fi
          }

          record_valid_observed_proof_sidecar_coverage() {
            local proof_path="$1"
            local publish_node_id artifact_id asset_name
            publish_node_id=$(jq -r '.binding["publish-node-id"]' "${proof_path}")
            artifact_id=$(jq -r '.binding["artifact-id"]' "${proof_path}")
            asset_name=$(jq -r '.binding["asset-name"]' "${proof_path}")
            if [[ -z "${publish_node_id}" || "${publish_node_id}" == "null" || -z "${artifact_id}" || "${artifact_id}" == "null" || -z "${asset_name}" || "${asset_name}" == "null" ]]; then
              echo "Validated GitHub Release asset proof sidecar is missing binding coverage." >&2
              exit 1
            fi
            printf '%s\t%s\t%s\n' "${publish_node_id}" "${artifact_id}" "${asset_name}" >> "${observed_valid_proof_sidecar_coverage}"
          }

          require_observed_proof_sidecar_coverage() {
            local phase="$1"
            write_expected_observed_proof_sidecar_coverage
            sort -u -o "${observed_valid_proof_sidecar_coverage}" "${observed_valid_proof_sidecar_coverage}"
            if [[ ! -s "${observed_valid_proof_sidecar_coverage}" ]]; then
              echo "${phase} GitHub Release observation did not find any valid persisted asset proof sidecars." >&2
              exit 1
            fi
            if ! diff -u "${expected_proof_sidecar_coverage}" "${observed_valid_proof_sidecar_coverage}"; then
              echo "${phase} GitHub Release proof sidecar coverage does not exactly match active planned assets; refusing result upload or promotion." >&2
              exit 1
            fi
          }

          load_observed_release_payload_assets() {
            rm -rf "${observed_dir}"
            mkdir -p "${observed_dir}"
            : > "${observed_manifest}"
            : > "${observed_asset_index_all}"
            : > "${observed_names_file}"
            : > "${observed_valid_proof_sidecar_coverage}"
            if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --jq '.[] | [.name, .id, ((.label // "") | @base64)] | @tsv' | sort > "${observed_asset_index_all}"; then
              echo "Failed to enumerate observed release assets for '${TAG_NAME}'." >&2
              exit 1
            fi
            cut -f1 "${observed_asset_index_all}" > "${observed_names_file}"
            mapfile -t observed_names < "${observed_names_file}"
            if [[ ${#observed_names[@]} -gt 0 ]]; then
              gh release download "${TAG_NAME}" --dir "${observed_dir}"
              for name in "${observed_names[@]}"; do
                asset_path="${observed_dir}/${name}"
                if [[ ! -f "${asset_path}" ]]; then
                  echo "Observed release asset '${name}' was listed by the API but was not downloaded." >&2
                  exit 1
                fi
                if is_observed_github_release_asset_proof_sidecar_name "${name}" && valid_observed_proof_sidecar "${name}" "${asset_path}"; then
                  echo "Ignoring validated GitHub Release asset proof sidecar '${name}' during observed result generation."
                  record_valid_observed_proof_sidecar_coverage "${asset_path}"
                  continue
                fi
                size=$(stat -c '%s' "${asset_path}")
                digest=$(sha256sum "${asset_path}" | awk '{print $1}')
                label_b64=$(awk -F '\t' -v n="${name}" '$1 == n {print $3; found=1} END {if (!found) exit 1}' "${observed_asset_index_all}" || true)
                printf '%s\t%s\t%s\t%s\n' "${name}" "${size}" "${digest}" "${label_b64}" >> "${observed_manifest}"
              done
              sort -o "${observed_manifest}" "${observed_manifest}"
            fi
          }

          write_observed_github_release_result() {
            local phase="$1"
            local require_proof_sidecar="$2"
            load_observed_release_payload_assets
            require_coverage_only_proof_sidecars "${phase}" "${observed_manifest}" "${observed_dir}" "${observed_node_ids_file}"
            merge_coverage_only_payload_manifest "${phase}" "${observed_manifest}"
            if [[ "${require_proof_sidecar}" == "true" ]]; then
              require_observed_proof_sidecar_coverage "${phase}"
            fi
            if ! diff -u "${coverage_manifest}" "${observed_manifest}"; then
              echo "${phase} GitHub Release assets do not exactly match planned coverage asset names, labels, sizes, and SHA-256 digests." >&2
              exit 1
            fi
            jq -n \
              --arg tagName "${TAG_NAME}" \
              --arg targetSha "${target_sha}" \
              --arg releaseId "${release_id}" \
              --argjson releaseExisted "${release_exists}" \
              --rawfile assetsTsv "${observed_manifest}" \
              '{
                "api-version": "three.release.github-release-result/v1alpha1",
                "kind": "github-release-result",
                "tagName": $tagName,
                "targetSha": $targetSha,
                "releaseId": ($releaseId | tonumber),
                "releaseExisted": $releaseExisted,
                "assets": (
                  $assetsTsv
                  | split("\n")
                  | map(select(length > 0))
                  | map(split("\t") | {
                      "name": .[0],
                      "size": (.[1] | tonumber),
                      "sha256": .[2]
                    })
                )
              }' > "${result_json}"
          }

          result_json="${RUNNER_TEMP_DIR}/github-release-result.json"
          write_observed_github_release_result "Post-payload" false
          result_binding="$(
            jq -cn \
             --arg tagName "${TAG_NAME}" \
             --arg targetSha "${target_sha}" \
             '{"tagName":$tagName,"targetSha":$targetSha}'
          )"
          result_digest="$(printf '%s' "${result_binding}" | sha256sum | awk '{print substr($1, 1, 24)}')"
          result_artifact_name="release-github-release-result-v1-${RUN_ID}-${RUN_ATTEMPT}-${result_digest}"
          {
            echo "RESULT_JSON=${result_json}"
            echo "RESULT_ARTIFACT_NAME=${result_artifact_name}"
            echo "RELEASE_EXISTED=${release_exists}"
          } >> "${GITHUB_ENV}"

      - name: Generate GitHub Release asset proofs
        shell: bash
        env:
          ACTIVE_GITHUB_RELEASE_NODE_IDS_JSON: ${{ inputs.active_github_release_node_ids_json }}
          ASSET_DIR: ${{ env.ASSET_DIR }}
          EXPECTED_ASSET_RECEIPTS: ${{ env.EXPECTED_ASSET_RECEIPTS }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.attestation_source_sha }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TARGET_SHA: ${{ inputs.target }}
          RESULT_JSON: ${{ env.RESULT_JSON }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -Eeuo pipefail
          plan_path="${RUNNER_TEMP_DIR}/release-plan/release-plan.json"
          proof_dir="${GITHUB_WORKSPACE}/.three-workflow-release/github-release-asset-proofs"
          requests_dir="${GITHUB_WORKSPACE}/.three-workflow-release/github-release-proof-requests"
          rm -rf "${proof_dir}" "${requests_dir}"
          mkdir -p "${proof_dir}" "${requests_dir}"

          node_ids_file="${RUNNER_TEMP_DIR}/active-github-release-node-ids-proofs.json"
          printf '%s' "${ACTIVE_GITHUB_RELEASE_NODE_IDS_JSON}" > "${node_ids_file}"
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' "${node_ids_file}" >/dev/null; then
            echo "active_github_release_node_ids_json must be a non-empty JSON array for proof generation." >&2
            exit 1
          fi
          publish_node_ids_file="${RUNNER_TEMP_DIR}/actual-github-release-publish-node-ids-proofs.json"
          jq -c --slurpfile nodeIds "${node_ids_file}" '
            .graph["publish-nodes"] as $nodes
            | [$nodeIds[0][] as $nodeId
              | select(($nodes[$nodeId] // {})["publish-disposition"] == "publish")]
            | unique | sort
          ' "${plan_path}" > "${publish_node_ids_file}"
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' "${publish_node_ids_file}" >/dev/null; then
            echo "active_github_release_node_ids_json must include at least one actual GitHub Release publish node for proof generation." >&2
            exit 1
          fi

          artifact_ids_json="${RUNNER_TEMP_DIR}/github-release-proof-artifact-ids.json"
          printf '{}\n' > "${artifact_ids_json}"
          while IFS= read -r node_id; do
            node_digest="$(printf '%s' "${node_id}" | sha256sum | awk '{print substr($1, 1, 24)}')"
            publish_request="${requests_dir}/publish-request-${node_digest}.json"
            asset_attestations="${requests_dir}/asset-attestations-${node_digest}.json"
            proof_manifest="${requests_dir}/proof-manifest-${node_digest}.json"
            proof_output="${requests_dir}/proof-output-${node_digest}.txt"

            uv run python eng/scripts/workflow_release_control.py publish-request \
              --plan "${plan_path}" \
              --publish-node-id "${node_id}" \
              --run-id "${RUN_ID}" \
              --attempt "${RUN_ATTEMPT}" \
              --github-release-asset-receipts "${EXPECTED_ASSET_RECEIPTS}" \
              --github-release-assets-dir "${ASSET_DIR}" \
              --attestation-source-sha "${HEAD_SHA}" \
              --out "${publish_request}"

            uv run python eng/scripts/workflow_release_control.py github-release-asset-attestations \
              --publish-request "${publish_request}" \
              --github-release-result "${RESULT_JSON}" \
              --attestation-source-sha "${HEAD_SHA}" \
              --repository "${REPOSITORY}" \
              --assets-dir "${ASSET_DIR}" \
              --out "${asset_attestations}"

            uv run python eng/scripts/workflow_release_control.py generate-proofs \
              --plan "${plan_path}" \
              --publish-request "${publish_request}" \
              --github-release-result "${RESULT_JSON}" \
              --asset-attestations "${asset_attestations}" \
              --publish-node-id "${node_id}" \
              --run-id "${RUN_ID}" \
              --attempt "${RUN_ATTEMPT}" \
              --repository "${REPOSITORY}" \
              --workflow release-orchestrate.yml \
              --head-sha "${HEAD_SHA}" \
              --build-results-dir "${RUNNER_TEMP_DIR}/unused-github-release-proof-build-results" \
              --out-dir "${proof_dir}" \
              --manifest-out "${proof_manifest}" \
              --artifact-ids-json "${artifact_ids_json}" \
              --github-output "${proof_output}"
          done < <(jq -r '.[]' "${publish_node_ids_file}")

          if ! compgen -G "${proof_dir}/*.json" >/dev/null; then
            echo "GitHub Release publish completed without generated asset proof wrappers." >&2
            exit 1
          fi

          proof_binding="$(
            jq -cn \
             --arg tagName "${TAG_NAME}" \
             --arg targetSha "${RELEASE_TARGET_SHA}" \
             --arg sourceSha "${HEAD_SHA}" \
             '{"tagName":$tagName,"targetSha":$targetSha,"attestationSourceSha":$sourceSha}'
          )"
          proof_digest="$(printf '%s' "${proof_binding}" | sha256sum | awk '{print substr($1, 1, 24)}')"
          echo "PROOF_ARTIFACT_NAME=release-github-release-asset-proofs-v1-${RUN_ID}-${RUN_ATTEMPT}-${proof_digest}" >> "${GITHUB_ENV}"
          echo "PROOF_DIR=${proof_dir}" >> "${GITHUB_ENV}"

      - name: Upload GitHub Release asset proofs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROOF_ARTIFACT_NAME }}
          path: ${{ env.PROOF_DIR }}/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Persist GitHub Release asset proofs on release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_DIR: ${{ env.PROOF_DIR }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          proof_files=("${PROOF_DIR}"/release-github-release-asset-proof-v1-*.json)
          if [[ ${#proof_files[@]} -eq 0 ]]; then
            echo "No GitHub Release proof wrapper sidecar files were generated." >&2
            exit 1
          fi
          gh release upload "${TAG_NAME}" "${proof_files[@]}" --clobber

      - name: Verify live GitHub Release assets and finalize result
        shell: bash
        env:
          ACTIVE_GITHUB_RELEASE_NODE_IDS_JSON: ${{ inputs.active_github_release_node_ids_json }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_EXISTED: ${{ env.RELEASE_EXISTED }}
          RESULT_JSON: ${{ env.RESULT_JSON }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
          TAG_NAME: ${{ inputs.tag_name }}
          TARGET: ${{ inputs.target }}
          TARGET_CHECKOUT: ${{ github.workspace }}/.three-workflow-release/target
        run: |
          set -Eeuo pipefail
          if [[ ! "${TARGET}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Target commit SHA must be a pinned 40-character lowercase hex SHA: '${TARGET}'." >&2
            exit 1
          fi
          if ! target_sha=$(git -C "${TARGET_CHECKOUT}" rev-parse --verify 'HEAD^{commit}'); then
            echo "Invalid target commit SHA: '${TARGET}'." >&2
            exit 1
          fi
          if [[ "${target_sha}" != "${TARGET}" ]]; then
            echo "Release target data checkout resolved to ${target_sha}, not requested target ${TARGET}." >&2
            exit 1
          fi

          encoded_tag=$(jq -rn --arg value "${TAG_NAME}" '$value | @uri')
          tag_api_path="repos/${GITHUB_REPOSITORY}/git/ref/tags/${encoded_tag}"
          release_tag_api_path="repos/${GITHUB_REPOSITORY}/releases/tags/${encoded_tag}"
          verify_tag_at_expected_target() {
            local tag_ref_json ref_name current_sha object_type
            if ! tag_ref_json=$(gh api "${tag_api_path}"); then
              echo "Release tag '${TAG_NAME}' is missing; refusing observed GitHub Release result finalization." >&2
              exit 1
            fi
            ref_name=$(jq -r 'if type == "object" then (.ref // "") else "" end' <<<"${tag_ref_json}")
            if [[ "${ref_name}" != "refs/tags/${TAG_NAME}" ]]; then
              echo "Git ref lookup for ${TAG_NAME} returned non-exact ref '${ref_name:-<none>}'; refusing observed GitHub Release result finalization." >&2
              exit 1
            fi
            current_sha=$(jq -r '.object.sha' <<<"${tag_ref_json}")
            object_type=$(jq -r '.object.type' <<<"${tag_ref_json}")
            if [[ "${object_type}" == "tag" ]]; then
              current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${current_sha}" --jq '.object.sha')
            fi
            if [[ "${current_sha}" != "${target_sha}" ]]; then
              echo "Release tag '${TAG_NAME}' points to ${current_sha}, not ${target_sha}; refusing observed GitHub Release result finalization." >&2
              exit 1
            fi
          }

          verify_tag_at_expected_target
          release_json=$(gh api "${release_tag_api_path}")
          release_id=$(jq -r '.id // empty' <<<"${release_json}")
          if [[ -z "${release_id}" ]]; then
            echo "Failed to resolve release id for observed GitHub Release result finalization." >&2
            exit 1
          fi
          case "${RELEASE_EXISTED}" in
            true|false) ;;
            *)
              echo "RELEASE_EXISTED must be true or false before observed result finalization." >&2
              exit 1
              ;;
          esac
          planned_manifest="${RUNNER_TEMP_DIR}/planned-assets.tsv"
          coverage_manifest="${RUNNER_TEMP_DIR}/planned-coverage-assets.tsv"
          coverage_only_asset_names="${RUNNER_TEMP_DIR}/final-coverage-only-asset-names.txt"
          coverage_manifest_names="${RUNNER_TEMP_DIR}/final-planned-coverage-asset-names.txt"
          planned_asset_names_txt="${RUNNER_TEMP_DIR}/final-planned-asset-names.txt"
          if [[ ! -f "${planned_manifest}" ]]; then
            echo "Planned GitHub Release asset manifest is missing before observed result finalization." >&2
            exit 1
          fi
          if [[ ! -f "${coverage_manifest}" ]]; then
            echo "Planned GitHub Release coverage asset manifest is missing before observed result finalization." >&2
            exit 1
          fi
          cut -f1 "${planned_manifest}" | sort -u > "${planned_asset_names_txt}"
          cut -f1 "${coverage_manifest}" | sort -u > "${coverage_manifest_names}"
          comm -23 "${coverage_manifest_names}" "${planned_asset_names_txt}" > "${coverage_only_asset_names}"

          observed_dir="${RUNNER_TEMP_DIR}/final-observed-release-assets"
          observed_manifest="${RUNNER_TEMP_DIR}/final-observed-assets.tsv"
          observed_asset_index_all="${RUNNER_TEMP_DIR}/final-observed-asset-index-all.tsv"
          observed_names_file="${RUNNER_TEMP_DIR}/final-observed-asset-names.txt"
          release_plan_path="${RUNNER_TEMP_DIR}/release-plan/release-plan.json"
          observed_node_ids_file="${RUNNER_TEMP_DIR}/active-github-release-node-ids-final-observed-assets.json"
          observed_publish_node_ids_file="${RUNNER_TEMP_DIR}/actual-github-release-publish-node-ids-final-observed-assets.json"
          expected_proof_sidecar_coverage="${RUNNER_TEMP_DIR}/final-expected-github-release-proof-sidecar-coverage.tsv"
          expected_proof_sidecar_asset_names="${RUNNER_TEMP_DIR}/final-expected-github-release-proof-sidecar-asset-names.txt"
          planned_proof_sidecar_asset_names="${RUNNER_TEMP_DIR}/final-planned-github-release-proof-sidecar-asset-names.txt"
          observed_valid_proof_sidecar_coverage="${RUNNER_TEMP_DIR}/final-observed-valid-github-release-proof-sidecar-coverage.tsv"
          printf '%s' "${ACTIVE_GITHUB_RELEASE_NODE_IDS_JSON}" > "${observed_node_ids_file}"
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' "${observed_node_ids_file}" >/dev/null; then
            echo "active_github_release_node_ids_json must be a non-empty JSON array for final observed GitHub Release result generation." >&2
            exit 1
          fi
          jq -c --slurpfile nodeIds "${observed_node_ids_file}" '
            .graph["publish-nodes"] as $nodes
            | [$nodeIds[0][] as $nodeId
              | select(($nodes[$nodeId] // {})["publish-disposition"] == "publish")]
            | unique | sort
          ' "${release_plan_path}" > "${observed_publish_node_ids_file}"
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' "${observed_publish_node_ids_file}" >/dev/null; then
            echo "active_github_release_node_ids_json must include at least one actual GitHub Release publish node for final proof sidecar coverage." >&2
            exit 1
          fi
          current_plan_id=$(jq -r '.envelope["plan-id"] // empty' "${release_plan_path}")
          if [[ -z "${current_plan_id}" ]]; then
            echo "Release plan is missing envelope plan-id before final GitHub Release proof sidecar coverage." >&2
            exit 1
          fi

          is_observed_github_release_asset_proof_sidecar_name() {
            local name="$1"
            [[ "${name}" =~ ^release-github-release-asset-proof-v1-[0-9a-f]{24}-[1-9][0-9]*-[1-9][0-9]*[.]json$ ]]
          }

          valid_observed_proof_sidecar() {
            local name="$1"
            local proof_path="$2"
            if [[ ! -f "${proof_path}" ]]; then
              return 1
            fi
            uv run python eng/scripts/workflow_release_control.py validate-github-release-asset-proof-sidecar \
              --name "${name}" \
              --proof "${proof_path}" \
              --plan "${release_plan_path}" \
              --release-target-sha "${target_sha}" \
              --active-github-release-node-ids "${observed_node_ids_file}" \
              --repository "${GITHUB_REPOSITORY}" \
              --tag "${TAG_NAME}"
          }

          current_observed_proof_sidecar() {
            local name="$1"
            local proof_path="$2"
            if [[ ! -f "${proof_path}" ]]; then
              return 1
            fi
            uv run python eng/scripts/workflow_release_control.py validate-github-release-asset-proof-sidecar \
              --name "${name}" \
              --proof "${proof_path}" \
              --plan "${release_plan_path}" \
              --release-target-sha "${target_sha}" \
              --active-github-release-node-ids "${observed_publish_node_ids_file}" \
              --repository "${GITHUB_REPOSITORY}" \
              --tag "${TAG_NAME}" \
              --expected-plan-id "${current_plan_id}" \
              --expected-run-id "${RUN_ID}" \
              --expected-run-attempt "${RUN_ATTEMPT}" \
              --asset-manifest "${planned_manifest}"
          }

          write_expected_observed_proof_sidecar_coverage() {
            jq -r --slurpfile nodeIds "${observed_publish_node_ids_file}" '
              .graph["publish-nodes"] as $nodes
              | $nodeIds[0][]
              | . as $nodeId
              | ($nodes[$nodeId] // null) as $node
              | select($node != null)
              | ($node.projection["asset-names-by-artifact-id"] // {}) as $assetNames
              | ($node["artifact-ids"] // []) as $artifactIds
              | select($artifactIds | type == "array")
              | $artifactIds[]
              | select(type == "string")
              | . as $artifactId
              | ($assetNames[$artifactId] // null) as $assetName
              | select($assetName != null and ($assetName | type == "string") and ($assetName | length > 0))
              | [$nodeId, $artifactId, $assetName]
              | @tsv
            ' "${release_plan_path}" | sort -u > "${expected_proof_sidecar_coverage}"
            if [[ ! -s "${expected_proof_sidecar_coverage}" ]]; then
              echo "Active GitHub Release node assets are missing from planner proof sidecar coverage." >&2
              exit 1
            fi
            cut -f1 "${planned_manifest}" | sort -u > "${planned_proof_sidecar_asset_names}"
            cut -f3 "${expected_proof_sidecar_coverage}" | sort -u > "${expected_proof_sidecar_asset_names}"
            if [[ -n "$(comm -13 "${planned_proof_sidecar_asset_names}" "${expected_proof_sidecar_asset_names}")" ]]; then
              echo "Actual GitHub Release publish node proof sidecar coverage includes assets outside the planned payload." >&2
              exit 1
            fi
          }

          record_valid_observed_proof_sidecar_coverage() {
            local proof_path="$1"
            local publish_node_id artifact_id asset_name
            publish_node_id=$(jq -r '.binding["publish-node-id"]' "${proof_path}")
            artifact_id=$(jq -r '.binding["artifact-id"]' "${proof_path}")
            asset_name=$(jq -r '.binding["asset-name"]' "${proof_path}")
            if [[ -z "${publish_node_id}" || "${publish_node_id}" == "null" || -z "${artifact_id}" || "${artifact_id}" == "null" || -z "${asset_name}" || "${asset_name}" == "null" ]]; then
              echo "Validated GitHub Release asset proof sidecar is missing binding coverage." >&2
              exit 1
            fi
            printf '%s\t%s\t%s\n' "${publish_node_id}" "${artifact_id}" "${asset_name}" >> "${observed_valid_proof_sidecar_coverage}"
          }

          record_coverage_only_proof_sidecar() {
            local proof_path="$1"
            local coverage_file="$2"
            local publish_node_id artifact_id asset_name
            publish_node_id=$(jq -r '.binding["publish-node-id"]' "${proof_path}")
            artifact_id=$(jq -r '.binding["artifact-id"]' "${proof_path}")
            asset_name=$(jq -r '.binding["asset-name"]' "${proof_path}")
            if [[ -z "${publish_node_id}" || "${publish_node_id}" == "null" || -z "${artifact_id}" || "${artifact_id}" == "null" || -z "${asset_name}" || "${asset_name}" == "null" ]]; then
              echo "Validated GitHub Release asset proof sidecar is missing binding coverage." >&2
              exit 1
            fi
            if grep -Fxq "${asset_name}" "${coverage_only_asset_names}"; then
              printf '%s\t%s\t%s\n' "${publish_node_id}" "${artifact_id}" "${asset_name}" >> "${coverage_file}"
            fi
          }

          require_coverage_only_proof_sidecars() {
            local phase="$1"
            local payload_manifest="$2"
            local assets_dir="$3"
            local node_ids_file="$4"
            local expected_coverage observed_coverage proof_path proof_name
            if [[ ! -s "${coverage_only_asset_names}" ]]; then
              return 0
            fi
            expected_coverage="${RUNNER_TEMP_DIR}/final-coverage-only-expected-proof-sidecar-coverage.tsv"
            observed_coverage="${RUNNER_TEMP_DIR}/final-coverage-only-observed-proof-sidecar-coverage.tsv"
            jq -r \
              --slurpfile nodeIds "${node_ids_file}" \
              --rawfile coverageOnlyNames "${coverage_only_asset_names}" \
              '
                ($coverageOnlyNames | split("\n") | map(select(length > 0))) as $coverageOnly
                | .graph["publish-nodes"] as $nodes
                | $nodeIds[0][]
                | . as $nodeId
                | ($nodes[$nodeId] // null) as $node
                | select($node != null and $node["publish-disposition"] == "skip-satisfied")
                | ($node.projection["asset-names-by-artifact-id"] // {}) as $assetNames
                | ($node["artifact-ids"] // []) as $artifactIds
                | select($artifactIds | type == "array")
                | $artifactIds[]
                | select(type == "string")
                | . as $artifactId
                | ($assetNames[$artifactId] // null) as $assetName
                | select($assetName != null and ($assetName | type == "string") and ($assetName | length > 0))
                | select(($coverageOnly | index($assetName)) != null)
                | [$nodeId, $artifactId, $assetName]
                | @tsv
              ' "${release_plan_path}" | sort -u > "${expected_coverage}"
            if [[ ! -s "${expected_coverage}" ]]; then
              echo "${phase} GitHub Release coverage-only assets are not backed by skip-satisfied planner nodes." >&2
              exit 1
            fi
            : > "${observed_coverage}"
            shopt -s nullglob
            for proof_path in "${assets_dir}"/release-github-release-asset-proof-v1-*.json; do
              proof_name=$(basename "${proof_path}")
              if ! is_observed_github_release_asset_proof_sidecar_name "${proof_name}"; then
                continue
              fi
              if
                uv run python eng/scripts/workflow_release_control.py validate-github-release-asset-proof-sidecar \
                  --name "${proof_name}" \
                  --proof "${proof_path}" \
                  --plan "${release_plan_path}" \
                  --release-target-sha "${target_sha}" \
                  --active-github-release-node-ids "${node_ids_file}" \
                  --repository "${GITHUB_REPOSITORY}" \
                  --tag "${TAG_NAME}" \
                  --asset-manifest "${payload_manifest}"
              then
                record_coverage_only_proof_sidecar "${proof_path}" "${observed_coverage}"
              fi
            done
            sort -u -o "${observed_coverage}" "${observed_coverage}"
            if ! diff -u "${expected_coverage}" "${observed_coverage}"; then
              echo "${phase} GitHub Release coverage-only proof sidecars do not validate the skip-satisfied planned assets; refusing result upload or promotion." >&2
              exit 1
            fi
          }

          require_observed_proof_sidecar_coverage() {
            local phase="$1"
            write_expected_observed_proof_sidecar_coverage
            sort -u -o "${observed_valid_proof_sidecar_coverage}" "${observed_valid_proof_sidecar_coverage}"
            if [[ ! -s "${observed_valid_proof_sidecar_coverage}" ]]; then
              echo "${phase} GitHub Release observation did not find any valid persisted asset proof sidecars." >&2
              exit 1
            fi
            if ! diff -u "${expected_proof_sidecar_coverage}" "${observed_valid_proof_sidecar_coverage}"; then
              echo "${phase} GitHub Release proof sidecar coverage does not exactly match active planned assets; refusing result upload or promotion." >&2
              exit 1
            fi
          }

          load_observed_release_payload_assets() {
            rm -rf "${observed_dir}"
            mkdir -p "${observed_dir}"
            : > "${observed_manifest}"
            : > "${observed_asset_index_all}"
            : > "${observed_names_file}"
            : > "${observed_valid_proof_sidecar_coverage}"
            if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --jq '.[] | [.name, .id, ((.label // "") | @base64)] | @tsv' | sort > "${observed_asset_index_all}"; then
              echo "Failed to enumerate observed release assets for '${TAG_NAME}'." >&2
              exit 1
            fi
            cut -f1 "${observed_asset_index_all}" > "${observed_names_file}"
            mapfile -t observed_names < "${observed_names_file}"
            if [[ ${#observed_names[@]} -gt 0 ]]; then
              gh release download "${TAG_NAME}" --dir "${observed_dir}"
              for name in "${observed_names[@]}"; do
                asset_path="${observed_dir}/${name}"
                if [[ ! -f "${asset_path}" ]]; then
                  echo "Observed release asset '${name}' was listed by the API but was not downloaded." >&2
                  exit 1
                fi
                if is_observed_github_release_asset_proof_sidecar_name "${name}" && valid_observed_proof_sidecar "${name}" "${asset_path}"; then
                  echo "Ignoring validated GitHub Release asset proof sidecar '${name}' during final observed result generation."
                  if current_observed_proof_sidecar "${name}" "${asset_path}"; then
                    record_valid_observed_proof_sidecar_coverage "${asset_path}"
                  else
                    echo "Validated historical GitHub Release asset proof sidecar '${name}' is ignored as payload evidence only; it does not count toward current proof coverage."
                  fi
                  continue
                fi
                size=$(stat -c '%s' "${asset_path}")
                digest=$(sha256sum "${asset_path}" | awk '{print $1}')
                label_b64=$(awk -F '\t' -v n="${name}" '$1 == n {print $3; found=1} END {if (!found) exit 1}' "${observed_asset_index_all}" || true)
                printf '%s\t%s\t%s\t%s\n' "${name}" "${size}" "${digest}" "${label_b64}" >> "${observed_manifest}"
              done
              sort -o "${observed_manifest}" "${observed_manifest}"
            fi
          }

          load_observed_release_payload_assets
          require_coverage_only_proof_sidecars "Final" "${observed_manifest}" "${observed_dir}" "${observed_node_ids_file}"
          require_observed_proof_sidecar_coverage "Final"
          if ! diff -u "${coverage_manifest}" "${observed_manifest}"; then
            echo "Final GitHub Release assets do not exactly match planned coverage asset names, labels, sizes, and SHA-256 digests." >&2
            exit 1
          fi
          jq -n \
            --arg tagName "${TAG_NAME}" \
            --arg targetSha "${target_sha}" \
            --arg releaseId "${release_id}" \
            --argjson releaseExisted "${RELEASE_EXISTED}" \
            --rawfile assetsTsv "${observed_manifest}" \
            '{
              "api-version": "three.release.github-release-result/v1alpha1",
              "kind": "github-release-result",
              "tagName": $tagName,
              "targetSha": $targetSha,
              "releaseId": ($releaseId | tonumber),
              "releaseExisted": $releaseExisted,
              "assets": (
                $assetsTsv
                | split("\n")
                | map(select(length > 0))
                | map(split("\t") | {
                    "name": .[0],
                    "size": (.[1] | tonumber),
                    "sha256": .[2]
                  })
              )
            }' > "${RESULT_JSON}"

      - name: Upload GitHub Release result
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RESULT_ARTIFACT_NAME }}
          path: ${{ env.RESULT_JSON }}
          overwrite: false

      - name: Promote official GitHub Release
        if: ${{ inputs.prerelease == false }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          TARGET: ${{ inputs.target }}
          TARGET_CHECKOUT: ${{ github.workspace }}/.three-workflow-release/target
        run: |
          set -Eeuo pipefail
          if [[ ! "${TARGET}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Target commit SHA must be a pinned 40-character lowercase hex SHA: '${TARGET}'." >&2
            exit 1
          fi
          if ! target_sha=$(git -C "${TARGET_CHECKOUT}" rev-parse --verify 'HEAD^{commit}'); then
            echo "Invalid target commit SHA: '${TARGET}'." >&2
            exit 1
          fi
          if [[ "${target_sha}" != "${TARGET}" ]]; then
            echo "Release target data checkout resolved to ${target_sha}, not requested target ${TARGET}." >&2
            exit 1
          fi
          encoded_tag=$(jq -rn --arg value "${TAG_NAME}" '$value | @uri')
          tag_api_path="repos/${GITHUB_REPOSITORY}/git/ref/tags/${encoded_tag}"
          release_tag_api_path="repos/${GITHUB_REPOSITORY}/releases/tags/${encoded_tag}"

          verify_tag_at_expected_target() {
            local tag_ref_json ref_name current_sha object_type
            if ! tag_ref_json=$(gh api "${tag_api_path}"); then
              echo "Release tag '${TAG_NAME}' is missing; refusing final official GitHub Release promotion." >&2
              exit 1
            fi
            ref_name=$(jq -r 'if type == "object" then (.ref // "") else "" end' <<<"${tag_ref_json}")
            if [[ "${ref_name}" != "refs/tags/${TAG_NAME}" ]]; then
              echo "Git ref lookup for ${TAG_NAME} returned non-exact ref '${ref_name:-<none>}'; refusing final official GitHub Release promotion." >&2
              exit 1
            fi
            current_sha=$(jq -r '.object.sha' <<<"${tag_ref_json}")
            object_type=$(jq -r '.object.type' <<<"${tag_ref_json}")
            if [[ "${object_type}" == "tag" ]]; then
              current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${current_sha}" --jq '.object.sha')
            fi
            if [[ "${current_sha}" != "${target_sha}" ]]; then
              echo "Release tag '${TAG_NAME}' points to ${current_sha}, not ${target_sha}; refusing final official GitHub Release promotion." >&2
              exit 1
            fi
            echo "Verified tag ${TAG_NAME} still points to ${target_sha} before final official promotion."
          }

          verify_tag_at_expected_target
          release_json=$(gh api "${release_tag_api_path}")
          release_id=$(jq -r '.id // empty' <<<"${release_json}")
          if [[ -z "${release_id}" ]]; then
            echo "Failed to resolve release id for final official GitHub Release promotion." >&2
            exit 1
          fi
          if [[ "$(jq -r '.draft // false' <<<"${release_json}")" == "true" ]]; then
            echo "GitHub Release '${TAG_NAME}' is a draft; refusing final official promotion." >&2
            exit 1
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -F prerelease=false >/dev/null

  verify-buddy-rerun-rejection:
    name: Verify buddy rerun rejection
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - reject-buddy-reruns
      - create-release
    if: ${{ always() && inputs.channel == 'buddy' && github.run_attempt != 1 }}
    permissions: {}
    steps:
      - name: Fail buddy rerun attempts
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "buddy GitHub Release side-effect jobs are single-attempt only; rerun attempts must fail closed before protected environments." >&2
          exit 1
