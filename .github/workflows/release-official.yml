name: Release Official
run-name: Release official stub by @${{ github.triggering_actor }}

on:
  workflow_dispatch:
    inputs:
      requested-project-ids:
        description: Optional comma or newline separated project IDs. Empty means all releasable projects.
        required: false
        type: string
        default: ''
      dry-run:
        description: Run planning and validation without tag or publish side effects.
        required: true
        type: boolean
        default: true
      validation-build:
        description: In dry-run mode, also run validation-only builds.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  stub:
    name: Default-branch dispatch registration stub
    runs-on: ubuntu-latest
    steps:
      - name: Refuse default-branch release execution
        run: |
          echo "This default-branch workflow is a dispatch registration stub only."
          echo "Run release-official.yml on a branch containing the real release workflow implementation."
          exit 1
