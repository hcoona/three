name: Release Official
run-name: Release official stub by @${{ github.triggering_actor }}

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Workspace release project id (unscoped; Python: pyproject.toml project.name; Node/.NET: three.release.yml project.id; exact display-name aliases are canonicalized to that project id; fuzzy matching remains forbidden)"
        required: true
        type: string
      version:
        description: "Python: canonical PEP 440 form only (no leading v; aliases like '01.0' are rejected; epochs like '1!1.0' are intentionally not supported). Node/.NET: SemVer 2.0.0 (no leading v). Ruby: MAJOR.MINOR.PATCH[.suffix...] (no '-' or '+'; suffix segments are dot-separated [0-9A-Za-z]+ and must include at least one letter)."
        required: true
        type: string
      target:
        description: "Release target ref when manually triggered: leave empty to use the dispatch-selected ref/commit; otherwise pass a branch, tag, ref, or 40-hex commit SHA. The workflow resolves it once and pins the commit."
        required: false
        type: string
        default: ""
      force_update_tag:
        description: "Allow force-updating the release tag if it already exists and points to a different commit. If false, existing tags will not be moved."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  stub:
    name: Default-branch dispatch registration stub
    runs-on: ubuntu-latest
    steps:
      - name: Refuse default-branch release execution
        run: |
          echo "This default-branch workflow is a dispatch registration stub only."
          echo "Use .github/workflows/official.yml on a branch containing the real release workflow implementation."
          exit 1
