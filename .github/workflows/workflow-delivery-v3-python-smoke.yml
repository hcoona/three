name: Workflow Delivery v3 Python Release
'on':
  workflow_dispatch:
    inputs:
      registry:
        description: Selected Python destination
        type: choice
        required: true
        options:
          - testpypi
          - pypi
      dry-run:
        description: Qualify and describe without publication
        type: boolean
        default: true
permissions: {}
concurrency:
  group: ${{ format('workflow-delivery-{0}-hcoona-release-smoke-python', inputs.registry == 'testpypi' && 'test.pypi.org' || 'pypi.org') }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  DESTINATION: ${{ inputs.registry }}
  DRY_RUN: ${{ inputs.dry-run }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare runtime without product execution
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.8.10
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected runtimes
        run: |
          set -Eeuo pipefail
          mise install --yes dotnet@10.0.401 python@3.14.3 uv@0.12.24
          {
            printf 'UV_EXECUTABLE=%s\n' "$(mise which uv@0.12.24)"
            printf 'PYTHON_EXECUTABLE=%s\n' "$(mise which python@3.14.3)"
            printf 'DOTNET_EXECUTABLE=%s\n' "$(mise which dotnet@10.0.401)"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$(dirname "$(mise which dotnet@10.0.401)")" >> "$GITHUB_PATH"
        working-directory: ${{ runner.temp }}
      - name: Build complete control and frozen tool recipe before product execution
        run: |
          set -Eeuo pipefail
          mise exec --locked dotnet -- dotnet build src/private/app/workflow-delivery/WorkflowDelivery.csproj -p:RestoreLockedMode=true -o "$RUNNER_TEMP/control"
          cp src/private/app/workflow-delivery/Native/Python/packages.py "$RUNNER_TEMP/control/"
          "$UV_EXECUTABLE" --no-config export --frozen --only-group dev --no-emit-workspace --no-emit-local --no-annotate --no-header --format requirements.txt > "$RUNNER_TEMP/control/index-requirements.txt"
          export MISE_DATA_DIR="${MISE_DATA_DIR:-$HOME/.local/share/mise}"
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs python request
      - name: Retain actual control results
        id: control
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control
          if-no-files-found: error
          retention-days: 45
          overwrite: false
      - name: Qualify complete selected original pair
        run: |
          set -Eeuo pipefail
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release prepare-python "$RUNNER_TEMP/prepared/request.json" > "$RUNNER_TEMP/prepared/preparation.json"
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs python originals
      - name: Retain actual prepared results
        id: retain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          retention-days: 45
          overwrite: false
    outputs:
      control-id: ${{ steps.control.outputs.artifact-id }}
      preparation-id: ${{ steps.retain.outputs.artifact-id }}
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - &id001
        name: Download control by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.control-id }}
          path: ${{ runner.temp }}/control
          digest-mismatch: error
      - &id002
        name: Download prepared by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.preparation-id }}
          path: ${{ runner.temp }}/prepared
          digest-mismatch: error
      - name: Prepare runtime without product execution
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.8.10
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected runtimes
        run: |
          set -Eeuo pipefail
          mise install --yes dotnet@10.0.401 python@3.14.3 uv@0.12.24
          {
            printf 'UV_EXECUTABLE=%s\n' "$(mise which uv@0.12.24)"
            printf 'PYTHON_EXECUTABLE=%s\n' "$(mise which python@3.14.3)"
            printf 'DOTNET_EXECUTABLE=%s\n' "$(mise which dotnet@10.0.401)"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$(dirname "$(mise which dotnet@10.0.401)")" >> "$GITHUB_PATH"
        working-directory: ${{ runner.temp }}
      - name: Receive transferred preparation
        run: |
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs python receive observation
      - name: Prepare locked registry-only index tools
        run: |
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs python tool-request
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release prepare-python-index-tools "$RUNNER_TEMP/index-tool-request.json" > "$RUNNER_TEMP/index-tool-result.json"
      - name: Observe public destination and qualified originals
        run: |
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs python index-config initial-observation-scratch
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release observe-python "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/index-tools.json" > "$RUNNER_TEMP/observation/observation.json"
      - name: Expose required writes and describe dry run
        run: |
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs python state
          if [ "$DRY_RUN" = true ]; then
            mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release describe-python "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/observation/observation.json" > "$RUNNER_TEMP/observation/dry-run.json"
            cat "$RUNNER_TEMP/observation/dry-run.json" >> "$GITHUB_STEP_SUMMARY"
          fi
        id: state
      - name: Retain actual observation results
        id: retain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observation
          if-no-files-found: error
          retention-days: 45
          overwrite: false
    needs: prepare
    outputs:
      write-needed: ${{ steps.state.outputs.write-needed }}
      observation-id: ${{ steps.retain.outputs.artifact-id }}
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - *id001
      - *id002
      - name: Download observation by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.observe.outputs.observation-id }}
          path: ${{ runner.temp }}/observation
          digest-mismatch: error
      - name: Prepare runtime without product execution
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.8.10
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected runtimes
        run: |
          set -Eeuo pipefail
          mise install --yes dotnet@10.0.401 python@3.14.3 uv@0.12.24
          {
            printf 'UV_EXECUTABLE=%s\n' "$(mise which uv@0.12.24)"
            printf 'PYTHON_EXECUTABLE=%s\n' "$(mise which python@3.14.3)"
            printf 'DOTNET_EXECUTABLE=%s\n' "$(mise which dotnet@10.0.401)"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$(dirname "$(mise which dotnet@10.0.401)")" >> "$GITHUB_PATH"
        working-directory: ${{ runner.temp }}
      - name: Receive transferred preparation
        run: |
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs python receive publication
      - name: Prepare locked registry-only index tools
        run: |
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs python tool-request
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release prepare-python-index-tools "$RUNNER_TEMP/index-tool-request.json" > "$RUNNER_TEMP/index-tool-result.json"
      - name: Refresh complete state and invoke native UV for remaining originals
        run: |
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs python index-config publication-observation-scratch
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs python publisher-config
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release publish-python "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/observation/observation.json" "$RUNNER_TEMP/index-tools.json" "$RUNNER_TEMP/publisher-tools.json" > "$RUNNER_TEMP/publication/publication.json"
      - name: Retain actual publication results
        id: retain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
          if-no-files-found: error
          retention-days: 45
          overwrite: false
    needs:
      - prepare
      - observe
    if: inputs.dry-run == false && needs.observe.outputs.write-needed == 'true'
    environment:
      name: ${{ inputs.registry == 'testpypi' && 'workflow-delivery-v3-python-testpypi' || 'workflow-delivery-v3-python-pypi' }}
    outputs:
      publication-id: ${{ steps.retain.outputs.artifact-id }}
  verify-result:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - *id001
      - *id002
      - name: Download observation by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.observe.outputs.observation-id }}
          path: ${{ runner.temp }}/observation
          digest-mismatch: error
      - name: Download publication by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.publish.outputs.publication-id }}
          path: ${{ runner.temp }}/publication
          digest-mismatch: error
        if: needs.publish.outputs.publication-id != ''
      - name: Prepare runtime without product execution
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.8.10
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected runtimes
        run: |
          set -Eeuo pipefail
          mise install --yes dotnet@10.0.401 python@3.14.3 uv@0.12.24
          {
            printf 'UV_EXECUTABLE=%s\n' "$(mise which uv@0.12.24)"
            printf 'PYTHON_EXECUTABLE=%s\n' "$(mise which python@3.14.3)"
            printf 'DOTNET_EXECUTABLE=%s\n' "$(mise which dotnet@10.0.401)"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$(dirname "$(mise which dotnet@10.0.401)")" >> "$GITHUB_PATH"
        working-directory: ${{ runner.temp }}
      - name: Receive transferred preparation
        run: |
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs python receive verification
      - name: Prepare locked registry-only index tools
        run: |
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs python tool-request
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release prepare-python-index-tools "$RUNNER_TEMP/index-tool-request.json" > "$RUNNER_TEMP/index-tool-result.json"
      - name: Verify both index files and original bytes in final public state
        run: |
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs python index-config final-observation-scratch
          # A handled conflicting or unknown observation remains typed completion input.
          status=0
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release observe-python "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/index-tools.json" > "$RUNNER_TEMP/verification/final.json" || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          publication=-
          if [ -s "$RUNNER_TEMP/publication/publication.json" ]; then publication="$RUNNER_TEMP/publication/publication.json"; fi
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release complete-python "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/observation/observation.json" "$RUNNER_TEMP/verification/final.json" "$publication" > "$RUNNER_TEMP/verification/outcome.json"
      - name: Show actual available business result
        run: |
          set -Eeuo pipefail
          if [ -s "$RUNNER_TEMP/verification/outcome.json" ]; then
            cat "$RUNNER_TEMP/verification/outcome.json" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Required Python completion result is unavailable.' >> "$GITHUB_STEP_SUMMARY"
          fi
        if: always()
      - name: Retain actual verification results
        id: retain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
          retention-days: 45
          overwrite: false
    needs:
      - prepare
      - observe
      - publish
    if: always() && !cancelled() && inputs.dry-run == false && needs.prepare.result == 'success' && needs.observe.result == 'success'
