name: Workflow Delivery v3 Python smoke
'on':
  pull_request: null
  workflow_dispatch:
    inputs:
      registry:
        description: Separately authorized destination (both remain disabled).
        type: choice
        required: true
        options:
          - testpypi
          - pypi
permissions: {}
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('wdv3-python-ci-{0}', github.event.pull_request.number)
    || format('wdv3-python-project-{0}', inputs.registry) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
env:
  WDV3_PURPOSE: ${{ github.event_name == 'pull_request' && 'ci-pr-slice-shadow' || 'live-release' }}
  WDV3_REGISTRY: ${{ inputs.registry || 'testpypi' }}
jobs:
  request-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact target without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/workflow-delivery-v3-python-setup
      - name: request Python request
        id: request
        run:
          python -m three_workflow_delivery_v3.python_cli request --purpose "${WDV3_PURPOSE}" --output .wdv3/request.json
          --registry "${WDV3_REGISTRY}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Persist and read back request
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: request
          path: .wdv3/request.json
      - name: Persist and read back intent
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: intent
          path: .wdv3/intent.json
        if: github.event_name == 'workflow_dispatch'
      - name: Persist and read back governance
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: governance
          path: .wdv3/governance.json
        if: github.event_name == 'workflow_dispatch'
      - name: Expose explicit current-DAG edges
        id: edges
        if: always()
        run: python -m three_workflow_delivery_v3.python_cli export --purpose "${WDV3_PURPOSE}"
    outputs:
      references: ${{ steps.edges.outputs.references }}
      artifact-ids: ${{ steps.edges.outputs.artifact-ids }}
    env:
      WDV3_REFERENCES: '{}'
  discover-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact target without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/workflow-delivery-v3-python-setup
      - name: Download only explicit predecessor artifact IDs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.request-python.outputs.artifact-ids }}
          path: .wdv3
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.300
      - name: Restore pinned NBGV
        run: dotnet tool restore
      - name: provider Python provider
        id: provider
        run: python -m three_workflow_delivery_v3.python_cli provider --purpose "${WDV3_PURPOSE}" --output .wdv3/provider.json
      - name: Persist and read back provider
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: provider
          path: .wdv3/provider.json
      - name: Expose explicit current-DAG edges
        id: edges
        if: always()
        run: python -m three_workflow_delivery_v3.python_cli export --purpose "${WDV3_PURPOSE}"
    outputs:
      references: ${{ steps.edges.outputs.references }}
      artifact-ids: ${{ steps.edges.outputs.artifact-ids }}
    needs: request-python
    env:
      WDV3_REFERENCES: ${{ needs.request-python.outputs.references }}
  compile-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact target without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/workflow-delivery-v3-python-setup
      - name: Download only explicit predecessor artifact IDs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.discover-python.outputs.artifact-ids }}
          path: .wdv3
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: compile Python model
        id: compile
        run: python -m three_workflow_delivery_v3.python_cli compile --purpose "${WDV3_PURPOSE}" --output .wdv3/model.json
      - name: Persist and read back model
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: model
          path: .wdv3/model.json
      - name: Expose explicit current-DAG edges
        id: edges
        if: always()
        run: python -m three_workflow_delivery_v3.python_cli export --purpose "${WDV3_PURPOSE}"
    outputs:
      references: ${{ steps.edges.outputs.references }}
      artifact-ids: ${{ steps.edges.outputs.artifact-ids }}
    needs: discover-python
    env:
      WDV3_REFERENCES: ${{ needs.discover-python.outputs.references }}
  plan-python-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact target without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/workflow-delivery-v3-python-setup
      - name: Download only explicit predecessor artifact IDs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.compile-python.outputs.artifact-ids }}
          path: .wdv3
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: plan Python ci-plan
        id: plan
        run: python -m three_workflow_delivery_v3.python_cli plan --purpose "${WDV3_PURPOSE}" --output .wdv3/ci-plan.json
      - name: Persist and read back ci-plan
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: ci-plan
          path: .wdv3/ci-plan.json
      - name: Expose explicit current-DAG edges
        id: edges
        if: always()
        run: python -m three_workflow_delivery_v3.python_cli export --purpose "${WDV3_PURPOSE}"
    outputs:
      references: ${{ steps.edges.outputs.references }}
      artifact-ids: ${{ steps.edges.outputs.artifact-ids }}
    needs: compile-python
    env:
      WDV3_REFERENCES: ${{ needs.compile-python.outputs.references }}
    if: github.event_name == 'pull_request'
  plan-python-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact target without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/workflow-delivery-v3-python-setup
      - name: Download only explicit predecessor artifact IDs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.compile-python.outputs.artifact-ids }}
          path: .wdv3
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: plan Python qualification
        id: plan
        run: python -m three_workflow_delivery_v3.python_cli plan --purpose "${WDV3_PURPOSE}" --output .wdv3/qualification.json
      - name: Persist and read back qualification
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: qualification
          path: .wdv3/qualification.json
      - name: Expose explicit current-DAG edges
        id: edges
        if: always()
        run: python -m three_workflow_delivery_v3.python_cli export --purpose "${WDV3_PURPOSE}"
    outputs:
      references: ${{ steps.edges.outputs.references }}
      artifact-ids: ${{ steps.edges.outputs.artifact-ids }}
    needs: compile-python
    env:
      WDV3_REFERENCES: ${{ needs.compile-python.outputs.references }}
    if: github.event_name == 'workflow_dispatch'
  build-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact target without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/workflow-delivery-v3-python-setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.plan-python-ci.outputs.artifact-ids || needs.plan-python-release.outputs.artifact-ids
            }}
          path: .wdv3
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: build Python build-report
        id: build
        run: python -m three_workflow_delivery_v3.python_cli build --purpose "${WDV3_PURPOSE}" --output .wdv3/build-report.json
      - name: Persist and read back wheel
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: wheel
          path: ${{ steps.build.outputs.wheel-path }}
      - name: Persist and read back sdist
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: sdist
          path: ${{ steps.build.outputs.sdist-path }}
      - name: Persist and read back build-report
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: build-report
          path: .wdv3/build-report.json
      - name: Expose explicit current-DAG edges
        id: edges
        if: always()
        run: python -m three_workflow_delivery_v3.python_cli export --purpose "${WDV3_PURPOSE}"
    outputs:
      references: ${{ steps.edges.outputs.references }}
      artifact-ids: ${{ steps.edges.outputs.artifact-ids }}
    needs:
      - plan-python-ci
      - plan-python-release
    env:
      WDV3_REFERENCES: ${{ needs.plan-python-ci.outputs.references || needs.plan-python-release.outputs.references
        }}
    if: "!cancelled() && (needs.plan-python-ci.result == 'success' || needs.plan-python-release.result == 'success')"
  qualify-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact target without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/workflow-delivery-v3-python-setup
      - name: Download only explicit predecessor artifact IDs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build-python.outputs.references && needs.build-python.outputs.artifact-ids && needs.build-python.outputs.artifact-ids || needs.plan-python-ci.result == 'success' && needs.plan-python-ci.outputs.artifact-ids || needs.plan-python-release.outputs.artifact-ids }}
          path: .wdv3
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: artifacts Python artifacts
        id: artifacts
        run: python -m three_workflow_delivery_v3.python_cli artifacts --purpose "${WDV3_PURPOSE}" --output .wdv3/artifacts.json
        if: needs.build-python.result == 'success'
        continue-on-error: true
      - name: Persist and read back artifacts
        id: artifact-records
        uses: ./.github/actions/workflow-delivery-v3-python-record
        if: steps.artifacts.outcome == 'success'
        continue-on-error: true
        with:
          role: artifacts
          path: .wdv3/artifacts.json
      - name: quality Python quality
        id: quality
        run: python -m three_workflow_delivery_v3.python_cli quality --purpose "${WDV3_PURPOSE}" --output .wdv3/quality.json
        if: steps.artifact-records.outcome == 'success'
        continue-on-error: true
      - name: Persist and read back quality
        uses: ./.github/actions/workflow-delivery-v3-python-record
        if: steps.quality.outcome == 'success'
        continue-on-error: true
        with:
          role: quality
          path: .wdv3/quality.json
      - name: decision Python decision
        id: decision
        run: python -m three_workflow_delivery_v3.python_cli decision --purpose "${WDV3_PURPOSE}" --output .wdv3/decision.json
        continue-on-error: true
      - name: Persist and read back decision
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: decision
          path: .wdv3/decision.json
      - name: Require passed qualification
        env:
          DECISION: ${{ steps.decision.outputs.qualification-result }}
        run: test "${DECISION}" = passed
      - name: Expose explicit current-DAG edges
        id: edges
        if: always()
        run: python -m three_workflow_delivery_v3.python_cli export --purpose "${WDV3_PURPOSE}"
    outputs:
      references: ${{ steps.edges.outputs.references }}
      artifact-ids: ${{ steps.edges.outputs.artifact-ids }}
    needs:
      - build-python
      - plan-python-ci
      - plan-python-release
    if: always() && (needs.plan-python-ci.result == 'success' || needs.plan-python-release.result == 'success')
    env:
      WDV3_REFERENCES: ${{ needs.build-python.outputs.references && needs.build-python.outputs.artifact-ids && needs.build-python.outputs.references || needs.plan-python-ci.result == 'success' && needs.plan-python-ci.outputs.references || needs.plan-python-release.outputs.references }}
  prepare-python-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - name: Check out exact target without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/workflow-delivery-v3-python-setup
      - name: Download only explicit predecessor artifact IDs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.qualify-python.outputs.artifact-ids }}
          path: .wdv3
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: observe Python observation
        id: observe
        run: python -m three_workflow_delivery_v3.python_cli observe --purpose "${WDV3_PURPOSE}" --output .wdv3/observation.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Persist and read back observation
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: observation
          path: .wdv3/observation.json
      - name: prepare Python publication
        id: prepare
        run: python -m three_workflow_delivery_v3.python_cli prepare --purpose "${WDV3_PURPOSE}" --output .wdv3/publication.json
      - name: Persist and read back publication
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: publication
          path: .wdv3/publication.json
      - name: summary Python summary
        id: summary
        run: python -m three_workflow_delivery_v3.python_cli summary --purpose "${WDV3_PURPOSE}" --output .wdv3/summary.json
        if: steps.prepare.outputs.action-required == 'true'
      - name: Persist and read back summary
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: summary
          path: .wdv3/summary.json
        if: steps.prepare.outputs.action-required == 'true'
      - name: bundle Python bundle
        id: bundle
        run: python -m three_workflow_delivery_v3.python_cli bundle --purpose "${WDV3_PURPOSE}" --output .wdv3/bundle.json
        if: steps.prepare.outputs.action-required == 'true'
      - name: Persist and read back bundle
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: bundle
          path: .wdv3/bundle.json
        if: steps.prepare.outputs.action-required == 'true'
      - name: Expose explicit current-DAG edges
        id: edges
        if: always()
        run: python -m three_workflow_delivery_v3.python_cli export --purpose "${WDV3_PURPOSE}"
    outputs:
      references: ${{ steps.edges.outputs.references }}
      artifact-ids: ${{ steps.edges.outputs.artifact-ids }}
      action-required: ${{ steps.prepare.outputs.action-required }}
      environment: ${{ steps.prepare.outputs.environment }}
    needs: qualify-python
    env:
      WDV3_REFERENCES: ${{ needs.qualify-python.outputs.references }}
    if: github.event_name == 'workflow_dispatch'
  publish-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    steps:
      - name: Check out exact target without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/workflow-delivery-v3-python-setup
      - name: Download only explicit predecessor artifact IDs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.prepare-python-publication.outputs.artifact-ids }}
          path: .wdv3
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: authorize Python authorization
        id: authorize
        run: python -m three_workflow_delivery_v3.python_cli authorize --purpose "${WDV3_PURPOSE}" --output .wdv3/authorization.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WDV3_APPROVAL_ENVIRONMENT_MARKER: ${{ vars.WDV3_APPROVAL_ENVIRONMENT_MARKER }}
      - name: Persist and read back authorization
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: authorization
          path: .wdv3/authorization.json
      - name: token Python token
        id: token
        run: python -m three_workflow_delivery_v3.python_cli token --purpose "${WDV3_PURPOSE}" --output .wdv3/token.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: marker Python marker
        id: marker
        run: python -m three_workflow_delivery_v3.python_cli marker --purpose "${WDV3_PURPOSE}" --output .wdv3/marker.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Persist and read back marker
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: marker
          path: .wdv3/marker.json
      - name: execute Python result
        id: execute
        run: python -m three_workflow_delivery_v3.python_cli execute --purpose "${WDV3_PURPOSE}" --output .wdv3/result.json
      - name: Persist and read back result
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: result
          path: .wdv3/result.json
      - name: Expose scalar terminal evidence
        id: terminal
        if: always()
        run: python -m three_workflow_delivery_v3.python_cli terminal --purpose "${WDV3_PURPOSE}"
      - name: Expose explicit current-DAG edges
        id: edges
        if: always()
        run: python -m three_workflow_delivery_v3.python_cli export --purpose "${WDV3_PURPOSE}"
    outputs:
      references: ${{ steps.edges.outputs.references }}
      artifact-ids: ${{ steps.edges.outputs.artifact-ids }}
      terminal-reference: ${{ steps.terminal.outputs.terminal-reference }}
      publication-step-outcome: ${{ steps.execute.outcome }}
    needs: prepare-python-publication
    env:
      WDV3_REFERENCES: ${{ needs.prepare-python-publication.outputs.references }}
    if: github.event_name == 'workflow_dispatch' && needs.prepare-python-publication.outputs.action-required ==
      'true'
    environment:
      name: ${{ needs.prepare-python-publication.outputs.environment }}
  finalize-attempt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact target without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/workflow-delivery-v3-python-setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids:
            ${{ needs.publish-python.outputs.artifact-ids || needs.prepare-python-publication.outputs.artifact-ids
            || needs.qualify-python.outputs.artifact-ids }}
          path: .wdv3
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: exact-proof Python exact-proof
        id: exact-proof
        run: python -m three_workflow_delivery_v3.python_cli exact-proof --purpose "${WDV3_PURPOSE}" --output .wdv3/exact-proof.json
        continue-on-error: true
        if: needs.prepare-python-publication.outputs.action-required == 'false' && needs.publish-python.result ==
          'skipped'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Persist and read back exact-proof
        uses: ./.github/actions/workflow-delivery-v3-python-record
        continue-on-error: true
        with:
          role: exact-proof
          path: .wdv3/exact-proof.json
        if: needs.prepare-python-publication.outputs.action-required == 'false' && needs.publish-python.result ==
          'skipped' && steps.exact-proof.outcome == 'success'
      - name: finalize Python outcome
        id: finalize
        run: |-
          python -m three_workflow_delivery_v3.python_cli finalize --purpose "${WDV3_PURPOSE}" --output .wdv3/outcome.json \
            --publisher-conclusion "${PUBLISHER_CONCLUSION}" \
            --publication-step-outcome "${PUBLICATION_STEP_OUTCOME}" \
            --terminal-reference "${TERMINAL_REFERENCE}" \
            --observation-conclusion "${OBSERVATION_CONCLUSION}"
        continue-on-error: true
      - name: Persist and read back outcome
        uses: ./.github/actions/workflow-delivery-v3-python-record
        with:
          role: outcome
          path: .wdv3/outcome.json
      - name: Require authoritative successful outcome
        env:
          FINALIZER_OUTCOME: ${{ steps.finalize.outcome }}
        run: test "${FINALIZER_OUTCOME}" = success
      - name: Expose explicit current-DAG edges
        id: edges
        if: always()
        run: python -m three_workflow_delivery_v3.python_cli export --purpose "${WDV3_PURPOSE}"
    outputs:
      references: ${{ steps.edges.outputs.references }}
      artifact-ids: ${{ steps.edges.outputs.artifact-ids }}
    needs:
      - qualify-python
      - prepare-python-publication
      - publish-python
    if: always() && github.event_name == 'workflow_dispatch' && needs.qualify-python.result == 'success'
    env:
      WDV3_REFERENCES:
        ${{ needs.publish-python.outputs.references || needs.prepare-python-publication.outputs.references
        || needs.qualify-python.outputs.references }}
      PUBLISHER_CONCLUSION: ${{ needs.publish-python.result }}
      PUBLICATION_STEP_OUTCOME: ${{ needs.publish-python.outputs.publication-step-outcome }}
      TERMINAL_REFERENCE: ${{ needs.publish-python.outputs.terminal-reference }}
      OBSERVATION_CONCLUSION: ${{ needs.prepare-python-publication.result }}
