name: Buddy Release

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Workspace package name (Python: pyproject.toml project.name; Node: package.json name; must match <project> in release/<project>/v* tag)"
        required: true
        type: string
      version:
        description: "Python: PEP 440 subset (leading v allowed; will be stripped; epochs like '1!1.0' are intentionally not supported). Node: SemVer 2.0.0 (no leading v). Ruby: MAJOR.MINOR.PATCH[.suffix...] (no '-' or '+'; suffix segments are dot-separated [0-9A-Za-z]+ and must include at least one letter)."
        required: true
        type: string
      target:
        description: "Target commit for release/tag when manually triggered (defaults to current commit)"
        required: false
        type: string
        default: ""
      force_update_tag:
        description: "Allow force-updating the release tag if it already exists and points to a different commit. If false, existing tags will not be moved."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: buddy-${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.project || 'unknown-project' }}
  cancel-in-progress: false

jobs:
  orchestrate:
    name: Orchestrate buddy release
    uses: ./.github/workflows/release-orchestrate.yml
    permissions:
      contents: write
      actions: read
      packages: write
    with:
      source: manual
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      project: ${{ inputs.project }}
      version: ${{ inputs.version }}
      target: ${{ inputs.target }}
      force_update_tag: ${{ inputs.force_update_tag }}

      channel: buddy
      artifact_prefix: buddy
      github_release_prerelease: true

      enforce_prerelease_only: true
      enforce_non_clobber: true

      publish_python_pypi: false
      publish_node_gpr: true
      publish_node_npmjs: false
      publish_ruby_gpr: true
      publish_ruby_rubygems: false

      enable_attestation: false
