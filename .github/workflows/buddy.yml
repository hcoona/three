name: Buddy Release

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Workspace release project id (Python: pyproject.toml project.name; Node/.NET: three.release.yml project.id; exact display-name aliases are canonicalized to that project id; fuzzy matching remains forbidden)'
        required: true
        type: string
      version:
        description: "Python: canonical PEP 440 form only (no leading v; aliases like '01.0' are rejected; epochs like '1!1.0' are intentionally not supported). Node/.NET: SemVer 2.0.0 (no leading v). Ruby: MAJOR.MINOR.PATCH[.suffix...] (no '-' or '+'; suffix segments are dot-separated [0-9A-Za-z]+ and must include at least one letter)."
        required: true
        type: string
      target:
        description: 'Release target ref when manually triggered: leave empty to use the dispatch-selected ref/commit; otherwise pass a branch, tag, ref, or 40-hex commit SHA. The workflow resolves it once and pins the commit. Buddy targets must be reachable from a checked-in buddy-authorized ref for the selected project/channel.'
        required: false
        type: string
        default: ''
      force_update_tag:
        description: 'Allow planner-owned mutable prerelease overwrite for buddy releases. Buddy releases never retarget an existing release tag.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  reject-reruns:
    name: Reject rerun attempts
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail rerun attempts
        shell: bash
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ "${RUN_ATTEMPT}" != "1" ]]; then
            echo "buddy.yml is single-attempt only; rerun attempts must fail closed." >&2
            exit 1
          fi

  authorize-entry:
    name: Authorize buddy release entry
    runs-on: ubuntu-latest
    needs: reject-reruns
    permissions:
      contents: read
    outputs:
      project_id: ${{ steps.identity.outputs.project_id }}
      release_group: ${{ steps.identity.outputs.release_group }}
      release_target_sha: ${{ steps.identity.outputs.release_target_sha }}
    steps:
      - name: Fail rerun attempts
        shell: bash
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ "${RUN_ATTEMPT}" != "1" ]]; then
            echo "buddy.yml is single-attempt only; rerun attempts must fail closed." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: '0.10.9'

      - name: Authorize and pin release ref
        id: authorize
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTOR: ${{ github.triggering_actor }}
          RELEASE_DRY_RUN: 'false'
          RELEASE_FORCE: ${{ inputs.force_update_tag }}
          RELEASE_TARGET: ${{ inputs.target || '' }}
          RELEASE_VERSION: ${{ inputs.version || '' }}
          RELEASE_PINNED_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REQUESTED_PROJECT_IDS: ${{ inputs.project }}
          RELEASE_VALIDATION_BUILD: 'false'
        run: |
          set -Eeuo pipefail

          mkdir -p .three-workflow-release/entry

          uv run python eng/scripts/workflow_release_control.py normalize-entry \
            --profile buddy \
            --repository "$RELEASE_REPOSITORY" \
            --actor "$RELEASE_ACTOR" \
            --ref "$RELEASE_REF" \
            --ref-name "$RELEASE_REF_NAME" \
            --ref-type "$RELEASE_REF_TYPE" \
            --pinned-sha "$RELEASE_PINNED_SHA" \
            --requested-project-ids "$RELEASE_REQUESTED_PROJECT_IDS" \
            --dry-run "$RELEASE_DRY_RUN" \
            --validation-build "$RELEASE_VALIDATION_BUILD" \
            --force "$RELEASE_FORCE" \
            --metadata-out .three-workflow-release/entry/entry-metadata.json \
            --diagnostics-out .three-workflow-release/entry/planner-diagnostics.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve canonical release identity
        id: identity
        shell: bash
        env:
          RELEASE_INPUT_PROJECT: ${{ inputs.project }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TARGET: ${{ inputs.target || '' }}
          RELEASE_VERSION: ${{ inputs.version || '' }}
          RELEASE_PINNED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          requested_project="${RELEASE_INPUT_PROJECT}"
          if [[ -z "${requested_project}" && "${RELEASE_REF_TYPE}" == "tag" && "${RELEASE_REF_NAME}" == release/*/v* ]]; then
            tag_remainder="${RELEASE_REF_NAME#release/}"
            requested_project="${tag_remainder%%/v*}"
          fi

          if [[ -z "${requested_project}" ]]; then
            echo "Unable to derive a release project for concurrency." >&2
            exit 1
          fi

          resolve_release_target() {
            local target_input="${1}"
            local commit_suffix='^{commit}'
            local is_shallow
            local fetch_ref
            local resolved_ref
            local tag_ref

            if [[ -z "${target_input}" ]]; then
              git rev-parse HEAD
              return 0
            fi

            if [[ "${target_input}" == -* ]]; then
              echo "Release target must not start with '-': ${target_input}" >&2
              return 1
            fi

            if git rev-parse --verify --end-of-options "${target_input}${commit_suffix}" >/dev/null 2>&1; then
              git rev-parse --verify --end-of-options "${target_input}${commit_suffix}"
              return 0
            fi

            is_shallow="$(git rev-parse --is-shallow-repository)"
            if [[ "${target_input}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              if [[ "${is_shallow}" == "true" ]]; then
                git fetch --no-tags --unshallow origin
              fi
              git fetch --no-tags --prune --tags origin \
                '+refs/heads/*:refs/remotes/origin/*' \
                '+refs/tags/*:refs/tags/*'
            else
              fetch_ref="${target_input}"
              resolved_ref="origin/${target_input}"
              if [[ "${target_input}" == origin/* ]]; then
                fetch_ref="${target_input#origin/}"
                resolved_ref="${target_input}"
              elif [[ "${target_input}" == refs/heads/* ]]; then
                fetch_ref="${target_input#refs/heads/}"
                resolved_ref="origin/${fetch_ref}"
              fi

              if git fetch --no-tags --depth=1 origin \
                "+refs/heads/${fetch_ref}:refs/remotes/origin/${fetch_ref}"; then
                if git rev-parse --verify --end-of-options "${resolved_ref}${commit_suffix}" >/dev/null 2>&1; then
                  git rev-parse --verify --end-of-options "${resolved_ref}${commit_suffix}"
                  return 0
                fi
              fi

              tag_ref="${target_input}"
              if [[ "${target_input}" == refs/tags/* ]]; then
                tag_ref="${target_input#refs/tags/}"
              fi

              if git fetch --no-tags --depth=1 origin \
                "+refs/tags/${tag_ref}:refs/tags/${tag_ref}"; then
                if git rev-parse --verify --end-of-options "refs/tags/${tag_ref}${commit_suffix}" >/dev/null 2>&1; then
                  git rev-parse --verify --end-of-options "refs/tags/${tag_ref}${commit_suffix}"
                  return 0
                fi
              fi

              if [[ "${is_shallow}" == "true" ]]; then
                git fetch --no-tags --unshallow origin
              fi
              git fetch --no-tags --prune --tags origin \
                '+refs/heads/*:refs/remotes/origin/*' \
                '+refs/tags/*:refs/tags/*'
            fi

            if git rev-parse --verify --end-of-options "${target_input}${commit_suffix}" >/dev/null 2>&1; then
              git rev-parse --verify --end-of-options "${target_input}${commit_suffix}"
              return 0
            fi

            echo "Failed to resolve release target '${target_input}' to a commit." >&2
            return 1
          }

          load_buddy_authorized_refs() {
            local project_id="${1}"
            uv run python eng/scripts/workflow_release_control.py buddy-authorized-refs \
              --project "${project_id}" \
              --channel buddy
          }

          fetch_buddy_authorized_refs() {
            local allowed_ref
            local branch
            local fetch_specs=()

            for allowed_ref in "${buddy_authorized_refs[@]}"; do
              if [[ "${allowed_ref}" != refs/heads/* ]]; then
                echo "Buddy authorized ref must be an exact branch ref: ${allowed_ref}" >&2
                return 1
              fi
              branch="${allowed_ref#refs/heads/}"
              fetch_specs+=("+${allowed_ref}:refs/remotes/origin/${branch}")
            done

            if [[ "${#fetch_specs[@]}" -eq 0 ]]; then
              echo "No buddy authorized refs are configured for project '${project_id}'." >&2
              return 1
            fi

            if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
              git fetch --no-tags --unshallow origin "${fetch_specs[@]}"
            else
              git fetch --no-tags --prune origin "${fetch_specs[@]}"
            fi
          }

          assert_buddy_target_authorized() {
            local target_label="${1}"
            local target_sha="${2}"
            local allowed_ref
            local branch
            local local_ref

            fetch_buddy_authorized_refs
            for allowed_ref in "${buddy_authorized_refs[@]}"; do
              branch="${allowed_ref#refs/heads/}"
              local_ref="refs/remotes/origin/${branch}"
              if ! git rev-parse --verify --end-of-options "${local_ref}^{commit}" >/dev/null 2>&1; then
                continue
              fi
              if git merge-base --is-ancestor "${target_sha}" "${local_ref}"; then
                return 0
              fi
            done

            echo "Buddy target '${target_label}' resolved to ${target_sha}, which is not reachable from an authorized buddy ref for project '${project_id}'." >&2
            printf 'Authorized buddy refs:' >&2
            printf ' %s' "${buddy_authorized_refs[@]}" >&2
            printf '\n' >&2
            return 1
          }

          if ! project_resolution="$(
            uv run python eng/scripts/workflow_release_control.py resolve-project \
              --project "${requested_project}"
          )"; then
            echo "Failed to resolve canonical project id for '${requested_project}'." >&2
            exit 1
          fi
          project_id=$(printf '%s' "${project_resolution}" | jq -r '.project_id')
          if [[ -z "${project_id}" || "${project_id}" == "null" ]]; then
            echo "Canonical project id resolution returned an empty project id." >&2
            exit 1
          fi

          mapfile -t buddy_authorized_refs < <(
            load_buddy_authorized_refs "${project_id}"
          )
          if [[ "${#buddy_authorized_refs[@]}" -eq 0 ]]; then
            echo "No buddy authorized refs are configured for project '${project_id}'." >&2
            exit 1
          fi

          if [[ "${RELEASE_REF_TYPE}" == "tag" ]]; then
            release_version="${RELEASE_REF_NAME##*/v}"
          else
            release_version="${RELEASE_VERSION}"
          fi
          if [[ -z "${release_version}" ]]; then
            echo "Unable to derive a release version for concurrency." >&2
            exit 1
          fi

          release_target_input="${RELEASE_TARGET}"
          if [[ -z "${release_target_input}" ]]; then
            release_target_input="${RELEASE_PINNED_SHA}"
          fi

          if ! release_target="$(resolve_release_target "${release_target_input}")"; then
            exit 1
          fi
          if ! assert_buddy_target_authorized "${release_target_input}" "${release_target}"; then
            exit 1
          fi

          release_group="release/${project_id}/v${release_version}"
          {
            echo "project_id=${project_id}"
            echo "release_group=${release_group}"
            echo "release_target_sha=${release_target}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload authorization diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-planner-diagnostics-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: .three-workflow-release/entry/planner-diagnostics.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  orchestrate:
    name: Orchestrate buddy release
    needs: authorize-entry
    concurrency:
      group: ${{ needs.authorize-entry.outputs.release_group }}
      cancel-in-progress: false
    uses: ./.github/workflows/release-orchestrate.yml
    secrets: {}
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      source: manual
      project: ${{ inputs.project }}
      version: ${{ inputs.version }}
      target: ${{ needs.authorize-entry.outputs.release_target_sha }}
      force_update_tag: ${{ inputs.force_update_tag }}
      run_url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}

      channel: buddy
      artifact_prefix: buddy
      github_release_prerelease: true

      enforce_prerelease_only: true
      enforce_non_clobber: true

      publish_python_pypi: false
      publish_node_gpr: true
      publish_node_npmjs: false
      publish_ruby_gpr: true
      publish_ruby_rubygems: false

      enable_attestation: false

  report:
    name: Report pre-orchestration failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: authorize-entry
    if: ${{ always() && needs.authorize-entry.result != 'success' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: '0.10.9'

      - name: Download authorization diagnostics
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: release-planner-diagnostics-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: .three-workflow-release/entry

      - name: Generate release report
        shell: bash
        env:
          REPORT_PATH: .three-workflow-release/release-report.json
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: buddy.yml
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          PROFILE: buddy
          DRY_RUN: 'false'
          VALIDATION_BUILD: 'false'
          CANARY_OVERRIDE_NON_PUBLIC_REF: 'false'
          AUTHORIZE_CONCLUSION: ${{ needs.authorize-entry.result }}
          VALIDATE_CONCLUSION: skipped
          METADATA_CONCLUSION: skipped
          PLAN_CONCLUSION: skipped
          BUILD_CONCLUSION: skipped
          TAG_CONCLUSION: skipped
          PUBLISH_CONCLUSION: skipped
          DIAGNOSTICS_PATH: .three-workflow-release/entry/planner-diagnostics.json
        run: |
          set -Eeuo pipefail
          uv run python eng/scripts/workflow_release_control.py report \
            --repository "$REPOSITORY" \
            --workflow "$WORKFLOW" \
            --run-id "$RUN_ID" \
            --attempt "$RUN_ATTEMPT" \
            --head-sha "$HEAD_SHA" \
            --profile "$PROFILE" \
            --dry-run "$DRY_RUN" \
            --validation-build "$VALIDATION_BUILD" \
            --canary-override-non-public-ref "$CANARY_OVERRIDE_NON_PUBLIC_REF" \
            --out "$REPORT_PATH" \
            --plan "" \
            --execution-sets "" \
            --diagnostics "$DIAGNOSTICS_PATH" \
            --authorize-conclusion "$AUTHORIZE_CONCLUSION" \
            --validate-conclusion "$VALIDATE_CONCLUSION" \
            --metadata-conclusion "$METADATA_CONCLUSION" \
            --plan-conclusion "$PLAN_CONCLUSION" \
            --build-conclusion "$BUILD_CONCLUSION" \
            --tag-conclusion "$TAG_CONCLUSION" \
            --publish-conclusion "$PUBLISH_CONCLUSION"

      - name: Upload release report
        uses: actions/upload-artifact@v7
        with:
          name: release-report-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: .three-workflow-release/release-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
