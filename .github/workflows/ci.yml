name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select affected validation
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    outputs:
      validation: ${{ steps.select.outputs.validation }}
      mise: ${{ steps.select.outputs.mise }}
      dotnet: ${{ steps.select.outputs.dotnet }}
      node: ${{ steps.select.outputs.node }}
      azureauth: ${{ steps.select.outputs.azureauth }}
      ruby: ${{ steps.select.outputs.ruby }}
      scholarly: ${{ steps.select.outputs.scholarly }}
      nuget_reproducibility: ${{ steps.select.outputs.nuget_reproducibility }}
      base: ${{ steps.select.outputs.base }}
      candidate: ${{ steps.select.outputs.candidate }}
      full: ${{ steps.select.outputs.full }}
      artifact_id: ${{ steps.retain.outputs.artifact-id }}
      dotnet_artifact_id: ${{ steps.retain-dotnet.outputs.artifact-id }}
    steps:
      - name: Checkout tested candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup selection Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Setup locked selection dependencies
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Prepare existing root selection parser
        run: uv sync --frozen --only-group dev --no-install-project --no-install-workspace
      - name: Setup candidate control SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Setup native endpoint tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          experimental: true
          install: false
      - name: Prepare the complete candidate control application
        id: control
        env:
          MSBUILDLOGTASKINPUTS: '1'
          MSBUILDLOGTASKOUTPUTS: '1'
        run: python eng/scripts/run_dotnet_ci_group.py bootstrap --directory "$RUNNER_TEMP/dotnet-group"
      - name: Resolve and materialize exact control-input endpoints
        id: materialize
        run: |
          python eng/scripts/prepare_ci_control_inputs.py --application "${{ steps.control.outputs.application }}" prepare \
            --directory "$RUNNER_TEMP/ci-control-inputs" --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" --candidate "$GITHUB_SHA"
      - name: Setup candidate resource SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ steps.materialize.outputs.candidate_directory }}/global.json
      - name: Setup basis resource SDK
        if: steps.materialize.outputs.basis_separate == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ steps.materialize.outputs.basis_directory }}/global.json
      - name: Prepare locked unfiltered native endpoint facts
        id: dotnet-group
        run: |
          python eng/scripts/run_dotnet_ci_group.py prepare --directory "$RUNNER_TEMP/dotnet-group" \
            --endpoints "$RUNNER_TEMP/ci-control-inputs/group-endpoints.json"
      - name: Select work from the actual comparison
        id: select
        env:
          CONTROL_REQUEST: ${{ steps.materialize.outputs.request }}
          COMPARISON_BASE: ${{ steps.materialize.outputs.basis }}
          TESTED_CANDIDATE: ${{ steps.materialize.outputs.candidate }}
          FULL: ${{ steps.materialize.outputs.full }}
        run: |
          python --version
          python eng/scripts/prepare_ci_control_inputs.py --application "${{ steps.control.outputs.application }}" evaluate \
            --request "$CONTROL_REQUEST" --response "$RUNNER_TEMP/ci-control-inputs/response.json"
          if [[ "$FULL" == 'true' ]]; then
            uv run --frozen --no-sync python eng/scripts/ci_scope.py --full --control-inputs "$RUNNER_TEMP/ci-control-inputs/response.json" \
              --output artifacts/ci-scope.json --application "${{ steps.control.outputs.application }}" \
              --dotnet-group-request "${{ steps.dotnet-group.outputs.request }}"
          else
            uv run --frozen --no-sync python eng/scripts/ci_scope.py --from-ref "$COMPARISON_BASE" \
              --to-ref "$TESTED_CANDIDATE" --control-inputs "$RUNNER_TEMP/ci-control-inputs/response.json" \
              --output artifacts/ci-scope.json --application "${{ steps.control.outputs.application }}" \
              --dotnet-group-request "${{ steps.dotnet-group.outputs.request }}"
          fi
      - name: Retain selection and reasons
        id: retain
        uses: actions/upload-artifact@v7
        with:
          name: ci-scope
          path: artifacts/ci-scope.json
          if-no-files-found: error
          retention-days: 7
      - name: Transfer original plan and complete native control output
        id: retain-dotnet
        uses: actions/upload-artifact@v7
        with:
          name: ci-dotnet-plan
          path: ${{ steps.control.outputs.transfer }}/
          if-no-files-found: error
          retention-days: 7

  validation:
    name: Validate
    runs-on: ubuntu-latest
    needs: [conformance, scholarly-tests, nuget-reproducibility]
    if: always()
    steps:
      - name: Require complete validation results
        if: always()
        env:
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          SCHOLARLY_RESULT: ${{ needs.scholarly-tests.result }}
          NUGET_REPRO_RESULT: ${{ needs.nuget-reproducibility.result }}
        run: |
          if [[ "$CONFORMANCE_RESULT" != 'success' || "$SCHOLARLY_RESULT" != 'success' || "$NUGET_REPRO_RESULT" != 'success' ]]; then
            echo "Required validation did not complete: source=$CONFORMANCE_RESULT, scholarly=$SCHOLARLY_RESULT, nuget=$NUGET_REPRO_RESULT." >&2
            exit 1
          fi
      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  mise-lock:
    name: Validate mise lockfile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    needs: scope
    if: ${{ !cancelled() }}

    steps:
      - name: Require successful scope selection
        id: scope
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.mise }}
        run: |
          case "$SELECTION_RESULT:$APPLICABLE" in
            success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac

      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Set up mise
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          experimental: true
          install: false

      - name: Validate lockfile
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        run: mise install --locked --dry-run --monorepo

      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  conformance:
    name: Source conformance
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: dotnet,go,java,node,powershell,python,ruby,pkl

    needs: scope
    if: ${{ !cancelled() }}

    steps:
      - name: Require successful scope selection
        id: scope
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.validation }}
        run: |
          case "$SELECTION_RESULT:$APPLICABLE" in
            success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac

      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Go
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.*'

      - name: Setup Java
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up PNPM
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.10.0

      - name: Set up Node.js
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python 3
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up Ruby
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true

      - name: Install pkl
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: pkl-community/setup-pkl@0bffd1602015ccf46333e880f81087e73fd1a361 # v0
        with:
          pkl-version: 0.31.1

      - name: Capture setup tool paths
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          dotnet_path="$(command -v dotnet)"
          go_path="$(command -v go)"
          java_path="$(command -v java)"
          node_path="$(command -v node)"
          powershell_path="$(command -v pwsh)"
          python_path="$(command -v python3)"
          ruby_path="$(command -v ruby)"

          {
            printf 'MISE_LINK_DOTNET=%s\n' "$dotnet_path"
            printf 'MISE_LINK_GO=%s\n' "$go_path"
            printf 'MISE_LINK_JAVA=%s\n' "$java_path"
            printf 'MISE_LINK_NODE=%s\n' "$node_path"
            printf 'MISE_LINK_POWERSHELL=%s\n' "$powershell_path"
            printf 'MISE_LINK_PYTHON=%s\n' "$python_path"
            printf 'MISE_LINK_RUBY=%s\n' "$ruby_path"
          } >> "$GITHUB_ENV"

      - name: Mise Install Tools
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          experimental: true
          install: false

      - name: Install dependencies
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mise link --force core:dotnet@10 "$MISE_LINK_DOTNET"
          mise link --force go@1 "$MISE_LINK_GO"
          mise link --force java@25 "$MISE_LINK_JAVA"
          mise link --force node@24 "$MISE_LINK_NODE"
          mise link --force powershell@7 "$MISE_LINK_POWERSHELL"
          mise link --force python@3.14 "$MISE_LINK_PYTHON"
          mise link --force ruby@3.3 "$MISE_LINK_RUBY"

          mise install --locked
          mise bootstrap

      - name: Validate with HK
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        env:
          HK_PROFILE: small,medium,large
          CI_BASE: ${{ needs.scope.outputs.base }}
          CI_CANDIDATE: ${{ needs.scope.outputs.candidate }}
          CI_FULL: ${{ needs.scope.outputs.full }}
        run: |
          set -Eeuo pipefail
          if [[ "$CI_FULL" == 'true' ]]; then
            hk check --check --no-stage --no-progress --no-fail-fast --all
          else
            python eng/scripts/workflow_delivery_v3_hk.py \
              --from-ref "$CI_BASE" --to-ref "$CI_CANDIDATE" --files0 \
              -- hk check --check --no-stage --no-progress --no-fail-fast
          fi

      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  dotnet-tests:
    name: Build & Test (.NET 10)
    runs-on: windows-latest

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      NUGET_AUTHORITY_DIAGNOSTICS_DIRECTORY: ${{ github.workspace }}/artifacts/nuget-authority-diagnostics
      NUGET_AUTHORITY_DUMP_TOOL: ${{ github.workspace }}/artifacts/nuget-authority-tools/dotnet-dump.exe

    permissions:
      contents: read
      actions: read
    needs: scope
    if: ${{ !cancelled() }}

    steps:
      - name: Require successful scope and exact native plan artifact
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          PLAN_ARTIFACT_ID: ${{ needs.scope.outputs.dotnet_artifact_id }}
        run: |
          test "$SELECTION_RESULT" = success
          [[ "$PLAN_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]

      - name: Checkout tested candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup candidate SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Read native artifact producer and lifetime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_ARTIFACT_ID: ${{ needs.scope.outputs.dotnet_artifact_id }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PLAN_ARTIFACT_ID" > "$RUNNER_TEMP/dotnet-plan-artifact.json"

      - name: Receive exact original plan and complete control distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.scope.outputs.dotnet_artifact_id }}
          path: ${{ runner.temp }}/dotnet-plan-transfer
          merge-multiple: true

      - name: Prepare NuGet authority dump collection
        if: ${{ success() && needs.scope.outputs.dotnet == 'true' }}
        continue-on-error: true
        shell: pwsh
        run: dotnet tool install dotnet-dump --version 10.0.745401 --tool-path (Split-Path $env:NUGET_AUTHORITY_DUMP_TOOL)

      - name: Execute and collect the unchanged original native plan
        shell: bash
        env:
          PLAN_ARTIFACT_ID: ${{ needs.scope.outputs.dotnet_artifact_id }}
          COMPARISON_BASIS: ${{ needs.scope.outputs.base }}
          TESTED_CANDIDATE: ${{ needs.scope.outputs.candidate }}
        run: |
          python eng/scripts/run_dotnet_ci_group.py execute --transfer "$RUNNER_TEMP/dotnet-plan-transfer" \
            --directory "$RUNNER_TEMP/dotnet-execution" --artifact-metadata "$RUNNER_TEMP/dotnet-plan-artifact.json" \
            --artifact-id "$PLAN_ARTIFACT_ID" --run-id "$GITHUB_RUN_ID" --repository-id "$GITHUB_REPOSITORY_ID" \
            --basis "$COMPARISON_BASIS" --candidate "$TESTED_CANDIDATE"

      - name: Retain native planning, execution and collection facts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-group-results
          path: ${{ runner.temp }}/dotnet-execution/
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain NuGet authority diagnostics
        continue-on-error: true
        if: >-
          (failure() || hashFiles('artifacts/nuget-authority-diagnostics/**/slow-process.txt') != '')
        uses: actions/upload-artifact@v7
        with:
          name: nuget-authority-diagnostics-${{ github.run_attempt }}
          path: |
            artifacts/nuget-authority-diagnostics/
            src/private/app/workflow-delivery-v3-nuget-authority/bin/Debug/net10.0/
          if-no-files-found: warn
          retention-days: 7

      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  azureauth-foundation-artifacts:
    name: AzureAuth Foundation Artifact (${{ matrix.build-os }} build, ${{ matrix.target-os }} target, ${{ matrix.target-rid }})
    runs-on: ${{ matrix.build-runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build-os: Windows
            build-runner: windows-latest
            target-os: Windows
            target-rid: win-x64
            run-host-tests: false
            run-deployment-validation: true
          - build-os: Linux
            build-runner: ubuntu-latest
            target-os: Linux
            target-rid: linux-x64
            run-host-tests: true
            run-deployment-validation: true
          - build-os: macOS
            build-runner: macos-latest
            target-os: macOS
            target-rid: osx-x64
            run-host-tests: true
            run-deployment-validation: false

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    needs: scope
    if: ${{ !cancelled() }}

    steps:
      - name: Require successful scope selection
        id: scope
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.azureauth }}
        run: |
          case "$SELECTION_RESULT:$APPLICABLE" in
            success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac

      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/private/app/azureauth-credprovider/Hcoona.AzureAuth.CredProvider.Contracts/packages.lock.json
            src/private/app/azureauth-credprovider/Hcoona.AzureAuth.CredProvider.Platform/packages.lock.json
            tests/private/app/azureauth-credprovider/Hcoona.AzureAuth.CredProvider.Platform.Tests/packages.lock.json

      - name: Restore dotnet tools for deployment validation
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && (matrix.run-deployment-validation)
        run: dotnet tool restore

      - name: Test AzureAuth host OS behavior
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && (matrix.run-host-tests)
        timeout-minutes: 15
        shell: pwsh
        run: |
          dotnet test `
            --project tests/private/app/azureauth-credprovider/Hcoona.AzureAuth.CredProvider.Platform.Tests/Hcoona.AzureAuth.CredProvider.Platform.Tests.csproj `
            --configuration Release `
            --filter-class `
              Hcoona.AzureAuth.CredProvider.Platform.Tests.SystemFileSystemTests `
              Hcoona.AzureAuth.CredProvider.Platform.Tests.SystemProcessRunnerTests `
            -p:RestoreLockedMode=true

      - name: Test foundation artifact script
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: pwsh
        run: ./tests/private/app/azureauth-credprovider/New-FoundationArtifact.Tests.ps1

      - name: Create internal foundation artifact
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          ./eng/scripts/azureauth-credprovider/New-FoundationArtifact.ps1 `
            -BuildOs '${{ matrix.build-os }}' `
            -TargetRid '${{ matrix.target-rid }}' `
            -Configuration Release `
            -ProductVersion '0.0.0-internal' `
            -SourceRevision '${{ github.sha }}'

      - name: Upload internal foundation artifact
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: azureauth-credprovider-foundation-internal-${{ matrix.build-os }}-${{ matrix.target-rid }}
          path: artifacts/azureauth-credprovider/foundation/azureauth-credprovider-foundation-internal-${{ matrix.build-os }}-${{ matrix.target-rid }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Setup Python 3.14 for deployment validation
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && (matrix.run-deployment-validation)
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv for deployment validation
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && (matrix.run-deployment-validation)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Create deployment validation bundle
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && (matrix.run-deployment-validation)
        shell: pwsh
        run: |
          ./eng/scripts/azureauth-credprovider/New-DeploymentValidationBundle.ps1 `
            -BuildOs '${{ matrix.build-os }}' `
            -TargetRid '${{ matrix.target-rid }}' `
            -Configuration Release

      - name: Test deployment validation lifecycle
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && (matrix.run-deployment-validation)
        shell: pwsh
        run: |
          ./tests/private/app/azureauth-credprovider/Install-DeploymentValidationBundle.Tests.ps1 `
            -BundlePath (
              'artifacts/azureauth-credprovider/deployment-validation/' +
              'azureauth-credprovider-deployment-validation-internal-' +
              '${{ matrix.build-os }}-${{ matrix.target-rid }}.zip'
            )

      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  node-group:
    name: Select and execute adopted Node checks
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    outputs:
      retained: ${{ steps.execute.outputs.retained }}
      retained_directories: ${{ steps.execute.outputs.retained_directories }}
      adopted_directory: ${{ steps.execute.outputs.adopted_directory }}
    steps:
      - name: Require the actual scope artifact
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          SCOPE_ARTIFACT_ID: ${{ needs.scope.outputs.artifact_id }}
        run: |
          test "$SELECTION_RESULT" = success
          [[ "$SCOPE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Checkout tested candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup native tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          experimental: true
          install: false
      - name: Read native artifact producer and lifetime
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE_ARTIFACT_ID: ${{ needs.scope.outputs.artifact_id }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SCOPE_ARTIFACT_ID" > "$RUNNER_TEMP/ci-scope-artifact.json"
      - name: Download the exact scope artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.scope.outputs.artifact_id }}
          path: artifacts/node-scope
          merge-multiple: true
      - name: Plan and execute the complete Node group
        id: execute
        env:
          SCOPE_ARTIFACT_ID: ${{ needs.scope.outputs.artifact_id }}
          pnpm_config_verify_deps_before_run: 'false'
        run: |
          mise exec -- uv run --frozen python eng/scripts/run_node_ci_group.py group \
            --scope-file artifacts/node-scope/ci-scope.json \
            --artifact-metadata "$RUNNER_TEMP/ci-scope-artifact.json" \
            --artifact-id "$SCOPE_ARTIFACT_ID" --run-id "$GITHUB_RUN_ID" \
            --repository-id "$GITHUB_REPOSITORY_ID" --directory "$RUNNER_TEMP/node-group"
      - name: Retain actual planning and execution outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-group-results
          path: |
            ${{ runner.temp }}/node-group/*.json
            ${{ runner.temp }}/node-group/*.stdout
            ${{ runner.temp }}/node-group/*.stderr
          if-no-files-found: ignore
          retention-days: 7
      - name: Reject canceled validation
        if: cancelled()
        run: |
          echo 'Node group was canceled before a complete result.' >&2
          exit 1

  node-tests:
    name: Test & Build (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      PACKAGE_DIR: src/public/lib/hexo-renderer-asciidoc

    needs: [scope, node-group]
    if: ${{ !cancelled() }}

    steps:
      - name: Require successful scope selection
        id: scope
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          GROUP_RESULT: ${{ needs.node-group.result }}
          APPLICABLE: ${{ needs.node-group.outputs.retained }}
        run: |
          case "$SELECTION_RESULT:$GROUP_RESULT:$APPLICABLE" in
            success:success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac

      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up PNPM
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.10.0

      - name: Set up Node.js
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile
          dotnet tool restore

      - name: Record actual tool versions
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        run: |
          set -Eeuo pipefail
          echo "node=$(node --version)"
          echo "pnpm=$(pnpm --version)"
          echo "npm=$(npm --version)"

      - name: Execute selected retained members
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        env:
          RETAINED_DIRECTORIES: ${{ needs.node-group.outputs.retained_directories }}
          ADOPTED_DIRECTORY: ${{ needs.node-group.outputs.adopted_directory }}
        run: |
          python eng/scripts/run_node_ci_group.py retained \
            --directories "$RETAINED_DIRECTORIES" --adopted-directory "$ADOPTED_DIRECTORY" \
            --directory "$RUNNER_TEMP/retained-node"

      - name: Retain selected Node command diagnostics
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: retained-node-${{ matrix.node-version }}
          path: |
            ${{ runner.temp }}/retained-node/*.json
            ${{ runner.temp }}/retained-node/*.stdout
            ${{ runner.temp }}/retained-node/*.stderr
          if-no-files-found: ignore
          retention-days: 7

      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  nuget-reproducibility:
    name: NuGet reproducible build (Windows)
    runs-on: windows-latest
    needs: scope
    if: ${{ !cancelled() }}
    env:
      WDV3_NUGET_REPRO_EVIDENCE: ${{ github.workspace }}/artifacts/nuget-reproducibility
    steps:
      - name: Require successful scope selection
        id: scope
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.nuget_reproducibility }}
        run: |
          case "$SELECTION_RESULT:$APPLICABLE" in
            success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac
      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET SDK
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Setup Python
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install uv
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: .config/uv/uv.toml
      - name: Restore .NET tools
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        run: dotnet tool restore
      - name: Verify original archives and fresh-Attempt recovery
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          uv run --frozen --package three-workflow-delivery-v3 pytest `
            src/public/lib/three-workflow-delivery-v3/tests/adapters/test_dotnet.py `
            src/public/lib/three-workflow-delivery-v3/tests/release/test_nuget_native_recovery.py `
            -k 'reproduc or target_timestamp or negative_controls or fresh_nuget_attempt' `
            --basetemp "$env:RUNNER_TEMP/nuget-repro-pytest" `
            --junitxml "$env:WDV3_NUGET_REPRO_EVIDENCE/junit.xml"
      - name: Retain original archives and native evidence
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-reproducibility-windows
          path: artifacts/nuget-reproducibility
          if-no-files-found: error
          retention-days: 30
      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  python-tests:
    name: Test (Python 3.14)
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Require successful comparison and exact native artifacts
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          SCOPE_ARTIFACT_ID: ${{ needs.scope.outputs.artifact_id }}
          CONTROL_ARTIFACT_ID: ${{ needs.scope.outputs.dotnet_artifact_id }}
        run: |
          test "$SELECTION_RESULT" = success
          [[ "$SCOPE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CONTROL_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Checkout tested candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Python query interpreter
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Read native artifact producers and lifetimes
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE_ARTIFACT_ID: ${{ needs.scope.outputs.artifact_id }}
          CONTROL_ARTIFACT_ID: ${{ needs.scope.outputs.dotnet_artifact_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SCOPE_ARTIFACT_ID" > "$RUNNER_TEMP/python-scope-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CONTROL_ARTIFACT_ID" > "$RUNNER_TEMP/python-control-artifact.json"
      - name: Receive exact scope
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.scope.outputs.artifact_id }}
          path: ${{ runner.temp }}/python-scope
          merge-multiple: true
      - name: Receive complete candidate control and native sources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.scope.outputs.dotnet_artifact_id }}
          path: ${{ runner.temp }}/python-control
          merge-multiple: true
      - name: Materialize exact committed endpoints
        id: endpoints
        env:
          SCOPE_ARTIFACT_ID: ${{ needs.scope.outputs.artifact_id }}
          CONTROL_ARTIFACT_ID: ${{ needs.scope.outputs.dotnet_artifact_id }}
        run: |
          python eng/scripts/run_python_ci_group.py materialize \
            --scope-file "$RUNNER_TEMP/python-scope/ci-scope.json" --transfer "$RUNNER_TEMP/python-control" \
            --scope-metadata "$RUNNER_TEMP/python-scope-artifact.json" --scope-artifact-id "$SCOPE_ARTIFACT_ID" \
            --control-metadata "$RUNNER_TEMP/python-control-artifact.json" --control-artifact-id "$CONTROL_ARTIFACT_ID" \
            --run-id "$GITHUB_RUN_ID" --repository-id "$GITHUB_REPOSITORY_ID" --directory "$RUNNER_TEMP/python-group"
      - name: Setup basis NBGV SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ steps.endpoints.outputs.basis_directory }}/global.json
      - name: Setup candidate NBGV and control SDK
        if: steps.endpoints.outputs.basis_separate == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ steps.endpoints.outputs.candidate_directory }}/global.json
      - name: Setup native UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: .config/uv/uv.toml
          enable-cache: false
      - name: Prepare native query tools and select once
        id: plan
        run: python eng/scripts/run_python_ci_group.py plan --directory "$RUNNER_TEMP/python-group"
      - name: Setup selected PNPM adapter
        if: steps.plan.outputs.legacy_v3 == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.10.0
      - name: Setup selected Node adapter
        if: steps.plan.outputs.legacy_v3 == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Setup selected HK and Pkl adapters
        if: steps.plan.outputs.legacy_v3 == 'true'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/python-auxiliary-mise
        with:
          experimental: true
          install_args: aqua:jdx/hk pkl
      - name: Setup selected Ruby adapter
        if: steps.plan.outputs.legacy_v3 == 'true'
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0.7'
      - name: Execute and collect original Python plan
        run: |
          python eng/scripts/run_python_ci_group.py execute --directory "$RUNNER_TEMP/python-group" \
            --mise-data-directory "$RUNNER_TEMP/python-auxiliary-mise"
      - name: Retain original Python plan and actual results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-group-results
          path: |
            ${{ runner.temp }}/python-group/*.json
            ${{ runner.temp }}/python-group/*.stdout
            ${{ runner.temp }}/python-group/*.stderr
            ${{ runner.temp }}/python-group/query-preparation/preparation-failure.json
            ${{ runner.temp }}/python-group/execution/**/*.json
            ${{ runner.temp }}/python-group/execution/pytest/junit-*.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Reject canceled validation
        if: cancelled()
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  ruby-tests:
    name: Test (Ruby 3.3)
    runs-on: ubuntu-latest

    needs: scope
    if: ${{ !cancelled() }}

    steps:
      - name: Require successful scope selection
        id: scope
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.ruby }}
        run: |
          case "$SELECTION_RESULT:$APPLICABLE" in
            success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac

      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Ruby
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0.7'

      - name: Install system dependencies
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            dvisvgm \
            pdf2svg \
            poppler-utils \
            imagemagick \
            ghostscript \
            fd-find
      - name: Ensure fd is available
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          if command -v fd >/dev/null 2>&1; then
            fd --version
            exit 0
          fi

          if command -v fdfind >/dev/null 2>&1; then
            fdfind --version
            mkdir -p "${HOME}/.local/bin"
            ln -sf "$(command -v fdfind)" "${HOME}/.local/bin/fd" || true
            export PATH="${HOME}/.local/bin:${PATH}"
            fd --version
            exit 0
          fi

          echo "fd is not available" >&2
          exit 1

      - name: Run Ruby gem tests
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t gemspecs < <(fd -e gemspec)
          if [[ "${#gemspecs[@]}" -eq 0 ]]; then
            echo "No *.gemspec found; skipping Ruby tests."
            exit 0
          fi

          printf 'Discovered gemspecs:\n'
          printf ' - %s\n' "${gemspecs[@]}"

          failures=0
          for gemspec in "${gemspecs[@]}"; do
            dir="$(dirname "${gemspec}")"
            echo ""
            echo "==> Testing Ruby gem in ${dir}"

            if [[ ! -f "${dir}/Gemfile" ]]; then
              echo "No Gemfile in ${dir}; skipping Bundler/RSpec."
              continue
            fi

            if [[ ! -d "${dir}/spec" ]]; then
              echo "No spec/ directory in ${dir}; skipping RSpec."
              continue
            fi

            pushd "${dir}" >/dev/null
            bundle install
            bundle exec rspec || failures=$((failures + 1))
            popd >/dev/null
          done

          if [[ "${failures}" -ne 0 ]]; then
            echo "Ruby test failures: ${failures}" >&2
            exit 1
          fi

      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  scholarly-tests:
    name: Test scholarly publication
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ !cancelled() }}
    steps:
      - name: Require successful scope selection
        id: scope
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.scholarly }}
        run: |
          case "$SELECTION_RESULT:$APPLICABLE" in
            success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac
      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
      - name: Install uv
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up mise
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          experimental: true
          install: false
      - name: Run scholarly project tests
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        env:
          MISE_TASK_RUN_AUTO_INSTALL: 'false'
        run: mise run scholarly-publication-plugin-test
      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1
