  execution-batch-macos-orchestrator:
    name: execution-batch-macos-orchestrator
    needs:
      - normalize-input
      - plan
      - materialize-execution-batches
    if: always() && needs.materialize-execution-batches.outputs.has-macos-execution-batches == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        id: setup-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.10.9'
      - name: Retry uv installation
        if: ${{ steps.setup-uv.outcome == 'failure' }}
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.10.9'
      - name: Install .NET for NBGV-backed release planning
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore .NET local tools for NBGV-backed release planning
        shell: bash
