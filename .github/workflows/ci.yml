name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_LOCKED: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select affected validation
    runs-on: windows-latest
    env:
      MISE_EXEC_AUTO_INSTALL: '0'
    defaults:
      run:
        shell: bash
    outputs:
      validation: ${{ steps.select.outputs.validation }}
      mise: ${{ steps.select.outputs.mise }}
      azureauth: ${{ steps.select.outputs.azureauth }}
      scholarly: ${{ steps.select.outputs.scholarly }}
      nuget_native_preparation: ${{ steps.select.outputs.nuget_native_preparation }}
      base: ${{ steps.select.outputs.base }}
      candidate: ${{ steps.select.outputs.candidate }}
      full: ${{ steps.select.outputs.full }}
      artifact_id: ${{ steps.retain.outputs.artifact-id }}
      dotnet_artifact_id: ${{ steps.retain-dotnet.outputs.artifact-id }}
    steps:
      - name: Checkout tested candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup candidate control SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Setup native endpoint tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # Preserve the existing Java vendor semantics at both endpoints.
          version: '2026.10.11'
          experimental: true
          install_args: dotnet node pnpm
      - name: Prepare the complete candidate control application
        id: control
        shell: pwsh
        run: ./eng/scripts/Bootstrap-CiControl.ps1 -Repository "$env:GITHUB_WORKSPACE" -Directory "$env:RUNNER_TEMP/dotnet-group"
      - name: Resolve and materialize exact control-input endpoints
        id: materialize
        run: |
          dotnet "${{ steps.control.outputs.application }}" ci caller-control prepare \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ci-control-inputs" "$GITHUB_EVENT_NAME" \
            "$GITHUB_EVENT_PATH" "$GITHUB_SHA"
      - name: Setup candidate resource SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ steps.materialize.outputs.candidate_directory }}/global.json
      - name: Setup basis resource SDK
        if: steps.materialize.outputs.basis_separate == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ steps.materialize.outputs.basis_directory }}/global.json
      - name: Prepare locked unfiltered native endpoint facts
        id: dotnet-group
        run: |
          mkdir -p "$RUNNER_TEMP/dotnet-group/endpoint-preparation"
          jq -r '[.basis.directory,.candidate.directory]|unique[]' \
            "$RUNNER_TEMP/ci-control-inputs/group-endpoints.json" \
            > "$RUNNER_TEMP/dotnet-group/endpoint-preparation/directories.txt"
          while IFS= read -r endpoint; do
            endpoint=${endpoint%$'\r'}
            (
              cd "$endpoint"
              mise install --locked dotnet node pnpm
              mise exec --locked dotnet -- dotnet tool restore
              mise exec --locked dotnet -- dotnet restore dirs.proj \
                -property:Configuration=Debug -property:ContinuousIntegrationBuild=true \
                -property:RestoreLockedMode=true \
                "-binaryLogger:$RUNNER_TEMP/dotnet-group/endpoint-preparation/$(basename "$endpoint").binlog"
            )
          done < "$RUNNER_TEMP/dotnet-group/endpoint-preparation/directories.txt"
          dotnet "${{ steps.control.outputs.application }}" ci caller-dotnet prepare \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dotnet-group" "$RUNNER_TEMP/ci-control-inputs/group-endpoints.json"
      - name: Select work from the actual comparison
        id: select
        env:
          CONTROL_REQUEST: ${{ steps.materialize.outputs.request }}
        run: |
          dotnet "${{ steps.control.outputs.application }}" ci caller-dotnet select "$GITHUB_WORKSPACE" \
            "${{ steps.dotnet-group.outputs.request }}" "$CONTROL_REQUEST" \
            "${{ steps.control.outputs.transfer }}" artifacts/ci-scope.json
      - name: Retain selection and reasons
        id: retain
        uses: actions/upload-artifact@v7
        with:
          name: ci-scope
          path: artifacts/ci-scope.json
          if-no-files-found: error
          retention-days: 7
      - name: Transfer original plan and complete native control output
        id: retain-dotnet
        uses: actions/upload-artifact@v7
        with:
          name: ci-dotnet-plan
          path: ${{ steps.control.outputs.transfer }}/
          if-no-files-found: error
          retention-days: 7

  validation:
    name: Validate
    runs-on: ubuntu-latest
    needs: [conformance, scholarly-tests, nuget-native-preparation, native-preparation-tests]
    if: always()
    steps:
      - name: Require complete validation results
        if: always()
        env:
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          SCHOLARLY_RESULT: ${{ needs.scholarly-tests.result }}
          NUGET_PREPARATION_RESULT: ${{ needs.nuget-native-preparation.result }}
          PREPARATION_RESULT: ${{ needs.native-preparation-tests.result }}
        run: |
          if [[ "$CONFORMANCE_RESULT" != 'success' || "$SCHOLARLY_RESULT" != 'success' || "$NUGET_PREPARATION_RESULT" != 'success' || "$PREPARATION_RESULT" != 'success' ]]; then
            echo "Required validation did not complete: source=$CONFORMANCE_RESULT, scholarly=$SCHOLARLY_RESULT, nuget=$NUGET_PREPARATION_RESULT, preparation=$PREPARATION_RESULT." >&2
            exit 1
          fi
      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  mise-lock:
    name: Validate mise lockfile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    needs: scope
    if: ${{ !cancelled() }}

    steps:
      - name: Require successful scope selection
        id: scope
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.mise }}
        run: |
          case "$SELECTION_RESULT:$APPLICABLE" in
            success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac

      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Set up mise
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: '2026.10.11'
          experimental: true
          install: false

      - name: Validate lockfile
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        run: mise install --locked --dry-run --monorepo

      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  conformance:
    name: Source conformance
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: dotnet,go,java,node,powershell,python,ruby,pkl,gopass

    needs: scope
    if: ${{ !cancelled() }}

    steps:
      - name: Require successful scope selection
        id: scope
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.validation }}
        run: |
          case "$SELECTION_RESULT:$APPLICABLE" in
            success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac

      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Go
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.*'

      - name: Setup Java
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up PNPM
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.13.0

      - name: Set up Node.js
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python 3
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up Ruby
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true

      - name: Install pkl
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: pkl-community/setup-pkl@0bffd1602015ccf46333e880f81087e73fd1a361 # v0
        with:
          pkl-version: 0.31.1

      - name: Capture setup tool paths
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          dotnet_path="$(command -v dotnet)"
          go_path="$(command -v go)"
          java_path="$(command -v java)"
          node_path="$(command -v node)"
          powershell_path="$(command -v pwsh)"
          python_path="$(command -v python3)"
          ruby_path="$(command -v ruby)"

          {
            printf 'MISE_LINK_DOTNET=%s\n' "$dotnet_path"
            printf 'MISE_LINK_GO=%s\n' "$go_path"
            printf 'MISE_LINK_JAVA=%s\n' "$java_path"
            printf 'MISE_LINK_NODE=%s\n' "$node_path"
            printf 'MISE_LINK_POWERSHELL=%s\n' "$powershell_path"
            printf 'MISE_LINK_PYTHON=%s\n' "$python_path"
            printf 'MISE_LINK_RUBY=%s\n' "$ruby_path"
          } >> "$GITHUB_ENV"

      - name: Mise Install Tools
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: '2026.10.11'
          experimental: true
          install: false

      - name: Install dependencies
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mise link --force core:dotnet@10 "$MISE_LINK_DOTNET"
          mise link --force go@1 "$MISE_LINK_GO"
          mise link --force java@25 "$MISE_LINK_JAVA"
          mise link --force node@24 "$MISE_LINK_NODE"
          mise link --force powershell@7 "$MISE_LINK_POWERSHELL"
          mise link --force python@3.14 "$MISE_LINK_PYTHON"
          mise link --force ruby@3.3 "$MISE_LINK_RUBY"

          mise install --locked
          mise bootstrap

      - name: Validate with HK
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        env:
          HK_PROFILE: small,medium,large
          CI_BASE: ${{ needs.scope.outputs.base }}
          CI_CANDIDATE: ${{ needs.scope.outputs.candidate }}
          CI_FULL: ${{ needs.scope.outputs.full }}
        run: |
          set -Eeuo pipefail
          if [[ "$CI_FULL" == 'true' ]]; then
            hk --profile small --profile medium --profile large check --check --no-stage --no-progress --no-fail-fast --all
          else
            python eng/scripts/workflow_delivery_v3_hk.py \
              --from-ref "$CI_BASE" --to-ref "$CI_CANDIDATE" --files0 \
              -- hk --profile small --profile medium --profile large check --check --no-stage --no-progress --no-fail-fast
          fi

      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  dotnet-tests:
    name: Build & Test (.NET 10)
    runs-on: windows-latest

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    permissions:
      contents: read
      actions: read
    needs: scope
    if: ${{ !cancelled() }}

    steps:
      - name: Require successful scope and exact native plan artifact
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          PLAN_ARTIFACT_ID: ${{ needs.scope.outputs.dotnet_artifact_id }}
        run: |
          test "$SELECTION_RESULT" = success
          [[ "$PLAN_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]

      - name: Checkout tested candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup candidate SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json


      - name: Receive exact original plan and complete control distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.scope.outputs.dotnet_artifact_id }}
          path: ${{ runner.temp }}/dotnet-plan-transfer
          merge-multiple: true

      - name: Execute and collect the unchanged original native plan
        shell: bash
        env:
          COMPARISON_BASIS: ${{ needs.scope.outputs.base }}
          TESTED_CANDIDATE: ${{ needs.scope.outputs.candidate }}
          TESTINGPLATFORM_DIAGNOSTIC: '1'
          TESTINGPLATFORM_DIAGNOSTIC_VERBOSITY: Trace
          TESTINGPLATFORM_DIAGNOSTIC_SYNCHRONOUS_WRITE: '1'
          TESTINGPLATFORM_DIAGNOSTIC_OUTPUT_DIRECTORY: ${{ runner.temp }}/dotnet-execution/mtp-diagnostics
        run: |
          control="$RUNNER_TEMP/dotnet-plan-transfer/control/WorkflowDelivery.dll"
          if [[ $(jq '.checks|length' "$RUNNER_TEMP/dotnet-plan-transfer/dotnet-plan.json") -gt 0 ]]; then
            dotnet tool restore
            dotnet restore dirs.proj -property:Configuration=Debug \
              -property:ContinuousIntegrationBuild=true -property:RestoreLockedMode=true
          fi
          dotnet "$control" ci caller-dotnet execute "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/dotnet-plan-transfer" "$RUNNER_TEMP/dotnet-execution" \
            "$COMPARISON_BASIS" "$TESTED_CANDIDATE"

      - name: Retain native planning, execution and collection facts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-group-results
          path: ${{ runner.temp }}/dotnet-execution/
          if-no-files-found: ignore
          retention-days: 7

      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  azureauth-foundation-artifacts:
    name: AzureAuth Foundation Artifact (${{ matrix.build-os }} build, ${{ matrix.target-os }} target, ${{ matrix.target-rid }})
    runs-on: ${{ matrix.build-runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build-os: Windows
            build-runner: windows-latest
            target-os: Windows
            target-rid: win-x64
            run-host-tests: false
            run-deployment-validation: true
          - build-os: Linux
            build-runner: ubuntu-latest
            target-os: Linux
            target-rid: linux-x64
            run-host-tests: true
            run-deployment-validation: true
          - build-os: macOS
            build-runner: macos-latest
            target-os: macOS
            target-rid: osx-x64
            run-host-tests: true
            run-deployment-validation: false

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    needs: scope
    if: ${{ !cancelled() }}

    steps:
      - name: Require successful scope selection
        id: scope
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.azureauth }}
        run: |
          case "$SELECTION_RESULT:$APPLICABLE" in
            success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac

      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/private/app/azureauth-credprovider/Hcoona.AzureAuth.CredProvider.Contracts/packages.lock.json
            src/private/app/azureauth-credprovider/Hcoona.AzureAuth.CredProvider.Platform/packages.lock.json
            tests/private/app/azureauth-credprovider/Hcoona.AzureAuth.CredProvider.Platform.Tests/packages.lock.json

      - name: Restore dotnet tools for deployment validation
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && (matrix.run-deployment-validation)
        run: dotnet tool restore

      - name: Test AzureAuth host OS behavior
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && (matrix.run-host-tests)
        timeout-minutes: 15
        shell: pwsh
        run: |
          dotnet test `
            --project tests/private/app/azureauth-credprovider/Hcoona.AzureAuth.CredProvider.Platform.Tests/Hcoona.AzureAuth.CredProvider.Platform.Tests.csproj `
            --configuration Release `
            --filter-class `
              Hcoona.AzureAuth.CredProvider.Platform.Tests.SystemFileSystemTests `
              Hcoona.AzureAuth.CredProvider.Platform.Tests.SystemProcessRunnerTests `
            -p:RestoreLockedMode=true

      - name: Test foundation artifact script
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: pwsh
        run: ./tests/private/app/azureauth-credprovider/New-FoundationArtifact.Tests.ps1

      - name: Create internal foundation artifact
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          ./eng/scripts/azureauth-credprovider/New-FoundationArtifact.ps1 `
            -BuildOs '${{ matrix.build-os }}' `
            -TargetRid '${{ matrix.target-rid }}' `
            -Configuration Release `
            -ProductVersion '0.0.0-internal' `
            -SourceRevision '${{ github.sha }}'

      - name: Upload internal foundation artifact
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: azureauth-credprovider-foundation-internal-${{ matrix.build-os }}-${{ matrix.target-rid }}
          path: artifacts/azureauth-credprovider/foundation/azureauth-credprovider-foundation-internal-${{ matrix.build-os }}-${{ matrix.target-rid }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Setup Python 3.14 for deployment validation
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && (matrix.run-deployment-validation)
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv for deployment validation
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && (matrix.run-deployment-validation)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Create deployment validation bundle
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && (matrix.run-deployment-validation)
        shell: pwsh
        run: |
          ./eng/scripts/azureauth-credprovider/New-DeploymentValidationBundle.ps1 `
            -BuildOs '${{ matrix.build-os }}' `
            -TargetRid '${{ matrix.target-rid }}' `
            -Configuration Release

      - name: Test deployment validation lifecycle
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && (matrix.run-deployment-validation)
        shell: pwsh
        run: |
          ./tests/private/app/azureauth-credprovider/Install-DeploymentValidationBundle.Tests.ps1 `
            -BundlePath (
              'artifacts/azureauth-credprovider/deployment-validation/' +
              'azureauth-credprovider-deployment-validation-internal-' +
              '${{ matrix.build-os }}-${{ matrix.target-rid }}.zip'
            )

      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  node-group:
    name: Select and execute adopted Node checks
    runs-on: ubuntu-latest
    env:
      MISE_EXEC_AUTO_INSTALL: '0'
    needs: [scope, ruby-group]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    outputs:
      retained: ${{ steps.execute.outputs.retained }}
      retained_directories: ${{ steps.execute.outputs.retained_directories }}
      adopted_directory: ${{ steps.execute.outputs.adopted_directory }}
    steps:
      - name: Require the actual scope artifact
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          SCOPE_ARTIFACT_ID: ${{ needs.scope.outputs.artifact_id }}
          RUBY_RESULT: ${{ needs.ruby-group.result }}
          RUBY_ARTIFACT_ID: ${{ needs.ruby-group.outputs.node_artifact_id }}
        run: |
          test "$SELECTION_RESULT" = success
          test "$RUBY_RESULT" = success
          [[ "$RUBY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SCOPE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Checkout tested candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup native tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: '2026.10.11'
          experimental: true
          install_args: dotnet node pnpm
      - name: Download the exact scope artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.scope.outputs.artifact_id }}
          path: artifacts/node-scope
          merge-multiple: true
      - name: Receive exact original Ruby facts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.ruby-group.outputs.node_artifact_id }}
          path: artifacts/node-ruby
          merge-multiple: true
      - name: Receive complete candidate control
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.scope.outputs.dotnet_artifact_id }}
          path: ${{ runner.temp }}/node-control
          merge-multiple: true
      - name: Plan and execute the complete Node group
        id: execute
        env:
          pnpm_config_verify_deps_before_run: 'false'
        run: |
          set -Eeuo pipefail
          control="$RUNNER_TEMP/node-control/control/WorkflowDelivery.dll"
          state="$RUNNER_TEMP/node-group"
          scope="$GITHUB_WORKSPACE/artifacts/node-scope/ci-scope.json"
          dotnet "$control" ci caller-node materialize "$GITHUB_WORKSPACE" "$scope" \
            "$RUNNER_TEMP/node-control" "$state"
          for endpoint in basis candidate; do
            (
              cd "$state/$endpoint"
              mise install --locked dotnet node pnpm
              mise exec --locked dotnet -- dotnet tool restore
              if [[ -f src/private/app/workflow-delivery/WorkflowDelivery.csproj ]]; then
                mise exec --locked dotnet -- dotnet restore src/private/app/workflow-delivery/WorkflowDelivery.csproj \
                  --locked-mode -property:Configuration=Debug -property:ContinuousIntegrationBuild=true \
                  -property:RestoreLockedMode=true "-binaryLogger:$state/$endpoint-restore.binlog"
              fi
            )
          done
          dotnet "$control" ci caller-node plan "$state" "$scope" \
            "$GITHUB_WORKSPACE/artifacts/node-ruby/node-inputs.json"
          status=0
          if [[ $(jq '.adopted.checks|length' "$state/group-plan.json") -gt 0 ]]; then
            while IFS= read -r runtime; do
              dotnet "$control" ci caller-node runtime "$GITHUB_WORKSPACE" "$state" "$runtime"
              selector=$(jq -r --arg key "$runtime" '.runtime.variants[]|select(.key==$key)|"node@"+(.exactVersion // (.selector|rtrimstr(".x")))' "$state/group-plan.json")
              (
                cd "$state/$runtime"
                if jq -e --arg key "$runtime" '.runtime.variants[]|select(.key==$key)|.exactVersion != null' "$state/group-plan.json" >/dev/null; then
                  mise install --locked node || exit "$?"
                  runtime_locked=1
                else
                  MISE_EXEC_AUTO_INSTALL=0 MISE_LOCKED=0 mise --no-config install "$selector" || exit "$?"
                  # The compatibility runtime is intentionally absent from mise.lock.
                  runtime_locked=0
                fi
                MISE_LOCKED="$runtime_locked" mise exec "$selector" -- pnpm install --frozen-lockfile || exit "$?"
                MISE_LOCKED="$runtime_locked" mise exec "$selector" -- dotnet tool restore || exit "$?"
                MISE_LOCKED="$runtime_locked" mise exec "$selector" -- dotnet "$control" ci caller-node execute "$state" "$runtime"
              ) || status=1
            done < <(jq -r '.runtime.variants[].key' "$state/group-plan.json")
          fi
          dotnet "$control" ci caller-node join "$state" || status=1
          exit "$status"
      - name: Retain actual planning and execution outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-group-results
          path: |
            ${{ runner.temp }}/node-group/*.json
            ${{ runner.temp }}/node-group/*.stdout
            ${{ runner.temp }}/node-group/*.stderr
          if-no-files-found: ignore
          retention-days: 7
      - name: Reject canceled validation
        if: cancelled()
        run: |
          echo 'Node group was canceled before a complete result.' >&2
          exit 1

  node-tests:
    name: Test & Build (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      PACKAGE_DIR: src/public/lib/hexo-renderer-asciidoc

    permissions:
      contents: read
      actions: read
    needs: [scope, node-group]
    if: ${{ !cancelled() }}

    steps:
      - name: Require successful scope selection
        id: scope
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          GROUP_RESULT: ${{ needs.node-group.result }}
          APPLICABLE: ${{ needs.node-group.outputs.retained }}
        run: |
          case "$SELECTION_RESULT:$GROUP_RESULT:$APPLICABLE" in
            success:success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac

      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up PNPM
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.13.0

      - name: Set up Node.js
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Prepare selected Hexo native bundle
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && contains(fromJSON(needs.node-group.outputs.retained_directories), 'src/public/lib/hexo-renderer-asciidoc')
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '4.0.7'
          working-directory: src/public/lib/hexo-renderer-asciidoc
          bundler-cache: true

      - name: Install dependencies
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile
          dotnet tool restore

      - name: Record actual tool versions
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        run: |
          set -Eeuo pipefail
          echo "node=$(node --version)"
          echo "pnpm=$(pnpm --version)"
          echo "npm=$(npm --version)"

      - name: Receive candidate control for retained composition
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.scope.outputs.dotnet_artifact_id }}
          path: ${{ runner.temp }}/retained-control
          merge-multiple: true
      - name: Execute selected retained members
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        env:
          RETAINED_DIRECTORIES: ${{ needs.node-group.outputs.retained_directories }}
          ADOPTED_DIRECTORY: ${{ needs.node-group.outputs.adopted_directory }}
        run: |
          dotnet "$RUNNER_TEMP/retained-control/control/WorkflowDelivery.dll" ci caller-node retained \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/retained-node" "$RETAINED_DIRECTORIES" \
            "$ADOPTED_DIRECTORY" "$PACKAGE_DIR" "$(command -v pnpm)"

      - name: Retain selected Node command diagnostics
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: retained-node-${{ matrix.node-version }}
          path: |
            ${{ runner.temp }}/retained-node/*.json
            ${{ runner.temp }}/retained-node/*.stdout
            ${{ runner.temp }}/retained-node/*.stderr
          if-no-files-found: ignore
          retention-days: 7

      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  nuget-native-preparation:
    name: NuGet native preparation (Windows)
    runs-on: windows-latest
    needs: scope
    if: ${{ !cancelled() }}
    env:
      WDV3_NUGET_PREPARATION_EVIDENCE: ${{ github.workspace }}/artifacts/nuget-native-preparation
    steps:
      - name: Require successful scope selection
        id: scope
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.nuget_native_preparation }}
        run: |
          case "$SELECTION_RESULT:$APPLICABLE" in
            success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac
      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET SDK
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Prepare pinned native product dependencies
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:WDV3_NUGET_PREPARATION_EVIDENCE | Out-Null
          dotnet restore tests/private/app/workflow-delivery/fixtures/products/hcoona-release-smoke-github-packages/hcoona-release-smoke-github-packages.csproj `
            -p:RestoreLockedMode=true `
            "-bl:$env:WDV3_NUGET_PREPARATION_EVIDENCE/product-restore.binlog"
          exit $LASTEXITCODE
      - name: Verify native release preparation and clean consumer
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          dotnet test --project tests/private/app/workflow-delivery/WorkflowDelivery.Tests.csproj `
            -p:RestoreLockedMode=true --filter 'TestCategory=NuGetNativePreparation' `
            --report-trx --results-directory "$env:WDV3_NUGET_PREPARATION_EVIDENCE" `
            "-bl:$env:WDV3_NUGET_PREPARATION_EVIDENCE/native-preparation.binlog" `
            -- --minimum-expected-tests 2
          exit $LASTEXITCODE
      - name: Retain original archives and native evidence
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-native-preparation-windows
          path: artifacts/nuget-native-preparation
          if-no-files-found: error
          retention-days: 30
      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  python-tests:
    name: Test (Python 3.14)
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Require successful comparison and exact native artifacts
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          SCOPE_ARTIFACT_ID: ${{ needs.scope.outputs.artifact_id }}
          CONTROL_ARTIFACT_ID: ${{ needs.scope.outputs.dotnet_artifact_id }}
        run: |
          test "$SELECTION_RESULT" = success
          [[ "$SCOPE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CONTROL_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Checkout tested candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Python query interpreter
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Setup candidate control SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Receive exact scope
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.scope.outputs.artifact_id }}
          path: ${{ runner.temp }}/python-scope
          merge-multiple: true
      - name: Receive complete candidate control and native sources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.scope.outputs.dotnet_artifact_id }}
          path: ${{ runner.temp }}/python-control
          merge-multiple: true
      - name: Materialize exact committed endpoints
        id: endpoints
        run: |
          dotnet "$RUNNER_TEMP/python-control/control/WorkflowDelivery.dll" ci caller-python materialize \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/python-scope/ci-scope.json" \
            "$RUNNER_TEMP/python-control" "$RUNNER_TEMP/python-group"
      - name: Setup basis NBGV SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ steps.endpoints.outputs.basis_directory }}/global.json
      - name: Setup candidate NBGV and control SDK
        if: steps.endpoints.outputs.basis_separate == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ steps.endpoints.outputs.candidate_directory }}/global.json
      - name: Setup native UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: .config/uv/uv.toml
          enable-cache: false
      - name: Prepare native query tools and select once
        id: plan
        run: |
          dotnet "$RUNNER_TEMP/python-control/control/WorkflowDelivery.dll" ci caller-python plan \
            "$RUNNER_TEMP/python-group" "$RUNNER_TEMP/python-scope/ci-scope.json" \
            "$(command -v uv)" "$(command -v python)" "$(command -v dotnet)"
      - name: Setup selected MISE adapters
        if: steps.plan.outputs.native_node == 'true'
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/python-auxiliary-mise
        with:
          version: '2026.10.11'
          experimental: true
          install_args: node
      - name: Execute and collect original Python plan
        run: |
          optional_tool() { command -v "$1" || printf '%s' '-'; }
          dotnet "$RUNNER_TEMP/python-control/control/WorkflowDelivery.dll" ci caller-python execute \
            "$RUNNER_TEMP/python-group" "$RUNNER_TEMP/python-auxiliary-mise" \
            "$(optional_tool mise)" "$(optional_tool node)" "$(optional_tool pwsh)"
      - name: Retain original Python plan and actual results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-group-results
          path: |
            ${{ runner.temp }}/python-group/*.json
            ${{ runner.temp }}/python-group/*.stdout
            ${{ runner.temp }}/python-group/*.stderr
            ${{ runner.temp }}/python-group/query-preparation/preparation-failure.json
            ${{ runner.temp }}/python-group/execution/**/*.json
            ${{ runner.temp }}/python-group/execution/pytest/junit-*.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Reject canceled validation
        if: cancelled()
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  native-preparation-tests:
    name: Qualify selected native preparation (.NET on Linux)
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require successful scope and original artifacts
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          SCOPE_ARTIFACT_ID: ${{ needs.scope.outputs.artifact_id }}
          CONTROL_ARTIFACT_ID: ${{ needs.scope.outputs.dotnet_artifact_id }}
        run: |
          test "$SELECTION_RESULT" = success
          [[ "$SCOPE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CONTROL_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Checkout tested candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup candidate control SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Receive exact scope
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.scope.outputs.artifact_id }}
          path: ${{ runner.temp }}/native-scope
          merge-multiple: true
      - name: Receive original candidate control
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.scope.outputs.dotnet_artifact_id }}
          path: ${{ runner.temp }}/native-control
          merge-multiple: true
      - name: Select required Linux preparation scenarios
        id: plan
        run: |
          dotnet "$RUNNER_TEMP/native-control/control/WorkflowDelivery.dll" ci native-preparation-plan "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/native-scope/ci-scope.json" "$RUNNER_TEMP/native-preparation"
      - name: Setup selected native tools
        if: steps.plan.outputs.python == 'true' || steps.plan.outputs.ruby == 'true'
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: '2026.10.11'
          experimental: true
          install_args: >-
            dotnet
            ${{ steps.plan.outputs.python == 'true' && 'python uv' || '' }}
            ${{ steps.plan.outputs.ruby == 'true' && 'ruby' || '' }}
      - name: Execute required original Python preparation scenario
        if: steps.plan.outputs.python == 'true'
        run: |
          mise exec --locked dotnet python uv -- dotnet test \
            --project tests/private/app/workflow-delivery/WorkflowDelivery.Tests.csproj \
            -property:RestoreLockedMode=true \
            --filter FullyQualifiedName=WorkflowDelivery.Tests.Release.PythonPreparationNativeTests.NativeBranchPreparationBuildsCompleteOriginalPairAndGitFreeConsumer \
            --report-trx --report-trx-filename preparation.trx \
            --results-directory "$RUNNER_TEMP/native-preparation/python" -- --minimum-expected-tests 1
      - name: Execute original Ruby preparation scenario
        if: ${{ !cancelled() && steps.plan.outputs.ruby == 'true' }}
        run: |
          mise exec --locked dotnet ruby -- dotnet test \
            --project tests/private/app/workflow-delivery/WorkflowDelivery.Tests.csproj \
            -property:RestoreLockedMode=true \
            --filter FullyQualifiedName=WorkflowDelivery.Tests.Release.RubyPreparationNativeTests.NativePreparationQualifiesCommittedOriginalAndInstalledOrigin \
            --report-trx --report-trx-filename preparation.trx \
            --results-directory "$RUNNER_TEMP/native-preparation/ruby" -- --minimum-expected-tests 1
      - name: Retain original preparation plans, reports and packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-preparation-results
          path: |
            ${{ runner.temp }}/native-preparation/
            tests/private/app/workflow-delivery/bin/**/python-release-preparation-tests1-native/
            tests/private/app/workflow-delivery/bin/**/ruby-release-preparation-tests1-native/
          if-no-files-found: error
          retention-days: 7
      - name: Reject canceled qualification
        if: cancelled()
        run: |
          echo 'Native preparation was canceled before a complete result.' >&2
          exit 1

  ruby-group:
    name: Plan and execute native Ruby checks
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    outputs:
      node_artifact_id: ${{ steps.node-facts.outputs.artifact-id }}
    defaults:
