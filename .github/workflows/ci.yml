name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validate
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: dotnet,go,java,node,powershell,python,ruby,pkl

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.*'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up PNPM
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Set up Ruby
        uses: ruby/setup-ruby@d697be2f83c6234b20877c3b5eac7a7f342f0d0c # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install pkl
        uses: pkl-community/setup-pkl@a862c198115338598d769aaf03f5fa8c5123036e # v0
        with:
          pkl-version: 0.30.0

      - name: Mise Install Tools
        uses: jdx/mise-action@146a28175021df8ca24f8ee1828cc2a60f980bd5 # v3
        with:
          experimental: true
          install: false

      - name: Install dependencies
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mise link dotnet@10 "$(which dotnet)"
          mise link go@1 "$(which go)"
          mise link java@25 "$(which java)"
          mise link node@24 "$(which node)"
          mise link pwsh@7 "$(which pwsh)"
          mise link python@3.14 "$(which python3)"
          mise link ruby@3.3 "$(which ruby)"

          mise plugins install dotnet https://github.com/version-fox/vfox-dotnet -f

          mise install
          mise bootstrap

      - name: Validate with HK
        env:
          HK_PROFILE: small,medium,large
        run: |
          set -Eeuo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          echo "hk check from $BASE to $HEAD"
          hk check \
            --no-progress \
            --no-fail-fast \
            --from-ref "$BASE" \
            --to-ref "$HEAD"

  windows-dotnet:
    name: Build .NET (Windows)
    runs-on: windows-latest
    needs: validation

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore dotnet tools
        run: |
          dotnet tool restore

      - name: Restore
        run: dotnet restore dirs.proj -p:RestoreLockedMode=true

      - name: Build
        run: dotnet build dirs.proj -c Release --no-restore -p:RestoreLockedMode=true

      - name: Test
        run: dotnet test dirs.proj -c Release --no-build -p:RestoreLockedMode=true

  tests:
    name: Test & Build
    runs-on: ubuntu-latest
    needs: validation
    strategy:
      matrix:
        node-version: [20.19.0, 20.x, 22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up PNPM
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile
          dotnet tool restore

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build
