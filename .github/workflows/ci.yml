name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validate
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: dotnet,go,java,node,powershell,python,ruby,pkl

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.*'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up PNPM
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Set up Ruby
        uses: ruby/setup-ruby@6ca151fd1bfcfd6fe0c4eb6837eb0584d0134a0c # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install pkl
        uses: pkl-community/setup-pkl@a862c198115338598d769aaf03f5fa8c5123036e # v0
        with:
          pkl-version: 0.30.0

      - name: Mise Install Tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          experimental: true
          install: false

      - name: Install dependencies
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mise link dotnet@10 "$(which dotnet)"
          mise link go@1 "$(which go)"
          mise link java@25 "$(which java)"
          mise link node@24 "$(which node)"
          mise link pwsh@7 "$(which pwsh)"
          mise link python@3.14 "$(which python3)"
          mise link ruby@3.3 "$(which ruby)"

          mise plugins install dotnet https://github.com/version-fox/vfox-dotnet -f

          mise install
          mise bootstrap

      - name: Validate with HK
        env:
          HK_PROFILE: small,medium,large
        run: |
          set -Eeuo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          echo "hk check from $BASE to $HEAD"
          hk check \
            --no-progress \
            --no-fail-fast \
            --from-ref "$BASE" \
            --to-ref "$HEAD"

  dotnet-tests:
    name: Build & Test (.NET 10)
    runs-on: windows-latest
    needs: validation

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore dotnet tools
        run: |
          dotnet tool restore

      - name: Restore
        run: dotnet restore dirs.proj -p:RestoreLockedMode=true

      - name: Build
        run: dotnet build dirs.proj -c Debug --no-restore -p:RestoreLockedMode=true

      - name: Test
        run: dotnet test dirs.proj -c Debug --no-build -p:RestoreLockedMode=true

  node-tests:
    name: Test & Build (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: validation
    strategy:
      matrix:
        node-version: [20.19.0, 20.x, 22.x, 24.x]

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up PNPM
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile
          dotnet tool restore

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

  python-tests:
    name: Test (Python 3.14)
    runs-on: ubuntu-latest
    needs: validation

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      PYTHON_VERSION: '3.14'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: 'uv.lock'

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          dotnet tool restore
          uv sync --frozen --all-packages

      - name: Run tests
        run: |
          set -Eeuo pipefail
          uv run --frozen pytest

  ruby-tests:
    name: Test (Ruby 3.3)
    runs-on: ubuntu-latest
    needs: validation

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@6ca151fd1bfcfd6fe0c4eb6837eb0584d0134a0c # v1
        with:
          ruby-version: '3.3'

      - name: Install system dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            dvisvgm \
            pdf2svg \
            poppler-utils \
            imagemagick \
            ghostscript \
            fd-find
      - name: Ensure fd is available
        shell: bash
        run: |
          set -Eeuo pipefail

          if command -v fd >/dev/null 2>&1; then
            fd --version
            exit 0
          fi

          if command -v fdfind >/dev/null 2>&1; then
            fdfind --version
            mkdir -p "${HOME}/.local/bin"
            ln -sf "$(command -v fdfind)" "${HOME}/.local/bin/fd" || true
            export PATH="${HOME}/.local/bin:${PATH}"
            fd --version
            exit 0
          fi

          echo "fd is not available" >&2
          exit 1

      - name: Run Ruby gem tests
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t gemspecs < <(fd -e gemspec)
          if [[ "${#gemspecs[@]}" -eq 0 ]]; then
            echo "No *.gemspec found; skipping Ruby tests."
            exit 0
          fi

          printf 'Discovered gemspecs:\n'
          printf ' - %s\n' "${gemspecs[@]}"

          failures=0
          for gemspec in "${gemspecs[@]}"; do
            dir="$(dirname "${gemspec}")"
            echo ""
            echo "==> Testing Ruby gem in ${dir}"

            if [[ ! -f "${dir}/Gemfile" ]]; then
              echo "No Gemfile in ${dir}; skipping Bundler/RSpec."
              continue
            fi

            if [[ ! -d "${dir}/spec" ]]; then
              echo "No spec/ directory in ${dir}; skipping RSpec."
              continue
            fi

            pushd "${dir}" >/dev/null
            bundle install
            bundle exec rspec || failures=$((failures + 1))
            popd >/dev/null
          done

          if [[ "${failures}" -ne 0 ]]; then
            echo "Ruby test failures: ${failures}" >&2
            exit 1
          fi
