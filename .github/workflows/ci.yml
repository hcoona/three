name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select affected validation
    runs-on: ubuntu-latest
    outputs:
      validation: ${{ steps.select.outputs.validation }}
      mise: ${{ steps.select.outputs.mise }}
      dotnet: ${{ steps.select.outputs.dotnet }}
      node: ${{ steps.select.outputs.node }}
      python: ${{ steps.select.outputs.python }}
      azureauth: ${{ steps.select.outputs.azureauth }}
      ruby: ${{ steps.select.outputs.ruby }}
      scholarly: ${{ steps.select.outputs.scholarly }}
      python_roots: ${{ steps.select.outputs.python_roots }}
      base: ${{ steps.select.outputs.base }}
      candidate: ${{ steps.select.outputs.candidate }}
      full: ${{ steps.select.outputs.full }}
    steps:
      - name: Checkout tested candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Setup selection Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Select work from the actual comparison
        id: select
        env:
          COMPARISON_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TESTED_CANDIDATE: ${{ github.sha }}
        run: |
          python --version
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            python eng/scripts/ci_scope.py --full --output artifacts/ci-scope.json
          else
            python eng/scripts/ci_scope.py --from-ref "$COMPARISON_BASE" \
              --to-ref "$TESTED_CANDIDATE" --output artifacts/ci-scope.json
          fi
      - name: Retain selection and reasons
        uses: actions/upload-artifact@v7
        with:
          name: ci-scope
          path: artifacts/ci-scope.json
          if-no-files-found: error
          retention-days: 7

  validation:
    name: Validate
    runs-on: ubuntu-latest
    needs: [conformance, scholarly-tests]
    if: always()
    steps:
      - name: Require complete validation results
        if: always()
        env:
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          SCHOLARLY_RESULT: ${{ needs.scholarly-tests.result }}
        run: |
          if [[ "$CONFORMANCE_RESULT" != 'success' || "$SCHOLARLY_RESULT" != 'success' ]]; then
            echo "Required validation did not complete: source=$CONFORMANCE_RESULT, scholarly=$SCHOLARLY_RESULT." >&2
            exit 1
          fi
      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  mise-lock:
    name: Validate mise lockfile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    needs: scope
    if: always()

    steps:
      - name: Require successful scope selection
        id: scope
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.mise }}
        run: |
          case "$SELECTION_RESULT:$APPLICABLE" in
            success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac

      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Set up mise
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install: false

      - name: Validate lockfile
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        run: mise install --locked --dry-run --monorepo

      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  conformance:
    name: Source conformance
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: dotnet,go,java,node,powershell,python,ruby,pkl

    needs: scope
    if: always()

    steps:
      - name: Require successful scope selection
        id: scope
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.validation }}
        run: |
          case "$SELECTION_RESULT:$APPLICABLE" in
            success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac

      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Go
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.*'

      - name: Setup Java
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up PNPM
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.22.0

      - name: Set up Node.js
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python 3
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up Ruby
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      - name: Install pkl
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: pkl-community/setup-pkl@0bffd1602015ccf46333e880f81087e73fd1a361 # v0
        with:
          pkl-version: 0.31.1

      - name: Capture setup tool paths
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          dotnet_path="$(command -v dotnet)"
          go_path="$(command -v go)"
          java_path="$(command -v java)"
          node_path="$(command -v node)"
          powershell_path="$(command -v pwsh)"
          python_path="$(command -v python3)"
          ruby_path="$(command -v ruby)"

          {
            printf 'MISE_LINK_DOTNET=%s\n' "$dotnet_path"
            printf 'MISE_LINK_GO=%s\n' "$go_path"
            printf 'MISE_LINK_JAVA=%s\n' "$java_path"
            printf 'MISE_LINK_NODE=%s\n' "$node_path"
            printf 'MISE_LINK_POWERSHELL=%s\n' "$powershell_path"
            printf 'MISE_LINK_PYTHON=%s\n' "$python_path"
            printf 'MISE_LINK_RUBY=%s\n' "$ruby_path"
          } >> "$GITHUB_ENV"

      - name: Mise Install Tools
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install: false

      - name: Install dependencies
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mise link --force core:dotnet@10 "$MISE_LINK_DOTNET"
          mise link --force go@1 "$MISE_LINK_GO"
          mise link --force java@25 "$MISE_LINK_JAVA"
          mise link --force node@24 "$MISE_LINK_NODE"
          mise link --force powershell@7 "$MISE_LINK_POWERSHELL"
          mise link --force python@3.14 "$MISE_LINK_PYTHON"
          mise link --force ruby@3.3 "$MISE_LINK_RUBY"

          mise install --locked
          mise bootstrap

      - name: Validate with HK
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        env:
          HK_PROFILE: small,medium,large
          CI_BASE: ${{ needs.scope.outputs.base }}
          CI_CANDIDATE: ${{ needs.scope.outputs.candidate }}
          CI_FULL: ${{ needs.scope.outputs.full }}
        run: |
          set -Eeuo pipefail
          if [[ "$CI_FULL" == 'true' ]]; then
            hk check --no-progress --no-fail-fast --all
          else
            python eng/scripts/workflow_delivery_v3_hk.py \
              --from-ref "$CI_BASE" --to-ref "$CI_CANDIDATE" \
              -- hk check --no-progress --no-fail-fast
          fi

      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  dotnet-tests:
    name: Build & Test (.NET 10)
    runs-on: windows-latest

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    needs: scope
    if: always()

    steps:
      - name: Require successful scope selection
        id: scope
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.dotnet }}
        run: |
          case "$SELECTION_RESULT:$APPLICABLE" in
            success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac

      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore dotnet tools
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        run: |
          dotnet tool restore

      - name: Restore
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        run: dotnet restore dirs.proj -p:RestoreLockedMode=true

      - name: Build
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        run: dotnet build dirs.proj -c Debug --no-restore -p:RestoreLockedMode=true

      - name: Test
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          $testProjects = Get-ChildItem -Path tests -Filter '*.csproj' -Recurse

          foreach ($project in $testProjects) {
            $projectXml = Get-Content -Raw -Path $project.FullName

            if ($projectXml.Contains('Sdk="MSTest.Sdk"') -or $projectXml.Contains('Include="xunit.v3.mtp-v2"')) {
              dotnet test --project $project.FullName -c Debug --no-build -p:RestoreLockedMode=true
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            } elseif ($projectXml.Contains('Include="xunit.runner.visualstudio"')) {
              $testAssembly = Join-Path $project.DirectoryName "bin/Debug/net10.0/$($project.BaseName).dll"
              dotnet vstest $testAssembly
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            }
          }

      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  azureauth-foundation-artifacts:
    name: AzureAuth Foundation Artifact (${{ matrix.build-os }} build, ${{ matrix.target-os }} target, ${{ matrix.target-rid }})
    runs-on: ${{ matrix.build-runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build-os: Windows
            build-runner: windows-latest
            target-os: Windows
            target-rid: win-x64
            run-host-tests: false
            run-deployment-validation: true
          - build-os: Linux
            build-runner: ubuntu-latest
            target-os: Linux
            target-rid: linux-x64
            run-host-tests: true
            run-deployment-validation: true
          - build-os: macOS
            build-runner: macos-latest
            target-os: macOS
            target-rid: osx-x64
            run-host-tests: true
            run-deployment-validation: false

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    needs: scope
    if: always()

    steps:
      - name: Require successful scope selection
        id: scope
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.azureauth }}
        run: |
          case "$SELECTION_RESULT:$APPLICABLE" in
            success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac

      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/private/app/azureauth-credprovider/Hcoona.AzureAuth.CredProvider.Contracts/packages.lock.json
            src/private/app/azureauth-credprovider/Hcoona.AzureAuth.CredProvider.Platform/packages.lock.json
            tests/private/app/azureauth-credprovider/Hcoona.AzureAuth.CredProvider.Platform.Tests/packages.lock.json

      - name: Restore dotnet tools for deployment validation
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && (matrix.run-deployment-validation)
        run: dotnet tool restore

      - name: Test AzureAuth host OS behavior
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && (matrix.run-host-tests)
        timeout-minutes: 15
        shell: pwsh
        run: |
          dotnet test `
            --project tests/private/app/azureauth-credprovider/Hcoona.AzureAuth.CredProvider.Platform.Tests/Hcoona.AzureAuth.CredProvider.Platform.Tests.csproj `
            --configuration Release `
            --filter-class `
              Hcoona.AzureAuth.CredProvider.Platform.Tests.SystemFileSystemTests `
              Hcoona.AzureAuth.CredProvider.Platform.Tests.SystemProcessRunnerTests `
            -p:RestoreLockedMode=true

      - name: Test foundation artifact script
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: pwsh
        run: ./tests/private/app/azureauth-credprovider/New-FoundationArtifact.Tests.ps1

      - name: Create internal foundation artifact
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          ./eng/scripts/azureauth-credprovider/New-FoundationArtifact.ps1 `
            -BuildOs '${{ matrix.build-os }}' `
            -TargetRid '${{ matrix.target-rid }}' `
            -Configuration Release `
            -ProductVersion '0.0.0-internal' `
            -SourceRevision '${{ github.sha }}'

      - name: Upload internal foundation artifact
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: azureauth-credprovider-foundation-internal-${{ matrix.build-os }}-${{ matrix.target-rid }}
          path: artifacts/azureauth-credprovider/foundation/azureauth-credprovider-foundation-internal-${{ matrix.build-os }}-${{ matrix.target-rid }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Setup Python 3.14 for deployment validation
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && (matrix.run-deployment-validation)
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv for deployment validation
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && (matrix.run-deployment-validation)
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Create deployment validation bundle
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && (matrix.run-deployment-validation)
        shell: pwsh
        run: |
          ./eng/scripts/azureauth-credprovider/New-DeploymentValidationBundle.ps1 `
            -BuildOs '${{ matrix.build-os }}' `
            -TargetRid '${{ matrix.target-rid }}' `
            -Configuration Release

      - name: Test deployment validation lifecycle
        if: success() && !cancelled() && steps.scope.outputs.run == 'true' && (matrix.run-deployment-validation)
        shell: pwsh
        run: |
          ./tests/private/app/azureauth-credprovider/Install-DeploymentValidationBundle.Tests.ps1 `
            -BundlePath (
              'artifacts/azureauth-credprovider/deployment-validation/' +
              'azureauth-credprovider-deployment-validation-internal-' +
              '${{ matrix.build-os }}-${{ matrix.target-rid }}.zip'
            )

      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  node-tests:
    name: Test & Build (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      PACKAGE_DIR: src/public/lib/hexo-renderer-asciidoc

    needs: scope
    if: always()

    steps:
      - name: Require successful scope selection
        id: scope
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.node }}
        run: |
          case "$SELECTION_RESULT:$APPLICABLE" in
            success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac

      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up PNPM
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.22.0

      - name: Set up Node.js
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile
          dotnet tool restore

      - name: Record actual tool versions
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        run: |
          set -Eeuo pipefail
          echo "node=$(node --version)"
          echo "pnpm=$(pnpm --version)"
          echo "npm=$(npm --version)"

      - name: Type check package
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        run: pnpm --dir "${PACKAGE_DIR}" run typecheck

      - name: Run monorepo tests
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        run: pnpm run test

      - name: Build monorepo
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        run: pnpm run build

      - name: Pack and probe published artifact
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        run: pnpm --dir "${PACKAGE_DIR}" run validate:packed-artifact

      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  python-tests:
    name: Test (Python 3.14)
    runs-on: ubuntu-latest

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    needs: scope
    if: always()

    steps:
      - name: Require successful scope selection
        id: scope
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.python }}
        run: |
          case "$SELECTION_RESULT:$APPLICABLE" in
            success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac

      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up PNPM
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.22.0

      - name: Set up Node.js
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up mise, HK, and Pkl
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: aqua:jdx/hk pkl

      - name: Setup Python 3.14
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          cache-dependency-glob: 'uv.lock'

      - name: Install dependencies
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        run: |
          set -Eeuo pipefail
          dotnet tool restore
          pnpm install --frozen-lockfile
          uv sync --frozen --all-packages

      - name: Prepare static-reference authorities
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        env:
          MISE_TASK_RUN_AUTO_INSTALL: 'false'
        run: mise run prepare:static-reference-authorities

      - name: Run tests
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        env:
          PYTHON_TEST_ROOTS: ${{ needs.scope.outputs.python_roots }}
        run: |
          uv run --frozen --all-packages python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          roots = json.loads(os.environ["PYTHON_TEST_ROOTS"])
          allowed = tomllib.loads(Path("pyproject.toml").read_text())["tool"]["pytest"]["ini_options"]["testpaths"]
          if (not isinstance(allowed, list) or not allowed
                  or any(not isinstance(root, str) or not root.strip() for root in allowed)):
              raise SystemExit("Python testpaths must be a nonempty list of explicit paths")
          if not isinstance(roots, list) or not roots or any(root not in allowed for root in roots):
              raise SystemExit("Missing or invalid selected Python test roots")
          print(sys.version, flush=True)
          subprocess.run([sys.executable, "-m", "pytest", *roots,
                          "--junitxml=artifacts/test-results/python.xml"], check=True)
          PY

      - name: Retain Python test durations
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: python-test-results
          path: artifacts/test-results/python.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  ruby-tests:
    name: Test (Ruby 3.3)
    runs-on: ubuntu-latest

    needs: scope
    if: always()

    steps:
      - name: Require successful scope selection
        id: scope
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.ruby }}
        run: |
          case "$SELECTION_RESULT:$APPLICABLE" in
            success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac

      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Ruby
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '4.0.6'

      - name: Install system dependencies
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            dvisvgm \
            pdf2svg \
            poppler-utils \
            imagemagick \
            ghostscript \
            fd-find
      - name: Ensure fd is available
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          if command -v fd >/dev/null 2>&1; then
            fd --version
            exit 0
          fi

          if command -v fdfind >/dev/null 2>&1; then
            fdfind --version
            mkdir -p "${HOME}/.local/bin"
            ln -sf "$(command -v fdfind)" "${HOME}/.local/bin/fd" || true
            export PATH="${HOME}/.local/bin:${PATH}"
            fd --version
            exit 0
          fi

          echo "fd is not available" >&2
          exit 1

      - name: Run Ruby gem tests
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t gemspecs < <(fd -e gemspec)
          if [[ "${#gemspecs[@]}" -eq 0 ]]; then
            echo "No *.gemspec found; skipping Ruby tests."
            exit 0
          fi

          printf 'Discovered gemspecs:\n'
          printf ' - %s\n' "${gemspecs[@]}"

          failures=0
          for gemspec in "${gemspecs[@]}"; do
            dir="$(dirname "${gemspec}")"
            echo ""
            echo "==> Testing Ruby gem in ${dir}"

            if [[ ! -f "${dir}/Gemfile" ]]; then
              echo "No Gemfile in ${dir}; skipping Bundler/RSpec."
              continue
            fi

            if [[ ! -d "${dir}/spec" ]]; then
              echo "No spec/ directory in ${dir}; skipping RSpec."
              continue
            fi

            pushd "${dir}" >/dev/null
            bundle install
            bundle exec rspec || failures=$((failures + 1))
            popd >/dev/null
          done

          if [[ "${failures}" -ne 0 ]]; then
            echo "Ruby test failures: ${failures}" >&2
            exit 1
          fi

      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1

  scholarly-tests:
    name: Test scholarly publication
    runs-on: ubuntu-latest
    needs: scope
    if: always()
    steps:
      - name: Require successful scope selection
        id: scope
        env:
          SELECTION_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.scholarly }}
        run: |
          case "$SELECTION_RESULT:$APPLICABLE" in
            success:true) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            success:false) echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Not applicable to this change.' ;;
            *) echo 'Scope selection failed or omitted applicability.' >&2; exit 1 ;;
          esac
      - name: Checkout
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
      - name: Install uv
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Set up mise
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install: false
      - name: Run scholarly project tests
        if: success() && !cancelled() && steps.scope.outputs.run == 'true'
        env:
          MISE_TASK_RUN_AUTO_INSTALL: 'false'
        run: mise run scholarly-publication-plugin-test
      - name: Reject canceled validation
        if: cancelled()
        shell: bash
        run: |
          echo 'Validation was canceled before a complete result.' >&2
          exit 1
