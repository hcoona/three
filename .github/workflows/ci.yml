name: CI Validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci/pr/{0}', github.event.pull_request.number) || github.event_name == 'push' && format('ci/push/{0}', github.ref) || format('ci/{0}/{1}', github.event_name, github.run_id) }}
  cancel-in-progress: true

jobs:
  normalize-input:
    name: normalize-input
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      request-artifact-name: ${{ steps.refs.outputs.request_artifact_name }}
      plan-artifact-name: ${{ steps.refs.outputs.plan_artifact_name }}
      planner-diagnostics-artifact-name: ${{ steps.refs.outputs.planner_diagnostics_artifact_name }}
      changed-files-snapshot-artifact-name: ${{ steps.refs.outputs.changed_files_snapshot_artifact_name }}
      fact-snapshot-artifact-name: ${{ steps.refs.outputs.fact_snapshot_artifact_name }}
      execution-batch-manifest-artifact-name: ${{ steps.refs.outputs.execution_batch_manifest_artifact_name }}
      aggregate-evidence-manifest-artifact-name: ${{ steps.refs.outputs.aggregate_evidence_manifest_artifact_name }}
      aggregate-summary-artifact-name: ${{ steps.refs.outputs.aggregate_summary_artifact_name }}
      request-artifact-id: ${{ steps.upload-request.outputs.artifact-id }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        id: setup-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.10.9'
      - name: Retry uv installation
        if: ${{ steps.setup-uv.outcome == 'failure' }}
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.10.9'
      - name: Validate bootstrap CODEOWNERS coverage
        run: |
          uv run python eng/scripts/workflow_release_control.py validate-bootstrap-codeowners \
            --repo-root .
      - name: Compute artifact refs
        id: refs
        run: |
          uv run python eng/scripts/workflow_release_control.py ci-validation-artifact-refs \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"
      - name: Resolve CI mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mode=push
          if [ "$EVENT_NAME" = "pull_request" ]; then
            mode=pull_request
          elif [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mode=scheduled_full
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
      - name: Write planner-facing request
        env:
          CI_ACTOR: ${{ github.actor }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_EVENT_NUMBER: ${{ github.event.pull_request.number || '' }}
          CI_MODE: ${{ steps.mode.outputs.mode }}
          CI_REF: ${{ github.ref }}
          CI_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p .three-ci-validation/normalize
          validation_commit_sha="$(git rev-parse HEAD)"
          validation_ref="$CI_REF"
          if [ "$CI_MODE" = "pull_request" ] && [ -n "$CI_EVENT_NUMBER" ]; then
            validation_ref="refs/pull/${CI_EVENT_NUMBER}/head"
          fi
          range_args=()
          if [ "$CI_MODE" != "scheduled_full" ]; then
            uv run python - <<'PY'
          import json
          import os
          import shlex
          import subprocess

          ZERO_SHA = "0" * 40
          OUT = ".three-ci-validation/normalize/range-args.sh"


          def emit(args):
              with open(OUT, "w", encoding="utf-8") as handle:
                  handle.write("range_args=(")
                  for arg in args:
                      handle.write(" " + shlex.quote(str(arg)))
                  handle.write(")\n")


          def unavailable(detail):
              emit(["--range-status", "unavailable", "--range-diagnostic-detail", detail])


          def git(*args):
              return subprocess.run(
                  ["git", *args],
                  check=True,
                  capture_output=True,
                  text=False,
              ).stdout


          def is_sha(value):
              return (
                  isinstance(value, str)
                  and len(value) == 40
                  and value != ZERO_SHA
                  and all(char in "0123456789abcdefABCDEF" for char in value)
              )


          def commit_exists(value):
              if not is_sha(value):
                  return False
              return subprocess.run(
                  ["git", "cat-file", "-e", f"{value}^{{commit}}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              ).returncode == 0


          def ensure_commit(value):
              if commit_exists(value):
                  return True
              if not is_sha(value):
                  return False
              subprocess.run(
                  ["git", "fetch", "--no-tags", "--depth=1", "origin", value],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              return commit_exists(value)


          class NonCanonicalChangedPathError(ValueError):
              pass


          def is_canonical_repo_path(value):
              if any(0xD800 <= ord(char) <= 0xDFFF for char in value):
                  return False
              if (
                  value == ""
                  or value.startswith(("/", "./"))
                  or value.endswith("/")
                  or "\\" in value
              ):
                  return False
              return all(part not in {"", ".", ".."} for part in value.split("/"))


          def check_path(value, seen):
              if not is_canonical_repo_path(value) or value in seen:
                  raise NonCanonicalChangedPathError(
                      "non-canonical or duplicated changed path"
                  )
              seen.add(value)
              return value


          def changed_files(base, head):
              raw = git("diff", "--name-status", "--find-renames", "-z", base, head)
              try:
                  fields = raw.decode("utf-8", "strict").split("\0")
              except UnicodeDecodeError as exc:
                  raise NonCanonicalChangedPathError(
                      "non-UTF-8 changed path"
                  ) from exc
              if fields and fields[-1] == "":
                  fields.pop()
              changed = []
              seen = set()
              index = 0
              while index < len(fields):
                  status = fields[index]
                  index += 1
                  if not status:
                      continue
                  kind = status[0]
                  if kind in {"R", "C"}:
                      if index + 1 >= len(fields):
                          raise ValueError("incomplete rename/copy record")
                      changed.append(check_path(fields[index], seen))
                      changed.append(check_path(fields[index + 1], seen))
                      index += 2
                      continue
                  if index >= len(fields):
                      raise ValueError("incomplete changed-file record")
                  changed.append(check_path(fields[index], seen))
                  index += 1
              return sorted(changed)


          def available(base_sha, head_sha, files, base_tip_sha=None):
              args = [
                  "--range-status",
                  "available",
                  "--base-sha",
                  base_sha,
                  "--head-sha",
                  head_sha,
                  "--changed-files-json",
                  json.dumps(files, ensure_ascii=False, separators=(",", ":")),
              ]
              if base_tip_sha is not None:
                  args[4:4] = ["--base-tip-sha", base_tip_sha]
              emit(args)


          try:
              event_path = os.environ["GITHUB_EVENT_PATH"]
              with open(event_path, encoding="utf-8") as handle:
                  event = json.load(handle)
              mode = os.environ["CI_MODE"]
              validation_commit_sha = git("rev-parse", "HEAD").decode().strip()
              if mode == "push":
                  base_sha = event.get("before")
                  head_sha = event.get("after")
                  if not ensure_commit(base_sha) or not ensure_commit(head_sha):
                      unavailable("incomplete")
                  elif validation_commit_sha != head_sha:
                      unavailable("unconfirmed-provenance")
                  else:
                      available(base_sha, head_sha, changed_files(base_sha, head_sha))
              elif mode == "pull_request":
                  pull_request = event.get("pull_request") or {}
                  base_tip_sha = (pull_request.get("base") or {}).get("sha")
                  head_sha = (pull_request.get("head") or {}).get("sha")
                  if not ensure_commit(base_tip_sha) or not ensure_commit(head_sha):
                      unavailable("incomplete")
                  elif validation_commit_sha != head_sha:
                      unavailable("unconfirmed-provenance")
                  else:
                      base_sha = git("merge-base", base_tip_sha, head_sha).decode().strip()
                      if not ensure_commit(base_sha):
                          unavailable("incomplete")
                      else:
                          available(
                              base_sha,
                              head_sha,
                              changed_files(base_sha, head_sha),
                              base_tip_sha=base_tip_sha,
                          )
              else:
                  unavailable("missing")
          except NonCanonicalChangedPathError:
              unavailable("inconsistent")
          except (KeyError, OSError, subprocess.CalledProcessError, UnicodeError, ValueError, json.JSONDecodeError):
              unavailable("incomplete")
          PY
            # shellcheck source=/dev/null
            source .three-ci-validation/normalize/range-args.sh
          fi
          uv run python eng/scripts/workflow_release_control.py write-ci-validation-request \
            --mode "$CI_MODE" \
            --repository "$CI_REPOSITORY" \
            --workflow "CI Validation" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$CI_EVENT_NAME" \
            --event-number "$CI_EVENT_NUMBER" \
            --actor "$CI_ACTOR" \
            --validation-commit-sha "$validation_commit_sha" \
            --validation-ref "$validation_ref" \
            "${range_args[@]}" \
            --out .three-ci-validation/normalize/ci-validation-request.json
      - name: Upload planner-facing request
        id: upload-request
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.refs.outputs.request_artifact_name }}
          path: .three-ci-validation/normalize/ci-validation-request.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  plan:
    name: plan
    needs: normalize-input
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      plan-artifact-id: ${{ steps.upload-plan.outputs.artifact-id }}
      changed-files-snapshot-artifact-id: ${{ steps.upload-changed-files.outputs.artifact-id }}
      fact-snapshot-artifact-id: ${{ steps.upload-fact-snapshot.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        id: setup-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.10.9'
      - name: Retry uv installation
        if: ${{ steps.setup-uv.outcome == 'failure' }}
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.10.9'
      - name: Install .NET for NBGV-backed release planning
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore .NET local tools for NBGV-backed release planning
        shell: bash
        run: dotnet tool restore
      - name: Verify request producer boundary
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_REF: ci-validation/requests/${{ github.run_id }}/${{ github.run_attempt }}/ci-validation-request.json
          REQUEST_ARTIFACT_ID: ${{ needs.normalize-input.outputs.request-artifact-id }}
        run: |
          uv run python eng/scripts/workflow_release_control.py verify-ci-validation-artifact-boundaries \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "CI Validation" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-artifact "{\"artifact-ref\":\"${REQUEST_REF}\",\"artifact-instance-id\":\"${REQUEST_ARTIFACT_ID}\",\"producer-boundary\":\"normalize-input\",\"producer-job\":\"normalize-input\"}"
      - uses: actions/download-artifact@v8
        if: ${{ needs.normalize-input.outputs.request-artifact-id != '' }}
        with:
          artifact-ids: ${{ needs.normalize-input.outputs.request-artifact-id }}
          merge-multiple: true
          path: .three-ci-validation/request
      - name: Run CI validation planner
        run: |
          mkdir -p .three-ci-validation/plan
          observed_commit_sha="$(git rev-parse HEAD)"
          uv run three-workflow-release-planner ci-plan \
            --repo-root . \
            --request .three-ci-validation/request/ci-validation-request.json \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --observed-commit-sha "$observed_commit_sha" \
            --plan-out .three-ci-validation/plan/validation-plan.json \
            --changed-files-out .three-ci-validation/plan/changed-files.json \
            --fact-snapshot-out .three-ci-validation/plan/fact-snapshot.json \
            --diagnostics-out .three-ci-validation/plan/planner-diagnostics.json
      - name: Upload validation plan
        id: upload-plan
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.normalize-input.outputs.plan-artifact-name }}
          path: .three-ci-validation/plan/validation-plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload planner diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.normalize-input.outputs.planner-diagnostics-artifact-name }}
          path: .three-ci-validation/plan/planner-diagnostics.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload changed-files snapshot
        id: upload-changed-files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.normalize-input.outputs.changed-files-snapshot-artifact-name }}
          path: .three-ci-validation/plan/changed-files.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload fact snapshot
        id: upload-fact-snapshot
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.normalize-input.outputs.fact-snapshot-artifact-name }}
          path: .three-ci-validation/plan/fact-snapshot.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  materialize-execution-batches:
    name: materialize-execution-batches
    needs:
      - normalize-input
      - plan
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      has-execution-batches: ${{ steps.materialize.outputs.has_execution_batches }}
      execution-batch-matrix: ${{ steps.materialize.outputs.execution_batch_matrix }}
      has-ubuntu-execution-batches: ${{ steps.materialize.outputs.has_ubuntu_execution_batches }}
      ubuntu-execution-batch-matrix: ${{ steps.materialize.outputs.ubuntu_execution_batch_matrix }}
      has-windows-execution-batches: ${{ steps.materialize.outputs.has_windows_execution_batches }}
      windows-execution-batch-matrix: ${{ steps.materialize.outputs.windows_execution_batch_matrix }}
      has-macos-execution-batches: ${{ steps.materialize.outputs.has_macos_execution_batches }}
      macos-execution-batch-matrix: ${{ steps.materialize.outputs.macos_execution_batch_matrix }}
      execution-batch-manifest-artifact-id: ${{ steps.upload-execution-batch-manifest.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        id: setup-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.10.9'
      - name: Retry uv installation
        if: ${{ steps.setup-uv.outcome == 'failure' }}
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.10.9'
      - name: Verify planning artifact producer boundaries
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_REF: ci-validation/requests/${{ github.run_id }}/${{ github.run_attempt }}/ci-validation-request.json
          PLAN_REF: ci-validation/planning/${{ github.run_id }}/${{ github.run_attempt }}/validation-plan.json
          CHANGED_FILES_REF: ci-validation/planning/${{ github.run_id }}/${{ github.run_attempt }}/changed-files-snapshot.json
          FACT_SNAPSHOT_REF: ci-validation/planning/${{ github.run_id }}/${{ github.run_attempt }}/fact-snapshot.json
          REQUEST_ARTIFACT_ID: ${{ needs.normalize-input.outputs.request-artifact-id }}
          PLAN_ARTIFACT_ID: ${{ needs.plan.outputs.plan-artifact-id }}
          CHANGED_FILES_ARTIFACT_ID: ${{ needs.plan.outputs.changed-files-snapshot-artifact-id }}
          FACT_SNAPSHOT_ARTIFACT_ID: ${{ needs.plan.outputs.fact-snapshot-artifact-id }}
        run: |
          expected_artifacts=(
            --expected-artifact "{\"artifact-ref\":\"${REQUEST_REF}\",\"artifact-instance-id\":\"${REQUEST_ARTIFACT_ID}\",\"producer-boundary\":\"normalize-input\",\"producer-job\":\"normalize-input\"}"
            --expected-artifact "{\"artifact-ref\":\"${PLAN_REF}\",\"artifact-instance-id\":\"${PLAN_ARTIFACT_ID}\",\"producer-boundary\":\"plan\",\"producer-job\":\"plan\"}"
          )
          if [ -n "$CHANGED_FILES_ARTIFACT_ID" ]; then
            expected_artifacts+=(--expected-artifact "{\"artifact-ref\":\"${CHANGED_FILES_REF}\",\"artifact-instance-id\":\"${CHANGED_FILES_ARTIFACT_ID}\",\"producer-boundary\":\"plan\",\"producer-job\":\"plan\"}")
          fi
          if [ -n "$FACT_SNAPSHOT_ARTIFACT_ID" ]; then
            expected_artifacts+=(--expected-artifact "{\"artifact-ref\":\"${FACT_SNAPSHOT_REF}\",\"artifact-instance-id\":\"${FACT_SNAPSHOT_ARTIFACT_ID}\",\"producer-boundary\":\"plan\",\"producer-job\":\"plan\"}")
          fi
          uv run python eng/scripts/workflow_release_control.py verify-ci-validation-artifact-boundaries \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "CI Validation" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            "${expected_artifacts[@]}"
      - uses: actions/download-artifact@v8
        if: ${{ needs.normalize-input.outputs.request-artifact-id != '' }}
        with:
          artifact-ids: ${{ needs.normalize-input.outputs.request-artifact-id }}
          merge-multiple: true
          path: .three-ci-validation/request
      - uses: actions/download-artifact@v8
        if: ${{ needs.plan.outputs.plan-artifact-id != '' }}
        with:
          artifact-ids: ${{ needs.plan.outputs.plan-artifact-id }}
          merge-multiple: true
          path: .three-ci-validation/plan
      - name: Download changed-files snapshot
        if: ${{ needs.plan.outputs.changed-files-snapshot-artifact-id != '' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.plan.outputs.changed-files-snapshot-artifact-id }}
          merge-multiple: true
          path: .three-ci-validation/plan
      - name: Download fact snapshot
        if: ${{ needs.plan.outputs.fact-snapshot-artifact-id != '' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.plan.outputs.fact-snapshot-artifact-id }}
          merge-multiple: true
          path: .three-ci-validation/plan
      - name: Materialize execution batches
        id: materialize
        run: |
          mkdir -p .three-ci-validation/materialize
          uv run python eng/scripts/workflow_release_control.py materialize-ci-validation-execution-batches \
            --plan .three-ci-validation/plan/validation-plan.json \
            --request .three-ci-validation/request/ci-validation-request.json \
            --changed-files-snapshot .three-ci-validation/plan/changed-files.json \
            --fact-snapshot .three-ci-validation/plan/fact-snapshot.json \
            --workflow "CI Validation" \
            --execution-job "execution-batch" \
            --non-batch-control-plane-job-count 4 \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --execution-batch-manifest-out .three-ci-validation/materialize/execution-batch-manifest.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload execution-batch manifest
        id: upload-execution-batch-manifest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.normalize-input.outputs.execution-batch-manifest-artifact-name }}
          path: .three-ci-validation/materialize/execution-batch-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  execution-batch-ubuntu-orchestrator:
    name: execution-batch-ubuntu-orchestrator
    needs:
      - normalize-input
      - plan
      - materialize-execution-batches
    if: always() && needs.materialize-execution-batches.outputs.has-ubuntu-execution-batches == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        id: setup-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.10.9'
      - name: Retry uv installation
        if: ${{ steps.setup-uv.outcome == 'failure' }}
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.10.9'
      - name: Install .NET for NBGV-backed release planning
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore .NET local tools for NBGV-backed release planning
        shell: bash
        run: dotnet tool restore
      - name: Install Node.js for JavaScript/TypeScript validation
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Enable pnpm for JavaScript/TypeScript validation
        shell: bash
        run: corepack enable pnpm
      - name: Install Ruby for RubyGems validation
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: '4.0.5'
      - uses: actions/download-artifact@v8
        if: ${{ needs.normalize-input.outputs.request-artifact-id != '' }}
        with:
          artifact-ids: ${{ needs.normalize-input.outputs.request-artifact-id }}
          merge-multiple: true
          path: .three-ci-validation/request
      - uses: actions/download-artifact@v8
        if: ${{ needs.plan.outputs.plan-artifact-id != '' }}
        with:
          artifact-ids: ${{ needs.plan.outputs.plan-artifact-id }}
          merge-multiple: true
          path: .three-ci-validation/plan
      - name: Download execution-batch manifest
        if: ${{ needs.materialize-execution-batches.outputs.execution-batch-manifest-artifact-id != '' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.materialize-execution-batches.outputs.execution-batch-manifest-artifact-id }}
          merge-multiple: true
          path: .three-ci-validation/materialize
      - name: Download changed-files snapshot
        if: ${{ needs.plan.outputs.changed-files-snapshot-artifact-id != '' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.plan.outputs.changed-files-snapshot-artifact-id }}
          merge-multiple: true
          path: .three-ci-validation/plan
      - name: Download fact snapshot
        if: ${{ needs.plan.outputs.fact-snapshot-artifact-id != '' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.plan.outputs.fact-snapshot-artifact-id }}
          merge-multiple: true
          path: .three-ci-validation/plan
      - name: Prepare runner-family orchestrator directories
        shell: bash
        run: |
          mkdir -p .three-ci-validation/observed-artifacts .three-ci-validation/orchestrator/ubuntu/state .three-ci-validation/orchestrator/ubuntu/work
      - name: Run ubuntu orchestrator slot 00
        id: run-slot-00
        shell: bash
        env:
