      - name: Setup native Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '4.0.7'
      - name: Materialize exact committed endpoints
        id: endpoints
        run: |
          dotnet "$RUNNER_TEMP/ruby-control/control/WorkflowDelivery.dll" ci caller-ruby materialize \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ruby-scope/ci-scope.json" \
            "$RUNNER_TEMP/ruby-control" "$RUNNER_TEMP/ruby-group"
      - name: Setup basis NBGV SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ steps.endpoints.outputs.basis_directory }}/global.json
      - name: Prepare native query tools and select once
        id: plan
        run: |
          probe=$(ruby -rbundler -e 'print Bundler::LockfileParser.new(File.read(ARGV[0])).bundler_version' \
            src/public/lib/hexo-renderer-asciidoc/Gemfile.lock)
          dotnet "$RUNNER_TEMP/ruby-control/control/WorkflowDelivery.dll" ci caller-ruby plan \
            "$RUNNER_TEMP/ruby-group" "$RUNNER_TEMP/ruby-scope/ci-scope.json" \
            "$(command -v ruby)" "$(command -v gem)" "$(command -v bundle)" "$(command -v dotnet)" "$probe"
      - name: Install system dependencies
        if: success() && steps.plan.outputs.latexmath == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            dvisvgm \
            pdf2svg \
            poppler-utils \
            imagemagick \
            ghostscript \
            fd-find
      - name: Ensure fd is available
        if: success() && steps.plan.outputs.latexmath == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          if command -v fd >/dev/null 2>&1; then
            fd --version
            exit 0
          fi

          if command -v fdfind >/dev/null 2>&1; then
            fdfind --version
            mkdir -p "${HOME}/.local/bin"
            ln -sf "$(command -v fdfind)" "${HOME}/.local/bin/fd" || true
            export PATH="${HOME}/.local/bin:${PATH}"
            fd --version
            exit 0
          fi

          echo "fd is not available" >&2
          exit 1

      - name: Execute and collect every original selected check
        run: dotnet "$RUNNER_TEMP/ruby-control/control/WorkflowDelivery.dll" ci caller-ruby execute "$RUNNER_TEMP/ruby-group"
      - name: Transfer original Ruby facts to Node planning
        id: node-facts
        uses: actions/upload-artifact@v7
        with:
          name: ruby-node-inputs
          path: ${{ runner.temp }}/ruby-group/node-inputs.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain native planning, execution and collection outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruby-group-results
          path: |
            ${{ runner.temp }}/ruby-group/*.json
            ${{ runner.temp }}/ruby-group/*.stdout
            ${{ runner.temp }}/ruby-group/*.stderr
          if-no-files-found: ignore
          retention-days: 7
      - name: Reject canceled validation
        if: cancelled()
        run: |
          echo 'Ruby group was canceled before a complete result.' >&2
          exit 1

