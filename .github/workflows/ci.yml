name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validate
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: dotnet,go,java,node,powershell,python,ruby,pkl

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.*'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      - name: Install pkl
        uses: pkl-community/setup-pkl@0bffd1602015ccf46333e880f81087e73fd1a361 # v0
        with:
          pkl-version: 0.31.1

      - name: Mise Install Tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          experimental: true
          install: false

      - name: Install dependencies
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mise link core:dotnet@10 "$(which dotnet)"
          mise link go@1 "$(which go)"
          mise link java@25 "$(which java)"
          mise link node@24 "$(which node)"
          mise link pwsh@7 "$(which pwsh)"
          mise link python@3.14 "$(which python3)"
          mise link ruby@3.3 "$(which ruby)"

          mise install
          mise bootstrap

      - name: Validate with HK
        env:
          HK_PROFILE: small,medium,large
        run: |
          set -Eeuo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          echo "hk check from $BASE to $HEAD"
          hk check \
            --no-progress \
            --no-fail-fast \
            --from-ref "$BASE" \
            --to-ref "$HEAD"

  dotnet-tests:
    name: Build & Test (.NET 10)
    runs-on: windows-latest
    needs: validation

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore dotnet tools
        run: |
          dotnet tool restore

      - name: Restore
        run: dotnet restore dirs.proj -p:RestoreLockedMode=true

      - name: Build
        run: dotnet build dirs.proj -c Debug --no-restore -p:RestoreLockedMode=true

      - name: Test
        shell: pwsh
        run: |
          $testProjects = Get-ChildItem -Path tests -Filter '*.csproj' -Recurse

          foreach ($project in $testProjects) {
            $projectXml = Get-Content -Raw -Path $project.FullName

            if ($projectXml.Contains('Sdk="MSTest.Sdk"') -or $projectXml.Contains('Include="xunit.v3.mtp-v2"')) {
              dotnet test --project $project.FullName -c Debug --no-build -p:RestoreLockedMode=true
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            } elseif ($projectXml.Contains('Include="xunit.runner.visualstudio"')) {
              $testAssembly = Join-Path $project.DirectoryName "bin/Debug/net10.0/$($project.BaseName).dll"
              dotnet vstest $testAssembly
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            }
          }

  node-tests:
    name: Test & Build (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: validation
    strategy:
      matrix:
        node-version: [20.19.0, 20.x, 22.x, 24.x]

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile
          dotnet tool restore

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

  python-tests:
    name: Test (Python 3.14)
    runs-on: ubuntu-latest
    needs: validation

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      PYTHON_VERSION: '3.14'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: 'uv.lock'

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          dotnet tool restore
          uv sync --frozen --all-packages

      - name: Run tests
        run: |
          set -Eeuo pipefail
          uv run --frozen pytest

  ruby-tests:
    name: Test (Ruby 3.3)
    runs-on: ubuntu-latest
    needs: validation

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: '4.0.6'

      - name: Install system dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            dvisvgm \
            pdf2svg \
            poppler-utils \
            imagemagick \
            ghostscript \
            fd-find
      - name: Ensure fd is available
        shell: bash
        run: |
          set -Eeuo pipefail

          if command -v fd >/dev/null 2>&1; then
            fd --version
            exit 0
          fi

          if command -v fdfind >/dev/null 2>&1; then
            fdfind --version
            mkdir -p "${HOME}/.local/bin"
            ln -sf "$(command -v fdfind)" "${HOME}/.local/bin/fd" || true
            export PATH="${HOME}/.local/bin:${PATH}"
            fd --version
            exit 0
          fi

          echo "fd is not available" >&2
          exit 1

      - name: Run Ruby gem tests
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t gemspecs < <(fd -e gemspec)
          if [[ "${#gemspecs[@]}" -eq 0 ]]; then
            echo "No *.gemspec found; skipping Ruby tests."
            exit 0
          fi

          printf 'Discovered gemspecs:\n'
          printf ' - %s\n' "${gemspecs[@]}"

          failures=0
          for gemspec in "${gemspecs[@]}"; do
            dir="$(dirname "${gemspec}")"
            echo ""
            echo "==> Testing Ruby gem in ${dir}"

            if [[ ! -f "${dir}/Gemfile" ]]; then
              echo "No Gemfile in ${dir}; skipping Bundler/RSpec."
              continue
            fi

            if [[ ! -d "${dir}/spec" ]]; then
              echo "No spec/ directory in ${dir}; skipping RSpec."
              continue
            fi

            pushd "${dir}" >/dev/null
            bundle install
            bundle exec rspec || failures=$((failures + 1))
            popd >/dev/null
          done

          if [[ "${failures}" -ne 0 ]]; then
            echo "Ruby test failures: ${failures}" >&2
            exit 1
          fi
