          [[ "$SCOPE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CONTROL_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Checkout tested candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Receive exact scope
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
