  aggregate-evidence:
    name: aggregate-evidence
    needs:
      - normalize-input
      - plan
      - materialize-execution-batches
      - execution-batch-ubuntu-orchestrator
      - execution-batch-windows-orchestrator
      - execution-batch-macos-orchestrator
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        id: setup-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.10.9'
      - name: Retry uv installation
        if: ${{ steps.setup-uv.outcome == 'failure' }}
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.10.9'
      - name: Prepare aggregate input directories
        run: |
          mkdir -p \
            .three-ci-validation/request \
            .three-ci-validation/plan \
            .three-ci-validation/materialize \
            .three-ci-validation/observed-artifacts \
            .three-ci-validation/aggregate
      - name: Download CI validation request
        if: ${{ needs.normalize-input.outputs.request-artifact-id != '' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.normalize-input.outputs.request-artifact-id }}
          merge-multiple: true
          path: .three-ci-validation/request
      - name: Download validation plan
        if: ${{ needs.plan.outputs.plan-artifact-id != '' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.plan.outputs.plan-artifact-id }}
          merge-multiple: true
          path: .three-ci-validation/plan
      - name: Download execution-batch manifest
        if: ${{ needs.materialize-execution-batches.outputs.execution-batch-manifest-artifact-id != '' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.materialize-execution-batches.outputs.execution-batch-manifest-artifact-id }}
          merge-multiple: true
          path: .three-ci-validation/materialize
      - name: Download changed-files snapshot
        if: ${{ needs.plan.outputs.changed-files-snapshot-artifact-id != '' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.plan.outputs.changed-files-snapshot-artifact-id }}
          merge-multiple: true
          path: .three-ci-validation/plan
      - name: Download fact snapshot
        if: ${{ needs.plan.outputs.fact-snapshot-artifact-id != '' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.plan.outputs.fact-snapshot-artifact-id }}
          merge-multiple: true
          path: .three-ci-validation/plan
      - name: Download observed batch evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
        run: |
          rm -rf .three-ci-validation/observed-artifacts
          mkdir -p .three-ci-validation/observed-artifacts .three-ci-validation/aggregate
          aggregate_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s\n' "$aggregate_started_at" > .three-ci-validation/aggregate/aggregate-started-at.txt
          uv run python eng/scripts/workflow_release_control.py download-ci-validation-observed-artifacts \
            --repository "$CI_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --plan .three-ci-validation/plan/validation-plan.json \
            --execution-batch-manifest .three-ci-validation/materialize/execution-batch-manifest.json \
            --observed-artifacts-dir .three-ci-validation/observed-artifacts
      - name: Write aggregate evidence manifest
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          REQUEST_ARTIFACT_ID: ${{ needs.normalize-input.outputs.request-artifact-id }}
          PLAN_ARTIFACT_ID: ${{ needs.plan.outputs.plan-artifact-id }}
          CHANGED_FILES_ARTIFACT_ID: ${{ needs.plan.outputs.changed-files-snapshot-artifact-id }}
          FACT_SNAPSHOT_ARTIFACT_ID: ${{ needs.plan.outputs.fact-snapshot-artifact-id }}
          EXECUTION_BATCH_MANIFEST_ARTIFACT_ID: ${{ needs.materialize-execution-batches.outputs.execution-batch-manifest-artifact-id }}
        run: |
          mkdir -p .three-ci-validation/aggregate
          aggregate_started_at="$(cat .three-ci-validation/aggregate/aggregate-started-at.txt)"
          aggregate_args=(
            --repository "$CI_REPOSITORY"
            --workflow "CI Validation"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
            --request .three-ci-validation/request/ci-validation-request.json
            --plan .three-ci-validation/plan/validation-plan.json
            --changed-files-snapshot .three-ci-validation/plan/changed-files.json
            --fact-snapshot .three-ci-validation/plan/fact-snapshot.json
            --observed-artifacts-dir .three-ci-validation/observed-artifacts
            --expected-request-artifact-id "$REQUEST_ARTIFACT_ID"
            --expected-plan-artifact-id "$PLAN_ARTIFACT_ID"
            --created-at "$aggregate_started_at"
            --aggregate-phase evidence
            --aggregate-evidence-manifest-out .three-ci-validation/aggregate/aggregate-evidence-manifest.json
            --aggregate-summary-out .three-ci-validation/aggregate/aggregate-summary.json
          )
          if [ -n "$EXECUTION_BATCH_MANIFEST_ARTIFACT_ID" ]; then
            aggregate_args+=(
              --execution-batch-manifest .three-ci-validation/materialize/execution-batch-manifest.json
              --expected-execution-batch-manifest-artifact-id "$EXECUTION_BATCH_MANIFEST_ARTIFACT_ID"
            )
          else
            aggregate_args+=(--batch-materialization-failed)
          fi
          if [ -n "$CHANGED_FILES_ARTIFACT_ID" ]; then
            aggregate_args+=(--expected-changed-files-snapshot-artifact-id "$CHANGED_FILES_ARTIFACT_ID")
          fi
          if [ -n "$FACT_SNAPSHOT_ARTIFACT_ID" ]; then
            aggregate_args+=(--expected-fact-snapshot-artifact-id "$FACT_SNAPSHOT_ARTIFACT_ID")
          fi
          uv run python eng/scripts/workflow_release_control.py aggregate-ci-evidence "${aggregate_args[@]}"
      - name: Upload aggregate evidence manifest
        if: always()
        id: upload-aggregate-evidence-manifest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.normalize-input.outputs.aggregate-evidence-manifest-artifact-name }}
          path: .three-ci-validation/aggregate/aggregate-evidence-manifest.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify aggregate evidence manifest producer boundary
        if: always() && steps.upload-aggregate-evidence-manifest.outputs.artifact-id != ''
        id: verify-aggregate-evidence-manifest-producer-boundary
        env:
          GH_TOKEN: ${{ github.token }}
          AGGREGATE_EVIDENCE_MANIFEST_REF: ci-validation/aggregate/${{ github.run_id }}/${{ github.run_attempt }}/aggregate-evidence-manifest.json
          AGGREGATE_EVIDENCE_MANIFEST_ARTIFACT_ID: ${{ steps.upload-aggregate-evidence-manifest.outputs.artifact-id }}
        run: |
          uv run python eng/scripts/workflow_release_control.py verify-ci-validation-artifact-boundaries \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "CI Validation" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --max-prefixed-validation-artifacts 18 \
            --expected-artifact "{\"artifact-ref\":\"${AGGREGATE_EVIDENCE_MANIFEST_REF}\",\"artifact-instance-id\":\"${AGGREGATE_EVIDENCE_MANIFEST_ARTIFACT_ID}\",\"producer-boundary\":\"aggregate-evidence\",\"producer-job\":\"aggregate-evidence\"}"
      - name: Write aggregate summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          REQUEST_ARTIFACT_ID: ${{ needs.normalize-input.outputs.request-artifact-id }}
          PLAN_ARTIFACT_ID: ${{ needs.plan.outputs.plan-artifact-id }}
          CHANGED_FILES_ARTIFACT_ID: ${{ needs.plan.outputs.changed-files-snapshot-artifact-id }}
          FACT_SNAPSHOT_ARTIFACT_ID: ${{ needs.plan.outputs.fact-snapshot-artifact-id }}
          EXECUTION_BATCH_MANIFEST_ARTIFACT_ID: ${{ needs.materialize-execution-batches.outputs.execution-batch-manifest-artifact-id }}
          AGGREGATE_EVIDENCE_MANIFEST_ARTIFACT_ID: ${{ steps.upload-aggregate-evidence-manifest.outputs.artifact-id }}
          AGGREGATE_EVIDENCE_MANIFEST_PRODUCER_VERIFIED: ${{ steps.verify-aggregate-evidence-manifest-producer-boundary.outcome == 'success' }}
        run: |
          mkdir -p .three-ci-validation/aggregate
          aggregate_completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -s .three-ci-validation/aggregate/aggregate-started-at.txt ]; then
            aggregate_started_at="$(cat .three-ci-validation/aggregate/aggregate-started-at.txt)"
          else
            aggregate_started_at="$aggregate_completed_at"
          fi
          aggregate_args=(
            --repository "$CI_REPOSITORY"
            --workflow "CI Validation"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
            --request .three-ci-validation/request/ci-validation-request.json
            --plan .three-ci-validation/plan/validation-plan.json
            --changed-files-snapshot .three-ci-validation/plan/changed-files.json
            --fact-snapshot .three-ci-validation/plan/fact-snapshot.json
            --observed-artifacts-dir .three-ci-validation/observed-artifacts
            --expected-request-artifact-id "$REQUEST_ARTIFACT_ID"
            --expected-plan-artifact-id "$PLAN_ARTIFACT_ID"
            --aggregate-evidence-manifest-artifact-id "$AGGREGATE_EVIDENCE_MANIFEST_ARTIFACT_ID"
            --started-at "$aggregate_started_at"
            --completed-at "$aggregate_completed_at"
            --created-at "$aggregate_completed_at"
            --aggregate-phase summary
            --aggregate-evidence-manifest-out .three-ci-validation/aggregate/aggregate-evidence-manifest.json
            --aggregate-summary-out .three-ci-validation/aggregate/aggregate-summary.json
          )
          if [ -n "$EXECUTION_BATCH_MANIFEST_ARTIFACT_ID" ]; then
            aggregate_args+=(
              --execution-batch-manifest .three-ci-validation/materialize/execution-batch-manifest.json
              --expected-execution-batch-manifest-artifact-id "$EXECUTION_BATCH_MANIFEST_ARTIFACT_ID"
            )
          else
            aggregate_args+=(--batch-materialization-failed)
          fi
          if [ -n "$CHANGED_FILES_ARTIFACT_ID" ]; then
            aggregate_args+=(--expected-changed-files-snapshot-artifact-id "$CHANGED_FILES_ARTIFACT_ID")
          fi
          if [ -n "$FACT_SNAPSHOT_ARTIFACT_ID" ]; then
            aggregate_args+=(--expected-fact-snapshot-artifact-id "$FACT_SNAPSHOT_ARTIFACT_ID")
          fi
          aggregate_args+=(
            --aggregate-evidence-manifest-producer-verified
            "$AGGREGATE_EVIDENCE_MANIFEST_PRODUCER_VERIFIED"
          )
          uv run python eng/scripts/workflow_release_control.py aggregate-ci-evidence "${aggregate_args[@]}"
      - name: Upload aggregate summary
        if: always()
        id: upload-aggregate-summary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.normalize-input.outputs.aggregate-summary-artifact-name }}
          path: .three-ci-validation/aggregate/aggregate-summary.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Download uploaded aggregate evidence manifest
        if: always() && steps.upload-aggregate-evidence-manifest.outputs.artifact-id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.upload-aggregate-evidence-manifest.outputs.artifact-id }}
          merge-multiple: true
          path: .three-ci-validation/final-uploaded/aggregate-evidence-manifest
      - name: Download uploaded aggregate summary
        if: always() && steps.upload-aggregate-summary.outputs.artifact-id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.upload-aggregate-summary.outputs.artifact-id }}
          merge-multiple: true
          path: .three-ci-validation/final-uploaded/aggregate-summary
      - name: Verify final artifact bytes and producer boundaries
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AGGREGATE_EVIDENCE_MANIFEST_REF: ci-validation/aggregate/${{ github.run_id }}/${{ github.run_attempt }}/aggregate-evidence-manifest.json
          AGGREGATE_SUMMARY_REF: ci-validation/aggregate/${{ github.run_id }}/${{ github.run_attempt }}/aggregate-summary.json
          AGGREGATE_EVIDENCE_MANIFEST_ARTIFACT_ID: ${{ steps.upload-aggregate-evidence-manifest.outputs.artifact-id }}
          AGGREGATE_SUMMARY_ARTIFACT_ID: ${{ steps.upload-aggregate-summary.outputs.artifact-id }}
        run: |
          read -r expected_prefixed_validation_artifacts aggregate_manifest_digest aggregate_summary_digest <<EOF
          $(uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path('.three-ci-validation/aggregate/aggregate-summary.json').read_text(encoding='utf-8'))
          aggregate_manifest_path = Path('.three-ci-validation/final-uploaded/aggregate-evidence-manifest/aggregate-evidence-manifest.json')
          aggregate_summary_path = Path('.three-ci-validation/final-uploaded/aggregate-summary/aggregate-summary.json')
          aggregate_manifest_artifact_id = os.environ.get('AGGREGATE_EVIDENCE_MANIFEST_ARTIFACT_ID', '')
          aggregate_summary_artifact_id = os.environ.get('AGGREGATE_SUMMARY_ARTIFACT_ID', '')
          aggregate_manifest_digest = (
              hashlib.sha256(aggregate_manifest_path.read_bytes()).hexdigest()
              if aggregate_manifest_artifact_id and aggregate_manifest_path.is_file()
              else ''
          )
          aggregate_summary_digest = (
              hashlib.sha256(aggregate_summary_path.read_bytes()).hexdigest()
              if aggregate_summary_artifact_id and aggregate_summary_path.is_file()
              else ''
          )
          print(summary['budgets']['expected-actual-validation-artifacts'], aggregate_manifest_digest, aggregate_summary_digest)
          PY
          )
          EOF
          expected_artifacts=()
          expected_artifacts+=(--expected-artifact "{\"artifact-ref\":\"${AGGREGATE_EVIDENCE_MANIFEST_REF}\",\"artifact-instance-id\":\"${AGGREGATE_EVIDENCE_MANIFEST_ARTIFACT_ID}\",\"producer-boundary\":\"aggregate-evidence\",\"producer-job\":\"aggregate-evidence\",\"downloaded-path\":\".three-ci-validation/final-uploaded/aggregate-evidence-manifest/aggregate-evidence-manifest.json\",\"content-digest\":\"${aggregate_manifest_digest}\"}")
          expected_artifacts+=(--expected-artifact "{\"artifact-ref\":\"${AGGREGATE_SUMMARY_REF}\",\"artifact-instance-id\":\"${AGGREGATE_SUMMARY_ARTIFACT_ID}\",\"producer-boundary\":\"aggregate-evidence\",\"producer-job\":\"aggregate-evidence\",\"downloaded-path\":\".three-ci-validation/final-uploaded/aggregate-summary/aggregate-summary.json\",\"content-digest\":\"${aggregate_summary_digest}\"}")
          uv run python eng/scripts/workflow_release_control.py verify-ci-validation-artifact-boundaries \
           --repository "$GITHUB_REPOSITORY" \
           --workflow "CI Validation" \
           --run-id "$GITHUB_RUN_ID" \
           --run-attempt "$GITHUB_RUN_ATTEMPT" \
           --request .three-ci-validation/request/ci-validation-request.json \
           --plan .three-ci-validation/plan/validation-plan.json \
           --changed-files-snapshot .three-ci-validation/plan/changed-files.json \
           --fact-snapshot .three-ci-validation/plan/fact-snapshot.json \
           --execution-batch-manifest .three-ci-validation/materialize/execution-batch-manifest.json \
           --observed-artifacts-dir .three-ci-validation/observed-artifacts \
           --max-prefixed-validation-artifacts 20 \
           --expected-prefixed-validation-artifacts "$expected_prefixed_validation_artifacts" \
           --verify-final-uploaded-bytes \
           "${expected_artifacts[@]}"
