name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
  merge_group:
    branches:
      - main
  schedule:
    - cron: '31 7 * * 3'
  workflow_dispatch:

permissions:
  actions: read
  checks: write
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-latest
            build_mode: none
            dependency_caching: false
          - language: csharp
            os: windows-latest
            build_mode: none
            dependency_caching: false
          - language: javascript-typescript
            os: ubuntu-latest
            build_mode: none
            dependency_caching: false
          - language: python
            os: ubuntu-latest
            build_mode: none
            dependency_caching: false
          - language: ruby
            os: ubuntu-latest
            build_mode: none
            dependency_caching: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore .NET Dependencies
        if: matrix.language == 'csharp'
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet restore dirs.proj -p:RestoreLockedMode=true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          config-file: .github/codeql/codeql-config.yml
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          dependency-caching: ${{ matrix.dependency_caching }}

      - name: Build (C# for CodeQL)
        if: matrix.language == 'csharp'
        shell: pwsh
        run: |
          dotnet build dirs.proj -c Debug --no-restore -p:RestoreLockedMode=true -bl:codeql.binlog
          "CODEQL_EXTRACTOR_CSHARP_OPTION_BINLOG=codeql.binlog" >> $env:GITHUB_ENV

      - if: ${{ matrix.build_mode == 'autobuild' }}
        name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
