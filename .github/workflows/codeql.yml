name: CodeQL

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  checks: write
  contents: read
  security-events: write

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      include_csharp: ${{ steps.matrix.outputs.include_csharp }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            dotnet:
              - '**/*.cs'
              - '**/*.csproj'
              - '**/*.props'
              - '**/*.targets'
              - '**/*.sln'
              - 'global.json'
              - 'dirs.proj'
              - '**/Directory.Build.props'
              - '**/Directory.Build.targets'
              - 'nuget.config'
              - '**/packages.lock.json'

      - name: Generate CodeQL language matrix
        id: matrix
        shell: bash
        env:
          DOTNET_CHANGED: ${{ steps.filter.outputs.dotnet }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os

          dotnet_changed = (os.environ.get('DOTNET_CHANGED') == 'true')
          event_name = os.environ.get('EVENT_NAME', '')
          include_csharp = event_name in ('workflow_dispatch', 'merge_group') or dotnet_changed

          include = [
            {
              'language': 'actions',
              'os': 'ubuntu-latest',
              'build_mode': 'none',
              'dependency_caching': False,
            },
            {
              'language': 'javascript-typescript',
              'os': 'ubuntu-latest',
              'build_mode': 'none',
              'dependency_caching': False,
            },
            {
              'language': 'python',
              'os': 'ubuntu-latest',
              'build_mode': 'none',
              'dependency_caching': False,
            },
            {
              'language': 'ruby',
              'os': 'ubuntu-latest',
              'build_mode': 'none',
              'dependency_caching': False,
            },
          ]

          if include_csharp:
            include.insert(
              1,
              {
                'language': 'csharp',
                'os': 'windows-latest',
                'build_mode': 'none',
                'dependency_caching': False,
              },
            )

          matrix = {'include': include}
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
            f.write(f"include_csharp={'true' if include_csharp else 'false'}\n")
            f.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
          PY

  csharp-placeholder:
    name: Upload Empty SARIF (C# Skipped)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.include_csharp != 'true'

    steps:
      - name: Generate empty SARIF
        shell: bash
        run: |
          cat > empty-csharp.sarif <<'JSON'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "CodeQL",
                    "informationUri": "https://github.com/github/codeql-action",
                    "rules": []
                  }
                },
                "results": []
              }
            ]
          }
          JSON

      - name: Upload empty SARIF
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: empty-csharp.sarif
          category: '/language:csharp'

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    needs: changes

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore .NET Dependencies
        if: matrix.language == 'csharp'
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet restore dirs.proj -p:RestoreLockedMode=true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          config-file: .github/codeql/codeql-config.yml
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          dependency-caching: ${{ matrix.dependency_caching }}

      - name: Build (C# for CodeQL)
        if: matrix.language == 'csharp'
        shell: pwsh
        run: |
          dotnet build dirs.proj -c Debug --no-restore -p:RestoreLockedMode=true -bl:codeql.binlog
          "CODEQL_EXTRACTOR_CSHARP_OPTION_BINLOG=codeql.binlog" >> $env:GITHUB_ENV

      - if: ${{ matrix.build_mode == 'autobuild' }}
        name: Autobuild
        uses: github/codeql-action/autobuild@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          category: '/language:${{ matrix.language }}'
