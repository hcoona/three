name: Prepare Release Notes (Reusable)

on:
  workflow_call:
    inputs:
      target:
        description: "Target commit SHA to read CHANGELOG.md from"
        required: true
        type: string
      has_changelog:
        description: "Whether changelog_path is expected to exist"
        required: true
        type: boolean
      changelog_path:
        description: "Path to CHANGELOG.md in the repository at the target commit"
        required: true
        type: string
      tag_name:
        description: "Release tag name (e.g. release/<project>/v<version>)"
        required: true
        type: string
      project:
        description: "Workspace package name"
        required: true
        type: string
      version:
        description: "Release version"
        required: true
        type: string
      run_url:
        description: "GitHub Actions run URL"
        required: true
        type: string
      artifact_name:
        description: "Artifact name to upload release-notes.md as"
        required: true
        type: string

jobs:
  prepare:
    name: Prepare release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.target }}

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          HAS_CHANGELOG: ${{ inputs.has_changelog }}
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
          TAG_NAME: ${{ inputs.tag_name }}
          PROJECT: ${{ inputs.project }}
          VERSION: ${{ inputs.version }}
          RUN_URL: ${{ inputs.run_url }}
        run: |
          set -Eeuo pipefail

          notes_file="${{ runner.temp }}/release-notes.md"

          if [[ "${HAS_CHANGELOG}" == "true" ]]; then
            if [[ ! -f "${CHANGELOG_PATH}" ]]; then
              echo "Expected changelog file not found: ${CHANGELOG_PATH}" >&2
              exit 1
            fi
            cp "${CHANGELOG_PATH}" "${notes_file}"
          else
            cat <<EOF > "${notes_file}"
          ## Release notes

          This project does not provide CHANGELOG.md. Using default placeholder notes.

          - Tag: ${TAG_NAME}
          - Package: ${PROJECT}
          - Version: ${VERSION}
          - Build: ${RUN_URL}
          EOF
          fi

          echo "notes_file=${notes_file}" >> "${GITHUB_OUTPUT}"

      - name: Stage release notes
        shell: bash
        run: |
          set -Eeuo pipefail
          cp "${{ steps.notes.outputs.notes_file }}" "${{ github.workspace }}/release-notes.md"

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ github.workspace }}/release-notes.md
          if-no-files-found: error
