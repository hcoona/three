  upload-github-release-proofs:
    name: Upload github-release proof artifact
    needs:
      - publish-github-release-with-environment
      - publish-github-release-without-environment
    if: ${{ always() && (needs.publish-github-release-with-environment.outputs.has-proofs == 'true' || needs.publish-github-release-without-environment.outputs.has-proofs == 'true') && (needs.publish-github-release-with-environment.result == 'success' || needs.publish-github-release-with-environment.result == 'skipped') && (needs.publish-github-release-without-environment.result == 'success' || needs.publish-github-release-without-environment.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        proof: ${{ fromJson(needs.publish-github-release-with-environment.outputs.proof-matrix || needs.publish-github-release-without-environment.outputs.proof-matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.publish-github-release-with-environment.outputs.proof-staging-artifact-name || needs.publish-github-release-without-environment.outputs.proof-staging-artifact-name }}
          path: .three-workflow-release/proofs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.proof.name }}
          path: .three-workflow-release/proofs/${{ matrix.proof.file }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

