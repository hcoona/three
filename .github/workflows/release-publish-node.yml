name: Release Publish Node

on:
  workflow_call:
    inputs:
      commit-sha:
        required: true
        type: string
      plan-artifact-name:
        required: true
        type: string
      publish-node-id:
        required: true
        type: string
      run-id:
        required: true
        type: string
      run-attempt:
        required: true
        type: string
      release-environment:
        required: false
        type: string
        default: ''
      permission-class:
        required: true
        type: string
    outputs:
      publish-result-artifact-name:
        value: ${{ jobs.publish-github-release-with-environment.outputs.publish-result-artifact-name || jobs.publish-github-release-without-environment.outputs.publish-result-artifact-name || jobs.publish-github-packages-with-environment.outputs.publish-result-artifact-name || jobs.publish-github-packages-without-environment.outputs.publish-result-artifact-name || jobs.publish-external-oidc-with-environment.outputs.publish-result-artifact-name || jobs.publish-external-oidc-without-environment.outputs.publish-result-artifact-name }}

permissions:
  contents: read

jobs:
  publish-github-release-with-environment:
    name: Publish ${{ inputs.publish-node-id }}
    if: ${{ inputs.permission-class == 'github-release' && inputs.release-environment != '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.release-environment }}
    env:
      RELEASE_COMMIT_SHA: ${{ inputs.commit-sha }}
      RELEASE_PUBLISH_NODE_ID: ${{ inputs.publish-node-id }}
      RELEASE_RUN_ATTEMPT: ${{ inputs.run-attempt }}
      RELEASE_RUN_ID: ${{ inputs.run-id }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      publish-result-artifact-name: ${{ steps.name.outputs.publish_result_artifact_name }}
      has-proofs: ${{ steps.proofs.outputs.has_proofs }}
      proof-matrix: ${{ steps.proofs.outputs.proof_matrix }}
      proof-staging-artifact-name: proof-staging-${{ steps.name.outputs.publish_result_artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit-sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.10.9'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.plan-artifact-name }}
          path: .three-workflow-release/plan
      - name: Download planned build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python eng/scripts/workflow_release_control.py download-publish-inputs \
            --plan .three-workflow-release/plan/release-plan.json \
            --publish-node-id "$RELEASE_PUBLISH_NODE_ID" \
            --run-id "$RELEASE_RUN_ID" \
            --attempt "$RELEASE_RUN_ATTEMPT" \
            --repository '${{ github.repository }}' \
            --build-results-dir .three-workflow-release/build-results \
            --bundles-dir .three-workflow-release/bundles
      - name: Materialize publish request
        run: |
          uv run python eng/scripts/workflow_release_control.py publish-request \
            --plan .three-workflow-release/plan/release-plan.json \
            --publish-node-id "$RELEASE_PUBLISH_NODE_ID" \
            --run-id "$RELEASE_RUN_ID" \
            --attempt "$RELEASE_RUN_ATTEMPT" \
            --build-results-dir .three-workflow-release/build-results \
            --bundles-dir .three-workflow-release/bundles \
            --out .three-workflow-release/publish-request.base.json
      - name: Prepare GitHub Release attestation subjects
        id: attest_subjects
        run: |
          uv run python eng/scripts/workflow_release_control.py prepare-attestation \
            --publish-request .three-workflow-release/publish-request.base.json \
            --checksums-out .three-workflow-release/attestation-subjects.txt \
            --artifact-ids-out .three-workflow-release/attestation-artifact-ids.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Attest GitHub Release assets
        if: ${{ inputs.permission-class == 'github-release' && steps.attest_subjects.outputs.needs_attestation == 'true' }}
        id: attest
        uses: actions/attest@v4
        with:
          subject-checksums: .three-workflow-release/attestation-subjects.txt
      - name: Attach attestation outputs
        if: ${{ inputs.permission-class == 'github-release' && steps.attest_subjects.outputs.needs_attestation == 'true' }}
        run: |
          uv run python eng/scripts/workflow_release_control.py attach-attestation \
            --publish-request .three-workflow-release/publish-request.base.json \
            --artifact-ids .three-workflow-release/attestation-artifact-ids.json \
            --attestation-id '${{ steps.attest.outputs.attestation-id }}' \
            --attestation-url '${{ steps.attest.outputs.attestation-url }}' \
            --bundle-path '${{ steps.attest.outputs.bundle-path }}' \
            --storage-record-ids '${{ steps.attest.outputs.storage-record-ids }}' \
            --out .three-workflow-release/publish-request.json
      - name: Finalize non-attested publish request
        if: ${{ inputs.permission-class != 'github-release' || steps.attest_subjects.outputs.needs_attestation != 'true' }}
        run: cp .three-workflow-release/publish-request.base.json .three-workflow-release/publish-request.json
      - name: Execute publish node
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run three-workflow-release-publish publish \
            --repo-root . \
            --request .three-workflow-release/publish-request.json \
            --result-out .three-workflow-release/publish-result.json \
            --work-dir .three-workflow-release/publish-work
      - name: Compute publish result artifact name
        id: name
        run: |
          uv run python eng/scripts/workflow_release_control.py artifact-name \
            --kind publish-result \
            --run-id "$RELEASE_RUN_ID" \
            --attempt "$RELEASE_RUN_ATTEMPT" \
            --plan-id "$(jq -r '.plan-id' .three-workflow-release/publish-result.json)" \
            --publish-node-id "$RELEASE_PUBLISH_NODE_ID" \
            --output-name publish_result_artifact_name \
            --github-output "$GITHUB_OUTPUT"
      - name: Generate proof artifacts
        id: proofs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python eng/scripts/workflow_release_control.py generate-proofs \
            --plan .three-workflow-release/plan/release-plan.json \
            --publish-request .three-workflow-release/publish-request.json \
            --publish-result .three-workflow-release/publish-result.json \
            --publish-node-id "$RELEASE_PUBLISH_NODE_ID" \
            --run-id "$RELEASE_RUN_ID" \
            --attempt "$RELEASE_RUN_ATTEMPT" \
            --repository '${{ github.repository }}' \
            --workflow '${{ github.workflow }}' \
            --head-sha "$RELEASE_COMMIT_SHA" \
            --build-results-dir .three-workflow-release/build-results \
            --out-dir .three-workflow-release/proofs \
            --manifest-out .three-workflow-release/proof-manifest.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload proof staging
        if: ${{ steps.proofs.outputs.has_proofs == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: proof-staging-${{ steps.name.outputs.publish_result_artifact_name }}
          path: .three-workflow-release/proofs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.publish_result_artifact_name }}
          path: .three-workflow-release/publish-result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

