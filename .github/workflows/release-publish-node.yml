      - name: Generate proof artifacts
        id: proofs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python eng/scripts/workflow_release_control.py generate-proofs \
            --plan .three-workflow-release/plan/release-plan.json \
            --publish-request .three-workflow-release/publish-request.json \
            --publish-result .three-workflow-release/publish-result.json \
            --publish-node-id "$RELEASE_PUBLISH_NODE_ID" \
            --run-id "$RELEASE_RUN_ID" \
            --attempt "$RELEASE_RUN_ATTEMPT" \
            --repository '${{ github.repository }}' \
            --workflow '${{ github.workflow }}' \
            --head-sha "$RELEASE_COMMIT_SHA" \
            --build-results-dir .three-workflow-release/build-results \
            --out-dir .three-workflow-release/proofs \
            --manifest-out .three-workflow-release/proof-manifest.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload proof staging
        if: ${{ steps.proofs.outputs.has_proofs == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: proof-staging-${{ steps.name.outputs.publish_result_artifact_name }}
          path: .three-workflow-release/proofs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.publish_result_artifact_name }}
          path: .three-workflow-release/publish-result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

