        id: seal-prepare
        env:
          WDV3_PAYLOAD: .wdv3/prepare.zip
        run: |
          $hex = (Get-FileHash -LiteralPath $env:WDV3_PAYLOAD -Algorithm SHA256).Hash.ToLowerInvariant()
          $extension = [IO.Path]::GetExtension($env:WDV3_PAYLOAD)
          $name = "wdv3-nuget-fixtures-prepare-r${env:GITHUB_RUN_ID}-$hex$extension"
          New-Item -ItemType Directory -Path '.wdv3/upload' -Force | Out-Null
          $path = Join-Path '.wdv3/upload' $name
          Copy-Item -LiteralPath $env:WDV3_PAYLOAD -Destination $path
          @("name=$name", "digest=sha256:$hex", "path=$path") | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
      - name: Upload immutable prepare
        id: upload-prepare
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.seal-prepare.outputs.name }}
          path: ${{ steps.seal-prepare.outputs.path }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Archive available preparation diagnostics
        if: always()
        run: |
          Compress-Archive -Path '.wdv3/evidence/*' -DestinationPath '.wdv3/diagnostics.zip'
      - name: Retain immutable preparation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wdv3-nuget-fixtures-prepare-diagnostics-r${{ github.run_id }}
          path: .wdv3/diagnostics.zip
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
    outputs:
      prepare-name: ${{ steps.seal-prepare.outputs.name }}
      prepare-digest: ${{ steps.seal-prepare.outputs.digest }}
      prepare-id: ${{ steps.upload-prepare.outputs.artifact-id }}
      prepare-transport-digest: ${{ steps.upload-prepare.outputs.artifact-digest }}
      prepare-url: ${{ steps.upload-prepare.outputs.artifact-url }}
