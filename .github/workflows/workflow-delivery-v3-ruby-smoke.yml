name: Workflow Delivery v3 Ruby Release
'on':
  workflow_dispatch:
    inputs:
      destination:
        description: Selected Ruby destination
        type: choice
        required: true
        options:
          - github-packages
          - rubygems
      dry-run:
        description: Qualify and describe without publication
        type: boolean
        default: true
permissions: {}
concurrency:
  group:
    ${{ format('workflow-delivery-{0}-hcoona-release-smoke-ruby', inputs.destination == 'github-packages' && 'rubygems.pkg.github.com-hcoona'
    || 'rubygems.org') }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  DESTINATION: ${{ inputs.destination }}
  DRY_RUN: ${{ inputs.dry-run }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare selected runtime without product execution
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.8.10
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected native tools
        run: |
          set -Eeuo pipefail
          mise install --yes dotnet@10.0.401 ruby@4.0.7
          {
            printf 'RUBY_EXECUTABLE=%s\n' "$(mise which ruby@4.0.7)"
            printf 'GEM_EXECUTABLE=%s\n' "$(mise exec ruby@4.0.7 -- which gem)"
            printf 'DOTNET_EXECUTABLE=%s\n' "$(mise which dotnet@10.0.401)"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$(dirname "$(mise which dotnet@10.0.401)")" >> "$GITHUB_PATH"
        working-directory: ${{ runner.temp }}
      - name: Build complete control before product execution
        run: |-
          set -Eeuo pipefail
          mise exec --locked dotnet -- dotnet build src/private/app/workflow-delivery/WorkflowDelivery.csproj -p:RestoreLockedMode=true -o "$RUNNER_TEMP/control"
          cp src/private/app/workflow-delivery/Native/Ruby/{facts.rb,source.rb,consumer.rb} "$RUNNER_TEMP/control/"
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs ruby request
      - name: Retain actual control results
        id: control
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ruby-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control
          if-no-files-found: error
          retention-days: 45
          overwrite: false
      - name: Qualify complete selected native original
        run: |-
          set -Eeuo pipefail
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release prepare-ruby "$RUNNER_TEMP/prepared/request.json" > "$RUNNER_TEMP/prepared/preparation.json"
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs ruby originals
      - name: Retain actual prepared results
        id: retain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ruby-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          retention-days: 45
          overwrite: false
    outputs:
      control-id: ${{ steps.control.outputs.artifact-id }}
      preparation-id: ${{ steps.retain.outputs.artifact-id }}
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Download control by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.control-id }}
          path: ${{ runner.temp }}/control
          digest-mismatch: error
      - name: Download prepared by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.preparation-id }}
          path: ${{ runner.temp }}/prepared
          digest-mismatch: error
      - name: Prepare selected runtime without product execution
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.8.10
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected native tools
        run: |
          set -Eeuo pipefail
          mise install --yes dotnet@10.0.401 ruby@4.0.7
          {
            printf 'RUBY_EXECUTABLE=%s\n' "$(mise which ruby@4.0.7)"
            printf 'GEM_EXECUTABLE=%s\n' "$(mise exec ruby@4.0.7 -- which gem)"
            printf 'DOTNET_EXECUTABLE=%s\n' "$(mise which dotnet@10.0.401)"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$(dirname "$(mise which dotnet@10.0.401)")" >> "$GITHUB_PATH"
        working-directory: ${{ runner.temp }}
      - name: Receive transferred preparation
        run: |-
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs ruby receive observation
      - name: Observe selected native destination and qualified original
        run: |-
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs ruby source-config initial-observation-scratch
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release observe-ruby "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/source-tools.json" > "$RUNNER_TEMP/observation/observation.json"
      - name: Expose required write and describe dry run
        run: |-
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs ruby state
          if [ "$DRY_RUN" = true ]; then
            mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release describe-ruby "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/observation/observation.json" > "$RUNNER_TEMP/observation/dry-run.json"
            cat "$RUNNER_TEMP/observation/dry-run.json" >> "$GITHUB_STEP_SUMMARY"
          fi
        id: state
      - name: Retain actual observation results
        id: retain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ruby-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observation
          if-no-files-found: error
          retention-days: 45
          overwrite: false
    needs: prepare
    env:
      GITHUB_TOKEN: ${{ github.token }}
    outputs:
      write-needed: ${{ steps.state.outputs.write-needed }}
      observation-id: ${{ steps.retain.outputs.artifact-id }}
  publish-ruby-github-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download control by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.control-id }}
          path: ${{ runner.temp }}/control
          digest-mismatch: error
      - name: Download prepared by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.preparation-id }}
          path: ${{ runner.temp }}/prepared
          digest-mismatch: error
      - name: Download observation by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.observe.outputs.observation-id }}
          path: ${{ runner.temp }}/observation
          digest-mismatch: error
      - name: Prepare selected runtime without product execution
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.8.10
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected native tools
        run: |
          set -Eeuo pipefail
          mise install --yes dotnet@10.0.401 ruby@4.0.7
          {
            printf 'RUBY_EXECUTABLE=%s\n' "$(mise which ruby@4.0.7)"
            printf 'GEM_EXECUTABLE=%s\n' "$(mise exec ruby@4.0.7 -- which gem)"
            printf 'DOTNET_EXECUTABLE=%s\n' "$(mise which dotnet@10.0.401)"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$(dirname "$(mise which dotnet@10.0.401)")" >> "$GITHUB_PATH"
        working-directory: ${{ runner.temp }}
      - name: Receive transferred preparation
        run: |-
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs ruby receive publication
      - name: Refresh state and invoke native RubyGems once
        run: |-
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs ruby source-config publication-observation-scratch
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs ruby publisher-config publisher-scratch
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release publish-ruby "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/observation/observation.json" "$RUNNER_TEMP/source-tools.json" "$RUNNER_TEMP/publisher-tools.json" > "$RUNNER_TEMP/publication/publication.json"
      - name: Retain actual publication results
        id: retain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ruby-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
          if-no-files-found: error
          retention-days: 45
          overwrite: false
    needs:
      - prepare
      - observe
    if: inputs.dry-run == false && needs.observe.outputs.write-needed == 'true' && inputs.destination == 'github-packages'
    environment:
      name: workflow-delivery-v3-ruby-github-packages
    env:
      GITHUB_TOKEN: ${{ github.token }}
    outputs:
      publication-id: ${{ steps.retain.outputs.artifact-id }}
  publish-ruby-rubygems:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download control by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.control-id }}
          path: ${{ runner.temp }}/control
          digest-mismatch: error
      - name: Download prepared by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.preparation-id }}
          path: ${{ runner.temp }}/prepared
          digest-mismatch: error
      - name: Download observation by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.observe.outputs.observation-id }}
          path: ${{ runner.temp }}/observation
          digest-mismatch: error
      - name: Prepare selected runtime without product execution
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.8.10
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected native tools
        run: |
          set -Eeuo pipefail
          mise install --yes dotnet@10.0.401 ruby@4.0.7
          {
            printf 'RUBY_EXECUTABLE=%s\n' "$(mise which ruby@4.0.7)"
            printf 'GEM_EXECUTABLE=%s\n' "$(mise exec ruby@4.0.7 -- which gem)"
            printf 'DOTNET_EXECUTABLE=%s\n' "$(mise which dotnet@10.0.401)"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$(dirname "$(mise which dotnet@10.0.401)")" >> "$GITHUB_PATH"
        working-directory: ${{ runner.temp }}
      - name: Receive transferred preparation
        run: |-
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs ruby receive publication
      - name: Prepare owned unretained credential Action state
        run: |-
          set -Eeuo pipefail
          mkdir "$RUNNER_TEMP/ruby-credential-home"
      - name: Acquire native RubyGems trusted-publisher credential
        uses: rubygems/configure-rubygems-credentials@8674aee7f9f9055a8b771794d6f1e66b5fad36a9
        env:
          HOME: ${{ runner.temp }}/ruby-credential-home
        with:
          gem-server: https://rubygems.org
          audience: rubygems.org
          trusted-publisher: true
      - name: Refresh state and invoke native RubyGems once
        run: |-
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs ruby source-config publication-observation-scratch
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs ruby publisher-config publisher-scratch
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release publish-ruby "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/observation/observation.json" "$RUNNER_TEMP/source-tools.json" "$RUNNER_TEMP/publisher-tools.json" > "$RUNNER_TEMP/publication/publication.json"
      - name: Retain actual publication results
        id: retain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ruby-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
          if-no-files-found: error
          retention-days: 45
          overwrite: false
      - name: Clean only owned credential Action state
        run: |-
          set -Eeuo pipefail
          if [ -d "$RUNNER_TEMP/ruby-credential-home" ]; then
            rm -rf -- "$RUNNER_TEMP/ruby-credential-home"
          fi
        if: always()
    needs:
      - prepare
      - observe
    if: inputs.dry-run == false && needs.observe.outputs.write-needed == 'true' && inputs.destination == 'rubygems'
    environment:
      name: workflow-delivery-v3-ruby-rubygems
    env:
      GITHUB_TOKEN: ${{ github.token }}
    outputs:
      publication-id: ${{ steps.retain.outputs.artifact-id }}
  verify-result:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - name: Download control by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.control-id }}
          path: ${{ runner.temp }}/control
          digest-mismatch: error
      - name: Download prepared by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.preparation-id }}
          path: ${{ runner.temp }}/prepared
          digest-mismatch: error
      - name: Download observation by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.observe.outputs.observation-id }}
          path: ${{ runner.temp }}/observation
          digest-mismatch: error
      - name: Prepare selected runtime without product execution
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.8.10
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected native tools
        run: |
          set -Eeuo pipefail
          mise install --yes dotnet@10.0.401 ruby@4.0.7
          {
            printf 'RUBY_EXECUTABLE=%s\n' "$(mise which ruby@4.0.7)"
            printf 'GEM_EXECUTABLE=%s\n' "$(mise exec ruby@4.0.7 -- which gem)"
            printf 'DOTNET_EXECUTABLE=%s\n' "$(mise which dotnet@10.0.401)"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$(dirname "$(mise which dotnet@10.0.401)")" >> "$GITHUB_PATH"
        working-directory: ${{ runner.temp }}
      - name: Receive transferred preparation
        run: |-
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs ruby receive verification
      - name: Download publication by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids:
            ${{ needs.publish-ruby-github-packages.outputs.publication-id || needs.publish-ruby-rubygems.outputs.publication-id
            }}
          path: ${{ runner.temp }}/publication
          digest-mismatch: error
        if:
          needs.publish-ruby-github-packages.outputs.publication-id != '' || needs.publish-ruby-rubygems.outputs.publication-id
          != ''
      - name: Consume fresh selected remote original and complete final native state
        run: |-
          set -Eeuo pipefail
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs ruby consumer-config remote-consumer-scratch
          status=0
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release consume-ruby "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/consumer-tools.json" > "$RUNNER_TEMP/verification/consumer.json" || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          "$DOTNET_EXECUTABLE" "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs ruby source-config final-observation-scratch
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release observe-ruby "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/source-tools.json" > "$RUNNER_TEMP/verification/final.json" || true
          publication=-
          if [ -s "$RUNNER_TEMP/publication/publication.json" ]; then publication="$RUNNER_TEMP/publication/publication.json"; fi
          mise exec dotnet@10.0.401 -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release complete-ruby "$RUNNER_TEMP/prepared/preparation.json" "$RUNNER_TEMP/observation/observation.json" "$RUNNER_TEMP/verification/final.json" "$RUNNER_TEMP/verification/consumer.json" "$publication" > "$RUNNER_TEMP/verification/outcome.json"
      - name: Show actual available business result
        run: |-
          set -Eeuo pipefail
          if [ -s "$RUNNER_TEMP/verification/outcome.json" ]; then
            cat "$RUNNER_TEMP/verification/outcome.json" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Required Ruby completion result is unavailable.' >> "$GITHUB_STEP_SUMMARY"
          fi
        if: always()
      - name: Retain actual verification results
        id: retain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ruby-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
          retention-days: 45
          overwrite: false
    needs:
      - prepare
      - observe
      - publish-ruby-github-packages
      - publish-ruby-rubygems
    env:
      GITHUB_TOKEN: ${{ github.token }}
    if:
      always() && !cancelled() && inputs.dry-run == false && needs.prepare.result == 'success' && needs.observe.result ==
      'success'
