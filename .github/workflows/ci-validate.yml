      - normalize-input
      - plan
      - materialize-work-groups
      - validation-work-groups-layer-0
      - validation-work-groups-layer-1
      - validation-work-groups-layer-2
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.10.9'
      - name: Download validation plan
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.normalize-input.outputs.plan-artifact-name }}
          path: .three-ci-validation/plan
      - name: Download selector assignments
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.normalize-input.outputs.selector-assignments-artifact-name }}
          path: .three-ci-validation/materialize
      - name: Download changed-files snapshot
        if: ${{ needs.plan.outputs.changed-files-snapshot-artifact-id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.normalize-input.outputs.changed-files-snapshot-artifact-name }}
          path: .three-ci-validation/plan
      - name: Download fact snapshot
        if: ${{ needs.plan.outputs.fact-snapshot-artifact-id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.normalize-input.outputs.fact-snapshot-artifact-name }}
          path: .three-ci-validation/plan
      - name: Download observed validation artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p .three-ci-validation/observed-artifacts
          uv run python eng/scripts/workflow_release_control.py download-ci-validation-observed-artifacts \
            --repository "$CI_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --assignments .three-ci-validation/materialize/selector-assignments.json \
            --observed-artifacts-dir .three-ci-validation/observed-artifacts
      - name: Aggregate validation evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          REQUEST_ARTIFACT_ID: ${{ needs.normalize-input.outputs.request-artifact-id }}
          PLAN_ARTIFACT_ID: ${{ needs.plan.outputs.plan-artifact-id }}
          CHANGED_FILES_ARTIFACT_ID: ${{ needs.plan.outputs.changed-files-snapshot-artifact-id }}
          FACT_SNAPSHOT_ARTIFACT_ID: ${{ needs.plan.outputs.fact-snapshot-artifact-id }}
          ASSIGNMENTS_ARTIFACT_ID: ${{ needs.materialize-work-groups.outputs.selector-assignments-artifact-id }}
        run: |
          mkdir -p .three-ci-validation/aggregate
          aggregate_args=(
            --repository "$CI_REPOSITORY"
            --workflow "CI Validation"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
            --plan .three-ci-validation/plan/validation-plan.json
            --changed-files-snapshot .three-ci-validation/plan/changed-files.json
            --fact-snapshot .three-ci-validation/plan/fact-snapshot.json
            --assignments .three-ci-validation/materialize/selector-assignments.json
            --observed-artifacts-dir .three-ci-validation/observed-artifacts
            --expected-request-artifact-id "$REQUEST_ARTIFACT_ID"
            --expected-plan-artifact-id "$PLAN_ARTIFACT_ID"
            --expected-selector-assignments-artifact-id "$ASSIGNMENTS_ARTIFACT_ID"
            --receipt-manifest-out .three-ci-validation/aggregate/receipt-manifest.json
            --aggregate-out .three-ci-validation/aggregate/ci-validation-aggregate.json
          )
          if [ -n "$CHANGED_FILES_ARTIFACT_ID" ]; then
            aggregate_args+=(--expected-changed-files-snapshot-artifact-id "$CHANGED_FILES_ARTIFACT_ID")
          fi
          if [ -n "$FACT_SNAPSHOT_ARTIFACT_ID" ]; then
            aggregate_args+=(--expected-fact-snapshot-artifact-id "$FACT_SNAPSHOT_ARTIFACT_ID")
          fi
          uv run python eng/scripts/workflow_release_control.py aggregate-ci-evidence "${aggregate_args[@]}"
      - name: Upload receipt manifest
        if: always()
        id: upload-receipt-manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.normalize-input.outputs.receipt-manifest-artifact-name }}
          path: .three-ci-validation/aggregate/receipt-manifest.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload aggregate evidence
        if: always()
        id: upload-aggregate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.normalize-input.outputs.aggregate-artifact-name }}
          path: .three-ci-validation/aggregate/ci-validation-aggregate.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify final artifact producer boundaries
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_REF: ci-validation/manifests/${{ github.run_id }}/${{ github.run_attempt }}/receipt-manifest.json
          AGGREGATE_REF: ci-validation/aggregate/${{ github.run_id }}/${{ github.run_attempt }}/ci-validation-aggregate.json
          MANIFEST_ARTIFACT_ID: ${{ steps.upload-receipt-manifest.outputs.artifact-id }}
          AGGREGATE_ARTIFACT_ID: ${{ steps.upload-aggregate.outputs.artifact-id }}
        run: |
          uv run python eng/scripts/workflow_release_control.py verify-ci-validation-artifact-boundaries \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "CI Validation" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-artifact "{\"artifact-ref\":\"${MANIFEST_REF}\",\"artifact-instance-id\":\"${MANIFEST_ARTIFACT_ID}\",\"producer-boundary\":\"aggregate-evidence\",\"producer-job\":\"aggregate-evidence\"}" \
            --expected-artifact "{\"artifact-ref\":\"${AGGREGATE_REF}\",\"artifact-instance-id\":\"${AGGREGATE_ARTIFACT_ID}\",\"producer-boundary\":\"aggregate-evidence\",\"producer-job\":\"aggregate-evidence\"}"
