name: Workflow Delivery v3 NuGet Buddy
'on':
  workflow_dispatch:
    inputs:
      dry-run:
        description: Qualify and describe without publication
        type: boolean
        default: true
permissions:
  contents: read
  packages: write
concurrency:
  group: workflow-delivery-nuget.pkg.github.com-hcoona-hcoona.releasesmoke.githubpackages
  cancel-in-progress: false
jobs:
  release:
    uses: ./.github/workflows/workflow-delivery-v3-nuget-live-attempt.yml
    with:
      target-sha: ${{ github.sha }}
      selected-ref: ${{ github.ref }}
      dry-run: ${{ inputs.dry-run }}
