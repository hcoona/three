          path: .wdv3/${{ steps.names.outputs.install-evidence-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  qualification-finalizer:
    name: Finalize exact four-obligation qualification
    if: always() && github.run_attempt == 1 && needs.build-tarball.result != 'skipped'
    needs: [build-tarball, project-test, npm-artifact-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      decision-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      decision-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      decision-artifact-url: ${{ steps.upload.outputs.artifact-url }}
      decision-artifact-name: ${{ steps.finalize.outputs.qualification-decision-artifact-name }}
      decision-digest: ${{ steps.finalize.outputs.qualification-decision-digest }}
      qualification-result: ${{ steps.finalize.outputs.qualification-result }}
      build-evidence-artifact-id: ${{ needs.build-tarball.outputs.build-evidence-artifact-id }}
      build-evidence-artifact-digest: ${{ needs.build-tarball.outputs.build-evidence-artifact-digest }}
      build-evidence-artifact-name: ${{ needs.build-tarball.outputs.build-evidence-artifact-name }}
      build-evidence-digest: ${{ needs.build-tarball.outputs.build-evidence-digest }}
      project-test-evidence-artifact-id: ${{ needs.project-test.outputs.evidence-artifact-id }}
      project-test-evidence-artifact-digest: ${{ needs.project-test.outputs.evidence-artifact-digest }}
      project-test-evidence-artifact-name: ${{ needs.project-test.outputs.evidence-artifact-name }}
      project-test-evidence-digest: ${{ needs.project-test.outputs.evidence-digest }}
      artifact-contents-evidence-artifact-id: ${{ needs.npm-artifact-qualification.outputs.contents-evidence-artifact-id }}
      artifact-contents-evidence-artifact-digest: ${{ needs.npm-artifact-qualification.outputs.contents-evidence-artifact-digest }}
      artifact-contents-evidence-artifact-name: ${{ needs.npm-artifact-qualification.outputs.contents-evidence-artifact-name }}
      artifact-contents-evidence-digest: ${{ needs.npm-artifact-qualification.outputs.contents-evidence-digest }}
      install-import-evidence-artifact-id: ${{ needs.npm-artifact-qualification.outputs.install-evidence-artifact-id }}
      install-import-evidence-artifact-digest: ${{ needs.npm-artifact-qualification.outputs.install-evidence-artifact-digest }}
      install-import-evidence-artifact-name: ${{ needs.npm-artifact-qualification.outputs.install-evidence-artifact-name }}
      install-import-evidence-digest: ${{ needs.npm-artifact-qualification.outputs.install-evidence-digest }}
      qualification-snapshot-artifact-id: ${{ needs.build-tarball.outputs.qualification-snapshot-artifact-id }}
      qualification-snapshot-artifact-digest: ${{ needs.build-tarball.outputs.qualification-snapshot-artifact-digest }}
      qualification-snapshot-artifact-name: ${{ needs.build-tarball.outputs.qualification-snapshot-artifact-name }}
      qualification-snapshot-digest: ${{ needs.build-tarball.outputs.qualification-snapshot-digest }}
      adapter-context-artifact-id: ${{ needs.build-tarball.outputs.adapter-context-artifact-id }}
      adapter-context-artifact-digest: ${{ needs.build-tarball.outputs.adapter-context-artifact-digest }}
      adapter-context-artifact-name: ${{ needs.build-tarball.outputs.adapter-context-artifact-name }}
      adapter-context-digest: ${{ needs.build-tarball.outputs.adapter-context-digest }}
      release-artifact-artifact-id: ${{ needs.build-tarball.outputs.release-artifact-artifact-id }}
      release-artifact-artifact-digest: ${{ needs.build-tarball.outputs.release-artifact-artifact-digest }}
      release-artifact-artifact-name: ${{ needs.build-tarball.outputs.release-artifact-artifact-name }}
      release-artifact-digest: ${{ needs.build-tarball.outputs.release-artifact-digest }}
      tarball-artifact-id: ${{ needs.build-tarball.outputs.tarball-artifact-id }}
      tarball-artifact-digest: ${{ needs.build-tarball.outputs.tarball-artifact-digest }}
      tarball-artifact-name: ${{ needs.build-tarball.outputs.tarball-artifact-name }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
      - name: Download Qualification Snapshot by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-tarball.outputs.qualification-snapshot-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download build Evidence by artifact ID
        if: needs.build-tarball.outputs.build-evidence-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-tarball.outputs.build-evidence-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download project-test Evidence by artifact ID
        if: needs.project-test.outputs.evidence-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.project-test.outputs.evidence-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download artifact-contents Evidence by artifact ID
        if: needs.npm-artifact-qualification.outputs.contents-evidence-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.npm-artifact-qualification.outputs.contents-evidence-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download install-import Evidence by artifact ID
        if: needs.npm-artifact-qualification.outputs.install-evidence-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.npm-artifact-qualification.outputs.install-evidence-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Release Artifact record by artifact ID
        if: needs.build-tarball.outputs.release-artifact-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-tarball.outputs.release-artifact-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Close qualification Decision
        id: finalize
        if: always()
        env:
          BUILD_ID: ${{ needs.build-tarball.outputs.build-evidence-artifact-id }}
          BUILD_DIGEST: ${{ needs.build-tarball.outputs.build-evidence-digest }}
          BUILD_UPLOAD: ${{ needs.build-tarball.outputs.build-evidence-artifact-digest }}
          TEST_ID: ${{ needs.project-test.outputs.evidence-artifact-id }}
          TEST_DIGEST: ${{ needs.project-test.outputs.evidence-digest }}
          TEST_UPLOAD: ${{ needs.project-test.outputs.evidence-artifact-digest }}
          CONTENTS_ID: ${{ needs.npm-artifact-qualification.outputs.contents-evidence-artifact-id }}
          CONTENTS_DIGEST: ${{ needs.npm-artifact-qualification.outputs.contents-evidence-digest }}
          CONTENTS_UPLOAD: ${{ needs.npm-artifact-qualification.outputs.contents-evidence-artifact-digest }}
          INSTALL_ID: ${{ needs.npm-artifact-qualification.outputs.install-evidence-artifact-id }}
          INSTALL_DIGEST: ${{ needs.npm-artifact-qualification.outputs.install-evidence-digest }}
          INSTALL_UPLOAD: ${{ needs.npm-artifact-qualification.outputs.install-evidence-artifact-digest }}
          ARTIFACT_ID: ${{ needs.build-tarball.outputs.release-artifact-artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.build-tarball.outputs.release-artifact-digest }}
          ARTIFACT_UPLOAD: ${{ needs.build-tarball.outputs.release-artifact-artifact-digest }}
        run: |
          args=()
          add_record() {
            local role="$1" path="$2" digest="$3" id="$4" upload="$5"
            if [[ -z "${id}" ]]; then
              return 0
            fi
            if [[ -z "${digest}" || -z "${upload}" ]]; then
              echo "::error::${role} has artifact ID but missing digest metadata" >&2
              exit 1
            fi
            if [[ ! -f "${path}" ]]; then
              echo "::error::${role} artifact ID ${id} was present but ${path} was not downloaded" >&2
              exit 1
            fi
            args+=(
              "--${role}" "${path}"
              "--${role}-digest" "${digest}"
              "--${role}-artifact-id" "${id}"
              "--${role}-artifact-digest" "${upload}"
            )
          }
          add_record build-evidence ".wdv3/input/${{ needs.build-tarball.outputs.build-evidence-artifact-name }}" "${BUILD_DIGEST}" "${BUILD_ID}" "${BUILD_UPLOAD}"
          add_record project-test-evidence ".wdv3/input/${{ needs.project-test.outputs.evidence-artifact-name }}" "${TEST_DIGEST}" "${TEST_ID}" "${TEST_UPLOAD}"
          add_record artifact-contents-evidence ".wdv3/input/${{ needs.npm-artifact-qualification.outputs.contents-evidence-artifact-name }}" "${CONTENTS_DIGEST}" "${CONTENTS_ID}" "${CONTENTS_UPLOAD}"
          add_record install-import-evidence ".wdv3/input/${{ needs.npm-artifact-qualification.outputs.install-evidence-artifact-name }}" "${INSTALL_DIGEST}" "${INSTALL_ID}" "${INSTALL_UPLOAD}"
          add_record release-artifact ".wdv3/input/${{ needs.build-tarball.outputs.release-artifact-artifact-name }}" "${ARTIFACT_DIGEST}" "${ARTIFACT_ID}" "${ARTIFACT_UPLOAD}"
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release finalize-qualification \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --purpose "${WDV3_PURPOSE}" \
            --qualification-snapshot ".wdv3/input/${{ needs.build-tarball.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.build-tarball.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.build-tarball.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.build-tarball.outputs.qualification-snapshot-artifact-digest }}" \
            "${args[@]}" \
            --output .wdv3/qualification-decision.json \
            --github-output "${GITHUB_OUTPUT}"
          digest="$(sha256sum .wdv3/qualification-decision.json | cut -d' ' -f1)"
          artifact_name="wdv3-live-buddy-qualification-decision-r${GITHUB_RUN_ID}-${digest}.json"
          mv .wdv3/qualification-decision.json ".wdv3/${artifact_name}"
          echo "qualification-decision-artifact-name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload Qualification Decision
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.finalize.outputs.qualification-decision-artifact-name }}
          path: .wdv3/${{ steps.finalize.outputs.qualification-decision-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  observe-github-packages:
    name: Observe GitHub Packages destination
    if: github.run_attempt == 1 && needs.qualification-finalizer.outputs.qualification-result == 'success'
    needs: [admit, qualification-finalizer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      qualification-snapshot-artifact-id: ${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-id }}
      qualification-snapshot-artifact-digest: ${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-digest }}
      qualification-snapshot-artifact-name: ${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-name }}
      qualification-snapshot-digest: ${{ needs.qualification-finalizer.outputs.qualification-snapshot-digest }}
      adapter-context-artifact-id: ${{ needs.qualification-finalizer.outputs.adapter-context-artifact-id }}
      adapter-context-artifact-digest: ${{ needs.qualification-finalizer.outputs.adapter-context-artifact-digest }}
      adapter-context-artifact-name: ${{ needs.qualification-finalizer.outputs.adapter-context-artifact-name }}
      adapter-context-digest: ${{ needs.qualification-finalizer.outputs.adapter-context-digest }}
      release-artifact-artifact-id: ${{ needs.qualification-finalizer.outputs.release-artifact-artifact-id }}
      release-artifact-artifact-digest: ${{ needs.qualification-finalizer.outputs.release-artifact-artifact-digest }}
      release-artifact-artifact-name: ${{ needs.qualification-finalizer.outputs.release-artifact-artifact-name }}
      release-artifact-digest: ${{ needs.qualification-finalizer.outputs.release-artifact-digest }}
      decision-artifact-id: ${{ needs.qualification-finalizer.outputs.decision-artifact-id }}
      decision-artifact-digest: ${{ needs.qualification-finalizer.outputs.decision-artifact-digest }}
      decision-artifact-url: ${{ needs.qualification-finalizer.outputs.decision-artifact-url }}
      decision-artifact-name: ${{ needs.qualification-finalizer.outputs.decision-artifact-name }}
      decision-digest: ${{ needs.qualification-finalizer.outputs.decision-digest }}
      observation-set-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      observation-set-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      observation-set-artifact-url: ${{ steps.upload.outputs.artifact-url }}
      observation-set-artifact-name: ${{ steps.observe.outputs.observation-set-artifact-name }}
      observation-set-digest: ${{ steps.observe.outputs.observation-digest }}
      tarball-artifact-id: ${{ needs.qualification-finalizer.outputs.tarball-artifact-id }}
      tarball-artifact-digest: ${{ needs.qualification-finalizer.outputs.tarball-artifact-digest }}
      tarball-artifact-name: ${{ needs.qualification-finalizer.outputs.tarball-artifact-name }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
      - name: Download Observation authority by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.intent-artifact-id }},${{ inputs.repository-model-artifact-id }},${{ inputs.live-eligibility-artifact-id }},${{ needs.admit.outputs.attempt-artifact-id }},${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: Download Qualification Decision by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.decision-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Adapter context by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.adapter-context-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Release Artifact record by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.release-artifact-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Observe exact GitHub Packages state
        id: observe
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release observe-github-packages \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --intent ".wdv3/input/${{ inputs.intent-artifact-name }}" \
            --intent-digest "${{ inputs.intent-digest }}" \
            --intent-artifact-id "${{ inputs.intent-artifact-id }}" \
            --intent-artifact-digest "${{ inputs.intent-artifact-digest }}" \
            --repository-model ".wdv3/input/${{ inputs.repository-model-artifact-name }}" \
            --repository-model-digest "${{ inputs.repository-model-digest }}" \
            --repository-model-artifact-id "${{ inputs.repository-model-artifact-id }}" \
            --repository-model-artifact-digest "${{ inputs.repository-model-artifact-digest }}" \
            --attempt-binding ".wdv3/input/${{ needs.admit.outputs.attempt-artifact-name }}" \
            --attempt-binding-digest "${{ needs.admit.outputs.attempt-digest }}" \
            --attempt-binding-artifact-id "${{ needs.admit.outputs.attempt-artifact-id }}" \
            --attempt-binding-artifact-digest "${{ needs.admit.outputs.attempt-artifact-digest }}" \
            --live-eligibility-decision ".wdv3/input/${{ inputs.live-eligibility-artifact-name }}" \
            --live-eligibility-artifact-id "${{ inputs.live-eligibility-artifact-id }}" \
            --live-eligibility-artifact-digest "${{ inputs.live-eligibility-artifact-digest }}" \
            --live-eligibility-payload-digest "${{ inputs.live-eligibility-digest }}" \
            --qualification-snapshot ".wdv3/input/${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.qualification-finalizer.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-digest }}" \
            --qualification-decision ".wdv3/input/${{ needs.qualification-finalizer.outputs.decision-artifact-name }}" \
            --qualification-decision-digest "${{ needs.qualification-finalizer.outputs.decision-digest }}" \
            --qualification-decision-artifact-id "${{ needs.qualification-finalizer.outputs.decision-artifact-id }}" \
            --qualification-decision-artifact-digest "${{ needs.qualification-finalizer.outputs.decision-artifact-digest }}" \
            --qualification-decision-artifact-url "${{ needs.qualification-finalizer.outputs.decision-artifact-url }}" \
            --qualification-decision-payload-path "${{ needs.qualification-finalizer.outputs.decision-artifact-name }}" \
            --adapter-context ".wdv3/input/${{ needs.qualification-finalizer.outputs.adapter-context-artifact-name }}" \
            --adapter-context-digest "${{ needs.qualification-finalizer.outputs.adapter-context-digest }}" \
            --adapter-context-artifact-id "${{ needs.qualification-finalizer.outputs.adapter-context-artifact-id }}" \
            --adapter-context-artifact-digest "${{ needs.qualification-finalizer.outputs.adapter-context-artifact-digest }}" \
            --release-artifact ".wdv3/input/${{ needs.qualification-finalizer.outputs.release-artifact-artifact-name }}" \
            --release-artifact-digest "${{ needs.qualification-finalizer.outputs.release-artifact-digest }}" \
            --release-artifact-artifact-id "${{ needs.qualification-finalizer.outputs.release-artifact-artifact-id }}" \
            --release-artifact-artifact-digest "${{ needs.qualification-finalizer.outputs.release-artifact-artifact-digest }}" \
            --github-token "${GITHUB_TOKEN}" \
            --output .wdv3/observation-set.json \
            --github-output "${GITHUB_OUTPUT}"
          observation_status=$?
          set -e
          echo "observation-status=${observation_status}" >> "${GITHUB_OUTPUT}"
          if [[ ! -f .wdv3/observation-set.json ]]; then
            if [[ "${observation_status}" -eq 0 ]]; then
              exit 1
            fi
            exit "${observation_status}"
          fi
          digest="$(sha256sum .wdv3/observation-set.json | cut -d' ' -f1)"
          artifact_name="wdv3-live-buddy-observation-set-r${GITHUB_RUN_ID}-${digest}.json"
          mv .wdv3/observation-set.json ".wdv3/${artifact_name}"
          echo "observation-set-artifact-name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          exit "${observation_status}"
      - name: Upload Observation Record set
        id: upload
        if: always() && steps.observe.outputs.observation-set-artifact-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.observe.outputs.observation-set-artifact-name }}
          path: .wdv3/${{ steps.observe.outputs.observation-set-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Propagate observation status
        if: always()
        run: |
          if [[ "${{ steps.observe.outcome }}" != "success" || "${{ steps.upload.outcome }}" != "success" || "${{ steps.observe.outputs.observation-status }}" != "0" ]]; then
            exit 1
          fi

  materialize-publication:
    name: Materialize publication Snapshot and reviewer summary
    if: github.run_attempt == 1
    needs: [admit, observe-github-packages]
    runs-on: ubuntu-24.04
