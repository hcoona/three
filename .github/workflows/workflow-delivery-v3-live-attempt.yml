      qualification-snapshot-artifact-digest: ${{ needs.observe-github-packages.outputs.qualification-snapshot-artifact-digest }}
      qualification-snapshot-artifact-name: ${{ needs.observe-github-packages.outputs.qualification-snapshot-artifact-name }}
      qualification-snapshot-digest: ${{ needs.observe-github-packages.outputs.qualification-snapshot-digest }}
      decision-artifact-id: ${{ needs.observe-github-packages.outputs.decision-artifact-id }}
      decision-artifact-digest: ${{ needs.observe-github-packages.outputs.decision-artifact-digest }}
      decision-artifact-url: ${{ needs.observe-github-packages.outputs.decision-artifact-url }}
      decision-artifact-name: ${{ needs.observe-github-packages.outputs.decision-artifact-name }}
      decision-digest: ${{ needs.observe-github-packages.outputs.decision-digest }}
      observation-artifact-id: ${{ needs.observe-github-packages.outputs.observation-set-artifact-id }}
      observation-artifact-digest: ${{ needs.observe-github-packages.outputs.observation-set-artifact-digest }}
      observation-artifact-name: ${{ needs.observe-github-packages.outputs.observation-set-artifact-name }}
      observation-digest: ${{ needs.observe-github-packages.outputs.observation-set-digest }}
      release-artifact-artifact-id: ${{ needs.observe-github-packages.outputs.release-artifact-artifact-id }}
      release-artifact-artifact-digest: ${{ needs.observe-github-packages.outputs.release-artifact-artifact-digest }}
      release-artifact-artifact-name: ${{ needs.observe-github-packages.outputs.release-artifact-artifact-name }}
      release-artifact-digest: ${{ needs.observe-github-packages.outputs.release-artifact-digest }}
      adapter-context-artifact-id: ${{ needs.observe-github-packages.outputs.adapter-context-artifact-id }}
      adapter-context-artifact-digest: ${{ needs.observe-github-packages.outputs.adapter-context-artifact-digest }}
      adapter-context-artifact-name: ${{ needs.observe-github-packages.outputs.adapter-context-artifact-name }}
      adapter-context-digest: ${{ needs.observe-github-packages.outputs.adapter-context-digest }}
      tarball-artifact-id: ${{ needs.observe-github-packages.outputs.tarball-artifact-id }}
      tarball-artifact-digest: ${{ needs.observe-github-packages.outputs.tarball-artifact-digest }}
      tarball-artifact-name: ${{ needs.observe-github-packages.outputs.tarball-artifact-name }}
      publication-snapshot-artifact-id: ${{ steps.upload-snapshot.outputs.artifact-id }}
      publication-snapshot-artifact-digest: ${{ steps.upload-snapshot.outputs.artifact-digest }}
      publication-snapshot-artifact-url: ${{ steps.upload-snapshot.outputs.artifact-url }}
      publication-snapshot-artifact-name: ${{ steps.names.outputs.publication-snapshot-name }}
      publication-snapshot-digest: ${{ steps.materialize.outputs.publication-snapshot-digest }}
      reviewer-artifact-id: ${{ steps.upload-reviewer.outputs.artifact-id }}
      reviewer-artifact-digest: ${{ steps.upload-reviewer.outputs.artifact-digest }}
      reviewer-artifact-url: ${{ steps.upload-reviewer.outputs.artifact-url }}
      reviewer-digest: ${{ steps.materialize.outputs.reviewer-digest }}
      approval-bundle-artifact-id: ${{ steps.upload-bundle.outputs.artifact-id }}
      approval-bundle-artifact-digest: ${{ steps.upload-bundle.outputs.artifact-digest }}
      approval-bundle-artifact-url: ${{ steps.upload-bundle.outputs.artifact-url }}
      approval-bundle-artifact-name: ${{ steps.form-bundle.outputs.approval-bundle-artifact-name }}
      approval-bundle-digest: ${{ steps.form-bundle.outputs.approval-bundle-digest }}
      publish-required: ${{ steps.materialize.outputs.publish-required }}
      resource-concurrency-key: ${{ steps.materialize.outputs.resource-concurrency-key }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
      - name: Download Intent Model and Eligibility by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.intent-artifact-id }},${{ inputs.repository-model-artifact-id }},${{ inputs.live-eligibility-artifact-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: Download Release Attempt binding by artifact ID
