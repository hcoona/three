      - name: Materialize exact publication basenames
        id: names
        run: |
          snapshot_digest="${{ steps.materialize.outputs.publication-snapshot-digest }}"
          snapshot_name="wdv3-live-buddy-publication-snapshot-r${GITHUB_RUN_ID}-${snapshot_digest#sha256:}.json"
          mv .wdv3/publication-snapshot.json ".wdv3/${snapshot_name}"
