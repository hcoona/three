          name: ${{ steps.prove.outputs.exact-satisfied-finalization-proof-artifact-name }}
          path: .wdv3/${{ steps.prove.outputs.exact-satisfied-finalization-proof-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
