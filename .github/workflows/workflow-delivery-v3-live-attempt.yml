            --capability-decision-artifact-digest "${{ needs.approval-finalizer.outputs.capability-decision-artifact-digest }}" \
            --tarball ".wdv3/input/${{ needs.approval-finalizer.outputs.tarball-artifact-name }}" \
            --github-token "${GITHUB_TOKEN}" \
            --preflight-output .wdv3/publication-preflight.json \
