        with:
          name: ${{ steps.names.outputs.contents-evidence-name }}
          path: .wdv3/${{ steps.names.outputs.contents-evidence-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Upload install-import Evidence
        id: upload-install
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.names.outputs.install-evidence-name }}
          path: .wdv3/${{ steps.names.outputs.install-evidence-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  qualification-finalizer:
    name: Finalize exact four-obligation qualification
    if: always() && github.run_attempt == 1 && needs.build-tarball.result != 'skipped'
    needs: [build-tarball, project-test, npm-artifact-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      decision-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      decision-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      decision-artifact-name: ${{ steps.finalize.outputs.qualification-decision-artifact-name }}
      decision-digest: ${{ steps.finalize.outputs.qualification-decision-digest }}
      qualification-result: ${{ steps.finalize.outputs.qualification-result }}
      build-evidence-artifact-id: ${{ needs.build-tarball.outputs.build-evidence-artifact-id }}
      build-evidence-artifact-digest: ${{ needs.build-tarball.outputs.build-evidence-artifact-digest }}
      build-evidence-artifact-name: ${{ needs.build-tarball.outputs.build-evidence-artifact-name }}
      build-evidence-digest: ${{ needs.build-tarball.outputs.build-evidence-digest }}
      project-test-evidence-artifact-id: ${{ needs.project-test.outputs.evidence-artifact-id }}
      project-test-evidence-artifact-digest: ${{ needs.project-test.outputs.evidence-artifact-digest }}
      project-test-evidence-artifact-name: ${{ needs.project-test.outputs.evidence-artifact-name }}
      project-test-evidence-digest: ${{ needs.project-test.outputs.evidence-digest }}
      artifact-contents-evidence-artifact-id: ${{ needs.npm-artifact-qualification.outputs.contents-evidence-artifact-id }}
      artifact-contents-evidence-artifact-digest: ${{ needs.npm-artifact-qualification.outputs.contents-evidence-artifact-digest }}
      artifact-contents-evidence-artifact-name: ${{ needs.npm-artifact-qualification.outputs.contents-evidence-artifact-name }}
      artifact-contents-evidence-digest: ${{ needs.npm-artifact-qualification.outputs.contents-evidence-digest }}
      install-import-evidence-artifact-id: ${{ needs.npm-artifact-qualification.outputs.install-evidence-artifact-id }}
      install-import-evidence-artifact-digest: ${{ needs.npm-artifact-qualification.outputs.install-evidence-artifact-digest }}
      install-import-evidence-artifact-name: ${{ needs.npm-artifact-qualification.outputs.install-evidence-artifact-name }}
      install-import-evidence-digest: ${{ needs.npm-artifact-qualification.outputs.install-evidence-digest }}
      qualification-snapshot-artifact-id: ${{ needs.build-tarball.outputs.qualification-snapshot-artifact-id }}
      qualification-snapshot-artifact-digest: ${{ needs.build-tarball.outputs.qualification-snapshot-artifact-digest }}
      qualification-snapshot-artifact-name: ${{ needs.build-tarball.outputs.qualification-snapshot-artifact-name }}
      qualification-snapshot-digest: ${{ needs.build-tarball.outputs.qualification-snapshot-digest }}
      adapter-context-artifact-id: ${{ needs.build-tarball.outputs.adapter-context-artifact-id }}
      adapter-context-artifact-digest: ${{ needs.build-tarball.outputs.adapter-context-artifact-digest }}
      adapter-context-artifact-name: ${{ needs.build-tarball.outputs.adapter-context-artifact-name }}
      adapter-context-digest: ${{ needs.build-tarball.outputs.adapter-context-digest }}
      release-artifact-artifact-id: ${{ needs.build-tarball.outputs.release-artifact-artifact-id }}
      release-artifact-artifact-digest: ${{ needs.build-tarball.outputs.release-artifact-artifact-digest }}
      release-artifact-artifact-name: ${{ needs.build-tarball.outputs.release-artifact-artifact-name }}
      release-artifact-digest: ${{ needs.build-tarball.outputs.release-artifact-digest }}
      tarball-artifact-id: ${{ needs.build-tarball.outputs.tarball-artifact-id }}
      tarball-artifact-digest: ${{ needs.build-tarball.outputs.tarball-artifact-digest }}
      tarball-artifact-name: ${{ needs.build-tarball.outputs.tarball-artifact-name }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
      - name: Download Qualification Snapshot by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-tarball.outputs.qualification-snapshot-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download build Evidence by artifact ID
        if: needs.build-tarball.outputs.build-evidence-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-tarball.outputs.build-evidence-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download project-test Evidence by artifact ID
        if: needs.project-test.outputs.evidence-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.project-test.outputs.evidence-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download artifact-contents Evidence by artifact ID
        if: needs.npm-artifact-qualification.outputs.contents-evidence-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.npm-artifact-qualification.outputs.contents-evidence-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download install-import Evidence by artifact ID
        if: needs.npm-artifact-qualification.outputs.install-evidence-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.npm-artifact-qualification.outputs.install-evidence-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Release Artifact record by artifact ID
        if: needs.build-tarball.outputs.release-artifact-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-tarball.outputs.release-artifact-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Close qualification Decision
        id: finalize
        if: always()
        env:
          BUILD_ID: ${{ needs.build-tarball.outputs.build-evidence-artifact-id }}
          BUILD_DIGEST: ${{ needs.build-tarball.outputs.build-evidence-digest }}
          BUILD_UPLOAD: ${{ needs.build-tarball.outputs.build-evidence-artifact-digest }}
          TEST_ID: ${{ needs.project-test.outputs.evidence-artifact-id }}
          TEST_DIGEST: ${{ needs.project-test.outputs.evidence-digest }}
          TEST_UPLOAD: ${{ needs.project-test.outputs.evidence-artifact-digest }}
          CONTENTS_ID: ${{ needs.npm-artifact-qualification.outputs.contents-evidence-artifact-id }}
          CONTENTS_DIGEST: ${{ needs.npm-artifact-qualification.outputs.contents-evidence-digest }}
          CONTENTS_UPLOAD: ${{ needs.npm-artifact-qualification.outputs.contents-evidence-artifact-digest }}
          INSTALL_ID: ${{ needs.npm-artifact-qualification.outputs.install-evidence-artifact-id }}
          INSTALL_DIGEST: ${{ needs.npm-artifact-qualification.outputs.install-evidence-digest }}
          INSTALL_UPLOAD: ${{ needs.npm-artifact-qualification.outputs.install-evidence-artifact-digest }}
          ARTIFACT_ID: ${{ needs.build-tarball.outputs.release-artifact-artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.build-tarball.outputs.release-artifact-digest }}
          ARTIFACT_UPLOAD: ${{ needs.build-tarball.outputs.release-artifact-artifact-digest }}
        run: |
          args=()
          add_record() {
            local role="$1" path="$2" digest="$3" id="$4" upload="$5"
            if [[ -z "${id}" ]]; then
              return 0
            fi
            if [[ -z "${digest}" || -z "${upload}" ]]; then
              echo "::error::${role} has artifact ID but missing digest metadata" >&2
              exit 1
            fi
            if [[ ! -f "${path}" ]]; then
              echo "::error::${role} artifact ID ${id} was present but ${path} was not downloaded" >&2
              exit 1
            fi
            args+=(
              "--${role}" "${path}"
              "--${role}-digest" "${digest}"
              "--${role}-artifact-id" "${id}"
              "--${role}-artifact-digest" "${upload}"
            )
          }
          add_record build-evidence ".wdv3/input/${{ needs.build-tarball.outputs.build-evidence-artifact-name }}" "${BUILD_DIGEST}" "${BUILD_ID}" "${BUILD_UPLOAD}"
          add_record project-test-evidence ".wdv3/input/${{ needs.project-test.outputs.evidence-artifact-name }}" "${TEST_DIGEST}" "${TEST_ID}" "${TEST_UPLOAD}"
          add_record artifact-contents-evidence ".wdv3/input/${{ needs.npm-artifact-qualification.outputs.contents-evidence-artifact-name }}" "${CONTENTS_DIGEST}" "${CONTENTS_ID}" "${CONTENTS_UPLOAD}"
          add_record install-import-evidence ".wdv3/input/${{ needs.npm-artifact-qualification.outputs.install-evidence-artifact-name }}" "${INSTALL_DIGEST}" "${INSTALL_ID}" "${INSTALL_UPLOAD}"
          add_record release-artifact ".wdv3/input/${{ needs.build-tarball.outputs.release-artifact-artifact-name }}" "${ARTIFACT_DIGEST}" "${ARTIFACT_ID}" "${ARTIFACT_UPLOAD}"
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release finalize-qualification \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --purpose "${WDV3_PURPOSE}" \
            --qualification-snapshot ".wdv3/input/${{ needs.build-tarball.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.build-tarball.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.build-tarball.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.build-tarball.outputs.qualification-snapshot-artifact-digest }}" \
            "${args[@]}" \
            --output .wdv3/qualification-decision.json \
            --github-output "${GITHUB_OUTPUT}"
          digest="$(sha256sum .wdv3/qualification-decision.json | cut -d' ' -f1)"
          artifact_name="wdv3-live-buddy-qualification-decision-r${GITHUB_RUN_ID}-${digest}.json"
          mv .wdv3/qualification-decision.json ".wdv3/${artifact_name}"
          echo "qualification-decision-artifact-name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload Qualification Decision
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.finalize.outputs.qualification-decision-artifact-name }}
          path: .wdv3/${{ steps.finalize.outputs.qualification-decision-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  observe-github-packages:
    name: Observe GitHub Packages destination
    if: github.run_attempt == 1 && needs.qualification-finalizer.outputs.qualification-result == 'success'
    needs: qualification-finalizer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      qualification-snapshot-artifact-id: ${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-id }}
      qualification-snapshot-artifact-digest: ${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-digest }}
      qualification-snapshot-artifact-name: ${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-name }}
      qualification-snapshot-digest: ${{ needs.qualification-finalizer.outputs.qualification-snapshot-digest }}
      adapter-context-artifact-id: ${{ needs.qualification-finalizer.outputs.adapter-context-artifact-id }}
      adapter-context-artifact-digest: ${{ needs.qualification-finalizer.outputs.adapter-context-artifact-digest }}
      adapter-context-artifact-name: ${{ needs.qualification-finalizer.outputs.adapter-context-artifact-name }}
      adapter-context-digest: ${{ needs.qualification-finalizer.outputs.adapter-context-digest }}
      release-artifact-artifact-id: ${{ needs.qualification-finalizer.outputs.release-artifact-artifact-id }}
      release-artifact-artifact-digest: ${{ needs.qualification-finalizer.outputs.release-artifact-artifact-digest }}
      release-artifact-artifact-name: ${{ needs.qualification-finalizer.outputs.release-artifact-artifact-name }}
      release-artifact-digest: ${{ needs.qualification-finalizer.outputs.release-artifact-digest }}
      decision-artifact-id: ${{ needs.qualification-finalizer.outputs.decision-artifact-id }}
      decision-artifact-digest: ${{ needs.qualification-finalizer.outputs.decision-artifact-digest }}
      decision-artifact-name: ${{ needs.qualification-finalizer.outputs.decision-artifact-name }}
      decision-digest: ${{ needs.qualification-finalizer.outputs.decision-digest }}
      observation-set-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      observation-set-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      observation-set-artifact-name: ${{ steps.observe.outputs.observation-set-artifact-name }}
      observation-set-digest: ${{ steps.observe.outputs.observation-digest }}
      tarball-artifact-id: ${{ needs.qualification-finalizer.outputs.tarball-artifact-id }}
      tarball-artifact-digest: ${{ needs.qualification-finalizer.outputs.tarball-artifact-digest }}
      tarball-artifact-name: ${{ needs.qualification-finalizer.outputs.tarball-artifact-name }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
      - name: Download Qualification Snapshot by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Qualification Decision by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.decision-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Adapter context by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.adapter-context-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Release Artifact record by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.release-artifact-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Observe exact GitHub Packages state
        id: observe
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release observe-github-packages \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --qualification-snapshot ".wdv3/input/${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.qualification-finalizer.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-digest }}" \
            --qualification-decision ".wdv3/input/${{ needs.qualification-finalizer.outputs.decision-artifact-name }}" \
            --qualification-decision-digest "${{ needs.qualification-finalizer.outputs.decision-digest }}" \
            --qualification-decision-artifact-id "${{ needs.qualification-finalizer.outputs.decision-artifact-id }}" \
            --qualification-decision-artifact-digest "${{ needs.qualification-finalizer.outputs.decision-artifact-digest }}" \
            --adapter-context ".wdv3/input/${{ needs.qualification-finalizer.outputs.adapter-context-artifact-name }}" \
            --adapter-context-digest "${{ needs.qualification-finalizer.outputs.adapter-context-digest }}" \
            --adapter-context-artifact-id "${{ needs.qualification-finalizer.outputs.adapter-context-artifact-id }}" \
            --adapter-context-artifact-digest "${{ needs.qualification-finalizer.outputs.adapter-context-artifact-digest }}" \
            --release-artifact ".wdv3/input/${{ needs.qualification-finalizer.outputs.release-artifact-artifact-name }}" \
            --release-artifact-digest "${{ needs.qualification-finalizer.outputs.release-artifact-digest }}" \
            --release-artifact-artifact-id "${{ needs.qualification-finalizer.outputs.release-artifact-artifact-id }}" \
            --release-artifact-artifact-digest "${{ needs.qualification-finalizer.outputs.release-artifact-artifact-digest }}" \
            --github-token "${GITHUB_TOKEN}" \
            --output .wdv3/observation-set.json \
            --github-output "${GITHUB_OUTPUT}"
          observation_status=$?
          set -e
          echo "observation-status=${observation_status}" >> "${GITHUB_OUTPUT}"
          if [[ ! -f .wdv3/observation-set.json ]]; then
            if [[ "${observation_status}" -eq 0 ]]; then
              exit 1
            fi
            exit "${observation_status}"
          fi
          digest="$(sha256sum .wdv3/observation-set.json | cut -d' ' -f1)"
          artifact_name="wdv3-live-buddy-observation-set-r${GITHUB_RUN_ID}-${digest}.json"
          mv .wdv3/observation-set.json ".wdv3/${artifact_name}"
          echo "observation-set-artifact-name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          exit "${observation_status}"
      - name: Upload Observation Record set
        id: upload
        if: always() && steps.observe.outputs.observation-set-artifact-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.observe.outputs.observation-set-artifact-name }}
          path: .wdv3/${{ steps.observe.outputs.observation-set-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Propagate observation status
        if: always()
        run: |
          if [[ "${{ steps.observe.outcome }}" != "success" || "${{ steps.upload.outcome }}" != "success" || "${{ steps.observe.outputs.observation-status }}" != "0" ]]; then
            exit 1
          fi

  materialize-publication:
    name: Materialize publication Snapshot and reviewer summary
    if: github.run_attempt == 1
    needs: [admit, observe-github-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      qualification-snapshot-artifact-id: ${{ needs.observe-github-packages.outputs.qualification-snapshot-artifact-id }}
      qualification-snapshot-artifact-digest: ${{ needs.observe-github-packages.outputs.qualification-snapshot-artifact-digest }}
      qualification-snapshot-artifact-name: ${{ needs.observe-github-packages.outputs.qualification-snapshot-artifact-name }}
      qualification-snapshot-digest: ${{ needs.observe-github-packages.outputs.qualification-snapshot-digest }}
      decision-artifact-id: ${{ needs.observe-github-packages.outputs.decision-artifact-id }}
      decision-artifact-digest: ${{ needs.observe-github-packages.outputs.decision-artifact-digest }}
      decision-artifact-name: ${{ needs.observe-github-packages.outputs.decision-artifact-name }}
      decision-digest: ${{ needs.observe-github-packages.outputs.decision-digest }}
      release-artifact-artifact-id: ${{ needs.observe-github-packages.outputs.release-artifact-artifact-id }}
      release-artifact-artifact-digest: ${{ needs.observe-github-packages.outputs.release-artifact-artifact-digest }}
      release-artifact-artifact-name: ${{ needs.observe-github-packages.outputs.release-artifact-artifact-name }}
      release-artifact-digest: ${{ needs.observe-github-packages.outputs.release-artifact-digest }}
      adapter-context-artifact-id: ${{ needs.observe-github-packages.outputs.adapter-context-artifact-id }}
      adapter-context-artifact-digest: ${{ needs.observe-github-packages.outputs.adapter-context-artifact-digest }}
      adapter-context-artifact-name: ${{ needs.observe-github-packages.outputs.adapter-context-artifact-name }}
      adapter-context-digest: ${{ needs.observe-github-packages.outputs.adapter-context-digest }}
      tarball-artifact-id: ${{ needs.observe-github-packages.outputs.tarball-artifact-id }}
      tarball-artifact-digest: ${{ needs.observe-github-packages.outputs.tarball-artifact-digest }}
      tarball-artifact-name: ${{ needs.observe-github-packages.outputs.tarball-artifact-name }}
      publication-snapshot-artifact-id: ${{ steps.upload-snapshot.outputs.artifact-id }}
      publication-snapshot-artifact-digest: ${{ steps.upload-snapshot.outputs.artifact-digest }}
      publication-snapshot-artifact-name: ${{ steps.names.outputs.publication-snapshot-name }}
      publication-snapshot-digest: ${{ steps.materialize.outputs.publication-snapshot-digest }}
      reviewer-artifact-id: ${{ steps.upload-reviewer.outputs.artifact-id }}
      reviewer-artifact-digest: ${{ steps.upload-reviewer.outputs.artifact-digest }}
      reviewer-artifact-url: ${{ steps.upload-reviewer.outputs.artifact-url }}
      reviewer-artifact-name: ${{ steps.names.outputs.reviewer-name }}
      reviewer-digest: ${{ steps.materialize.outputs.reviewer-digest }}
      approval-bundle-artifact-id: ${{ steps.upload-bundle.outputs.artifact-id }}
      approval-bundle-artifact-digest: ${{ steps.upload-bundle.outputs.artifact-digest }}
      approval-bundle-artifact-name: ${{ steps.form-bundle.outputs.approval-bundle-artifact-name }}
      approval-bundle-digest: ${{ steps.form-bundle.outputs.approval-bundle-digest }}
      publish-required: ${{ steps.materialize.outputs.publish-required }}
      resource-concurrency-key: ${{ steps.materialize.outputs.resource-concurrency-key }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
      - name: Download Intent by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.intent-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Release Attempt binding by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.admit.outputs.attempt-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Observation Record set by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.observe-github-packages.outputs.observation-set-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Qualification Snapshot by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.observe-github-packages.outputs.qualification-snapshot-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Qualification Decision by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.observe-github-packages.outputs.decision-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Release Artifact by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.observe-github-packages.outputs.release-artifact-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Materialize immutable publication and reviewer payload
        id: materialize
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release materialize-publication \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --selected-ref "${{ inputs.selected-ref }}" \
            --intent ".wdv3/input/${{ inputs.intent-artifact-name }}" \
            --intent-digest "${{ inputs.intent-digest }}" \
            --intent-artifact-id "${{ inputs.intent-artifact-id }}" \
            --intent-artifact-digest "${{ inputs.intent-artifact-digest }}" \
            --qualification-snapshot ".wdv3/input/${{ needs.observe-github-packages.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.observe-github-packages.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.observe-github-packages.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.observe-github-packages.outputs.qualification-snapshot-artifact-digest }}" \
            --qualification-decision ".wdv3/input/${{ needs.observe-github-packages.outputs.decision-artifact-name }}" \
            --qualification-decision-digest "${{ needs.observe-github-packages.outputs.decision-digest }}" \
            --qualification-decision-artifact-id "${{ needs.observe-github-packages.outputs.decision-artifact-id }}" \
            --qualification-decision-artifact-digest "${{ needs.observe-github-packages.outputs.decision-artifact-digest }}" \
            --release-artifact ".wdv3/input/${{ needs.observe-github-packages.outputs.release-artifact-artifact-name }}" \
            --release-artifact-digest "${{ needs.observe-github-packages.outputs.release-artifact-digest }}" \
            --release-artifact-artifact-id "${{ needs.observe-github-packages.outputs.release-artifact-artifact-id }}" \
            --release-artifact-artifact-digest "${{ needs.observe-github-packages.outputs.release-artifact-artifact-digest }}" \
            --observation ".wdv3/input/${{ needs.observe-github-packages.outputs.observation-set-artifact-name }}" \
            --observation-digest "${{ needs.observe-github-packages.outputs.observation-set-digest }}" \
            --observation-artifact-id "${{ needs.observe-github-packages.outputs.observation-set-artifact-id }}" \
            --observation-artifact-digest "${{ needs.observe-github-packages.outputs.observation-set-artifact-digest }}" \
            --output .wdv3/publication-snapshot.json \
            --summary-output .wdv3/reviewer-summary.md \
            --formatter-input-output .wdv3/reviewer-formatter-input.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Materialize exact publication basenames
        id: names
        run: |
          snapshot_digest="${{ steps.materialize.outputs.publication-snapshot-digest }}"
          reviewer_digest="${{ steps.materialize.outputs.reviewer-digest }}"
          snapshot_name="wdv3-live-buddy-publication-snapshot-r${GITHUB_RUN_ID}-${snapshot_digest#sha256:}.json"
          reviewer_name="wdv3-live-buddy-reviewer-r${GITHUB_RUN_ID}-${reviewer_digest#sha256:}"
          mv .wdv3/publication-snapshot.json ".wdv3/${snapshot_name}"
          mkdir -p ".wdv3/${reviewer_name}"
          cp ".wdv3/${snapshot_name}" ".wdv3/${reviewer_name}/publication-snapshot.json"
          mv .wdv3/reviewer-summary.md ".wdv3/${reviewer_name}/reviewer-summary.md"
          mv .wdv3/reviewer-formatter-input.json ".wdv3/${reviewer_name}/reviewer-formatter-input.json"
          echo "publication-snapshot-name=${snapshot_name}" >> "${GITHUB_OUTPUT}"
          echo "reviewer-name=${reviewer_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload Publication Snapshot
        id: upload-snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.names.outputs.publication-snapshot-name }}
          path: .wdv3/${{ steps.names.outputs.publication-snapshot-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Upload reviewer artifact
        id: upload-reviewer
        if: steps.materialize.outputs.publish-required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.names.outputs.reviewer-name }}
          path: .wdv3/${{ steps.names.outputs.reviewer-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          include-hidden-files: true
      - name: Bind reviewer artifact transport to exact payloads
        id: bind
        if: steps.materialize.outputs.publish-required == 'true'
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release bind-reviewer-artifact \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --formatter-input ".wdv3/${{ steps.names.outputs.reviewer-name }}/reviewer-formatter-input.json" \
            --publication-snapshot ".wdv3/${{ steps.names.outputs.reviewer-name }}/publication-snapshot.json" \
            --reviewer-summary ".wdv3/${{ steps.names.outputs.reviewer-name }}/reviewer-summary.md" \
            --reviewer-artifact-name "${{ steps.names.outputs.reviewer-name }}" \
            --reviewer-artifact-id "${{ steps.upload-reviewer.outputs.artifact-id }}" \
            --reviewer-artifact-digest "${{ steps.upload-reviewer.outputs.artifact-digest }}" \
            --reviewer-artifact-url "${{ steps.upload-reviewer.outputs.artifact-url }}" \
            --snapshot-payload-digest "${{ steps.materialize.outputs.publication-snapshot-payload-digest }}" \
            --summary-payload-digest "${{ steps.materialize.outputs.reviewer-digest }}" \
            --output .wdv3/reviewer-summary-artifact.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Form complete pre-wait Approval Bundle
        id: form-bundle
        if: steps.materialize.outputs.publish-required == 'true'
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release form-approval-bundle \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --intent ".wdv3/input/${{ inputs.intent-artifact-name }}" \
            --intent-digest "${{ inputs.intent-digest }}" \
            --intent-artifact-id "${{ inputs.intent-artifact-id }}" \
            --intent-artifact-digest "${{ inputs.intent-artifact-digest }}" \
            --attempt-binding ".wdv3/input/${{ needs.admit.outputs.attempt-artifact-name }}" \
            --attempt-binding-digest "${{ needs.admit.outputs.attempt-digest }}" \
            --attempt-binding-artifact-id "${{ needs.admit.outputs.attempt-artifact-id }}" \
            --attempt-binding-artifact-digest "${{ needs.admit.outputs.attempt-artifact-digest }}" \
            --qualification-decision ".wdv3/input/${{ needs.observe-github-packages.outputs.decision-artifact-name }}" \
            --qualification-decision-digest "${{ needs.observe-github-packages.outputs.decision-digest }}" \
            --qualification-decision-artifact-id "${{ needs.observe-github-packages.outputs.decision-artifact-id }}" \
            --qualification-decision-artifact-digest "${{ needs.observe-github-packages.outputs.decision-artifact-digest }}" \
            --publication-snapshot ".wdv3/${{ steps.names.outputs.publication-snapshot-name }}" \
            --publication-snapshot-digest "${{ steps.materialize.outputs.publication-snapshot-digest }}" \
            --publication-snapshot-artifact-id "${{ steps.upload-snapshot.outputs.artifact-id }}" \
            --publication-snapshot-artifact-digest "${{ steps.upload-snapshot.outputs.artifact-digest }}" \
            --reviewer-summary-artifact .wdv3/reviewer-summary-artifact.json \
            --reviewer-summary-artifact-digest "${{ steps.bind.outputs.reviewer-summary-artifact-digest }}" \
            --control "workflow-delivery-v3:${{ inputs.target-sha }}" \
            --output .wdv3/approval-bundle.json \
            --github-output "${GITHUB_OUTPUT}"
          digest="$(sha256sum .wdv3/approval-bundle.json | cut -d' ' -f1)"
          name="wdv3-live-buddy-approval-bundle-r${GITHUB_RUN_ID}-${digest}.json"
          mv .wdv3/approval-bundle.json ".wdv3/${name}"
          echo "approval-bundle-artifact-name=${name}" >> "${GITHUB_OUTPUT}"
      - name: Upload Approval Bundle
        id: upload-bundle
        if: steps.materialize.outputs.publish-required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.form-bundle.outputs.approval-bundle-artifact-name }}
          path: .wdv3/${{ steps.form-bundle.outputs.approval-bundle-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Publish completed reviewer summary and artifact link
        if: steps.upload-bundle.outcome == 'success'
        run: |
          cat ".wdv3/${{ steps.names.outputs.reviewer-name }}/reviewer-summary.md" >> "${GITHUB_STEP_SUMMARY}"
          printf '\n[Download immutable reviewer artifact](%s)\n' "${{ steps.upload-reviewer.outputs.artifact-url }}" >> "${GITHUB_STEP_SUMMARY}"

  approve-publication:
    name: Approve publication
    if: >-
      github.run_attempt == 1 &&
      needs.materialize-publication.outputs.publish-required == 'true'
    needs: [admit, materialize-publication]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: workflow-delivery-v3-buddy-approval
      url: ${{ needs.materialize-publication.outputs.reviewer-artifact-url }}
    outputs:
      publication-authorization-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      publication-authorization-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      publication-authorization-artifact-name: ${{ steps.authorize.outputs.publication-authorization-artifact-name }}
      publication-authorization-digest: ${{ steps.authorize.outputs.publication-authorization-digest }}
      approval-bundle-artifact-id: ${{ needs.materialize-publication.outputs.approval-bundle-artifact-id }}
      approval-bundle-artifact-digest: ${{ needs.materialize-publication.outputs.approval-bundle-artifact-digest }}
      approval-bundle-artifact-name: ${{ needs.materialize-publication.outputs.approval-bundle-artifact-name }}
      approval-bundle-digest: ${{ needs.materialize-publication.outputs.approval-bundle-digest }}
      publication-snapshot-artifact-id: ${{ needs.materialize-publication.outputs.publication-snapshot-artifact-id }}
      publication-snapshot-artifact-digest: ${{ needs.materialize-publication.outputs.publication-snapshot-artifact-digest }}
      publication-snapshot-artifact-name: ${{ needs.materialize-publication.outputs.publication-snapshot-artifact-name }}
      publication-snapshot-digest: ${{ needs.materialize-publication.outputs.publication-snapshot-digest }}
      publish-required: ${{ needs.materialize-publication.outputs.publish-required }}
      resource-concurrency-key: ${{ needs.materialize-publication.outputs.resource-concurrency-key }}
      qualification-snapshot-artifact-id: ${{ needs.materialize-publication.outputs.qualification-snapshot-artifact-id }}
      qualification-snapshot-artifact-digest: ${{ needs.materialize-publication.outputs.qualification-snapshot-artifact-digest }}
      qualification-snapshot-artifact-name: ${{ needs.materialize-publication.outputs.qualification-snapshot-artifact-name }}
      qualification-snapshot-digest: ${{ needs.materialize-publication.outputs.qualification-snapshot-digest }}
      decision-artifact-id: ${{ needs.materialize-publication.outputs.decision-artifact-id }}
      decision-artifact-digest: ${{ needs.materialize-publication.outputs.decision-artifact-digest }}
      decision-artifact-name: ${{ needs.materialize-publication.outputs.decision-artifact-name }}
      decision-digest: ${{ needs.materialize-publication.outputs.decision-digest }}
      release-artifact-artifact-id: ${{ needs.materialize-publication.outputs.release-artifact-artifact-id }}
      release-artifact-artifact-digest: ${{ needs.materialize-publication.outputs.release-artifact-artifact-digest }}
      release-artifact-artifact-name: ${{ needs.materialize-publication.outputs.release-artifact-artifact-name }}
      release-artifact-digest: ${{ needs.materialize-publication.outputs.release-artifact-digest }}
      adapter-context-artifact-id: ${{ needs.materialize-publication.outputs.adapter-context-artifact-id }}
      adapter-context-artifact-digest: ${{ needs.materialize-publication.outputs.adapter-context-artifact-digest }}
      adapter-context-artifact-name: ${{ needs.materialize-publication.outputs.adapter-context-artifact-name }}
      adapter-context-digest: ${{ needs.materialize-publication.outputs.adapter-context-digest }}
      tarball-artifact-id: ${{ needs.materialize-publication.outputs.tarball-artifact-id }}
      tarball-artifact-digest: ${{ needs.materialize-publication.outputs.tarball-artifact-digest }}
      tarball-artifact-name: ${{ needs.materialize-publication.outputs.tarball-artifact-name }}
    steps:
      - name: Verify approval Environment marker
        id: approval-environment-marker
        shell: bash
        env:
          ACTUAL_ENVIRONMENT_MARKER: ${{ vars.WDV3_APPROVAL_ENVIRONMENT_MARKER }}
        run: |
          if [[ "${ACTUAL_ENVIRONMENT_MARKER}" != "workflow-delivery-v3-buddy-approval/v1" ]]; then
            echo "::error::Environment marker does not match the approval Environment contract" >&2
            exit 1
          fi
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
      - name: Download authorization closure by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.intent-artifact-id }},${{ inputs.repository-model-artifact-id }},${{ inputs.live-eligibility-artifact-id }},${{ needs.admit.outputs.attempt-artifact-id }},${{ needs.materialize-publication.outputs.approval-bundle-artifact-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: Form sole Publication Authorization
        id: authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release form-publication-authorization \
            --github-token "${GITHUB_TOKEN}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --intent ".wdv3/input/${{ inputs.intent-artifact-name }}" \
            --intent-digest "${{ inputs.intent-digest }}" \
            --intent-artifact-id "${{ inputs.intent-artifact-id }}" \
            --intent-artifact-digest "${{ inputs.intent-artifact-digest }}" \
            --repository-model ".wdv3/input/${{ inputs.repository-model-artifact-name }}" \
            --repository-model-digest "${{ inputs.repository-model-digest }}" \
            --repository-model-artifact-id "${{ inputs.repository-model-artifact-id }}" \
            --repository-model-artifact-digest "${{ inputs.repository-model-artifact-digest }}" \
            --attempt-binding ".wdv3/input/${{ needs.admit.outputs.attempt-artifact-name }}" \
            --attempt-binding-digest "${{ needs.admit.outputs.attempt-digest }}" \
            --attempt-binding-artifact-id "${{ needs.admit.outputs.attempt-artifact-id }}" \
            --attempt-binding-artifact-digest "${{ needs.admit.outputs.attempt-artifact-digest }}" \
            --approval-bundle ".wdv3/input/${{ needs.materialize-publication.outputs.approval-bundle-artifact-name }}" \
            --approval-bundle-digest "${{ needs.materialize-publication.outputs.approval-bundle-digest }}" \
            --approval-bundle-artifact-id "${{ needs.materialize-publication.outputs.approval-bundle-artifact-id }}" \
            --approval-bundle-artifact-digest "${{ needs.materialize-publication.outputs.approval-bundle-artifact-digest }}" \
            --live-eligibility-decision ".wdv3/input/${{ inputs.live-eligibility-artifact-name }}" \
            --live-eligibility-artifact-id "${{ inputs.live-eligibility-artifact-id }}" \
            --live-eligibility-artifact-digest "${{ inputs.live-eligibility-artifact-digest }}" \
            --live-eligibility-payload-digest "${{ inputs.live-eligibility-digest }}" \
            --control "workflow-delivery-v3:${{ inputs.target-sha }}" \
            --output .wdv3/publication-authorization.json \
            --github-output "${GITHUB_OUTPUT}"
          digest="$(sha256sum .wdv3/publication-authorization.json | cut -d' ' -f1)"
          name="wdv3-live-buddy-publication-authorization-r${GITHUB_RUN_ID}-${digest}.json"
          mv .wdv3/publication-authorization.json ".wdv3/${name}"
          echo "publication-authorization-artifact-name=${name}" >> "${GITHUB_OUTPUT}"
      - name: Upload Publication Authorization
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.authorize.outputs.publication-authorization-artifact-name }}
          path: .wdv3/${{ steps.authorize.outputs.publication-authorization-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  prove-exact-satisfied:
    name: Prove exact-satisfied Governance continuity
    if: >-
      github.run_attempt == 1 &&
      needs.materialize-publication.outputs.publish-required == 'false'
    needs: [admit, materialize-publication]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      exact-satisfied-governance-proof-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      exact-satisfied-governance-proof-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      exact-satisfied-governance-proof-artifact-name: ${{ steps.prove.outputs.exact-satisfied-governance-proof-artifact-name }}
      exact-satisfied-governance-proof-digest: ${{ steps.prove.outputs.exact-satisfied-governance-proof-digest }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
      - name: Download exact-satisfied closure by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.intent-artifact-id }},${{ inputs.repository-model-artifact-id }},${{ inputs.live-eligibility-artifact-id }},${{ needs.admit.outputs.attempt-artifact-id }},${{ needs.materialize-publication.outputs.publication-snapshot-artifact-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: Form exact-satisfied Governance proof
        id: prove
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release prove-exact-satisfied \
            --github-token "${GITHUB_TOKEN}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --intent ".wdv3/input/${{ inputs.intent-artifact-name }}" \
            --intent-digest "${{ inputs.intent-digest }}" \
            --intent-artifact-id "${{ inputs.intent-artifact-id }}" \
            --intent-artifact-digest "${{ inputs.intent-artifact-digest }}" \
            --repository-model ".wdv3/input/${{ inputs.repository-model-artifact-name }}" \
            --repository-model-digest "${{ inputs.repository-model-digest }}" \
            --repository-model-artifact-id "${{ inputs.repository-model-artifact-id }}" \
            --repository-model-artifact-digest "${{ inputs.repository-model-artifact-digest }}" \
            --attempt-binding ".wdv3/input/${{ needs.admit.outputs.attempt-artifact-name }}" \
            --attempt-binding-digest "${{ needs.admit.outputs.attempt-digest }}" \
            --attempt-binding-artifact-id "${{ needs.admit.outputs.attempt-artifact-id }}" \
            --attempt-binding-artifact-digest "${{ needs.admit.outputs.attempt-artifact-digest }}" \
            --publication-snapshot ".wdv3/input/${{ needs.materialize-publication.outputs.publication-snapshot-artifact-name }}" \
            --publication-snapshot-digest "${{ needs.materialize-publication.outputs.publication-snapshot-digest }}" \
            --publication-snapshot-artifact-id "${{ needs.materialize-publication.outputs.publication-snapshot-artifact-id }}" \
            --publication-snapshot-artifact-digest "${{ needs.materialize-publication.outputs.publication-snapshot-artifact-digest }}" \
            --live-eligibility-decision ".wdv3/input/${{ inputs.live-eligibility-artifact-name }}" \
            --live-eligibility-artifact-id "${{ inputs.live-eligibility-artifact-id }}" \
            --live-eligibility-artifact-digest "${{ inputs.live-eligibility-artifact-digest }}" \
            --live-eligibility-payload-digest "${{ inputs.live-eligibility-digest }}" \
            --control "workflow-delivery-v3:${{ inputs.target-sha }}" \
            --output .wdv3/exact-satisfied-governance-proof.json \
            --github-output "${GITHUB_OUTPUT}"
          digest="$(sha256sum .wdv3/exact-satisfied-governance-proof.json | cut -d' ' -f1)"
          name="wdv3-live-buddy-exact-satisfied-proof-r${GITHUB_RUN_ID}-${digest}.json"
          mv .wdv3/exact-satisfied-governance-proof.json ".wdv3/${name}"
          echo "exact-satisfied-governance-proof-artifact-name=${name}" >> "${GITHUB_OUTPUT}"
      - name: Upload exact-satisfied Governance proof
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.prove.outputs.exact-satisfied-governance-proof-artifact-name }}
          path: .wdv3/${{ steps.prove.outputs.exact-satisfied-governance-proof-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  publish-github-packages:
    name: Reject unsupported GitHub Packages primitive
    if: >-
      success() &&
      github.run_attempt == 1 &&
      needs.approve-publication.result == 'success' &&
      needs.approve-publication.outputs.publish-required == 'true'
    needs: approve-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: wdv3-resource-${{ needs.approve-publication.outputs.resource-concurrency-key }}
      cancel-in-progress: false
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
      - name: Download publisher closure by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.approve-publication.outputs.qualification-snapshot-artifact-id }},${{ needs.approve-publication.outputs.decision-artifact-id }},${{ needs.approve-publication.outputs.adapter-context-artifact-id }},${{ needs.approve-publication.outputs.release-artifact-artifact-id }},${{ needs.approve-publication.outputs.publication-snapshot-artifact-id }},${{ needs.approve-publication.outputs.publication-authorization-artifact-id }},${{ needs.approve-publication.outputs.tarball-artifact-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: Reject unimplemented conditional destination primitive
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release preflight-github-packages \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --qualification-snapshot ".wdv3/input/${{ needs.approve-publication.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.approve-publication.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.approve-publication.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.approve-publication.outputs.qualification-snapshot-artifact-digest }}" \
            --qualification-decision ".wdv3/input/${{ needs.approve-publication.outputs.decision-artifact-name }}" \
            --qualification-decision-digest "${{ needs.approve-publication.outputs.decision-digest }}" \
            --qualification-decision-artifact-id "${{ needs.approve-publication.outputs.decision-artifact-id }}" \
            --qualification-decision-artifact-digest "${{ needs.approve-publication.outputs.decision-artifact-digest }}" \
            --adapter-context ".wdv3/input/${{ needs.approve-publication.outputs.adapter-context-artifact-name }}" \
            --adapter-context-digest "${{ needs.approve-publication.outputs.adapter-context-digest }}" \
            --adapter-context-artifact-id "${{ needs.approve-publication.outputs.adapter-context-artifact-id }}" \
            --adapter-context-artifact-digest "${{ needs.approve-publication.outputs.adapter-context-artifact-digest }}" \
            --release-artifact ".wdv3/input/${{ needs.approve-publication.outputs.release-artifact-artifact-name }}" \
            --release-artifact-digest "${{ needs.approve-publication.outputs.release-artifact-digest }}" \
            --release-artifact-artifact-id "${{ needs.approve-publication.outputs.release-artifact-artifact-id }}" \
            --release-artifact-artifact-digest "${{ needs.approve-publication.outputs.release-artifact-artifact-digest }}" \
            --publication-snapshot ".wdv3/input/${{ needs.approve-publication.outputs.publication-snapshot-artifact-name }}" \
            --publication-snapshot-digest "${{ needs.approve-publication.outputs.publication-snapshot-digest }}" \
            --publication-snapshot-artifact-id "${{ needs.approve-publication.outputs.publication-snapshot-artifact-id }}" \
            --publication-snapshot-artifact-digest "${{ needs.approve-publication.outputs.publication-snapshot-artifact-digest }}" \
            --publication-authorization ".wdv3/input/${{ needs.approve-publication.outputs.publication-authorization-artifact-name }}" \
            --publication-authorization-digest "${{ needs.approve-publication.outputs.publication-authorization-digest }}" \
            --publication-authorization-artifact-id "${{ needs.approve-publication.outputs.publication-authorization-artifact-id }}" \
            --publication-authorization-artifact-digest "${{ needs.approve-publication.outputs.publication-authorization-artifact-digest }}" \
            --tarball ".wdv3/input/${{ needs.approve-publication.outputs.tarball-artifact-name }}" \
            --github-token "${GITHUB_TOKEN}" \
            --preflight-output .wdv3/publication-preflight.json \
            --github-output "${GITHUB_OUTPUT}"

  workflow-cancellation:
    name: Record workflow cancellation
    if: cancelled() && github.run_attempt == 1
    needs:
      [
        admit,
        qualification-finalizer,
        observe-github-packages,
        materialize-publication,
        approve-publication,
        prove-exact-satisfied,
        publish-github-packages,
      ]
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      workflow-cancelled: ${{ steps.record.outputs.workflow-cancelled }}
    steps:
      - name: Record workflow cancellation
        id: record
        run: echo "workflow-cancelled=true" >> "${GITHUB_OUTPUT}"

  release-finalizer:
    name: Finalize live Attempt outcome
    if: always() && github.run_attempt == 1 && needs.admit.outputs.identity-admitted == 'true'
    needs:
      [
        admit,
        qualification-finalizer,
        observe-github-packages,
        materialize-publication,
        approve-publication,
        prove-exact-satisfied,
        publish-github-packages,
        workflow-cancellation,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact selected target
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        if: always()
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
      - name: Download Release Attempt binding by artifact ID
        if: always() && needs.admit.outputs.attempt-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.admit.outputs.attempt-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Qualification Snapshot by artifact ID
        if: always() && needs.qualification-finalizer.outputs.qualification-snapshot-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Qualification Decision by artifact ID
        if: always() && needs.qualification-finalizer.outputs.decision-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.decision-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download build Evidence by artifact ID
        if: always() && needs.qualification-finalizer.outputs.build-evidence-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.build-evidence-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download project-test Evidence by artifact ID
        if: always() && needs.qualification-finalizer.outputs.project-test-evidence-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.project-test-evidence-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download artifact-contents Evidence by artifact ID
        if: always() && needs.qualification-finalizer.outputs.artifact-contents-evidence-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.artifact-contents-evidence-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download install-import Evidence by artifact ID
        if: always() && needs.qualification-finalizer.outputs.install-import-evidence-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.install-import-evidence-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Release Artifact record by artifact ID
        if: always() && needs.qualification-finalizer.outputs.release-artifact-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.release-artifact-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Observation Record by artifact ID
        if: always() && needs.observe-github-packages.outputs.observation-set-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.observe-github-packages.outputs.observation-set-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Publication Snapshot by artifact ID
        if: always() && needs.materialize-publication.outputs.publication-snapshot-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.materialize-publication.outputs.publication-snapshot-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Approval Bundle by artifact ID
        if: always() && needs.materialize-publication.outputs.approval-bundle-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.materialize-publication.outputs.approval-bundle-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Publication Authorization by artifact ID
        if: always() && needs.approve-publication.outputs.publication-authorization-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.approve-publication.outputs.publication-authorization-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download exact-satisfied Governance proof by artifact ID
        if: always() && needs.prove-exact-satisfied.outputs.exact-satisfied-governance-proof-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.prove-exact-satisfied.outputs.exact-satisfied-governance-proof-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Finalize Attempt Outcome
        id: finalize
        if: success() || cancelled()
        continue-on-error: true
        run: |
          args=()
          add_record() {
            local role="$1" path="$2" digest="$3" id="$4" upload="$5"
            if [[ -z "${id}" ]]; then
              return 0
            fi
            if [[ -z "${digest}" || -z "${upload}" || ! -f "${path}" ]]; then
              echo "::error::${role} finalization input is incomplete" >&2
              exit 1
            fi
            args+=(
              "--${role}" "${path}"
              "--${role}-digest" "${digest}"
              "--${role}-artifact-id" "${id}"
              "--${role}-artifact-digest" "${upload}"
            )
          }
          add_record build-evidence ".wdv3/input/${{ needs.qualification-finalizer.outputs.build-evidence-artifact-name }}" "${{ needs.qualification-finalizer.outputs.build-evidence-digest }}" "${{ needs.qualification-finalizer.outputs.build-evidence-artifact-id }}" "${{ needs.qualification-finalizer.outputs.build-evidence-artifact-digest }}"
          add_record project-test-evidence ".wdv3/input/${{ needs.qualification-finalizer.outputs.project-test-evidence-artifact-name }}" "${{ needs.qualification-finalizer.outputs.project-test-evidence-digest }}" "${{ needs.qualification-finalizer.outputs.project-test-evidence-artifact-id }}" "${{ needs.qualification-finalizer.outputs.project-test-evidence-artifact-digest }}"
          add_record artifact-contents-evidence ".wdv3/input/${{ needs.qualification-finalizer.outputs.artifact-contents-evidence-artifact-name }}" "${{ needs.qualification-finalizer.outputs.artifact-contents-evidence-digest }}" "${{ needs.qualification-finalizer.outputs.artifact-contents-evidence-artifact-id }}" "${{ needs.qualification-finalizer.outputs.artifact-contents-evidence-artifact-digest }}"
          add_record install-import-evidence ".wdv3/input/${{ needs.qualification-finalizer.outputs.install-import-evidence-artifact-name }}" "${{ needs.qualification-finalizer.outputs.install-import-evidence-digest }}" "${{ needs.qualification-finalizer.outputs.install-import-evidence-artifact-id }}" "${{ needs.qualification-finalizer.outputs.install-import-evidence-artifact-digest }}"
          add_record release-artifact ".wdv3/input/${{ needs.qualification-finalizer.outputs.release-artifact-artifact-name }}" "${{ needs.qualification-finalizer.outputs.release-artifact-digest }}" "${{ needs.qualification-finalizer.outputs.release-artifact-artifact-id }}" "${{ needs.qualification-finalizer.outputs.release-artifact-artifact-digest }}"
          snapshot_id="${{ needs.materialize-publication.outputs.publication-snapshot-artifact-id }}"
          if [[ -z "${snapshot_id}" ]]; then
            add_record observation ".wdv3/input/${{ needs.observe-github-packages.outputs.observation-set-artifact-name }}" "${{ needs.observe-github-packages.outputs.observation-set-digest }}" "${{ needs.observe-github-packages.outputs.observation-set-artifact-id }}" "${{ needs.observe-github-packages.outputs.observation-set-artifact-digest }}"
          fi
          if [[ -n "${{ needs.materialize-publication.outputs.publication-snapshot-artifact-id }}" ]]; then
            args+=(
              --publication-snapshot ".wdv3/input/${{ needs.materialize-publication.outputs.publication-snapshot-artifact-name }}"
              --publication-snapshot-digest "${{ needs.materialize-publication.outputs.publication-snapshot-digest }}"
              --publication-snapshot-artifact-id "${{ needs.materialize-publication.outputs.publication-snapshot-artifact-id }}"
              --publication-snapshot-artifact-digest "${{ needs.materialize-publication.outputs.publication-snapshot-artifact-digest }}"
            )
          fi
          add_record approval-bundle ".wdv3/input/${{ needs.materialize-publication.outputs.approval-bundle-artifact-name }}" "${{ needs.materialize-publication.outputs.approval-bundle-digest }}" "${{ needs.materialize-publication.outputs.approval-bundle-artifact-id }}" "${{ needs.materialize-publication.outputs.approval-bundle-artifact-digest }}"
          add_record publication-authorization ".wdv3/input/${{ needs.approve-publication.outputs.publication-authorization-artifact-name }}" "${{ needs.approve-publication.outputs.publication-authorization-digest }}" "${{ needs.approve-publication.outputs.publication-authorization-artifact-id }}" "${{ needs.approve-publication.outputs.publication-authorization-artifact-digest }}"
          add_record exact-satisfied-governance-proof ".wdv3/input/${{ needs.prove-exact-satisfied.outputs.exact-satisfied-governance-proof-artifact-name }}" "${{ needs.prove-exact-satisfied.outputs.exact-satisfied-governance-proof-digest }}" "${{ needs.prove-exact-satisfied.outputs.exact-satisfied-governance-proof-artifact-id }}" "${{ needs.prove-exact-satisfied.outputs.exact-satisfied-governance-proof-artifact-digest }}"
          qualification_result="${{ needs.qualification-finalizer.outputs.qualification-result }}"
          observation_result="${{ needs.observe-github-packages.result }}"
          materialization_result="${{ needs.materialize-publication.result }}"
          snapshot_id="${{ needs.materialize-publication.outputs.publication-snapshot-artifact-id }}"
          snapshot_upload_digest="${{ needs.materialize-publication.outputs.publication-snapshot-artifact-digest }}"
          publication_preparation_interrupted=false
          if [[ -n "${snapshot_id}" && -z "${snapshot_upload_digest}" ]]; then
            echo "::error::Publication Snapshot transport is only partially absent" >&2
            exit 1
          fi
          if [[ "${qualification_result}" == "success" && -z "${snapshot_id}" ]]; then
            if [[ -n "${snapshot_upload_digest}" ]]; then
              echo "::error::Publication Snapshot transport is only partially absent" >&2
              exit 1
            fi
            if [[ "${materialization_result}" == "success" ]]; then
              echo "::error::Successful publication preparation omitted its durable Snapshot" >&2
              exit 1
            fi
            if [[ "${observation_result}" == "success" && "${materialization_result}" != "failure" && "${materialization_result}" != "cancelled" ]]; then
              echo "::error::Publication preparation state is not an admitted interruption" >&2
              exit 1
            fi
            publication_preparation_interrupted=true
            args+=(--publication-preparation-interrupted)
          fi
          mkdir -p .wdv3/final-attempt
          set +e
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release finalize-live \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --attempt-binding ".wdv3/input/${{ needs.admit.outputs.attempt-artifact-name }}" \
            --attempt-binding-digest "${{ needs.admit.outputs.attempt-digest }}" \
            --attempt-binding-artifact-id "${{ needs.admit.outputs.attempt-artifact-id }}" \
            --attempt-binding-artifact-digest "${{ needs.admit.outputs.attempt-artifact-digest }}" \
            --qualification-snapshot ".wdv3/input/${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.qualification-finalizer.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-digest }}" \
            --qualification-decision ".wdv3/input/${{ needs.qualification-finalizer.outputs.decision-artifact-name }}" \
            --qualification-decision-digest "${{ needs.qualification-finalizer.outputs.decision-digest }}" \
            --qualification-decision-artifact-id "${{ needs.qualification-finalizer.outputs.decision-artifact-id }}" \
            --qualification-decision-artifact-digest "${{ needs.qualification-finalizer.outputs.decision-artifact-digest }}" \
            "${args[@]}" \
            --outcome-output .wdv3/final-attempt/attempt-outcome.json \
            --summary-output .wdv3/final-attempt/attempt-summary.md \
            --github-step-summary "${GITHUB_STEP_SUMMARY}" \
            --github-output "${GITHUB_OUTPUT}"
          status=$?
          set -e
          if [[ "${publication_preparation_interrupted}" == "true" && -f .wdv3/final-attempt/attempt-summary.md ]]; then
            {
              printf '\n## Publication preparation interruption\n\n'
              printf '%s\n' "- Qualification result: ${qualification_result}"
              printf '%s\n' "- Observation job result: ${observation_result}"
              printf '%s\n' "- Materialization job result: ${materialization_result}"
              printf '%s\n' "- Durable Publication Snapshot: absent"
              printf '%s\n' "- Mutation authority: absent"
            } | tee -a .wdv3/final-attempt/attempt-summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          outcome_digest="$(sha256sum .wdv3/final-attempt/attempt-outcome.json | cut -d' ' -f1)"
          summary_digest="$(sha256sum .wdv3/final-attempt/attempt-summary.md | cut -d' ' -f1)"
          outcome_name="wdv3-live-buddy-attempt-outcome-r${GITHUB_RUN_ID}-${outcome_digest}.json"
          summary_name="wdv3-live-buddy-attempt-summary-r${GITHUB_RUN_ID}-${summary_digest}.md"
          mv .wdv3/final-attempt/attempt-outcome.json ".wdv3/final-attempt/${outcome_name}"
          mv .wdv3/final-attempt/attempt-summary.md ".wdv3/final-attempt/${summary_name}"
          {
            echo "outcome-artifact-name=${outcome_name}"
            echo "summary-artifact-name=${summary_name}"
            echo "finalizer-status=${status}"
          } >> "${GITHUB_OUTPUT}"
          exit "${status}"
      - name: Upload final Attempt Outcome
        id: upload-final-outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.finalize.outputs.outcome-artifact-name }}
          path: .wdv3/final-attempt/${{ steps.finalize.outputs.outcome-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Upload final Attempt summary
        id: upload-final-summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.finalize.outputs.summary-artifact-name }}
          path: .wdv3/final-attempt/${{ steps.finalize.outputs.summary-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Propagate finalization status
        if: always()
        run: |
          if [[ "${{ steps.finalize.outcome }}" != "success" || "${{ steps.upload-final-outcome.outcome }}" != "success" || "${{ steps.upload-final-summary.outcome }}" != "success" || "${{ steps.finalize.outputs.finalizer-status }}" != "0" ]]; then
            exit 1
          fi
