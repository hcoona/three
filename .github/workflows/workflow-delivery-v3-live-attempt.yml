    permissions:
      contents: read
    outputs:
      qualification-snapshot-artifact-id: ${{ needs.build-tarball.outputs.qualification-snapshot-artifact-id }}
      qualification-snapshot-artifact-digest: ${{ needs.build-tarball.outputs.qualification-snapshot-artifact-digest }}
      qualification-snapshot-artifact-name: ${{ needs.build-tarball.outputs.qualification-snapshot-artifact-name }}
      qualification-snapshot-digest: ${{ needs.build-tarball.outputs.qualification-snapshot-digest }}
      adapter-context-artifact-id: ${{ needs.build-tarball.outputs.adapter-context-artifact-id }}
      adapter-context-artifact-digest: ${{ needs.build-tarball.outputs.adapter-context-artifact-digest }}
      adapter-context-artifact-name: ${{ needs.build-tarball.outputs.adapter-context-artifact-name }}
      adapter-context-digest: ${{ needs.build-tarball.outputs.adapter-context-digest }}
      release-artifact-artifact-id: ${{ needs.build-tarball.outputs.release-artifact-artifact-id }}
      release-artifact-artifact-digest: ${{ needs.build-tarball.outputs.release-artifact-artifact-digest }}
      release-artifact-artifact-name: ${{ needs.build-tarball.outputs.release-artifact-artifact-name }}
      release-artifact-digest: ${{ needs.build-tarball.outputs.release-artifact-digest }}
