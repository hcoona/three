            --github-output "${GITHUB_OUTPUT}"
          digest="$(sha256sum .wdv3/publication-authorization.json | cut -d' ' -f1)"
          name="wdv3-live-buddy-publication-authorization-r${GITHUB_RUN_ID}-${digest}.json"
          mv .wdv3/publication-authorization.json ".wdv3/${name}"
          echo "publication-authorization-artifact-name=${name}" >> "${GITHUB_OUTPUT}"
      - name: Upload Publication Authorization
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.authorize.outputs.publication-authorization-artifact-name }}
          path: .wdv3/${{ steps.authorize.outputs.publication-authorization-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  prove-exact-satisfied:
    name: Prove fresh exact-satisfied state
    if: >-
      always() &&
      github.run_attempt == 1 &&
      needs.materialize-publication.result == 'success' &&
      needs.materialize-publication.outputs.publish-required == 'false' &&
      needs.materialize-publication.outputs.approval-bundle-artifact-id == '' &&
      needs.approve-publication.result == 'skipped' &&
      needs.approve-publication.outputs.publication-authorization-artifact-id == '' &&
      needs.publish-github-packages.result == 'skipped'
