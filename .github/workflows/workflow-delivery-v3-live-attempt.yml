            --target "${{ inputs.target-sha }}" \
            --publication-snapshot ".wdv3/input/${{ needs.approval-finalizer.outputs.publication-snapshot-artifact-name }}" \
            --publication-snapshot-digest "${{ needs.approval-finalizer.outputs.publication-snapshot-digest }}" \
            --publication-snapshot-artifact-id "${{ needs.approval-finalizer.outputs.publication-snapshot-artifact-id }}" \
            --publication-snapshot-artifact-digest "${{ needs.approval-finalizer.outputs.publication-snapshot-artifact-digest }}" \
            --preflight .wdv3/publication-preflight.json \
            --preflight-digest "${{ steps.preflight.outputs.publication-preflight-digest }}" \
            --marker-output ".wdv3/wdv3-live-buddy-mutation-may-have-started-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Upload mutation may-have-started marker
        id: upload-mutation-marker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wdv3-live-buddy-mutation-may-have-started-r${{ github.run_id }}-ra${{ github.run_attempt }}
          path: .wdv3/wdv3-live-buddy-mutation-may-have-started-r${{ github.run_id }}-ra${{ github.run_attempt }}
