  publish-github-packages:
    name: Publish exact authorized npm version
    if: >-
      success() &&
      github.run_attempt == 1 &&
      needs.approve-publication.result == 'success'
    needs: [admit, approve-publication, materialize-publication]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: wdv3-resource-${{ needs.materialize-publication.outputs.resource-concurrency-key }}
      cancel-in-progress: false
    outputs:
      publication-terminal-reference: ${{ steps.admit-result.outputs.publication-terminal-reference || steps.admit-marker.outputs.publication-terminal-reference || 'null' }}
      publication-step-outcome: ${{ steps.publish.outcome }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
      - name: Install tool manager without target tool installation
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install exact isolated Node and npm toolchain
        working-directory: ${{ runner.temp }}
        run: |
          mise install --yes node@24.19.0
          node_root="$(mise where node@24.19.0)"
          toolchain="${RUNNER_TEMP}/wdv3-toolchain-${GITHUB_RUN_ID}"
          mkdir -m 700 "${toolchain}"
          mkdir "${toolchain}/bin" "${toolchain}/home"
          ln -s "${node_root}/bin/node" "${toolchain}/bin/node"
          touch "${toolchain}/user.npmrc" "${toolchain}/global.npmrc"
          isolated=(env -i PATH="${toolchain}/bin:/usr/bin:/bin" HOME="${toolchain}/home"
            NPM_CONFIG_USERCONFIG="${toolchain}/user.npmrc"
            NPM_CONFIG_GLOBALCONFIG="${toolchain}/global.npmrc")
          "${isolated[@]}" \
            "${node_root}/bin/npm" install --global --prefix "${toolchain}" \
            --ignore-scripts --registry=https://registry.npmjs.org npm@11.17.0
          test "$("${isolated[@]}" "${toolchain}/bin/node" --version)" = 'v24.19.0'
          test "$("${isolated[@]}" "${toolchain}/bin/npm" --version)" = '11.17.0'
      - name: Download publisher closure by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.intent-artifact-id }},${{ inputs.repository-model-artifact-id }},${{ inputs.live-eligibility-artifact-id }},${{ needs.admit.outputs.attempt-artifact-id }},${{ needs.materialize-publication.outputs.qualification-snapshot-artifact-id }},${{ needs.materialize-publication.outputs.decision-artifact-id }},${{ needs.materialize-publication.outputs.release-artifact-artifact-id }},${{ needs.materialize-publication.outputs.observation-artifact-id }},${{ needs.materialize-publication.outputs.publication-snapshot-artifact-id }},${{ needs.materialize-publication.outputs.approval-bundle-artifact-id }},${{ needs.materialize-publication.outputs.reviewer-artifact-id }},${{ needs.materialize-publication.outputs.adapter-context-artifact-id }},${{ needs.approve-publication.outputs.publication-authorization-artifact-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: Download qualified tarball by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.materialize-publication.outputs.tarball-artifact-id }}
          path: .wdv3/tarball
          skip-decompress: true
          digest-mismatch: error
      - name: Prepare publication and canonical mutation marker
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release prepare-publication \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --intent ".wdv3/input/${{ inputs.intent-artifact-name }}" \
            --intent-digest "${{ inputs.intent-digest }}" \
            --intent-artifact-id "${{ inputs.intent-artifact-id }}" \
            --intent-artifact-digest "${{ inputs.intent-artifact-digest }}" \
            --repository-model ".wdv3/input/${{ inputs.repository-model-artifact-name }}" \
            --repository-model-digest "${{ inputs.repository-model-digest }}" \
            --repository-model-artifact-id "${{ inputs.repository-model-artifact-id }}" \
            --repository-model-artifact-digest "${{ inputs.repository-model-artifact-digest }}" \
            --attempt-binding ".wdv3/input/${{ needs.admit.outputs.attempt-artifact-name }}" \
