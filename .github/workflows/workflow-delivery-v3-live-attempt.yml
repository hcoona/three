      - name: Upload canonical mutation-marker
        id: upload-mutation-marker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-marker.json
          path: .wdv3/mutation-marker.json
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Download persisted mutation-marker by immutable ID
        id: download-mutation-marker
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.upload-mutation-marker.outputs.artifact-id }}
          path: .wdv3/persisted-mutation-marker
          skip-decompress: true
          digest-mismatch: error
      - name: Admit persisted mutation-marker before exposing its reference
        id: admit-marker
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release admit-publication-terminal \
            --workflow-run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
