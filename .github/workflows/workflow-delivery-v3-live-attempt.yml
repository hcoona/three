            three-workflow-delivery-v3 release preflight-github-packages \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --qualification-snapshot ".wdv3/input/${{ needs.approval-finalizer.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.approval-finalizer.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.approval-finalizer.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.approval-finalizer.outputs.qualification-snapshot-artifact-digest }}" \
            --qualification-decision ".wdv3/input/${{ needs.approval-finalizer.outputs.decision-artifact-name }}" \
            --qualification-decision-digest "${{ needs.approval-finalizer.outputs.decision-digest }}" \
            --qualification-decision-artifact-id "${{ needs.approval-finalizer.outputs.decision-artifact-id }}" \
            --qualification-decision-artifact-digest "${{ needs.approval-finalizer.outputs.decision-artifact-digest }}" \
            --adapter-context ".wdv3/input/${{ needs.approval-finalizer.outputs.adapter-context-artifact-name }}" \
            --adapter-context-digest "${{ needs.approval-finalizer.outputs.adapter-context-digest }}" \
            --adapter-context-artifact-id "${{ needs.approval-finalizer.outputs.adapter-context-artifact-id }}" \
            --adapter-context-artifact-digest "${{ needs.approval-finalizer.outputs.adapter-context-artifact-digest }}" \
            --release-artifact ".wdv3/input/${{ needs.approval-finalizer.outputs.release-artifact-artifact-name }}" \
            --release-artifact-digest "${{ needs.approval-finalizer.outputs.release-artifact-digest }}" \
            --release-artifact-artifact-id "${{ needs.approval-finalizer.outputs.release-artifact-artifact-id }}" \
            --release-artifact-artifact-digest "${{ needs.approval-finalizer.outputs.release-artifact-artifact-digest }}" \
            --publication-snapshot ".wdv3/input/${{ needs.approval-finalizer.outputs.publication-snapshot-artifact-name }}" \
            --publication-snapshot-digest "${{ needs.approval-finalizer.outputs.publication-snapshot-digest }}" \
            --publication-snapshot-artifact-id "${{ needs.approval-finalizer.outputs.publication-snapshot-artifact-id }}" \
