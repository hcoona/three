            --qualification-snapshot-artifact-id "${{ needs.approval-finalizer.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.approval-finalizer.outputs.qualification-snapshot-artifact-digest }}" \
            --qualification-decision ".wdv3/input/${{ needs.approval-finalizer.outputs.decision-artifact-name }}" \
            --qualification-decision-digest "${{ needs.approval-finalizer.outputs.decision-digest }}" \
            --qualification-decision-artifact-id "${{ needs.approval-finalizer.outputs.decision-artifact-id }}" \
            --qualification-decision-artifact-digest "${{ needs.approval-finalizer.outputs.decision-artifact-digest }}" \
            --adapter-context ".wdv3/input/${{ needs.approval-finalizer.outputs.adapter-context-artifact-name }}" \
            --adapter-context-digest "${{ needs.approval-finalizer.outputs.adapter-context-digest }}" \
            --adapter-context-artifact-id "${{ needs.approval-finalizer.outputs.adapter-context-artifact-id }}" \
            --adapter-context-artifact-digest "${{ needs.approval-finalizer.outputs.adapter-context-artifact-digest }}" \
            --release-artifact ".wdv3/input/${{ needs.approval-finalizer.outputs.release-artifact-artifact-name }}" \
            --release-artifact-digest "${{ needs.approval-finalizer.outputs.release-artifact-digest }}" \
            --release-artifact-artifact-id "${{ needs.approval-finalizer.outputs.release-artifact-artifact-id }}" \
            --release-artifact-artifact-digest "${{ needs.approval-finalizer.outputs.release-artifact-artifact-digest }}" \
            --publication-snapshot ".wdv3/input/${{ needs.approval-finalizer.outputs.publication-snapshot-artifact-name }}" \
            --publication-snapshot-digest "${{ needs.approval-finalizer.outputs.publication-snapshot-digest }}" \
            --publication-snapshot-artifact-id "${{ needs.approval-finalizer.outputs.publication-snapshot-artifact-id }}" \
            --publication-snapshot-artifact-digest "${{ needs.approval-finalizer.outputs.publication-snapshot-artifact-digest }}" \
            --authorization ".wdv3/input/${{ needs.approval-finalizer.outputs.authorization-artifact-name }}" \
            --authorization-digest "${{ needs.approval-finalizer.outputs.authorization-digest }}" \
            --authorization-artifact-id "${{ needs.approval-finalizer.outputs.authorization-artifact-id }}" \
            --authorization-artifact-digest "${{ needs.approval-finalizer.outputs.authorization-artifact-digest }}" \
            --capability-decision ".wdv3/input/${{ needs.approval-finalizer.outputs.capability-decision-artifact-name }}" \
            --capability-decision-digest "${{ needs.approval-finalizer.outputs.capability-decision-digest }}" \
            --capability-decision-artifact-id "${{ needs.approval-finalizer.outputs.capability-decision-artifact-id }}" \
            --capability-decision-artifact-digest "${{ needs.approval-finalizer.outputs.capability-decision-artifact-digest }}" \
            --tarball ".wdv3/input/${{ needs.approval-finalizer.outputs.tarball-artifact-name }}" \
            --github-token "${GITHUB_TOKEN}" \
            --preflight .wdv3/publication-preflight.json \
            --preflight-digest "${{ steps.preflight.outputs.publication-preflight-digest }}" \
            --mutation-marker ".wdv3/wdv3-live-buddy-mutation-may-have-started-r${{ github.run_id }}-ra${{ github.run_attempt }}" \
            --mutation-marker-digest "${{ steps.mark-mutation.outputs.mutation-may-have-started-digest }}" \
            --mutation-marker-artifact-id "${{ steps.upload-mutation-marker.outputs.artifact-id }}" \
            --mutation-marker-artifact-digest "${{ steps.upload-mutation-marker.outputs.artifact-digest }}" \
            --temp-root "${RUNNER_TEMP}/wdv3" \
            --receipt-output .wdv3/receipt.json \
            --execution-state-output .wdv3/publication-execution.json \
            --github-output "${GITHUB_OUTPUT}"
          status=$?
          set -e
          echo "publish-cli-status=${status}" >> "${GITHUB_OUTPUT}"
          if [[ -f .wdv3/receipt.json ]]; then
            receipt_digest="$(sha256sum .wdv3/receipt.json | cut -d' ' -f1)"
            receipt_name="wdv3-live-buddy-receipt-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${receipt_digest}.json"
            mv .wdv3/receipt.json ".wdv3/${receipt_name}"
            echo "receipt-artifact-name=${receipt_name}" >> "${GITHUB_OUTPUT}"
          fi
          exit "${status}"
      - name: Upload exact Receipt
        id: upload-receipt
        if: always() && steps.publish.outputs.receipt-artifact-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.publish.outputs.receipt-artifact-name }}
          path: .wdv3/${{ steps.publish.outputs.receipt-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Form Capability Group Result Bundle
        id: form-bundle
        if: always()
        run: |
          receipt_args=()
          terminal_args=()
          if [[ -f .wdv3/publication-execution.json ]]; then
            terminal_args+=(--execution-state .wdv3/publication-execution.json)
          fi
          if [[ -n "${{ steps.upload-mutation-marker.outputs.artifact-id }}" ]]; then
            terminal_args+=(
              --mutation-marker ".wdv3/wdv3-live-buddy-mutation-may-have-started-r${{ github.run_id }}-ra${{ github.run_attempt }}"
              --mutation-marker-artifact-id "${{ steps.upload-mutation-marker.outputs.artifact-id }}"
            )
          fi
          if [[ -n "${{ steps.upload-receipt.outputs.artifact-id }}" ]]; then
            receipt_args+=(
              --receipt ".wdv3/${{ steps.publish.outputs.receipt-artifact-name }}"
              --receipt-digest "${{ steps.publish.outputs.receipt-digest }}"
              --receipt-artifact-id "${{ steps.upload-receipt.outputs.artifact-id }}"
              --receipt-artifact-digest "${{ steps.upload-receipt.outputs.artifact-digest }}"
            )
          fi
          set +e
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release form-github-packages-result \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --publication-snapshot ".wdv3/input/${{ needs.approval-finalizer.outputs.publication-snapshot-artifact-name }}" \
            --publication-snapshot-digest "${{ needs.approval-finalizer.outputs.publication-snapshot-digest }}" \
            --publication-snapshot-artifact-id "${{ needs.approval-finalizer.outputs.publication-snapshot-artifact-id }}" \
            --publication-snapshot-artifact-digest "${{ needs.approval-finalizer.outputs.publication-snapshot-artifact-digest }}" \
            --publish-step-outcome "${{ steps.publish.outcome }}" \
            "${terminal_args[@]}" \
            "${receipt_args[@]}" \
            --result-output .wdv3/action-result.json \
            --bundle-output .wdv3/capability-group-bundle.json \
            --github-output "${GITHUB_OUTPUT}"
          form_status=$?
          set -e
          bundle_digest="$(sha256sum .wdv3/capability-group-bundle.json | cut -d' ' -f1)"
          bundle_name="wdv3-live-buddy-capability-bundle-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${bundle_digest}.json"
          mv .wdv3/capability-group-bundle.json ".wdv3/${bundle_name}"
          echo "capability-group-bundle-artifact-name=${bundle_name}" >> "${GITHUB_OUTPUT}"
          echo "capability-group-bundle-digest=sha256:${bundle_digest}" >> "${GITHUB_OUTPUT}"
          exit "${form_status}"
      - name: Upload Capability Group Result Bundle
        id: upload
        if: always() && steps.form-bundle.outputs.capability-group-bundle-artifact-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.form-bundle.outputs.capability-group-bundle-artifact-name }}
          path: .wdv3/${{ steps.form-bundle.outputs.capability-group-bundle-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Propagate publication status
        if: always()
        run: |
          if [[ "${{ steps.preflight.outcome }}" == "failure" || "${{ steps.mark-mutation.outcome }}" == "failure" || "${{ steps.upload-mutation-marker.outcome }}" == "failure" || "${{ steps.publish.outcome }}" == "failure" || "${{ steps.form-bundle.outcome }}" == "failure" || "${{ steps.upload.outcome }}" == "failure" ]]; then
            exit 1
          fi

  workflow-cancellation:
    name: Record workflow cancellation
    if: cancelled()
    needs:
      [
        admit,
        qualification-finalizer,
        observe-github-packages,
        materialize-publication,
        approval-finalizer,
        publish-github-packages,
      ]
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      workflow-cancelled: ${{ steps.record.outputs.workflow-cancelled }}
    steps:
      - name: Record workflow cancellation
        id: record
        run: echo "workflow-cancelled=true" >> "${GITHUB_OUTPUT}"

  release-finalizer:
    name: Finalize live Attempt outcome
    if: always() && needs.admit.outputs.identity-admitted == 'true'
    needs:
      [
        admit,
        qualification-finalizer,
        observe-github-packages,
        materialize-publication,
        approval-finalizer,
        publish-github-packages,
        workflow-cancellation,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact selected target
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        if: always()
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.9'
      - name: Download Release Attempt binding by artifact ID
        if: always() && needs.admit.outputs.attempt-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.admit.outputs.attempt-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Qualification Snapshot by artifact ID
        if: always() && needs.qualification-finalizer.outputs.qualification-snapshot-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Qualification Decision by artifact ID
        if: always() && needs.qualification-finalizer.outputs.decision-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.decision-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download build Evidence by artifact ID
        if: always() && needs.qualification-finalizer.outputs.build-evidence-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.build-evidence-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download project-test Evidence by artifact ID
        if: always() && needs.qualification-finalizer.outputs.project-test-evidence-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.project-test-evidence-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download artifact-contents Evidence by artifact ID
        if: always() && needs.qualification-finalizer.outputs.artifact-contents-evidence-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.artifact-contents-evidence-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download install-import Evidence by artifact ID
        if: always() && needs.qualification-finalizer.outputs.install-import-evidence-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.install-import-evidence-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Release Artifact record by artifact ID
        if: always() && needs.qualification-finalizer.outputs.release-artifact-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.release-artifact-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Publication Snapshot by artifact ID
        if: always() && needs.materialize-publication.outputs.publication-snapshot-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.materialize-publication.outputs.publication-snapshot-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Authorization Record by artifact ID
        if: always() && needs.approval-finalizer.outputs.authorization-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.approval-finalizer.outputs.authorization-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Capability Admission Decision by artifact ID
        if: always() && needs.approval-finalizer.outputs.capability-decision-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.approval-finalizer.outputs.capability-decision-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download capability result bundle by artifact ID
        if: always() && needs.publish-github-packages.outputs.capability-group-bundle-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.publish-github-packages.outputs.capability-group-bundle-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Receipt by artifact ID
        if: always() && needs.publish-github-packages.outputs.receipt-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.publish-github-packages.outputs.receipt-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Finalize Attempt Outcome
        id: finalize
        if: success() || cancelled()
        continue-on-error: true
        run: |
          args=()
          add_record() {
            local role="$1" path="$2" digest="$3" id="$4" upload="$5"
            if [[ -z "${id}" ]]; then
              return 0
            fi
            if [[ -z "${digest}" || -z "${upload}" || ! -f "${path}" ]]; then
              echo "::error::${role} finalization input is incomplete" >&2
              exit 1
            fi
            args+=(
              "--${role}" "${path}"
              "--${role}-digest" "${digest}"
              "--${role}-artifact-id" "${id}"
              "--${role}-artifact-digest" "${upload}"
            )
          }
          add_record build-evidence ".wdv3/input/${{ needs.qualification-finalizer.outputs.build-evidence-artifact-name }}" "${{ needs.qualification-finalizer.outputs.build-evidence-digest }}" "${{ needs.qualification-finalizer.outputs.build-evidence-artifact-id }}" "${{ needs.qualification-finalizer.outputs.build-evidence-artifact-digest }}"
          add_record project-test-evidence ".wdv3/input/${{ needs.qualification-finalizer.outputs.project-test-evidence-artifact-name }}" "${{ needs.qualification-finalizer.outputs.project-test-evidence-digest }}" "${{ needs.qualification-finalizer.outputs.project-test-evidence-artifact-id }}" "${{ needs.qualification-finalizer.outputs.project-test-evidence-artifact-digest }}"
          add_record artifact-contents-evidence ".wdv3/input/${{ needs.qualification-finalizer.outputs.artifact-contents-evidence-artifact-name }}" "${{ needs.qualification-finalizer.outputs.artifact-contents-evidence-digest }}" "${{ needs.qualification-finalizer.outputs.artifact-contents-evidence-artifact-id }}" "${{ needs.qualification-finalizer.outputs.artifact-contents-evidence-artifact-digest }}"
          add_record install-import-evidence ".wdv3/input/${{ needs.qualification-finalizer.outputs.install-import-evidence-artifact-name }}" "${{ needs.qualification-finalizer.outputs.install-import-evidence-digest }}" "${{ needs.qualification-finalizer.outputs.install-import-evidence-artifact-id }}" "${{ needs.qualification-finalizer.outputs.install-import-evidence-artifact-digest }}"
          add_record release-artifact ".wdv3/input/${{ needs.qualification-finalizer.outputs.release-artifact-artifact-name }}" "${{ needs.qualification-finalizer.outputs.release-artifact-digest }}" "${{ needs.qualification-finalizer.outputs.release-artifact-artifact-id }}" "${{ needs.qualification-finalizer.outputs.release-artifact-artifact-digest }}"
          if [[ -n "${{ needs.materialize-publication.outputs.publication-snapshot-artifact-id }}" ]]; then
            args+=(
              --publication-snapshot ".wdv3/input/${{ needs.materialize-publication.outputs.publication-snapshot-artifact-name }}"
              --publication-snapshot-digest "${{ needs.materialize-publication.outputs.publication-snapshot-digest }}"
              --publication-snapshot-artifact-id "${{ needs.materialize-publication.outputs.publication-snapshot-artifact-id }}"
              --publication-snapshot-artifact-digest "${{ needs.materialize-publication.outputs.publication-snapshot-artifact-digest }}"
            )
          fi
          if [[ -n "${{ needs.approval-finalizer.outputs.authorization-artifact-id }}" ]]; then
            args+=(
              --authorization ".wdv3/input/${{ needs.approval-finalizer.outputs.authorization-artifact-name }}"
              --authorization-digest "${{ needs.approval-finalizer.outputs.authorization-digest }}"
              --authorization-artifact-id "${{ needs.approval-finalizer.outputs.authorization-artifact-id }}"
              --authorization-artifact-digest "${{ needs.approval-finalizer.outputs.authorization-artifact-digest }}"
            )
          fi
          if [[ -n "${{ needs.approval-finalizer.outputs.capability-decision-artifact-id }}" ]]; then
            args+=(
              --capability-decision ".wdv3/input/${{ needs.approval-finalizer.outputs.capability-decision-artifact-name }}"
              --capability-decision-digest "${{ needs.approval-finalizer.outputs.capability-decision-digest }}"
              --capability-decision-artifact-id "${{ needs.approval-finalizer.outputs.capability-decision-artifact-id }}"
              --capability-decision-artifact-digest "${{ needs.approval-finalizer.outputs.capability-decision-artifact-digest }}"
            )
          fi
          if [[ -n "${{ needs.publish-github-packages.outputs.capability-group-bundle-artifact-id }}" ]]; then
            args+=(
              --capability-group-bundle ".wdv3/input/${{ needs.publish-github-packages.outputs.capability-group-bundle-artifact-name }}"
              --capability-group-bundle-digest "${{ needs.publish-github-packages.outputs.capability-group-bundle-digest }}"
              --capability-group-bundle-artifact-id "${{ needs.publish-github-packages.outputs.capability-group-bundle-artifact-id }}"
              --capability-group-bundle-artifact-digest "${{ needs.publish-github-packages.outputs.capability-group-bundle-artifact-digest }}"
            )
          fi
          if [[ -n "${{ needs.publish-github-packages.outputs.receipt-artifact-id }}" ]]; then
            args+=(
              --receipt ".wdv3/input/${{ needs.publish-github-packages.outputs.receipt-artifact-name }}"
              --receipt-digest "${{ needs.publish-github-packages.outputs.receipt-digest }}"
              --receipt-artifact-id "${{ needs.publish-github-packages.outputs.receipt-artifact-id }}"
              --receipt-artifact-digest "${{ needs.publish-github-packages.outputs.receipt-artifact-digest }}"
            )
          fi
          qualification_result="${{ needs.qualification-finalizer.outputs.qualification-result }}"
          observation_result="${{ needs.observe-github-packages.result }}"
          materialization_result="${{ needs.materialize-publication.result }}"
          snapshot_id="${{ needs.materialize-publication.outputs.publication-snapshot-artifact-id }}"
          snapshot_upload_digest="${{ needs.materialize-publication.outputs.publication-snapshot-artifact-digest }}"
          forwarded_snapshot_id="${{ needs.approval-finalizer.outputs.publication-snapshot-artifact-id }}"
          authorization_id="${{ needs.approval-finalizer.outputs.authorization-artifact-id }}"
          capability_decision_id="${{ needs.approval-finalizer.outputs.capability-decision-artifact-id }}"
          publish_result="${{ needs.publish-github-packages.result }}"
          capability_marker_id="${{ needs.publish-github-packages.outputs.mutation-marker-artifact-id }}"
          capability_bundle_id="${{ needs.publish-github-packages.outputs.capability-group-bundle-artifact-id }}"
          receipt_id="${{ needs.publish-github-packages.outputs.receipt-artifact-id }}"
          workflow_cancelled="${{ needs.workflow-cancellation.outputs.workflow-cancelled || 'false' }}"
          publication_preparation_interrupted=false
          if [[ -n "${snapshot_id}" && -z "${snapshot_upload_digest}" ]]; then
            echo "::error::Publication Snapshot transport is only partially absent" >&2
            exit 1
          fi
          if [[ "${qualification_result}" == "success" && -z "${snapshot_id}" ]]; then
            if [[ -n "${snapshot_upload_digest}" ]]; then
              echo "::error::Publication Snapshot transport is only partially absent" >&2
              exit 1
            fi
            if [[ "${materialization_result}" == "success" ]]; then
              echo "::error::Successful publication preparation omitted its durable Snapshot" >&2
              exit 1
            fi
            interruption_is_legal=false
            if [[ "${observation_result}" == "failure" || "${observation_result}" == "cancelled" ]]; then
              if [[ "${materialization_result}" == "skipped" || "${materialization_result}" == "cancelled" ]]; then
                interruption_is_legal=true
              fi
            elif [[ "${observation_result}" == "success" ]]; then
              if [[ "${materialization_result}" == "failure" || "${materialization_result}" == "cancelled" ]]; then
                interruption_is_legal=true
              fi
            fi
            if [[ "${workflow_cancelled}" == "true" ]]; then
              if [[ "${observation_result}" == "skipped" && "${materialization_result}" == "skipped" ]]; then
                interruption_is_legal=true
              elif [[ "${observation_result}" == "success" && "${materialization_result}" == "skipped" ]]; then
                interruption_is_legal=true
              fi
            fi
            if [[ "${interruption_is_legal}" != "true" ]]; then
              echo "::error::Publication preparation state is not an admitted interruption" >&2
              exit 1
            fi
            if [[ "${publish_result}" != "skipped" && ! ( "${publish_result}" == "cancelled" && "${workflow_cancelled}" == "true" ) ]]; then
              echo "::error::Publication preparation interruption did not skip the publisher" >&2
              exit 1
            fi
            if [[ -n "${forwarded_snapshot_id}" || -n "${authorization_id}" || -n "${capability_decision_id}" || -n "${capability_marker_id}" || -n "${capability_bundle_id}" || -n "${receipt_id}" ]]; then
              echo "::error::Publication preparation interruption has downstream lineage" >&2
              exit 1
            fi
            publication_preparation_interrupted=true
            args+=(--publication-preparation-interrupted)
          fi
          qualification_only_cancellation=false
          if [[ ( "${qualification_result}" == "failure" || "${qualification_result}" == "incomplete" ) && "${observation_result}" == "skipped" && "${materialization_result}" == "skipped" && "${publish_result}" == "cancelled" && "${workflow_cancelled}" == "true" && -z "${snapshot_id}" && -z "${snapshot_upload_digest}" && -z "${forwarded_snapshot_id}" && -z "${authorization_id}" && -z "${capability_decision_id}" && -z "${capability_marker_id}" && -z "${capability_bundle_id}" && -z "${receipt_id}" ]]; then
            qualification_only_cancellation=true
          fi
          platform_terminated=false
          capability_may_have_started=false
          if [[ "${publish_result}" == "cancelled" && "${publication_preparation_interrupted}" != "true" && "${qualification_only_cancellation}" != "true" ]]; then
            platform_terminated=true
          elif [[ "${publish_result}" == "failure" && -z "${capability_bundle_id}" ]]; then
            platform_terminated=true
          fi
          if [[ -n "${capability_marker_id}" ]]; then
            capability_may_have_started=true
          fi
          if [[ "${platform_terminated}" == "true" ]]; then
            args+=(--platform-terminated)
          fi
          if [[ "${capability_may_have_started}" == "true" ]]; then
            args+=(--capability-may-have-started)
          fi
          mkdir -p .wdv3/final-attempt
          set +e
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release finalize-live \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --attempt-binding ".wdv3/input/${{ needs.admit.outputs.attempt-artifact-name }}" \
            --attempt-binding-digest "${{ needs.admit.outputs.attempt-digest }}" \
            --attempt-binding-artifact-id "${{ needs.admit.outputs.attempt-artifact-id }}" \
            --attempt-binding-artifact-digest "${{ needs.admit.outputs.attempt-artifact-digest }}" \
            --qualification-snapshot ".wdv3/input/${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.qualification-finalizer.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-digest }}" \
            --qualification-decision ".wdv3/input/${{ needs.qualification-finalizer.outputs.decision-artifact-name }}" \
            --qualification-decision-digest "${{ needs.qualification-finalizer.outputs.decision-digest }}" \
            --qualification-decision-artifact-id "${{ needs.qualification-finalizer.outputs.decision-artifact-id }}" \
            --qualification-decision-artifact-digest "${{ needs.qualification-finalizer.outputs.decision-artifact-digest }}" \
            "${args[@]}" \
            --outcome-output .wdv3/final-attempt/attempt-outcome.json \
            --summary-output .wdv3/final-attempt/attempt-summary.md \
            --github-step-summary "${GITHUB_STEP_SUMMARY}" \
            --github-output "${GITHUB_OUTPUT}"
          status=$?
          set -e
          if [[ "${publication_preparation_interrupted}" == "true" && -f .wdv3/final-attempt/attempt-summary.md ]]; then
            {
              printf '\n## Publication preparation interruption\n\n'
              printf '%s\n' "- Qualification result: ${qualification_result}"
              printf '%s\n' "- Observation job result: ${observation_result}"
              printf '%s\n' "- Materialization job result: ${materialization_result}"
              printf '%s\n' "- Publisher job result: ${publish_result}"
              printf '%s\n' "- Durable Publication Snapshot: absent"
              printf '%s\n' "- Capability path started: no"
              printf '%s\n' "- Workflow cancellation observed: ${workflow_cancelled}"
            } | tee -a .wdv3/final-attempt/attempt-summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          outcome_digest="$(sha256sum .wdv3/final-attempt/attempt-outcome.json | cut -d' ' -f1)"
          echo "final-artifact-name=wdv3-live-buddy-attempt-outcome-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${outcome_digest}" >> "${GITHUB_OUTPUT}"
          echo "finalizer-status=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"
      - name: Upload final Attempt Outcome and summary
        id: upload-final
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.finalize.outputs.final-artifact-name }}
          path: .wdv3/final-attempt
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          include-hidden-files: true
      - name: Propagate finalization status
        if: always()
        run: |
          if [[ "${{ steps.finalize.outcome }}" == "failure" || "${{ steps.upload-final.outcome }}" == "failure" || "${{ steps.finalize.outputs.finalizer-status }}" != "0" ]]; then
            exit 1
          fi
