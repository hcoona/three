            --output-role artifact-contents-evidence \
            --output .wdv3/artifact-contents-evidence.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Run install-import mechanics
        id: install
        if: needs.build-tarball.outputs.release-artifact-artifact-id != '' && needs.build-tarball.outputs.tarball-artifact-id != ''
        env:
          TARBALL_NAME: ${{ needs.build-tarball.outputs.tarball-artifact-name }}
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release run-install-import \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --purpose "${WDV3_PURPOSE}" \
            --qualification-snapshot ".wdv3/input/${{ needs.build-tarball.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.build-tarball.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.build-tarball.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.build-tarball.outputs.qualification-snapshot-artifact-digest }}" \
            --adapter-context ".wdv3/input/${{ needs.build-tarball.outputs.adapter-context-artifact-name }}" \
            --adapter-context-digest "${{ needs.build-tarball.outputs.adapter-context-digest }}" \
            --adapter-context-artifact-id "${{ needs.build-tarball.outputs.adapter-context-artifact-id }}" \
            --adapter-context-artifact-digest "${{ needs.build-tarball.outputs.adapter-context-artifact-digest }}" \
            --release-artifact ".wdv3/input/${{ needs.build-tarball.outputs.release-artifact-artifact-name }}" \
            --release-artifact-digest "${{ needs.build-tarball.outputs.release-artifact-digest }}" \
            --release-artifact-artifact-id "${{ needs.build-tarball.outputs.release-artifact-artifact-id }}" \
            --release-artifact-artifact-digest "${{ needs.build-tarball.outputs.release-artifact-artifact-digest }}" \
            --tarball ".wdv3/input/${TARBALL_NAME}" \
            --output .wdv3/install-import-evidence.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Form incomplete install-import Evidence
        id: incomplete-install
        if: needs.build-tarball.outputs.release-artifact-artifact-id == '' || needs.build-tarball.outputs.tarball-artifact-id == ''
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release form-incomplete-evidence \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --purpose "${WDV3_PURPOSE}" \
            --qualification-snapshot ".wdv3/input/${{ needs.build-tarball.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.build-tarball.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.build-tarball.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.build-tarball.outputs.qualification-snapshot-artifact-digest }}" \
            --obligation-id release:quality:npm-install-import \
            --output-role install-import-evidence \
            --output .wdv3/install-import-evidence.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Materialize exact npm qualification basenames
        id: names
        env:
          CONTENTS_DIGEST: ${{ steps.contents.outputs.artifact-contents-evidence-digest || steps.incomplete-contents.outputs.artifact-contents-evidence-digest }}
          INSTALL_DIGEST: ${{ steps.install.outputs.install-import-evidence-digest || steps.incomplete-install.outputs.install-import-evidence-digest }}
        run: |
          contents_name="wdv3-live-buddy-artifact-contents-evidence-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${CONTENTS_DIGEST#sha256:}.json"
          install_name="wdv3-live-buddy-install-import-evidence-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${INSTALL_DIGEST#sha256:}.json"
          mv .wdv3/artifact-contents-evidence.json ".wdv3/${contents_name}"
          mv .wdv3/install-import-evidence.json ".wdv3/${install_name}"
          echo "contents-evidence-name=${contents_name}" >> "${GITHUB_OUTPUT}"
          echo "install-evidence-name=${install_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload artifact-contents Evidence
        id: upload-contents
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.names.outputs.contents-evidence-name }}
          path: .wdv3/${{ steps.names.outputs.contents-evidence-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Upload install-import Evidence
        id: upload-install
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.names.outputs.install-evidence-name }}
