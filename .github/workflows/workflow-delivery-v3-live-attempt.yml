          CONTENTS_DIGEST: ${{ needs.npm-artifact-qualification.outputs.contents-evidence-digest }}
          CONTENTS_UPLOAD: ${{ needs.npm-artifact-qualification.outputs.contents-evidence-artifact-digest }}
          INSTALL_ID: ${{ needs.npm-artifact-qualification.outputs.install-evidence-artifact-id }}
          INSTALL_DIGEST: ${{ needs.npm-artifact-qualification.outputs.install-evidence-digest }}
          INSTALL_UPLOAD: ${{ needs.npm-artifact-qualification.outputs.install-evidence-artifact-digest }}
          ARTIFACT_ID: ${{ needs.build-tarball.outputs.release-artifact-artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.build-tarball.outputs.release-artifact-digest }}
          ARTIFACT_UPLOAD: ${{ needs.build-tarball.outputs.release-artifact-artifact-digest }}
        run: |
          args=()
          add_record() {
            local role="$1" path="$2" digest="$3" id="$4" upload="$5"
            if [[ -z "${id}" ]]; then
              return 0
            fi
            if [[ -z "${digest}" || -z "${upload}" ]]; then
              echo "::error::${role} has artifact ID but missing digest metadata" >&2
              exit 1
            fi
            if [[ ! -f "${path}" ]]; then
              echo "::error::${role} artifact ID ${id} was present but ${path} was not downloaded" >&2
              exit 1
            fi
            args+=(
              "--${role}" "${path}"
              "--${role}-digest" "${digest}"
              "--${role}-artifact-id" "${id}"
              "--${role}-artifact-digest" "${upload}"
            )
          }
          add_record build-evidence ".wdv3/input/${{ needs.build-tarball.outputs.build-evidence-artifact-name }}" "${BUILD_DIGEST}" "${BUILD_ID}" "${BUILD_UPLOAD}"
          add_record project-test-evidence ".wdv3/input/${{ needs.project-test.outputs.evidence-artifact-name }}" "${TEST_DIGEST}" "${TEST_ID}" "${TEST_UPLOAD}"
          add_record artifact-contents-evidence ".wdv3/input/${{ needs.npm-artifact-qualification.outputs.contents-evidence-artifact-name }}" "${CONTENTS_DIGEST}" "${CONTENTS_ID}" "${CONTENTS_UPLOAD}"
          add_record install-import-evidence ".wdv3/input/${{ needs.npm-artifact-qualification.outputs.install-evidence-artifact-name }}" "${INSTALL_DIGEST}" "${INSTALL_ID}" "${INSTALL_UPLOAD}"
          add_record release-artifact ".wdv3/input/${{ needs.build-tarball.outputs.release-artifact-artifact-name }}" "${ARTIFACT_DIGEST}" "${ARTIFACT_ID}" "${ARTIFACT_UPLOAD}"
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release finalize-qualification \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --purpose "${WDV3_PURPOSE}" \
            --qualification-snapshot ".wdv3/input/${{ needs.build-tarball.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.build-tarball.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.build-tarball.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.build-tarball.outputs.qualification-snapshot-artifact-digest }}" \
            "${args[@]}" \
            --output .wdv3/qualification-decision.json \
            --github-output "${GITHUB_OUTPUT}"
          digest="$(sha256sum .wdv3/qualification-decision.json | cut -d' ' -f1)"
          artifact_name="wdv3-live-buddy-qualification-decision-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${digest}.json"
          mv .wdv3/qualification-decision.json ".wdv3/${artifact_name}"
          echo "qualification-decision-artifact-name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload Qualification Decision
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.finalize.outputs.qualification-decision-artifact-name }}
          path: .wdv3/${{ steps.finalize.outputs.qualification-decision-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  observe-github-packages:
    name: Observe GitHub Packages destination
    if: needs.qualification-finalizer.outputs.qualification-result == 'success'
    needs: qualification-finalizer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      qualification-snapshot-artifact-id: ${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-id }}
      qualification-snapshot-artifact-digest: ${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-digest }}
      qualification-snapshot-artifact-name: ${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-name }}
      qualification-snapshot-digest: ${{ needs.qualification-finalizer.outputs.qualification-snapshot-digest }}
      adapter-context-artifact-id: ${{ needs.qualification-finalizer.outputs.adapter-context-artifact-id }}
      adapter-context-artifact-digest: ${{ needs.qualification-finalizer.outputs.adapter-context-artifact-digest }}
      adapter-context-artifact-name: ${{ needs.qualification-finalizer.outputs.adapter-context-artifact-name }}
      adapter-context-digest: ${{ needs.qualification-finalizer.outputs.adapter-context-digest }}
      release-artifact-artifact-id: ${{ needs.qualification-finalizer.outputs.release-artifact-artifact-id }}
      release-artifact-artifact-digest: ${{ needs.qualification-finalizer.outputs.release-artifact-artifact-digest }}
      release-artifact-artifact-name: ${{ needs.qualification-finalizer.outputs.release-artifact-artifact-name }}
      release-artifact-digest: ${{ needs.qualification-finalizer.outputs.release-artifact-digest }}
      decision-artifact-id: ${{ needs.qualification-finalizer.outputs.decision-artifact-id }}
      decision-artifact-digest: ${{ needs.qualification-finalizer.outputs.decision-artifact-digest }}
      decision-artifact-name: ${{ needs.qualification-finalizer.outputs.decision-artifact-name }}
      decision-digest: ${{ needs.qualification-finalizer.outputs.decision-digest }}
      observation-set-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      observation-set-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      observation-set-artifact-name: ${{ steps.observe.outputs.observation-set-artifact-name }}
      observation-set-digest: ${{ steps.observe.outputs.observation-digest }}
      tarball-artifact-id: ${{ needs.qualification-finalizer.outputs.tarball-artifact-id }}
      tarball-artifact-digest: ${{ needs.qualification-finalizer.outputs.tarball-artifact-digest }}
      tarball-artifact-name: ${{ needs.qualification-finalizer.outputs.tarball-artifact-name }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.9'
      - name: Download Qualification Snapshot by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Qualification Decision by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.decision-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Adapter context by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.adapter-context-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Release Artifact record by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.release-artifact-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Observe exact GitHub Packages state
        id: observe
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release observe-github-packages \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --qualification-snapshot ".wdv3/input/${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.qualification-finalizer.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.qualification-finalizer.outputs.qualification-snapshot-artifact-digest }}" \
            --qualification-decision ".wdv3/input/${{ needs.qualification-finalizer.outputs.decision-artifact-name }}" \
            --qualification-decision-digest "${{ needs.qualification-finalizer.outputs.decision-digest }}" \
            --qualification-decision-artifact-id "${{ needs.qualification-finalizer.outputs.decision-artifact-id }}" \
            --qualification-decision-artifact-digest "${{ needs.qualification-finalizer.outputs.decision-artifact-digest }}" \
            --adapter-context ".wdv3/input/${{ needs.qualification-finalizer.outputs.adapter-context-artifact-name }}" \
            --adapter-context-digest "${{ needs.qualification-finalizer.outputs.adapter-context-digest }}" \
            --adapter-context-artifact-id "${{ needs.qualification-finalizer.outputs.adapter-context-artifact-id }}" \
            --adapter-context-artifact-digest "${{ needs.qualification-finalizer.outputs.adapter-context-artifact-digest }}" \
            --release-artifact ".wdv3/input/${{ needs.qualification-finalizer.outputs.release-artifact-artifact-name }}" \
            --release-artifact-digest "${{ needs.qualification-finalizer.outputs.release-artifact-digest }}" \
            --release-artifact-artifact-id "${{ needs.qualification-finalizer.outputs.release-artifact-artifact-id }}" \
            --release-artifact-artifact-digest "${{ needs.qualification-finalizer.outputs.release-artifact-artifact-digest }}" \
            --github-token "${GITHUB_TOKEN}" \
            --output .wdv3/observation-set.json \
            --github-output "${GITHUB_OUTPUT}"
          digest="$(sha256sum .wdv3/observation-set.json | cut -d' ' -f1)"
          artifact_name="wdv3-live-buddy-observation-set-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${digest}.json"
          mv .wdv3/observation-set.json ".wdv3/${artifact_name}"
          echo "observation-set-artifact-name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload Observation Record set
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.observe.outputs.observation-set-artifact-name }}
          path: .wdv3/${{ steps.observe.outputs.observation-set-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  materialize-publication:
    name: Materialize publication Snapshot and reviewer summary
    needs: observe-github-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      qualification-snapshot-artifact-id: ${{ needs.observe-github-packages.outputs.qualification-snapshot-artifact-id }}
      qualification-snapshot-artifact-digest: ${{ needs.observe-github-packages.outputs.qualification-snapshot-artifact-digest }}
      qualification-snapshot-artifact-name: ${{ needs.observe-github-packages.outputs.qualification-snapshot-artifact-name }}
      qualification-snapshot-digest: ${{ needs.observe-github-packages.outputs.qualification-snapshot-digest }}
      decision-artifact-id: ${{ needs.observe-github-packages.outputs.decision-artifact-id }}
      decision-artifact-digest: ${{ needs.observe-github-packages.outputs.decision-artifact-digest }}
      decision-artifact-name: ${{ needs.observe-github-packages.outputs.decision-artifact-name }}
      decision-digest: ${{ needs.observe-github-packages.outputs.decision-digest }}
      release-artifact-artifact-id: ${{ needs.observe-github-packages.outputs.release-artifact-artifact-id }}
      release-artifact-artifact-digest: ${{ needs.observe-github-packages.outputs.release-artifact-artifact-digest }}
      release-artifact-artifact-name: ${{ needs.observe-github-packages.outputs.release-artifact-artifact-name }}
      release-artifact-digest: ${{ needs.observe-github-packages.outputs.release-artifact-digest }}
      adapter-context-artifact-id: ${{ needs.observe-github-packages.outputs.adapter-context-artifact-id }}
      adapter-context-artifact-digest: ${{ needs.observe-github-packages.outputs.adapter-context-artifact-digest }}
      adapter-context-artifact-name: ${{ needs.observe-github-packages.outputs.adapter-context-artifact-name }}
      adapter-context-digest: ${{ needs.observe-github-packages.outputs.adapter-context-digest }}
      tarball-artifact-id: ${{ needs.observe-github-packages.outputs.tarball-artifact-id }}
      tarball-artifact-digest: ${{ needs.observe-github-packages.outputs.tarball-artifact-digest }}
      tarball-artifact-name: ${{ needs.observe-github-packages.outputs.tarball-artifact-name }}
      publication-snapshot-artifact-id: ${{ steps.upload-snapshot.outputs.artifact-id }}
      publication-snapshot-artifact-digest: ${{ steps.upload-snapshot.outputs.artifact-digest }}
      publication-snapshot-artifact-name: ${{ steps.names.outputs.publication-snapshot-name }}
      publication-snapshot-digest: ${{ steps.materialize.outputs.publication-snapshot-digest }}
      reviewer-artifact-id: ${{ steps.upload-reviewer.outputs.artifact-id }}
      reviewer-artifact-digest: ${{ steps.upload-reviewer.outputs.artifact-digest }}
      reviewer-artifact-url: ${{ steps.upload-reviewer.outputs.artifact-url }}
      reviewer-artifact-name: ${{ steps.names.outputs.reviewer-name }}
      reviewer-digest: ${{ steps.materialize.outputs.reviewer-digest }}
      reviewer-formatter-input-base64: ${{ steps.bind.outputs.reviewer-formatter-input-base64 }}
      publish-required: ${{ steps.materialize.outputs.publish-required }}
      resource-concurrency-key: ${{ steps.materialize.outputs.resource-concurrency-key }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.9'
      - name: Download Observation Record set by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.observe-github-packages.outputs.observation-set-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Qualification Snapshot by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.observe-github-packages.outputs.qualification-snapshot-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Qualification Decision by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.observe-github-packages.outputs.decision-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Release Artifact by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.observe-github-packages.outputs.release-artifact-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Materialize immutable publication and reviewer payload
        id: materialize
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release materialize-publication \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --qualification-snapshot ".wdv3/input/${{ needs.observe-github-packages.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.observe-github-packages.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.observe-github-packages.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.observe-github-packages.outputs.qualification-snapshot-artifact-digest }}" \
            --qualification-decision ".wdv3/input/${{ needs.observe-github-packages.outputs.decision-artifact-name }}" \
            --qualification-decision-digest "${{ needs.observe-github-packages.outputs.decision-digest }}" \
            --qualification-decision-artifact-id "${{ needs.observe-github-packages.outputs.decision-artifact-id }}" \
            --qualification-decision-artifact-digest "${{ needs.observe-github-packages.outputs.decision-artifact-digest }}" \
            --release-artifact ".wdv3/input/${{ needs.observe-github-packages.outputs.release-artifact-artifact-name }}" \
            --release-artifact-digest "${{ needs.observe-github-packages.outputs.release-artifact-digest }}" \
            --release-artifact-artifact-id "${{ needs.observe-github-packages.outputs.release-artifact-artifact-id }}" \
            --release-artifact-artifact-digest "${{ needs.observe-github-packages.outputs.release-artifact-artifact-digest }}" \
            --observation ".wdv3/input/${{ needs.observe-github-packages.outputs.observation-set-artifact-name }}" \
            --observation-digest "${{ needs.observe-github-packages.outputs.observation-set-digest }}" \
            --observation-artifact-id "${{ needs.observe-github-packages.outputs.observation-set-artifact-id }}" \
            --observation-artifact-digest "${{ needs.observe-github-packages.outputs.observation-set-artifact-digest }}" \
            --output .wdv3/publication-snapshot.json \
            --summary-output .wdv3/reviewer-summary.md \
            --formatter-input-output .wdv3/reviewer-formatter-input.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Materialize exact publication basenames
        id: names
        run: |
          snapshot_digest="${{ steps.materialize.outputs.publication-snapshot-digest }}"
          reviewer_digest="${{ steps.materialize.outputs.reviewer-digest }}"
          snapshot_name="wdv3-live-buddy-publication-snapshot-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${snapshot_digest#sha256:}.json"
          reviewer_name="wdv3-live-buddy-reviewer-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${reviewer_digest#sha256:}"
          mv .wdv3/publication-snapshot.json ".wdv3/${snapshot_name}"
          mkdir -p ".wdv3/${reviewer_name}"
          cp ".wdv3/${snapshot_name}" ".wdv3/${reviewer_name}/publication-snapshot.json"
          mv .wdv3/reviewer-summary.md ".wdv3/${reviewer_name}/reviewer-summary.md"
          mv .wdv3/reviewer-formatter-input.json ".wdv3/${reviewer_name}/reviewer-formatter-input.json"
          echo "publication-snapshot-name=${snapshot_name}" >> "${GITHUB_OUTPUT}"
          echo "reviewer-name=${reviewer_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload Publication Snapshot
        id: upload-snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.names.outputs.publication-snapshot-name }}
          path: .wdv3/${{ steps.names.outputs.publication-snapshot-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Upload reviewer artifact
        id: upload-reviewer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.names.outputs.reviewer-name }}
          path: .wdv3/${{ steps.names.outputs.reviewer-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          include-hidden-files: true
      - name: Bind reviewer artifact transport to exact payloads
        id: bind
        run: |
          # shellcheck disable=SC2129
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release bind-reviewer-artifact \
            --formatter-input ".wdv3/${{ steps.names.outputs.reviewer-name }}/reviewer-formatter-input.json" \
            --publication-snapshot ".wdv3/${{ steps.names.outputs.reviewer-name }}/publication-snapshot.json" \
            --reviewer-summary ".wdv3/${{ steps.names.outputs.reviewer-name }}/reviewer-summary.md" \
            --reviewer-artifact-id "${{ steps.upload-reviewer.outputs.artifact-id }}" \
            --reviewer-artifact-digest "${{ steps.upload-reviewer.outputs.artifact-digest }}" \
            --snapshot-payload-digest "${{ steps.materialize.outputs.publication-snapshot-payload-digest }}" \
            --summary-payload-digest "${{ steps.materialize.outputs.reviewer-digest }}" \
            --output .wdv3/bound-reviewer-formatter-input.json \
            --github-output "${GITHUB_OUTPUT}"
          echo "reviewer-formatter-input-base64=$(base64 -w0 .wdv3/bound-reviewer-formatter-input.json)" >> "${GITHUB_OUTPUT}"
      - name: Publish completed reviewer summary and artifact link
        if: steps.upload-reviewer.outcome == 'success'
        run: |
          cat ".wdv3/${{ steps.names.outputs.reviewer-name }}/reviewer-summary.md" >> "${GITHUB_STEP_SUMMARY}"
          printf '\n[Download immutable reviewer artifact](%s)\n' "${{ steps.upload-reviewer.outputs.artifact-url }}" >> "${GITHUB_STEP_SUMMARY}"

  approval:
    name: Human approval and same-revision Authorization
    needs: materialize-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    environment:
      name: workflow-delivery-v3-buddy-smoke-approval
      url: ${{ needs.materialize-publication.outputs.reviewer-artifact-url }}
    outputs:
      authorization-artifact-name: ${{ steps.authorize.outputs.authorization-artifact-name }}
      authorization-digest: ${{ steps.authorize.outputs.authorization-digest }}
      authorization-base64: ${{ steps.authorize.outputs.authorization-base64 }}
      reviewer-formatter-input-base64: ${{ needs.materialize-publication.outputs.reviewer-formatter-input-base64 }}
      publication-snapshot-artifact-id: ${{ needs.materialize-publication.outputs.publication-snapshot-artifact-id }}
      publication-snapshot-artifact-digest: ${{ needs.materialize-publication.outputs.publication-snapshot-artifact-digest }}
      publication-snapshot-artifact-name: ${{ needs.materialize-publication.outputs.publication-snapshot-artifact-name }}
      publication-snapshot-digest: ${{ needs.materialize-publication.outputs.publication-snapshot-digest }}
      reviewer-artifact-id: ${{ needs.materialize-publication.outputs.reviewer-artifact-id }}
      reviewer-artifact-digest: ${{ needs.materialize-publication.outputs.reviewer-artifact-digest }}
      reviewer-artifact-name: ${{ needs.materialize-publication.outputs.reviewer-artifact-name }}
      reviewer-digest: ${{ needs.materialize-publication.outputs.reviewer-digest }}
      publish-required: ${{ needs.materialize-publication.outputs.publish-required }}
      resource-concurrency-key: ${{ needs.materialize-publication.outputs.resource-concurrency-key }}
      qualification-snapshot-artifact-id: ${{ needs.materialize-publication.outputs.qualification-snapshot-artifact-id }}
      qualification-snapshot-artifact-digest: ${{ needs.materialize-publication.outputs.qualification-snapshot-artifact-digest }}
      qualification-snapshot-artifact-name: ${{ needs.materialize-publication.outputs.qualification-snapshot-artifact-name }}
      qualification-snapshot-digest: ${{ needs.materialize-publication.outputs.qualification-snapshot-digest }}
      decision-artifact-id: ${{ needs.materialize-publication.outputs.decision-artifact-id }}
      decision-artifact-digest: ${{ needs.materialize-publication.outputs.decision-artifact-digest }}
      decision-artifact-name: ${{ needs.materialize-publication.outputs.decision-artifact-name }}
      decision-digest: ${{ needs.materialize-publication.outputs.decision-digest }}
      release-artifact-artifact-id: ${{ needs.materialize-publication.outputs.release-artifact-artifact-id }}
      release-artifact-artifact-digest: ${{ needs.materialize-publication.outputs.release-artifact-artifact-digest }}
      release-artifact-artifact-name: ${{ needs.materialize-publication.outputs.release-artifact-artifact-name }}
      release-artifact-digest: ${{ needs.materialize-publication.outputs.release-artifact-digest }}
      adapter-context-artifact-id: ${{ needs.materialize-publication.outputs.adapter-context-artifact-id }}
      adapter-context-artifact-digest: ${{ needs.materialize-publication.outputs.adapter-context-artifact-digest }}
      adapter-context-artifact-name: ${{ needs.materialize-publication.outputs.adapter-context-artifact-name }}
      adapter-context-digest: ${{ needs.materialize-publication.outputs.adapter-context-digest }}
      tarball-artifact-id: ${{ needs.materialize-publication.outputs.tarball-artifact-id }}
      tarball-artifact-digest: ${{ needs.materialize-publication.outputs.tarball-artifact-digest }}
      tarball-artifact-name: ${{ needs.materialize-publication.outputs.tarball-artifact-name }}
    steps:
      - name: Fetch exact public target and format Authorization
        id: authorize
        env:
          REVIEWER_FORMATTER_INPUT_BASE64: ${{ needs.materialize-publication.outputs.reviewer-formatter-input-base64 }}
        run: |
          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::selected target is not an exact lowercase SHA" >&2
            exit 1
          fi
          git init .wdv3/exact-target
          git -C .wdv3/exact-target fetch --depth=1 https://github.com/hcoona/three.git "${GITHUB_SHA}"
          git -C .wdv3/exact-target checkout --detach FETCH_HEAD
          actual="$(git -C .wdv3/exact-target rev-parse HEAD)"
          if [[ "${actual}" != "${GITHUB_SHA}" ]]; then
            echo "::error::fetched revision mismatch" >&2
            exit 1
          fi
          if git -C .wdv3/exact-target symbolic-ref -q HEAD; then
            echo "::error::exact target checkout is not detached" >&2
            exit 1
          fi
          printf '%s' "${REVIEWER_FORMATTER_INPUT_BASE64}" | base64 -d > .wdv3/bound-reviewer-formatter-input.json
          jobs_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100"
          python3 - "${jobs_url}" "${GITHUB_SHA}" "${GITHUB_RUN_ATTEMPT}" > .wdv3/approval-job.env <<'PY'
          import json
          import sys
          import urllib.request

          expected_name = "Run same-revision Buddy live Attempt / Human approval and same-revision Authorization"
          request = urllib.request.Request(
              sys.argv[1],
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "three-workflow-delivery-v3",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              document = json.load(response)
          jobs = [
              job
              for job in document.get("jobs", [])
              if job.get("name") == expected_name
              and job.get("head_sha") == sys.argv[2]
              and str(job.get("run_attempt")) == sys.argv[3]
          ]
          if len(jobs) != 1:
              raise SystemExit("approval job correlation is not exact")
          job = jobs[0]
          job_id = job.get("id")
          check_run_url = job.get("check_run_url")
          if (
              type(job_id) is not int
              or job_id <= 0
              or type(check_run_url) is not str
              or not check_run_url.startswith(
                  "https://api.github.com/repos/"
              )
              or not check_run_url.rsplit("/", 1)[-1].isdigit()
          ):
              raise SystemExit("approval job/check-run identity is malformed")
          print(f"approval_job_id={job_id}")
          print(f"approval_check_run_id={check_run_url.rsplit('/', 1)[-1]}")
          PY
          source .wdv3/approval-job.env
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PYTHONPATH=".wdv3/exact-target/src/public/lib/three-workflow-delivery-v3/src" \
            python3 ".wdv3/exact-target/src/public/lib/three-workflow-delivery-v3/src/three_workflow_delivery_v3/authorization_formatter.py" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${GITHUB_SHA}" \
            --formatter-input .wdv3/bound-reviewer-formatter-input.json \
            --approval-job-id "${approval_job_id}" \
            --completed-at "${completed_at}" \
            --control "workflow-delivery-v3:${GITHUB_SHA}" \
            --output .wdv3/authorization.json \
            --github-output "${GITHUB_OUTPUT}"
          digest="$(sha256sum .wdv3/authorization.json | cut -d' ' -f1)"
          name="wdv3-live-buddy-authorization-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${digest}.json"
          mv .wdv3/authorization.json ".wdv3/${name}"
          authorization_base64="$(base64 -w0 ".wdv3/${name}")"
          echo "authorization-artifact-name=${name}" >> "${GITHUB_OUTPUT}"
          echo "authorization-base64=${authorization_base64}" >> "${GITHUB_OUTPUT}"

  approval-finalizer:
    name: Finalize approval and admit capability
    if: always() && needs.materialize-publication.result != 'skipped'
    needs: [materialize-publication, approval]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      attempt-artifact-id: ${{ inputs.intent-artifact-id }}
      authorization-artifact-name: ${{ needs.approval.outputs.authorization-artifact-name }}
      authorization-digest: ${{ needs.approval.outputs.authorization-digest }}
      authorization-artifact-id: ${{ steps.upload-authorization.outputs.artifact-id }}
      authorization-artifact-digest: ${{ steps.upload-authorization.outputs.artifact-digest }}
      capability-decision-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      capability-decision-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      capability-decision-artifact-name: ${{ steps.finalize.outputs.capability-decision-artifact-name }}
      capability-decision-digest: ${{ steps.finalize.outputs.capability-decision-digest }}
      capability-result: ${{ steps.finalize.outputs.capability-result }}
      publish-required: ${{ steps.finalize.outputs.publish-required }}
      resource-concurrency-key: ${{ steps.finalize.outputs.resource-concurrency-key }}
      publication-snapshot-artifact-id: ${{ needs.materialize-publication.outputs.publication-snapshot-artifact-id }}
      publication-snapshot-artifact-digest: ${{ needs.materialize-publication.outputs.publication-snapshot-artifact-digest }}
      publication-snapshot-artifact-name: ${{ needs.materialize-publication.outputs.publication-snapshot-artifact-name }}
      publication-snapshot-digest: ${{ needs.materialize-publication.outputs.publication-snapshot-digest }}
      qualification-snapshot-artifact-id: ${{ needs.materialize-publication.outputs.qualification-snapshot-artifact-id }}
      qualification-snapshot-artifact-digest: ${{ needs.materialize-publication.outputs.qualification-snapshot-artifact-digest }}
      qualification-snapshot-artifact-name: ${{ needs.materialize-publication.outputs.qualification-snapshot-artifact-name }}
      qualification-snapshot-digest: ${{ needs.materialize-publication.outputs.qualification-snapshot-digest }}
      decision-artifact-id: ${{ needs.materialize-publication.outputs.decision-artifact-id }}
      decision-artifact-digest: ${{ needs.materialize-publication.outputs.decision-artifact-digest }}
      decision-artifact-name: ${{ needs.materialize-publication.outputs.decision-artifact-name }}
      decision-digest: ${{ needs.materialize-publication.outputs.decision-digest }}
      release-artifact-artifact-id: ${{ needs.materialize-publication.outputs.release-artifact-artifact-id }}
      release-artifact-artifact-digest: ${{ needs.materialize-publication.outputs.release-artifact-artifact-digest }}
      release-artifact-artifact-name: ${{ needs.materialize-publication.outputs.release-artifact-artifact-name }}
      release-artifact-digest: ${{ needs.materialize-publication.outputs.release-artifact-digest }}
      adapter-context-artifact-id: ${{ needs.materialize-publication.outputs.adapter-context-artifact-id }}
      adapter-context-artifact-digest: ${{ needs.materialize-publication.outputs.adapter-context-artifact-digest }}
      adapter-context-artifact-name: ${{ needs.materialize-publication.outputs.adapter-context-artifact-name }}
      adapter-context-digest: ${{ needs.materialize-publication.outputs.adapter-context-digest }}
      tarball-artifact-id: ${{ needs.materialize-publication.outputs.tarball-artifact-id }}
      tarball-artifact-digest: ${{ needs.materialize-publication.outputs.tarball-artifact-digest }}
      tarball-artifact-name: ${{ needs.materialize-publication.outputs.tarball-artifact-name }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.9'
      - name: Download Publication Snapshot by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.materialize-publication.outputs.publication-snapshot-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download reviewer payload by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.materialize-publication.outputs.reviewer-artifact-id }}
          path: .wdv3/reviewer
          digest-mismatch: error
      - name: Download Live Eligibility Decision by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.live-eligibility-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Admit exact capability closure
        id: finalize
        continue-on-error: true
        env:
          AUTHORIZATION_BASE64: ${{ needs.approval.outputs.authorization-base64 }}
          REVIEWER_FORMATTER_INPUT_BASE64: ${{ needs.approval.outputs.reviewer-formatter-input-base64 }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2129
          if [[ "${{ needs.approval.result }}" != "success" || -z "${AUTHORIZATION_BASE64}" ]]; then
            echo "approval-contract-result=unknown-replayable-approval-contract" >> "${GITHUB_OUTPUT}"
            echo "capability-result=blocked" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          printf '%s' "${AUTHORIZATION_BASE64}" | base64 -d > ".wdv3/${{ needs.approval.outputs.authorization-artifact-name }}"
          if [[ "${{ needs.materialize-publication.outputs.publish-required }}" != "true" ]]; then
            {
              echo "capability-result=success"
              echo "publish-required=false"
              echo "resource-concurrency-key=${{ needs.materialize-publication.outputs.resource-concurrency-key }}"
              echo "admission-status=0"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          printf '%s' "${REVIEWER_FORMATTER_INPUT_BASE64}" | base64 -d > .wdv3/bound-reviewer-formatter-input.json
          set +e
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release admit-capability \
            --github-token "${GITHUB_TOKEN}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --authorization ".wdv3/${{ needs.approval.outputs.authorization-artifact-name }}" \
            --authorization-digest "${{ needs.approval.outputs.authorization-digest }}" \
            --authorization-artifact-id "1" \
            --authorization-artifact-digest "sha256:$(sha256sum .wdv3/${{ needs.approval.outputs.authorization-artifact-name }} | cut -d' ' -f1)" \
            --publication-snapshot ".wdv3/input/${{ needs.materialize-publication.outputs.publication-snapshot-artifact-name }}" \
            --publication-snapshot-digest "${{ needs.materialize-publication.outputs.publication-snapshot-digest }}" \
            --publication-snapshot-artifact-id "${{ needs.materialize-publication.outputs.publication-snapshot-artifact-id }}" \
            --publication-snapshot-artifact-digest "${{ needs.materialize-publication.outputs.publication-snapshot-artifact-digest }}" \
            --reviewer-summary ".wdv3/reviewer/reviewer-summary.md" \
            --reviewer-summary-artifact-id "${{ needs.materialize-publication.outputs.reviewer-artifact-id }}" \
            --reviewer-summary-artifact-digest "${{ needs.materialize-publication.outputs.reviewer-artifact-digest }}" \
            --live-eligibility-decision ".wdv3/input/${{ inputs.live-eligibility-artifact-name }}" \
            --live-eligibility-artifact-id "${{ inputs.live-eligibility-artifact-id }}" \
            --live-eligibility-artifact-digest "${{ inputs.live-eligibility-artifact-digest }}" \
            --live-eligibility-payload-digest "${{ inputs.live-eligibility-digest }}" \
            --control "workflow-delivery-v3:${{ inputs.target-sha }}" \
            --output .wdv3/capability-decision.json \
            --github-output "${GITHUB_OUTPUT}"
          status=$?
          set -e
          digest="$(sha256sum .wdv3/capability-decision.json | cut -d' ' -f1)"
          name="wdv3-live-buddy-capability-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${digest}.json"
          mv .wdv3/capability-decision.json ".wdv3/${name}"
          {
            echo "capability-decision-artifact-name=${name}"
            echo "publish-required=${{ needs.materialize-publication.outputs.publish-required }}"
            echo "resource-concurrency-key=${{ needs.materialize-publication.outputs.resource-concurrency-key }}"
            echo "admission-status=${status}"
          } >> "${GITHUB_OUTPUT}"
      - name: Upload Authorization Record
        id: upload-authorization
        if: always() && needs.approval.result == 'success' && needs.approval.outputs.authorization-artifact-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ needs.approval.outputs.authorization-artifact-name }}
          path: .wdv3/${{ needs.approval.outputs.authorization-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Upload Capability Admission Decision
        id: upload
        if: always() && steps.finalize.outputs.capability-decision-artifact-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.finalize.outputs.capability-decision-artifact-name }}
          path: .wdv3/${{ steps.finalize.outputs.capability-decision-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Propagate capability admission status
        if: always()
        run: |
          if [[ "${{ steps.finalize.outcome }}" == "failure" || "${{ steps.finalize.outputs.admission-status }}" != "0" ]]; then
            exit 1
          fi

  publish-github-packages:
    name: Publish to GitHub Packages
    if: success() && needs.approval-finalizer.outputs.capability-result == 'success' && needs.approval-finalizer.outputs.publish-required == 'true'
    needs: approval-finalizer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    environment: workflow-delivery-v3-buddy-smoke-github-packages
    concurrency:
      group: wdv3-resource-${{ needs.approval-finalizer.outputs.resource-concurrency-key }}
      cancel-in-progress: false
    outputs:
      capability-group-bundle-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      capability-group-bundle-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      capability-group-bundle-artifact-name: ${{ steps.form-bundle.outputs.capability-group-bundle-artifact-name }}
      capability-group-bundle-digest: ${{ steps.form-bundle.outputs.capability-group-bundle-digest }}
      receipt-artifact-id: ${{ steps.upload-receipt.outputs.artifact-id }}
      receipt-artifact-digest: ${{ steps.upload-receipt.outputs.artifact-digest }}
      receipt-artifact-name: ${{ steps.publish.outputs.receipt-artifact-name }}
      receipt-digest: ${{ steps.publish.outputs.receipt-digest }}
      mutation-marker-artifact-id: ${{ steps.upload-mutation-marker.outputs.artifact-id }}
      mutation-marker-artifact-digest: ${{ steps.upload-mutation-marker.outputs.artifact-digest }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.9'
      - name: Install exact toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install: true
      - name: Download publisher closure by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.approval-finalizer.outputs.qualification-snapshot-artifact-id }},${{ needs.approval-finalizer.outputs.decision-artifact-id }},${{ needs.approval-finalizer.outputs.adapter-context-artifact-id }},${{ needs.approval-finalizer.outputs.release-artifact-artifact-id }},${{ needs.approval-finalizer.outputs.publication-snapshot-artifact-id }},${{ needs.approval-finalizer.outputs.authorization-artifact-id }},${{ needs.approval-finalizer.outputs.capability-decision-artifact-id }},${{ needs.approval-finalizer.outputs.tarball-artifact-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: Preflight publication without npm mutation
        id: preflight
