    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      exact-satisfied-finalization-proof-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      exact-satisfied-finalization-proof-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      exact-satisfied-finalization-proof-artifact-url: ${{ steps.upload.outputs.artifact-url }}
