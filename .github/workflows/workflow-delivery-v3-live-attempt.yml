name: Workflow Delivery v3 live Attempt

on:
  workflow_call:
    inputs:
      request-id:
        required: true
        type: string
      selected-ref:
        required: true
        type: string
      target-sha:
        required: true
        type: string
      intent-artifact-id:
        required: true
        type: string
      intent-artifact-digest:
        required: true
        type: string
      intent-artifact-name:
        required: true
        type: string
      intent-digest:
        required: true
        type: string
      repository-model-artifact-id:
        required: true
        type: string
      repository-model-artifact-digest:
        required: true
        type: string
      repository-model-artifact-name:
        required: true
        type: string
      repository-model-digest:
        required: true
        type: string
      live-eligibility-artifact-id:
        required: true
        type: string
      live-eligibility-artifact-digest:
        required: true
        type: string
      live-eligibility-artifact-name:
        required: true
        type: string
      live-eligibility-digest:
        required: true
        type: string

permissions:
  contents: read

env:
  WDV3_PACKAGE: three-workflow-delivery-v3
  WDV3_PURPOSE: live-release
  WDV3_PROJECT: src/public/lib/hcoona-release-smoke-npm

jobs:
  admit:
    name: Admit live Attempt
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      identity-admitted: ${{ steps.identity.outputs.identity-admitted }}
      attempt-artifact-id: ${{ steps.upload-attempt.outputs.artifact-id }}
      attempt-artifact-digest: ${{ steps.upload-attempt.outputs.artifact-digest }}
      attempt-artifact-name: ${{ steps.attempt-name.outputs.attempt-name }}
      attempt-digest: ${{ steps.bind.outputs.attempt-binding-digest }}
      request-id: ${{ inputs.request-id }}
      target-sha: ${{ inputs.target-sha }}
    steps:
      - name: Require same-revision Buddy caller
        id: identity
        shell: bash
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TARGET_SHA: ${{ inputs.target-sha }}
        run: |
          set -euo pipefail
          [[ "${CALLER_REPOSITORY}" == "hcoona/three" ]]
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TARGET_SHA}" == "${CALLER_SHA}" ]]
          [[ "${TARGET_SHA}" == "${CALLER_WORKFLOW_SHA}" ]]
          echo "identity-admitted=true" >> "${GITHUB_OUTPUT}"
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
      - name: Download Release Intent by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.intent-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Repository Model by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.repository-model-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Live Eligibility Decision by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.live-eligibility-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Admit downloaded Live Eligibility Decision
        id: live-eligibility
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release admit-live-eligibility \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --intent ".wdv3/input/${{ inputs.intent-artifact-name }}" \
            --intent-digest "${{ inputs.intent-digest }}" \
            --intent-artifact-id "${{ inputs.intent-artifact-id }}" \
            --intent-artifact-digest "${{ inputs.intent-artifact-digest }}" \
            --repository-model ".wdv3/input/${{ inputs.repository-model-artifact-name }}" \
            --repository-model-digest "${{ inputs.repository-model-digest }}" \
            --repository-model-artifact-id "${{ inputs.repository-model-artifact-id }}" \
            --repository-model-artifact-digest "${{ inputs.repository-model-artifact-digest }}" \
            --live-eligibility-decision ".wdv3/input/${{ inputs.live-eligibility-artifact-name }}" \
            --live-eligibility-artifact-id "${{ inputs.live-eligibility-artifact-id }}" \
            --live-eligibility-artifact-digest "${{ inputs.live-eligibility-artifact-digest }}" \
            --live-eligibility-payload-digest "${{ inputs.live-eligibility-digest }}" \
            --output .wdv3/admitted-live-eligibility-decision.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Bind current live Attempt
        id: bind
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release bind-live-attempt \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --intent ".wdv3/input/${{ inputs.intent-artifact-name }}" \
            --intent-digest "${{ inputs.intent-digest }}" \
            --intent-artifact-id "${{ inputs.intent-artifact-id }}" \
            --intent-artifact-digest "${{ inputs.intent-artifact-digest }}" \
            --repository-model ".wdv3/input/${{ inputs.repository-model-artifact-name }}" \
            --repository-model-digest "${{ inputs.repository-model-digest }}" \
            --repository-model-artifact-id "${{ inputs.repository-model-artifact-id }}" \
            --repository-model-artifact-digest "${{ inputs.repository-model-artifact-digest }}" \
            --live-eligibility-decision ".wdv3/input/${{ inputs.live-eligibility-artifact-name }}" \
            --live-eligibility-artifact-id "${{ inputs.live-eligibility-artifact-id }}" \
            --live-eligibility-artifact-digest "${{ inputs.live-eligibility-artifact-digest }}" \
            --live-eligibility-payload-digest "${{ inputs.live-eligibility-digest }}" \
            --output .wdv3/release-attempt.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Materialize exact Attempt basename
        id: attempt-name
        run: |
          attempt_digest="${{ steps.bind.outputs.attempt-binding-digest }}"
          attempt_name="wdv3-live-buddy-attempt-r${GITHUB_RUN_ID}-${attempt_digest#sha256:}.json"
          mv .wdv3/release-attempt.json ".wdv3/${attempt_name}"
          echo "attempt-name=${attempt_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload Release Attempt binding
        id: upload-attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.attempt-name.outputs.attempt-name }}
          path: .wdv3/${{ steps.attempt-name.outputs.attempt-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  plan-qualification:
    name: Plan live qualification
    if: github.run_attempt == 1
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      attempt-artifact-id: ${{ needs.admit.outputs.attempt-artifact-id }}
      attempt-artifact-digest: ${{ needs.admit.outputs.attempt-artifact-digest }}
      attempt-artifact-name: ${{ needs.admit.outputs.attempt-artifact-name }}
      attempt-digest: ${{ needs.admit.outputs.attempt-digest }}
      qualification-snapshot-artifact-id: ${{ steps.upload-snapshot.outputs.artifact-id }}
      qualification-snapshot-artifact-digest: ${{ steps.upload-snapshot.outputs.artifact-digest }}
      qualification-snapshot-artifact-name: ${{ steps.names.outputs.qualification-snapshot-name }}
      qualification-snapshot-digest: ${{ steps.plan.outputs.qualification-snapshot-digest }}
      adapter-context-artifact-id: ${{ steps.upload-context.outputs.artifact-id }}
      adapter-context-artifact-digest: ${{ steps.upload-context.outputs.artifact-digest }}
      adapter-context-artifact-name: ${{ steps.names.outputs.adapter-context-name }}
      adapter-context-digest: ${{ steps.plan.outputs.adapter-context-digest }}
      tarball-artifact-name: ${{ steps.plan.outputs.tarball-artifact-name }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
      - name: Install exact toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install: true
      - name: Download Release Attempt by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.admit.outputs.attempt-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Release Intent by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.intent-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Repository Model by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.repository-model-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Create Qualification Snapshot
        id: plan
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release plan-live-qualification \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --intent ".wdv3/input/${{ inputs.intent-artifact-name }}" \
            --intent-digest "${{ inputs.intent-digest }}" \
            --intent-artifact-id "${{ inputs.intent-artifact-id }}" \
            --intent-artifact-digest "${{ inputs.intent-artifact-digest }}" \
            --repository-model ".wdv3/input/${{ inputs.repository-model-artifact-name }}" \
            --repository-model-digest "${{ inputs.repository-model-digest }}" \
            --repository-model-artifact-id "${{ inputs.repository-model-artifact-id }}" \
            --repository-model-artifact-digest "${{ inputs.repository-model-artifact-digest }}" \
            --attempt-binding ".wdv3/input/${{ needs.admit.outputs.attempt-artifact-name }}" \
            --attempt-binding-digest "${{ needs.admit.outputs.attempt-digest }}" \
            --attempt-binding-artifact-id "${{ needs.admit.outputs.attempt-artifact-id }}" \
            --attempt-binding-artifact-digest "${{ needs.admit.outputs.attempt-artifact-digest }}" \
            --output .wdv3/qualification-snapshot.json \
            --adapter-context-output .wdv3/adapter-context.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Materialize exact plan basenames
        id: names
        run: |
          snapshot_digest="${{ steps.plan.outputs.qualification-snapshot-digest }}"
          context_digest="${{ steps.plan.outputs.adapter-context-digest }}"
          snapshot_name="wdv3-live-buddy-qualification-snapshot-r${GITHUB_RUN_ID}-${snapshot_digest#sha256:}.json"
          context_name="wdv3-live-buddy-adapter-context-r${GITHUB_RUN_ID}-${context_digest#sha256:}.json"
          mv .wdv3/qualification-snapshot.json ".wdv3/${snapshot_name}"
          mv .wdv3/adapter-context.json ".wdv3/${context_name}"
          echo "qualification-snapshot-name=${snapshot_name}" >> "${GITHUB_OUTPUT}"
          echo "adapter-context-name=${context_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload Qualification Snapshot
        id: upload-snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.names.outputs.qualification-snapshot-name }}
          path: .wdv3/${{ steps.names.outputs.qualification-snapshot-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Upload Adapter context
        id: upload-context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.names.outputs.adapter-context-name }}
          path: .wdv3/${{ steps.names.outputs.adapter-context-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  build-tarball:
    name: Build exact npm tarball
    if: github.run_attempt == 1
    needs: plan-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      attempt-artifact-id: ${{ needs.plan-qualification.outputs.attempt-artifact-id }}
      attempt-artifact-digest: ${{ needs.plan-qualification.outputs.attempt-artifact-digest }}
      attempt-artifact-name: ${{ needs.plan-qualification.outputs.attempt-artifact-name }}
      attempt-digest: ${{ needs.plan-qualification.outputs.attempt-digest }}
      qualification-snapshot-artifact-id: ${{ needs.plan-qualification.outputs.qualification-snapshot-artifact-id }}
      qualification-snapshot-artifact-digest: ${{ needs.plan-qualification.outputs.qualification-snapshot-artifact-digest }}
      qualification-snapshot-artifact-name: ${{ needs.plan-qualification.outputs.qualification-snapshot-artifact-name }}
      qualification-snapshot-digest: ${{ needs.plan-qualification.outputs.qualification-snapshot-digest }}
      adapter-context-artifact-id: ${{ needs.plan-qualification.outputs.adapter-context-artifact-id }}
      adapter-context-artifact-digest: ${{ needs.plan-qualification.outputs.adapter-context-artifact-digest }}
      adapter-context-artifact-name: ${{ needs.plan-qualification.outputs.adapter-context-artifact-name }}
      adapter-context-digest: ${{ needs.plan-qualification.outputs.adapter-context-digest }}
      release-artifact-artifact-id: ${{ steps.upload-artifact-record.outputs.artifact-id }}
      release-artifact-artifact-digest: ${{ steps.upload-artifact-record.outputs.artifact-digest }}
      release-artifact-artifact-name: ${{ steps.names.outputs.release-artifact-name }}
      release-artifact-digest: ${{ steps.form.outputs.release-artifact-digest }}
      tarball-artifact-id: ${{ steps.upload-tarball.outputs.artifact-id }}
      tarball-artifact-digest: ${{ steps.upload-tarball.outputs.artifact-digest }}
      tarball-artifact-url: ${{ steps.upload-tarball.outputs.artifact-url }}
      tarball-artifact-name: ${{ needs.plan-qualification.outputs.tarball-artifact-name }}
      build-evidence-artifact-id: ${{ steps.upload-evidence.outputs.artifact-id }}
      build-evidence-artifact-digest: ${{ steps.upload-evidence.outputs.artifact-digest }}
      build-evidence-artifact-name: ${{ steps.names.outputs.build-evidence-name }}
      build-evidence-digest: ${{ steps.form.outputs.build-evidence-digest || steps.build.outputs.build-evidence-digest }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
      - name: Install exact toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install: true
      - name: Download Qualification Snapshot by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.plan-qualification.outputs.qualification-snapshot-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Adapter context by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.plan-qualification.outputs.adapter-context-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Build tarball
        id: build
        env:
          TARBALL_NAME: ${{ needs.plan-qualification.outputs.tarball-artifact-name }}
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release run-build \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --purpose "${WDV3_PURPOSE}" \
            --qualification-snapshot ".wdv3/input/${{ needs.plan-qualification.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.plan-qualification.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.plan-qualification.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.plan-qualification.outputs.qualification-snapshot-artifact-digest }}" \
            --adapter-context ".wdv3/input/${{ needs.plan-qualification.outputs.adapter-context-artifact-name }}" \
            --adapter-context-digest "${{ needs.plan-qualification.outputs.adapter-context-digest }}" \
            --adapter-context-artifact-id "${{ needs.plan-qualification.outputs.adapter-context-artifact-id }}" \
            --adapter-context-artifact-digest "${{ needs.plan-qualification.outputs.adapter-context-artifact-digest }}" \
            --tarball-output ".wdv3/${TARBALL_NAME}" \
            --mechanical-output .wdv3/mechanical-build-result.json \
            --failure-evidence-output .wdv3/build-evidence.json \
            --github-output "${GITHUB_OUTPUT}"
          echo "tarball-name=${TARBALL_NAME}" >> "${GITHUB_OUTPUT}"
      - name: Upload exact npm tarball
        id: upload-tarball
        if: steps.build.outputs.build-status == 'satisfied'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.build.outputs.tarball-name }}
          path: .wdv3/${{ steps.build.outputs.tarball-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Form Release Artifact and build Evidence after upload
        id: form
        if: steps.upload-tarball.outputs.artifact-id != ''
        env:
          TARBALL_NAME: ${{ steps.build.outputs.tarball-name }}
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release form-uploaded-artifact \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --purpose "${WDV3_PURPOSE}" \
            --qualification-snapshot ".wdv3/input/${{ needs.plan-qualification.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.plan-qualification.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.plan-qualification.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.plan-qualification.outputs.qualification-snapshot-artifact-digest }}" \
            --adapter-context ".wdv3/input/${{ needs.plan-qualification.outputs.adapter-context-artifact-name }}" \
            --adapter-context-digest "${{ needs.plan-qualification.outputs.adapter-context-digest }}" \
            --adapter-context-artifact-id "${{ needs.plan-qualification.outputs.adapter-context-artifact-id }}" \
            --adapter-context-artifact-digest "${{ needs.plan-qualification.outputs.adapter-context-artifact-digest }}" \
            --mechanical-result .wdv3/mechanical-build-result.json \
            --tarball ".wdv3/${TARBALL_NAME}" \
            --tarball-artifact-id "${{ steps.upload-tarball.outputs.artifact-id }}" \
            --tarball-artifact-name "${TARBALL_NAME}" \
            --tarball-artifact-url "${{ steps.upload-tarball.outputs.artifact-url }}" \
            --tarball-artifact-digest "${{ steps.upload-tarball.outputs.artifact-digest }}" \
            --artifact-output .wdv3/release-artifact.json \
            --evidence-output .wdv3/build-evidence.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Materialize exact build basenames
        id: names
        if: always() && hashFiles('.wdv3/build-evidence.json') != ''
        env:
          RELEASE_ARTIFACT_DIGEST: ${{ steps.form.outputs.release-artifact-digest }}
          BUILD_EVIDENCE_DIGEST: ${{ steps.form.outputs.build-evidence-digest || steps.build.outputs.build-evidence-digest }}
        run: |
          if [[ -f .wdv3/release-artifact.json ]]; then
            artifact_name="wdv3-live-buddy-release-artifact-r${GITHUB_RUN_ID}-${RELEASE_ARTIFACT_DIGEST#sha256:}.json"
            mv .wdv3/release-artifact.json ".wdv3/${artifact_name}"
            echo "release-artifact-name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          fi
          evidence_name="wdv3-live-buddy-build-evidence-r${GITHUB_RUN_ID}-${BUILD_EVIDENCE_DIGEST#sha256:}.json"
          mv .wdv3/build-evidence.json ".wdv3/${evidence_name}"
          echo "build-evidence-name=${evidence_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload Release Artifact record
        id: upload-artifact-record
        if: steps.names.outputs.release-artifact-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.names.outputs.release-artifact-name }}
          path: .wdv3/${{ steps.names.outputs.release-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Upload build Evidence
        id: upload-evidence
        if: steps.names.outputs.build-evidence-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.names.outputs.build-evidence-name }}
          path: .wdv3/${{ steps.names.outputs.build-evidence-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  project-test:
    name: Run independent project test
    if: github.run_attempt == 1
    needs: plan-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      evidence-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      evidence-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      evidence-artifact-name: ${{ steps.test.outputs.project-test-evidence-artifact-name }}
      evidence-digest: ${{ steps.test.outputs.project-test-evidence-digest }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
      - name: Install exact toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install: true
      - name: Download Qualification Snapshot by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.plan-qualification.outputs.qualification-snapshot-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Adapter context by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
