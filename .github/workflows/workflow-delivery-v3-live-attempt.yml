        with:
          artifact-ids: ${{ needs.observe-github-packages.outputs.observation-set-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Qualification Snapshot by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.observe-github-packages.outputs.qualification-snapshot-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Qualification Decision by artifact ID
