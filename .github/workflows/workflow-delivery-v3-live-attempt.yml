            --qualification-decision-artifact-id "${{ needs.observe-github-packages.outputs.decision-artifact-id }}" \
            --qualification-decision-artifact-digest "${{ needs.observe-github-packages.outputs.decision-artifact-digest }}" \
            --publication-snapshot ".wdv3/${{ steps.names.outputs.publication-snapshot-name }}" \
            --publication-snapshot-digest "${{ steps.materialize.outputs.publication-snapshot-digest }}" \
            --publication-snapshot-artifact-id "${{ steps.upload-snapshot.outputs.artifact-id }}" \
            --publication-snapshot-artifact-digest "${{ steps.upload-snapshot.outputs.artifact-digest }}" \
            --publication-snapshot-artifact-url "${{ steps.upload-snapshot.outputs.artifact-url }}" \
            --publication-snapshot-payload-path "${{ steps.names.outputs.publication-snapshot-name }}" \
            --reviewer-summary ".wdv3/reviewer-summary.md" \
            --reviewer-summary-digest "${{ steps.materialize.outputs.reviewer-digest }}" \
            --reviewer-summary-artifact-id "${{ steps.upload-reviewer.outputs.artifact-id }}" \
            --reviewer-summary-artifact-digest "${{ steps.upload-reviewer.outputs.artifact-digest }}" \
            --reviewer-summary-artifact-url "${{ steps.upload-reviewer.outputs.artifact-url }}" \
            --reviewer-summary-payload-path "reviewer-summary.md" \
            --control "workflow-delivery-v3:${{ inputs.target-sha }}" \
            --output .wdv3/approval-bundle.json \
            --github-output "${GITHUB_OUTPUT}"
          digest="$(sha256sum .wdv3/approval-bundle.json | cut -d' ' -f1)"
          name="wdv3-live-buddy-approval-bundle-r${GITHUB_RUN_ID}-${digest}.json"
          mv .wdv3/approval-bundle.json ".wdv3/${name}"
          echo "approval-bundle-artifact-name=${name}" >> "${GITHUB_OUTPUT}"
      - name: Upload Approval Bundle
        id: upload-bundle
        if: steps.materialize.outputs.publish-required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
