          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Run project-test mechanics
        id: test
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release run-project-test \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${{ inputs.target-sha }}" \
            --purpose "${WDV3_PURPOSE}" \
            --qualification-snapshot ".wdv3/input/${{ needs.plan-qualification.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.plan-qualification.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.plan-qualification.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.plan-qualification.outputs.qualification-snapshot-artifact-digest }}" \
            --adapter-context ".wdv3/input/${{ needs.plan-qualification.outputs.adapter-context-artifact-name }}" \
            --adapter-context-digest "${{ needs.plan-qualification.outputs.adapter-context-digest }}" \
            --adapter-context-artifact-id "${{ needs.plan-qualification.outputs.adapter-context-artifact-id }}" \
            --adapter-context-artifact-digest "${{ needs.plan-qualification.outputs.adapter-context-artifact-digest }}" \
            --output .wdv3/project-test-evidence.json \
            --github-output "${GITHUB_OUTPUT}"
          digest="$(sha256sum .wdv3/project-test-evidence.json | cut -d' ' -f1)"
          artifact_name="wdv3-live-buddy-project-test-evidence-r${GITHUB_RUN_ID}-${digest}.json"
          mv .wdv3/project-test-evidence.json ".wdv3/${artifact_name}"
          echo "project-test-evidence-artifact-name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload project-test Evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.test.outputs.project-test-evidence-artifact-name }}
          path: .wdv3/${{ steps.test.outputs.project-test-evidence-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  npm-artifact-qualification:
    name: Qualify exact npm artifact
    if: always() && github.run_attempt == 1 && needs.build-tarball.result != 'skipped'
    needs: build-tarball
    runs-on: ubuntu-24.04
