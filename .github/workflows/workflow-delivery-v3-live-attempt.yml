            --terminal-artifact-url "${{ steps.upload-mutation-marker.outputs.artifact-url }}" \
            --terminal-payload-path "mutation-marker.json" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Execute one isolated publication command
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLICATION_TERMINAL_REFERENCE: ${{ steps.admit-marker.outputs.publication-terminal-reference }}
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release execute-publication \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
