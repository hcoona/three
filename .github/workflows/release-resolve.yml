name: Resolve Release Inputs (Reusable)

on:
  workflow_call:
    inputs:
      source:
        description: "Resolution mode: 'tag' derives project/version from the release tag; 'manual' uses explicit inputs."
        required: true
        type: string
      python_version:
        description: "Python version for uv helper scripts."
        required: true
        type: string

      # source=tag
      ref_name:
        description: "Tag name (caller passes github.ref_name). Required when source=tag."
        required: false
        type: string
      ref:
        description: "Full ref (caller passes github.ref). Required when source=tag."
        required: false
        type: string

      # source=manual
      project:
        description: "Workspace release project id (unscoped; Python: pyproject.toml project.name; Node/.NET: three.release.yml project.id; exact display-name aliases are canonicalized to that project id; fuzzy matching remains forbidden). Required when source=manual."
        required: false
        type: string
      version:
        description: "Python: canonical PEP 440 form only (no leading v; aliases like '01.0' are rejected; epochs like '1!1.0' are intentionally not supported). Node/.NET: SemVer 2.0.0 (no leading v). Ruby: MAJOR.MINOR.PATCH[.suffix...] (no '-' or '+'; suffix segments are dot-separated [0-9A-Za-z]+ and must include at least one letter). Required when source=manual."
        required: false
        type: string
      target:
        description: >-
          Release target selector or pinned commit. For source=manual, direct
          callers may leave this empty to use HEAD or pass a branch, tag, ref,
          or 40-hex SHA; this workflow resolves it once and outputs a pinned
          commit SHA. For source=tag, callers must pass the pinned 40-hex SHA
          that the tag is expected to peel to.
        required: false
        default: ""
        type: string
      force_update_tag:
        description: "Forward force intent for planning. Official manual runs may later force-update release tags; buddy runs use it only for planner-owned mutable prerelease overwrite. Ignored when source=tag."
        required: false
        default: false
        type: boolean
      run_url:
        description: "Top-level caller-visible run URL to surface in release notes."
        required: false
        default: ""
        type: string

    outputs:
      project:
        value: ${{ jobs.resolve.outputs.project }}
      version:
        value: ${{ jobs.resolve.outputs.version }}
      project_kind:
        value: ${{ jobs.resolve.outputs.project_kind }}
      is_prerelease:
        value: ${{ jobs.resolve.outputs.is_prerelease }}
      is_wxt:
        value: ${{ jobs.resolve.outputs.is_wxt }}
      ruby_version:
        value: ${{ jobs.resolve.outputs.ruby_version }}
      tag_name:
        value: ${{ jobs.resolve.outputs.tag_name }}
      target:
        value: ${{ jobs.resolve.outputs.target }}
      force_update_tag:
        value: ${{ jobs.resolve.outputs.force_update_tag }}
      package_dir:
        value: ${{ jobs.resolve.outputs.package_dir }}
      has_changelog:
        value: ${{ jobs.resolve.outputs.has_changelog }}
      changelog:
        value: ${{ jobs.resolve.outputs.changelog }}
      release_title:
        value: ${{ jobs.resolve.outputs.release_title }}
      run_url:
        value: ${{ jobs.resolve.outputs.run_url }}

jobs:
  resolve:
    name: Resolve release inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      project: ${{ steps.meta.outputs.project }}
      version: ${{ steps.meta.outputs.version }}
      project_kind: ${{ steps.meta.outputs.project_kind }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      is_wxt: ${{ steps.meta.outputs.is_wxt }}
      ruby_version: ${{ steps.meta.outputs.ruby_version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      target: ${{ steps.meta.outputs.target }}
      force_update_tag: ${{ steps.meta.outputs.force_update_tag }}
      package_dir: ${{ steps.meta.outputs.package_dir }}
      has_changelog: ${{ steps.meta.outputs.has_changelog }}
      changelog: ${{ steps.meta.outputs.changelog }}
      release_title: ${{ steps.meta.outputs.release_title }}
      run_url: ${{ steps.meta.outputs.run_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch refs (tags and branches)
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --force --tags
          git fetch --force --prune --all

      - name: Install jq
        uses: dcarbone/install-jq-action@4fcb5062d7ce9bc4382d1a352d19ba3ba2c317c1 # v4.0.1
        with:
          version: '1.7.1'

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          experimental: true
          install: false

      - name: Install fd (mise)
        shell: bash
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mise install fd
          command -v fd
          fd --version

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          version: '0.10.9'
          cache-dependency-glob: 'uv.lock'

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          dotnet tool restore

      - name: Resolve release inputs
        id: meta
        shell: bash
        env:
          SOURCE: ${{ inputs.source }}

          REF_NAME: ${{ inputs.ref_name }}
          REF: ${{ inputs.ref }}

          MANUAL_PROJECT: ${{ inputs.project }}
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_TARGET: ${{ inputs.target }}
          MANUAL_FORCE_UPDATE_TAG: ${{ inputs.force_update_tag }}
          INPUT_RUN_URL: ${{ inputs.run_url }}
        run: |
          set -Eeuo pipefail

          if [[ -n "${INPUT_RUN_URL}" ]]; then
            RUN_URL="${INPUT_RUN_URL}"
          else
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

          # shellcheck disable=SC2153
          source="${SOURCE}"
          if [[ "${source}" != "tag" && "${source}" != "manual" ]]; then
            echo "Invalid source: ${source}. Expected 'tag' or 'manual'." >&2
            exit 1
          fi

          project=""
          version=""
          tag_name=""
          target_input=""

          force_update_tag="false"

          if [[ "${source}" == "tag" ]]; then
            if [[ -z "${REF_NAME}" || -z "${REF}" ]]; then
              echo "source=tag requires inputs.ref_name and inputs.ref." >&2
              exit 1
            fi

            if [[ ! "${REF_NAME}" == release/*/v* ]]; then
              echo "Tag ${REF_NAME} must follow release/<project>/v<version>." >&2
              exit 1
            fi

            project="${REF_NAME#release/}"
            project="${project%%/v*}"
            version="${REF_NAME##*/v}"
            target_input="${MANUAL_TARGET}"

            # Tags are immutable by policy.
            force_update_tag="false"
          else
            project="${MANUAL_PROJECT}"
            version="${MANUAL_VERSION}"
            tag_name=""
            target_input="${MANUAL_TARGET}"

            # GitHub Actions inputs are stringly typed, normalize to strict true/false.
            if [[ "${MANUAL_FORCE_UPDATE_TAG}" == "true" ]]; then
              force_update_tag="true"
            fi
          fi

          if [[ -z "${project}" || -z "${version}" ]]; then
            echo "project or version is empty" >&2
            exit 1
          fi

          if [[ ! "${version}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "Invalid version format for shell safety: ${version}. Allowed characters: A-Z a-z 0-9 . _ + -" >&2
            exit 1
          fi

          if [[ "${source}" == "tag" ]]; then
            if [[ -z "${target_input}" ]]; then
              echo "source=tag requires inputs.target." >&2
              exit 1
            fi

            if [[ "${target_input}" == -* ]]; then
              echo "Release target must not start with '-': ${target_input}" >&2
              exit 1
            fi

            if [[ ! "${target_input}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "source=tag requires a pinned 40-character commit SHA in inputs.target: ${target_input}" >&2
              exit 1
            fi

            commit_suffix='^{commit}'
            if ! resolved_target=$(git rev-parse --verify --end-of-options "${target_input}${commit_suffix}"); then
              echo "Pinned release target '${target_input}' is not available locally." >&2
              exit 1
            fi

            if ! live_tag_target=$(git rev-parse --verify --end-of-options "${REF}${commit_suffix}"); then
              echo "Failed to resolve tag ref '${REF}' to a commit." >&2
              exit 1
            fi

            if [[ "${live_tag_target}" != "${resolved_target}" ]]; then
              echo "Tag ${REF_NAME} no longer peels to pinned target ${resolved_target}." >&2
              exit 1
            fi
          else
            if [[ -z "${target_input}" ]]; then
              resolved_target=$(git rev-parse HEAD)
            else
              resolve_release_target() {
                local target_input="${1}"
                local commit_suffix='^{commit}'
                local is_shallow

                if [[ "${target_input}" == -* ]]; then
                  echo "Release target must not start with '-': ${target_input}" >&2
                  return 1
                fi

                if git rev-parse --verify --end-of-options "${target_input}${commit_suffix}" >/dev/null 2>&1; then
                  git rev-parse --verify --end-of-options "${target_input}${commit_suffix}"
                  return 0
                fi

                is_shallow="$(git rev-parse --is-shallow-repository)"
                if [[ "${target_input}" =~ ^[0-9a-fA-F]{40}$ ]]; then
                  if [[ "${is_shallow}" == "true" ]]; then
                    git fetch --no-tags --unshallow origin
                  fi
                  git fetch --no-tags --prune --tags origin \
                    '+refs/heads/*:refs/remotes/origin/*' \
                    '+refs/tags/*:refs/tags/*'
                else
                  if ! git fetch --no-tags --depth=1 origin "${target_input}"; then
                    if [[ "${is_shallow}" == "true" ]]; then
                      git fetch --no-tags --unshallow origin
                    fi
                    git fetch --no-tags --prune --tags origin \
                      '+refs/heads/*:refs/remotes/origin/*' \
                      '+refs/tags/*:refs/tags/*'
                  fi
                fi

                if git rev-parse --verify --end-of-options "${target_input}${commit_suffix}" >/dev/null 2>&1; then
                  git rev-parse --verify --end-of-options "${target_input}${commit_suffix}"
                  return 0
                fi

                echo "Failed to resolve release target '${target_input}' to a commit." >&2
                return 1
              }

              if ! resolved_target="$(resolve_release_target "${target_input}")"; then
                exit 1
              fi
            fi
          fi

          if [[ -z "${resolved_target}" ]]; then
            echo "Resolved target commit is empty" >&2
            exit 1
          fi

          target="${resolved_target}"

          # Canonicalize display-name aliases to the release project id before
          # project discovery. The downstream project-path detector resolves
          # descriptor-backed ecosystems by canonical release project id, so this
          # keeps alias-authenticated releases on the same path as canonical
          # invocations.
          if ! project_resolution=$(
            uv run python eng/scripts/workflow_release_control.py resolve-project \
              --project "${project}"
          ); then
            echo "Failed to resolve canonical project id for '${project}'." >&2
            exit 1
          fi
          project=$(printf '%s' "${project_resolution}" | jq -r '.project_id')
          if [[ -z "${project}" || "${project}" == "null" ]]; then
            echo "Canonical project id resolution returned an empty project id." >&2
            exit 1
          fi

          if [[ ! "${project}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid canonical project id: ${project}. Allowed characters: A-Z a-z 0-9 . _ -" >&2
            exit 1
          fi

          control_plane_helper_dir="${RUNNER_TEMP}/release-resolve-control-plane"
          rm -rf "${control_plane_helper_dir}"
          mkdir -p "${control_plane_helper_dir}"
          for helper in \
            find_project_path.py \
            validate_pep440_version.py \
            validate_semver2_version.py \
            validate_rubygems_version.py
          do
            cp "eng/scripts/${helper}" "${control_plane_helper_dir}/${helper}"
          done
          control_plane_find_project_path="${control_plane_helper_dir}/find_project_path.py"
          control_plane_validate_pep440_version="${control_plane_helper_dir}/validate_pep440_version.py"
          control_plane_validate_semver2_version="${control_plane_helper_dir}/validate_semver2_version.py"
          control_plane_validate_rubygems_version="${control_plane_helper_dir}/validate_rubygems_version.py"

          # Ensure all subsequent detection/validation runs against the intended target commit.
          git checkout --detach "${target}"

          tag_name="release/${project}/v${version}"

          # Determine project kind and package directory.
          # This uses a unified detector with an explicit exit-code contract:
          #   0: unique match (prints a single JSON object)
          #   2: ambiguous
          #   3: not found
          #   1: unexpected error
          project_kind=""
          pkg_dir=""
          detect_err_file="${RUNNER_TEMP}/release-resolve-find-project-path.err"
          rm -f "${detect_err_file}"

          set +e
          detect_out=$(uv run --script "${control_plane_find_project_path}" "${project}" --root "${GITHUB_WORKSPACE}" 2>"${detect_err_file}")
          detect_rc=$?
          set -e

          if [[ "${detect_rc}" -eq 0 ]]; then
            project_kind=$(printf '%s' "${detect_out}" | jq -r '.project_kind')
            pkg_dir=$(printf '%s' "${detect_out}" | jq -r '.package_dir')
            rm -f "${detect_err_file}"
          elif [[ "${detect_rc}" -eq 2 ]]; then
            echo "Ambiguous project resolution for '${project}'." >&2
            if [[ -s "${detect_err_file}" ]]; then
              cat "${detect_err_file}" >&2
            fi
            rm -f "${detect_err_file}"
            exit 2
          elif [[ "${detect_rc}" -eq 3 ]]; then
            echo "Unknown project: ${project}." >&2
            if [[ -s "${detect_err_file}" ]]; then
              cat "${detect_err_file}" >&2
            fi
            rm -f "${detect_err_file}"
            exit 3
          else
            echo "Project discovery failed unexpectedly (exit ${detect_rc})." >&2
            if [[ -s "${detect_err_file}" ]]; then
              cat "${detect_err_file}" >&2
            fi
            rm -f "${detect_err_file}"
            exit 1
          fi

          # Validate version by project kind and derive is_prerelease.
          is_prerelease="false"
          if [[ "${project_kind}" == "python" ]]; then
            # Python releases use the canonical PEP 440 form only.
            if [[ "${version}" =~ ^[vV] ]]; then
              echo "Python versions must use the canonical form without a leading v." >&2
              exit 1
            fi

            uv run --script "${control_plane_validate_pep440_version}" "${version}"

            is_prerelease=$(uv run --with 'packaging>=24.0' python -c "from packaging.version import Version; import sys; v=Version(sys.argv[1]); print('true' if (v.is_prerelease or v.is_devrelease) else 'false')" "${version}")
          elif [[ "${project_kind}" == "node" ]]; then
            # Node releases require strict SemVer2.0 (no leading v).
            uv run --script "${control_plane_validate_semver2_version}" "${version}"
            # Build metadata after '+' may contain '-' characters; prerelease lives before '+'.
            version_core="${version%%+*}"
            if [[ "${version_core}" == *-* ]]; then
              is_prerelease="true"
            fi
          elif [[ "${project_kind}" == "ruby" ]]; then
            uv run --script "${control_plane_validate_rubygems_version}" "${version}"
            if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\..+$ ]]; then
              is_prerelease="true"
            fi
          elif [[ "${project_kind}" == "dotnet" ]]; then
            # .NET releases use the NBGV SemVer2 surface (no leading v).
            uv run --script "${control_plane_validate_semver2_version}" "${version}"
            version_core="${version%%+*}"
            if [[ "${version_core}" == *-* ]]; then
              is_prerelease="true"
            fi
          else
            echo "Unexpected project kind from discovery: ${project_kind}" >&2
            exit 1
          fi

          tag_name="release/${project}/v${version}"

          if [[ ! -d "${pkg_dir}" ]]; then
            echo "Package directory does not exist: ${pkg_dir}" >&2
            exit 1
          fi

          ruby_version="3.3"
          if [[ -f "${pkg_dir}/Gemfile.lock" ]]; then
            ruby_version=$(awk '
              /^RUBY VERSION$/ { in_section = 1; next }
              in_section && /^  ruby / {
                version = $2
                sub(/p[0-9]+$/, "", version)
                print version
                exit
              }
              in_section && NF == 0 { exit }
            ' "${pkg_dir}/Gemfile.lock")
            if [[ -z "${ruby_version}" ]]; then
              echo "Failed to determine ruby_version from ${pkg_dir}/Gemfile.lock" >&2
              exit 1
            fi
          elif [[ -f "${pkg_dir}/Gemfile" ]]; then
            ruby_version=$(grep -m1 '^ruby[[:space:]]' "${pkg_dir}/Gemfile" | cut -d' ' -f2- | tr -d "\"'")
            if [[ -z "${ruby_version}" ]]; then
              echo "Failed to determine ruby_version from ${pkg_dir}/Gemfile" >&2
              exit 1
            fi
          fi

          is_wxt="false"
          if [[ "${project_kind}" == "node" ]]; then
            if [[ -f "${pkg_dir}/wxt.config.ts" || -f "${pkg_dir}/wxt.config.js" || -f "${pkg_dir}/wxt.config.mjs" || -f "${pkg_dir}/wxt.config.cjs" ]]; then
              is_wxt="true"
            elif jq -e '(.dependencies // {} | has("wxt")) or (.devDependencies // {} | has("wxt")) or (.peerDependencies // {} | has("wxt")) or (.optionalDependencies // {} | has("wxt"))' "${pkg_dir}/package.json" >/dev/null 2>&1; then
              is_wxt="true"
            fi
          fi

          changelog="${pkg_dir}/CHANGELOG.md"
          has_changelog="false"
          if [[ -f "${changelog}" ]]; then
            has_changelog="true"
          fi

          # shellcheck disable=SC2129
          echo "project=${project}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "project_kind=${project_kind}" >> "${GITHUB_OUTPUT}"
          echo "is_prerelease=${is_prerelease}" >> "${GITHUB_OUTPUT}"
          echo "is_wxt=${is_wxt}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "target=${target}" >> "${GITHUB_OUTPUT}"
          echo "force_update_tag=${force_update_tag}" >> "${GITHUB_OUTPUT}"
          echo "package_dir=${pkg_dir}" >> "${GITHUB_OUTPUT}"
          echo "ruby_version=${ruby_version}" >> "${GITHUB_OUTPUT}"
          echo "has_changelog=${has_changelog}" >> "${GITHUB_OUTPUT}"
          echo "changelog=${changelog}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${project} v${version}" >> "${GITHUB_OUTPUT}"
          echo "run_url=${RUN_URL}" >> "${GITHUB_OUTPUT}"
