name: Resolve Release Inputs (Reusable)

on:
  workflow_call:
    inputs:
      source:
        description: "Resolution mode: 'tag' derives project/version from the release tag; 'manual' uses explicit inputs."
        required: true
        type: string
      python_version:
        description: "Python version for uv helper scripts."
        required: true
        type: string

      # source=tag
      ref_name:
        description: "Tag name (caller passes github.ref_name). Required when source=tag."
        required: false
        type: string
      ref:
        description: "Full ref (caller passes github.ref). Required when source=tag."
        required: false
        type: string

      # source=manual
      project:
        description: "Workspace package name (unscoped). Required when source=manual."
        required: false
        type: string
      version:
        description: "Python: PEP 440 subset (leading v allowed; will be stripped; epochs like '1!1.0' are intentionally not supported). Node: SemVer 2.0.0 (no leading v). Ruby: MAJOR.MINOR.PATCH[.suffix...] (no '-' or '+'; suffix segments are dot-separated [0-9A-Za-z]+ and must include at least one letter). Required when source=manual."
        required: false
        type: string
      target:
        description: "Target commit for release/tag when manually triggered (defaults to current commit)."
        required: false
        default: ""
        type: string
      force_update_tag:
        description: "Allow force-updating the release tag if it already exists and points to a different commit. Ignored when source=tag."
        required: false
        default: false
        type: boolean

    outputs:
      project:
        value: ${{ jobs.resolve.outputs.project }}
      version:
        value: ${{ jobs.resolve.outputs.version }}
      project_kind:
        value: ${{ jobs.resolve.outputs.project_kind }}
      is_prerelease:
        value: ${{ jobs.resolve.outputs.is_prerelease }}
      is_wxt:
        value: ${{ jobs.resolve.outputs.is_wxt }}
      tag_name:
        value: ${{ jobs.resolve.outputs.tag_name }}
      target:
        value: ${{ jobs.resolve.outputs.target }}
      force_update_tag:
        value: ${{ jobs.resolve.outputs.force_update_tag }}
      package_dir:
        value: ${{ jobs.resolve.outputs.package_dir }}
      has_changelog:
        value: ${{ jobs.resolve.outputs.has_changelog }}
      changelog:
        value: ${{ jobs.resolve.outputs.changelog }}
      release_title:
        value: ${{ jobs.resolve.outputs.release_title }}
      run_url:
        value: ${{ jobs.resolve.outputs.run_url }}

jobs:
  resolve:
    name: Resolve release inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      project: ${{ steps.meta.outputs.project }}
      version: ${{ steps.meta.outputs.version }}
      project_kind: ${{ steps.meta.outputs.project_kind }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      is_wxt: ${{ steps.meta.outputs.is_wxt }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      target: ${{ steps.meta.outputs.target }}
      force_update_tag: ${{ steps.meta.outputs.force_update_tag }}
      package_dir: ${{ steps.meta.outputs.package_dir }}
      has_changelog: ${{ steps.meta.outputs.has_changelog }}
      changelog: ${{ steps.meta.outputs.changelog }}
      release_title: ${{ steps.meta.outputs.release_title }}
      run_url: ${{ steps.meta.outputs.run_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch refs (tags and branches)
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --force --tags
          git fetch --force --prune --all

      - name: Install jq
        uses: dcarbone/install-jq-action@4fcb5062d7ce9bc4382d1a352d19ba3ba2c317c1 # v4.0.1
        with:
          version: '1.7.1'

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          experimental: true
          install: false

      - name: Install fd (mise)
        shell: bash
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mise install fd
          command -v fd
          fd --version

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ inputs.python_version }}
          cache-dependency-glob: 'uv.lock'

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          dotnet tool restore

      - name: Resolve release inputs
        id: meta
        shell: bash
        env:
          SOURCE: ${{ inputs.source }}

          REF_NAME: ${{ inputs.ref_name }}
          REF: ${{ inputs.ref }}

          MANUAL_PROJECT: ${{ inputs.project }}
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_TARGET: ${{ inputs.target }}
          MANUAL_FORCE_UPDATE_TAG: ${{ inputs.force_update_tag }}
        run: |
          set -Eeuo pipefail

          # Compute run_url from the GitHub context rather than accepting it as an input,
          # since both callers always pass the same expression.
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # shellcheck disable=SC2153
          source="${SOURCE}"
          if [[ "${source}" != "tag" && "${source}" != "manual" ]]; then
            echo "Invalid source: ${source}. Expected 'tag' or 'manual'." >&2
            exit 1
          fi

          project=""
          version=""
          tag_name=""
          target_input=""

          force_update_tag="false"

          if [[ "${source}" == "tag" ]]; then
            if [[ -z "${REF_NAME}" || -z "${REF}" ]]; then
              echo "source=tag requires inputs.ref_name and inputs.ref." >&2
              exit 1
            fi

            if [[ ! "${REF_NAME}" =~ ^release/[A-Za-z0-9._-]+/v.+$ ]]; then
              echo "Tag ${REF_NAME} must follow release/<project>/v<version> where <project> matches ^[A-Za-z0-9._-]+$" >&2
              exit 1
            fi

            project="${REF_NAME#release/}"
            project="${project%%/v*}"
            version="${REF_NAME##*/v}"
            tag_name="${REF_NAME}"
            target_input="${REF}"

            # Tags are immutable by policy.
            force_update_tag="false"
          else
            project="${MANUAL_PROJECT}"
            version="${MANUAL_VERSION}"
            tag_name=""
            target_input="${MANUAL_TARGET}"

            # GitHub Actions inputs are stringly typed, normalize to strict true/false.
            if [[ "${MANUAL_FORCE_UPDATE_TAG}" == "true" ]]; then
              force_update_tag="true"
            fi
          fi

          if [[ -z "${project}" || -z "${version}" ]]; then
            echo "project or version is empty" >&2
            exit 1
          fi

          if [[ ! "${project}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid project name: ${project}. Allowed characters: A-Z a-z 0-9 . _ -" >&2
            exit 1
          fi

          if [[ ! "${version}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "Invalid version format for shell safety: ${version}. Allowed characters: A-Z a-z 0-9 . _ + -" >&2
            exit 1
          fi

          if [[ "${source}" == "tag" ]]; then
            if ! resolved_target=$(git rev-list -n1 "${target_input}"); then
              echo "Failed to resolve tag ref '${target_input}' to a commit." >&2
              exit 1
            fi
          else
            if [[ -z "${target_input}" ]]; then
              resolved_target=$(git rev-parse HEAD)
            else
              if ! resolved_target=$(git rev-list -n1 "${target_input}"); then
                echo "Failed to resolve target '${target_input}' to a commit." >&2
                exit 1
              fi
            fi
          fi

          if [[ -z "${resolved_target}" ]]; then
            echo "Resolved target commit is empty" >&2
            exit 1
          fi

          target="${resolved_target}"

          # Ensure all subsequent detection/validation runs against the intended target commit.
          git checkout --detach "${target}"

          # Determine project kind and package directory.
          # This uses a unified detector with an explicit exit-code contract:
          #   0: unique match (prints a single JSON object)
          #   2: ambiguous
          #   3: not found
          #   1: unexpected error
          project_kind=""
          pkg_dir=""
          detect_err_file="$(mktemp)"

          set +e
          detect_out=$(uv run --script eng/scripts/find_project_path.py "${project}" 2>"${detect_err_file}")
          detect_rc=$?
          set -e

          if [[ "${detect_rc}" -eq 0 ]]; then
            project_kind=$(printf '%s' "${detect_out}" | jq -r '.project_kind')
            pkg_dir=$(printf '%s' "${detect_out}" | jq -r '.package_dir')
            rm -f "${detect_err_file}"
          elif [[ "${detect_rc}" -eq 2 ]]; then
            echo "Ambiguous project resolution for '${project}'." >&2
            if [[ -s "${detect_err_file}" ]]; then
              cat "${detect_err_file}" >&2
            fi
            rm -f "${detect_err_file}"
            exit 2
          elif [[ "${detect_rc}" -eq 3 ]]; then
            echo "Unknown project: ${project}." >&2
            if [[ -s "${detect_err_file}" ]]; then
              cat "${detect_err_file}" >&2
            fi
            rm -f "${detect_err_file}"
            exit 3
          else
            echo "Project discovery failed unexpectedly (exit ${detect_rc})." >&2
            if [[ -s "${detect_err_file}" ]]; then
              cat "${detect_err_file}" >&2
            fi
            rm -f "${detect_err_file}"
            exit 1
          fi

          # Validate version by project kind and derive is_prerelease.
          is_prerelease="false"
          if [[ "${project_kind}" == "python" ]]; then
            # Python releases allow a leading v/V.
            if [[ "${version}" =~ ^[vV] ]]; then
              version="${version#?}"
            fi

            if [[ -z "${version}" ]]; then
              echo "version is empty after stripping leading v" >&2
              exit 1
            fi

            uv run --script eng/scripts/validate_pep440_version.py "${version}"

            is_prerelease=$(uv run --with 'packaging>=24.0' python -c "from packaging.version import Version; import sys; v=Version(sys.argv[1]); print('true' if (v.is_prerelease or v.is_devrelease) else 'false')" "${version}")
          elif [[ "${project_kind}" == "node" ]]; then
            # Node releases require strict SemVer2.0 (no leading v).
            uv run --script eng/scripts/validate_semver2_version.py "${version}"
            if [[ "${version}" == *-* ]]; then
              is_prerelease="true"
            fi
          elif [[ "${project_kind}" == "ruby" ]]; then
            uv run --script eng/scripts/validate_rubygems_version.py "${version}"
            if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\..+$ ]]; then
              is_prerelease="true"
            fi
          else
            echo "Unexpected project kind from discovery: ${project_kind}" >&2
            exit 1
          fi

          # For manually triggered runs, tag_name depends on the validated/normalized version.
          if [[ "${source}" != "tag" ]]; then
            tag_name="release/${project}/v${version}"
          fi

          if [[ ! -d "${pkg_dir}" ]]; then
            echo "Package directory does not exist: ${pkg_dir}" >&2
            exit 1
          fi

          is_wxt="false"
          if [[ "${project_kind}" == "node" ]]; then
            if [[ -f "${pkg_dir}/wxt.config.ts" || -f "${pkg_dir}/wxt.config.js" || -f "${pkg_dir}/wxt.config.mjs" || -f "${pkg_dir}/wxt.config.cjs" ]]; then
              is_wxt="true"
            elif jq -e '(.dependencies // {} | has("wxt")) or (.devDependencies // {} | has("wxt")) or (.peerDependencies // {} | has("wxt")) or (.optionalDependencies // {} | has("wxt"))' "${pkg_dir}/package.json" >/dev/null 2>&1; then
              is_wxt="true"
            fi
          fi

          changelog="${pkg_dir}/CHANGELOG.md"
          has_changelog="false"
          if [[ -f "${changelog}" ]]; then
            has_changelog="true"
          fi

          # shellcheck disable=SC2129
          echo "project=${project}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "project_kind=${project_kind}" >> "${GITHUB_OUTPUT}"
          echo "is_prerelease=${is_prerelease}" >> "${GITHUB_OUTPUT}"
          echo "is_wxt=${is_wxt}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "target=${target}" >> "${GITHUB_OUTPUT}"
          echo "force_update_tag=${force_update_tag}" >> "${GITHUB_OUTPUT}"
          echo "package_dir=${pkg_dir}" >> "${GITHUB_OUTPUT}"
          echo "has_changelog=${has_changelog}" >> "${GITHUB_OUTPUT}"
          echo "changelog=${changelog}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${project} v${version}" >> "${GITHUB_OUTPUT}"
          echo "run_url=${RUN_URL}" >> "${GITHUB_OUTPUT}"
