name: Workflow Delivery v3 Official simulation

on:
  workflow_dispatch:

env:
  DESTINATION: npmjs
  DRY_RUN: 'true'

permissions:
  contents: read

jobs:
  simulate:
    name: Qualify and describe Official dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact selected source and control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Prepare selected native tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: '2026.8.10'
          experimental: true
          install_args: dotnet node pnpm
      - name: Build selected control before product execution
        run: |
          mise exec --locked dotnet -- dotnet build src/private/app/workflow-delivery/WorkflowDelivery.csproj \
            -p:RestoreLockedMode=true -o "$RUNNER_TEMP/control"
      - name: Prepare frozen native dependencies without package scripts
        env:
          MISE_EXEC_AUTO_INSTALL: '0'
          MISE_AUTO_INSTALL: '0'
        run: |
          mkdir -p "$RUNNER_TEMP/release-dependencies/home" "$RUNNER_TEMP/release-dependencies/config"
          touch "$RUNNER_TEMP/release-dependencies/config/auth.npmrc"
          # Expand the tool-selected PATH inside the child shell.
          # shellcheck disable=SC2016
          mise exec --locked node pnpm -- sh -c 'exec env -i PATH="$PATH" \
            HOME="$RUNNER_TEMP/release-dependencies/home" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/release-dependencies/config" \
            pnpm --npmrc-auth-file "$RUNNER_TEMP/release-dependencies/config/auth.npmrc" \
            --store-dir "$RUNNER_TEMP/release-dependencies/store" \
            --state-dir "$RUNNER_TEMP/release-dependencies/state" \
            install --frozen-lockfile --ignore-scripts'
      - name: Prepare complete selected release
        id: prepare
        run: |
          export MISE_DATA_DIR="${MISE_DATA_DIR:-$HOME/.local/share/mise}"
          mise exec --locked dotnet -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs npm simulation-request
          mise exec --locked dotnet node pnpm -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" \
            release prepare-npm "$RUNNER_TEMP/prepared/request.json" \
            > "$RUNNER_TEMP/prepared/preparation.json"
      - name: Observe exact public npmjs state without write capability
        if: success()
        run: |
          mise exec --locked dotnet -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" \
            release observe-npmjs "$RUNNER_TEMP/prepared/preparation.json" \
            "$RUNNER_TEMP/preparation-scratch" > "$RUNNER_TEMP/prepared/observation.json"
      - name: Describe hypothetical work
        if: success()
        run: |
          mise exec --locked dotnet -- dotnet "$RUNNER_TEMP/control/WorkflowDelivery.dll" \
            release describe-npmjs "$RUNNER_TEMP/prepared/preparation.json" \
            "$RUNNER_TEMP/prepared/observation.json" > "$RUNNER_TEMP/prepared/dry-run.json"
      - name: Show qualification and actual observation limits
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'prepared'
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('## Official dry run\n\n')
              summary.write('This invocation performs qualification and public reads. It makes no publication or live completion claim.\n\n')
              for name in ('preparation', 'observation', 'dry-run'):
                  path = root / (name + '.json')
                  if not path.exists() or not path.stat().st_size:
                      summary.write(f'{name}: required result unavailable.\n\n')
                      continue
                  value = json.loads(path.read_text())
                  summary.write(f'{name}:\n\n```json\n{json.dumps(value, indent=2)}\n```\n\n')
          PYTHON
      - name: Retain original files and required business results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: official-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/prepared/*.json
            ${{ runner.temp }}/preparation-scratch/original/package.tgz
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          include-hidden-files: true
