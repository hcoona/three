            --adapter-context-artifact-id "${{ needs.qualification-finalizer.outputs.adapter-context-artifact-id }}" \
            --adapter-context-artifact-digest "${{ needs.qualification-finalizer.outputs.adapter-context-artifact-digest }}" \
            "${artifact_args[@]}" \
