            --qualification-decision-digest "${{ needs.materialize-hypothetical-actions.outputs.decision-digest }}" \
            --qualification-decision-artifact-id "${{ needs.materialize-hypothetical-actions.outputs.decision-artifact-id }}" \
            --qualification-decision-artifact-digest "${{ needs.materialize-hypothetical-actions.outputs.decision-artifact-digest }}" \
            --observation-set ".wdv3/input/${{ needs.materialize-hypothetical-actions.outputs.observation-set-artifact-name }}" \
            --observation-set-digest "${{ needs.materialize-hypothetical-actions.outputs.observation-set-digest }}" \
            --observation-set-artifact-id "${{ needs.materialize-hypothetical-actions.outputs.observation-set-artifact-id }}" \
            --observation-set-artifact-digest "${{ needs.materialize-hypothetical-actions.outputs.observation-set-artifact-digest }}" \
            --actions-report ".wdv3/input/${{ needs.materialize-hypothetical-actions.outputs.actions-report-artifact-name }}" \
            --actions-report-digest "${{ needs.materialize-hypothetical-actions.outputs.actions-report-digest }}" \
            --actions-report-artifact-id "${{ needs.materialize-hypothetical-actions.outputs.actions-report-artifact-id }}" \
            --actions-report-artifact-digest "${{ needs.materialize-hypothetical-actions.outputs.actions-report-artifact-digest }}" \
            "${artifact_args[@]}" \
            --output .wdv3/simulation-outcome.json \
            --summary-output .wdv3/simulation-summary.md \
            --github-step-summary "${GITHUB_STEP_SUMMARY}" \
            --github-output "${GITHUB_OUTPUT}"
          finalize_status=$?
          set -e
          digest="$(sha256sum .wdv3/simulation-outcome.json | cut -d' ' -f1)"
          outcome_name="wdv3-release-simulation-outcome-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${digest}.json"
          mv .wdv3/simulation-outcome.json ".wdv3/${outcome_name}"
          summary_name="wdv3-release-simulation-summary-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${digest}.md"
          mv .wdv3/simulation-summary.md ".wdv3/${summary_name}"
          echo "simulation-outcome-artifact-name=${outcome_name}" >> "${GITHUB_OUTPUT}"
          echo "simulation-summary-artifact-name=${summary_name}" >> "${GITHUB_OUTPUT}"
          exit "${finalize_status}"
      - name: Upload Simulation Outcome
        id: upload-outcome
        if: steps.finalize.outputs.simulation-outcome-artifact-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.finalize.outputs.simulation-outcome-artifact-name }}
          path: .wdv3/${{ steps.finalize.outputs.simulation-outcome-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Upload deterministic human summary
        id: upload-summary
        if: steps.finalize.outputs.simulation-summary-artifact-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.finalize.outputs.simulation-summary-artifact-name }}
          path: .wdv3/${{ steps.finalize.outputs.simulation-summary-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Preserve simulation terminal result
        if: always()
        run: |
          if [[ "${{ steps.finalize.outputs.terminal-result }}" == "success" ]]; then
            exit 0
          fi
          exit 1
