name: Workflow Delivery v3 Official simulation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdv3-simulation-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  WDV3_PACKAGE: three-workflow-delivery-v3
  WDV3_PURPOSE: release-simulation
  WDV3_PROJECT: src/public/lib/hcoona-release-smoke-npm

jobs:
  request:
    name: Normalize Official simulation request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      intent-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      intent-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      intent-artifact-name: ${{ steps.request.outputs.intent-artifact-name }}
      intent-digest: ${{ steps.request.outputs.intent-digest }}
      request-id: ${{ steps.request.outputs.request-id }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
      - name: Normalize fixed request
        id: request
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release normalize-simulation-request \
            --repository "${GITHUB_REPOSITORY}" \
            --selected-ref "${GITHUB_REF}" \
            --target "${GITHUB_SHA}" \
            --actor "${GITHUB_ACTOR}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output .wdv3/release-intent.json \
            --github-output "${GITHUB_OUTPUT}"
          digest="$(sha256sum .wdv3/release-intent.json | cut -d' ' -f1)"
          artifact_name="wdv3-release-simulation-request-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${digest}.json"
          mv .wdv3/release-intent.json ".wdv3/${artifact_name}"
          echo "intent-artifact-name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload Release Intent
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.request.outputs.intent-artifact-name }}
          path: .wdv3/${{ steps.request.outputs.intent-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  discover-node:
    name: Discover exact Node facts
    needs: request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      intent-artifact-id: ${{ needs.request.outputs.intent-artifact-id }}
      intent-artifact-digest: ${{ needs.request.outputs.intent-artifact-digest }}
      intent-artifact-name: ${{ needs.request.outputs.intent-artifact-name }}
      intent-digest: ${{ needs.request.outputs.intent-digest }}
      request-id: ${{ needs.request.outputs.request-id }}
      provider-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      provider-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      provider-artifact-name: ${{ steps.provider.outputs.provider-artifact-name }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
      - name: Install exact toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install: true
      - name: Download Release Intent by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.request.outputs.intent-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Admit current Release Intent
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release admit-intent \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${GITHUB_SHA}" \
            --intent ".wdv3/input/${{ needs.request.outputs.intent-artifact-name }}" \
            --intent-digest "${{ needs.request.outputs.intent-digest }}" \
            --intent-artifact-id "${{ needs.request.outputs.intent-artifact-id }}" \
            --intent-artifact-digest "${{ needs.request.outputs.intent-artifact-digest }}"
      - name: Run Node Provider once
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 repository provide-node \
            --request-id "${{ needs.request.outputs.request-id }}" \
            --purpose "${WDV3_PURPOSE}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${GITHUB_SHA}" \
            --compiler-producer compile-simulation-model \
            --provider-producer discover-node \
            --control "workflow-delivery-v3:${GITHUB_SHA}" \
            --channel official \
            --release-unit hcoona-release-smoke-npm \
            --fetch-depth 0 \
            --no-persist-credentials \
            --output .wdv3/node-provider-result.json
      - name: Bind Provider payload digest
        id: provider
        run: |
          digest="$(sha256sum .wdv3/node-provider-result.json | cut -d' ' -f1)"
          artifact_name="wdv3-release-simulation-node-provider-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${digest}.json"
          mv .wdv3/node-provider-result.json ".wdv3/${artifact_name}"
          echo "provider-digest-hex=${digest}" >> "${GITHUB_OUTPUT}"
          echo "provider-artifact-name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload Provider Result
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.provider.outputs.provider-artifact-name }}
          path: .wdv3/${{ steps.provider.outputs.provider-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  compile-simulation-model:
    name: Compile admitted simulation Repository Model
    needs: discover-node
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      intent-artifact-id: ${{ needs.discover-node.outputs.intent-artifact-id }}
      intent-artifact-digest: ${{ needs.discover-node.outputs.intent-artifact-digest }}
      intent-artifact-name: ${{ needs.discover-node.outputs.intent-artifact-name }}
      intent-digest: ${{ needs.discover-node.outputs.intent-digest }}
      request-id: ${{ needs.discover-node.outputs.request-id }}
      provider-artifact-id: ${{ needs.discover-node.outputs.provider-artifact-id }}
      provider-artifact-digest: ${{ needs.discover-node.outputs.provider-artifact-digest }}
      provider-artifact-name: ${{ needs.discover-node.outputs.provider-artifact-name }}
      repository-model-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      repository-model-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      repository-model-artifact-name: ${{ steps.compile.outputs.repository-model-artifact-name }}
      repository-model-digest: ${{ steps.compile.outputs.repository-model-digest }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
      - name: Download Release Intent by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.discover-node.outputs.intent-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Provider Result by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.discover-node.outputs.provider-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Compile without rerunning Provider
        id: compile
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release compile-simulation-model \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${GITHUB_SHA}" \
            --intent ".wdv3/input/${{ needs.discover-node.outputs.intent-artifact-name }}" \
            --intent-digest "${{ needs.discover-node.outputs.intent-digest }}" \
            --intent-artifact-id "${{ needs.discover-node.outputs.intent-artifact-id }}" \
            --intent-artifact-digest "${{ needs.discover-node.outputs.intent-artifact-digest }}" \
            --provider-result ".wdv3/input/${{ needs.discover-node.outputs.provider-artifact-name }}" \
            --provider-artifact-id "${{ needs.discover-node.outputs.provider-artifact-id }}" \
            --provider-artifact-digest "${{ needs.discover-node.outputs.provider-artifact-digest }}" \
            --output .wdv3/repository-model.json \
            --github-output "${GITHUB_OUTPUT}"
          digest="$(sha256sum .wdv3/repository-model.json | cut -d' ' -f1)"
          artifact_name="wdv3-release-simulation-repository-model-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${digest}.json"
          mv .wdv3/repository-model.json ".wdv3/${artifact_name}"
          echo "repository-model-artifact-name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload admitted Repository Model
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.compile.outputs.repository-model-artifact-name }}
          path: .wdv3/${{ steps.compile.outputs.repository-model-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  create-simulation-identity:
    name: Create post-admission Simulation Identity
    needs: compile-simulation-model
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      intent-artifact-id: ${{ needs.compile-simulation-model.outputs.intent-artifact-id }}
      intent-artifact-digest: ${{ needs.compile-simulation-model.outputs.intent-artifact-digest }}
      intent-artifact-name: ${{ needs.compile-simulation-model.outputs.intent-artifact-name }}
      intent-digest: ${{ needs.compile-simulation-model.outputs.intent-digest }}
      repository-model-artifact-id: ${{ needs.compile-simulation-model.outputs.repository-model-artifact-id }}
      repository-model-artifact-digest: ${{ needs.compile-simulation-model.outputs.repository-model-artifact-digest }}
      repository-model-artifact-name: ${{ needs.compile-simulation-model.outputs.repository-model-artifact-name }}
      repository-model-digest: ${{ needs.compile-simulation-model.outputs.repository-model-digest }}
      simulation-binding-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      simulation-binding-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      simulation-binding-artifact-name: ${{ steps.identity.outputs.simulation-binding-artifact-name }}
      simulation-binding-digest: ${{ steps.identity.outputs.simulation-binding-digest }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
      - name: Download Release Intent by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.compile-simulation-model.outputs.intent-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Repository Model by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.compile-simulation-model.outputs.repository-model-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Derive Simulation Identity
        id: identity
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release create-simulation-identity \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${GITHUB_SHA}" \
            --intent ".wdv3/input/${{ needs.compile-simulation-model.outputs.intent-artifact-name }}" \
            --intent-digest "${{ needs.compile-simulation-model.outputs.intent-digest }}" \
            --intent-artifact-id "${{ needs.compile-simulation-model.outputs.intent-artifact-id }}" \
            --intent-artifact-digest "${{ needs.compile-simulation-model.outputs.intent-artifact-digest }}" \
            --repository-model ".wdv3/input/${{ needs.compile-simulation-model.outputs.repository-model-artifact-name }}" \
            --repository-model-digest "${{ needs.compile-simulation-model.outputs.repository-model-digest }}" \
            --repository-model-artifact-id "${{ needs.compile-simulation-model.outputs.repository-model-artifact-id }}" \
            --repository-model-artifact-digest "${{ needs.compile-simulation-model.outputs.repository-model-artifact-digest }}" \
            --output .wdv3/simulation-binding.json \
            --github-output "${GITHUB_OUTPUT}"
          digest="$(sha256sum .wdv3/simulation-binding.json | cut -d' ' -f1)"
          artifact_name="wdv3-release-simulation-identity-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${digest}.json"
          mv .wdv3/simulation-binding.json ".wdv3/${artifact_name}"
          echo "simulation-binding-artifact-name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload Simulation Binding
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.identity.outputs.simulation-binding-artifact-name }}
          path: .wdv3/${{ steps.identity.outputs.simulation-binding-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  plan-simulation:
    name: Plan qualification and Adapter context
    needs: create-simulation-identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      qualification-snapshot-artifact-id: ${{ steps.upload-plan.outputs.artifact-id }}
      qualification-snapshot-artifact-digest: ${{ steps.upload-plan.outputs.artifact-digest }}
      qualification-snapshot-artifact-name: ${{ steps.plan.outputs.qualification-snapshot-artifact-name }}
      qualification-snapshot-digest: ${{ steps.plan.outputs.qualification-snapshot-digest }}
      adapter-context-artifact-id: ${{ steps.upload-context.outputs.artifact-id }}
      adapter-context-artifact-digest: ${{ steps.upload-context.outputs.artifact-digest }}
      adapter-context-artifact-name: ${{ steps.plan.outputs.adapter-context-artifact-name }}
      adapter-context-digest: ${{ steps.plan.outputs.adapter-context-digest }}
      tarball-artifact-name: ${{ steps.plan.outputs.tarball-artifact-name }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
      - name: Install exact toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install: true
      - name: Download Release Intent by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.create-simulation-identity.outputs.intent-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Repository Model by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.create-simulation-identity.outputs.repository-model-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Simulation Binding by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.create-simulation-identity.outputs.simulation-binding-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Close exact qualification Plan
        id: plan
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release plan-qualification \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${GITHUB_SHA}" \
            --intent ".wdv3/input/${{ needs.create-simulation-identity.outputs.intent-artifact-name }}" \
            --intent-digest "${{ needs.create-simulation-identity.outputs.intent-digest }}" \
            --intent-artifact-id "${{ needs.create-simulation-identity.outputs.intent-artifact-id }}" \
            --intent-artifact-digest "${{ needs.create-simulation-identity.outputs.intent-artifact-digest }}" \
            --repository-model ".wdv3/input/${{ needs.create-simulation-identity.outputs.repository-model-artifact-name }}" \
            --repository-model-digest "${{ needs.create-simulation-identity.outputs.repository-model-digest }}" \
            --repository-model-artifact-id "${{ needs.create-simulation-identity.outputs.repository-model-artifact-id }}" \
            --repository-model-artifact-digest "${{ needs.create-simulation-identity.outputs.repository-model-artifact-digest }}" \
            --simulation-binding ".wdv3/input/${{ needs.create-simulation-identity.outputs.simulation-binding-artifact-name }}" \
            --simulation-binding-digest "${{ needs.create-simulation-identity.outputs.simulation-binding-digest }}" \
            --simulation-binding-artifact-id "${{ needs.create-simulation-identity.outputs.simulation-binding-artifact-id }}" \
            --simulation-binding-artifact-digest "${{ needs.create-simulation-identity.outputs.simulation-binding-artifact-digest }}" \
            --output .wdv3/qualification-snapshot.json \
            --adapter-context-output .wdv3/release-adapter-context.json \
            --github-output "${GITHUB_OUTPUT}"
          snapshot_digest="$(sha256sum .wdv3/qualification-snapshot.json | cut -d' ' -f1)"
          snapshot_name="wdv3-release-simulation-qualification-snapshot-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${snapshot_digest}.json"
          mv .wdv3/qualification-snapshot.json ".wdv3/${snapshot_name}"
          echo "qualification-snapshot-artifact-name=${snapshot_name}" >> "${GITHUB_OUTPUT}"
          context_digest="$(sha256sum .wdv3/release-adapter-context.json | cut -d' ' -f1)"
          context_name="wdv3-release-simulation-adapter-context-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${context_digest}.json"
          mv .wdv3/release-adapter-context.json ".wdv3/${context_name}"
          echo "adapter-context-artifact-name=${context_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload Qualification Snapshot
        id: upload-plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.plan.outputs.qualification-snapshot-artifact-name }}
          path: .wdv3/${{ steps.plan.outputs.qualification-snapshot-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Upload Adapter context
        id: upload-context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.plan.outputs.adapter-context-artifact-name }}
          path: .wdv3/${{ steps.plan.outputs.adapter-context-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  build-tarball:
    name: Build exact npm tarball
    needs: plan-simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      qualification-snapshot-artifact-id: ${{ needs.plan-simulation.outputs.qualification-snapshot-artifact-id }}
      qualification-snapshot-artifact-digest: ${{ needs.plan-simulation.outputs.qualification-snapshot-artifact-digest }}
      qualification-snapshot-artifact-name: ${{ needs.plan-simulation.outputs.qualification-snapshot-artifact-name }}
      qualification-snapshot-digest: ${{ needs.plan-simulation.outputs.qualification-snapshot-digest }}
      adapter-context-artifact-id: ${{ needs.plan-simulation.outputs.adapter-context-artifact-id }}
      adapter-context-artifact-digest: ${{ needs.plan-simulation.outputs.adapter-context-artifact-digest }}
      adapter-context-artifact-name: ${{ needs.plan-simulation.outputs.adapter-context-artifact-name }}
      adapter-context-digest: ${{ needs.plan-simulation.outputs.adapter-context-digest }}
      tarball-artifact-name: ${{ needs.plan-simulation.outputs.tarball-artifact-name }}
      tarball-artifact-id: ${{ steps.upload-tarball.outputs.artifact-id }}
      tarball-artifact-digest: ${{ steps.upload-tarball.outputs.artifact-digest }}
      tarball-artifact-url: ${{ steps.upload-tarball.outputs.artifact-url }}
      release-artifact-artifact-id: ${{ steps.upload-artifact-record.outputs.artifact-id }}
      release-artifact-artifact-digest: ${{ steps.upload-artifact-record.outputs.artifact-digest }}
      release-artifact-artifact-name: ${{ steps.names.outputs.release-artifact-name }}
      release-artifact-digest: ${{ steps.form.outputs.release-artifact-digest }}
      build-evidence-artifact-id: ${{ steps.upload-evidence.outputs.artifact-id }}
      build-evidence-artifact-digest: ${{ steps.upload-evidence.outputs.artifact-digest }}
      build-evidence-artifact-name: ${{ steps.names.outputs.build-evidence-name }}
      build-evidence-digest: ${{ steps.select.outputs.build-evidence-digest }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
      - name: Install exact toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install: true
      - name: Download Qualification Snapshot by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.plan-simulation.outputs.qualification-snapshot-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Adapter context by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.plan-simulation.outputs.adapter-context-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Run build mechanics once
        id: build
        env:
          TARBALL_NAME: ${{ needs.plan-simulation.outputs.tarball-artifact-name }}
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release run-build \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${GITHUB_SHA}" \
            --qualification-snapshot ".wdv3/input/${{ needs.plan-simulation.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.plan-simulation.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.plan-simulation.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.plan-simulation.outputs.qualification-snapshot-artifact-digest }}" \
            --adapter-context ".wdv3/input/${{ needs.plan-simulation.outputs.adapter-context-artifact-name }}" \
            --adapter-context-digest "${{ needs.plan-simulation.outputs.adapter-context-digest }}" \
            --adapter-context-artifact-id "${{ needs.plan-simulation.outputs.adapter-context-artifact-id }}" \
            --adapter-context-artifact-digest "${{ needs.plan-simulation.outputs.adapter-context-artifact-digest }}" \
            --tarball-output ".wdv3/${TARBALL_NAME}" \
            --mechanical-output .wdv3/mechanical-build-result.json \
            --failure-evidence-output .wdv3/build-evidence.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Upload exact raw tarball
        id: upload-tarball
        if: steps.build.outputs.build-status == 'satisfied'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ needs.plan-simulation.outputs.tarball-artifact-name }}
          path: .wdv3/${{ needs.plan-simulation.outputs.tarball-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Form Release Artifact and build Evidence after upload
        id: form
        if: steps.upload-tarball.outputs.artifact-id != ''
        env:
          TARBALL_NAME: ${{ needs.plan-simulation.outputs.tarball-artifact-name }}
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release form-uploaded-artifact \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${GITHUB_SHA}" \
            --qualification-snapshot ".wdv3/input/${{ needs.plan-simulation.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.plan-simulation.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.plan-simulation.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.plan-simulation.outputs.qualification-snapshot-artifact-digest }}" \
            --adapter-context ".wdv3/input/${{ needs.plan-simulation.outputs.adapter-context-artifact-name }}" \
            --adapter-context-digest "${{ needs.plan-simulation.outputs.adapter-context-digest }}" \
            --adapter-context-artifact-id "${{ needs.plan-simulation.outputs.adapter-context-artifact-id }}" \
            --adapter-context-artifact-digest "${{ needs.plan-simulation.outputs.adapter-context-artifact-digest }}" \
            --mechanical-result .wdv3/mechanical-build-result.json \
            --tarball ".wdv3/${TARBALL_NAME}" \
            --tarball-artifact-id "${{ steps.upload-tarball.outputs.artifact-id }}" \
            --tarball-artifact-name "${TARBALL_NAME}" \
            --tarball-artifact-url "${{ steps.upload-tarball.outputs.artifact-url }}" \
            --tarball-artifact-digest "${{ steps.upload-tarball.outputs.artifact-digest }}" \
            --artifact-output .wdv3/release-artifact.json \
            --evidence-output .wdv3/build-evidence.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Select build Evidence identity
        id: select
        if: always() && hashFiles('.wdv3/build-evidence.json') != ''
        env:
          FORMED_DIGEST: ${{ steps.form.outputs.build-evidence-digest }}
          FAILED_DIGEST: ${{ steps.build.outputs.build-evidence-digest }}
        run: |
          digest="${FORMED_DIGEST:-${FAILED_DIGEST}}"
          echo "build-evidence-digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "build-evidence-digest-hex=${digest#sha256:}" >> "${GITHUB_OUTPUT}"
      - name: Materialize exact build output basenames
        id: names
        if: always() && steps.select.outputs.build-evidence-digest != ''
        env:
          RELEASE_ARTIFACT_DIGEST: ${{ steps.form.outputs.release-artifact-digest }}
          BUILD_EVIDENCE_DIGEST: ${{ steps.select.outputs.build-evidence-digest }}
        run: |
          if [[ -f .wdv3/release-artifact.json ]]; then
            artifact_name="wdv3-release-simulation-release-artifact-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${RELEASE_ARTIFACT_DIGEST#sha256:}.json"
            mv .wdv3/release-artifact.json ".wdv3/${artifact_name}"
            echo "release-artifact-name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          fi
          evidence_name="wdv3-release-simulation-build-evidence-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${BUILD_EVIDENCE_DIGEST#sha256:}.json"
          mv .wdv3/build-evidence.json ".wdv3/${evidence_name}"
          echo "build-evidence-name=${evidence_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload Release Artifact record
        id: upload-artifact-record
        if: steps.names.outputs.release-artifact-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.names.outputs.release-artifact-name }}
          path: .wdv3/${{ steps.names.outputs.release-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
      - name: Upload build Evidence
        id: upload-evidence
        if: steps.names.outputs.build-evidence-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.names.outputs.build-evidence-name }}
          path: .wdv3/${{ steps.names.outputs.build-evidence-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  project-test:
    name: Run independent project test
    needs: plan-simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      evidence-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      evidence-artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      evidence-artifact-name: ${{ steps.test.outputs.project-test-evidence-artifact-name }}
      evidence-digest: ${{ steps.test.outputs.project-test-evidence-digest }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
      - name: Install exact toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install: true
      - name: Download Qualification Snapshot by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.plan-simulation.outputs.qualification-snapshot-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Adapter context by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.plan-simulation.outputs.adapter-context-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Run project-test mechanics
        id: test
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release run-project-test \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${GITHUB_SHA}" \
            --qualification-snapshot ".wdv3/input/${{ needs.plan-simulation.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.plan-simulation.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.plan-simulation.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.plan-simulation.outputs.qualification-snapshot-artifact-digest }}" \
            --adapter-context ".wdv3/input/${{ needs.plan-simulation.outputs.adapter-context-artifact-name }}" \
            --adapter-context-digest "${{ needs.plan-simulation.outputs.adapter-context-digest }}" \
            --adapter-context-artifact-id "${{ needs.plan-simulation.outputs.adapter-context-artifact-id }}" \
            --adapter-context-artifact-digest "${{ needs.plan-simulation.outputs.adapter-context-artifact-digest }}" \
            --output .wdv3/project-test-evidence.json \
            --github-output "${GITHUB_OUTPUT}"
          digest="$(sha256sum .wdv3/project-test-evidence.json | cut -d' ' -f1)"
          artifact_name="wdv3-release-simulation-project-test-evidence-r${GITHUB_RUN_ID}-ra${GITHUB_RUN_ATTEMPT}-${digest}.json"
          mv .wdv3/project-test-evidence.json ".wdv3/${artifact_name}"
          echo "project-test-evidence-artifact-name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload project-test Evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.test.outputs.project-test-evidence-artifact-name }}
          path: .wdv3/${{ steps.test.outputs.project-test-evidence-artifact-name }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true

  npm-artifact-qualification:
    name: Qualify exact npm artifact
    if: always() && needs.build-tarball.result != 'skipped'
    needs: build-tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      contents-evidence-artifact-id: ${{ steps.upload-contents.outputs.artifact-id }}
      contents-evidence-artifact-digest: ${{ steps.upload-contents.outputs.artifact-digest }}
      contents-evidence-artifact-name: ${{ steps.names.outputs.contents-evidence-name }}
      contents-evidence-digest: ${{ steps.contents.outputs.artifact-contents-evidence-digest || steps.incomplete-contents.outputs.artifact-contents-evidence-digest }}
      install-evidence-artifact-id: ${{ steps.upload-install.outputs.artifact-id }}
      install-evidence-artifact-digest: ${{ steps.upload-install.outputs.artifact-digest }}
      install-evidence-artifact-name: ${{ steps.names.outputs.install-evidence-name }}
      install-evidence-digest: ${{ steps.install.outputs.install-import-evidence-digest || steps.incomplete-install.outputs.install-import-evidence-digest }}
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
      - name: Install exact toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install: true
      - name: Download Qualification Snapshot by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-tarball.outputs.qualification-snapshot-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Adapter context by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-tarball.outputs.adapter-context-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download exact tarball by artifact ID
        if: needs.build-tarball.outputs.tarball-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-tarball.outputs.tarball-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Download Release Artifact record by artifact ID
        if: needs.build-tarball.outputs.release-artifact-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-tarball.outputs.release-artifact-artifact-id }}
          path: .wdv3/input
          skip-decompress: true
          digest-mismatch: error
      - name: Run artifact-contents mechanics
        id: contents
        if: needs.build-tarball.outputs.release-artifact-artifact-id != '' && needs.build-tarball.outputs.tarball-artifact-id != ''
        env:
          TARBALL_NAME: ${{ needs.build-tarball.outputs.tarball-artifact-name }}
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release run-artifact-contents \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${GITHUB_SHA}" \
            --qualification-snapshot ".wdv3/input/${{ needs.build-tarball.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.build-tarball.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.build-tarball.outputs.qualification-snapshot-artifact-id }}" \
            --qualification-snapshot-artifact-digest "${{ needs.build-tarball.outputs.qualification-snapshot-artifact-digest }}" \
            --adapter-context ".wdv3/input/${{ needs.build-tarball.outputs.adapter-context-artifact-name }}" \
            --adapter-context-digest "${{ needs.build-tarball.outputs.adapter-context-digest }}" \
            --adapter-context-artifact-id "${{ needs.build-tarball.outputs.adapter-context-artifact-id }}" \
            --adapter-context-artifact-digest "${{ needs.build-tarball.outputs.adapter-context-artifact-digest }}" \
            --release-artifact ".wdv3/input/${{ needs.build-tarball.outputs.release-artifact-artifact-name }}" \
            --release-artifact-digest "${{ needs.build-tarball.outputs.release-artifact-digest }}" \
            --release-artifact-artifact-id "${{ needs.build-tarball.outputs.release-artifact-artifact-id }}" \
            --release-artifact-artifact-digest "${{ needs.build-tarball.outputs.release-artifact-artifact-digest }}" \
            --tarball ".wdv3/input/${TARBALL_NAME}" \
            --output .wdv3/artifact-contents-evidence.json \
            --github-output "${GITHUB_OUTPUT}"
      - name: Form incomplete artifact-contents Evidence
        id: incomplete-contents
        if: needs.build-tarball.outputs.release-artifact-artifact-id == '' || needs.build-tarball.outputs.tarball-artifact-id == ''
        run: |
          uv run --python 3.13 --package "${WDV3_PACKAGE}" \
            three-workflow-delivery-v3 release form-incomplete-evidence \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --target "${GITHUB_SHA}" \
            --qualification-snapshot ".wdv3/input/${{ needs.build-tarball.outputs.qualification-snapshot-artifact-name }}" \
            --qualification-snapshot-digest "${{ needs.build-tarball.outputs.qualification-snapshot-digest }}" \
            --qualification-snapshot-artifact-id "${{ needs.build-tarball.outputs.qualification-snapshot-artifact-id }}" \
