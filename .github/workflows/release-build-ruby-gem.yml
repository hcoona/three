name: Build Ruby Gem (Reusable)

on:
  workflow_call:
    inputs:
      target:
        description: 'Target commit SHA to build from'
        required: true
        type: string
      project:
        description: 'Gem name (must match <project>.gemspec filename)'
        required: true
        type: string
      package_dir:
        description: 'Directory containing the Ruby gem project'
        required: true
        type: string
      version:
        description: 'Expected gem version'
        required: true
        type: string
      package_name:
        description: 'Planner-frozen Ruby package name; defaults to project for compatibility'
        required: false
        default: ''
        type: string
      package_version:
        description: 'Planner-frozen Ruby package version; defaults to version for compatibility'
        required: false
        default: ''
        type: string
      ruby_version:
        description: 'Ruby version'
        required: true
        type: string
      artifact_name:
        description: 'Artifact name to upload out/* as'
        required: true
        type: string
      expected_gem_filename:
        description: 'Planner-frozen Ruby gem basename; empty when no RubyGems registry target is active'
        required: false
        default: ''
        type: string

jobs:
  build:
    name: Build Ruby gem
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.target }}
          persist-credentials: false

      - name: Install system dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            dvisvgm \
            pdf2svg \
            poppler-utils \
            imagemagick \
            ghostscript

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet tool restore

      - name: Setup Ruby (Bundler)
        if: ${{ hashFiles(format('{0}/Gemfile', inputs.package_dir)) != '' }}
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true
          working-directory: ${{ inputs.package_dir }}

      - name: Setup Ruby
        if: ${{ hashFiles(format('{0}/Gemfile', inputs.package_dir)) == '' }}
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: ${{ inputs.ruby_version }}

      - name: Run quality checks (Bundler)
        if: ${{ hashFiles(format('{0}/Gemfile', inputs.package_dir)) != '' }}
        shell: bash
        working-directory: ${{ inputs.package_dir }}
        run: |
          set -Eeuo pipefail
          bundle exec standardrb
          bundle exec rspec

      - name: Skip Bundler checks (no Gemfile)
        if: ${{ hashFiles(format('{0}/Gemfile', inputs.package_dir)) == '' }}
        shell: bash
        env:
          PACKAGE_DIR: ${{ inputs.package_dir }}
        run: |
          set -Eeuo pipefail
          echo "No Gemfile found in '${PACKAGE_DIR}'; skipping Bundler-based quality checks (standardrb/rspec)."

      - name: Build gem
        shell: bash
        working-directory: ${{ inputs.package_dir }}
        env:
          PROJECT: ${{ inputs.project }}
          VERSION: ${{ inputs.version }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          EXPECTED_GEM_FILENAME: ${{ inputs.expected_gem_filename }}
        run: |
          set -Eeuo pipefail

          rm -rf "${GITHUB_WORKSPACE}/out"
          mkdir -p "${GITHUB_WORKSPACE}/out"

          export TZ=UTC
          export LC_ALL=C.UTF-8
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH

          expected_package_name="${PACKAGE_NAME:-${PROJECT}}"
          expected_package_version="${PACKAGE_VERSION:-${VERSION}}"
          expected_gem_filename="${EXPECTED_GEM_FILENAME:-${expected_package_name}-${expected_package_version}.gem}"
          if [[ "${expected_gem_filename}" != *.gem || "${expected_gem_filename}" == */* || "${expected_gem_filename}" == *\\* ]]; then
            echo "Invalid expected gem filename: ${expected_gem_filename}" >&2
            exit 1
          fi
          out_gem="${GITHUB_WORKSPACE}/out/${expected_gem_filename}"

          if [[ ! -f "${PROJECT}.gemspec" ]]; then
            echo "Missing gemspec: ${PROJECT}.gemspec" >&2
            exit 1
          fi

          gem build "${PROJECT}.gemspec" --output "${out_gem}"

          if [[ ! -f "${out_gem}" ]]; then
            echo "gem build did not produce expected output: ${out_gem}" >&2
            exit 1
          fi

          extra_local=$(find . -maxdepth 1 -type f -name '*.gem' -print | wc -l | tr -d ' ')
          if [[ "${extra_local}" != "0" ]]; then
            echo "Unexpected extra *.gem files were produced in the package directory; the build must use --output only." >&2
            find . -maxdepth 1 -type f -name '*.gem' -print >&2 || true
            exit 1
          fi

          out_count=$(find "${GITHUB_WORKSPACE}/out" -maxdepth 1 -type f -name '*.gem' -print | wc -l | tr -d ' ')
          if [[ "${out_count}" != "1" ]]; then
            echo "Expected exactly one .gem in out/, found ${out_count}." >&2
            ls -la "${GITHUB_WORKSPACE}/out" >&2 || true
            exit 1
          fi

      - name: Verify gem identity matches inputs
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
          VERSION: ${{ inputs.version }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          EXPECTED_GEM_FILENAME: ${{ inputs.expected_gem_filename }}
        run: |
          set -Eeuo pipefail

          expected_package_name="${PACKAGE_NAME:-${PROJECT}}"
          expected_package_version="${PACKAGE_VERSION:-${VERSION}}"
          expected_gem_filename="${EXPECTED_GEM_FILENAME:-${expected_package_name}-${expected_package_version}.gem}"
          if [[ "${expected_gem_filename}" != *.gem || "${expected_gem_filename}" == */* || "${expected_gem_filename}" == *\\* ]]; then
            echo "Invalid expected gem filename: ${expected_gem_filename}" >&2
            exit 1
          fi

          gem_path="${GITHUB_WORKSPACE}/out/${expected_gem_filename}"
          if [[ ! -f "${gem_path}" ]]; then
            echo "Missing gem artifact: ${gem_path}" >&2
            exit 1
          fi

          actual_basename="$(basename "${gem_path}")"
          if [[ "${actual_basename}" != "${expected_gem_filename}" ]]; then
            echo "Gem filename mismatch: expected ${expected_gem_filename}, got ${actual_basename}" >&2
            exit 1
          fi

          mapfile -t spec_fields < <(
            ruby -e '
              require "rubygems/package"
              spec = Gem::Package.new(ARGV.fetch(0)).spec
              puts spec.name
              puts spec.version.to_s
            ' "${gem_path}"
          )

          if [[ "${#spec_fields[@]}" -ne 2 ]]; then
            echo "Failed to read gem identity from ${gem_path}" >&2
            exit 1
          fi

          spec_name="${spec_fields[0]}"
          spec_version="${spec_fields[1]}"

          if [[ "${spec_name}" != "${expected_package_name}" ]]; then
            echo "Gem name mismatch: expected ${expected_package_name}, got ${spec_name}" >&2
            exit 1
          fi

          if [[ "${spec_version}" != "${expected_package_version}" ]]; then
            echo "Gem version mismatch: expected ${expected_package_version}, got ${spec_version}" >&2
            exit 1
          fi

          echo "Verified gem identity: ${spec_name} ${spec_version}"

      - name: Write release asset receipts
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/asset-receipts"
          python - "${GITHUB_WORKSPACE}/out" "${GITHUB_WORKSPACE}/asset-receipts/release-asset-receipts.json" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import sys
          from pathlib import Path

          out_dir = Path(sys.argv[1])
          receipt_path = Path(sys.argv[2])
          receipts = []
          for path in sorted(out_dir.iterdir(), key=lambda item: item.name):
              if not path.is_file() or path.name == receipt_path.name:
                  continue
              receipts.append(
                  {
                      "name": path.name,
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
              )
          if not receipts:
              raise SystemExit("no release assets found for receipt generation")
          receipt_path.write_text(json.dumps(receipts, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ github.workspace }}/out/*
          if-no-files-found: error
      - name: Upload release asset receipts artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}-asset-receipts
          path: ${{ github.workspace }}/asset-receipts/release-asset-receipts.json
          if-no-files-found: error
