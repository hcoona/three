      - name: Bind approval-bundle payload identity
        id: seal-approval-bundle
        env:
          WDV3_PAYLOAD: .wdv3/bundle.json
        if: steps.materialize.outputs.publish-required == 'true'
        run: |
          $hex = (Get-FileHash -LiteralPath $env:WDV3_PAYLOAD -Algorithm SHA256).Hash.ToLowerInvariant()
          $name = "wdv3-nuget-approval-bundle-r${env:GITHUB_RUN_ID}-$hex.json"
          $path = Join-Path '.wdv3/upload' $name
          New-Item -ItemType Directory -Path '.wdv3/upload' -Force | Out-Null
          Copy-Item -LiteralPath $env:WDV3_PAYLOAD -Destination $path
          @("name=$name", "digest=sha256:$hex", "path=$path") | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
      - name: Upload immutable approval-bundle
        id: upload-approval-bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.seal-approval-bundle.outputs.name }}
          path: ${{ steps.seal-approval-bundle.outputs.path }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
        if: steps.materialize.outputs.publish-required == 'true'
    outputs:
      publication-snapshot-name: ${{ steps.seal-publication-snapshot.outputs.name }}
      publication-snapshot-digest: ${{ steps.seal-publication-snapshot.outputs.digest }}
      publication-snapshot-id: ${{ steps.upload-publication-snapshot.outputs.artifact-id }}
      publication-snapshot-transport-digest: ${{ steps.upload-publication-snapshot.outputs.artifact-digest }}
      publication-snapshot-url: ${{ steps.upload-publication-snapshot.outputs.artifact-url }}
      reviewer-summary-name: ${{ steps.seal-reviewer-summary.outputs.name }}
      reviewer-summary-digest: ${{ steps.seal-reviewer-summary.outputs.digest }}
      reviewer-summary-id: ${{ steps.upload-reviewer-summary.outputs.artifact-id }}
      reviewer-summary-transport-digest: ${{ steps.upload-reviewer-summary.outputs.artifact-digest }}
      reviewer-summary-url: ${{ steps.upload-reviewer-summary.outputs.artifact-url }}
      approval-bundle-name: ${{ steps.seal-approval-bundle.outputs.name }}
      approval-bundle-digest: ${{ steps.seal-approval-bundle.outputs.digest }}
      approval-bundle-id: ${{ steps.upload-approval-bundle.outputs.artifact-id }}
      approval-bundle-transport-digest: ${{ steps.upload-approval-bundle.outputs.artifact-digest }}
      approval-bundle-url: ${{ steps.upload-approval-bundle.outputs.artifact-url }}
      publish-required: ${{ steps.materialize.outputs.publish-required }}
      resource-concurrency-key: ${{ steps.materialize.outputs.resource-concurrency-key }}
  approve-publication:
    name: Approve the current native publication
    if: github.run_attempt == 1 && needs.materialize-publication.outputs.publish-required == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    needs:
      - admit
      - plan-qualification
      - build-nuget-package
      - qualification-finalizer
      - observe-github-packages
      - materialize-publication
    steps:
      - name: Verify the existing Approval Environment marker
        id: approval-marker
        env:
          WDV3_ACTUAL_APPROVAL_MARKER: ${{ vars.WDV3_APPROVAL_ENVIRONMENT_MARKER }}
        run: |
          if ($env:WDV3_ACTUAL_APPROVAL_MARKER -cne 'workflow-delivery-v3-buddy-approval/v1') { throw 'Approval Environment marker mismatch' }
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.12
      - name: Download immutable inputs by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids:
            ${{ inputs.intent-id }},${{ inputs.repository-model-id }},${{ inputs.eligibility-id }},${{ needs.admit.outputs.attempt-binding-id
            }},${{ needs.plan-qualification.outputs.qualification-snapshot-id }},${{ needs.qualification-finalizer.outputs.qualification-decision-id
            }},${{ needs.build-nuget-package.outputs.release-artifact-id }},${{ needs.observe-github-packages.outputs.observation-id
            }},${{ needs.materialize-publication.outputs.publication-snapshot-id }},${{ needs.materialize-publication.outputs.reviewer-summary-id
            }},${{ needs.materialize-publication.outputs.approval-bundle-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: Form current action-bound Publication Authorization
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WDV3_ARG_INTENT: .wdv3/input/${{ inputs.intent-name }}
          WDV3_ARG_INTENT_DIGEST: ${{ inputs.intent-digest }}
          WDV3_ARG_INTENT_ARTIFACT_ID: ${{ inputs.intent-id }}
          WDV3_ARG_INTENT_ARTIFACT_DIGEST: ${{ inputs.intent-transport-digest }}
          WDV3_ARG_REPOSITORY_MODEL: .wdv3/input/${{ inputs.repository-model-name }}
          WDV3_ARG_REPOSITORY_MODEL_DIGEST: ${{ inputs.repository-model-digest }}
          WDV3_ARG_REPOSITORY_MODEL_ARTIFACT_ID: ${{ inputs.repository-model-id }}
          WDV3_ARG_REPOSITORY_MODEL_ARTIFACT_DIGEST: ${{ inputs.repository-model-transport-digest }}
          WDV3_ARG_LIVE_ELIGIBILITY_DECISION: .wdv3/input/${{ inputs.eligibility-name }}
          WDV3_ARG_LIVE_ELIGIBILITY_ARTIFACT_ID: ${{ inputs.eligibility-id }}
          WDV3_ARG_LIVE_ELIGIBILITY_ARTIFACT_DIGEST: ${{ inputs.eligibility-transport-digest }}
          WDV3_ARG_LIVE_ELIGIBILITY_PAYLOAD_DIGEST: ${{ inputs.eligibility-digest }}
          WDV3_ARG_ATTEMPT_BINDING: .wdv3/input/${{ needs.admit.outputs.attempt-binding-name }}
          WDV3_ARG_ATTEMPT_BINDING_DIGEST: ${{ needs.admit.outputs.attempt-binding-digest }}
          WDV3_ARG_ATTEMPT_BINDING_ARTIFACT_ID: ${{ needs.admit.outputs.attempt-binding-id }}
          WDV3_ARG_ATTEMPT_BINDING_ARTIFACT_DIGEST: ${{ needs.admit.outputs.attempt-binding-transport-digest }}
          WDV3_ARG_QUALIFICATION_SNAPSHOT: .wdv3/input/${{ needs.plan-qualification.outputs.qualification-snapshot-name }}
          WDV3_ARG_QUALIFICATION_SNAPSHOT_DIGEST: ${{ needs.plan-qualification.outputs.qualification-snapshot-digest }}
          WDV3_ARG_QUALIFICATION_SNAPSHOT_ARTIFACT_ID: ${{ needs.plan-qualification.outputs.qualification-snapshot-id }}
          WDV3_ARG_QUALIFICATION_SNAPSHOT_ARTIFACT_DIGEST:
            ${{ needs.plan-qualification.outputs.qualification-snapshot-transport-digest
            }}
          WDV3_ARG_QUALIFICATION_DECISION:
            .wdv3/input/${{ needs.qualification-finalizer.outputs.qualification-decision-name
            }}
          WDV3_ARG_QUALIFICATION_DECISION_DIGEST: ${{ needs.qualification-finalizer.outputs.qualification-decision-digest }}
          WDV3_ARG_QUALIFICATION_DECISION_ARTIFACT_ID: ${{ needs.qualification-finalizer.outputs.qualification-decision-id }}
          WDV3_ARG_QUALIFICATION_DECISION_ARTIFACT_DIGEST:
            ${{ needs.qualification-finalizer.outputs.qualification-decision-transport-digest
            }}
          WDV3_ARG_QUALIFICATION_DECISION_ARTIFACT_URL:
            ${{ needs.qualification-finalizer.outputs.qualification-decision-url
            }}
          WDV3_ARG_QUALIFICATION_DECISION_PAYLOAD_PATH:
            ${{ needs.qualification-finalizer.outputs.qualification-decision-name
            }}
          WDV3_ARG_RELEASE_ARTIFACT: .wdv3/input/${{ needs.build-nuget-package.outputs.release-artifact-name }}
          WDV3_ARG_RELEASE_ARTIFACT_DIGEST: ${{ needs.build-nuget-package.outputs.release-artifact-digest }}
          WDV3_ARG_RELEASE_ARTIFACT_ARTIFACT_ID: ${{ needs.build-nuget-package.outputs.release-artifact-id }}
          WDV3_ARG_RELEASE_ARTIFACT_ARTIFACT_DIGEST:
            ${{ needs.build-nuget-package.outputs.release-artifact-transport-digest
            }}
          WDV3_ARG_OBSERVATION: .wdv3/input/${{ needs.observe-github-packages.outputs.observation-name }}
          WDV3_ARG_OBSERVATION_DIGEST: ${{ needs.observe-github-packages.outputs.observation-digest }}
          WDV3_ARG_OBSERVATION_ARTIFACT_ID: ${{ needs.observe-github-packages.outputs.observation-id }}
          WDV3_ARG_OBSERVATION_ARTIFACT_DIGEST: ${{ needs.observe-github-packages.outputs.observation-transport-digest }}
          WDV3_ARG_PUBLICATION_SNAPSHOT: .wdv3/input/${{ needs.materialize-publication.outputs.publication-snapshot-name }}
          WDV3_ARG_PUBLICATION_SNAPSHOT_DIGEST: ${{ needs.materialize-publication.outputs.publication-snapshot-digest }}
          WDV3_ARG_PUBLICATION_SNAPSHOT_ARTIFACT_ID: ${{ needs.materialize-publication.outputs.publication-snapshot-id }}
          WDV3_ARG_PUBLICATION_SNAPSHOT_ARTIFACT_DIGEST:
            ${{ needs.materialize-publication.outputs.publication-snapshot-transport-digest
            }}
          WDV3_ARG_PUBLICATION_SNAPSHOT_ARTIFACT_URL: ${{ needs.materialize-publication.outputs.publication-snapshot-url }}
          WDV3_ARG_PUBLICATION_SNAPSHOT_PAYLOAD_PATH: ${{ needs.materialize-publication.outputs.publication-snapshot-name }}
