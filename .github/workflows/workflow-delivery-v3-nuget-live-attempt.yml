            '--terminal-artifact-digest',
            $env:WDV3_ARG_TERMINAL_ARTIFACT_DIGEST,
            '--terminal-artifact-url',
            $env:WDV3_ARG_TERMINAL_ARTIFACT_URL,
            '--terminal-payload-path',
            'publication-result.json',
            '--github-output',
            $env:GITHUB_OUTPUT
          )
          uv run --python 3.13.12 --package $env:WDV3_PACKAGE three-workflow-delivery-v3 @arguments
          $commandStatus = $LASTEXITCODE
          if ($commandStatus -ne 0) { exit $commandStatus }
      - name: Clean only caller-owned prepared runtime
        if: always() && steps.prepare.outputs.runtime-created == 'true'
        env:
          WDV3_OWNED_RUNTIME: ${{ runner.temp }}/wdv3-nuget-publication-${{ github.run_id }}
        run: |
          if (Test-Path -LiteralPath $env:WDV3_OWNED_RUNTIME) { Remove-Item -LiteralPath $env:WDV3_OWNED_RUNTIME -Recurse -Force }
    concurrency:
      group: wdv3-resource-${{ needs.materialize-publication.outputs.resource-concurrency-key }}
      cancel-in-progress: false
    outputs:
      publication-terminal-reference:
        ${{ steps.admit-result.outputs.publication-terminal-reference || steps.admit-marker.outputs.publication-terminal-reference
        || 'null' }}
      publication-step-outcome: ${{ steps.publish.outcome }}
      mutation-marker-name: ${{ steps.seal-mutation-marker.outputs.name }}
      mutation-marker-digest: ${{ steps.seal-mutation-marker.outputs.digest }}
      mutation-marker-id: ${{ steps.upload-mutation-marker.outputs.artifact-id }}
      mutation-marker-transport-digest: ${{ steps.upload-mutation-marker.outputs.artifact-digest }}
      mutation-marker-url: ${{ steps.upload-mutation-marker.outputs.artifact-url }}
      publication-result-name: ${{ steps.seal-publication-result.outputs.name }}
      publication-result-digest: ${{ steps.seal-publication-result.outputs.digest }}
      publication-result-id: ${{ steps.upload-publication-result.outputs.artifact-id }}
      publication-result-transport-digest: ${{ steps.upload-publication-result.outputs.artifact-digest }}
      publication-result-url: ${{ steps.upload-publication-result.outputs.artifact-url }}
  prove-exact-satisfied:
    name: Prove fresh native zero-action satisfaction
    if:
      always() && github.run_attempt == 1 && needs.admit.outputs.identity-admitted == 'true' && needs.materialize-publication.outputs.publish-required
      == 'false' && needs.publish-github-packages.result == 'skipped'
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
    needs:
      - admit
      - plan-qualification
      - build-nuget-package
      - qualification-finalizer
      - observe-github-packages
      - materialize-publication
      - publish-github-packages
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.12
      - name: Install pinned .NET SDK and runtime
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.300
      - name: Download immutable inputs by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids:
            ${{ inputs.intent-id }},${{ inputs.repository-model-id }},${{ inputs.eligibility-id }},${{ needs.admit.outputs.attempt-binding-id
            }},${{ needs.plan-qualification.outputs.qualification-snapshot-id }},${{ needs.qualification-finalizer.outputs.qualification-decision-id
            }},${{ needs.build-nuget-package.outputs.release-artifact-id }},${{ needs.observe-github-packages.outputs.observation-id
            }},${{ needs.materialize-publication.outputs.publication-snapshot-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: Download trusted prebuilt helper by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.helper-id }}
          path: .wdv3/helper-archive
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: Verify and extract the trusted helper runtime
        env:
          WDV3_HELPER_ARCHIVE: .wdv3/helper-archive/${{ inputs.helper-name }}
          WDV3_HELPER_DIGEST: ${{ inputs.helper-digest }}
        run: |
          $digest = 'sha256:' + (Get-FileHash -LiteralPath $env:WDV3_HELPER_ARCHIVE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne $env:WDV3_HELPER_DIGEST) { throw 'Trusted helper digest mismatch' }
          if (Test-Path -LiteralPath '.wdv3/helper') { throw 'Trusted helper destination already exists' }
          Expand-Archive -LiteralPath $env:WDV3_HELPER_ARCHIVE -DestinationPath '.wdv3/helper'
          foreach ($file in @('WorkflowDeliveryV3DotnetProvider.dll', 'WorkflowDeliveryV3DotnetProvider.deps.json', 'WorkflowDeliveryV3DotnetProvider.runtimeconfig.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path '.wdv3/helper' $file) -PathType Leaf)) { throw "Missing trusted helper runtime file: $file" }
          }
      - name: Reobserve exact bytes and current native authority
        id: proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WDV3_ARG_INTENT: .wdv3/input/${{ inputs.intent-name }}
          WDV3_ARG_INTENT_DIGEST: ${{ inputs.intent-digest }}
          WDV3_ARG_INTENT_ARTIFACT_ID: ${{ inputs.intent-id }}
          WDV3_ARG_INTENT_ARTIFACT_DIGEST: ${{ inputs.intent-transport-digest }}
          WDV3_ARG_REPOSITORY_MODEL: .wdv3/input/${{ inputs.repository-model-name }}
          WDV3_ARG_REPOSITORY_MODEL_DIGEST: ${{ inputs.repository-model-digest }}
          WDV3_ARG_REPOSITORY_MODEL_ARTIFACT_ID: ${{ inputs.repository-model-id }}
          WDV3_ARG_REPOSITORY_MODEL_ARTIFACT_DIGEST: ${{ inputs.repository-model-transport-digest }}
          WDV3_ARG_LIVE_ELIGIBILITY_DECISION: .wdv3/input/${{ inputs.eligibility-name }}
          WDV3_ARG_LIVE_ELIGIBILITY_ARTIFACT_ID: ${{ inputs.eligibility-id }}
          WDV3_ARG_LIVE_ELIGIBILITY_ARTIFACT_DIGEST: ${{ inputs.eligibility-transport-digest }}
          WDV3_ARG_LIVE_ELIGIBILITY_PAYLOAD_DIGEST: ${{ inputs.eligibility-digest }}
          WDV3_ARG_ATTEMPT_BINDING: .wdv3/input/${{ needs.admit.outputs.attempt-binding-name }}
          WDV3_ARG_ATTEMPT_BINDING_DIGEST: ${{ needs.admit.outputs.attempt-binding-digest }}
          WDV3_ARG_ATTEMPT_BINDING_ARTIFACT_ID: ${{ needs.admit.outputs.attempt-binding-id }}
          WDV3_ARG_ATTEMPT_BINDING_ARTIFACT_DIGEST: ${{ needs.admit.outputs.attempt-binding-transport-digest }}
          WDV3_ARG_QUALIFICATION_SNAPSHOT: .wdv3/input/${{ needs.plan-qualification.outputs.qualification-snapshot-name }}
          WDV3_ARG_QUALIFICATION_SNAPSHOT_DIGEST: ${{ needs.plan-qualification.outputs.qualification-snapshot-digest }}
          WDV3_ARG_QUALIFICATION_SNAPSHOT_ARTIFACT_ID: ${{ needs.plan-qualification.outputs.qualification-snapshot-id }}
          WDV3_ARG_QUALIFICATION_SNAPSHOT_ARTIFACT_DIGEST:
            ${{ needs.plan-qualification.outputs.qualification-snapshot-transport-digest
            }}
          WDV3_ARG_QUALIFICATION_DECISION:
            .wdv3/input/${{ needs.qualification-finalizer.outputs.qualification-decision-name
            }}
          WDV3_ARG_QUALIFICATION_DECISION_DIGEST: ${{ needs.qualification-finalizer.outputs.qualification-decision-digest }}
          WDV3_ARG_QUALIFICATION_DECISION_ARTIFACT_ID: ${{ needs.qualification-finalizer.outputs.qualification-decision-id }}
          WDV3_ARG_QUALIFICATION_DECISION_ARTIFACT_DIGEST:
            ${{ needs.qualification-finalizer.outputs.qualification-decision-transport-digest
            }}
          WDV3_ARG_QUALIFICATION_DECISION_ARTIFACT_URL:
            ${{ needs.qualification-finalizer.outputs.qualification-decision-url
            }}
          WDV3_ARG_QUALIFICATION_DECISION_PAYLOAD_PATH:
            ${{ needs.qualification-finalizer.outputs.qualification-decision-name
            }}
          WDV3_ARG_RELEASE_ARTIFACT: .wdv3/input/${{ needs.build-nuget-package.outputs.release-artifact-name }}
          WDV3_ARG_RELEASE_ARTIFACT_DIGEST: ${{ needs.build-nuget-package.outputs.release-artifact-digest }}
          WDV3_ARG_RELEASE_ARTIFACT_ARTIFACT_ID: ${{ needs.build-nuget-package.outputs.release-artifact-id }}
          WDV3_ARG_RELEASE_ARTIFACT_ARTIFACT_DIGEST:
            ${{ needs.build-nuget-package.outputs.release-artifact-transport-digest
            }}
          WDV3_ARG_OBSERVATION: .wdv3/input/${{ needs.observe-github-packages.outputs.observation-name }}
          WDV3_ARG_OBSERVATION_DIGEST: ${{ needs.observe-github-packages.outputs.observation-digest }}
          WDV3_ARG_OBSERVATION_ARTIFACT_ID: ${{ needs.observe-github-packages.outputs.observation-id }}
          WDV3_ARG_OBSERVATION_ARTIFACT_DIGEST: ${{ needs.observe-github-packages.outputs.observation-transport-digest }}
          WDV3_ARG_PUBLICATION_SNAPSHOT: .wdv3/input/${{ needs.materialize-publication.outputs.publication-snapshot-name }}
          WDV3_ARG_PUBLICATION_SNAPSHOT_DIGEST: ${{ needs.materialize-publication.outputs.publication-snapshot-digest }}
          WDV3_ARG_PUBLICATION_SNAPSHOT_ARTIFACT_ID: ${{ needs.materialize-publication.outputs.publication-snapshot-id }}
          WDV3_ARG_PUBLICATION_SNAPSHOT_ARTIFACT_DIGEST:
            ${{ needs.materialize-publication.outputs.publication-snapshot-transport-digest
            }}
          WDV3_ARG_PUBLICATION_SNAPSHOT_ARTIFACT_URL: ${{ needs.materialize-publication.outputs.publication-snapshot-url }}
          WDV3_ARG_PUBLICATION_SNAPSHOT_PAYLOAD_PATH: ${{ needs.materialize-publication.outputs.publication-snapshot-name }}
          WDV3_ARG_CONTROL: workflow-delivery-v3:${{ github.sha }}
          WDV3_ARG_PUBLISHER_CONCLUSION: ${{ needs.publish-github-packages.result }}
        run: |
          $arguments = @(
            'release',
            'nuget',
            'prove-exact-satisfied',
            '--workflow-run-id',
            $env:GITHUB_RUN_ID,
            '--run-attempt',
            $env:GITHUB_RUN_ATTEMPT,
            '--target',
            $env:GITHUB_SHA,
            '--intent',
            $env:WDV3_ARG_INTENT,
            '--intent-digest',
            $env:WDV3_ARG_INTENT_DIGEST,
            '--intent-artifact-id',
            $env:WDV3_ARG_INTENT_ARTIFACT_ID,
            '--intent-artifact-digest',
            $env:WDV3_ARG_INTENT_ARTIFACT_DIGEST,
            '--repository-model',
            $env:WDV3_ARG_REPOSITORY_MODEL,
            '--repository-model-digest',
            $env:WDV3_ARG_REPOSITORY_MODEL_DIGEST,
            '--repository-model-artifact-id',
            $env:WDV3_ARG_REPOSITORY_MODEL_ARTIFACT_ID,
            '--repository-model-artifact-digest',
            $env:WDV3_ARG_REPOSITORY_MODEL_ARTIFACT_DIGEST,
            '--live-eligibility-decision',
            $env:WDV3_ARG_LIVE_ELIGIBILITY_DECISION,
            '--live-eligibility-artifact-id',
            $env:WDV3_ARG_LIVE_ELIGIBILITY_ARTIFACT_ID,
            '--live-eligibility-artifact-digest',
            $env:WDV3_ARG_LIVE_ELIGIBILITY_ARTIFACT_DIGEST,
            '--live-eligibility-payload-digest',
            $env:WDV3_ARG_LIVE_ELIGIBILITY_PAYLOAD_DIGEST,
            '--attempt-binding',
            $env:WDV3_ARG_ATTEMPT_BINDING,
            '--attempt-binding-digest',
            $env:WDV3_ARG_ATTEMPT_BINDING_DIGEST,
            '--attempt-binding-artifact-id',
            $env:WDV3_ARG_ATTEMPT_BINDING_ARTIFACT_ID,
            '--attempt-binding-artifact-digest',
            $env:WDV3_ARG_ATTEMPT_BINDING_ARTIFACT_DIGEST,
            '--qualification-snapshot',
            $env:WDV3_ARG_QUALIFICATION_SNAPSHOT,
            '--qualification-snapshot-digest',
            $env:WDV3_ARG_QUALIFICATION_SNAPSHOT_DIGEST,
            '--qualification-snapshot-artifact-id',
            $env:WDV3_ARG_QUALIFICATION_SNAPSHOT_ARTIFACT_ID,
            '--qualification-snapshot-artifact-digest',
            $env:WDV3_ARG_QUALIFICATION_SNAPSHOT_ARTIFACT_DIGEST,
            '--qualification-decision',
            $env:WDV3_ARG_QUALIFICATION_DECISION,
            '--qualification-decision-digest',
            $env:WDV3_ARG_QUALIFICATION_DECISION_DIGEST,
            '--qualification-decision-artifact-id',
            $env:WDV3_ARG_QUALIFICATION_DECISION_ARTIFACT_ID,
            '--qualification-decision-artifact-digest',
            $env:WDV3_ARG_QUALIFICATION_DECISION_ARTIFACT_DIGEST,
            '--qualification-decision-artifact-url',
            $env:WDV3_ARG_QUALIFICATION_DECISION_ARTIFACT_URL,
            '--qualification-decision-payload-path',
            $env:WDV3_ARG_QUALIFICATION_DECISION_PAYLOAD_PATH,
            '--release-artifact',
            $env:WDV3_ARG_RELEASE_ARTIFACT,
            '--release-artifact-digest',
            $env:WDV3_ARG_RELEASE_ARTIFACT_DIGEST,
            '--release-artifact-artifact-id',
            $env:WDV3_ARG_RELEASE_ARTIFACT_ARTIFACT_ID,
            '--release-artifact-artifact-digest',
            $env:WDV3_ARG_RELEASE_ARTIFACT_ARTIFACT_DIGEST,
            '--observation',
            $env:WDV3_ARG_OBSERVATION,
            '--observation-digest',
            $env:WDV3_ARG_OBSERVATION_DIGEST,
            '--observation-artifact-id',
            $env:WDV3_ARG_OBSERVATION_ARTIFACT_ID,
            '--observation-artifact-digest',
            $env:WDV3_ARG_OBSERVATION_ARTIFACT_DIGEST,
            '--publication-snapshot',
            $env:WDV3_ARG_PUBLICATION_SNAPSHOT,
            '--publication-snapshot-digest',
            $env:WDV3_ARG_PUBLICATION_SNAPSHOT_DIGEST,
            '--publication-snapshot-artifact-id',
            $env:WDV3_ARG_PUBLICATION_SNAPSHOT_ARTIFACT_ID,
            '--publication-snapshot-artifact-digest',
            $env:WDV3_ARG_PUBLICATION_SNAPSHOT_ARTIFACT_DIGEST,
            '--publication-snapshot-artifact-url',
            $env:WDV3_ARG_PUBLICATION_SNAPSHOT_ARTIFACT_URL,
            '--publication-snapshot-payload-path',
            $env:WDV3_ARG_PUBLICATION_SNAPSHOT_PAYLOAD_PATH,
            '--helper-dll',
            '.wdv3/helper/WorkflowDeliveryV3DotnetProvider.dll',
            '--control',
            $env:WDV3_ARG_CONTROL,
            '--publisher-conclusion',
            $env:WDV3_ARG_PUBLISHER_CONCLUSION,
            '--output',
            '.wdv3/exact-proof.json',
            '--github-output',
            $env:GITHUB_OUTPUT,
            '--github-token',
            $env:GITHUB_TOKEN
          )
          uv run --python 3.13.12 --package $env:WDV3_PACKAGE three-workflow-delivery-v3 @arguments
          $commandStatus = $LASTEXITCODE
          if ($commandStatus -ne 0) { exit $commandStatus }
      - name: Bind exact-satisfied-finalization-proof payload identity
        id: seal-exact-satisfied-finalization-proof
        env:
          WDV3_PAYLOAD: .wdv3/exact-proof.json
        run: |
          $hex = (Get-FileHash -LiteralPath $env:WDV3_PAYLOAD -Algorithm SHA256).Hash.ToLowerInvariant()
          $name = "wdv3-nuget-exact-satisfied-finalization-proof-r${env:GITHUB_RUN_ID}-$hex.json"
          $path = Join-Path '.wdv3/upload' $name
          New-Item -ItemType Directory -Path '.wdv3/upload' -Force | Out-Null
          Copy-Item -LiteralPath $env:WDV3_PAYLOAD -Destination $path
          @("name=$name", "digest=sha256:$hex", "path=$path") | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
      - name: Upload immutable exact-satisfied-finalization-proof
        id: upload-exact-satisfied-finalization-proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.seal-exact-satisfied-finalization-proof.outputs.name }}
          path: ${{ steps.seal-exact-satisfied-finalization-proof.outputs.path }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
    outputs:
      exact-satisfied-finalization-proof-name: ${{ steps.seal-exact-satisfied-finalization-proof.outputs.name }}
      exact-satisfied-finalization-proof-digest: ${{ steps.seal-exact-satisfied-finalization-proof.outputs.digest }}
      exact-satisfied-finalization-proof-id: ${{ steps.upload-exact-satisfied-finalization-proof.outputs.artifact-id }}
      exact-satisfied-finalization-proof-transport-digest:
        ${{ steps.upload-exact-satisfied-finalization-proof.outputs.artifact-digest
        }}
      exact-satisfied-finalization-proof-url: ${{ steps.upload-exact-satisfied-finalization-proof.outputs.artifact-url }}
  release-finalizer:
    name: Finalize the current native Attempt Outcome
    if: always() && github.run_attempt == 1 && needs.admit.outputs.identity-admitted == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    needs:
      - admit
      - plan-qualification
      - build-nuget-package
      - nuget-artifact-qualification
      - qualification-finalizer
      - observe-github-packages
      - materialize-publication
      - approve-publication
      - publish-github-packages
      - prove-exact-satisfied
    steps:
      - name: Check out exact selected target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.12
      - name: Download immutable inputs by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids:
            ${{ inputs.intent-id }},${{ inputs.repository-model-id }},${{ inputs.eligibility-id }},${{ needs.admit.outputs.attempt-binding-id
            }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: Download available qualification-snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.plan-qualification.outputs.qualification-snapshot-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
        if: always() && needs.plan-qualification.outputs.qualification-snapshot-id != ''
      - name: Download available qualification-decision
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.qualification-finalizer.outputs.qualification-decision-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
        if: always() && needs.qualification-finalizer.outputs.qualification-decision-id != ''
      - name: Download available build-evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build-nuget-package.outputs.build-evidence-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
        if: always() && needs.build-nuget-package.outputs.build-evidence-id != ''
      - name: Download available artifact-contents-evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.nuget-artifact-qualification.outputs.artifact-contents-evidence-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
        if: always() && needs.nuget-artifact-qualification.outputs.artifact-contents-evidence-id != ''
      - name: Download available consumer-evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.nuget-artifact-qualification.outputs.consumer-evidence-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
        if: always() && needs.nuget-artifact-qualification.outputs.consumer-evidence-id != ''
      - name: Download available release-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build-nuget-package.outputs.release-artifact-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
        if: always() && needs.build-nuget-package.outputs.release-artifact-id != ''
      - name: Download available observation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.observe-github-packages.outputs.observation-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
        if: always() && needs.observe-github-packages.outputs.observation-id != ''
      - name: Download available publication-snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.materialize-publication.outputs.publication-snapshot-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
        if: always() && needs.materialize-publication.outputs.publication-snapshot-id != ''
      - name: Download available reviewer-summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.materialize-publication.outputs.reviewer-summary-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
        if: always() && needs.materialize-publication.outputs.reviewer-summary-id != ''
      - name: Download available approval-bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.materialize-publication.outputs.approval-bundle-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
        if: always() && needs.materialize-publication.outputs.approval-bundle-id != ''
      - name: Download available publication-authorization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.approve-publication.outputs.publication-authorization-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
        if: always() && needs.approve-publication.outputs.publication-authorization-id != ''
      - name: Download available exact-satisfied-finalization-proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.prove-exact-satisfied.outputs.exact-satisfied-finalization-proof-id }}
          path: .wdv3/input
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
        if: always() && needs.prove-exact-satisfied.outputs.exact-satisfied-finalization-proof-id != ''
      - name: Resolve the sole current-DAG publication terminal
        id: terminal
        if: always()
        env:
          WDV3_ARG_PUBLICATION_TERMINAL_REFERENCE:
            ${{ needs.publish-github-packages.outputs.publication-terminal-reference
            || 'null' }}
          WDV3_ARG_PUBLISHER_CONCLUSION: ${{ needs.publish-github-packages.result }}
        run: |
          $arguments = @(
