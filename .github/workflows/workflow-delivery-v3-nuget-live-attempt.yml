        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.seal-observation.outputs.name }}
          path: ${{ steps.seal-observation.outputs.path }}
          if-no-files-found: error
          retention-days: 45
