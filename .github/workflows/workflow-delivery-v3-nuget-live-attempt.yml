          }
          if ($env:WDV3_ARG_EXACT_SATISFIED_FINALIZATION_PROOF_OPTIONAL_ID) {
            $arguments += @('--exact-satisfied-finalization-proof', $env:WDV3_ARG_EXACT_SATISFIED_FINALIZATION_PROOF, '--exact-satisfied-finalization-proof-digest', $env:WDV3_ARG_EXACT_SATISFIED_FINALIZATION_PROOF_DIGEST, '--exact-satisfied-finalization-proof-artifact-id', $env:WDV3_ARG_EXACT_SATISFIED_FINALIZATION_PROOF_ARTIFACT_ID, '--exact-satisfied-finalization-proof-artifact-digest', $env:WDV3_ARG_EXACT_SATISFIED_FINALIZATION_PROOF_ARTIFACT_DIGEST, '--exact-satisfied-finalization-proof-artifact-url', $env:WDV3_ARG_EXACT_SATISFIED_FINALIZATION_PROOF_ARTIFACT_URL, '--exact-satisfied-finalization-proof-payload-path', $env:WDV3_ARG_EXACT_SATISFIED_FINALIZATION_PROOF_PAYLOAD_PATH)
          }
          if ($env:WDV3_ARG_TERMINAL_DIRECTORY_PRESENT) { $arguments += @('--terminal-directory', '.wdv3/terminal') }
          if ($env:WDV3_ARG_MARKER_DIRECTORY_PRESENT) { $arguments += @('--marker-directory', '.wdv3/marker') }
          if ($env:WDV3_ARG_PUBLICATION_STEP_OUTCOME_PRESENT) { $arguments += @('--publication-step-outcome', $env:WDV3_ARG_PUBLICATION_STEP_OUTCOME) }
          uv run --python 3.13.12 --package $env:WDV3_PACKAGE three-workflow-delivery-v3 @arguments
          $commandStatus = $LASTEXITCODE
          if ($commandStatus -ne 0) { exit $commandStatus }
      - name: Bind attempt-outcome payload identity
        id: seal-attempt-outcome
        env:
          WDV3_PAYLOAD: .wdv3/outcome.json
        if: always() && steps.finalize.outputs.attempt-outcome-digest != ''
        run: |
          $hex = (Get-FileHash -LiteralPath $env:WDV3_PAYLOAD -Algorithm SHA256).Hash.ToLowerInvariant()
          $name = "wdv3-nuget-attempt-outcome-r${env:GITHUB_RUN_ID}-$hex.json"
          $path = Join-Path '.wdv3/upload' $name
          New-Item -ItemType Directory -Path '.wdv3/upload' -Force | Out-Null
          Copy-Item -LiteralPath $env:WDV3_PAYLOAD -Destination $path
          @("name=$name", "digest=sha256:$hex", "path=$path") | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
      - name: Upload immutable attempt-outcome
        id: upload-attempt-outcome
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.seal-attempt-outcome.outputs.name }}
          path: ${{ steps.seal-attempt-outcome.outputs.path }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
        if: always() && steps.finalize.outputs.attempt-outcome-digest != ''
      - name: Bind attempt-summary payload identity
        id: seal-attempt-summary
        env:
          WDV3_PAYLOAD: .wdv3/summary.md
        if: always() && steps.finalize.outputs.attempt-outcome-digest != ''
        run: |
          $hex = (Get-FileHash -LiteralPath $env:WDV3_PAYLOAD -Algorithm SHA256).Hash.ToLowerInvariant()
          $name = "wdv3-nuget-attempt-summary-r${env:GITHUB_RUN_ID}-$hex.md"
          $path = Join-Path '.wdv3/upload' $name
          New-Item -ItemType Directory -Path '.wdv3/upload' -Force | Out-Null
          Copy-Item -LiteralPath $env:WDV3_PAYLOAD -Destination $path
          @("name=$name", "digest=sha256:$hex", "path=$path") | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
      - name: Upload immutable attempt-summary
        id: upload-attempt-summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.seal-attempt-summary.outputs.name }}
          path: ${{ steps.seal-attempt-summary.outputs.path }}
          if-no-files-found: error
          retention-days: 45
          overwrite: false
          archive: false
          include-hidden-files: true
        if: always() && steps.finalize.outputs.attempt-outcome-digest != ''
    outputs:
      attempt-outcome-name: ${{ steps.seal-attempt-outcome.outputs.name }}
      attempt-outcome-digest: ${{ steps.seal-attempt-outcome.outputs.digest }}
      attempt-outcome-id: ${{ steps.upload-attempt-outcome.outputs.artifact-id }}
      attempt-outcome-transport-digest: ${{ steps.upload-attempt-outcome.outputs.artifact-digest }}
      attempt-outcome-url: ${{ steps.upload-attempt-outcome.outputs.artifact-url }}
      attempt-summary-name: ${{ steps.seal-attempt-summary.outputs.name }}
      attempt-summary-digest: ${{ steps.seal-attempt-summary.outputs.digest }}
      attempt-summary-id: ${{ steps.upload-attempt-summary.outputs.artifact-id }}
      attempt-summary-transport-digest: ${{ steps.upload-attempt-summary.outputs.artifact-digest }}
      attempt-summary-url: ${{ steps.upload-attempt-summary.outputs.artifact-url }}
