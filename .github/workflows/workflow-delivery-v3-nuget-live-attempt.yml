            }}
          WDV3_ARG_QUALIFICATION_DECISION_DIGEST: ${{ needs.qualification-finalizer.outputs.qualification-decision-digest }}
          WDV3_ARG_QUALIFICATION_DECISION_ARTIFACT_ID: ${{ needs.qualification-finalizer.outputs.qualification-decision-id }}
          WDV3_ARG_QUALIFICATION_DECISION_ARTIFACT_DIGEST:
            ${{ needs.qualification-finalizer.outputs.qualification-decision-transport-digest
            }}
          WDV3_ARG_PUBLICATION_SNAPSHOT: .wdv3/upload/${{ steps.seal-publication-snapshot.outputs.name }}
          WDV3_ARG_PUBLICATION_SNAPSHOT_DIGEST: ${{ steps.seal-publication-snapshot.outputs.digest }}
          WDV3_ARG_PUBLICATION_SNAPSHOT_ARTIFACT_ID: ${{ steps.upload-publication-snapshot.outputs.artifact-id }}
          WDV3_ARG_PUBLICATION_SNAPSHOT_ARTIFACT_DIGEST: ${{ steps.upload-publication-snapshot.outputs.artifact-digest }}
          WDV3_ARG_PUBLICATION_SNAPSHOT_ARTIFACT_URL: ${{ steps.upload-publication-snapshot.outputs.artifact-url }}
          WDV3_ARG_PUBLICATION_SNAPSHOT_PAYLOAD_PATH: ${{ steps.seal-publication-snapshot.outputs.name }}
          WDV3_ARG_REVIEWER_SUMMARY: .wdv3/upload/${{ steps.seal-reviewer-summary.outputs.name }}
          WDV3_ARG_REVIEWER_SUMMARY_DIGEST: ${{ steps.seal-reviewer-summary.outputs.digest }}
          WDV3_ARG_REVIEWER_SUMMARY_ARTIFACT_ID: ${{ steps.upload-reviewer-summary.outputs.artifact-id }}
          WDV3_ARG_REVIEWER_SUMMARY_ARTIFACT_DIGEST: ${{ steps.upload-reviewer-summary.outputs.artifact-digest }}
          WDV3_ARG_REVIEWER_SUMMARY_ARTIFACT_URL: ${{ steps.upload-reviewer-summary.outputs.artifact-url }}
          WDV3_ARG_REVIEWER_SUMMARY_PAYLOAD_PATH: ${{ steps.seal-reviewer-summary.outputs.name }}
          WDV3_ARG_CONTROL: workflow-delivery-v3:${{ github.sha }}
        run: |
          $arguments = @(
            'release',
            'nuget',
            'form-approval-bundle',
            '--workflow-run-id',
            $env:GITHUB_RUN_ID,
            '--run-attempt',
            $env:GITHUB_RUN_ATTEMPT,
            '--target',
            $env:GITHUB_SHA,
            '--intent',
            $env:WDV3_ARG_INTENT,
            '--intent-digest',
            $env:WDV3_ARG_INTENT_DIGEST,
            '--intent-artifact-id',
            $env:WDV3_ARG_INTENT_ARTIFACT_ID,
            '--intent-artifact-digest',
            $env:WDV3_ARG_INTENT_ARTIFACT_DIGEST,
            '--attempt-binding',
            $env:WDV3_ARG_ATTEMPT_BINDING,
            '--attempt-binding-digest',
            $env:WDV3_ARG_ATTEMPT_BINDING_DIGEST,
            '--attempt-binding-artifact-id',
            $env:WDV3_ARG_ATTEMPT_BINDING_ARTIFACT_ID,
            '--attempt-binding-artifact-digest',
            $env:WDV3_ARG_ATTEMPT_BINDING_ARTIFACT_DIGEST,
