        env:
          WDV3_HELPER_ARCHIVE: .wdv3/helper-archive/${{ inputs.helper-name }}
          WDV3_HELPER_DIGEST: ${{ inputs.helper-digest }}
        run: |
          $digest = 'sha256:' + (Get-FileHash -LiteralPath $env:WDV3_HELPER_ARCHIVE -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne $env:WDV3_HELPER_DIGEST) { throw 'Trusted helper digest mismatch' }
          if (Test-Path -LiteralPath '.wdv3/helper') { throw 'Trusted helper destination already exists' }
          Expand-Archive -LiteralPath $env:WDV3_HELPER_ARCHIVE -DestinationPath '.wdv3/helper'
          foreach ($file in @('WorkflowDeliveryV3DotnetProvider.dll', 'WorkflowDeliveryV3DotnetProvider.deps.json', 'WorkflowDeliveryV3DotnetProvider.runtimeconfig.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path '.wdv3/helper' $file) -PathType Leaf)) { throw "Missing trusted helper runtime file: $file" }
