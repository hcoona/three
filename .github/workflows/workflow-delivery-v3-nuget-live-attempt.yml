name: Workflow Delivery v3 NuGet Release
'on':
  workflow_call:
    inputs:
      target-sha:
        required: true
        type: string
      selected-ref:
        required: true
        type: string
      dry-run:
        required: true
        type: boolean
permissions: {}
defaults:
  run:
    shell: pwsh
env:
  SELECTED_REVISION: ${{ inputs.target-sha }}
  SELECTED_REF: ${{ inputs.selected-ref }}
  DRY_RUN: ${{ inputs.dry-run }}
jobs:
  prepare:
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      control-id: ${{ steps.control.outputs.artifact-id }}
      preparation-id: ${{ steps.originals.outputs.artifact-id }}
    steps:
      - name: Validate selected Buddy request
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'hcoona/three' -or $env:SELECTED_REVISION -cne $env:GITHUB_SHA -or
              $env:SELECTED_REF -cne $env:GITHUB_REF) { throw 'Selected Buddy source mismatch' }
          if ($env:DRY_RUN -ne 'true' -and $env:GITHUB_RUN_ATTEMPT -ne '1') { throw 'Live rerun is unavailable' }
      - name: Check out exact selected source and control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.target-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare selected native tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.8.10
          experimental: true
          install_args: dotnet
      - name: Build complete control before product execution
        run: |
          mise exec --locked dotnet -- dotnet build src/private/app/workflow-delivery/WorkflowDelivery.csproj -p:RestoreLockedMode=true -o "$env:RUNNER_TEMP/control"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $producer = [ordered]@{
            revision = $env:SELECTED_REVISION; selectedRef = $env:SELECTED_REF
            run = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT
            unit = 'hcoona-release-smoke-github-packages'
            dryRun = $env:DRY_RUN -eq 'true'
          }

          $producer | ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/control/producer.json" -Encoding utf8
      - name: Retain actual control results
        id: control
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nuget-buddy-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control
          if-no-files-found: error
          retention-days: 45
          overwrite: false
      - name: Qualify complete selected NuGet release
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/prepared/original", "$env:RUNNER_TEMP/scratch" | Out-Null
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/control/producer.json" -Destination "$env:RUNNER_TEMP/prepared/producer.json"
          $request = @{
            subject = @{
              revision = $env:SELECTED_REVISION; selectedRef = $env:SELECTED_REF
              unit = 'hcoona-release-smoke-github-packages'; declaration = 'src/public/lib/hcoona-release-smoke-github-packages/workflow-delivery.release-unit.yml'
              channel = 'buddy'; destination = 'github-packages-nuget'; dryRun = $env:DRY_RUN -eq 'true'
            }
            checkout = $env:GITHUB_WORKSPACE; scratch = "$env:RUNNER_TEMP/scratch"
          }
          $request | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath "$env:RUNNER_TEMP/prepared/request.json" -Encoding utf8
          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release prepare-nuget "$env:RUNNER_TEMP/prepared/request.json" > "$env:RUNNER_TEMP/prepared/preparation.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item -LiteralPath (Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/scratch/original" -File).FullName -Destination "$env:RUNNER_TEMP/prepared/original"
      - name: Retain actual prepared results
        id: originals
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nuget-buddy-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          retention-days: 45
          overwrite: false
  observe:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      write-needed: ${{ steps.state.outputs.write-needed }}
      observation-id: ${{ steps.retain.outputs.artifact-id }}
    steps:
      - name: Download control by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.control-id }}
          path: ${{ runner.temp }}/control
          digest-mismatch: error
      - name: Download prepared by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.preparation-id }}
          path: ${{ runner.temp }}/prepared
          digest-mismatch: error
      - name: Validate transferred source, mode and producer
        run: |
          $producer = [ordered]@{
            revision = $env:SELECTED_REVISION; selectedRef = $env:SELECTED_REF
            run = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT
            unit = 'hcoona-release-smoke-github-packages'
            dryRun = $env:DRY_RUN -eq 'true'
          }

          foreach ($kind in @('control', 'prepared')) {
            $actual = Get-Content -LiteralPath "$env:RUNNER_TEMP/$kind/producer.json" -Raw | ConvertFrom-Json -AsHashtable
            if ($actual.Count -ne $producer.Count) { throw 'Unexpected artifact producer fields' }
            foreach ($key in $producer.Keys) {
              if (-not $actual.ContainsKey($key) -or $actual[$key] -cne $producer[$key]) { throw 'Artifact producer mismatch' }
            }
          }
          $prepared = Get-Content -LiteralPath "$env:RUNNER_TEMP/prepared/preparation.json" -Raw | ConvertFrom-Json
          $subject = $prepared.prepared.subject
          if ($subject.revision -cne $env:SELECTED_REVISION -or $subject.selectedRef -cne $env:SELECTED_REF -or
              $subject.unit -cne $producer.unit -or $subject.dryRun -cne $producer.dryRun -or
              $subject.declaration -cne 'src/public/lib/hcoona-release-smoke-github-packages/workflow-delivery.release-unit.yml' -or $subject.channel -cne 'buddy' -or
              $subject.destination -cne 'github-packages-nuget') { throw 'Preparation subject mismatch' }
      - name: Prepare runtime without product execution
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.8.10
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected runtime
        working-directory: ${{ runner.temp }}
        run: |
          mise install --yes dotnet@10.0.401
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe native destination and original bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/observation" | Out-Null
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/control/producer.json" -Destination "$env:RUNNER_TEMP/observation/producer.json"
          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release observe-github-nuget "$env:RUNNER_TEMP/prepared/preparation.json" "$env:RUNNER_TEMP/prepared" > "$env:RUNNER_TEMP/observation/observation.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Describe native state and dry-run writes
        id: state
        run: |
          $observation = Get-Content -LiteralPath "$env:RUNNER_TEMP/observation/observation.json" -Raw | ConvertFrom-Json
          $write = $observation.observation.files[0].state -ceq 'absent'
          "write-needed=$($write.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          if ($env:DRY_RUN -eq 'true') {
          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release describe-github-nuget "$env:RUNNER_TEMP/prepared/preparation.json" "$env:RUNNER_TEMP/observation/observation.json" > "$env:RUNNER_TEMP/observation/dry-run.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Get-Content -LiteralPath "$env:RUNNER_TEMP/observation/dry-run.json" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            'Dry run describes supported writes; it makes no publication or live completion claim.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }
      - name: Retain actual observation results
        id: retain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nuget-buddy-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observation
          if-no-files-found: error
          retention-days: 45
          overwrite: false
  publish:
    if: inputs.dry-run == false && needs.observe.outputs.write-needed == 'true'
    needs:
      - prepare
      - observe
    runs-on: windows-2022
    timeout-minutes: 15
    environment: workflow-delivery-v3-buddy-approval
    permissions:
      contents: read
      packages: write
    outputs:
      publication-id: ${{ steps.retain.outputs.artifact-id }}
    steps:
      - name: Download control by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.control-id }}
          path: ${{ runner.temp }}/control
          digest-mismatch: error
      - name: Download prepared by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.preparation-id }}
          path: ${{ runner.temp }}/prepared
          digest-mismatch: error
      - name: Validate transferred source, mode and producer
        run: |
          $producer = [ordered]@{
            revision = $env:SELECTED_REVISION; selectedRef = $env:SELECTED_REF
            run = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT
            unit = 'hcoona-release-smoke-github-packages'
            dryRun = $env:DRY_RUN -eq 'true'
          }

          foreach ($kind in @('control', 'prepared')) {
            $actual = Get-Content -LiteralPath "$env:RUNNER_TEMP/$kind/producer.json" -Raw | ConvertFrom-Json -AsHashtable
            if ($actual.Count -ne $producer.Count) { throw 'Unexpected artifact producer fields' }
            foreach ($key in $producer.Keys) {
              if (-not $actual.ContainsKey($key) -or $actual[$key] -cne $producer[$key]) { throw 'Artifact producer mismatch' }
            }
          }
          $prepared = Get-Content -LiteralPath "$env:RUNNER_TEMP/prepared/preparation.json" -Raw | ConvertFrom-Json
          $subject = $prepared.prepared.subject
          if ($subject.revision -cne $env:SELECTED_REVISION -or $subject.selectedRef -cne $env:SELECTED_REF -or
              $subject.unit -cne $producer.unit -or $subject.dryRun -cne $producer.dryRun -or
              $subject.declaration -cne 'src/public/lib/hcoona-release-smoke-github-packages/workflow-delivery.release-unit.yml' -or $subject.channel -cne 'buddy' -or
              $subject.destination -cne 'github-packages-nuget') { throw 'Preparation subject mismatch' }
      - name: Prepare runtime without product execution
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.8.10
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected runtime
        working-directory: ${{ runner.temp }}
        run: |
          mise install --yes dotnet@10.0.401
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Refresh and invoke official NuGet publisher once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/publication" | Out-Null
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/control/producer.json" -Destination "$env:RUNNER_TEMP/publication/producer.json"
          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release publish-github-nuget "$env:RUNNER_TEMP/prepared/preparation.json" "$env:RUNNER_TEMP/prepared" > "$env:RUNNER_TEMP/publication/publication.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain actual publication results
        id: retain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nuget-buddy-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
          if-no-files-found: error
          retention-days: 45
          overwrite: false
  verify-result:
    if:
      always() && inputs.dry-run == false && needs.prepare.result == 'success' && needs.observe.result == 'success' && (needs.publish.result
      == 'success' || (needs.observe.outputs.write-needed == 'false' && needs.publish.result == 'skipped'))
    needs:
      - prepare
      - observe
      - publish
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Download control by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.control-id }}
          path: ${{ runner.temp }}/control
          digest-mismatch: error
      - name: Download prepared by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.preparation-id }}
          path: ${{ runner.temp }}/prepared
          digest-mismatch: error
      - name: Validate transferred source, mode and producer
        run: |
          $producer = [ordered]@{
            revision = $env:SELECTED_REVISION; selectedRef = $env:SELECTED_REF
            run = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT
            unit = 'hcoona-release-smoke-github-packages'
            dryRun = $env:DRY_RUN -eq 'true'
          }

          foreach ($kind in @('control', 'prepared')) {
            $actual = Get-Content -LiteralPath "$env:RUNNER_TEMP/$kind/producer.json" -Raw | ConvertFrom-Json -AsHashtable
            if ($actual.Count -ne $producer.Count) { throw 'Unexpected artifact producer fields' }
            foreach ($key in $producer.Keys) {
              if (-not $actual.ContainsKey($key) -or $actual[$key] -cne $producer[$key]) { throw 'Artifact producer mismatch' }
            }
          }
          $prepared = Get-Content -LiteralPath "$env:RUNNER_TEMP/prepared/preparation.json" -Raw | ConvertFrom-Json
          $subject = $prepared.prepared.subject
          if ($subject.revision -cne $env:SELECTED_REVISION -or $subject.selectedRef -cne $env:SELECTED_REF -or
              $subject.unit -cne $producer.unit -or $subject.dryRun -cne $producer.dryRun -or
              $subject.declaration -cne 'src/public/lib/hcoona-release-smoke-github-packages/workflow-delivery.release-unit.yml' -or $subject.channel -cne 'buddy' -or
              $subject.destination -cne 'github-packages-nuget') { throw 'Preparation subject mismatch' }
      - name: Prepare runtime without product execution
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.8.10
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected runtime
        working-directory: ${{ runner.temp }}
        run: |
          mise install --yes dotnet@10.0.401
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download observation by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.observe.outputs.observation-id }}
          path: ${{ runner.temp }}/observation
          digest-mismatch: error
      - name: Download publication by immutable artifact ID
        if: needs.observe.outputs.write-needed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.publish.outputs.publication-id }}
          path: ${{ runner.temp }}/publication
          digest-mismatch: error
      - name: Validate observation and available publication producer
        env:
          WRITE_NEEDED: ${{ needs.observe.outputs.write-needed }}
        run: |
          $producer = [ordered]@{
            revision = $env:SELECTED_REVISION; selectedRef = $env:SELECTED_REF
            run = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT
            unit = 'hcoona-release-smoke-github-packages'
            dryRun = $env:DRY_RUN -eq 'true'
          }

          $kinds = @('observation')
          if ($env:WRITE_NEEDED -eq 'true') { $kinds += 'publication' }
          foreach ($kind in $kinds) {
            $actual = Get-Content -LiteralPath "$env:RUNNER_TEMP/$kind/producer.json" -Raw | ConvertFrom-Json -AsHashtable
            if ($actual.Count -ne $producer.Count) { throw 'Unexpected artifact producer fields' }
            foreach ($key in $producer.Keys) {
              if (-not $actual.ContainsKey($key) -or $actual[$key] -cne $producer[$key]) { throw 'Artifact producer mismatch' }
            }
          }
      - name: Verify original remote bytes and native scoped consumer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WRITE_NEEDED: ${{ needs.observe.outputs.write-needed }}
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/verification", "$env:RUNNER_TEMP/consumer-runtime" | Out-Null
          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release observe-github-nuget "$env:RUNNER_TEMP/prepared/preparation.json" "$env:RUNNER_TEMP/prepared" > "$env:RUNNER_TEMP/verification/before-consumer.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release consume-github-nuget "$env:RUNNER_TEMP/prepared/preparation.json" "$env:RUNNER_TEMP/verification/before-consumer.json" "$env:RUNNER_TEMP/prepared" "$env:RUNNER_TEMP/consumer-runtime" > "$env:RUNNER_TEMP/verification/consumer.json"

          $consumerStatus = $LASTEXITCODE
          # A handled consumer failure remains a required failed result for completion.
          if ($consumerStatus -notin @(0, 1)) { exit $consumerStatus }
          $consumer = Get-Content -LiteralPath "$env:RUNNER_TEMP/verification/consumer.json" -Raw | ConvertFrom-Json
          if (($consumerStatus -eq 0) -ne ($consumer.check.status -ceq 'passed')) { throw 'Consumer result differs from command status' }
          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release observe-github-nuget "$env:RUNNER_TEMP/prepared/preparation.json" "$env:RUNNER_TEMP/prepared" > "$env:RUNNER_TEMP/verification/after-consumer.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $publication = '-'
          if ($env:WRITE_NEEDED -eq 'true') { $publication = "$env:RUNNER_TEMP/publication/publication.json" }
          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release complete-github-nuget "$env:RUNNER_TEMP/prepared/preparation.json" "$env:RUNNER_TEMP/observation/observation.json" "$env:RUNNER_TEMP/verification/after-consumer.json" "$env:RUNNER_TEMP/verification/consumer.json" $publication > "$env:RUNNER_TEMP/verification/outcome.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Show actual available business results
        if: always()
        run: |
          '## NuGet Buddy result' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          foreach ($name in @('consumer', 'outcome')) {
            $path = "$env:RUNNER_TEMP/verification/$name.json"
            if ((Test-Path -LiteralPath $path) -and (Get-Item -LiteralPath $path).Length -gt 0) {
              Get-Content -LiteralPath $path | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            } else { "$name`: required result unavailable." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 }
          }
      - name: Retain actual verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nuget-buddy-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
          retention-days: 45
          overwrite: false
