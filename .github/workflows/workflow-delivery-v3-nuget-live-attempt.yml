            '.wdv3/helper/WorkflowDeliveryV3DotnetProvider.dll',
            '--output',
            '.wdv3/observation.json',
            '--github-output',
            $env:GITHUB_OUTPUT,
            '--github-token',
            $env:GITHUB_TOKEN
          )
          uv run --python 3.13.12 --package $env:WDV3_PACKAGE three-workflow-delivery-v3 @arguments
          $commandStatus = $LASTEXITCODE
          if ($commandStatus -ne 0) { exit $commandStatus }
      - name: Bind observation payload identity
        id: seal-observation
        if: always() && steps.observe.outputs.observation-digest != ''
        env:
          WDV3_PAYLOAD: .wdv3/observation.json
        run: |
          $hex = (Get-FileHash -LiteralPath $env:WDV3_PAYLOAD -Algorithm SHA256).Hash.ToLowerInvariant()
          $name = "wdv3-nuget-observation-r${env:GITHUB_RUN_ID}-$hex.json"
          $path = Join-Path '.wdv3/upload' $name
