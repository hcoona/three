name: Workflow Delivery v3 NuGet Release
'on':
  workflow_call:
    inputs:
      target-sha:
        required: true
        type: string
      selected-ref:
        required: true
        type: string
      dry-run:
        required: true
        type: boolean
permissions: {}
defaults:
  run:
    shell: pwsh
env:
  DESTINATION: github-packages-nuget
  SELECTED_REVISION: ${{ inputs.target-sha }}
  SELECTED_REF: ${{ inputs.selected-ref }}
  DRY_RUN: ${{ inputs.dry-run }}
jobs:
  prepare:
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      control-id: ${{ steps.control.outputs.artifact-id }}
      preparation-id: ${{ steps.originals.outputs.artifact-id }}
    steps:
      - name: Validate selected Buddy request
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'hcoona/three' -or $env:SELECTED_REVISION -cne $env:GITHUB_SHA -or
              $env:SELECTED_REF -cne $env:GITHUB_REF) { throw 'Selected Buddy source mismatch' }
      - name: Check out exact selected source and control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare selected native tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.11
          experimental: true
          install_args: dotnet
      - name: Build complete control before product execution
        run: |
          mise exec --locked dotnet -- dotnet build src/private/app/workflow-delivery/WorkflowDelivery.csproj -p:RestoreLockedMode=true -o "$env:RUNNER_TEMP/control"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs nuget request
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain actual control results
        id: control
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nuget-buddy-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control
          if-no-files-found: error
          retention-days: 45
          overwrite: false
      - name: Qualify complete selected NuGet release
        run: |
          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release prepare-nuget "$env:RUNNER_TEMP/prepared/request.json" > "$env:RUNNER_TEMP/prepared/preparation.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs nuget originals
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain actual prepared results
        id: originals
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nuget-buddy-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          retention-days: 45
          overwrite: false
  observe:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      write-needed: ${{ steps.state.outputs.write-needed }}
      observation-id: ${{ steps.retain.outputs.artifact-id }}
    steps:
      - name: Download control by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.control-id }}
          path: ${{ runner.temp }}/control
          digest-mismatch: error
      - name: Download prepared by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.preparation-id }}
          path: ${{ runner.temp }}/prepared
          digest-mismatch: error
      - name: Prepare runtime without product execution
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.11
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected runtime
        working-directory: ${{ runner.temp }}
        run: |
          mise install --yes dotnet@10.0.401
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Receive transferred preparation
        run: |
          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs nuget receive observation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe native destination and original bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release observe-github-nuget "$env:RUNNER_TEMP/prepared/preparation.json" "$env:RUNNER_TEMP/prepared" > "$env:RUNNER_TEMP/observation/observation.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Describe native state and dry-run writes
        id: state
        run: |
          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs nuget state
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:DRY_RUN -eq 'true') {
          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release describe-github-nuget "$env:RUNNER_TEMP/prepared/preparation.json" "$env:RUNNER_TEMP/observation/observation.json" > "$env:RUNNER_TEMP/observation/dry-run.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Get-Content -LiteralPath "$env:RUNNER_TEMP/observation/dry-run.json" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            'Dry run describes supported writes; it makes no publication or live completion claim.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }
      - name: Retain actual observation results
        id: retain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nuget-buddy-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observation
          if-no-files-found: error
          retention-days: 45
          overwrite: false
  publish:
    if: inputs.dry-run == false && needs.observe.outputs.write-needed == 'true'
    needs:
      - prepare
      - observe
    runs-on: windows-2022
    timeout-minutes: 15
    environment: workflow-delivery-v3-buddy-approval
    permissions:
      contents: read
      packages: write
    outputs:
      publication-id: ${{ steps.retain.outputs.artifact-id }}
    steps:
      - name: Download control by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.control-id }}
          path: ${{ runner.temp }}/control
          digest-mismatch: error
      - name: Download prepared by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.preparation-id }}
          path: ${{ runner.temp }}/prepared
          digest-mismatch: error
      - name: Prepare runtime without product execution
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.11
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected runtime
        working-directory: ${{ runner.temp }}
        run: |
          mise install --yes dotnet@10.0.401
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Receive transferred preparation
        run: |
          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs nuget receive publication
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Refresh and invoke official NuGet publisher once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release publish-github-nuget "$env:RUNNER_TEMP/prepared/preparation.json" "$env:RUNNER_TEMP/prepared" > "$env:RUNNER_TEMP/publication/publication.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain actual publication results
        id: retain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nuget-buddy-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication
          if-no-files-found: error
          retention-days: 45
          overwrite: false
  verify-result:
    if:
      always() && inputs.dry-run == false && needs.prepare.result == 'success' && needs.observe.result == 'success' && (needs.publish.result
      == 'success' || (needs.observe.outputs.write-needed == 'false' && needs.publish.result == 'skipped'))
    needs:
      - prepare
      - observe
      - publish
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Download control by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.control-id }}
          path: ${{ runner.temp }}/control
          digest-mismatch: error
      - name: Download prepared by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.preparation-id }}
          path: ${{ runner.temp }}/prepared
          digest-mismatch: error
      - name: Prepare runtime without product execution
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.11
          install: false
          working_directory: ${{ runner.temp }}
      - name: Install selected runtime
        working-directory: ${{ runner.temp }}
        run: |
          mise install --yes dotnet@10.0.401
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Receive transferred preparation
        run: |
          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release job-inputs nuget receive verification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download observation by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.observe.outputs.observation-id }}
          path: ${{ runner.temp }}/observation
          digest-mismatch: error
      - name: Download publication by immutable artifact ID
        if: needs.observe.outputs.write-needed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.publish.outputs.publication-id }}
          path: ${{ runner.temp }}/publication
          digest-mismatch: error
      - name: Verify registry coordinate and original bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WRITE_NEEDED: ${{ needs.observe.outputs.write-needed }}
        run: |
          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release observe-github-nuget "$env:RUNNER_TEMP/prepared/preparation.json" "$env:RUNNER_TEMP/prepared" > "$env:RUNNER_TEMP/verification/final.json"
          # A handled conflicting or unknown observation remains typed completion input.
          if ($LASTEXITCODE -notin @(0, 1)) { exit $LASTEXITCODE }

          $publication = '-'
          if ($env:WRITE_NEEDED -eq 'true') { $publication = "$env:RUNNER_TEMP/publication/publication.json" }
          mise exec dotnet@10.0.401 -- dotnet "$env:RUNNER_TEMP/control/WorkflowDelivery.dll" release complete-github-nuget "$env:RUNNER_TEMP/prepared/preparation.json" "$env:RUNNER_TEMP/observation/observation.json" "$env:RUNNER_TEMP/verification/final.json" $publication > "$env:RUNNER_TEMP/verification/outcome.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Show actual available business results
        if: always()
        run: |
          '## NuGet Buddy result' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          foreach ($name in @('final', 'outcome')) {
            $path = "$env:RUNNER_TEMP/verification/$name.json"
            if ((Test-Path -LiteralPath $path) -and (Get-Item -LiteralPath $path).Length -gt 0) {
              Get-Content -LiteralPath $path | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            } else { "$name`: required result unavailable." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 }
          }
      - name: Retain actual verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nuget-buddy-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
          retention-days: 45
          overwrite: false
