name: Release Orchestrator (Reusable)

on:
  workflow_call:
    inputs:
      source:
        description: "Resolution mode: 'tag' derives project/version from release tag; 'manual' uses explicit inputs."
        required: true
        type: string
      run_url:
        description: "Entry workflow run URL (pass-through for release notes)."
        required: true
        type: string

      # source=tag
      ref_name:
        description: "Tag name (caller passes github.ref_name). Required when source=tag."
        required: false
        type: string
      ref:
        description: "Full ref (caller passes github.ref). Required when source=tag."
        required: false
        type: string

      # source=manual
      project:
        description: "Workspace package name (unscoped). Required when source=manual."
        required: false
        type: string
      version:
        description: "Release version string. Required when source=manual."
        required: false
        type: string
      target:
        description: "Target commit for release/tag when manually triggered (defaults to current commit)."
        required: false
        default: ""
        type: string
      force_update_tag:
        description: "Allow force-updating the release tag if it already exists and points to a different commit."
        required: false
        default: false
        type: boolean

      channel:
        description: "Release channel label for logs and policy validation (for example: official, buddy)."
        required: true
        type: string
      channel_allowlist:
        description: >-
          Comma-separated list of custom channel names that are explicitly
          exempt from strict channel profile assertions (official/buddy policy
          matrix). Use only for non-production channels (e.g., staging, canary).
          Callers are fully responsible for setting all publish flags correctly.
          SECURITY NOTE: allowlisted channels bypass all policy enforcement —
          only grant default-branch merge access to trusted contributors.
        required: false
        default: ""
        type: string
      artifact_prefix:
        description: "Prefix for generated workflow artifacts (for example: official, buddy)."
        required: true
        type: string
      github_release_prerelease:
        description: "Whether GitHub Release is marked as prerelease."
        required: true
        type: boolean

      enforce_prerelease_only:
        description: "If true, enforce resolved version to be prerelease-only."
        required: false
        default: false
        type: boolean
      enforce_non_clobber:
        description: "If true, buddy-like non-clobber protection is enabled."
        required: false
        default: false
        type: boolean

      publish_python_pypi:
        description: "If true, publish Python artifacts to PyPI."
        required: false
        default: false
        type: boolean
      publish_node_gpr:
        description: "If true, publish Node artifacts to GitHub Packages."
        required: false
        default: true
        type: boolean
      publish_node_npmjs:
        description: "If true, publish Node artifacts to npmjs.org."
        required: false
        default: false
        type: boolean
      publish_ruby_gpr:
        description: "If true, publish Ruby gem to GitHub Packages."
        required: false
        default: true
        type: boolean
      publish_ruby_rubygems:
        description: "If true, publish Ruby gem to RubyGems.org."
        required: false
        default: false
        type: boolean

      enable_attestation:
        description: "If true, generate GitHub build provenance attestation for release assets."
        required: false
        default: false
        type: boolean

      node_pack_mode:
        description: "Pack mode for release-build-node-pack workflow."
        required: false
        default: both
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '24'
  PNPM_VERSION: '10'
  RUBY_VERSION: '3.3'

jobs:
  policy:
    name: Validate orchestration policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate inputs
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          CHANNEL_ALLOWLIST: ${{ inputs.channel_allowlist }}
          SOURCE: ${{ inputs.source }}
          GITHUB_RELEASE_PRERELEASE: ${{ inputs.github_release_prerelease }}
          ENFORCE_PRERELEASE_ONLY: ${{ inputs.enforce_prerelease_only }}
          ENFORCE_NON_CLOBBER: ${{ inputs.enforce_non_clobber }}
          PUBLISH_PYTHON_PYPI: ${{ inputs.publish_python_pypi }}
          PUBLISH_NODE_GPR: ${{ inputs.publish_node_gpr }}
          PUBLISH_NODE_NPMJS: ${{ inputs.publish_node_npmjs }}
          PUBLISH_RUBY_GPR: ${{ inputs.publish_ruby_gpr }}
          PUBLISH_RUBY_RUBYGEMS: ${{ inputs.publish_ruby_rubygems }}
          ENABLE_ATTESTATION: ${{ inputs.enable_attestation }}
          NODE_PACK_MODE: ${{ inputs.node_pack_mode }}
          REF_NAME: ${{ inputs.ref_name }}
          REF: ${{ inputs.ref }}
          PROJECT: ${{ inputs.project }}
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail

          assert_equals() {
            local key="$1"
            local actual="$2"
            local expected="$3"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "Channel '${CHANNEL}' policy mismatch for '${key}': expected '${expected}', got '${actual}'." >&2
              exit 1
            fi
          }

          is_channel_allowlisted() {
            local candidate="$1"
            local entry
            IFS=',' read -ra allowlist <<< "${CHANNEL_ALLOWLIST}"
            for entry in "${allowlist[@]}"; do
              entry="$(echo "${entry}" | xargs)"
              if [[ -n "${entry}" && "${entry}" == "${candidate}" ]]; then
                return 0
              fi
            done
            return 1
          }

          if [[ "${SOURCE}" != "tag" && "${SOURCE}" != "manual" ]]; then
            echo "Invalid source '${SOURCE}'." >&2
            exit 1
          fi

          if [[ "${SOURCE}" == "tag" ]]; then
            if [[ -z "${REF_NAME}" ]]; then
              echo "source=tag requires ref_name to be set." >&2
              exit 1
            fi
            if [[ -z "${REF}" ]]; then
              echo "source=tag requires ref to be set." >&2
              exit 1
            fi
          fi

          if [[ "${SOURCE}" == "manual" ]]; then
            if [[ -z "${PROJECT}" ]]; then
              echo "source=manual requires project to be set." >&2
              exit 1
            fi
            if [[ -z "${VERSION}" ]]; then
              echo "source=manual requires version to be set." >&2
              exit 1
            fi
          fi

          case "${CHANNEL}" in
            official)
              assert_equals "enforce_prerelease_only" "${ENFORCE_PRERELEASE_ONLY}" "false"
              assert_equals "enforce_non_clobber" "${ENFORCE_NON_CLOBBER}" "false"
              assert_equals "publish_python_pypi" "${PUBLISH_PYTHON_PYPI}" "true"
              assert_equals "publish_node_gpr" "${PUBLISH_NODE_GPR}" "true"
              assert_equals "publish_node_npmjs" "${PUBLISH_NODE_NPMJS}" "true"
              assert_equals "publish_ruby_gpr" "${PUBLISH_RUBY_GPR}" "true"
              assert_equals "publish_ruby_rubygems" "${PUBLISH_RUBY_RUBYGEMS}" "true"
              assert_equals "enable_attestation" "${ENABLE_ATTESTATION}" "true"
              assert_equals "node_pack_mode" "${NODE_PACK_MODE}" "both"
              ;;
            buddy)
              assert_equals "enforce_prerelease_only" "${ENFORCE_PRERELEASE_ONLY}" "true"
              assert_equals "enforce_non_clobber" "${ENFORCE_NON_CLOBBER}" "true"
              assert_equals "publish_python_pypi" "${PUBLISH_PYTHON_PYPI}" "false"
              assert_equals "publish_node_gpr" "${PUBLISH_NODE_GPR}" "true"
              assert_equals "publish_node_npmjs" "${PUBLISH_NODE_NPMJS}" "false"
              assert_equals "publish_ruby_gpr" "${PUBLISH_RUBY_GPR}" "true"
              assert_equals "publish_ruby_rubygems" "${PUBLISH_RUBY_RUBYGEMS}" "false"
              assert_equals "enable_attestation" "${ENABLE_ATTESTATION}" "false"
              assert_equals "node_pack_mode" "${NODE_PACK_MODE}" "gpr-only"
              ;;
            *)
              # SECURITY: Allowlisted channels bypass ALL policy assertions (official/buddy
              # profile matrix is not enforced). This is an intentional escape hatch for
              # non-production channels (e.g., staging, canary). Access control relies on
              # repository branch protection — restrict default-branch merge to trusted contributors.
              if is_channel_allowlisted "${CHANNEL}"; then
                echo "Channel '${CHANNEL}' is explicitly allowlisted; skipping strict channel profile assertions."
              else
                echo "Unknown channel '${CHANNEL}'. Refusing to continue without explicit allowlisting." >&2
                echo "Set 'channel_allowlist' to include '${CHANNEL}' only when this is intentional." >&2
                exit 1
              fi
              ;;
          esac

          if [[ "${CHANNEL}" == "buddy" && "${GITHUB_RELEASE_PRERELEASE}" != "true" ]]; then
            echo "Buddy channel must set github_release_prerelease=true." >&2
            exit 1
          fi

          if [[ "${CHANNEL}" == "official" && "${GITHUB_RELEASE_PRERELEASE}" != "false" ]]; then
            echo "Official channel must set github_release_prerelease=false." >&2
            exit 1
          fi
          # For custom allowlisted channels only — official and buddy are handled above.
          if [[ "${CHANNEL}" != "official" && "${CHANNEL}" != "buddy" ]]; then
            # Custom allowlisted channels have no prerelease policy enforcement.
            # The caller is responsible for setting github_release_prerelease correctly.
            echo "Channel '${CHANNEL}' is allowlisted; github_release_prerelease='${GITHUB_RELEASE_PRERELEASE}' is not enforced by policy."
          fi

  policy-publish-targets:
    name: Validate publish-target policy
    runs-on: ubuntu-latest
    needs: resolve
    permissions:
      contents: read
    steps:
      - name: Validate publish targets by project kind
        shell: bash
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
          PROJECT_KIND: ${{ needs.resolve.outputs.project_kind }}
          IS_WXT: ${{ needs.resolve.outputs.is_wxt }}
          NODE_GPR: ${{ inputs.publish_node_gpr }}
          NODE_NPMJS: ${{ inputs.publish_node_npmjs }}
          RUBY_GPR: ${{ inputs.publish_ruby_gpr }}
          RUBY_RUBYGEMS: ${{ inputs.publish_ruby_rubygems }}
        run: |
          set -Eeuo pipefail

          if [[ "${PROJECT_KIND}" == "node" && "${IS_WXT}" != "true" ]]; then
            if [[ "${NODE_GPR}" != "true" && "${NODE_NPMJS}" != "true" ]]; then
              echo "Node project '${PROJECT}' requires at least one Node publish target (GPR/npmjs). Got: publish_node_gpr=${NODE_GPR}, publish_node_npmjs=${NODE_NPMJS}." >&2
              exit 1
            fi
            echo "Node publish-target policy passed for '${PROJECT}'."
            exit 0
          fi

          if [[ "${PROJECT_KIND}" == "ruby" ]]; then
            if [[ "${RUBY_GPR}" != "true" && "${RUBY_RUBYGEMS}" != "true" ]]; then
              echo "Ruby project '${PROJECT}' requires at least one Ruby publish target (GPR/RubyGems). Got: publish_ruby_gpr=${RUBY_GPR}, publish_ruby_rubygems=${RUBY_RUBYGEMS}." >&2
              exit 1
            fi
            echo "Ruby publish-target policy passed for '${PROJECT}'."
            exit 0
          fi

          if [[ "${PROJECT_KIND}" == "python" || ( "${PROJECT_KIND}" == "node" && "${IS_WXT}" == "true" ) ]]; then
            echo "No Node/Ruby publish-target policy required for project kind '${PROJECT_KIND}'."
            exit 0
          fi

          echo "Unexpected project kind '${PROJECT_KIND}' while validating publish-target policy." >&2
          exit 1

  resolve:
    name: Resolve release inputs
    uses: ./.github/workflows/release-resolve.yml
    needs: policy
    permissions:
      contents: read
    with:
      source: ${{ inputs.source }}
      run_url: ${{ inputs.run_url }}
      # Tool version: keep in sync with top-level env: block
      python_version: '3.14'

      # source=tag
      ref_name: ${{ inputs.ref_name }}
      ref: ${{ inputs.ref }}

      # source=manual
      project: ${{ inputs.project }}
      version: ${{ inputs.version }}
      target: ${{ inputs.target }}
      force_update_tag: ${{ inputs.force_update_tag }}

  guard-prerelease-only:
    name: Guard prerelease-only policy
    runs-on: ubuntu-latest
    needs: resolve
    permissions:
      contents: read
    steps:
      - name: Enforce prerelease-only
        if: inputs.enforce_prerelease_only
        shell: bash
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.resolve.outputs.version }}
          IS_PRERELEASE: ${{ needs.resolve.outputs.is_prerelease }}
        run: |
          set -Eeuo pipefail
          if [[ "${IS_PRERELEASE}" != "true" ]]; then
            echo "Prerelease-only policy is enabled. Refusing '${PROJECT}' version '${VERSION}'." >&2
            exit 1
          fi
          echo "Prerelease-only guard passed for ${PROJECT} ${VERSION}."

      - name: Guard disabled
        if: ${{ !inputs.enforce_prerelease_only }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Prerelease-only guard is disabled for this channel."
          echo "### Guard: Prerelease-only :white_check_mark: disabled" >> "${GITHUB_STEP_SUMMARY}"
          echo "Prerelease-only enforcement is not enabled for channel \`${{ inputs.channel }}\`." >> "${GITHUB_STEP_SUMMARY}"

  guard-non-clobber:
    name: Guard non-clobber policy
    runs-on: ubuntu-latest
    needs: resolve
    permissions:
      contents: read
    steps:
      - name: Install jq
        if: inputs.enforce_non_clobber
        uses: dcarbone/install-jq-action@b7ef57d46ece78760b4019dbc4080a1ba2a40b45 # v3.2.0
        with:
          version: '1.7.1'

      - name: Check existing GitHub Release by tag
        if: inputs.enforce_non_clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
        run: |
          set -Eeuo pipefail

          api="repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}"
          resp_file="${RUNNER_TEMP}/gh-api.response"
          rm -f "${resp_file}"

          set +e
          gh api "${api}" --include >"${resp_file}" 2>&1
          rc=$?
          set -e

          status=$(grep -m1 -E '^HTTP/' "${resp_file}" | awk '{print $2}' || true)

          if [[ "${rc}" -eq 0 ]]; then
            body=$(sed -n '/^{/,$p' "${resp_file}")
            if [[ -z "${body}" ]]; then
              echo "Error: gh api output did not contain a JSON body." >&2
              cat "${resp_file}" >&2 || true
              exit 1
            fi

            prerelease=$(printf '%s' "${body}" | jq -r '.prerelease')
            if [[ "${prerelease}" != "true" && "${prerelease}" != "false" ]]; then
              echo "Error: release JSON body missing 'prerelease'." >&2
              exit 1
            fi

            if [[ "${prerelease}" == "false" ]]; then
              echo "A non-prerelease GitHub Release already exists for tag '${TAG_NAME}'." >&2
              echo "Non-clobber policy refuses to modify official (prerelease=false) releases." >&2
              exit 1
            fi

            echo "Existing release is prerelease=true for tag '${TAG_NAME}'. Proceeding."
            exit 0
          fi

          if [[ "${status}" == "404" ]]; then
            echo "No existing release found for tag '${TAG_NAME}'. Proceeding."
            exit 0
          fi

          echo "Failed to query release metadata for tag '${TAG_NAME}' (HTTP ${status:-unknown})." >&2
          cat "${resp_file}" >&2 || true
          exit 1

      - name: Guard disabled
        if: ${{ !inputs.enforce_non_clobber }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Non-clobber guard is disabled for this channel."
          echo "### Guard: Non-clobber :white_check_mark: disabled" >> "${GITHUB_STEP_SUMMARY}"
          echo "Non-clobber enforcement is not enabled for channel \`${{ inputs.channel }}\`." >> "${GITHUB_STEP_SUMMARY}"

  prepare-release-notes:
    name: Prepare release notes
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/release-prepare-release-notes.yml
    with:
      target: ${{ needs.resolve.outputs.target }}
      has_changelog: ${{ needs.resolve.outputs.has_changelog == 'true' }}
      changelog_path: ${{ needs.resolve.outputs.changelog }}
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      project: ${{ needs.resolve.outputs.project }}
      version: ${{ needs.resolve.outputs.version }}
      run_url: ${{ needs.resolve.outputs.run_url }}
      artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-release-notes

  build-python:
    name: Build Python package
    needs:
      - resolve
      - policy-publish-targets
      - guard-prerelease-only
      - guard-non-clobber
    if: needs.resolve.outputs.project_kind == 'python'
    uses: ./.github/workflows/release-build-python.yml
    permissions:
      contents: read
    with:
      target: ${{ needs.resolve.outputs.target }}
      package_dir: ${{ needs.resolve.outputs.package_dir }}
      version: ${{ needs.resolve.outputs.version }}
      # Keep in sync with top-level env: block
      python_version: '3.14'
      artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  publish-python:
    name: Publish Python package (PyPI)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build-python
    if: needs.resolve.outputs.project_kind == 'python' && inputs.publish_python_pypi
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Install jq
        uses: dcarbone/install-jq-action@b7ef57d46ece78760b4019dbc4080a1ba2a40b45 # v3.2.0
        with:
          version: '1.7.1'

      - name: Checkout (workflow scripts)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ needs.resolve.outputs.target }}

      - name: Download dist artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Validate PyPI remote digests (idempotency)
        shell: bash
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -Eeuo pipefail

          bash "${GITHUB_WORKSPACE}/eng/scripts/validate_pypi_remote_digests.sh"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1
        with:
          packages-dir: ${{ github.workspace }}/out/
          skip-existing: true

  attest-python-enabled:
    name: Attest release assets (Python)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build-python
    if: needs.resolve.outputs.project_kind == 'python' && inputs.enable_attestation
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Attest build provenance (GitHub)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ github.workspace }}/out/*

  attest-python:
    name: Attestation gate (Python)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build-python
      - attest-python-enabled
    if: ${{ always() && needs.resolve.outputs.project_kind == 'python' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify attestation outcome
        if: inputs.enable_attestation
        shell: bash
        env:
          RESULT: ${{ needs.attest-python-enabled.result }}
        run: |
          set -Eeuo pipefail
          if [[ "${RESULT}" != "success" ]]; then
            echo "Attestation job did not succeed (result=${RESULT})." >&2
            exit 1
          fi

      - name: Attestation disabled
        if: ${{ !inputs.enable_attestation }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Attestation is disabled for this channel."

  release-python-with-pypi:
    name: Create GitHub release (Python, with PyPI)
    needs:
      - resolve
      - prepare-release-notes
      - build-python
      - publish-python
      - attest-python
    if: needs.resolve.outputs.project_kind == 'python' && inputs.publish_python_pypi
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-create-github-release.yml
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target: ${{ needs.resolve.outputs.target }}
      release_title: ${{ needs.resolve.outputs.release_title }}
      prerelease: ${{ inputs.github_release_prerelease }}
      force_update_tag: ${{ needs.resolve.outputs.force_update_tag == 'true' }}
      notes_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-release-notes
      dist_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  release-python-no-pypi:
    name: Create GitHub release (Python, no PyPI)
    needs:
      - resolve
      - prepare-release-notes
      - build-python
      - attest-python
    if: needs.resolve.outputs.project_kind == 'python' && !inputs.publish_python_pypi
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-create-github-release.yml
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target: ${{ needs.resolve.outputs.target }}
      release_title: ${{ needs.resolve.outputs.release_title }}
      prerelease: ${{ inputs.github_release_prerelease }}
      force_update_tag: ${{ needs.resolve.outputs.force_update_tag == 'true' }}
      notes_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-release-notes
      dist_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  pack-node:
    name: Pack Node tarball(s)
    needs:
      - resolve
      - policy-publish-targets
      - guard-prerelease-only
      - guard-non-clobber
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true'
    uses: ./.github/workflows/release-build-node-pack.yml
    permissions:
      contents: read
    with:
      target: ${{ needs.resolve.outputs.target }}
      project: ${{ needs.resolve.outputs.project }}
      package_dir: ${{ needs.resolve.outputs.package_dir }}
      version: ${{ needs.resolve.outputs.version }}
      # Keep in sync with top-level env: block
      python_version: '3.14'
      node_version: '24'
      pnpm_version: '10'
      artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
      pack_mode: ${{ inputs.node_pack_mode }}

  gate-node-publish-npmjs:
    name: Approval gate for Node publish (npmjs)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - pack-node
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true' && inputs.publish_node_npmjs
    environment: npmjs
    permissions:
      contents: read
      actions: read
    steps:
      - name: Await npmjs environment approval
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "npmjs environment approval granted."

  # NOTE: publish-node-gpr-enabled is intentionally coupled to the npmjs approval gate.
  # When publish_node_npmjs=true, GPR publishing is held until the npmjs environment approval
  # succeeds. This provides an atomic dual-publish guarantee: either both registries receive
  # the package, or neither does. If you need independent registry publishes, decouple this
  # condition by removing the gate-node-publish-npmjs dependency check.
  publish-node-gpr-enabled:
    name: Publish Node package (GitHub Packages)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - pack-node
      - gate-node-publish-npmjs
    # Condition: Always evaluate (via always()), but only run if: this is a non-WXT Node
    # project, GPR publishing is enabled, pack-node succeeded, AND (either npmjs is not
    # being published OR the npmjs approval gate (gate-node-publish-npmjs) has passed).
    # The pack-node result check prevents a spurious "artifact not found" failure when
    # pack-node fails and publish_node_npmjs=false (gate is skipped, not failed).
    # See the comment above this job for the rationale behind the npmjs gate coupling.
    if: ${{ always() && needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true' && inputs.publish_node_gpr && needs.pack-node.result == 'success' && (!inputs.publish_node_npmjs || needs.gate-node-publish-npmjs.result == 'success') }}
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout (workflow scripts)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ needs.resolve.outputs.target }}

      - name: Resolve npm scope
        id: npm_scope
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          scope="@${OWNER,,}"
          echo "scope=${scope}" >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js (npm auth)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: ${{ steps.npm_scope.outputs.scope }}

      - name: Create .npmrc for GitHub Packages (GPR)
        id: gpr_npmrc
        shell: bash
        env:
          SCOPE: ${{ steps.npm_scope.outputs.scope }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          npmrc="${RUNNER_TEMP}/npmrc-gpr"
          {
            echo "registry=https://registry.npmjs.org"
            echo "${SCOPE}:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
            echo "always-auth=true"
          } > "${npmrc}"

          echo "path=${npmrc}" >> "${GITHUB_OUTPUT}"

      - name: Download dist artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Publish to GitHub Packages from tarball
        shell: bash
        env:
          DIST_TAG: ${{ needs.pack-node.outputs.dist_tag }}
          NPM_CONFIG_ALWAYS_AUTH: 'true'
          NODE_AUTH_TOKEN: ${{ github.token }}
          NPM_CONFIG_USERCONFIG: ${{ steps.gpr_npmrc.outputs.path }}
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.resolve.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail

          bash "${GITHUB_WORKSPACE}/eng/scripts/publish_node_gpr_idempotent.sh"

  publish-node-gpr:
    name: Publish Node package (GitHub Packages)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - publish-node-gpr-enabled
    if: ${{ always() && needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Node GPR publishing disabled
        if: ${{ !inputs.publish_node_gpr }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Node GPR publishing is disabled by policy."

      - name: Ensure enabled publish job succeeded
        if: ${{ inputs.publish_node_gpr && needs.publish-node-gpr-enabled.result != 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Node GPR publish job did not complete successfully." >&2
          exit 1

      - name: Node GPR publish completed
        if: inputs.publish_node_gpr
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Node GPR publish completed."

  publish-node-npmjs:
    name: Publish Node package (npmjs.org)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - pack-node
      - gate-node-publish-npmjs
      - publish-node-gpr
    if: ${{ always() && needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true' && inputs.publish_node_npmjs && needs.gate-node-publish-npmjs.result == 'success' && needs.publish-node-gpr.result == 'success' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout (workflow scripts)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ needs.resolve.outputs.target }}

      - name: Setup Node.js (npmjs)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Download dist artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Note about npm Trusted Publishers (OIDC)
        shell: bash
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
        run: |
          set -Eeuo pipefail
          echo "This workflow is intended to publish '${PROJECT}' to npmjs.org using npm Trusted Publishing (OIDC)."
          echo "No npm token is provided by this workflow; publishing will fail unless a Trusted Publisher is configured on npmjs.com for:"
          echo "  - Repository: ${GITHUB_REPOSITORY}"
          echo "  - Workflow: .github/workflows/release-orchestrate.yml"
          echo "    (This is the reusable workflow file containing this job."
          echo "     npm Trusted Publishing validates the OIDC job_workflow_ref claim, which always"
          echo "     points to the reusable workflow file — not the caller workflow (e.g. official.yml).)"
          echo "  - Environment (if configured on npm): npmjs"
          echo "A single Trusted Publisher entry for this reusable workflow covers all callers."
          echo "Each caller workflow does NOT need a separate Trusted Publisher registration."
          echo "See: https://docs.npmjs.com/trusted-publishers"

      - name: Publish to npm registry (idempotent)
        shell: bash
        env:
          DIST_TAG: ${{ needs.pack-node.outputs.dist_tag }}
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -Eeuo pipefail

          bash "${GITHUB_WORKSPACE}/eng/scripts/publish_node_npmjs_idempotent.sh"

  attest-node-enabled:
    name: Attest release assets (Node)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - pack-node
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true' && inputs.enable_attestation
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Attest build provenance (GitHub)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ github.workspace }}/out/*

  attest-node:
    name: Attestation gate (Node)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - pack-node
      - attest-node-enabled
    if: ${{ always() && needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify attestation outcome
        if: inputs.enable_attestation
        shell: bash
        env:
          RESULT: ${{ needs.attest-node-enabled.result }}
        run: |
          set -Eeuo pipefail
          if [[ "${RESULT}" != "success" ]]; then
            echo "Attestation job did not succeed (result=${RESULT})." >&2
            exit 1
          fi

      - name: Attestation disabled
        if: ${{ !inputs.enable_attestation }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Attestation is disabled for this channel."

  # The release-node-with-npmjs / release-node-no-npmjs split is a deliberate workaround for
  # GitHub Actions' static needs evaluation. GitHub Actions resolves the `needs:` graph at
  # workflow parse time, so a job that conditionally needs publish-node-npmjs must be duplicated
  # into two variants: one that lists it in `needs:` (and therefore waits for it) and one that
  # does not. The `if:` condition on each variant ensures only one ever runs.
  release-node-with-npmjs:
    name: Create GitHub release (Node, with npmjs)
    needs:
      - resolve
      - prepare-release-notes
      - pack-node
      - publish-node-gpr
      - publish-node-npmjs
      - attest-node
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true' && inputs.publish_node_npmjs
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-create-github-release.yml
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target: ${{ needs.resolve.outputs.target }}
      release_title: ${{ needs.resolve.outputs.release_title }}
      prerelease: ${{ inputs.github_release_prerelease }}
      force_update_tag: ${{ needs.resolve.outputs.force_update_tag == 'true' }}
      notes_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-release-notes
      dist_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  release-node-no-npmjs:
    name: Create GitHub release (Node, no npmjs)
    needs:
      - resolve
      - prepare-release-notes
      - pack-node
      - publish-node-gpr
      - attest-node
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true' && !inputs.publish_node_npmjs
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-create-github-release.yml
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target: ${{ needs.resolve.outputs.target }}
      release_title: ${{ needs.resolve.outputs.release_title }}
      prerelease: ${{ inputs.github_release_prerelease }}
      force_update_tag: ${{ needs.resolve.outputs.force_update_tag == 'true' }}
      notes_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-release-notes
      dist_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  build-ruby:
    name: Build Ruby gem
    needs:
      - resolve
      - policy-publish-targets
      - guard-prerelease-only
      - guard-non-clobber
    if: needs.resolve.outputs.project_kind == 'ruby'
    uses: ./.github/workflows/release-build-ruby-gem.yml
    permissions:
      contents: read
    with:
      target: ${{ needs.resolve.outputs.target }}
      project: ${{ needs.resolve.outputs.project }}
      package_dir: ${{ needs.resolve.outputs.package_dir }}
      version: ${{ needs.resolve.outputs.version }}
      # Keep in sync with top-level env: block
      ruby_version: '3.3'
      artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  # NOTE: publish-ruby-gpr-enabled and publish-ruby-rubygems are intentionally independent.
  # Unlike the Node path (where GPR is held until npmjs environment approval to enforce atomic
  # dual-publish), Ruby GPR (GitHub Packages) and RubyGems.org serve distinct audiences and
  # are independent artifact stores with no atomicity requirement. A partial publish (GPR
  # succeeds, RubyGems fails) is a loud failure that surfaces in the workflow, not a silent
  # inconsistency. If you need atomic Ruby dual-publish in the future, mirror the Node pattern
  # by adding an environment approval gate before publish-ruby-gpr-enabled.
  publish-ruby-gpr-enabled:
    name: Publish Ruby gem (GitHub Packages)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build-ruby
    if: needs.resolve.outputs.project_kind == 'ruby' && inputs.publish_ruby_gpr
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout (workflow scripts)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ needs.resolve.outputs.target }}

      - name: Download dist artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Setup Ruby
        uses: ruby/setup-ruby@09a7688d3b55cf0e976497ff046b70949eeaccfd # v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Publish to GitHub Packages (idempotent)
        shell: bash
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.resolve.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          bash "${GITHUB_WORKSPACE}/eng/scripts/publish_ruby_gpr_idempotent.sh"

  publish-ruby-gpr:
    name: Publish Ruby gem (GitHub Packages)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - publish-ruby-gpr-enabled
    if: ${{ always() && needs.resolve.outputs.project_kind == 'ruby' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Ruby GPR publishing disabled
        if: ${{ !inputs.publish_ruby_gpr }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Ruby GPR publishing is disabled by policy."

      - name: Ensure enabled publish job succeeded
        if: ${{ inputs.publish_ruby_gpr && needs.publish-ruby-gpr-enabled.result != 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Ruby GPR publish job did not complete successfully." >&2
          exit 1

      - name: Ruby GPR publish completed
        if: inputs.publish_ruby_gpr
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Ruby GPR publish completed."

  publish-ruby-rubygems:
    name: Publish Ruby gem (RubyGems.org)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build-ruby
    if: needs.resolve.outputs.project_kind == 'ruby' && inputs.publish_ruby_rubygems
    environment: rubygems
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Install jq
        uses: dcarbone/install-jq-action@b7ef57d46ece78760b4019dbc4080a1ba2a40b45 # v3.2.0
        with:
          version: '1.7.1'

      - name: Checkout (workflow scripts)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ needs.resolve.outputs.target }}

      - name: Download dist artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Setup Ruby
        uses: ruby/setup-ruby@09a7688d3b55cf0e976497ff046b70949eeaccfd # v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Configure RubyGems Trusted Publishing credentials
        uses: rubygems/configure-rubygems-credentials@bc6dd217f8a4f919d6835fcfefd470ef821f5c44 # v1.0.0
        with:
          trusted-publisher: true

      - name: Publish to RubyGems.org (idempotent)
        shell: bash
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -Eeuo pipefail

          bash "${GITHUB_WORKSPACE}/eng/scripts/publish_rubygems_org_idempotent.sh"

  attest-ruby-enabled:
    name: Attest release assets (Ruby)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build-ruby
    if: needs.resolve.outputs.project_kind == 'ruby' && inputs.enable_attestation
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Attest build provenance (GitHub)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ github.workspace }}/out/*

  attest-ruby:
    name: Attestation gate (Ruby)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build-ruby
      - attest-ruby-enabled
    if: ${{ always() && needs.resolve.outputs.project_kind == 'ruby' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify attestation outcome
        if: inputs.enable_attestation
        shell: bash
        env:
          RESULT: ${{ needs.attest-ruby-enabled.result }}
        run: |
          set -Eeuo pipefail
          if [[ "${RESULT}" != "success" ]]; then
            echo "Attestation job did not succeed (result=${RESULT})." >&2
            exit 1
          fi

      - name: Attestation disabled
        if: ${{ !inputs.enable_attestation }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Attestation is disabled for this channel."

  release-ruby-with-rubygems:
    name: Create GitHub release (Ruby, with RubyGems)
    needs:
      - resolve
      - prepare-release-notes
      - build-ruby
      - publish-ruby-gpr
      - publish-ruby-rubygems
      - attest-ruby
    if: needs.resolve.outputs.project_kind == 'ruby' && inputs.publish_ruby_rubygems
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-create-github-release.yml
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target: ${{ needs.resolve.outputs.target }}
      release_title: ${{ needs.resolve.outputs.release_title }}
      prerelease: ${{ inputs.github_release_prerelease }}
      force_update_tag: ${{ needs.resolve.outputs.force_update_tag == 'true' }}
      notes_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-release-notes
      dist_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  release-ruby-no-rubygems:
    name: Create GitHub release (Ruby, no RubyGems)
    needs:
      - resolve
      - prepare-release-notes
      - build-ruby
      - publish-ruby-gpr
      - attest-ruby
    if: needs.resolve.outputs.project_kind == 'ruby' && !inputs.publish_ruby_rubygems
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-create-github-release.yml
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target: ${{ needs.resolve.outputs.target }}
      release_title: ${{ needs.resolve.outputs.release_title }}
      prerelease: ${{ inputs.github_release_prerelease }}
      force_update_tag: ${{ needs.resolve.outputs.force_update_tag == 'true' }}
      notes_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-release-notes
      dist_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  build-wxt:
    name: Build package (Node/WXT)
    needs:
      - resolve
      - policy-publish-targets
      - guard-prerelease-only
      - guard-non-clobber
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt == 'true'
    uses: ./.github/workflows/release-build-wxt.yml
    permissions:
      contents: read
    with:
      target: ${{ needs.resolve.outputs.target }}
      project: ${{ needs.resolve.outputs.project }}
      package_dir: ${{ needs.resolve.outputs.package_dir }}
      version: ${{ needs.resolve.outputs.version }}
      # Keep in sync with top-level env: block
      node_version: '24'
      pnpm_version: '10'
      artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  attest-wxt-enabled:
    name: Attest release assets (WXT)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build-wxt
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt == 'true' && inputs.enable_attestation
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Attest build provenance (GitHub)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ github.workspace }}/out/*

  attest-wxt:
    name: Attestation gate (WXT)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build-wxt
      - attest-wxt-enabled
    if: ${{ always() && needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt == 'true' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify attestation outcome
        if: inputs.enable_attestation
        shell: bash
        env:
          RESULT: ${{ needs.attest-wxt-enabled.result }}
        run: |
          set -Eeuo pipefail
          if [[ "${RESULT}" != "success" ]]; then
            echo "Attestation job did not succeed (result=${RESULT})." >&2
            exit 1
          fi

      - name: Attestation disabled
        if: ${{ !inputs.enable_attestation }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Attestation is disabled for this channel."

  release-wxt:
    name: Create GitHub release (Node/WXT)
    needs:
      - resolve
      - prepare-release-notes
      - build-wxt
      - attest-wxt
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-create-github-release.yml
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target: ${{ needs.resolve.outputs.target }}
      release_title: ${{ needs.resolve.outputs.release_title }}
      prerelease: ${{ inputs.github_release_prerelease }}
      force_update_tag: ${{ needs.resolve.outputs.force_update_tag == 'true' }}
      notes_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-release-notes
      dist_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  release-completed:
    name: Release completed
    runs-on: ubuntu-latest
    if: always()
    needs:
      - release-python-with-pypi
      - release-python-no-pypi
      - release-node-with-npmjs
      - release-node-no-npmjs
      - release-ruby-with-rubygems
      - release-ruby-no-rubygems
      - release-wxt
    permissions:
      contents: read
    steps:
      - name: Check release outcomes
        shell: bash
        env:
          PYTHON_WITH_PYPI: ${{ needs.release-python-with-pypi.result }}
          PYTHON_NO_PYPI: ${{ needs.release-python-no-pypi.result }}
          NODE_WITH_NPMJS: ${{ needs.release-node-with-npmjs.result }}
          NODE_NO_NPMJS: ${{ needs.release-node-no-npmjs.result }}
          RUBY_WITH_RUBYGEMS: ${{ needs.release-ruby-with-rubygems.result }}
          RUBY_NO_RUBYGEMS: ${{ needs.release-ruby-no-rubygems.result }}
          WXT: ${{ needs.release-wxt.result }}
        run: |
          set -Eeuo pipefail

          echo "Release job outcomes:"
          echo "  release-python-with-pypi:    ${PYTHON_WITH_PYPI}"
          echo "  release-python-no-pypi:      ${PYTHON_NO_PYPI}"
          echo "  release-node-with-npmjs:     ${NODE_WITH_NPMJS}"
          echo "  release-node-no-npmjs:       ${NODE_NO_NPMJS}"
          echo "  release-ruby-with-rubygems:  ${RUBY_WITH_RUBYGEMS}"
          echo "  release-ruby-no-rubygems:    ${RUBY_NO_RUBYGEMS}"
          echo "  release-wxt:                 ${WXT}"

          failed=()
          for result in \
            "release-python-with-pypi:${PYTHON_WITH_PYPI}" \
            "release-python-no-pypi:${PYTHON_NO_PYPI}" \
            "release-node-with-npmjs:${NODE_WITH_NPMJS}" \
            "release-node-no-npmjs:${NODE_NO_NPMJS}" \
            "release-ruby-with-rubygems:${RUBY_WITH_RUBYGEMS}" \
            "release-ruby-no-rubygems:${RUBY_NO_RUBYGEMS}" \
            "release-wxt:${WXT}"; do
            job="${result%%:*}"
            status="${result##*:}"
            if [[ "${status}" == "failure" || "${status}" == "cancelled" ]]; then
              failed+=("${job}(${status})")
            fi
          done

          if [[ "${#failed[@]}" -gt 0 ]]; then
            echo "One or more release jobs failed: ${failed[*]}" >&2
            exit 1
          fi

          success_count=0
          for r in \
            "${PYTHON_WITH_PYPI}" "${PYTHON_NO_PYPI}" \
            "${NODE_WITH_NPMJS}" "${NODE_NO_NPMJS}" \
            "${RUBY_WITH_RUBYGEMS}" "${RUBY_NO_RUBYGEMS}" \
            "${WXT}"; do
            [[ "${r}" == "success" ]] && ((success_count++)) || true
          done

          if [[ "${success_count}" -eq 0 ]]; then
            echo "No release job succeeded. This may indicate an upstream gate failure (policy, guards, or build jobs)." >&2
            exit 1
          fi

          echo "All release jobs completed successfully (skipped jobs are expected for non-matching project kinds)."