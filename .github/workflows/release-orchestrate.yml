name: Release Orchestrator (Reusable)

# PIPELINE OVERVIEW (simplified job dependency graph):
#
#   [lint-version-consistency]        [policy]
#                \                       /
#                 +------[resolve]-------+
#                / [guard-prerelease-only] \
#               /  [guard-non-clobber]      \
#              /   [prepare-release-notes]   \
#             /    [policy-publish-targets]   \
#            /                                 \
#  [build-<lang>]          ...per-language pipeline...
#     /         \
#  [ensure-tag]  [tag gate]
#        |
#  [attest-*]  [publish-*]
#     \           /
#   [release-<lang>-*]
#          |
#  [release-completed]
#
# Entry caller: official.yml (push:tag + workflow_dispatch)

on:
  workflow_call:
    inputs:
      source:
        description: "Resolution mode: 'tag' derives project/version from release tag; 'manual' uses explicit inputs."
        required: true
        type: string
      # source=tag
      ref_name:
        description: 'Tag name (caller passes github.ref_name). Required when source=tag.'
        required: false
        type: string
      ref:
        description: 'Full ref (caller passes github.ref). Required when source=tag.'
        required: false
        type: string

      # source=manual
      project:
        description: 'Workspace release project id (Python: pyproject.toml project.name; Node/.NET: three.release.yml project.id; exact display-name aliases are canonicalized to that project id; fuzzy matching remains forbidden). Required when source=manual.'
        required: false
        type: string
      version:
        description: 'Release version string. Required when source=manual.'
        required: false
        type: string
      target:
        description: >-
          Release target selector or pinned commit. Active caller workflows
          resolve raw dispatch selectors once and pass a pinned 40-hex commit
          SHA here; direct reusable callers with source=manual may leave this
          empty to use HEAD or pass a branch, tag, ref, or 40-hex SHA for the
          resolve layer to pin once. source=tag requires the pinned 40-hex SHA
          the tag is expected to peel to.
        required: false
        default: ''
        type: string
      force_update_tag:
        description: 'The active Official caller may use this to force-update an existing release tag. Legacy Buddy entry callers are retired and rejected.'
        required: false
        default: false
        type: boolean
      run_url:
        description: 'Top-level caller-visible run URL to surface in release notes.'
        required: false
        default: ''
        type: string

      channel:
        description: |-
          Do NOT use 'x-official', 'x-buddy', or any value that normalizes to these
          (e.g. 'x-official-') — reserved sanitization escape slugs.
          Release channel label for logs and policy validation (example: official, staging).
          'official' is the active governed entry channel. 'buddy' is reserved and rejected
          because the legacy Buddy entry route is retired; v3 Buddy uses separate workflows.
          Custom allowlisted channels must not use 'x-official' or 'x-buddy' as these names
          are reserved as sanitization escape slugs and will collide with mistyped official/buddy
          inputs in the generated target_environment output.
        required: true
        type: string
      channel_allowlist:
        description: >-
          Comma-separated list of custom channel names that are explicitly
          exempt from the active Official policy matrix. Use only for
          non-production channels (e.g., staging, canary).
          Callers are fully responsible for setting all publish flags correctly.
          SECURITY NOTE: allowlisted channels bypass all policy enforcement —
          only grant default-branch merge access to trusted contributors.
          Any new caller workflow file that supplies a non-empty channel_allowlist
          is itself a policy bypass vector and must be subject to the same
          branch-protection review as official.yml.
          RESERVED NAMES: do not include 'official', 'buddy', 'x-official', or
          'x-buddy' in the allowlist. 'official' is governed by the active
          caller policy; legacy 'buddy' is retired as an entry route; x-* values
          are reserved sanitization escape slugs. All are rejected at runtime.
        required: false
        default: ''
        type: string
      artifact_prefix:
        description: 'Prefix for generated workflow artifacts (for example: official, buddy).'
        required: true
        type: string
      github_release_prerelease:
        description: 'Whether GitHub Release is marked as prerelease.'
        required: true
        type: boolean

      # Channel profile flags are active for Official and custom callers. The
      # preserved Buddy policy matrix is historical/domain regression logic;
      # channel=buddy is reserved and rejected before this policy job.
      # Callers MUST pass all flags explicitly; the policy job re-asserts them
      # to catch misconfiguration at workflow start. For custom allowlisted
      # channels, callers are responsible for setting desired values.
      enforce_prerelease_only:
        description: 'If true, enforce resolved version to be prerelease-only.'
        required: false
        default: false
        type: boolean
      enforce_non_clobber:
        description: 'If true, buddy-like non-clobber protection is enabled.'
        required: false
        default: false
        type: boolean

      # SYNC[add-new-language] — add publish_<lang>_<registry> input below
      publish_python_pypi:
        description: 'If true, publish Python artifacts to PyPI.'
        required: false
        default: false
        type: boolean
      publish_node_gpr:
        description: 'If true, publish Node artifacts to GitHub Packages. official/buddy callers always pass this explicitly; default false prevents silent publishing for custom allowlisted channels.'
        required: false
        default: false
        type: boolean
      publish_node_npmjs:
        description: 'If true, publish Node artifacts to npmjs.org.'
        required: false
        default: false
        type: boolean
      publish_ruby_gpr:
        description: 'If true, publish Ruby gem to GitHub Packages.'
        required: false
        default: false
        type: boolean
      publish_ruby_rubygems:
        description: 'If true, publish Ruby gem to RubyGems.org.'
        required: false
        default: false
        type: boolean

      enable_attestation:
        description: 'If true, generate GitHub build provenance attestation for release assets.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'
  RUBY_VERSION: '3.3'
  NBGV_VERSION: '3.10.91'
  # SYNC[tool-versions]: keep in step with EXPECTED_*_VERSION in lint-version-consistency job env below.
  # Updating only one side will either cause the lint gate to fail (if env is updated but
  # EXPECTED is not) or silently pass with stale runtime env (if EXPECTED is updated but env is not).

jobs:
  reject-buddy-reruns:
    name: Reject buddy rerun attempts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Fail buddy rerun attempts
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ "${CHANNEL}" == "buddy" && "${RUN_ATTEMPT}" != "1" ]]; then
            echo "buddy release orchestration is single-attempt only; rerun attempts must fail closed." >&2
            exit 1
          fi

  guard-caller-identity:
    name: Guard reusable caller identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: reject-buddy-reruns
    permissions:
      id-token: write
    steps:
      - name: Validate reusable caller identity
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          CHANNEL_ALLOWLIST: ${{ inputs.channel_allowlist }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import sys
          import urllib.request

          def fail(message: str) -> None:
              print(message, file=sys.stderr)
              raise SystemExit(1)

          def decode_payload(token: str) -> dict[str, object]:
              parts = token.split(".")
              if len(parts) < 2:
                  fail("OIDC token is not a JWT")
              payload_segment = parts[1]
              padding = "=" * (-len(payload_segment) % 4)
              try:
                  payload = base64.urlsafe_b64decode(
                      payload_segment + padding
                  )
                  document = json.loads(payload)
              except Exception as exc:  # noqa: BLE001
                  fail(f"OIDC token payload could not be decoded: {exc}")
              if not isinstance(document, dict):
                  fail("OIDC token payload is not an object")
              return document

          def request_token() -> str:
              request_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", "")
              request_token = os.environ.get(
                  "ACTIONS_ID_TOKEN_REQUEST_TOKEN", ""
              )
              if not request_url or not request_token:
                  fail("id-token: write is required for caller identity guard")
              separator = "&" if "?" in request_url else "?"
              url = (
                  f"{request_url}{separator}"
                  "audience=three-release-orchestrate-caller"
              )
              request = urllib.request.Request(
                  url,
                  headers={"Authorization": f"bearer {request_token}"},
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  token_response = json.loads(response.read())
              token = token_response.get("value")
              if not isinstance(token, str) or not token:
                  fail("OIDC token response did not contain a token value")
              return token

          repository = os.environ["EXPECTED_REPOSITORY"]
          expected_ref = os.environ["EXPECTED_REF"]
          channel = os.environ["CHANNEL"]
          channel_allowlist = {
              item.strip()
              for item in os.environ.get("CHANNEL_ALLOWLIST", "").split(",")
              if item.strip()
          }
          reserved_allowlist_entries = channel_allowlist & {"official", "buddy"}
          if reserved_allowlist_entries:
              fail(
                  "Reserved channel names cannot appear in channel_allowlist: "
                  f"{sorted(reserved_allowlist_entries)!r}. "
                  "'official' is the only active entry route, and legacy "
                  "'buddy' is retired."
              )

          claims = decode_payload(request_token())

          if claims.get("repository") != repository:
              fail(
                  "Reusable release orchestrator called from unexpected "
                  f"repository: {claims.get('repository')!r}"
              )

          expected_job_workflow_ref = (
              f"{repository}/.github/workflows/release-orchestrate.yml@"
              f"{expected_ref}"
          )
          if claims.get("job_workflow_ref") != expected_job_workflow_ref:
              fail(
                  "Reusable release orchestrator workflow identity mismatch: "
                  f"{claims.get('job_workflow_ref')!r}"
              )

          entry_workflows = {
              "official": ".github/workflows/official.yml",
          }
          if channel == "buddy":
              fail(
                  "Legacy Buddy entry route is retired; channel 'buddy' is a "
                  "reserved channel with no active caller route. Use the "
                  "current v3 Buddy workflows or the active Official entry "
                  "instead."
              )
          entry_workflow = entry_workflows.get(channel)
          workflow_ref = claims.get("workflow_ref")
          if entry_workflow is not None:
              expected_workflow_ref = (
                  f"{repository}/{entry_workflow}@{expected_ref}"
              )
              if workflow_ref != expected_workflow_ref:
                  fail(
                      f"Channel {channel!r} must be called only by "
                      f"{expected_workflow_ref}, observed {workflow_ref!r}"
                  )
          elif channel not in channel_allowlist:
              fail(
                  f"Custom channel {channel!r} is not present in "
                  "channel_allowlist"
              )
          elif not (
              isinstance(workflow_ref, str)
              and workflow_ref.startswith(
                  f"{repository}/.github/workflows/"
              )
              and workflow_ref.endswith(f"@{expected_ref}")
          ):
              fail(
                  "Custom release channel caller must be a checked-in workflow "
                  f"from the selected ref, observed {workflow_ref!r}"
              )

          print(
              "Reusable caller identity accepted: "
              f"channel={channel}, workflow_ref={workflow_ref}"
          )
          PY

  # ---------------------------------------------------------------------------
  # JOB NAMING CONVENTION: Conditional-but-always-verify pairs
  # ---------------------------------------------------------------------------
  # Some features (attestation, registry publishing) are conditionally enabled
  # via input flags. Because GitHub Actions' `needs:` graph is evaluated
  # statically, downstream jobs cannot selectively depend on a job that may be
  # skipped. The solution is a two-job pair:
  #
  #   *-enabled  — The actual working job. Runs only when the feature flag is
  #                true. Typically has no `always()` in its `if:` — it is
  #                skipped when the flag is false.
  #                EXCEPTION: If `*-enabled` lists a potentially-skipped job in
  #                its `needs:`, it must also use `always()` to prevent an
  #                unwanted cascade-skip. See publish-node-gpr-enabled for an
  #                example: it lists gate-node-publish-npmjs (which is skipped
  #                when publish_node_npmjs=false) and therefore requires
  #                `always()` plus an explicit result check in its `if:`.
  #   *          — The gate verifier. Always runs via `always()`. If the
  #                feature is enabled, it verifies the `-enabled` job succeeded
  #                (failing loudly if not). If disabled, it logs a note and
  #                exits 0. Downstream jobs depend on this gate unconditionally.
  #
  # This pattern appears for:  attest-{python,node,ruby}  and
  #   publish-{node,ruby}-gpr  (and any future conditional publish jobs).
  # ---------------------------------------------------------------------------

  # ===========================================================================
  # SECTION: Lint
  # ===========================================================================
  # Because GitHub Actions `uses: with:` blocks do not evaluate the `env` context,
  # tool version values (python_version, node_version, pnpm_version, ruby_version)
  # must be hardcoded in several sub-workflow call sites. This job verifies that all
  # hardcoded occurrences in this file match the expected values declared below,
  # catching any accidental drift introduced by copy-paste or partial updates.
  lint-version-consistency:
    name: Lint tool version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EXPECTED_PYTHON_VERSION: '3.14'
      EXPECTED_NODE_VERSION: '24'
      EXPECTED_PNPM_VERSION: '11.21.0'
      EXPECTED_RUBY_VERSION: '3.3'
      # SYNC[add-new-language] — add EXPECTED_<LANG>_VERSION: '<version>' here for each new language tool
      # SYNC[tool-versions]: keep in step with the workflow-level env: block above.
      # These EXPECTED_* values are what the lint check validates hardcoded with: values against.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify hardcoded versions match env declarations
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "${GITHUB_WORKSPACE}/eng/scripts/release_orchestrate_lint_tool_versions.sh"

      - name: Verify caller completeness (all publish_* inputs explicitly passed)
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "${GITHUB_WORKSPACE}/eng/scripts/release_orchestrate_lint_caller_completeness.sh"

      - name: Verify release-completed covers all release-* jobs
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "${GITHUB_WORKSPACE}/eng/scripts/release_orchestrate_lint_release_completed_needs.sh"

  # ===========================================================================
  # SECTION: Policy and Infrastructure
  # ===========================================================================
  # The policy job validates that the caller-provided channel profile flags match the
  # expected profile for the given channel. This is an intentional "belt and suspenders"
  # design: callers explicitly declare their intent via flags, and the policy job verifies
  # correctness. This catches copy-paste errors in new caller workflows and documents the
  # expected profile for each channel in a single authoritative location.
  #
  # WARNING: This table is maintained manually. Keep it in sync with the assert_equals /
  # assert_disabled calls in the case statement below. The assertions are the source of
  # truth — the table is documentation only. When adding a new language or flag, update
  # BOTH this table and the corresponding assert_equals calls in the case statement.
  #
  # Channel profile matrix (DOCUMENTATION ONLY — the assert_equals calls below are the
  # source of truth; a value in this table that disagrees with an assertion is a bug in
  # the table, not in the assertion):
  #
  #   Flag                      | official | buddy
  #   --------------------------|----------|-------
  #   enforce_prerelease_only   | false    | true
  #   enforce_non_clobber       | false    | true
  #   github_release_prerelease | false    | true
  #   publish_python_pypi       | true     | false
  #   publish_node_gpr          | true     | true
  #   publish_node_npmjs        | true     | false
  #   publish_ruby_gpr          | true     | true
  #   publish_ruby_rubygems     | true     | false
  #   enable_attestation        | true     | false
  #
  # SYNC[add-new-language] — add a new row to the matrix table above for each new flag.
  # Custom channels (allowlisted via channel_allowlist) bypass all assertions.
  # Callers are solely responsible for setting correct flag values for custom channels.
  policy:
    name: Validate orchestration policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - reject-buddy-reruns
      - guard-caller-identity
    permissions:
      contents: read
    steps:
      - name: Checkout (policy scripts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate inputs
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          CHANNEL_ALLOWLIST: ${{ inputs.channel_allowlist }}
          SOURCE: ${{ inputs.source }}
          GITHUB_RELEASE_PRERELEASE: ${{ inputs.github_release_prerelease }}
          ENFORCE_PRERELEASE_ONLY: ${{ inputs.enforce_prerelease_only }}
          ENFORCE_NON_CLOBBER: ${{ inputs.enforce_non_clobber }}
          # SYNC[add-new-language] — add PUBLISH_<LANG>_<REGISTRY>: ${{ inputs.publish_<lang>_<registry> }} env var here
          PUBLISH_PYTHON_PYPI: ${{ inputs.publish_python_pypi }}
          PUBLISH_NODE_GPR: ${{ inputs.publish_node_gpr }}
          PUBLISH_NODE_NPMJS: ${{ inputs.publish_node_npmjs }}
          PUBLISH_RUBY_GPR: ${{ inputs.publish_ruby_gpr }}
          PUBLISH_RUBY_RUBYGEMS: ${{ inputs.publish_ruby_rubygems }}
          ENABLE_ATTESTATION: ${{ inputs.enable_attestation }}
          REF_NAME: ${{ inputs.ref_name }}
          REF: ${{ inputs.ref }}
          PROJECT: ${{ inputs.project }}
          VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          bash "${GITHUB_WORKSPACE}/eng/scripts/release_orchestrate_policy_validate_inputs.sh"

      - name: Self-test policy flag coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "${GITHUB_WORKSPACE}/eng/scripts/release_orchestrate_policy_self_test.sh"

  # NOTE: This job runs AFTER resolve (not at workflow start) because project_kind
  # (python/node/ruby/dotnet/wxt) is only known after the resolve step. It validates that
  # the caller's publish flags are consistent with the resolved project kind.
  # Contrast with the `policy` job (no needs:) which validates the channel-profile
  # flags unconditionally at workflow start — before any resolution occurs.
  policy-publish-targets:
    name: Validate publish-target policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: resolve
    permissions:
      contents: read
    steps:
      - name: Checkout (policy publish-target scripts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate publish targets by project kind
        shell: bash
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
          PROJECT_KIND: ${{ needs.resolve.outputs.project_kind }}
          IS_WXT: ${{ needs.resolve.outputs.is_wxt }}
          CHANNEL: ${{ inputs.channel }}
          # SYNC[add-new-language] — (1) add publish_<lang>_<registry> env var(s) to the env: block above
          # SYNC[add-new-language] — (2) add per-kind validation branch (if/elif) to the run: script below
          PUBLISH_NODE_GPR: ${{ inputs.publish_node_gpr }}
          PUBLISH_NODE_NPMJS: ${{ inputs.publish_node_npmjs }}
          PUBLISH_PYTHON_PYPI: ${{ inputs.publish_python_pypi }}
          PUBLISH_RUBY_GPR: ${{ inputs.publish_ruby_gpr }}
          PUBLISH_RUBY_RUBYGEMS: ${{ inputs.publish_ruby_rubygems }}
        run: |
          set -Eeuo pipefail
          bash "${GITHUB_WORKSPACE}/eng/scripts/release_orchestrate_policy_publish_targets.sh"

  resolve:
    name: Resolve release inputs
    uses: ./.github/workflows/release-resolve.yml
    needs:
      - policy
      - lint-version-consistency
    secrets: {}
    permissions:
      contents: read
    with:
      source: ${{ inputs.source }}
      # Hardcoded: uses: with: does not support env context; keep in sync with env.PYTHON_VERSION
      python_version: '3.14'

      # source=tag
      ref_name: ${{ inputs.ref_name }}
      ref: ${{ inputs.ref }}

      # source=manual
      project: ${{ inputs.project }}
      version: ${{ inputs.version }}
      target: ${{ inputs.target }}
      force_update_tag: ${{ inputs.force_update_tag }}
      run_url: ${{ inputs.run_url }}

  # HUB PREP: Centralize normalized orchestration context for spoke workflows.
  # Jobs that need profile-derived routing data list resolve-hub-context explicitly
  # in needs: and must still enforce their own plan-derived gates.
  # NOTE: The validate_inputs.sh changes shipped in the same Step 2 PR ARE breaking for
  # edge-case callers (stricter channel_allowlist regex, new reserved names x-official/x-buddy,
  # new pre-case guards). See .github/workflows/docs/DESIGN.v2.md for the active topology.
  # NOTE: Any exit 1 in this job (e.g., unrecognized project_variant) will fail dependent
  # jobs. This is intentional: the hub context must be derivable on every run.
  # NOTE: All guard jobs and policy-publish-targets are included in needs: so any spoke
  # routing job added inside THIS workflow file that depends on this job transitively
  # inherits full guard and policy enforcement, within this workflow's DAG only.
  # NOTE: prepare-release-notes is intentionally NOT in needs: here — release-notes
  # preparation is not routing context. Step-6 routing jobs that consume release notes
  # MUST add prepare-release-notes to their own needs: directly.
  # IMPORTANT: This guarantee does NOT extend across workflow_call boundaries. A spoke
  # workflow file invoked via 'uses:' runs in its own context and has no visibility of
  # this workflow's guard jobs. Direct callers of a spoke workflow bypass ALL hub guards.
  # Spoke workflow files MUST document this at their top-level security comment.
  resolve-hub-context:
    name: Resolve hub orchestration context
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - policy
      - resolve
      - policy-publish-targets
      - guard-prerelease-only
      - guard-non-clobber
    permissions: {}
    # id-token: write is intentionally absent — this job performs no OIDC operations.
    # This job must never acquire OIDC tokens; only hardcoded-environment spoke publish
    # jobs should hold id-token: write.
    # SYNC[add-new-language] — if a new language adds a hub-level output, add it here.
    # Published outputs (forwarding contract — stable for spoke consumers):
    #   channel_profile:    'official' | 'custom' ('buddy' is retained only as unreachable historical/domain logic)
    #   planner_profile:    'official' (custom channels intentionally use the official descriptor/planner profile)
    #   target_environment: 'release-official' | 'release-<sanitized>' ('release-buddy' is unreachable after retirement)
    #   publish_mode:       'publish' | 'build-only'
    # Hub-internal derived value (NOT in outputs:, do NOT forward to spokes):
    #   project_variant:    known values: 'python' | 'ruby' | 'dotnet' | 'node-npm' | 'node-wxt';
    #                       unrecognized PROJECT_KIND values cause a hard failure (exit 1).
    #                       SYNC[add-new-language] — add a branch in the variant mapping below.
    # SECURITY: target_environment is routing/approval-gate metadata only.
    # Spoke OIDC publish jobs MUST use hardcoded environment names ('pypi', 'npmjs',
    # 'rubygems', etc.), NOT this output. The 'environment:' field determines the
    # 'environment' sub-claim baked into the OIDC token; registry Trusted Publisher
    # configurations validate this sub-claim by name — a mismatch causes a hard OIDC
    # rejection (publish failure), and a dynamic environment name may also lack the
    # required-reviewer gate that is the real human approval barrier.
    # NOTE: Spokes MUST use a two-job pattern:
    #   gate job:    environment: ${{ inputs.target_environment }}  # human approval; NO id-token: write
    #   publish job: needs: [gate], environment: pypi               # hardcoded; id-token: write here only
    # WRONG pattern (do NOT do this — bypasses human approval gate or misroutes OIDC token):
    #   if: needs.resolve-hub-context.outputs.publish_mode == 'publish'  # insufficient alone
    #   environment: ${{ inputs.target_environment }}  # on a job with id-token: write = WRONG
    # SECURITY: publish_mode is informational routing intent, not an authorization
    # decision. It MUST NOT be the sole if: condition guarding OIDC token requests.
    # The environment: field with required reviewers is the real security boundary.
    # PREREQUISITE: The active GitHub Environment 'release-official' MUST be
    # pre-created in repository Settings → Environments with required reviewers
    # before any spoke is deployed. Legacy 'release-buddy' is not an active
    # prerequisite after commit 11. GitHub auto-creates missing environments
    # with NO protection rules, silently bypassing the approval gate.
    outputs:
      channel_profile: ${{ steps.context.outputs.channel_profile }}
      # ROUTING-ONLY: channel_profile is metadata for spoke routing and diagnostics.
      # Spokes MUST NOT use channel_profile to gate attestation or other policy-critical
      # behavior; use explicit policy inputs (for example: enable_attestation) instead.
      planner_profile: ${{ steps.context.outputs.planner_profile }}
      # Planner profile is the descriptor/profile selector accepted by planner contracts.
      # Allowlisted custom routing channels do not create a third descriptor profile; they
      # use the official descriptor profile while retaining channel_profile=custom for
      # routing, reports, and protected-environment naming.
      target_environment: ${{ steps.context.outputs.target_environment }}
      publish_mode: ${{ steps.context.outputs.publish_mode }}
      # COMPLIANCE: publish_mode='publish'|'build-only' is the current routing contract.
      # See .github/workflows/docs/DESIGN.v2.md for the active release topology.
      # NOTE: project_variant is intentionally NOT a job output — it is hub-internal only.
      # (HUB-ROUTING: used only for publish_mode derivation and step-summary diagnostics.)
      # Do NOT promote it to outputs: — any needs: resolve-hub-context consumer could
      # accidentally forward it to a spoke, violating the §2.2 spoke forwarding contract.
      # Re-introduce as a job output only when Step 6 routing jobs have an explicit need.
    steps:
      - name: Derive normalized orchestration context
        id: context
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          CHANNEL_ALLOWLIST: ${{ inputs.channel_allowlist }} # display only in step summary — allowlist enforcement is solely in the policy job
          PROJECT_KIND: ${{ needs.resolve.outputs.project_kind }}
          IS_WXT: ${{ needs.resolve.outputs.is_wxt }}
          # SYNC[add-new-language] — add PUBLISH_<LANG>_<REGISTRY>: ${{ inputs.publish_<lang>_<registry> }} here
          PUBLISH_PYTHON_PYPI: ${{ inputs.publish_python_pypi }}
          PUBLISH_NODE_GPR: ${{ inputs.publish_node_gpr }}
          PUBLISH_NODE_NPMJS: ${{ inputs.publish_node_npmjs }}
          PUBLISH_RUBY_GPR: ${{ inputs.publish_ruby_gpr }}
          PUBLISH_RUBY_RUBYGEMS: ${{ inputs.publish_ruby_rubygems }}
        # TODO(Step 6): Extract this run: block to eng/scripts/release_orchestrate_hub_context.sh
        # for improved local testability and Phase 3 self-test coverage (structural +
        # behavioral guards equivalent to Phase 0/2 in release_orchestrate_policy_self_test.sh).
        run: |
          set -Eeuo pipefail

          # Strip all whitespace and lowercase the channel to ensure deterministic case
          # matching regardless of workflow_dispatch user input (e.g. ' Official' or 'BUDDY').
          # NOTE (defensive path only): this strip is lossy — 'my channel' collapses to
          # 'mychannel' with no error. In production the policy job (in needs:) rejects any
          # CHANNEL with whitespace before this job runs, making the strip a no-op.
          channel_trimmed="${CHANNEL//[[:space:]]/}"
          lower_channel="${channel_trimmed,,}"

          channel_profile="custom"      # default for custom/allowlisted channels (overridden by known channels below)
          target_environment=""         # set in every case branch; pre-initialized for set -u safety
          sanitized=""                  # set only in the *) custom branch; pre-initialized for set -u safety in step summary

          case "${lower_channel}" in
            official)
              channel_profile="official"
              target_environment="release-official"
              # sanitized remains "" — not applicable for known channels
              ;;
            buddy)
              channel_profile="buddy"
              target_environment="release-buddy"
              # sanitized remains "" — not applicable for known channels
              ;;
            *)
              # For allowlisted custom channels, keep a deterministic environment naming
              # convention for future spoke workflow migration.
              # policy permits underscores in channel names; retain them here to avoid
              # collisions between 'my_channel' and 'my-channel'. Replace other
              # non [a-z0-9_-] characters with '-'.
              # Sed passes: (1) replace non-slug chars with '-';
              #             (2) strip any leading '-' or '_'; (3) strip any trailing '-' or '_';
              #             (4) collapse runs of 2 or more consecutive dashes to a single '-'.
              # NOTE: Pass 3 strips both trailing dashes AND trailing underscores (both are treated
              # as separators). This asymmetry with pass 4 (which collapses only consecutive dashes,
              # not underscores) means interior underscore runs in local-testing inputs are preserved
              # while trailing underscores are stripped — both behaviours are intentional and
              # documented; all such inputs are blocked by the allowlist regex in production.
              # NOTE: Pass 4 collapses consecutive dashes only, not consecutive underscores.
              # Underscore runs (e.g. 'my__channel') are intentionally preserved to keep
              # 'my__channel' ≠ 'my-channel' as distinct environment names.
              # Mixed sequences (e.g. '_-' or '-_') are not collapsed either; however, both
              # consecutive underscores and mixed separator sequences are rejected by the
              # allowlist regex (^[a-z0-9]([a-z0-9]|[_-][a-z0-9])*$), so they cannot appear
              # in a validated allowlist entry. The defensive/local-testing path may produce
              # environment names with these sequences, which is acceptable and documented.
              sanitized="$(printf '%s' "${lower_channel}" | sed -E \
                -e 's/[^a-z0-9_-]+/-/g' \
                -e 's/^[-_]+//' \
                -e 's/[-_]+$//' \
                -e 's/-{2,}/-/g')"
              # Fallback: if sanitization produces an empty string (all-symbol input like '!!!'),
              # use 'custom' as the sentinel environment name. In production this path is
              # unreachable: the policy job (in needs:) rejects any CHANNEL that finds no matching
              # allowlist entry; no valid allowlist entry can equal '!!!'. In local testing,
              # note that a user with 'custom' in their allowlist and this fallback triggered
              # would route to the same 'release-custom' environment — an accepted local-testing
              # limitation since the policy gate prevents this in production.
              if [[ -z "${sanitized}" ]]; then
                sanitized="custom"
              fi
              # Defensive: structurally unreachable — channel_trimmed already strips all
              # [[:space:]] including \n before sed runs, and the sed passes cannot introduce
              # newlines. Retained as an explicit guard against future refactoring that moves
              # whitespace stripping after the sed pipeline.
              if [[ "${sanitized}" == *$'\n'* ]]; then
                echo "::error::BUG: sanitized channel contains a newline — output would corrupt GITHUB_OUTPUT." >&2
                exit 1
              fi
              # Guard: prevent sanitization from silently collapsing to a reserved environment
              # name. e.g. 'official-' has its trailing dash stripped → 'official', which
              # would produce 'release-official' and impersonate the real official gate.
              # Only 'official' and 'buddy' are reserved environment gates; 'x-official'/'x-buddy'
              # are the escape slugs produced here and are not protected gates themselves.
              # validate_inputs.sh blocks the exact strings 'x-official'/'x-buddy' as channel
              # inputs, but inputs that sanitize to 'x-official' via other paths (e.g. 'x-official-')
              # still land on 'release-x-official'. This is intentional and not a security concern:
              # 'release-x-official' is not a protected gate — the collision guard's only job
              # is to prevent 'release-official' and 'release-buddy' impersonation.
              if [[ "${sanitized}" == "official" || "${sanitized}" == "buddy" ]]; then
                sanitized="x-${sanitized}"
              fi
              target_environment="release-${sanitized}"
              ;;
          esac

          # Invariant: target_environment must be non-empty (every channel case branch must
          # assign it). This guard is placed here — immediately after the channel case block —
          # so that any future branch that forgets to assign target_environment fails before
          # any project_variant or publish_mode computation runs on an inconsistent state.
          # It is symmetric with the project_variant guard below and prevents a silent empty
          # environment name from reaching GITHUB_OUTPUT, which would cause downstream gate
          # jobs to run without a GitHub Environment (bypassing required reviewers).
          if [[ -z "${target_environment}" ]]; then
            echo "::error::BUG: target_environment is empty after channel resolution. Every case branch must assign target_environment before this point. This is a programming error." >&2
            exit 1
          fi

          # Strip all POSIX whitespace from PROJECT_KIND BEFORE variant mapping. Stripping first
          # ensures exact comparisons work correctly: e.g. 'node ' (trailing space) would miss
          # both 'node' branches without this normalization step. The tr call also satisfies the
          # empty-string guard below by ensuring a whitespace-only PROJECT_KIND resolves to "".
          # SYNC[add-new-language] — if the new language has sub-variants (like node has WXT),
          # add an elif branch here to remap project_variant to the sub-variant slug.
          # If no sub-variants exist, skip this block; project_variant defaults to "${PROJECT_KIND}"
          # and the publish_mode case below is the first mandatory extension point.
          project_variant="$(printf '%s' "${PROJECT_KIND}" | tr -d '[:space:]')"  # strip all POSIX whitespace first
          # Fail fast if IS_WXT is empty for node projects. The upstream release-resolve job
          # is contractually required to output IS_WXT='true' or 'false' for all node projects.
          # Silently treating an absent IS_WXT as 'false' risks misrouting WXT projects through
          # the npm publish path, producing silent cross-kind contamination in CI.
          if [[ "${project_variant}" == "node" && -z "${IS_WXT:-}" ]]; then
            echo "::error::IS_WXT is empty for project_kind=node. The upstream release-resolve job output contract requires IS_WXT='true' or 'false' for all node projects. Set IS_WXT in the resolve step." >&2
            exit 1
          fi
          # Contract: IS_WXT must be exactly 'true' or 'false' for node projects.
          # Non-canonical values ('yes', '1', 'TRUE', etc.) pass the empty check above but
          # fail the == 'true' branch below, silently routing WXT projects as node-npm.
          if [[ "${project_variant}" == "node" && "${IS_WXT:-}" != "true" && "${IS_WXT:-}" != "false" ]]; then
            echo "::error::IS_WXT has non-canonical value '${IS_WXT:-}' for project_kind=node. The upstream release-resolve job output contract requires exactly 'true' or 'false'." >&2
            exit 1
          fi
          if [[ "${project_variant}" == "node" && "${IS_WXT:-}" == "true" ]]; then
            project_variant="node-wxt"
          elif [[ "${project_variant}" == "node" ]]; then
            project_variant="node-npm"
          fi

          # Fail fast if PROJECT_KIND was empty — upstream resolve contract violation.
          if [[ -z "${project_variant}" ]]; then
            echo "::error::project_variant resolved to empty string. PROJECT_KIND='${PROJECT_KIND}' is empty; upstream resolve job output contract is violated." >&2
            exit 1
          fi

          # Determine publish_mode scoped to the resolved project variant.
          # This avoids cross-language flag contamination: e.g. official-channel WXT builds have
          # publish_node_gpr=true by policy, but WXT publishes no npm artifacts.
          # SYNC[add-new-language] — add a case branch for the new project_kind with its registry flag(s)
          # SYNC[paired-blocks]: this case block and the active_flags case block in the
          # GITHUB_STEP_SUMMARY section below must cover the same set of project_variant arms.
          # Divergence produces misleading publish-flag diagnostics in the step summary
          # (not a functional failure). When adding a new project_variant, update both blocks.
          publish_mode="build-only"
          case "${project_variant}" in
            python)
              [[ "${PUBLISH_PYTHON_PYPI}"   == "true" ]] && publish_mode="publish"
              ;;
            node-npm)
              [[ "${PUBLISH_NODE_GPR}"      == "true" || "${PUBLISH_NODE_NPMJS}" == "true" ]] && publish_mode="publish"
              ;;
            node-wxt)
              # WXT distributes browser extension archives; publish_mode is always 'build-only'
              # regardless of PUBLISH_NODE_NPMJS/GPR flags. Policy may require PUBLISH_NODE_NPMJS=true
              # for official WXT channels (forward-compatibility baseline), but the flag has no
              # routing effect here. See validate_inputs.sh official case for the policy assertion.
              publish_mode="build-only"  # explicit assignment; does not rely on pre-loop initialization
              ;;
            ruby)
              [[ "${PUBLISH_RUBY_GPR}"      == "true" || "${PUBLISH_RUBY_RUBYGEMS}" == "true" ]] && publish_mode="publish"
              ;;
            dotnet)
              # .NET first-delivery release descriptors route to GitHub Release assets only.
              # NuGet registry publication remains deferred, so no external registry flag changes publish_mode.
              publish_mode="build-only"
              ;;
            *)
              # Unknown project_variant: fail rather than silently producing incorrect routing.
              # This can occur when PROJECT_KIND from release-resolve.yml is a new language
              # not yet added to the variant mapping above.
              # SYNC[add-new-language] — add a case arm ABOVE for the new variant.
              # Do NOT delete this *) arm — it MUST remain as a permanent catch-all guard.
              # Only replace the 'exit 1' with correct handler logic when the variant is supported.
              echo "::error::Unrecognized project_variant '${project_variant}' (PROJECT_KIND='${PROJECT_KIND}', IS_WXT='${IS_WXT:-}'). Known variants: python, node-npm, node-wxt, ruby, dotnet. If this is a new language, add a branch above." >&2
              exit 1
              ;;
          esac

          # GITHUB_OUTPUT: outputs are critical — intentionally no fallback.
          # Unlike GITHUB_STEP_SUMMARY (informational), a write failure here must be
          # surfaced immediately rather than silently swallowed. In local/offline testing,
          # set GITHUB_OUTPUT to a temporary file to avoid an unbound-variable error.
          # NOTE: project_variant is intentionally NOT written here — it is hub-internal.
          # See the outputs: block comment above for the rationale.
          # SAFETY: it is safe to write these three values unquoted to GITHUB_OUTPUT because
          # both the sed normalization step (which strips all characters outside [a-z0-9_-])
          # and the explicit newline guard above have already run. No embedded newlines or
          # special characters can reach this point to corrupt the KEY=VALUE line format.
          planner_profile="${channel_profile}"
          if [[ "${planner_profile}" == "custom" ]]; then
            planner_profile="official"
          fi

          {
            echo "channel_profile=${channel_profile}"
            echo "planner_profile=${planner_profile}"
            echo "target_environment=${target_environment}"
            echo "publish_mode=${publish_mode}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### Hub context"
            echo "#### Raw inputs"
            # Show both raw and normalized channel so operators can spot unintended normalization
            # at a glance without inspecting workflow dispatch inputs.
            echo "- channel (raw): \`${CHANNEL}\`"
            # NOTE: In a normal workflow run, the policy job (in needs:) rejects any CHANNEL
            # containing whitespace or uppercase before this job runs, so lower_channel == CHANNEL
            # is always true here. The 'normalized to' branch is defensive — it would fire only
            # if this script is invoked without the policy gate (e.g. local testing).
            if [[ "${lower_channel}" != "${CHANNEL}" ]]; then
              norm_desc=""
              [[ "${channel_trimmed}" != "${CHANNEL}" ]] && norm_desc="whitespace stripped"
              [[ "${lower_channel}" != "${channel_trimmed}" ]] && norm_desc="${norm_desc:+${norm_desc}, }lowercased"
              echo "  - normalized to: \`${lower_channel}\` (${norm_desc})"
            fi
            echo "- project_kind: \`${PROJECT_KIND}\`"
            echo "- is_wxt: \`${IS_WXT:-}\`"
            echo "#### Derived outputs"
            echo "- channel_profile: \`${channel_profile}\`"
            echo "- planner_profile: \`${planner_profile}\`"
            echo "- target_environment: \`${target_environment}\`"
            if [[ -n "${sanitized}" ]]; then
              # Show sanitized channel for custom channels so operators can trace
              # the normalisation path: lower_channel → sanitized → target_environment.
              echo "  - channel sanitized to: \`${sanitized}\`"
            fi
            echo "- project_variant: \`${project_variant}\`"
            echo "- publish_mode: \`${publish_mode}\`"
            if [[ "${project_variant}" == "node-wxt" ]]; then
              echo "  - note: WXT produces browser extension archives; publish_mode is always build-only regardless of publish_node_npmjs/gpr flag values"
            fi
            if [[ "${publish_mode}" == "publish" ]]; then
              active_flags=()
              # SYNC[add-new-language] — add a case branch for the new project_variant.
              # Collect only flags for the resolved project_variant to avoid misleading
              # diagnostics when cross-language flags are also set by the channel policy.
              # SYNC[paired-blocks]: this case block and the publish_mode case block above
              # must cover the same set of project_variant arms (divergence = misleading summary).
              # TODO(Step 6): merge this case block and the publish_mode case block above into
              # a single pass. Do NOT merge without first extracting the GITHUB_OUTPUT writes
              # (in the publish_mode case block) into a dedicated write section — the current
              # structure writes to GITHUB_OUTPUT mid-case, and a merged block would interleave
              # output writes with summary state. The summary block reads bash variable
              # ${publish_mode} directly (not from the GITHUB_OUTPUT file), so the ordering
              # constraint is about code structure, not I/O ordering.
              # Remove both blocks once Step 6 routes each language to its own spoke job,
              # making hub-level publish_mode derivation unnecessary.
              case "${project_variant}" in
                python)
                  [[ "${PUBLISH_PYTHON_PYPI}"   == "true" ]] && active_flags+=("publish_python_pypi")
                  ;;
                node-npm)
                  [[ "${PUBLISH_NODE_GPR}"      == "true" ]] && active_flags+=("publish_node_gpr")
                  [[ "${PUBLISH_NODE_NPMJS}"    == "true" ]] && active_flags+=("publish_node_npmjs")
                  ;;
                ruby)
                  [[ "${PUBLISH_RUBY_GPR}"      == "true" ]] && active_flags+=("publish_ruby_gpr")
                  [[ "${PUBLISH_RUBY_RUBYGEMS}" == "true" ]] && active_flags+=("publish_ruby_rubygems")
                  ;;
                dotnet)
                  # NuGet registry publication remains deferred; dotnet publishes no external registry flags.
                  : # no publish flags for .NET GitHub Release-only artifacts
                  ;;
                node-wxt)
                  # INTENTIONALLY retained even though unreachable today (the outer
                  # if [[ publish_mode == 'publish' ]] is always false for node-wxt since
                  # publish_mode is explicitly forced to 'build-only' for this variant).
                  # Do NOT delete: if publish_mode derivation ever changes for node-wxt,
                  # this arm prevents the *) fallback from printing a misleading diagnostic.
                  # SYNC[paired-blocks]: keep this arm in sync with the publish_mode case block.
                  : # no publish flags for WXT
                  ;;
                *)
                  # This arm is unreachable in a valid run: the publish_mode case block
                  # above calls 'exit 1' for any unrecognized project_variant, so the script
                  # never reaches this summary section with an unknown variant. It is kept as
                  # a maintenance reminder: if a new variant is added to the publish_mode block
                  # but not here, diagnostics will flag it instead of silently omitting flags.
                  # SYNC[add-new-language] — update this case arm when a new project_variant
                  # is added so publish-flag diagnostics remain accurate.
                  active_flags+=("(unhandled variant '${project_variant}': update summary block)")
                  ;;
              esac
              if [[ ${#active_flags[@]} -gt 0 ]]; then
                echo "  - active: ${active_flags[*]}"
              else
                echo "  - active: (none)"
              fi
            fi
            if [[ -n "${CHANNEL_ALLOWLIST}" ]]; then
              echo "- channel_allowlist: configured"
            else
              echo "- channel_allowlist: empty"
            fi
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true

  guard-prerelease-only:
    name: Guard prerelease-only policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve
      - policy # explicit: ensure channel policy is validated before guards run
    permissions:
      contents: read
    steps:
      - name: Enforce prerelease-only
        if: inputs.enforce_prerelease_only
        shell: bash
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.resolve.outputs.version }}
          IS_PRERELEASE: ${{ needs.resolve.outputs.is_prerelease }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -Eeuo pipefail
          if [[ "${IS_PRERELEASE}" != "true" ]]; then
            echo "Prerelease-only policy is enabled. Refusing '${PROJECT}' version '${VERSION}'." >&2
            exit 1
          fi
          echo "Prerelease-only guard passed for ${PROJECT} ${VERSION}."
          echo "### Guard: Prerelease-only :white_check_mark: passed" >> "${GITHUB_STEP_SUMMARY}"
          echo "Version \`${VERSION}\` is a prerelease. Guard passed for channel \`${CHANNEL}\`." >> "${GITHUB_STEP_SUMMARY}"

      - name: Guard disabled
        if: ${{ !inputs.enforce_prerelease_only }}
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -Eeuo pipefail
          echo "Prerelease-only guard is disabled for this channel."
          echo "### Guard: Prerelease-only :white_check_mark: disabled" >> "${GITHUB_STEP_SUMMARY}"
          echo "Prerelease-only enforcement is not enabled for channel \`${CHANNEL}\`." >> "${GITHUB_STEP_SUMMARY}"

  guard-non-clobber:
    name: Guard non-clobber policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve
      - policy # explicit: ensure channel policy is validated before guards run
    permissions:
      contents: read
    steps:
      - name: Install jq
        if: inputs.enforce_non_clobber
        uses: dcarbone/install-jq-action@4fcb5062d7ce9bc4382d1a352d19ba3ba2c317c1 # v4.0.1
        with:
          version: '1.7.1'

      - name: Checkout (non-clobber guard scripts)
        if: inputs.enforce_non_clobber
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check existing GitHub Release by tag
        if: inputs.enforce_non_clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
        run: |
          set -Eeuo pipefail
          bash "${GITHUB_WORKSPACE}/eng/scripts/release_orchestrate_guard_non_clobber.sh"

      - name: Guard disabled
        if: ${{ !inputs.enforce_non_clobber }}
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -Eeuo pipefail
          echo "Non-clobber guard is disabled for this channel."
          echo "### Guard: Non-clobber :white_check_mark: disabled" >> "${GITHUB_STEP_SUMMARY}"
          echo "Non-clobber enforcement is not enabled for channel \`${CHANNEL}\`." >> "${GITHUB_STEP_SUMMARY}"

  # SYNC[routing-jobs]: Step-6 routing jobs that consume release notes MUST add
  # prepare-release-notes to their own needs: directly; it is intentionally absent
  # from resolve-hub-context/needs: (see the resolve-hub-context comment above).
  prepare-release-notes:
    name: Prepare release notes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: resolve
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.target }}

      - name: Write release notes
        shell: bash
        env:
          HAS_CHANGELOG: ${{ needs.resolve.outputs.has_changelog }}
          CHANGELOG_PATH: ${{ needs.resolve.outputs.changelog }}
          TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.resolve.outputs.version }}
          RUN_URL: ${{ needs.resolve.outputs.run_url }}
        run: |
          set -Eeuo pipefail
          notes_dir="${RUNNER_TEMP}/release-notes"
          mkdir -p "${notes_dir}"

          {
            echo "# ${PROJECT} ${VERSION}"
            echo
            echo "Tag: \`${TAG_NAME}\`"
            echo
            if [[ "${HAS_CHANGELOG}" == "true" && -n "${CHANGELOG_PATH}" && -f "${CHANGELOG_PATH}" ]]; then
              echo "## Changelog"
              echo
              cat "${CHANGELOG_PATH}"
            else
              echo "No changelog file was resolved for this release."
            fi
            echo
            echo "[Workflow run](${RUN_URL})"
          } > "${notes_dir}/release-notes.md"

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-release-notes
          path: ${{ runner.temp }}/release-notes/release-notes.md
          if-no-files-found: error
          retention-days: 30

  prepare-release-plan:
    name: Prepare release plan artifacts
    needs:
      - resolve
      - resolve-hub-context
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      plan_artifact_name: ${{ steps.outputs.outputs.plan_artifact_name }}
      execution_sets_artifact_name: ${{ steps.outputs.outputs.execution_sets_artifact_name }}
      entry_publish_handoff_artifact_name: ${{ steps.outputs.outputs.entry_publish_handoff_artifact_name }}
      tag_result_artifact_name: ${{ steps.outputs.outputs.tag_result_artifact_name }}
      skip_publish_node_ids: ${{ steps.outputs.outputs.skip_publish_node_ids }}
      has_active_variants: ${{ steps.outputs.outputs.has_variants }}
      has_skip_results: ${{ steps.outputs.outputs.has_skip_results }}
      has_live_side_effects: ${{ steps.outputs.outputs.has_live_side_effects }}
      has_selected_github_release: ${{ steps.outputs.outputs.has_selected_github_release }}
      has_active_github_release: ${{ steps.outputs.outputs.has_active_github_release }}
      active_github_release_node_ids: ${{ steps.outputs.outputs.active_github_release_node_ids }}
      active_github_release_publish_mode: ${{ steps.outputs.outputs.active_github_release_publish_mode }}
      active_github_release_asset_labels_json: ${{ steps.outputs.outputs.active_github_release_asset_labels_json }}
      active_github_release_asset_names_json: ${{ steps.outputs.outputs.active_github_release_asset_names_json }}
      active_github_release_overwrite_mutable_authorized: ${{ steps.outputs.outputs.active_github_release_overwrite_mutable_authorized }}
      has_selected_python_pypi: ${{ steps.outputs.outputs.has_selected_python_pypi }}
      has_active_python_pypi: ${{ steps.outputs.outputs.has_active_python_pypi }}
      expected_python_distribution_filenames_json: ${{ steps.outputs.outputs.expected_python_distribution_filenames_json }}
      expected_python_distribution_sha256_by_filename_json: ${{ steps.outputs.outputs.expected_python_distribution_sha256_by_filename_json }}
      has_selected_node_gpr: ${{ steps.outputs.outputs.has_selected_node_gpr }}
      has_active_node_gpr: ${{ steps.outputs.outputs.has_active_node_gpr }}
      has_selected_node_npmjs: ${{ steps.outputs.outputs.has_selected_node_npmjs }}
      has_active_node_npmjs: ${{ steps.outputs.outputs.has_active_node_npmjs }}
      expected_node_gpr_package_name: ${{ steps.outputs.outputs.expected_node_gpr_package_name }}
      expected_node_gpr_package_version: ${{ steps.outputs.outputs.expected_node_gpr_package_version }}
      expected_node_gpr_tarball_sha256: ${{ steps.outputs.outputs.expected_node_gpr_tarball_sha256 }}
      expected_node_gpr_tarball_sha512: ${{ steps.outputs.outputs.expected_node_gpr_tarball_sha512 }}
      expected_node_npmjs_package_name: ${{ steps.outputs.outputs.expected_node_npmjs_package_name }}
      expected_node_npmjs_package_version: ${{ steps.outputs.outputs.expected_node_npmjs_package_version }}
      expected_node_npmjs_tarball_sha256: ${{ steps.outputs.outputs.expected_node_npmjs_tarball_sha256 }}
      expected_node_npmjs_tarball_sha512: ${{ steps.outputs.outputs.expected_node_npmjs_tarball_sha512 }}
      expected_node_github_release_asset_name: ${{ steps.outputs.outputs.expected_node_github_release_asset_name }}
      expected_node_github_release_package_name: ${{ steps.outputs.outputs.expected_node_github_release_package_name }}
      expected_node_github_release_asset_sha256: ${{ steps.outputs.outputs.expected_node_github_release_asset_sha256 }}
      has_selected_ruby_gpr: ${{ steps.outputs.outputs.has_selected_ruby_gpr }}
      has_active_ruby_gpr: ${{ steps.outputs.outputs.has_active_ruby_gpr }}
      has_selected_ruby_rubygems: ${{ steps.outputs.outputs.has_selected_ruby_rubygems }}
      has_active_ruby_rubygems: ${{ steps.outputs.outputs.has_active_ruby_rubygems }}
      expected_ruby_package_name: ${{ steps.outputs.outputs.expected_ruby_package_name }}
      expected_ruby_package_version: ${{ steps.outputs.outputs.expected_ruby_package_version }}
      expected_ruby_gem_filename: ${{ steps.outputs.outputs.expected_ruby_gem_filename }}
      expected_ruby_gem_sha256: ${{ steps.outputs.outputs.expected_ruby_gem_sha256 }}
    steps:
      - name: Checkout (trusted planner scripts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout release target data
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.target }}
          path: .three-workflow-release/target

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: .three-workflow-release/target/global.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.9'

      - name: Setup pnpm
        if: needs.resolve.outputs.project_kind == 'node'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        if: needs.resolve.outputs.project_kind == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: .three-workflow-release/target/pnpm-lock.yaml

      - name: Setup Ruby (Bundler)
        if: needs.resolve.outputs.project_kind == 'ruby' && hashFiles(format('.three-workflow-release/target/{0}/Gemfile', needs.resolve.outputs.package_dir)) != ''
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ needs.resolve.outputs.ruby_version }}
          bundler-cache: true
          working-directory: .three-workflow-release/target/${{ needs.resolve.outputs.package_dir }}

      - name: Setup Ruby
        if: needs.resolve.outputs.project_kind == 'ruby' && hashFiles(format('.three-workflow-release/target/{0}/Gemfile', needs.resolve.outputs.package_dir)) == ''
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ needs.resolve.outputs.ruby_version }}

      - name: Install trusted NBGV CLI for metadata
        shell: bash
        env:
          NBGV_VERSION: ${{ env.NBGV_VERSION }}
        run: |
          set -Eeuo pipefail
          trusted_tools="${RUNNER_TEMP}/trusted-dotnet-tools"
          trusted_config="${RUNNER_TEMP}/trusted-nuget.config"
          dotnet_home="${RUNNER_TEMP}/dotnet-cli-home"
          mkdir -p "${trusted_tools}" "${dotnet_home}"
          cat > "${trusted_config}" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          XML
          DOTNET_CLI_HOME="${dotnet_home}" \
          NUGET_PACKAGES="${RUNNER_TEMP}/trusted-nuget-packages" \
            dotnet tool install nbgv \
              --tool-path "${trusted_tools}" \
              --version "${NBGV_VERSION}" \
              --configfile "${trusted_config}"
          echo "THREE_WORKFLOW_RELEASE_NBGV_PATH=${trusted_tools}/nbgv" >> "${GITHUB_ENV}"
          echo "NBGV_PYTHON_COMMAND=${trusted_tools}/nbgv" >> "${GITHUB_ENV}"

      - name: Write planner request
        shell: bash
        env:
          COMMIT_SHA: ${{ needs.resolve.outputs.target }}
          FORCE_UPDATE_TAG: ${{ needs.resolve.outputs.force_update_tag }}
          PROFILE: ${{ needs.resolve-hub-context.outputs.planner_profile }}
          REQUESTED_PROJECT_IDS_JSON: ${{ format('["{0}"]', needs.resolve.outputs.project) }}
        run: |
          set -Eeuo pipefail
          mkdir -p .three-workflow-release/plan
          uv run python eng/scripts/workflow_release_control.py write-planner-request \
            --profile "$PROFILE" \
            --commit-sha "$COMMIT_SHA" \
            --requested-project-ids-json "$REQUESTED_PROJECT_IDS_JSON" \
            --force "$FORCE_UPDATE_TAG" \
            --out .three-workflow-release/plan/planner-request.json

      - name: Materialize official frozen versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ needs.resolve.outputs.project }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          uv run python eng/scripts/workflow_release_control.py official-frozen-versions \
            --repository "$REPOSITORY" \
            --project "$PROJECT" \
            --out .three-workflow-release/plan/official-frozen-versions.json \
            --diagnostics-out .three-workflow-release/plan/planner-diagnostics.json

      - name: Materialize .NET planner metadata input
        if: needs.resolve.outputs.project_kind == 'dotnet'
        shell: bash
        env:
          COMMIT_SHA: ${{ needs.resolve.outputs.target }}
        run: |
          set -Eeuo pipefail
          uv run python eng/scripts/workflow_release_control.py dotnet-metadata-input \
            --repo-root .three-workflow-release/target \
            --commit-sha "$COMMIT_SHA" \
            --out .three-workflow-release/plan/dotnet-planner-metadata-input.json

      - name: Collect .NET planner metadata
        if: needs.resolve.outputs.project_kind == 'dotnet'
        shell: bash
        run: |
          set -Eeuo pipefail
          uv run three-workflow-release-metadata dotnet \
            --repo-root .three-workflow-release/target \
            --input .three-workflow-release/plan/dotnet-planner-metadata-input.json \
            --output .three-workflow-release/plan/dotnet-planner-metadata.json \
            --diagnostics-out .three-workflow-release/plan/planner-diagnostics.json

      - name: Bootstrap release plan
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          ENABLE_ATTESTATION: ${{ inputs.enable_attestation }}
        run: |
          set -Eeuo pipefail
          dotnet_metadata_args=()
          if [[ -f .three-workflow-release/plan/dotnet-planner-metadata.json ]]; then
            dotnet_metadata_args=(--dotnet-metadata .three-workflow-release/plan/dotnet-planner-metadata.json)
          fi
          buddy_github_release_args=()
          if [[ "${CHANNEL}" == "buddy" && "${ENABLE_ATTESTATION}" != "true" ]]; then
            buddy_github_release_args=(--deactivate-buddy-github-release)
          fi
          uv run three-workflow-release-planner plan \
            --repo-root .three-workflow-release/target \
            --request .three-workflow-release/plan/planner-request.json \
            --official-frozen-versions .three-workflow-release/plan/official-frozen-versions.json \
            "${dotnet_metadata_args[@]}" \
            "${buddy_github_release_args[@]}" \
            --plan-out .three-workflow-release/plan/bootstrap-plan.json \
            --execution-sets-out .three-workflow-release/plan/bootstrap-execution-sets.json \
            --dry-run

      - name: Observe remote publications
        shell: bash
        env:
          CANARY_OVERRIDE_NON_PUBLIC_REF: 'false'
          ENABLED_EXTERNAL_OIDC_TARGETS: ${{ vars.THREE_RELEASE_ENABLED_EXTERNAL_OIDC_TARGETS }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH_PYTHON_PYPI: ${{ inputs.publish_python_pypi }}
          PUBLISH_NODE_GPR: ${{ inputs.publish_node_gpr }}
          PUBLISH_NODE_NPMJS: ${{ inputs.publish_node_npmjs }}
          PUBLISH_RUBY_GPR: ${{ inputs.publish_ruby_gpr }}
          PUBLISH_RUBY_RUBYGEMS: ${{ inputs.publish_ruby_rubygems }}
          REPOSITORY: ${{ github.repository }}
          TARGET_ENVIRONMENT: ${{ needs.resolve-hub-context.outputs.target_environment }}
        run: |
          set -Eeuo pipefail
          disabled_package_target_keys=()
          [[ "${PUBLISH_PYTHON_PYPI}" == "true" ]] || disabled_package_target_keys+=("python-pypi")
          [[ "${PUBLISH_NODE_GPR}" == "true" ]] || disabled_package_target_keys+=("node-gpr")
          [[ "${PUBLISH_NODE_NPMJS}" == "true" ]] || disabled_package_target_keys+=("node-npmjs")
          [[ "${PUBLISH_RUBY_GPR}" == "true" ]] || disabled_package_target_keys+=("ruby-gpr")
          [[ "${PUBLISH_RUBY_RUBYGEMS}" == "true" ]] || disabled_package_target_keys+=("ruby-rubygems")
          disabled_package_target_keys_csv="$(IFS=,; printf '%s' "${disabled_package_target_keys[*]}")"
          uv run python eng/scripts/workflow_release_control.py observe-remote-publications \
            --plan .three-workflow-release/plan/bootstrap-plan.json \
            --execution-sets .three-workflow-release/plan/bootstrap-execution-sets.json \
            --enabled-external-oidc-targets "$ENABLED_EXTERNAL_OIDC_TARGETS" \
            --disabled-package-target-keys "$disabled_package_target_keys_csv" \
            --canary-override-non-public-ref "$CANARY_OVERRIDE_NON_PUBLIC_REF" \
            --release-environment "$TARGET_ENVIRONMENT" \
            --repository "$REPOSITORY" \
            --out .three-workflow-release/plan/remote-observations.json \
            --diagnostics-out .three-workflow-release/plan/planner-diagnostics.json

      - name: Finalize release plan
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          ENABLE_ATTESTATION: ${{ inputs.enable_attestation }}
        run: |
          set -Eeuo pipefail
          dotnet_metadata_args=()
          if [[ -f .three-workflow-release/plan/dotnet-planner-metadata.json ]]; then
            dotnet_metadata_args=(--dotnet-metadata .three-workflow-release/plan/dotnet-planner-metadata.json)
          fi
          buddy_github_release_args=()
          if [[ "${CHANNEL}" == "buddy" && "${ENABLE_ATTESTATION}" != "true" ]]; then
            buddy_github_release_args=(--deactivate-buddy-github-release)
          fi
          uv run three-workflow-release-planner plan \
            --repo-root .three-workflow-release/target \
            --request .three-workflow-release/plan/planner-request.json \
            --remote-observations .three-workflow-release/plan/remote-observations.json \
            --official-frozen-versions .three-workflow-release/plan/official-frozen-versions.json \
            "${dotnet_metadata_args[@]}" \
            "${buddy_github_release_args[@]}" \
            --plan-out .three-workflow-release/plan/release-plan.json \
            --execution-sets-out .three-workflow-release/plan/execution-sets.json

      - name: Validate external OIDC plan gate
        shell: bash
        env:
          ENABLED_EXTERNAL_OIDC_TARGETS: ${{ vars.THREE_RELEASE_ENABLED_EXTERNAL_OIDC_TARGETS }}
          PUBLISH_PYTHON_PYPI: ${{ inputs.publish_python_pypi }}
          PUBLISH_NODE_GPR: ${{ inputs.publish_node_gpr }}
          PUBLISH_NODE_NPMJS: ${{ inputs.publish_node_npmjs }}
          PUBLISH_RUBY_GPR: ${{ inputs.publish_ruby_gpr }}
          PUBLISH_RUBY_RUBYGEMS: ${{ inputs.publish_ruby_rubygems }}
        run: |
          set -Eeuo pipefail
          disabled_package_target_keys=()
          [[ "${PUBLISH_PYTHON_PYPI}" == "true" ]] || disabled_package_target_keys+=("python-pypi")
          [[ "${PUBLISH_NODE_GPR}" == "true" ]] || disabled_package_target_keys+=("node-gpr")
          [[ "${PUBLISH_NODE_NPMJS}" == "true" ]] || disabled_package_target_keys+=("node-npmjs")
          [[ "${PUBLISH_RUBY_GPR}" == "true" ]] || disabled_package_target_keys+=("ruby-gpr")
          [[ "${PUBLISH_RUBY_RUBYGEMS}" == "true" ]] || disabled_package_target_keys+=("ruby-rubygems")
          disabled_package_target_keys_csv="$(IFS=,; printf '%s' "${disabled_package_target_keys[*]}")"
          uv run python eng/scripts/workflow_release_control.py plan-gate \
            --plan .three-workflow-release/plan/release-plan.json \
            --execution-sets .three-workflow-release/plan/execution-sets.json \
            --remote-observations .three-workflow-release/plan/remote-observations.json \
            --enabled-external-oidc-targets "$ENABLED_EXTERNAL_OIDC_TARGETS" \
            --disabled-package-target-keys "$disabled_package_target_keys_csv" \
            --diagnostics-out .three-workflow-release/plan/planner-diagnostics.json

      - name: Upload planner diagnostics
        if: failure() && hashFiles('.three-workflow-release/plan/planner-diagnostics.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-planner-diagnostics-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: .three-workflow-release/plan/planner-diagnostics.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Compute release plan outputs
        id: outputs
        shell: bash
        env:
          PUBLISH_PYTHON_PYPI: ${{ inputs.publish_python_pypi }}
          PUBLISH_NODE_GPR: ${{ inputs.publish_node_gpr }}
          PUBLISH_NODE_NPMJS: ${{ inputs.publish_node_npmjs }}
          PUBLISH_RUBY_GPR: ${{ inputs.publish_ruby_gpr }}
          PUBLISH_RUBY_RUBYGEMS: ${{ inputs.publish_ruby_rubygems }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          disabled_package_target_keys=()
          [[ "${PUBLISH_PYTHON_PYPI}" == "true" ]] || disabled_package_target_keys+=("python-pypi")
          [[ "${PUBLISH_NODE_GPR}" == "true" ]] || disabled_package_target_keys+=("node-gpr")
          [[ "${PUBLISH_NODE_NPMJS}" == "true" ]] || disabled_package_target_keys+=("node-npmjs")
          [[ "${PUBLISH_RUBY_GPR}" == "true" ]] || disabled_package_target_keys+=("ruby-gpr")
          [[ "${PUBLISH_RUBY_RUBYGEMS}" == "true" ]] || disabled_package_target_keys+=("ruby-rubygems")
          disabled_package_target_keys_csv="$(IFS=,; printf '%s' "${disabled_package_target_keys[*]}")"
          uv run python eng/scripts/workflow_release_control.py matrix-outputs \
            --plan .three-workflow-release/plan/release-plan.json \
            --execution-sets .three-workflow-release/plan/execution-sets.json \
            --disabled-package-target-keys "$disabled_package_target_keys_csv" \
            --run-id "$RUN_ID" \
            --attempt "$RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate plan-derived workflow gates
        shell: bash
        env:
          PROJECT_KIND: ${{ needs.resolve.outputs.project_kind }}
          IS_WXT: ${{ needs.resolve.outputs.is_wxt }}
          PUBLISH_PYTHON_PYPI: ${{ inputs.publish_python_pypi }}
          PUBLISH_NODE_GPR: ${{ inputs.publish_node_gpr }}
          PUBLISH_NODE_NPMJS: ${{ inputs.publish_node_npmjs }}
          PUBLISH_RUBY_GPR: ${{ inputs.publish_ruby_gpr }}
          PUBLISH_RUBY_RUBYGEMS: ${{ inputs.publish_ruby_rubygems }}
          HAS_SELECTED_PYTHON_PYPI: ${{ steps.outputs.outputs.has_selected_python_pypi }}
          HAS_SELECTED_NODE_GPR: ${{ steps.outputs.outputs.has_selected_node_gpr }}
          HAS_SELECTED_NODE_NPMJS: ${{ steps.outputs.outputs.has_selected_node_npmjs }}
          HAS_SELECTED_RUBY_GPR: ${{ steps.outputs.outputs.has_selected_ruby_gpr }}
          HAS_SELECTED_RUBY_RUBYGEMS: ${{ steps.outputs.outputs.has_selected_ruby_rubygems }}
        run: |
          set -Eeuo pipefail

          case "${PROJECT_KIND}:${IS_WXT:-false}" in
            python:*)
              if [[ "${PUBLISH_PYTHON_PYPI}" == "true" ]]; then
                echo "Python PyPI target selection is descriptor-controlled; finalized plan outputs gate the PyPI job independently."
              fi
              ;;
            node:true)
              echo "WXT release plan is authoritative for browser-extension artifacts; npm package flags do not route WXT publish jobs."
              ;;
            node:*)
              if [[ "${PUBLISH_NODE_GPR}" == "true" || "${PUBLISH_NODE_NPMJS}" == "true" ]]; then
                echo "Node registry target selection is descriptor-controlled; finalized plan outputs gate each npm/GPR job independently."
              fi
              ;;
            ruby:*)
              if [[ "${PUBLISH_RUBY_GPR}" == "true" || "${PUBLISH_RUBY_RUBYGEMS}" == "true" ]]; then
                echo "Ruby registry target selection is descriptor-controlled; finalized plan outputs gate each GPR/RubyGems job independently."
              fi
              ;;
            dotnet:*)
              echo ".NET release plan is authoritative for GitHub Release artifacts; NuGet registry publication remains deferred."
              ;;
            *)
              echo "::error::Unsupported release project kind for plan-derived workflow gates: PROJECT_KIND=${PROJECT_KIND}, IS_WXT=${IS_WXT:-}" >&2
              exit 1
              ;;
          esac

      - name: Fail unsupported buddy GitHub Release proof mode
        if: ${{ inputs.channel == 'buddy' && !inputs.enable_attestation && steps.outputs.outputs.has_active_github_release == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "buddy GitHub Release publishing is unsupported while enable_attestation=false; GitHub Release asset proof generation requires verified GitHub attestations. Refusing before release mutation." >&2
          exit 1

      - name: Prepare entry publish handoff
        shell: bash
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          uv run python eng/scripts/workflow_release_control.py entry-publish-handoff \
            --plan .three-workflow-release/plan/release-plan.json \
            --execution-sets .three-workflow-release/plan/execution-sets.json \
            --run-id "$RUN_ID" \
            --attempt "$RUN_ATTEMPT" \
            --out .three-workflow-release/plan/entry-publish-handoff.json

      - name: Upload release plan
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.outputs.outputs.plan_artifact_name }}
          path: .three-workflow-release/plan/release-plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload execution sets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.outputs.outputs.execution_sets_artifact_name }}
          path: .three-workflow-release/plan/execution-sets.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload entry publish handoff
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.outputs.outputs.entry_publish_handoff_artifact_name }}
          path: .three-workflow-release/plan/entry-publish-handoff.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  ensure-tag:
    name: Ensure GitHub Release tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - reject-buddy-reruns
      - resolve
      - resolve-hub-context
      - prepare-release-plan
      - guard-prerelease-only
      - guard-non-clobber
      - build-python
      - build-wxt
      - pack-node
      - build-dotnet
      - build-ruby
    # Wait for the selected build lane to finish before any tag creation or retargeting.
    if: >-
      ${{ always()
          && !(inputs.channel == 'buddy' && github.run_attempt != 1)
          && needs.reject-buddy-reruns.result == 'success'
          && needs.resolve.result == 'success'
          && needs.prepare-release-plan.result == 'success'
          && needs.prepare-release-plan.outputs.has_active_github_release == 'true'
          && needs.guard-prerelease-only.result == 'success'
          && needs.guard-non-clobber.result == 'success'
          && (
            needs.prepare-release-plan.outputs.has_active_variants != 'true'
            || (needs.resolve.outputs.project_kind == 'python' && needs.build-python.result == 'success')
            || (needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt == 'true' && needs.build-wxt.result == 'success')
            || (needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true' && needs.pack-node.result == 'success')
            || (needs.resolve.outputs.project_kind == 'dotnet' && needs.build-dotnet.result == 'success')
            || (needs.resolve.outputs.project_kind == 'ruby' && needs.build-ruby.result == 'success')
          ) }}
    environment: github-release
    concurrency:
      group: github-release/${{ github.repository }}/${{ needs.resolve.outputs.tag_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Fail buddy rerun attempts
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ "${CHANNEL}" == "buddy" && "${RUN_ATTEMPT}" != "1" ]]; then
            echo "buddy release side-effect jobs are single-attempt only; rerun attempts must fail closed before mutation." >&2
            exit 1
          fi

      - name: Checkout (tag scripts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.9'

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: .three-workflow-release/artifacts

      - name: Ensure release tags
        shell: bash
        env:
          TAG_RETARGET_FORCE: ${{ inputs.channel == 'official' && needs.resolve.outputs.force_update_tag == 'true' }}
          EXPECTED_COMMIT_SHA: ${{ needs.resolve.outputs.target }}
          EXPECTED_PROJECT_ID: ${{ needs.resolve.outputs.project }}
          EXPECTED_RELEASE_TAG: ${{ needs.resolve.outputs.tag_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
          TAG_RESULT_JSON: ${{ runner.temp }}/tag-result.json
        run: |
          set -Eeuo pipefail

          resolve_artifact_dir() {
            local pattern="$1"
            local -a matches=()
            mapfile -t matches < <(
              find "${GITHUB_WORKSPACE}/.three-workflow-release/artifacts" \
                -mindepth 1 -maxdepth 1 -type d \
                -name "${pattern}" -print
            )
            case "${#matches[@]}" in
              0)
                echo ""
                ;;
              1)
                printf '%s\n' "${matches[0]}"
                ;;
              *)
                echo "Expected exactly one artifact directory for pattern '${pattern}', found ${#matches[@]}." >&2
                exit 1
                ;;
            esac
          }

          plan_artifact_dir="$(resolve_artifact_dir "release-plan-v1-${RUN_ID}-${RUN_ATTEMPT}-*")"
          execution_sets_artifact_dir="$(resolve_artifact_dir "release-execution-sets-v1-${RUN_ID}-${RUN_ATTEMPT}-*")"
          if [[ -z "${plan_artifact_dir}" || -z "${execution_sets_artifact_dir}" ]]; then
            echo "Required release plan artifacts were not found." >&2
            exit 1
          fi

          plan_path="${plan_artifact_dir}/release-plan.json"
          execution_sets_path="${execution_sets_artifact_dir}/execution-sets.json"

          uv run python eng/scripts/workflow_release_control.py ensure-tags \
            --plan "${plan_path}" \
            --execution-sets "${execution_sets_path}" \
            --repository "${REPOSITORY}" \
            --force-update-tag "${TAG_RETARGET_FORCE}" \
            --expected-project-id "${EXPECTED_PROJECT_ID}" \
            --expected-commit-sha "${EXPECTED_COMMIT_SHA}" \
            --expected-release-tag "${EXPECTED_RELEASE_TAG}" \
            --out "${TAG_RESULT_JSON}"

          plan_id="$(
            uv run python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["plan-id"])' \
              "${TAG_RESULT_JSON}"
          )"
          tag_artifact_name="$(
            uv run python -c 'from three_workflow_release_contracts import ArtifactNameInputs, artifact_name; import sys; print(artifact_name("tag-result", ArtifactNameInputs(int(sys.argv[1]), int(sys.argv[2]), plan_id=sys.argv[3])))' \
              "${RUN_ID}" \
              "${RUN_ATTEMPT}" \
              "${plan_id}"
          )"
          {
            echo "TAG_RESULT_JSON=${TAG_RESULT_JSON}"
            echo "TAG_ARTIFACT_NAME=${tag_artifact_name}"
          } >> "${GITHUB_ENV}"

      - name: Upload tag result
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TAG_ARTIFACT_NAME }}
          path: ${{ env.TAG_RESULT_JSON }}
          if-no-files-found: error
          retention-days: 30

  verify-ensure-tag-buddy-rerun-rejection:
    name: Verify GitHub Release tag buddy rerun rejection
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - reject-buddy-reruns
      - ensure-tag
    if: ${{ always() && inputs.channel == 'buddy' && github.run_attempt != 1 }}
    permissions: {}
    steps:
      - name: Fail buddy rerun attempts
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "buddy release tag side-effect jobs are single-attempt only; rerun attempts must fail closed before protected environments." >&2
          exit 1

  skip-results:
    name: Materialize skip-satisfied publish receipts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - prepare-release-plan
    if: needs.prepare-release-plan.outputs.has_skip_results == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        publish-node-id: ${{ fromJson(needs.prepare-release-plan.outputs.skip_publish_node_ids) }}
    steps:
      - name: Checkout (skip receipt scripts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.9'

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-release-plan.outputs.plan_artifact_name }}
          path: .three-workflow-release/plan

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-release-plan.outputs.execution_sets_artifact_name }}
          path: .three-workflow-release/execution-sets

      - name: Materialize skip receipt
        id: skip
        shell: bash
        env:
          PUBLISH_NODE_ID: ${{ matrix.publish-node-id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          uv run python eng/scripts/workflow_release_control.py skip-results \
            --plan .three-workflow-release/plan/release-plan.json \
            --execution-sets .three-workflow-release/execution-sets/execution-sets.json \
            --publish-node-id "$PUBLISH_NODE_ID" \
            --run-id "$RUN_ID" \
            --attempt "$RUN_ATTEMPT" \
            --out-dir .three-workflow-release/skip-results \
            --manifest-out .three-workflow-release/skip-results/manifest.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload skip receipt
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.skip.outputs.skip_result_artifact_name }}
          path: .three-workflow-release/skip-results/${{ steps.skip.outputs.skip_result_artifact_name }}/skip-result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # SECTION: .NET Release Pipeline
  # ===========================================================================
  build-dotnet:
    name: Build .NET release artifacts
    needs:
      - resolve
      - resolve-hub-context
      - prepare-release-plan
      - policy-publish-targets
      - guard-prerelease-only
      - guard-non-clobber
    if: needs.resolve.outputs.project_kind == 'dotnet' && needs.prepare-release-plan.outputs.has_active_variants == 'true'
    uses: ./.github/workflows/release-build-dotnet.yml
    secrets: {}
    permissions:
      contents: read
      actions: read
    with:
      target: ${{ needs.resolve.outputs.target }}
      plan_artifact_name: ${{ needs.prepare-release-plan.outputs.plan_artifact_name }}
      execution_sets_artifact_name: ${{ needs.prepare-release-plan.outputs.execution_sets_artifact_name }}
      artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  attest-dotnet-enabled:
    name: Attest release assets (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve
      - prepare-release-plan
      - build-dotnet
    if: needs.resolve.outputs.project_kind == 'dotnet' && needs.prepare-release-plan.outputs.has_active_variants == 'true' && inputs.enable_attestation
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Fail buddy rerun attempts
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ "${CHANNEL}" == "buddy" && "${RUN_ATTEMPT}" != "1" ]]; then
            echo "buddy release side-effect jobs are single-attempt only; rerun attempts must fail closed before mutation." >&2
            exit 1
          fi

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Attest build provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/out/*

  attest-dotnet:
    name: Attestation gate (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve
      - prepare-release-plan
      - build-dotnet
      - attest-dotnet-enabled
    if: ${{ always() && needs.resolve.outputs.project_kind == 'dotnet' && needs.prepare-release-plan.outputs.has_active_variants == 'true' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify attestation outcome
        if: inputs.enable_attestation
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build-dotnet.result }}
          RESULT: ${{ needs.attest-dotnet-enabled.result }}
        run: |
          set -Eeuo pipefail
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            echo "Skipping attestation gate: build-dotnet did not succeed (result=${BUILD_RESULT})."
            echo "### Attestation: :white_circle: skipped (build did not succeed)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [[ "${RESULT}" != "success" ]]; then
            echo "Attestation job did not succeed (result=${RESULT})." >&2
            exit 1
          fi
          echo "### Attestation: :white_check_mark: passed" >> "${GITHUB_STEP_SUMMARY}"

      - name: Attestation disabled
        if: ${{ !inputs.enable_attestation }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Attestation is disabled for this channel."
          echo "### Attestation: :no_entry_sign: disabled" >> "${GITHUB_STEP_SUMMARY}"

  release-dotnet:
    name: Create GitHub release (.NET)
    needs:
      - resolve
      - resolve-hub-context
      - prepare-release-plan
      - prepare-release-notes
      - build-dotnet
      - attest-dotnet
      - ensure-tag
    if: needs.resolve.outputs.project_kind == 'dotnet' && needs.prepare-release-plan.outputs.has_active_github_release == 'true'
    permissions:
      contents: write
      actions: read
      attestations: read
    uses: ./.github/workflows/release-create-github-release.yml
    secrets: {}
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target: ${{ needs.resolve.outputs.target }}
      release_title: ${{ needs.resolve.outputs.release_title }}
      prerelease: ${{ inputs.github_release_prerelease }}
      publish_mode: ${{ needs.prepare-release-plan.outputs.active_github_release_publish_mode }}
      asset_labels_json: ${{ needs.prepare-release-plan.outputs.active_github_release_asset_labels_json }}
      asset_names_json: ${{ needs.prepare-release-plan.outputs.active_github_release_asset_names_json }}
      plan_artifact_name: ${{ needs.prepare-release-plan.outputs.plan_artifact_name }}
      execution_sets_artifact_name: ${{ needs.prepare-release-plan.outputs.execution_sets_artifact_name }}
      active_github_release_node_ids_json: ${{ needs.prepare-release-plan.outputs.active_github_release_node_ids }}
      force_update_tag: ${{ inputs.channel == 'official' && needs.resolve.outputs.force_update_tag == 'true' }}
      channel: ${{ inputs.channel }}
      planner_profile: ${{ needs.resolve-hub-context.outputs.planner_profile }}
      attestation_source_sha: ${{ github.sha }}
      enable_attestation: ${{ inputs.enable_attestation }}
      notes_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-release-notes
      dist_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  # ===========================================================================
  # SECTION: Python Release Pipeline
  # ===========================================================================
  build-python:
    name: Build Python package
    needs:
      - resolve
      - resolve-hub-context
      - prepare-release-plan
      - policy-publish-targets
      - guard-prerelease-only
      - guard-non-clobber
    if: needs.resolve.outputs.project_kind == 'python' && needs.prepare-release-plan.outputs.has_active_variants == 'true'
    uses: ./.github/workflows/release-build-python.yml
    secrets: {}
    permissions:
      contents: read
    with:
      target: ${{ needs.resolve.outputs.target }}
      package_dir: ${{ needs.resolve.outputs.package_dir }}
      version: ${{ needs.resolve.outputs.version }}
      # Hardcoded: uses: with: does not support env context; keep in sync with env.PYTHON_VERSION
      python_version: '3.14'
      artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
      expected_distribution_filenames_json: ${{ needs.prepare-release-plan.outputs.expected_python_distribution_filenames_json }}

  # NOTE: publish-python does not use the *-enabled / * gate pair pattern (unlike Node/Ruby GPR
  # publishing). Python has only one target registry (PyPI) and no conditionally-dependent
  # downstream job must branch on the same effective enablement so GitHub Release creation does
  # not wait on a skipped PyPI publish when publish_python_pypi=false. The environment approval
  # gate (environment: pypi) serves as the explicit human checkpoint. This job uses always()
  # because ensure-tag is skipped for registry-only plans with no GitHub Release node. Keep the
  # explicit build, attestation, and conditional tag checks below so skipped or failed
  # prerequisites cannot prompt package publication. See the ATTESTATION GATE PATTERN comment
  # below for the gate pattern used by attest-* jobs.
  publish-python:
    name: Publish Python package (PyPI)
    runs-on: ubuntu-latest
    timeout-minutes: 1440 # environment approval gate: allow up to 24h for reviewer action
    needs:
      - resolve
      - prepare-release-plan
      - build-python
      - attest-python
      - ensure-tag
    if: ${{ always() && needs.resolve.outputs.project_kind == 'python' && inputs.publish_python_pypi && needs.prepare-release-plan.outputs.has_active_python_pypi == 'true' && needs.build-python.result == 'success' && needs.attest-python.result == 'success' && (needs.prepare-release-plan.outputs.has_active_github_release != 'true' || needs.ensure-tag.result == 'success') }}
    # SECURITY: This environment MUST have required reviewers configured in repository settings.
    # Without reviewers, any workflow in this repository calling with channel: official can publish to PyPI via OIDC.
    # SECURITY: The Trusted Publisher registration on PyPI MUST set the optional Environment field to 'pypi'.
    # This adds a second OIDC claim check (job_workflow_environment) so the token is only accepted when the job
    # runs inside this specific environment, providing defense-in-depth independent of reviewer configuration.
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Fail buddy rerun attempts
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ "${CHANNEL}" == "buddy" && "${RUN_ATTEMPT}" != "1" ]]; then
            echo "buddy release side-effect jobs are single-attempt only; rerun attempts must fail closed before mutation." >&2
            exit 1
          fi

      - name: Note about PyPI Trusted Publishers (OIDC)
        shell: bash
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
        run: |
          set -Eeuo pipefail
          echo "This workflow is intended to publish '${PROJECT}' to PyPI using PyPI Trusted Publishing (OIDC)."
          echo "No PyPI token is provided by this workflow; publishing will fail unless a Trusted Publisher is configured on PyPI for:"
          echo "  - Repository: ${GITHUB_REPOSITORY}"
          echo "  - Workflow: .github/workflows/release-orchestrate.yml"
          echo "    (This is the reusable workflow file containing this job."
          echo "     PyPI Trusted Publishing validates the OIDC job_workflow_ref claim, which always"
          echo "     points to the reusable workflow file — not the caller workflow (e.g. official.yml).)"
          echo "  - Environment (if configured on PyPI): pypi"
          echo "A single Trusted Publisher entry for this reusable workflow covers all callers."
          echo "Each caller workflow does NOT need a separate Trusted Publisher registration."
          echo "See: https://docs.pypi.org/trusted-publishers/"

      - name: Install jq
        uses: dcarbone/install-jq-action@4fcb5062d7ce9bc4382d1a352d19ba3ba2c317c1 # v4.0.1
        with:
          version: '1.7.1'

      - name: Checkout (trusted workflow scripts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.9'

      - name: Download release plan artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-release-plan.outputs.plan_artifact_name }}
          path: .three-workflow-release/plan

      - name: Download execution sets artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-release-plan.outputs.execution_sets_artifact_name }}
          path: .three-workflow-release/execution-sets

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Validate PyPI remote digests (idempotency)
        shell: bash
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -Eeuo pipefail

          bash "${GITHUB_WORKSPACE}/eng/scripts/validate_pypi_remote_digests.sh"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ github.workspace }}/out/
          skip-existing: true

      - name: Materialize PyPI publish receipt
        id: publish_result
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ needs.resolve.outputs.target }}
        run: |
          set -Eeuo pipefail
          uv run python eng/scripts/workflow_release_control.py package-publish-result \
            --plan .three-workflow-release/plan/release-plan.json \
            --execution-sets .three-workflow-release/execution-sets/execution-sets.json \
            --target-key python-pypi \
            --run-id "${RUN_ID}" \
            --attempt "${RUN_ATTEMPT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow release-orchestrate.yml \
            --head-sha "${HEAD_SHA}" \
            --environment pypi \
            --publish-script pypa/gh-action-pypi-publish \
            --out-dir .three-workflow-release/publish-result/python-pypi \
            --github-output "${GITHUB_OUTPUT}"

      - name: Compute PyPI publish receipt artifact name
        id: publish_result_artifact
        shell: bash
        env:
          PLAN_ID: ${{ steps.publish_result.outputs.plan_id }}
          PUBLISH_NODE_ID: ${{ steps.publish_result.outputs.publish_node_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          uv run python eng/scripts/workflow_release_control.py artifact-name \
            --kind publish-result \
            --run-id "${RUN_ID}" \
            --attempt "${RUN_ATTEMPT}" \
            --plan-id "${PLAN_ID}" \
            --publish-node-id "${PUBLISH_NODE_ID}" \
            --github-output "${GITHUB_OUTPUT}" \
            --output-name artifact_name

      - name: Upload PyPI publish receipt
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.publish_result_artifact.outputs.artifact_name }}
          path: ${{ steps.publish_result.outputs.publish_result_path }}
          if-no-files-found: error
          retention-days: 30

  # ATTESTATION GATE PATTERN: Each language uses a pair of jobs:
  #   1. attest-*-enabled: Runs only when enable_attestation=true. Generates build provenance.
  #   2. attest-*: Always runs (via always()). If attestation is enabled, it verifies the
  #      enabled job succeeded. If disabled, it logs a note and exits 0.
  # This pattern ensures all downstream jobs can unconditionally depend on attest-* without
  # needing to replicate the enable_attestation condition check in every dependent job.
  # The same pattern is repeated for Node and Ruby below.
  attest-python-enabled:
    name: Attest release assets (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve
      - prepare-release-plan
      - build-python
    if: needs.resolve.outputs.project_kind == 'python' && needs.prepare-release-plan.outputs.has_active_variants == 'true' && inputs.enable_attestation
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Fail buddy rerun attempts
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ "${CHANNEL}" == "buddy" && "${RUN_ATTEMPT}" != "1" ]]; then
            echo "buddy release side-effect jobs are single-attempt only; rerun attempts must fail closed before mutation." >&2
            exit 1
          fi

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Attest build provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/out/*

  attest-python:
    name: Attestation gate (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve
      - prepare-release-plan
      - build-python
      - attest-python-enabled
    if: ${{ always() && needs.resolve.outputs.project_kind == 'python' && needs.prepare-release-plan.outputs.has_active_variants == 'true' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify attestation outcome
        if: inputs.enable_attestation
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build-python.result }}
          RESULT: ${{ needs.attest-python-enabled.result }}
        run: |
          set -Eeuo pipefail
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            echo "Skipping attestation gate: build-python did not succeed (result=${BUILD_RESULT})."
            echo "### Attestation: :white_circle: skipped (build did not succeed)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [[ "${RESULT}" != "success" ]]; then
            echo "Attestation job did not succeed (result=${RESULT})." >&2
            exit 1
          fi
          echo "### Attestation: :white_check_mark: passed" >> "${GITHUB_STEP_SUMMARY}"

      - name: Attestation disabled
        if: ${{ !inputs.enable_attestation }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Attestation is disabled for this channel."
          echo "### Attestation: :no_entry_sign: disabled" >> "${GITHUB_STEP_SUMMARY}"

  # The release-python-with-pypi / release-python-no-pypi split is a deliberate workaround for
  # GitHub Actions' static needs evaluation. GitHub Actions resolves the `needs:` graph at
  # workflow parse time, so a job that conditionally needs publish-python must be duplicated
  # into two variants: one that lists it in `needs:` (and therefore waits for it) and one that
  # does not. The `if:` condition on each variant ensures only one ever runs.
  release-python-with-pypi:
    name: Create GitHub release (Python, with PyPI)
    needs:
      - resolve
      - resolve-hub-context
      - prepare-release-plan
      - prepare-release-notes
      - build-python
      - publish-python
      - attest-python
      - ensure-tag
    if: needs.resolve.outputs.project_kind == 'python' && needs.prepare-release-plan.outputs.has_active_github_release == 'true' && inputs.publish_python_pypi && needs.prepare-release-plan.outputs.has_active_python_pypi == 'true'
    permissions:
      contents: write
      actions: read
      attestations: read
    uses: ./.github/workflows/release-create-github-release.yml
    secrets: {}
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target: ${{ needs.resolve.outputs.target }}
      release_title: ${{ needs.resolve.outputs.release_title }}
      prerelease: ${{ inputs.github_release_prerelease }}
      publish_mode: ${{ needs.prepare-release-plan.outputs.active_github_release_publish_mode }}
      asset_labels_json: ${{ needs.prepare-release-plan.outputs.active_github_release_asset_labels_json }}
      asset_names_json: ${{ needs.prepare-release-plan.outputs.active_github_release_asset_names_json }}
      plan_artifact_name: ${{ needs.prepare-release-plan.outputs.plan_artifact_name }}
      execution_sets_artifact_name: ${{ needs.prepare-release-plan.outputs.execution_sets_artifact_name }}
      active_github_release_node_ids_json: ${{ needs.prepare-release-plan.outputs.active_github_release_node_ids }}
      force_update_tag: ${{ inputs.channel == 'official' && needs.resolve.outputs.force_update_tag == 'true' }}
      channel: ${{ inputs.channel }}
      planner_profile: ${{ needs.resolve-hub-context.outputs.planner_profile }}
      attestation_source_sha: ${{ github.sha }}
      enable_attestation: ${{ inputs.enable_attestation }}
      notes_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-release-notes
      dist_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  release-python-no-pypi:
    name: Create GitHub release (Python, no PyPI)
    needs:
      - resolve
      - resolve-hub-context
      - prepare-release-plan
      - prepare-release-notes
      - build-python
      - attest-python
      - ensure-tag
    if: needs.resolve.outputs.project_kind == 'python' && needs.prepare-release-plan.outputs.has_active_github_release == 'true' && (!inputs.publish_python_pypi || needs.prepare-release-plan.outputs.has_active_python_pypi != 'true')
    permissions:
      contents: write
      actions: read
      attestations: read
    uses: ./.github/workflows/release-create-github-release.yml
    secrets: {}
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target: ${{ needs.resolve.outputs.target }}
      release_title: ${{ needs.resolve.outputs.release_title }}
      prerelease: ${{ inputs.github_release_prerelease }}
      publish_mode: ${{ needs.prepare-release-plan.outputs.active_github_release_publish_mode }}
      asset_labels_json: ${{ needs.prepare-release-plan.outputs.active_github_release_asset_labels_json }}
      asset_names_json: ${{ needs.prepare-release-plan.outputs.active_github_release_asset_names_json }}
      plan_artifact_name: ${{ needs.prepare-release-plan.outputs.plan_artifact_name }}
      execution_sets_artifact_name: ${{ needs.prepare-release-plan.outputs.execution_sets_artifact_name }}
      active_github_release_node_ids_json: ${{ needs.prepare-release-plan.outputs.active_github_release_node_ids }}
      force_update_tag: ${{ inputs.channel == 'official' && needs.resolve.outputs.force_update_tag == 'true' }}
      channel: ${{ inputs.channel }}
      planner_profile: ${{ needs.resolve-hub-context.outputs.planner_profile }}
      attestation_source_sha: ${{ github.sha }}
      enable_attestation: ${{ inputs.enable_attestation }}
      notes_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-release-notes
      dist_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  # ===========================================================================
  # SECTION: WXT Release Pipeline
  # ===========================================================================
  build-wxt:
    name: Build WXT package
    needs:
      - resolve
      - resolve-hub-context
      - prepare-release-plan
      - policy-publish-targets
      - guard-prerelease-only
      - guard-non-clobber
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt == 'true' && needs.prepare-release-plan.outputs.has_active_variants == 'true'
    uses: ./.github/workflows/release-build-wxt.yml
    secrets: {}
    permissions:
      contents: read
    with:
      target: ${{ needs.resolve.outputs.target }}
      project: ${{ needs.resolve.outputs.project }}
      package_dir: ${{ needs.resolve.outputs.package_dir }}
      version: ${{ needs.resolve.outputs.version }}
      profile: ${{ needs.resolve-hub-context.outputs.planner_profile }}
      # Hardcoded: uses: with: does not support env context; keep in sync with env.NODE_VERSION
      node_version: '24'
      pnpm_version: '11.21.0'
      artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  attest-wxt-enabled:
    name: Attest release assets (WXT)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve
      - resolve-hub-context
      - prepare-release-plan
      - build-wxt
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt == 'true' && needs.prepare-release-plan.outputs.has_active_variants == 'true' && inputs.enable_attestation
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Fail buddy rerun attempts
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ "${CHANNEL}" == "buddy" && "${RUN_ATTEMPT}" != "1" ]]; then
            echo "buddy release side-effect jobs are single-attempt only; rerun attempts must fail closed before mutation." >&2
            exit 1
          fi

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Attest build provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/out/*

  attest-wxt:
    name: Attestation gate (WXT)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve
      - prepare-release-plan
      - build-wxt
      - attest-wxt-enabled
    if: ${{ always() && needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt == 'true' && needs.prepare-release-plan.outputs.has_active_variants == 'true' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify attestation outcome
        if: inputs.enable_attestation
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build-wxt.result }}
          RESULT: ${{ needs.attest-wxt-enabled.result }}
        run: |
          set -Eeuo pipefail
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            echo "Skipping attestation gate: build-wxt did not succeed (result=${BUILD_RESULT})."
            echo "### Attestation: :white_circle: skipped (build did not succeed)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [[ "${RESULT}" != "success" ]]; then
            echo "Attestation job did not succeed (result=${RESULT})." >&2
            exit 1
          fi
          echo "### Attestation: :white_check_mark: passed" >> "${GITHUB_STEP_SUMMARY}"

      - name: Attestation disabled
        if: ${{ !inputs.enable_attestation }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Attestation is disabled for this channel."
          echo "### Attestation: :no_entry_sign: disabled" >> "${GITHUB_STEP_SUMMARY}"

  release-wxt:
    name: Create GitHub release (WXT)
    needs:
      - resolve
      - resolve-hub-context
      - prepare-release-plan
      - prepare-release-notes
      - build-wxt
      - attest-wxt
      - ensure-tag
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt == 'true' && needs.prepare-release-plan.outputs.has_active_github_release == 'true'
    permissions:
      contents: write
      actions: read
      attestations: read
    uses: ./.github/workflows/release-create-github-release.yml
    secrets: {}
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target: ${{ needs.resolve.outputs.target }}
      release_title: ${{ needs.resolve.outputs.release_title }}
      prerelease: ${{ inputs.github_release_prerelease }}
      publish_mode: ${{ needs.prepare-release-plan.outputs.active_github_release_publish_mode }}
      asset_labels_json: ${{ needs.prepare-release-plan.outputs.active_github_release_asset_labels_json }}
      asset_names_json: ${{ needs.prepare-release-plan.outputs.active_github_release_asset_names_json }}
      plan_artifact_name: ${{ needs.prepare-release-plan.outputs.plan_artifact_name }}
      execution_sets_artifact_name: ${{ needs.prepare-release-plan.outputs.execution_sets_artifact_name }}
      active_github_release_node_ids_json: ${{ needs.prepare-release-plan.outputs.active_github_release_node_ids }}
      force_update_tag: ${{ inputs.channel == 'official' && needs.resolve.outputs.force_update_tag == 'true' }}
      channel: ${{ inputs.channel }}
      planner_profile: ${{ needs.resolve-hub-context.outputs.planner_profile }}
      attestation_source_sha: ${{ github.sha }}
      enable_attestation: ${{ inputs.enable_attestation }}
      notes_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-release-notes
      dist_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  # ===========================================================================
  # SECTION: Node Release Pipeline
  # ===========================================================================
  pack-node:
    name: Pack Node tarball(s)
    needs:
      - resolve
      - resolve-hub-context
      - prepare-release-plan
      - policy-publish-targets
      - guard-prerelease-only
      - guard-non-clobber
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true' && needs.prepare-release-plan.outputs.has_active_variants == 'true'
    uses: ./.github/workflows/release-build-node-pack.yml
    secrets: {}
    permissions:
      contents: read
    with:
      target: ${{ needs.resolve.outputs.target }}
      project: ${{ needs.resolve.outputs.project }}
      package_dir: ${{ needs.resolve.outputs.package_dir }}
      version: ${{ needs.resolve.outputs.version }}
      # Hardcoded: uses: with: does not support env context; keep in sync with env.PYTHON_VERSION, env.NODE_VERSION, env.PNPM_VERSION
      python_version: '3.14'
      node_version: '24'
      pnpm_version: '11.21.0'
      artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
      pack_mode: ${{ needs.prepare-release-plan.outputs.has_selected_node_npmjs == 'true' && needs.prepare-release-plan.outputs.has_selected_node_gpr == 'true' && 'both' || needs.prepare-release-plan.outputs.has_selected_node_npmjs == 'true' && 'npmjs-only' || needs.prepare-release-plan.outputs.has_selected_node_gpr == 'true' && 'gpr-only' || 'github-release-only' }}
      expected_gpr_package_name: ${{ needs.prepare-release-plan.outputs.expected_node_gpr_package_name }}
      expected_gpr_package_version: ${{ needs.prepare-release-plan.outputs.expected_node_gpr_package_version }}
      expected_npmjs_package_name: ${{ needs.prepare-release-plan.outputs.expected_node_npmjs_package_name }}
      expected_npmjs_package_version: ${{ needs.prepare-release-plan.outputs.expected_node_npmjs_package_version }}
      expected_github_release_asset_name: ${{ needs.prepare-release-plan.outputs.expected_node_github_release_asset_name }}
      expected_github_release_package_name: ${{ needs.prepare-release-plan.outputs.expected_node_github_release_package_name }}

  gate-node-publish-npmjs:
    name: Approval gate for Node publish (npmjs)
    runs-on: ubuntu-latest
    timeout-minutes: 1440 # environment approval gate: allow up to 24h for reviewer action
    needs:
      - resolve
      - prepare-release-plan
      - pack-node
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true' && inputs.publish_node_npmjs && needs.prepare-release-plan.outputs.has_active_node_npmjs == 'true'
    # npmjs-gate: human approval gate only. The publish job uses environment: npmjs for
    # OIDC token scoping. Using separate environments prevents a double-approval prompt
    # when the npmjs environment has required reviewers configured.
    environment: npmjs-gate
    permissions:
      contents: read
      actions: read
    steps:
      - name: Fail buddy rerun attempts
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ "${CHANNEL}" == "buddy" && "${RUN_ATTEMPT}" != "1" ]]; then
            echo "buddy release side-effect jobs are single-attempt only; rerun attempts must fail closed before mutation." >&2
            exit 1
          fi

      - name: Await npmjs environment approval
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "npmjs environment approval granted."

  # NOTE: publish-node-gpr-enabled is intentionally coupled to the npmjs approval gate only
  # when npmjs publishing is input-enabled and plan-active. A plan may contain a selected npmjs
  # node while publish_node_npmjs=false; that disables the effective npmjs publication and must
  # not block an otherwise active GPR upload. When npmjs is effectively enabled, GPR publishing
  # is held until the npmjs environment approval succeeds. This provides approval-synchronized
  # sequencing: either both registries are approved-and-published together, or neither proceeds.
  # If you need independent registry publishes, decouple this condition by removing the
  # gate-node-publish-npmjs dependency check.
  # Attestation (attest-node) must also complete successfully before GPR publishing proceeds,
  # ensuring the artifact is attested before it is published to GitHub Packages.
  # NOTE: This job uses always() (exception to the *-enabled pattern) because gate-node-publish-npmjs
  # is in needs: and is skipped when publish_node_npmjs=false. See JOB NAMING CONVENTION above.
  publish-node-gpr-enabled:
    name: Publish Node package (GitHub Packages) [upload]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve
      - prepare-release-plan
      - pack-node
      - attest-node
      - gate-node-publish-npmjs
      - ensure-tag
    # Condition: Always evaluate (via always()), but only run if: this is a non-WXT Node
    # project, GPR publishing is enabled, pack-node succeeded, attest-node succeeded, AND
    # (either npmjs is not effectively being published OR the npmjs approval gate
    # (gate-node-publish-npmjs) has passed), and tag orchestration succeeded when
    # the plan includes a GitHub Release node. Effective npmjs publishing requires
    # both the input flag and a plan-active npmjs node.
    # The pack-node result check prevents a spurious "artifact not found" failure when
    # pack-node fails and publish_node_npmjs=false (gate is skipped, not failed).
    # See the comment above this job for the rationale behind the npmjs gate coupling.
    if: ${{ always() && needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true' && inputs.publish_node_gpr && needs.prepare-release-plan.outputs.has_active_node_gpr == 'true' && needs.pack-node.result == 'success' && needs.attest-node.result == 'success' && (needs.prepare-release-plan.outputs.has_active_github_release != 'true' || needs.ensure-tag.result == 'success') && (!inputs.publish_node_npmjs || needs.prepare-release-plan.outputs.has_active_node_npmjs != 'true' || needs.gate-node-publish-npmjs.result == 'success') }}
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Fail buddy rerun attempts
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ "${CHANNEL}" == "buddy" && "${RUN_ATTEMPT}" != "1" ]]; then
            echo "buddy release side-effect jobs are single-attempt only; rerun attempts must fail closed before mutation." >&2
            exit 1
          fi

      - name: Checkout (trusted workflow scripts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.9'

      - name: Resolve npm scope
        id: npm_scope
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          scope="@${OWNER,,}"
          echo "scope=${scope}" >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # registry-url intentionally omitted: auth is handled by the custom .npmrc
          # created in the next step. Setting registry-url here would cause setup-node
          # to write a redundant .npmrc in the workspace root with default file permissions,
          # which could leak the token on self-hosted runners.

      - name: Create .npmrc for GitHub Packages (GPR)
        id: gpr_npmrc
        shell: bash
        env:
          SCOPE: ${{ steps.npm_scope.outputs.scope }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          npmrc="${RUNNER_TEMP}/npmrc-gpr"
          install -m 600 /dev/null "${npmrc}"
          # Write content with restricted permissions; chmod after redirect as defense-in-depth.
          {
            echo "registry=https://registry.npmjs.org"
            echo "${SCOPE}:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
            echo "//npm.pkg.github.com/:always-auth=true"
          } > "${npmrc}"
          chmod 600 "${npmrc}"

          echo "path=${npmrc}" >> "${GITHUB_OUTPUT}"

      - name: Download release plan artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-release-plan.outputs.plan_artifact_name }}
          path: .three-workflow-release/plan

      - name: Download execution sets artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-release-plan.outputs.execution_sets_artifact_name }}
          path: .three-workflow-release/execution-sets

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Publish to GitHub Packages from tarball
        shell: bash
        env:
          DIST_TAG: ${{ needs.pack-node.outputs.dist_tag }}
          EXPECTED_PACKAGE_NAME: ${{ needs.prepare-release-plan.outputs.expected_node_gpr_package_name }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          NPM_CONFIG_USERCONFIG: ${{ steps.gpr_npmrc.outputs.path }}
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.prepare-release-plan.outputs.expected_node_gpr_package_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail

          bash "${GITHUB_WORKSPACE}/eng/scripts/publish_node_gpr_idempotent.sh"

      - name: Materialize Node GPR publish receipt
        id: publish_result
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ needs.resolve.outputs.target }}
        run: |
          set -Eeuo pipefail
          uv run python eng/scripts/workflow_release_control.py package-publish-result \
            --plan .three-workflow-release/plan/release-plan.json \
            --execution-sets .three-workflow-release/execution-sets/execution-sets.json \
            --target-key node-gpr \
            --run-id "${RUN_ID}" \
            --attempt "${RUN_ATTEMPT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow release-orchestrate.yml \
            --head-sha "${HEAD_SHA}" \
            --environment github-packages \
            --publish-script eng/scripts/publish_node_gpr_idempotent.sh \
            --out-dir .three-workflow-release/publish-result/node-gpr \
            --github-output "${GITHUB_OUTPUT}"

      - name: Compute Node GPR publish receipt artifact name
        id: publish_result_artifact
        shell: bash
        env:
          PLAN_ID: ${{ steps.publish_result.outputs.plan_id }}
          PUBLISH_NODE_ID: ${{ steps.publish_result.outputs.publish_node_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          uv run python eng/scripts/workflow_release_control.py artifact-name \
            --kind publish-result \
            --run-id "${RUN_ID}" \
            --attempt "${RUN_ATTEMPT}" \
            --plan-id "${PLAN_ID}" \
            --publish-node-id "${PUBLISH_NODE_ID}" \
            --github-output "${GITHUB_OUTPUT}" \
            --output-name artifact_name

      - name: Upload Node GPR publish receipt
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.publish_result_artifact.outputs.artifact_name }}
          path: ${{ steps.publish_result.outputs.publish_result_path }}
          if-no-files-found: error
          retention-days: 30

  publish-node-gpr:
    name: Publish Node package (GitHub Packages) [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve
      - prepare-release-plan
      - publish-node-gpr-enabled
    # Run this gate for every downstream Node path that lists publish-node-gpr in
    # needs:. When Node GPR is unselected, the gate succeeds as a no-op so
    # npmjs-only or GitHub-Release-only descriptors are not blocked by the
    # optional GitHub Packages route. When Node GPR is active, the steps below
    # still require the upload job to complete successfully.
    if: ${{ always() && needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true' && (needs.prepare-release-plan.outputs.has_selected_node_gpr == 'true' || needs.prepare-release-plan.outputs.has_active_node_npmjs == 'true' || needs.prepare-release-plan.outputs.has_active_github_release == 'true') }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Node GPR publishing disabled
        if: ${{ needs.prepare-release-plan.outputs.has_active_node_gpr != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Node GPR publishing is disabled by policy."
          echo "### GPR publish: :no_entry_sign: disabled" >> "${GITHUB_STEP_SUMMARY}"

      - name: Ensure enabled publish job succeeded
        if: ${{ needs.prepare-release-plan.outputs.has_active_node_gpr == 'true' && needs.publish-node-gpr-enabled.result != 'success' && needs.publish-node-gpr-enabled.result != 'skipped' }}
        shell: bash
        env:
          ENABLED_JOB_RESULT: ${{ needs.publish-node-gpr-enabled.result }}
        run: |
          set -Eeuo pipefail
          echo "Node GPR publish gate failed: publish-node-gpr-enabled did not succeed (result=${ENABLED_JOB_RESULT})." >&2
          exit 1

      - name: Node GPR publish skipped (upstream did not run)
        if: ${{ needs.prepare-release-plan.outputs.has_active_node_gpr == 'true' && needs.publish-node-gpr-enabled.result == 'skipped' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Node GPR publish gate: upstream job did not run (publish-node-gpr-enabled was skipped). Check pack-node, attest-node, gate-node-publish-npmjs, or resolve for the root cause." >&2
          echo "### GPR publish: :x: upstream job skipped (see pack-node / attest-node / gate-node-publish-npmjs / resolve)" >> "${GITHUB_STEP_SUMMARY}"
          exit 1

      - name: Node GPR publish completed
        if: ${{ needs.prepare-release-plan.outputs.has_active_node_gpr == 'true' && needs.publish-node-gpr-enabled.result == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Node GPR publish completed."
          echo "### GPR publish: :white_check_mark: completed" >> "${GITHUB_STEP_SUMMARY}"

  # RECOVERY: If publish-node-gpr succeeded but publish-node-npmjs is subsequently
  # blocked (transient environment approval timeout, npmjs outage, or OIDC issue):
  # 1. Navigate to Actions → select this run → Re-run jobs → Re-run failed jobs.
  # 2. The gate-node-publish-npmjs approval step will re-prompt; GPR publishing is
  #    idempotent (publish_node_gpr_idempotent.sh skips if version already exists).
  publish-node-npmjs:
    name: Publish Node package (npmjs.org)
    runs-on: ubuntu-latest
    timeout-minutes: 1440 # environment approval gate: allow up to 24h for reviewer action
    needs:
      - resolve
      - prepare-release-plan
      - pack-node # scheduling only: ensures artifact is available before download; safety is enforced via gate-node-publish-npmjs result check
      - gate-node-publish-npmjs
      - publish-node-gpr
      - attest-node
      - ensure-tag
    # Explicitly check attest-node here: on partial reruns GPR may be selected but
    # skip-satisfied, making publish-node-gpr a successful no-op rather than an
    # attestation-enforcing upload gate.
    if: ${{ always() && needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true' && inputs.publish_node_npmjs && needs.prepare-release-plan.outputs.has_active_node_npmjs == 'true' && (needs.prepare-release-plan.outputs.has_active_github_release != 'true' || needs.ensure-tag.result == 'success') && needs.gate-node-publish-npmjs.result == 'success' && needs.publish-node-gpr.result == 'success' && (!inputs.enable_attestation || needs.attest-node.result == 'success') }}
    # SECURITY: This environment MUST have required reviewers configured in repository settings.
    # Without reviewers, any workflow in this repository calling with channel: official can publish to npmjs.org via OIDC.
    # SECURITY: The Trusted Publisher registration on npmjs.com MUST use the direct caller workflow
    # name (official.yml for active official npmjs publishing) and set the optional Environment field
    # to 'npmjs'. npm validates workflow_call publishes against the caller workflow name even though
    # this reusable workflow contains the npm publish command. Both the caller and this job must grant
    # id-token: write.
    environment: npmjs
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Fail buddy rerun attempts
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ "${CHANNEL}" == "buddy" && "${RUN_ATTEMPT}" != "1" ]]; then
            echo "buddy release side-effect jobs are single-attempt only; rerun attempts must fail closed before mutation." >&2
            exit 1
          fi

      - name: Checkout (trusted workflow scripts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.9'

      - name: Setup Node.js (npmjs)
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Download release plan artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-release-plan.outputs.plan_artifact_name }}
          path: .three-workflow-release/plan

      - name: Download execution sets artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-release-plan.outputs.execution_sets_artifact_name }}
          path: .three-workflow-release/execution-sets

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Note about npm Trusted Publishers (OIDC)
        shell: bash
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
        run: |
          set -Eeuo pipefail
          echo "This workflow is intended to publish '${PROJECT}' to npmjs.org using npm Trusted Publishing (OIDC)."
          echo "No npm token is provided by this workflow; publishing will fail unless a Trusted Publisher is configured on npmjs.com for:"
          echo "  - Repository: ${GITHUB_REPOSITORY}"
          echo "  - Workflow: .github/workflows/official.yml"
          echo "    (npm Trusted Publishing validates the direct caller workflow name for workflow_call."
          echo "     The npm publish command still runs in .github/workflows/release-orchestrate.yml.)"
          echo "  - Environment (if configured on npm): npmjs"
          echo "The official caller grants id-token: write, and this reusable publish job also grants id-token: write."
          echo "Legacy Buddy entries are retired; do not add .github/workflows/buddy.yml as a Trusted Publisher or caller-compatibility route."
          echo "See: https://docs.npmjs.com/trusted-publishers"

      - name: Publish to npm registry (idempotent)
        shell: bash
        env:
          DIST_TAG: ${{ needs.pack-node.outputs.dist_tag }}
          EXPECTED_PACKAGE_NAME: ${{ needs.prepare-release-plan.outputs.expected_node_npmjs_package_name }}
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.prepare-release-plan.outputs.expected_node_npmjs_package_version }}
        run: |
          set -Eeuo pipefail

          bash "${GITHUB_WORKSPACE}/eng/scripts/publish_node_npmjs_idempotent.sh"

      - name: Materialize npmjs publish receipt
        id: publish_result
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ needs.resolve.outputs.target }}
        run: |
          set -Eeuo pipefail
          uv run python eng/scripts/workflow_release_control.py package-publish-result \
            --plan .three-workflow-release/plan/release-plan.json \
            --execution-sets .three-workflow-release/execution-sets/execution-sets.json \
            --target-key node-npmjs \
            --run-id "${RUN_ID}" \
            --attempt "${RUN_ATTEMPT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow release-orchestrate.yml \
            --head-sha "${HEAD_SHA}" \
            --environment npmjs \
            --publish-script eng/scripts/publish_node_npmjs_idempotent.sh \
            --out-dir .three-workflow-release/publish-result/node-npmjs \
            --github-output "${GITHUB_OUTPUT}"

      - name: Compute npmjs publish receipt artifact name
        id: publish_result_artifact
        shell: bash
        env:
          PLAN_ID: ${{ steps.publish_result.outputs.plan_id }}
          PUBLISH_NODE_ID: ${{ steps.publish_result.outputs.publish_node_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          uv run python eng/scripts/workflow_release_control.py artifact-name \
            --kind publish-result \
            --run-id "${RUN_ID}" \
            --attempt "${RUN_ATTEMPT}" \
            --plan-id "${PLAN_ID}" \
            --publish-node-id "${PUBLISH_NODE_ID}" \
            --github-output "${GITHUB_OUTPUT}" \
            --output-name artifact_name

      - name: Upload npmjs publish receipt
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.publish_result_artifact.outputs.artifact_name }}
          path: ${{ steps.publish_result.outputs.publish_result_path }}
          if-no-files-found: error
          retention-days: 30

  attest-node-enabled:
    name: Attest release assets (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve
      - prepare-release-plan
      - pack-node
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true' && needs.prepare-release-plan.outputs.has_active_variants == 'true' && inputs.enable_attestation
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Fail buddy rerun attempts
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ "${CHANNEL}" == "buddy" && "${RUN_ATTEMPT}" != "1" ]]; then
            echo "buddy release side-effect jobs are single-attempt only; rerun attempts must fail closed before mutation." >&2
            exit 1
          fi

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Attest build provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/out/*

  attest-node:
    name: Attestation gate (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve
      - prepare-release-plan
      - pack-node
      - attest-node-enabled
    if: ${{ always() && needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true' && needs.prepare-release-plan.outputs.has_active_variants == 'true' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify attestation outcome
        if: inputs.enable_attestation
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.pack-node.result }}
          RESULT: ${{ needs.attest-node-enabled.result }}
        run: |
          set -Eeuo pipefail
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            echo "Skipping attestation gate: pack-node did not succeed (result=${BUILD_RESULT})."
            echo "### Attestation: :white_circle: skipped (build did not succeed)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [[ "${RESULT}" != "success" ]]; then
            echo "Attestation job did not succeed (result=${RESULT})." >&2
            exit 1
          fi
          echo "### Attestation: :white_check_mark: passed" >> "${GITHUB_STEP_SUMMARY}"

      - name: Attestation disabled
        if: ${{ !inputs.enable_attestation }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Attestation is disabled for this channel."
          echo "### Attestation: :no_entry_sign: disabled" >> "${GITHUB_STEP_SUMMARY}"

  # The release-node-with-npmjs / release-node-no-npmjs split is a deliberate workaround for
  # GitHub Actions' static needs evaluation. GitHub Actions resolves the `needs:` graph at
  # workflow parse time, so a job that conditionally needs publish-node-npmjs must be duplicated
  # into two variants: one that lists it in `needs:` (and therefore waits for it) and one that
  # does not. The `if:` condition on each variant ensures only one ever runs.
  release-node-with-npmjs:
    name: Create GitHub release (Node, with npmjs)
    needs:
      - resolve
      - resolve-hub-context
      - prepare-release-plan
      - prepare-release-notes
      - pack-node
      - publish-node-gpr
      - publish-node-npmjs
      - attest-node
      - ensure-tag
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true' && needs.prepare-release-plan.outputs.has_active_github_release == 'true' && inputs.publish_node_npmjs && needs.prepare-release-plan.outputs.has_active_node_npmjs == 'true'
    permissions:
      contents: write
      actions: read
      attestations: read
    uses: ./.github/workflows/release-create-github-release.yml
    secrets: {}
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target: ${{ needs.resolve.outputs.target }}
      release_title: ${{ needs.resolve.outputs.release_title }}
      prerelease: ${{ inputs.github_release_prerelease }}
      publish_mode: ${{ needs.prepare-release-plan.outputs.active_github_release_publish_mode }}
      asset_labels_json: ${{ needs.prepare-release-plan.outputs.active_github_release_asset_labels_json }}
      asset_names_json: ${{ needs.prepare-release-plan.outputs.active_github_release_asset_names_json }}
      plan_artifact_name: ${{ needs.prepare-release-plan.outputs.plan_artifact_name }}
      execution_sets_artifact_name: ${{ needs.prepare-release-plan.outputs.execution_sets_artifact_name }}
      active_github_release_node_ids_json: ${{ needs.prepare-release-plan.outputs.active_github_release_node_ids }}
      force_update_tag: ${{ inputs.channel == 'official' && needs.resolve.outputs.force_update_tag == 'true' }}
      channel: ${{ inputs.channel }}
      planner_profile: ${{ needs.resolve-hub-context.outputs.planner_profile }}
      attestation_source_sha: ${{ github.sha }}
      enable_attestation: ${{ inputs.enable_attestation }}
      notes_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-release-notes
      dist_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  release-node-no-npmjs:
    name: Create GitHub release (Node, no npmjs)
    needs:
      - resolve
      - resolve-hub-context
      - prepare-release-plan
      - prepare-release-notes
      - pack-node
      - publish-node-gpr
      - attest-node
      - ensure-tag
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true' && needs.prepare-release-plan.outputs.has_active_github_release == 'true' && (!inputs.publish_node_npmjs || needs.prepare-release-plan.outputs.has_active_node_npmjs != 'true')
    permissions:
      contents: write
      actions: read
      attestations: read
    uses: ./.github/workflows/release-create-github-release.yml
    secrets: {}
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target: ${{ needs.resolve.outputs.target }}
      release_title: ${{ needs.resolve.outputs.release_title }}
      prerelease: ${{ inputs.github_release_prerelease }}
      publish_mode: ${{ needs.prepare-release-plan.outputs.active_github_release_publish_mode }}
      asset_labels_json: ${{ needs.prepare-release-plan.outputs.active_github_release_asset_labels_json }}
      asset_names_json: ${{ needs.prepare-release-plan.outputs.active_github_release_asset_names_json }}
      plan_artifact_name: ${{ needs.prepare-release-plan.outputs.plan_artifact_name }}
      execution_sets_artifact_name: ${{ needs.prepare-release-plan.outputs.execution_sets_artifact_name }}
      active_github_release_node_ids_json: ${{ needs.prepare-release-plan.outputs.active_github_release_node_ids }}
      force_update_tag: ${{ inputs.channel == 'official' && needs.resolve.outputs.force_update_tag == 'true' }}
      channel: ${{ inputs.channel }}
      planner_profile: ${{ needs.resolve-hub-context.outputs.planner_profile }}
      attestation_source_sha: ${{ github.sha }}
      enable_attestation: ${{ inputs.enable_attestation }}
      notes_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-release-notes
      dist_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  # ===========================================================================
  # SECTION: Ruby Release Pipeline
  # ===========================================================================
  build-ruby:
    name: Build Ruby gem
    needs:
      - resolve
      - resolve-hub-context
      - prepare-release-plan
      - policy-publish-targets
      - guard-prerelease-only
      - guard-non-clobber
    if: needs.resolve.outputs.project_kind == 'ruby' && needs.prepare-release-plan.outputs.has_active_variants == 'true'
    uses: ./.github/workflows/release-build-ruby-gem.yml
    secrets: {}
    permissions:
      contents: read
    with:
      target: ${{ needs.resolve.outputs.target }}
      project: ${{ needs.resolve.outputs.project }}
      package_dir: ${{ needs.resolve.outputs.package_dir }}
      version: ${{ needs.resolve.outputs.version }}
      package_name: ${{ needs.prepare-release-plan.outputs.expected_ruby_package_name }}
      package_version: ${{ needs.prepare-release-plan.outputs.expected_ruby_package_version }}
      # Derived from package metadata by release-resolve.yml; packages without a Ruby pin fall back to the repo default.
      ruby_version: ${{ needs.resolve.outputs.ruby_version }}
      artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
      expected_gem_filename: ${{ needs.prepare-release-plan.outputs.expected_ruby_gem_filename }}

  # NOTE: publish-ruby-gpr-enabled and publish-ruby-rubygems are intentionally independent.
  # Unlike the Node path (where GPR is held until npmjs environment approval to enforce atomic
  # dual-publish), Ruby GPR (GitHub Packages) and RubyGems.org serve distinct audiences and
  # are independent artifact stores with no atomicity requirement. A partial publish (GPR
  # succeeds, RubyGems fails) is a loud failure that surfaces in the workflow, not a silent
  # inconsistency. If you need atomic Ruby dual-publish in the future, mirror the Node pattern
  # by adding an environment approval gate before publish-ruby-gpr-enabled.
  # Attestation (attest-ruby) is enforced before GPR publishing to ensure the artifact is
  # attested prior to being published to GitHub Packages.
  publish-ruby-gpr-enabled:
    name: Publish Ruby gem (GitHub Packages) [upload]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve
      - prepare-release-plan
      - build-ruby
      - attest-ruby
      - ensure-tag
    # NOTE: This job uses always() because ensure-tag is skipped for registry-only
    # plans with no GitHub Release node. Keep the explicit build, attestation, and
    # conditional tag checks below so skipped or failed prerequisites cannot prompt
    # package publication.
    if: ${{ always() && needs.resolve.outputs.project_kind == 'ruby' && inputs.publish_ruby_gpr && needs.prepare-release-plan.outputs.has_active_ruby_gpr == 'true' && needs.build-ruby.result == 'success' && needs.attest-ruby.result == 'success' && (needs.prepare-release-plan.outputs.has_active_github_release != 'true' || needs.ensure-tag.result == 'success') }}
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Fail buddy rerun attempts
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ "${CHANNEL}" == "buddy" && "${RUN_ATTEMPT}" != "1" ]]; then
            echo "buddy release side-effect jobs are single-attempt only; rerun attempts must fail closed before mutation." >&2
            exit 1
          fi

      - name: Checkout (trusted workflow scripts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.9'

      - name: Download release plan artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-release-plan.outputs.plan_artifact_name }}
          path: .three-workflow-release/plan

      - name: Download execution sets artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-release-plan.outputs.execution_sets_artifact_name }}
          path: .three-workflow-release/execution-sets

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ needs.resolve.outputs.ruby_version }}

      - name: Publish to GitHub Packages (idempotent)
        shell: bash
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PACKAGE_NAME: ${{ needs.prepare-release-plan.outputs.expected_ruby_package_name }}
          PACKAGE_VERSION: ${{ needs.prepare-release-plan.outputs.expected_ruby_package_version }}
          OWNER: ${{ github.repository_owner }}
          RUBY_GPR_USER: ${{ github.actor }}
          RUBY_GPR_TOKEN: ${{ github.token }}
          EXPECTED_GEM_FILENAME: ${{ needs.prepare-release-plan.outputs.expected_ruby_gem_filename }}
        run: |
          set -Eeuo pipefail

          bash "${GITHUB_WORKSPACE}/eng/scripts/publish_ruby_gpr_idempotent.sh"

      - name: Materialize Ruby GPR publish receipt
        id: publish_result
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ needs.resolve.outputs.target }}
        run: |
          set -Eeuo pipefail
          uv run python eng/scripts/workflow_release_control.py package-publish-result \
            --plan .three-workflow-release/plan/release-plan.json \
            --execution-sets .three-workflow-release/execution-sets/execution-sets.json \
            --target-key ruby-gpr \
            --run-id "${RUN_ID}" \
            --attempt "${RUN_ATTEMPT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow release-orchestrate.yml \
            --head-sha "${HEAD_SHA}" \
            --environment github-packages \
            --publish-script eng/scripts/publish_ruby_gpr_idempotent.sh \
            --out-dir .three-workflow-release/publish-result/ruby-gpr \
            --github-output "${GITHUB_OUTPUT}"

      - name: Compute Ruby GPR publish receipt artifact name
        id: publish_result_artifact
        shell: bash
        env:
          PLAN_ID: ${{ steps.publish_result.outputs.plan_id }}
          PUBLISH_NODE_ID: ${{ steps.publish_result.outputs.publish_node_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          uv run python eng/scripts/workflow_release_control.py artifact-name \
            --kind publish-result \
            --run-id "${RUN_ID}" \
            --attempt "${RUN_ATTEMPT}" \
            --plan-id "${PLAN_ID}" \
            --publish-node-id "${PUBLISH_NODE_ID}" \
            --github-output "${GITHUB_OUTPUT}" \
            --output-name artifact_name

      - name: Upload Ruby GPR publish receipt
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.publish_result_artifact.outputs.artifact_name }}
          path: ${{ steps.publish_result.outputs.publish_result_path }}
          if-no-files-found: error
          retention-days: 30

  publish-ruby-gpr:
    name: Publish Ruby gem (GitHub Packages) [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve
      - prepare-release-plan
      - publish-ruby-gpr-enabled
    # Run this gate for every downstream Ruby GitHub Release path that lists
    # publish-ruby-gpr in needs:. Unselected Ruby GPR is a successful no-op;
    # active Ruby GPR still requires publish-ruby-gpr-enabled to succeed.
    if: ${{ always() && needs.resolve.outputs.project_kind == 'ruby' && (needs.prepare-release-plan.outputs.has_selected_ruby_gpr == 'true' || needs.prepare-release-plan.outputs.has_active_github_release == 'true') }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Ruby GPR publishing disabled
        if: ${{ needs.prepare-release-plan.outputs.has_active_ruby_gpr != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Ruby GPR publishing is disabled by policy."
          echo "### GPR publish: :no_entry_sign: disabled" >> "${GITHUB_STEP_SUMMARY}"

      - name: Ensure enabled publish job succeeded
        if: ${{ needs.prepare-release-plan.outputs.has_active_ruby_gpr == 'true' && needs.publish-ruby-gpr-enabled.result != 'success' && needs.publish-ruby-gpr-enabled.result != 'skipped' }}
        shell: bash
        env:
          ENABLED_JOB_RESULT: ${{ needs.publish-ruby-gpr-enabled.result }}
        run: |
          set -Eeuo pipefail
          echo "Ruby GPR publish gate failed: publish-ruby-gpr-enabled did not succeed (result=${ENABLED_JOB_RESULT})." >&2
          exit 1

      - name: Ruby GPR publish skipped (upstream did not run)
        if: ${{ needs.prepare-release-plan.outputs.has_active_ruby_gpr == 'true' && needs.publish-ruby-gpr-enabled.result == 'skipped' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Ruby GPR publish gate: upstream job did not run (publish-ruby-gpr-enabled was skipped). Check build-ruby and attest-ruby results for the root cause." >&2
          echo "### GPR publish: :x: upstream job skipped (see build-ruby / attest-ruby)" >> "${GITHUB_STEP_SUMMARY}"
          exit 1

      - name: Ruby GPR publish completed
        if: ${{ needs.prepare-release-plan.outputs.has_active_ruby_gpr == 'true' && needs.publish-ruby-gpr-enabled.result == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Ruby GPR publish completed."
          echo "### GPR publish: :white_check_mark: completed" >> "${GITHUB_STEP_SUMMARY}"

  # NOTE: publish-ruby-rubygems uses an inline attestation guard in its if: condition
  # (rather than routing through a separate publish gate). It still uses always()
  # because ensure-tag is skipped for registry-only plans with no GitHub Release node.
  # Keep the explicit build, attestation, and conditional tag checks below so skipped
  # or failed prerequisites cannot prompt package publication.
  #
  # NOTE: publish-ruby-rubygems intentionally does NOT depend on publish-ruby-gpr.
  # GPR (GitHub Packages) and RubyGems.org serve distinct audiences (internal/external);
  # a GPR outage or credential expiry must not block a critical release to the public
  # registry. This is a deliberate divergence from the Node pipeline's sequential pattern,
  # where GPR and npmjs are tied together via an environment approval gate for atomic
  # dual-publish. For Ruby, a partial publish (GPR fails, RubyGems succeeds) is a loud
  # failure that surfaces in the workflow UI and is manually recoverable.
  publish-ruby-rubygems:
    name: Publish Ruby gem (RubyGems.org)
    runs-on: ubuntu-latest
    timeout-minutes: 1440 # environment approval gate: allow up to 24h for reviewer action
    needs:
      - resolve
      - prepare-release-plan
      - build-ruby
      - attest-ruby
      - ensure-tag
    if: ${{ always() && needs.resolve.outputs.project_kind == 'ruby' && inputs.publish_ruby_rubygems && needs.prepare-release-plan.outputs.has_active_ruby_rubygems == 'true' && needs.build-ruby.result == 'success' && (needs.prepare-release-plan.outputs.has_active_github_release != 'true' || needs.ensure-tag.result == 'success') && (!inputs.enable_attestation || needs.attest-ruby.result == 'success') }}
    # SECURITY: This environment MUST have required reviewers configured in repository settings.
    # Without reviewers, any workflow in this repository calling with channel: official can publish to RubyGems.org via OIDC.
    # SECURITY: The Trusted Publisher registration on RubyGems.org MUST set the optional Environment field to 'rubygems'.
    # This adds a second OIDC claim check (job_workflow_environment) so the token is only accepted when the job
    # runs inside this specific environment, providing defense-in-depth independent of reviewer configuration.
    environment: rubygems
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Fail buddy rerun attempts
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ "${CHANNEL}" == "buddy" && "${RUN_ATTEMPT}" != "1" ]]; then
            echo "buddy release side-effect jobs are single-attempt only; rerun attempts must fail closed before mutation." >&2
            exit 1
          fi

      - name: Install jq
        uses: dcarbone/install-jq-action@4fcb5062d7ce9bc4382d1a352d19ba3ba2c317c1 # v4.0.1
        with:
          version: '1.7.1'

      - name: Checkout (trusted workflow scripts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.9'

      - name: Download release plan artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-release-plan.outputs.plan_artifact_name }}
          path: .three-workflow-release/plan

      - name: Download execution sets artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-release-plan.outputs.execution_sets_artifact_name }}
          path: .three-workflow-release/execution-sets

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ needs.resolve.outputs.ruby_version }}

      - name: Configure RubyGems Trusted Publishing credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
        with:
          trusted-publisher: true

      - name: Publish to RubyGems.org (idempotent)
        shell: bash
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PACKAGE_NAME: ${{ needs.prepare-release-plan.outputs.expected_ruby_package_name }}
          PACKAGE_VERSION: ${{ needs.prepare-release-plan.outputs.expected_ruby_package_version }}
          EXPECTED_GEM_FILENAME: ${{ needs.prepare-release-plan.outputs.expected_ruby_gem_filename }}
        run: |
          set -Eeuo pipefail

          bash "${GITHUB_WORKSPACE}/eng/scripts/publish_rubygems_org_idempotent.sh"

      - name: Materialize RubyGems.org publish receipt
        id: publish_result
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ needs.resolve.outputs.target }}
        run: |
          set -Eeuo pipefail
          uv run python eng/scripts/workflow_release_control.py package-publish-result \
            --plan .three-workflow-release/plan/release-plan.json \
            --execution-sets .three-workflow-release/execution-sets/execution-sets.json \
            --target-key ruby-rubygems \
            --run-id "${RUN_ID}" \
            --attempt "${RUN_ATTEMPT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow release-orchestrate.yml \
            --head-sha "${HEAD_SHA}" \
            --environment rubygems \
            --publish-script eng/scripts/publish_rubygems_org_idempotent.sh \
            --out-dir .three-workflow-release/publish-result/ruby-rubygems \
            --github-output "${GITHUB_OUTPUT}"

      - name: Compute RubyGems.org publish receipt artifact name
        id: publish_result_artifact
        shell: bash
        env:
          PLAN_ID: ${{ steps.publish_result.outputs.plan_id }}
          PUBLISH_NODE_ID: ${{ steps.publish_result.outputs.publish_node_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          uv run python eng/scripts/workflow_release_control.py artifact-name \
            --kind publish-result \
            --run-id "${RUN_ID}" \
            --attempt "${RUN_ATTEMPT}" \
            --plan-id "${PLAN_ID}" \
            --publish-node-id "${PUBLISH_NODE_ID}" \
            --github-output "${GITHUB_OUTPUT}" \
            --output-name artifact_name

      - name: Upload RubyGems.org publish receipt
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.publish_result_artifact.outputs.artifact_name }}
          path: ${{ steps.publish_result.outputs.publish_result_path }}
          if-no-files-found: error
          retention-days: 30

  attest-ruby-enabled:
    name: Attest release assets (Ruby)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve
      - prepare-release-plan
      - build-ruby
    if: needs.resolve.outputs.project_kind == 'ruby' && needs.prepare-release-plan.outputs.has_active_variants == 'true' && inputs.enable_attestation
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Fail buddy rerun attempts
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if [[ "${CHANNEL}" == "buddy" && "${RUN_ATTEMPT}" != "1" ]]; then
            echo "buddy release side-effect jobs are single-attempt only; rerun attempts must fail closed before mutation." >&2
            exit 1
          fi

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Attest build provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/out/*

  attest-ruby:
    name: Attestation gate (Ruby)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve
      - prepare-release-plan
      - build-ruby
      - attest-ruby-enabled
    if: ${{ always() && needs.resolve.outputs.project_kind == 'ruby' && needs.prepare-release-plan.outputs.has_active_variants == 'true' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify attestation outcome
        if: inputs.enable_attestation
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build-ruby.result }}
          RESULT: ${{ needs.attest-ruby-enabled.result }}
        run: |
          set -Eeuo pipefail
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            echo "Skipping attestation gate: build-ruby did not succeed (result=${BUILD_RESULT})."
            echo "### Attestation: :white_circle: skipped (build did not succeed)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [[ "${RESULT}" != "success" ]]; then
            echo "Attestation job did not succeed (result=${RESULT})." >&2
            exit 1
          fi
          echo "### Attestation: :white_check_mark: passed" >> "${GITHUB_STEP_SUMMARY}"

      - name: Attestation disabled
        if: ${{ !inputs.enable_attestation }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Attestation is disabled for this channel."
          echo "### Attestation: :no_entry_sign: disabled" >> "${GITHUB_STEP_SUMMARY}"

  # The release-ruby-with-rubygems / release-ruby-no-rubygems split is a deliberate workaround for
  # GitHub Actions' static needs evaluation. GitHub Actions resolves the `needs:` graph at
  # workflow parse time, so a job that conditionally needs publish-ruby-rubygems must be duplicated
  # into two variants: one that lists it in `needs:` (and therefore waits for it) and one that
  # does not. The `if:` condition on each variant ensures only one ever runs.
  release-ruby-with-rubygems:
    name: Create GitHub release (Ruby, with RubyGems)
    needs:
      - resolve
      - resolve-hub-context
      - prepare-release-plan
      - prepare-release-notes
      - build-ruby
      - publish-ruby-gpr
      - publish-ruby-rubygems
      - attest-ruby
      - ensure-tag
    if: needs.resolve.outputs.project_kind == 'ruby' && needs.prepare-release-plan.outputs.has_active_github_release == 'true' && inputs.publish_ruby_rubygems && needs.prepare-release-plan.outputs.has_active_ruby_rubygems == 'true'
    permissions:
      contents: write
      actions: read
      attestations: read
    uses: ./.github/workflows/release-create-github-release.yml
    secrets: {}
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target: ${{ needs.resolve.outputs.target }}
      release_title: ${{ needs.resolve.outputs.release_title }}
      prerelease: ${{ inputs.github_release_prerelease }}
      publish_mode: ${{ needs.prepare-release-plan.outputs.active_github_release_publish_mode }}
      asset_labels_json: ${{ needs.prepare-release-plan.outputs.active_github_release_asset_labels_json }}
      asset_names_json: ${{ needs.prepare-release-plan.outputs.active_github_release_asset_names_json }}
      plan_artifact_name: ${{ needs.prepare-release-plan.outputs.plan_artifact_name }}
      execution_sets_artifact_name: ${{ needs.prepare-release-plan.outputs.execution_sets_artifact_name }}
      active_github_release_node_ids_json: ${{ needs.prepare-release-plan.outputs.active_github_release_node_ids }}
      force_update_tag: ${{ inputs.channel == 'official' && needs.resolve.outputs.force_update_tag == 'true' }}
      channel: ${{ inputs.channel }}
      planner_profile: ${{ needs.resolve-hub-context.outputs.planner_profile }}
      attestation_source_sha: ${{ github.sha }}
      enable_attestation: ${{ inputs.enable_attestation }}
      notes_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-release-notes
      dist_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  release-ruby-no-rubygems:
    name: Create GitHub release (Ruby, no RubyGems)
    needs:
      - resolve
      - resolve-hub-context
      - prepare-release-plan
      - prepare-release-notes
      - build-ruby
      - publish-ruby-gpr
      - attest-ruby
      - ensure-tag
    if: needs.resolve.outputs.project_kind == 'ruby' && needs.prepare-release-plan.outputs.has_active_github_release == 'true' && (!inputs.publish_ruby_rubygems || needs.prepare-release-plan.outputs.has_active_ruby_rubygems != 'true')
    permissions:
      contents: write
      actions: read
      attestations: read
    uses: ./.github/workflows/release-create-github-release.yml
    secrets: {}
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target: ${{ needs.resolve.outputs.target }}
      release_title: ${{ needs.resolve.outputs.release_title }}
      prerelease: ${{ inputs.github_release_prerelease }}
      publish_mode: ${{ needs.prepare-release-plan.outputs.active_github_release_publish_mode }}
      asset_labels_json: ${{ needs.prepare-release-plan.outputs.active_github_release_asset_labels_json }}
      asset_names_json: ${{ needs.prepare-release-plan.outputs.active_github_release_asset_names_json }}
      plan_artifact_name: ${{ needs.prepare-release-plan.outputs.plan_artifact_name }}
      execution_sets_artifact_name: ${{ needs.prepare-release-plan.outputs.execution_sets_artifact_name }}
      active_github_release_node_ids_json: ${{ needs.prepare-release-plan.outputs.active_github_release_node_ids }}
      force_update_tag: ${{ inputs.channel == 'official' && needs.resolve.outputs.force_update_tag == 'true' }}
      channel: ${{ inputs.channel }}
      planner_profile: ${{ needs.resolve-hub-context.outputs.planner_profile }}
      attestation_source_sha: ${{ github.sha }}
      enable_attestation: ${{ inputs.enable_attestation }}
      notes_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-release-notes
      dist_artifact_name: ${{ inputs.artifact_prefix }}-${{ needs.resolve.outputs.project }}-dist

  # SYNC[add-new-language] — define new language pipeline jobs (build, pack, publish,
  #   attest-<lang>-enabled, attest-<lang> gate, release-<lang>-with-<registry>,
  #   release-<lang>-no-<registry>) above release-completed. Follow the existing
  #   Python/Node/Ruby section structure. If the new language has an optional external
  #   registry, create BOTH release-<lang>-with-<registry> AND release-<lang>-no-<registry>
  #   variants (static needs: evaluation requires job duplication; see Python/Node for pattern).

  # ===========================================================================
  # SECTION: Release Sentinel
  # ===========================================================================
  # MAINTENANCE: When adding a new language/runtime (e.g., Rust), update ALL of the
  # following sync points. Missing any one causes misconfiguration, policy bypass, or
  # incorrect release status reporting.
  #
  # WARNING: ALL active Official/custom steps below are mandatory. B2 preserves
  # the historical Buddy policy-domain assertion matrix as regression evidence;
  # channel=buddy has no active caller route after commit 11. There is no CI
  # enforcement that all steps are completed; the checklist is the sole
  # safeguard for any future separately approved topology that reuses this logic.
  #
  # Across files:
  #   A. release-orchestrate.yml inputs block — add publish_<lang>_<registry> and any
  #      pack/mode inputs
  #   B. release-orchestrate.yml policy job — two updates required:
  #      B1. Update the channel profile matrix comment table above the policy job
  #          (add a new row for each flag and fill official/buddy values)
  #      B2. Add assert_equals() calls for each new input in BOTH 'official' and 'buddy' case
  #          branches (use the SYNC markers inside each branch), and add the flag name to the
  #          required_flags list in the 'Self-test policy flag coverage' step.
  #          [CI-ENFORCED once added to required_flags; maintaining required_flags is manual]
  #   C. release-orchestrate.yml policy-publish-targets job — add env var and per-kind
  #      validation branch for the new language
  #   D. [CI-ENFORCED by lint-version-consistency job] release-orchestrate.yml
  #      lint-version-consistency job — if the new language uses a versioned tool,
  #      add EXPECTED_<LANG>_VERSION to the job's env: block and a check_version
  #      "<lang>_version" call to the verification script step
  #   E. (SYNC above) Define new pipeline jobs here in release-orchestrate.yml
  #   F. official.yml — pass new inputs with their official-channel values
  #
  # Steps A, C, E, F are MANUAL-ONLY (no CI enforcement). Steps B2 and D have
  # automated guards; omitting those steps causes CI to fail at the next run.
  # Step E's sub-task of adding release-* names to release-completed's needs: is
  # CI-enforced by the "Verify release-completed covers all release-* jobs" lint step;
  # writing the actual job definitions is still manual.
  # Legacy Buddy entry workflows are retired; do not add a replacement
  # caller-compatibility route when adding new publish flags.
  #
  # Within this job (one internal sync point):
  #   1. needs: — add the new release job name(s) here
  #      [CI-ENFORCED by lint-version-consistency "Verify release-completed covers all release-* jobs"]
  #      The "Check release outcomes" step uses toJSON(needs) to dynamically process all
  #      jobs in the needs: list, so no further manual updates are needed in that step.
  release-completed:
    name: Release completed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    # SYNC[add-new-language] — add new release job name(s), terminal publish job/gate(s),
    # and attest-<lang> gate to needs below.
    # release-* jobs: [CI-ENFORCED] by "Verify release-completed covers all release-* jobs" lint step.
    # terminal publish jobs/gates and attest-<lang> gates: MANUAL — add them here;
    # they are not auto-detected by the lint step.
    # resolve/prepare-release-plan: required for selected target SHA and plan-phase reporting.
    # resolve-hub-context: required for report profile resolution and sentinel failure propagation.
    needs:
      - build-python
      - build-wxt
      - pack-node
      - build-dotnet
      - build-ruby
      - resolve
      - prepare-release-plan
      - ensure-tag
      - skip-results
      - publish-python
      - publish-node-gpr
      - publish-node-npmjs
      - publish-ruby-gpr
      - publish-ruby-rubygems
      - release-python-with-pypi
      - release-python-no-pypi
      - release-wxt
      - release-node-with-npmjs
      - release-node-no-npmjs
      - release-dotnet
      - release-ruby-with-rubygems
      - release-ruby-no-rubygems
      - attest-python
      - attest-wxt
      - attest-node
      - attest-dotnet
      - attest-ruby
      - resolve-hub-context
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout (release sentinel scripts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install jq
        uses: dcarbone/install-jq-action@4fcb5062d7ce9bc4382d1a352d19ba3ba2c317c1 # v4.0.1
        with:
          version: '1.7.1'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.9'

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: release-*
          path: .three-workflow-release/artifacts

      - name: Check release outcomes
        id: release_completed_check
        continue-on-error: true
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          ARTIFACTS_ROOT: .three-workflow-release/artifacts
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLISH_PYTHON_PYPI: ${{ inputs.publish_python_pypi }}
          PUBLISH_NODE_GPR: ${{ inputs.publish_node_gpr }}
          PUBLISH_NODE_NPMJS: ${{ inputs.publish_node_npmjs }}
          PUBLISH_RUBY_GPR: ${{ inputs.publish_ruby_gpr }}
          PUBLISH_RUBY_RUBYGEMS: ${{ inputs.publish_ruby_rubygems }}
        run: |
          set -Eeuo pipefail
          bash "${GITHUB_WORKSPACE}/eng/scripts/release_orchestrate_release_completed_check.sh"

      - name: Generate release report
        if: ${{ always() }}
        shell: bash
        env:
          ARTIFACTS_ROOT: .three-workflow-release/artifacts
          AUTHORIZE_CONCLUSION: skipped
          VALIDATE_CONCLUSION: skipped
          METADATA_CONCLUSION: skipped
          PLAN_CONCLUSION: ${{ needs.prepare-release-plan.result }}
          BUILD_PYTHON_RESULT: ${{ needs.build-python.result }}
          BUILD_WXT_RESULT: ${{ needs.build-wxt.result }}
          PACK_NODE_RESULT: ${{ needs.pack-node.result }}
          BUILD_DOTNET_RESULT: ${{ needs.build-dotnet.result }}
          BUILD_RUBY_RESULT: ${{ needs.build-ruby.result }}
          TAG_CONCLUSION: ${{ needs.ensure-tag.result }}
          PUBLISH_PYTHON_RESULT: ${{ needs.publish-python.result }}
          PUBLISH_NODE_GPR_RESULT: ${{ needs.publish-node-gpr.result }}
          PUBLISH_NODE_NPMJS_RESULT: ${{ needs.publish-node-npmjs.result }}
          PUBLISH_RUBY_GPR_RESULT: ${{ needs.publish-ruby-gpr.result }}
          PUBLISH_RUBY_RUBYGEMS_RESULT: ${{ needs.publish-ruby-rubygems.result }}
          RELEASE_PYTHON_WITH_PYPI_RESULT: ${{ needs.release-python-with-pypi.result }}
          RELEASE_PYTHON_NO_PYPI_RESULT: ${{ needs.release-python-no-pypi.result }}
          RELEASE_WXT_RESULT: ${{ needs.release-wxt.result }}
          RELEASE_NODE_WITH_NPMJS_RESULT: ${{ needs.release-node-with-npmjs.result }}
          RELEASE_NODE_NO_NPMJS_RESULT: ${{ needs.release-node-no-npmjs.result }}
          RELEASE_DOTNET_RESULT: ${{ needs.release-dotnet.result }}
          RELEASE_RUBY_WITH_RUBYGEMS_RESULT: ${{ needs.release-ruby-with-rubygems.result }}
          RELEASE_RUBY_NO_RUBYGEMS_RESULT: ${{ needs.release-ruby-no-rubygems.result }}
          REPORT_PATH: .three-workflow-release/release-report.json
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: release-orchestrate.yml
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ needs.resolve.outputs.target || github.sha }}
          PUBLISH_PYTHON_PYPI: ${{ inputs.publish_python_pypi }}
          PUBLISH_NODE_GPR: ${{ inputs.publish_node_gpr }}
          PUBLISH_NODE_NPMJS: ${{ inputs.publish_node_npmjs }}
          PUBLISH_RUBY_GPR: ${{ inputs.publish_ruby_gpr }}
          PUBLISH_RUBY_RUBYGEMS: ${{ inputs.publish_ruby_rubygems }}
          PLAN_ARTIFACT_NAME: ${{ needs.prepare-release-plan.outputs.plan_artifact_name }}
          EXECUTION_SETS_ARTIFACT_NAME: ${{ needs.prepare-release-plan.outputs.execution_sets_artifact_name }}
          ENTRY_PUBLISH_HANDOFF_ARTIFACT_NAME: ${{ needs.prepare-release-plan.outputs.entry_publish_handoff_artifact_name }}
          PROFILE: ${{ needs.resolve-hub-context.outputs.channel_profile || (inputs.channel == 'official' && 'official' || inputs.channel == 'buddy' && 'buddy' || 'custom') }}
          DRY_RUN: 'false'
          VALIDATION_BUILD: 'false'
          CANARY_OVERRIDE_NON_PUBLIC_REF: 'false'
          RELEASE_COMPLETED_CHECK_CONCLUSION: ${{ steps.release_completed_check.outcome }}
        run: |
          set -Eeuo pipefail

          combine_phase_conclusion() {
            local conclusion=skipped
            local result
            for result in "$@"; do
              case "${result}" in
                failure)
                  echo failure
                  return 0
                  ;;
                cancelled)
                  if [[ "${conclusion}" == "skipped" ]]; then
                    conclusion=cancelled
                  fi
                  ;;
                success)
                  if [[ "${conclusion}" == "skipped" ]]; then
                    conclusion=success
                  fi
                  ;;
              esac
            done
            echo "${conclusion}"
          }

          resolve_named_artifact_dir() {
            local artifact_name="$1"
            local label="$2"
            if [[ -z "${artifact_name}" ]]; then
              echo ""
              return 0
            fi
            if [[ "${artifact_name}" == "." || "${artifact_name}" == ".." || "${artifact_name}" == */* ]]; then
              echo "Expected exact ${label} artifact name, got '${artifact_name}'." >&2
              exit 1
            fi
            local artifact_dir="${ARTIFACTS_ROOT}/${artifact_name}"
            if [[ -d "${artifact_dir}" ]]; then
              printf '%s\n' "${artifact_dir}"
            else
              echo ""
            fi
          }

          plan_artifact_dir="$(resolve_named_artifact_dir "$PLAN_ARTIFACT_NAME" "release-plan")"
          execution_sets_artifact_dir="$(resolve_named_artifact_dir "$EXECUTION_SETS_ARTIFACT_NAME" "execution-sets")"
          entry_publish_handoff_artifact_dir="$(resolve_named_artifact_dir "$ENTRY_PUBLISH_HANDOFF_ARTIFACT_NAME" "entry-publish-handoff")"
          plan_path=""
          execution_sets_path=""
          entry_publish_handoff_path=""
          [[ -n "${plan_artifact_dir}" ]] && plan_path="${plan_artifact_dir}/release-plan.json"
          [[ -n "${execution_sets_artifact_dir}" ]] && execution_sets_path="${execution_sets_artifact_dir}/execution-sets.json"
          [[ -n "${entry_publish_handoff_artifact_dir}" ]] && entry_publish_handoff_path="${entry_publish_handoff_artifact_dir}/entry-publish-handoff.json"
          diagnostics_path="${ARTIFACTS_ROOT}/release-planner-diagnostics-v1-${RUN_ID}-${RUN_ATTEMPT}/planner-diagnostics.json"
          [[ -f "${plan_path}" ]] || plan_path=""
          [[ -f "${execution_sets_path}" ]] || execution_sets_path=""
          [[ -f "${entry_publish_handoff_path}" ]] || entry_publish_handoff_path=""
          if [[ "${PLAN_CONCLUSION}" == "success" ]]; then
            if [[ -z "${plan_path}" ]]; then
              echo "prepare-release-plan succeeded but the exact release-plan artifact payload is missing." >&2
              exit 1
            fi
            if [[ -z "${execution_sets_path}" ]]; then
              echo "prepare-release-plan succeeded but the exact execution-sets artifact payload is missing." >&2
              exit 1
            fi
            if [[ -z "${entry_publish_handoff_path}" ]]; then
              echo "prepare-release-plan succeeded but the exact entry-publish-handoff artifact payload is missing." >&2
              exit 1
            fi
          fi
          [[ -f "${diagnostics_path}" ]] || diagnostics_path=""
          build_conclusion="$(combine_phase_conclusion \
            "${BUILD_PYTHON_RESULT}" \
            "${BUILD_WXT_RESULT}" \
            "${PACK_NODE_RESULT}" \
            "${BUILD_DOTNET_RESULT}" \
            "${BUILD_RUBY_RESULT}")"
          publish_conclusion="$(combine_phase_conclusion \
            "${PUBLISH_PYTHON_RESULT}" \
            "${PUBLISH_NODE_GPR_RESULT}" \
            "${PUBLISH_NODE_NPMJS_RESULT}" \
            "${PUBLISH_RUBY_GPR_RESULT}" \
            "${PUBLISH_RUBY_RUBYGEMS_RESULT}" \
            "${RELEASE_PYTHON_WITH_PYPI_RESULT}" \
            "${RELEASE_PYTHON_NO_PYPI_RESULT}" \
            "${RELEASE_WXT_RESULT}" \
            "${RELEASE_NODE_WITH_NPMJS_RESULT}" \
            "${RELEASE_NODE_NO_NPMJS_RESULT}" \
            "${RELEASE_DOTNET_RESULT}" \
            "${RELEASE_RUBY_WITH_RUBYGEMS_RESULT}" \
            "${RELEASE_RUBY_NO_RUBYGEMS_RESULT}")"
          disabled_package_target_keys=()
          [[ "${PUBLISH_PYTHON_PYPI}" == "true" ]] || disabled_package_target_keys+=("python-pypi")
          [[ "${PUBLISH_NODE_GPR}" == "true" ]] || disabled_package_target_keys+=("node-gpr")
          [[ "${PUBLISH_NODE_NPMJS}" == "true" ]] || disabled_package_target_keys+=("node-npmjs")
          [[ "${PUBLISH_RUBY_GPR}" == "true" ]] || disabled_package_target_keys+=("ruby-gpr")
          [[ "${PUBLISH_RUBY_RUBYGEMS}" == "true" ]] || disabled_package_target_keys+=("ruby-rubygems")
          disabled_package_target_keys_csv="$(IFS=,; printf '%s' "${disabled_package_target_keys[*]}")"

          uv run python eng/scripts/workflow_release_control.py report \
            --repository "$REPOSITORY" \
            --workflow "$WORKFLOW" \
            --run-id "$RUN_ID" \
            --attempt "$RUN_ATTEMPT" \
            --head-sha "$HEAD_SHA" \
            --profile "$PROFILE" \
            --dry-run "$DRY_RUN" \
            --validation-build "$VALIDATION_BUILD" \
            --canary-override-non-public-ref "$CANARY_OVERRIDE_NON_PUBLIC_REF" \
            --out "$REPORT_PATH" \
            --plan "$plan_path" \
            --execution-sets "$execution_sets_path" \
            --plan-artifact-name "$PLAN_ARTIFACT_NAME" \
            --execution-sets-artifact-name "$EXECUTION_SETS_ARTIFACT_NAME" \
            --entry-publish-handoff-artifact-name "$ENTRY_PUBLISH_HANDOFF_ARTIFACT_NAME" \
            --diagnostics "$diagnostics_path" \
            --artifacts-root "$ARTIFACTS_ROOT" \
            --authorize-conclusion "$AUTHORIZE_CONCLUSION" \
            --validate-conclusion "$VALIDATE_CONCLUSION" \
            --metadata-conclusion "$METADATA_CONCLUSION" \
            --plan-conclusion "$PLAN_CONCLUSION" \
            --build-conclusion "$build_conclusion" \
            --tag-conclusion "$TAG_CONCLUSION" \
            --release-completed-check-conclusion "$RELEASE_COMPLETED_CHECK_CONCLUSION" \
            --disabled-package-target-keys "$disabled_package_target_keys_csv" \
            --publish-conclusion "$publish_conclusion"

      - name: Upload release report
        uses: actions/upload-artifact@v7
        with:
          name: release-report-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: .three-workflow-release/release-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Surface release-completed failures
        if: ${{ always() && steps.release_completed_check.outcome != 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          exit 1
