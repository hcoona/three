name: Official Release

on:
  push:
    tags:
      - "release/*/v*"
  workflow_dispatch:
    inputs:
      project:
        description: "Workspace package name (unscoped; Python: pyproject.toml project.name; Node: package.json name; must match <project> in release/<project>/v* tag)"
        required: true
        type: string
      version:
        description: "Python: PEP 440 subset (leading v allowed; will be stripped; epochs like '1!1.0' are intentionally not supported). Node: SemVer 2.0.0 (no leading v). Ruby: MAJOR.MINOR.PATCH[.suffix...] (no '-' or '+'; suffix segments are dot-separated [0-9A-Za-z]+ and must include at least one letter)."
        required: true
        type: string
      target:
        description: "Target commit for release/tag when manually triggered (defaults to current commit)"
        required: false
        type: string
        default: ""
      force_update_tag:
        description: "Allow force-updating the release tag if it already exists and points to a different commit. If false, existing tags will not be moved."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: official-${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.project || 'push' }}
  cancel-in-progress: false

jobs:
  orchestrate:
    name: Orchestrate official release
    uses: ./.github/workflows/release-orchestrate.yml
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      source: ${{ github.event_name == 'push' && 'tag' || 'manual' }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # source=tag
      ref_name: ${{ github.ref_name }}
      ref: ${{ github.ref }}

      # source=manual
      project: ${{ inputs.project }}
      version: ${{ inputs.version }}
      target: ${{ inputs.target }}
      force_update_tag: ${{ inputs.force_update_tag }}

      channel: official
      artifact_prefix: official
      github_release_prerelease: false

      enforce_prerelease_only: false
      enforce_non_clobber: false

      publish_python_pypi: true
      publish_node_gpr: true
      publish_node_npmjs: true
      publish_ruby_gpr: true
      publish_ruby_rubygems: true

      enable_attestation: true
      node_pack_mode: both
