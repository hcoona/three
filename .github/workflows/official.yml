name: Official Release

on:
  push:
    tags:
      - "release/*/v*"
  workflow_dispatch:
    inputs:
      project:
        description: "Workspace package name (unscoped; Python: pyproject.toml project.name; Node: package.json name; must match <project> in release/<project>/v* tag)"
        required: true
        type: string
      version:
        description: "Python: PEP 440 subset (leading v allowed; will be stripped; epochs like '1!1.0' are intentionally not supported). Others: SemVer 2.0.0 (no leading v)."
        required: true
        type: string
      target:
        description: "Target commit for release/tag when manually triggered (defaults to current commit)"
        required: false
        type: string
        default: ""
      force_update_tag:
        description: "Allow force-updating the release tag if it already exists and points to a different commit. If false, existing tags will not be moved."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: official-${{ github.workflow }}-${{ github.ref_name || github.run_id }}-${{ github.event.inputs.project || 'push' }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '24'
  PNPM_VERSION: '10'

jobs:
  versions:
    name: Export tool versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      python_version: ${{ steps.versions.outputs.python_version }}
      node_version: ${{ steps.versions.outputs.node_version }}
      pnpm_version: ${{ steps.versions.outputs.pnpm_version }}
    steps:
      - name: Export versions
        id: versions
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "python_version=${PYTHON_VERSION}"
            echo "node_version=${NODE_VERSION}"
            echo "pnpm_version=${PNPM_VERSION}"
          } >> "${GITHUB_OUTPUT}"

  resolve:
    name: Resolve release inputs
    uses: ./.github/workflows/release-resolve.yml
    needs: versions
    permissions:
      contents: read
    with:
      source: ${{ github.event_name == 'push' && 'tag' || 'manual' }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      python_version: ${{ needs.versions.outputs.python_version }}

      # source=tag
      ref_name: ${{ github.ref_name }}
      ref: ${{ github.ref }}

      # source=manual
      project: ${{ github.event.inputs.project }}
      version: ${{ github.event.inputs.version }}
      target: ${{ github.event.inputs.target }}
      force_update_tag: ${{ github.event.inputs.force_update_tag == 'true' || github.event.inputs.force_update_tag == true }}

  prepare-release-notes:
    name: Prepare release notes
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/release-prepare-release-notes.yml
    with:
      target: ${{ needs.resolve.outputs.target }}
      has_changelog: ${{ needs.resolve.outputs.has_changelog == 'true' }}
      changelog_path: ${{ needs.resolve.outputs.changelog }}
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      project: ${{ needs.resolve.outputs.project }}
      version: ${{ needs.resolve.outputs.version }}
      run_url: ${{ needs.resolve.outputs.run_url }}
      artifact_name: official-${{ needs.resolve.outputs.project }}-release-notes

  build-python:
    name: Build Python package
    needs:
      - versions
      - resolve
    if: needs.resolve.outputs.project_kind == 'python'
    uses: ./.github/workflows/release-build-python.yml
    permissions:
      contents: read
    with:
      target: ${{ needs.resolve.outputs.target }}
      package_dir: ${{ needs.resolve.outputs.package_dir }}
      version: ${{ needs.resolve.outputs.version }}
      python_version: ${{ needs.versions.outputs.python_version }}
      artifact_name: official-${{ needs.resolve.outputs.project }}-dist

  publish-python:
    name: Publish Python package
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build-python
    if: needs.resolve.outputs.project_kind == 'python'
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: official-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1
        with:
          packages-dir: ${{ github.workspace }}/out/

  attest-python:
    name: Attest release assets (Python)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build-python
    if: needs.resolve.outputs.project_kind == 'python'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: official-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Attest build provenance (GitHub)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ github.workspace }}/out/*

  release-python:
    name: Create GitHub release (Python)
    needs:
      - resolve
      - prepare-release-notes
      - build-python
      - publish-python
      - attest-python
    if: needs.resolve.outputs.project_kind == 'python'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-create-github-release.yml
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target: ${{ needs.resolve.outputs.target }}
      release_title: ${{ needs.resolve.outputs.release_title }}
      prerelease: false
      force_update_tag: ${{ needs.resolve.outputs.force_update_tag == 'true' }}
      notes_artifact_name: official-${{ needs.resolve.outputs.project }}-release-notes
      dist_artifact_name: official-${{ needs.resolve.outputs.project }}-dist

  pack-node:
    name: Pack Node tarball(s)
    needs:
      - versions
      - resolve
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true'
    uses: ./.github/workflows/release-build-node-pack.yml
    permissions:
      contents: read
    with:
      target: ${{ needs.resolve.outputs.target }}
      project: ${{ needs.resolve.outputs.project }}
      package_dir: ${{ needs.resolve.outputs.package_dir }}
      version: ${{ needs.resolve.outputs.version }}
      python_version: ${{ needs.versions.outputs.python_version }}
      node_version: ${{ needs.versions.outputs.node_version }}
      pnpm_version: ${{ needs.versions.outputs.pnpm_version }}
      artifact_name: official-${{ needs.resolve.outputs.project }}-dist
      pack_mode: both

  publish-node:
    name: Publish Node package (npm & GPR)
    runs-on: ubuntu-latest
    needs:
      - versions
      - resolve
      - pack-node
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true'
    environment: npmjs
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.target }}

      - name: Setup Node.js (npmjs)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.versions.outputs.node_version }}
          registry-url: https://registry.npmjs.org

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: official-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Resolve npm scope (GPR)
        id: npm_scope
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          scope="@${OWNER,,}"
          echo "scope=${scope}" >> "${GITHUB_OUTPUT}"

      - name: Create .npmrc for GitHub Packages (GPR)
        id: gpr_npmrc
        shell: bash
        env:
          SCOPE: ${{ steps.npm_scope.outputs.scope }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          npmrc="${RUNNER_TEMP}/npmrc-gpr"
          {
            echo "registry=https://registry.npmjs.org"
            echo "${SCOPE}:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
            echo "always-auth=true"
          } > "${npmrc}"

          echo "path=${npmrc}" >> "${GITHUB_OUTPUT}"

      - name: Publish to GitHub Packages
        shell: bash
        env:
          DIST_TAG: ${{ needs.pack-node.outputs.dist_tag }}
          NPM_CONFIG_USERCONFIG: ${{ steps.gpr_npmrc.outputs.path }}
        run: |
          set -Eeuo pipefail
          npm publish "${GITHUB_WORKSPACE}/out/gpr.tgz" --registry https://npm.pkg.github.com --tag "${DIST_TAG}"

      - name: Note about npm Trusted Publishers (OIDC)
        shell: bash
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
        run: |
          set -Eeuo pipefail
          echo "This workflow is intended to publish '${PROJECT}' to npmjs.org using npm Trusted Publishing (OIDC)."
          echo "No npm token is provided by this workflow; publishing will fail unless a Trusted Publisher is configured on npmjs.com for:"
          echo "  - Repository: ${GITHUB_REPOSITORY}"
          echo "  - Workflow filename: official.yml"
          echo "  - Environment (if configured on npm): npmjs"
          echo "See: https://docs.npmjs.com/trusted-publishers"

      - name: Verify package is not private
        shell: bash
        env:
          PACKAGE_DIR: ${{ needs.resolve.outputs.package_dir }}
        run: |
          set -Eeuo pipefail
          pushd "${PACKAGE_DIR}" >/dev/null
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.private) {
            console.error('Error: package.json has "private": true; refusing to publish to the public npm registry.');
            process.exit(1);
          }
          NODE
          popd >/dev/null

      - name: Publish to npm registry
        shell: bash
        env:
          DIST_TAG: ${{ needs.pack-node.outputs.dist_tag }}
        run: |
          set -Eeuo pipefail
          npm publish "${GITHUB_WORKSPACE}/out/npmjs.tgz" --registry https://registry.npmjs.org --tag "${DIST_TAG}" --access public

  attest-node:
    name: Attest release assets (Node)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - pack-node
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: official-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Attest build provenance (GitHub)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ github.workspace }}/out/*

  release-node:
    name: Create GitHub release (Node)
    needs:
      - resolve
      - prepare-release-notes
      - pack-node
      - publish-node
      - attest-node
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt != 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-create-github-release.yml
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target: ${{ needs.resolve.outputs.target }}
      release_title: ${{ needs.resolve.outputs.release_title }}
      prerelease: false
      force_update_tag: ${{ needs.resolve.outputs.force_update_tag == 'true' }}
      notes_artifact_name: official-${{ needs.resolve.outputs.project }}-release-notes
      dist_artifact_name: official-${{ needs.resolve.outputs.project }}-dist

  build-wxt:
    name: Build package (Node/WXT)
    needs:
      - versions
      - resolve
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt == 'true'
    uses: ./.github/workflows/release-build-wxt.yml
    permissions:
      contents: read
    with:
      target: ${{ needs.resolve.outputs.target }}
      project: ${{ needs.resolve.outputs.project }}
      package_dir: ${{ needs.resolve.outputs.package_dir }}
      version: ${{ needs.resolve.outputs.version }}
      node_version: ${{ needs.versions.outputs.node_version }}
      pnpm_version: ${{ needs.versions.outputs.pnpm_version }}
      artifact_name: official-${{ needs.resolve.outputs.project }}-dist

  attest-wxt:
    name: Attest release assets (WXT)
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build-wxt
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt == 'true'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: official-${{ needs.resolve.outputs.project }}-dist
          path: ${{ github.workspace }}/out

      - name: Attest build provenance (GitHub)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ github.workspace }}/out/*

  release-wxt:
    name: Create GitHub release (Node/WXT)
    needs:
      - resolve
      - prepare-release-notes
      - build-wxt
      - attest-wxt
    if: needs.resolve.outputs.project_kind == 'node' && needs.resolve.outputs.is_wxt == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-create-github-release.yml
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target: ${{ needs.resolve.outputs.target }}
      release_title: ${{ needs.resolve.outputs.release_title }}
      prerelease: false
      force_update_tag: ${{ needs.resolve.outputs.force_update_tag == 'true' }}
      notes_artifact_name: official-${{ needs.resolve.outputs.project }}-release-notes
      dist_artifact_name: official-${{ needs.resolve.outputs.project }}-dist
