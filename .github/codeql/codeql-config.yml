name: three-codeql-config

queries:
  - uses: security-extended

paths-ignore:
  - '**/bin'
  - '**/obj'
  - '**/node_modules'
  - '**/dist'
  - '**/build'
  - '**/.cache'
  - '**/.venv'
  - '**/__pycache__'
  - '**/.pytest_cache'
  - '**/coverage'
