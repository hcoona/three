[build-system]
requires = [
    "hatchling>=1.24",
    "nbgv-python",
]
build-backend = "hatchling.build"

[project]
name = "nbgv-hatch-demo"
description = "Sample project that exercises the nbgv-python Hatch version source."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Sample Maintainer" },
]
keywords = ["nbgv", "hatch", "versioning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]
dynamic = ["version"]
dependencies = ["nbgv-python"]

[dependency-groups]
dev = [
    "hatch>=1.9.1",
]

[tool.hatch.version]
source = "nbgv"

[tool.hatch.version.nbgv]
version-field = "SemVer2"

[tool.hatch.version.nbgv.template-fields.version-tuple]
double-quote = true

[tool.hatch.version.nbgv.write]
file = "src/nbgv_hatch_demo/_version.py"
template = '''"""Auto-generated by nbgv-python using Hatch."""

from __future__ import annotations

from nbgv_python.versioning import normalize_version_field as _nbgv_normalize

RAW_VERSION = "{version}"
SIMPLE_VERSION = "{SimpleVersion}"
SEMVER2 = "{SemVer2}"
GIT_COMMIT = "{GitCommitId}"
PEP440_VERSION = "{normalized_version}"
VERSION_TUPLE = {version_tuple}

__all__ = [
    "RAW_VERSION",
    "SIMPLE_VERSION",
    "SEMVER2",
    "GIT_COMMIT",
    "PEP440_VERSION",
    "VERSION_TUPLE",
    "__version__",
    "pep440_version",
]


def pep440_version(value: str) -> str:
    """Normalize arbitrary version strings to a PEP 440 representation."""

    return _nbgv_normalize(value, field="template")


__version__ = PEP440_VERSION
'''

[tool.hatch.build]
artifacts = ["src/nbgv_hatch_demo/_version.py"]

[tool.uv.sources]
nbgv-python = { workspace = true }
