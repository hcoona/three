min_version = "2026.7.17"

monorepo_root = true

[settings]
experimental = true

[monorepo]
config_roots = [
  "src/private/app/factorio-cycle-calculator",
  "src/public/lib/hexo-renderer-asciidoc",
]

[tools]
# Runtimes
"core:dotnet" = "10"
go = "latest"
java = "lts"
node = "24"
pkl = "0.32.1"
powershell = "7"
python = "3.14"
ruby = "4.0.6"

# Package Managers
pnpm = "11.22.0"
uv = "latest"

# Git Commit Hook Manager
hk = "1.56.1"

#
# Linters and Formatters
#

# General
"go:github.com/B1NARY-GR0UP/nwa" = "latest"
"go:github.com/editorconfig-checker/editorconfig-checker/v3/cmd/editorconfig-checker" = "latest"
taplo = "latest"
typos = "latest"

# Pipeline
"go:github.com/rhysd/actionlint/cmd/actionlint" = "latest"

# Bash
"github:koalaman/shellcheck".version = "latest"
"github:koalaman/shellcheck".platforms.linux-arm64 = { asset_pattern = "shellcheck-*.linux.aarch64.tar.xz" }
"github:koalaman/shellcheck".platforms.linux-x64 = { asset_pattern = "shellcheck-*.linux.x86_64.tar.xz" }
"github:koalaman/shellcheck".platforms.macos-arm64 = { asset_pattern = "shellcheck-*.darwin.aarch64.tar.xz" }
"github:koalaman/shellcheck".platforms.macos-x64 = { asset_pattern = "shellcheck-*.darwin.x86_64.tar.xz" }
"github:koalaman/shellcheck".platforms.windows-x64 = { asset_pattern = "shellcheck-*.zip" }
"go:mvdan.cc/sh/v3/cmd/shfmt" = "latest"

# Dockerfile
"github:hadolint/hadolint" = "latest"

# .env
dotenv-linter = "latest"

#
# Utilities
#
fd = "latest"
ripgrep = "latest"
github-cli = "latest"
"github:microsoft/apm" = "v0.28.0"
"github:alibaba/open-code-review" = { version = "v1.11.0", bin = "ocr" }

#
# Environment Variables
#

[env]

HK_PROFILE = "small,medium"

#
# Bootstrap
#

[tasks.bootstrap]
description = "Bootstrap the external tools"
depends = ["bootstrap:pwsh", "bootstrap:node", "bootstrap:dotnet-tools"]

[tasks."bootstrap:pwsh"]
description = "Bootstrap the PowerShell modules"
run = '''
pwsh -NoLogo -Command "Install-Module -Name 'PSScriptAnalyzer' -Force -Scope CurrentUser"
'''

[tasks."bootstrap:node"]
description = "Bootstrap the Node.js packages"
depends = ["prepare:static-reference-authorities"]
run = "pnpm -r rebuild --pending"

[tasks."bootstrap:dotnet-tools"]
description = "Bootstrap the .NET tools"
run = "dotnet tool restore"

[tasks."prepare:static-reference-authorities"]
description = "Prepare bounded static-reference authority runtimes"
run = "uv run --isolated --frozen --python 3.13 --package three-workflow-delivery-v3 python -B eng/scripts/workflow_delivery_v3_prepare_static_reference.py"

[tasks."check:static-reference-worktree"]
description = "Check bounded static references in the explicit worktree source"
depends = ["prepare:static-reference-authorities"]
run = "uv run --python 3.13 --package three-workflow-delivery-v3 python eng/scripts/workflow_delivery_v3_static_reference.py --repository-root . --source-kind worktree"

#
# Tasks
#

[tasks.slngen]
description = "Generate .NET solution file for local development"
run = 'dotnet slngen --nologo --ignoreMainProject --launch false --loadprojects false --folders true --collapsefolders true -o main.sln'

[tasks.update-global-json]
description = "Update global.json from global.pkl and mise.lock"
run = 'pkl eval -f json global.pkl -o global.json'
sources = ["global.pkl", "mise.lock"]
outputs = ["global.json"]

[tasks.update-pnpm-lockfiles]
description = "Refresh tracked pnpm lockfiles"
run = '''
pnpm install --lockfile-only --no-frozen-lockfile
pnpm --dir src/public/lib/hexo-renderer-asciidoc/examples/hexo-site install --lockfile-only --no-frozen-lockfile
pnpm exec -- prettier --write -- pnpm-lock.yaml src/public/lib/hexo-renderer-asciidoc/examples/hexo-site/pnpm-lock.yaml
'''

[tasks.update-uv-lock]
description = "Refresh root uv lockfile"
run = 'uv lock'

[tasks.scan-restoration-plugin-check]
description = "Validate the scan restoration Copilot CLI plugin"
run = "python -B src/private/lib/scan-restoration/scripts/validate_package.py"

[tasks.scan-restoration-plugin-install]
description = "Validate and deploy the scan restoration Copilot CLI plugin"
depends = ["scan-restoration-plugin-check"]
run = "apm install"

[tasks.scan-restoration-plugin-install-frozen]
description = "Validate and reproduce the locked scan restoration plugin deployment"
depends = ["scan-restoration-plugin-check"]
run = "apm install --frozen"

[tasks.scholarly-publication-plugin-source-check]
description = "Validate canonical scholarly publication plugin source"
shell = "pwsh -NoLogo -Command"
run = "uv run --script src/private/lib/scholarly-publication/scripts/validate_package.py --scope canonical"

[tasks.scholarly-publication-plugin-runtime-check]
description = "Validate deployed scholarly publication runtime parity"
depends = ["scholarly-publication-plugin-source-check"]
shell = "pwsh -NoLogo -Command"
run = "uv run --script src/private/lib/scholarly-publication/scripts/validate_package.py --scope runtime"

[tasks.scholarly-publication-plugin-spec]
description = "Validate scholarly publication skills with the Agent Skills reference library"
depends = ["scholarly-publication-plugin-source-check"]
shell = "pwsh -NoLogo -Command"
run = '''
$source = "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
$skills = @(
  "src/private/lib/scholarly-publication/skills/scholarly-pdf-reconstruction",
  "src/private/lib/scholarly-publication/skills/scholarly-print-assembly",
  "src/private/lib/scholarly-publication/skills/scholarly-render-qa"
)
foreach ($skill in $skills) {
  uvx --from $source skills-ref validate $skill
  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
}
'''

[tasks.scholarly-publication-plugin-test]
description = "Run the scholarly publication plugin tests"
depends = ["scholarly-publication-plugin-source-check"]
shell = "pwsh -NoLogo -Command"
run = '''
uv run --script src/private/lib/scholarly-publication/tests/test_validate_package.py
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
uv run --script src/private/lib/scholarly-publication/tests/test_reconstruct_pdf.py
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
uv run --script src/private/lib/scholarly-publication/tests/test_assemble_print.py
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
uv run --script src/private/lib/scholarly-publication/tests/test_audit_publication.py
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
'''

[tasks.scholarly-publication-plugin-lint]
description = "Lint and type-check the scholarly publication plugin"
depends = ["scholarly-publication-plugin-source-check"]
shell = "pwsh -NoLogo -Command"
run = '''
uvx ruff==0.16.5 check src/private/lib/scholarly-publication
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
uvx ruff==0.16.5 format --check src/private/lib/scholarly-publication
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
uv run --isolated --no-project --with defusedxml==0.7.1 --with pymupdf==1.26.6 --with fonttools==4.60.1 --with html5lib==1.1 --with playwright==1.56.0 --with jsonschema==4.25.1 --with PyYAML==6.0.2 --with tinycss2==1.4.0 --with pyrefly==1.0.0 pyrefly check src/private/lib/scholarly-publication
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
'''

[tasks.scholarly-publication-plugin-ci]
description = "Run the scholarly publication CI validation suite"
depends = [
  "scholarly-publication-plugin-runtime-check",
  "scholarly-publication-plugin-spec",
  "scholarly-publication-plugin-test",
  "scholarly-publication-plugin-lint",
]

[tasks.scholarly-publication-plugin-install]
description = "Validate and deploy the scholarly publication Copilot CLI plugin"
depends = ["scholarly-publication-plugin-source-check"]
shell = "pwsh -NoLogo -Command"
run = '''
apm install
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
uv run --script src/private/lib/scholarly-publication/scripts/validate_package.py --scope runtime
'''

[tasks.scholarly-publication-plugin-install-frozen]
description = "Validate and reproduce the locked scholarly publication plugin deployment"
depends = ["scholarly-publication-plugin-source-check"]
shell = "pwsh -NoLogo -Command"
run = '''
apm install --frozen
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
uv run --script src/private/lib/scholarly-publication/scripts/validate_package.py --scope runtime
'''

[tasks.translation-agent-plugin-check]
description = "Validate the enterprise translation team Copilot CLI plugin"
run = "python -B src/private/lib/enterprise-translation-team/scripts/validate_package.py"

[tasks.translation-agent-plugin-eval-dry-run]
description = "Prepare a dry-run eval workspace for the enterprise translation team plugin"
run = "python -B src/private/lib/enterprise-translation-team/skills/enterprise-translation-team/scripts/run_copilot_evals.py --mode dry-run"
